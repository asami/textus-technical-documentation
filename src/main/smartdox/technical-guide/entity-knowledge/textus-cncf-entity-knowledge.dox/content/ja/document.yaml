                "id": "textus-cncf-entity-knowledge-scope-paragraph-1",
                "kind": "paragraph",
                "text": "通常の開発では、CMLでEntityを定義し、Cozyによる生成とTextus／CNCFの実行経路を利用します。モデルとインスタンスのMCP公開、MCP・APIを通じたインスタンス検索は基本機能として提供され、開発者が個別の公開・検索コードを書く必要はありません。業務上の属性・関係・規則と参照権限をモデルや設定へ記述し、標準機能を利用します。",
                "coreRefs": {
