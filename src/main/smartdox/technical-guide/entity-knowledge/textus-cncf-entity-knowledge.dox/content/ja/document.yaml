            "sections": []
          },
          {
            "id": "textus-cncf-entity-knowledge-access-section",
            "heading": "MCPとAPIで参照権限と文脈を保持する",
            "coreRefs": {
              "steps": [
                "textus-cncf-entity-knowledge-access"
              ],
              "claims": [
                "textus-cncf-entity-knowledge-access-claim-1",
                "textus-cncf-entity-knowledge-access-claim-2"
              ],
              "nodes": [
                "textus-cncf-entity-knowledge-access-node-1",
                "textus-cncf-entity-knowledge-access-node-2"
              ],
              "relations": [
                "textus-cncf-entity-knowledge-access-relation-1"
              ],
              "flows": [
                "textus-cncf-entity-knowledge-access-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-entity-knowledge-access-paragraph-1",
                "kind": "paragraph",
                "text": "MCPとAPIのどちらから検索する場合も、要求主体が参照できる範囲でインスタンスを提供します。結果の対象・出典・適用範囲・版や時点を保持し、知識の複製や検索索引にも参照条件を対応付けます。デフォルトで検索機能が提供されることは、すべての情報が無条件に公開されることを意味しません。",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-access"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-access-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-access-node-1",
                    "textus-cncf-entity-knowledge-access-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-access-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-access-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-entity-knowledge-access-paragraph-2",
                "kind": "paragraph",
                "text": "知識の取得は業務状態を変更する権限にはなりません。AIが変更を提案した場合は、公開Operationと通常の認可・更新経路へ接続します。知識提供の文脈を明確にする仕組みと実行時の制御を組み合わせることで、判断の支援と不適切な操作の抑制を分担できます。",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-access"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-access-claim-2"
                  ],
