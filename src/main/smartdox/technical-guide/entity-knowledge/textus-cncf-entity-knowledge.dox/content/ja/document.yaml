                "text": "モデルの定義と実行基盤を組み合わせることで、EntityのモデルとインスタンスをMCPで公開し、インスタンスをMCP・APIの両経路から検索できます。RDFとembeddingによる検索を標準機能として利用できるため、AIとアプリケーションのために検索処理を個別実装する負担が減ります。モデルの意味と参照条件を検索結果へ引き継ぐことが、適切な知識利用を支えます。",
