                "id": "textus-cncf-entity-knowledge-scope-paragraph-2",
                "kind": "paragraph",
                "text": "「BoKからドメイン・モデルを設計する」ガイドが設計の根拠を扱い、本書はそのモデルに基づく情報の利用を扱います。Knowledge Lake、Knowledge Workbench、SIE、BoKなど個別部品の設定・用途は、それぞれのガイドで具体化します。最初は一つの対象と操作で、出典と識別、更新、権限、検索結果の対応を確かめます。",
