            "blocks": [
              {
                "id": "textus-cncf-entity-knowledge-information-paragraph-1",
                "kind": "paragraph",
                "text": "CNCFのInformationモデルはsrc/main/cozy/information.cmlを正本とし、Cozyを含む生成経路から得られるEntity・Value・入出力型とcodecを利用する契約です。InformationSpaceは生成されたInformationを使ってライフサイクルと永続化を扱います。別の手書きInformationモデルを作って意味を重複管理しない構成です。",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-information"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-information-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-information-node-1",
                    "textus-cncf-entity-knowledge-information-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-information-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-information-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-entity-knowledge-information-paragraph-2",
                "kind": "paragraph",
                "text": "業務Entityのインスタンスを知識として扱う際は、モデルで定めた属性・関係と、対象の識別・出典を対応付けます。標準の公開・検索はモデルと実行基盤の機能を通して提供されるため、EntityごとにMCP用とAPI用の検索処理を別々に実装する必要はありません。Informationの生成契約は、情報を扱う共通の型と実行処理を支えます。",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-information"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-information-claim-2"
                  ],
