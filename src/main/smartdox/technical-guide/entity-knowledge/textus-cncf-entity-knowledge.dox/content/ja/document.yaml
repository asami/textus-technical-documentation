          {
            "id": "textus-cncf-entity-knowledge-search-routes-section",
            "heading": "MCPとAPIからコードを書かずに検索する",
            "coreRefs": {
              "steps": [
                "textus-cncf-entity-knowledge-search-routes"
              ],
              "claims": [
                "textus-cncf-entity-knowledge-search-routes-claim-1",
                "textus-cncf-entity-knowledge-search-routes-claim-2",
                "textus-cncf-entity-knowledge-search-routes-claim-3"
              ],
              "nodes": [
                "textus-cncf-entity-knowledge-search-routes-node-1",
                "textus-cncf-entity-knowledge-search-routes-node-2"
              ],
              "relations": [
                "textus-cncf-entity-knowledge-search-routes-relation-1"
              ],
              "flows": [
                "textus-cncf-entity-knowledge-search-routes-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-entity-knowledge-search-routes-paragraph-1",
                "kind": "paragraph",
                "text": "インスタンス検索にはMCPとAPIの二つの利用経路があります。MCPはAI・AIエージェントからの利用を、APIはUI・アプリケーション・外部システムからの利用を支えます。どちらも標準機能としてデフォルトで提供され、アプリケーションごとに検索処理をコーディングする必要はありません。",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-search-routes"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-search-routes-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-search-routes-node-1",
                    "textus-cncf-entity-knowledge-search-routes-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-search-routes-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-search-routes-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-entity-knowledge-search-routes-paragraph-2",
                "kind": "paragraph",
                "text": "MCPとAPIは検索への接点であり、RDFとembeddingは背後で用いる検索の仕組みです。MCP経由でもAPI経由でも、モデルに基づく標準の検索機能を利用します。RDFをAPI専用、embeddingをMCP専用とするような対応ではありません。",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-search-routes"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-search-routes-claim-2"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-search-routes-node-1",
                    "textus-cncf-entity-knowledge-search-routes-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-search-routes-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-search-routes-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-entity-knowledge-search-routes-paragraph-3",
                "kind": "paragraph",
                "text": "たとえば、AIはMCPで書籍モデルの属性や関係を参照し、条件や意味の近さから書籍のインスタンスを検索できます。画面や外部システムはAPIから同じ検索機能を利用します。モデルに基づく検索を共用することで、利用経路ごとに業務の意味を定義し直す負担を減らします。",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-search-routes"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-search-routes-claim-3"
