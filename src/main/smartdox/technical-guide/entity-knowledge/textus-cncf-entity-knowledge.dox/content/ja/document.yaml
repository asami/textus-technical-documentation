        "blocks": [
          {
            "id": "textus-cncf-entity-knowledge-paragraph-1",
            "kind": "paragraph",
            "text": "Entityのモデルとインスタンスを知識としてMCPで公開し、インスタンスをRDFやembeddingによる検索対象にします。インスタンス検索はMCPとAPIの両経路から、個別の検索コードを書かずにデフォルトで利用できます。本書は、モデル・生成・実行基盤がこの機能を提供する仕組みと、意味・出典・参照権限の対応を説明します。",
            "coreRefs": {
