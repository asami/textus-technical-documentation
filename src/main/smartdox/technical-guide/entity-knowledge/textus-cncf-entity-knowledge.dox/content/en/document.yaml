          {
            "id": "textus-cncf-entity-knowledge-search-routes-section",
            "heading": "Searching through MCP and APIs without Custom Code",
            "coreRefs": {
              "steps": [
                "textus-cncf-entity-knowledge-search-routes"
              ],
              "claims": [
                "textus-cncf-entity-knowledge-search-routes-claim-1",
                "textus-cncf-entity-knowledge-search-routes-claim-2",
                "textus-cncf-entity-knowledge-search-routes-claim-3"
              ],
              "nodes": [
                "textus-cncf-entity-knowledge-search-routes-node-1",
                "textus-cncf-entity-knowledge-search-routes-node-2"
              ],
              "relations": [
                "textus-cncf-entity-knowledge-search-routes-relation-1"
              ],
              "flows": [
                "textus-cncf-entity-knowledge-search-routes-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-entity-knowledge-search-routes-paragraph-1",
                "kind": "paragraph",
                "text": "Instance search has two access routes: MCP and APIs. MCP supports AI and agent consumers; APIs support UIs, applications and external systems. Both are provided by default as standard capabilities without requiring application-specific search code.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-search-routes"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-search-routes-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-search-routes-node-1",
                    "textus-cncf-entity-knowledge-search-routes-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-search-routes-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-search-routes-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-entity-knowledge-search-routes-paragraph-2",
                "kind": "paragraph",
                "text": "MCP and APIs are access interfaces, whereas RDF and embeddings are underlying search mechanisms. Both routes use standard model-based search capabilities. RDF is not reserved for APIs, nor are embeddings reserved for MCP.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-search-routes"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-search-routes-claim-2"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-search-routes-node-1",
                    "textus-cncf-entity-knowledge-search-routes-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-search-routes-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-search-routes-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-entity-knowledge-search-routes-paragraph-3",
                "kind": "paragraph",
                "text": "For example, AI can inspect a book model’s attributes and relationships through MCP, then search book instances by conditions or semantic similarity. Screens and external systems use the same search capabilities through APIs. Sharing model-based search reduces repeated definitions of business meaning for each access route.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-search-routes"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-search-routes-claim-3"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-search-routes-node-1",
                    "textus-cncf-entity-knowledge-search-routes-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-search-routes-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-search-routes-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "textus-cncf-entity-knowledge-access-section",
            "heading": "Preserving Access Conditions and Context through MCP and APIs",
            "coreRefs": {
              "steps": [
                "textus-cncf-entity-knowledge-access"
              ],
              "claims": [
                "textus-cncf-entity-knowledge-access-claim-1",
                "textus-cncf-entity-knowledge-access-claim-2"
              ],
              "nodes": [
                "textus-cncf-entity-knowledge-access-node-1",
                "textus-cncf-entity-knowledge-access-node-2"
              ],
              "relations": [
                "textus-cncf-entity-knowledge-access-relation-1"
              ],
              "flows": [
                "textus-cncf-entity-knowledge-access-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-entity-knowledge-access-paragraph-1",
                "kind": "paragraph",
                "text": "Both MCP and API searches return instances within the requesting principal’s permitted scope. Results preserve subjects, provenance, applicability and revisions or times, with access conditions carried into knowledge copies and indexes. Providing search by default does not make all information unconditionally public.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-access"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-access-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-access-node-1",
                    "textus-cncf-entity-knowledge-access-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-access-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-access-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-entity-knowledge-access-paragraph-2",
                "kind": "paragraph",
                "text": "Retrieving knowledge does not grant authority to mutate business state. Proposed changes use public Operations and normal authorization and mutation paths. Contextual knowledge delivery and runtime controls jointly support decisions while constraining inappropriate operations.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-access"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-access-claim-2"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-access-node-1",
                    "textus-cncf-entity-knowledge-access-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-access-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-access-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "textus-cncf-entity-knowledge-operation-section",
            "heading": "Relating Changes and Inconsistencies to Their Sources",
            "coreRefs": {
              "steps": [
                "textus-cncf-entity-knowledge-operation"
              ],
              "claims": [
                "textus-cncf-entity-knowledge-operation-claim-1",
                "textus-cncf-entity-knowledge-operation-claim-2"
              ],
              "nodes": [
                "textus-cncf-entity-knowledge-operation-node-1",
                "textus-cncf-entity-knowledge-operation-node-2"
              ],
              "relations": [
                "textus-cncf-entity-knowledge-operation-relation-1"
              ],
              "flows": [
                "textus-cncf-entity-knowledge-operation-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-entity-knowledge-operation-paragraph-1",
                "kind": "paragraph",
                "text": "When bibliographic information changes, identify stale versions across the source Entity, Information, knowledge representations and search results. Define re-extraction and projection conditions, behavior on failure, and differences requiring review. Distinguishing model changes from data updates narrows affected mappings and regeneration.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-operation"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-operation-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-operation-node-1",
                    "textus-cncf-entity-knowledge-operation-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-operation-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-operation-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-entity-knowledge-operation-paragraph-2",
                "kind": "paragraph",
                "text": "Checks for broken mappings, revision mismatches and unsupported identity assumptions provide knowledge-harness feedback by locating the affected subjects and relationships. Formal consistency conditions can be checked mechanically; semantic meaning and business validity require source material and human judgment.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-operation"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-operation-claim-2"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-operation-node-1",
                    "textus-cncf-entity-knowledge-operation-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-operation-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-operation-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "textus-cncf-entity-knowledge-scope-section",
            "heading": "Using Standard Exposure and Search from Model Definitions",
            "coreRefs": {
              "steps": [
                "textus-cncf-entity-knowledge-scope"
              ],
              "claims": [
                "textus-cncf-entity-knowledge-scope-claim-1",
                "textus-cncf-entity-knowledge-scope-claim-2"
              ],
              "nodes": [
                "textus-cncf-entity-knowledge-scope-node-1",
                "textus-cncf-entity-knowledge-scope-node-2"
              ],
              "relations": [
                "textus-cncf-entity-knowledge-scope-relation-1"
              ],
              "flows": [
                "textus-cncf-entity-knowledge-scope-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-entity-knowledge-scope-paragraph-1",
                "kind": "paragraph",
                "text": "Normal development defines Entities in CML and uses Cozy generation and Textus/CNCF execution. MCP exposure of models and instances and instance search through MCP and APIs are basic capabilities; developers need not write custom exposure or search code. Business attributes, relationships, rules and access permissions are supplied through models and configuration.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-scope"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-scope-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-scope-node-1",
                    "textus-cncf-entity-knowledge-scope-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-scope-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-scope-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-entity-knowledge-scope-paragraph-2",
                "kind": "paragraph",
                "text": "Designing Domain Models from a BoK covers design foundations; this guide covers using information based on those models. Individual guides specify configuration and uses of Knowledge Lake, Knowledge Workbench, SIE and BoK components. Start with one subject and operation to check source and identity mappings, updates, permissions and search results.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-scope"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-scope-claim-2"
                  ],
                  "nodes": [
