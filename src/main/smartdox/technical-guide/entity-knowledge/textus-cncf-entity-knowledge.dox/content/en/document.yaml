        "sections": [
          {
            "id": "textus-cncf-entity-knowledge-meaning-section",
            "heading": "Distinguishing Model Meaning from Business Records",
            "coreRefs": {
              "steps": [
                "textus-cncf-entity-knowledge-meaning"
              ],
              "claims": [
                "textus-cncf-entity-knowledge-meaning-claim-1",
                "textus-cncf-entity-knowledge-meaning-claim-2"
              ],
              "nodes": [
                "textus-cncf-entity-knowledge-meaning-node-1",
                "textus-cncf-entity-knowledge-meaning-node-2"
              ],
              "relations": [
                "textus-cncf-entity-knowledge-meaning-relation-1"
              ],
              "flows": [
                "textus-cncf-entity-knowledge-meaning-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-entity-knowledge-meaning-paragraph-1",
                "kind": "paragraph",
                "text": "An Entity model defines types, attributes, relationships, operations and rules; its instances represent individual business subjects and states. Both are exposed as knowledge through MCP. Model definitions help AI understand instance-search conditions and the meanings of returned attributes and relationships.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-meaning"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-meaning-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-meaning-node-1",
                    "textus-cncf-entity-knowledge-meaning-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-meaning-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-meaning-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-entity-knowledge-meaning-paragraph-2",
                "kind": "paragraph",
                "text": "A book model definition, bibliographic information for one edition, and the state of a physical copy are different information. Matching names or similar search results do not make them identical; types, identifiers and declared relationships establish their mappings.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-meaning"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-meaning-claim-2"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-meaning-node-1",
                    "textus-cncf-entity-knowledge-meaning-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-meaning-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-meaning-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "textus-cncf-entity-knowledge-information-section",
            "heading": "Connecting to the Generated Information Model",
            "coreRefs": {
              "steps": [
                "textus-cncf-entity-knowledge-information"
              ],
              "claims": [
                "textus-cncf-entity-knowledge-information-claim-1",
                "textus-cncf-entity-knowledge-information-claim-2"
              ],
              "nodes": [
                "textus-cncf-entity-knowledge-information-node-1",
                "textus-cncf-entity-knowledge-information-node-2"
              ],
              "relations": [
                "textus-cncf-entity-knowledge-information-relation-1"
              ],
              "flows": [
                "textus-cncf-entity-knowledge-information-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-entity-knowledge-information-paragraph-1",
                "kind": "paragraph",
                "text": "The CNCF Information contract uses src/main/cozy/information.cml as its canonical source and consumes generated Entity, Value, input/output types and codecs through the generation toolchain including Cozy. InformationSpace orchestrates lifecycle and persistence around that generated Information rather than maintaining a second handwritten model.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-information"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-information-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-information-node-1",
                    "textus-cncf-entity-knowledge-information-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-information-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-information-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-entity-knowledge-information-paragraph-2",
                "kind": "paragraph",
                "text": "Using business Entity instances as knowledge relates modeled attributes and relationships to subject identity and provenance. Standard exposure and search are provided through model and runtime capabilities, so developers do not implement separate MCP and API search handlers for each Entity. The generated Information contract supports shared information types and runtime processing.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-information"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-information-claim-2"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-information-node-1",
                    "textus-cncf-entity-knowledge-information-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-information-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-information-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "textus-cncf-entity-knowledge-representation-section",
            "heading": "Preserving Identity and Relationships in Knowledge Representations",
            "coreRefs": {
              "steps": [
                "textus-cncf-entity-knowledge-representation"
              ],
              "claims": [
                "textus-cncf-entity-knowledge-representation-claim-1",
                "textus-cncf-entity-knowledge-representation-claim-2"
              ],
              "nodes": [
                "textus-cncf-entity-knowledge-representation-node-1",
                "textus-cncf-entity-knowledge-representation-node-2"
              ],
              "relations": [
                "textus-cncf-entity-knowledge-representation-relation-1"
              ],
              "flows": [
                "textus-cncf-entity-knowledge-representation-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-entity-knowledge-representation-paragraph-1",
                "kind": "paragraph",
                "text": "Projection into RDF or another knowledge representation explicitly maps business types and relationships to knowledge concepts and relations. The Information specification distinguishes EntityId, RDF subjects, external identifiers and knowledge-node identities. Explicit mappings add representations without replacing business identity.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-entity-knowledge-representation"
                  ],
                  "claims": [
                    "textus-cncf-entity-knowledge-representation-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-entity-knowledge-representation-node-1",
                    "textus-cncf-entity-knowledge-representation-node-2"
                  ],
                  "relations": [
                    "textus-cncf-entity-knowledge-representation-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-entity-knowledge-representation-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-entity-knowledge-representation-paragraph-2",
                "kind": "paragraph",
                "text": "The search targets are Entity instances. RDF supports searches based on declared relationships and conditions; embeddings support searches based on semantic similarity. Results retain mappings to source instances and model definitions, with provenance and revision or time information. Exposing models through MCP and searching instances have distinct roles.",
                "coreRefs": {
