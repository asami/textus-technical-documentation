            },
            "blocks": [
              {
                "id": "textus-cncf-entity-knowledge-conclusion-paragraph-1",
                "kind": "paragraph",
                "text": "Model definitions and runtime support expose Entity models and instances through MCP and make instances searchable through both MCP and APIs. Standard RDF and embedding search reduces custom implementation for AI and application consumers. Preserving model meaning and access conditions in results supports appropriate knowledge use.",
                "coreRefs": {
