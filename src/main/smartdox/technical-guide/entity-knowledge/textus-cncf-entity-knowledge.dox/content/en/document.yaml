        "blocks": [
          {
            "id": "textus-cncf-entity-knowledge-paragraph-1",
            "kind": "paragraph",
            "text": "Entity models and instances are exposed as knowledge through MCP, while instances can be searched using RDF and embeddings. Instance search is available by default through both MCP and APIs without writing custom search code. This guide explains how models, generation and runtime support provide these capabilities while preserving meaning, provenance and access permissions.",
