                "ov-knowledge-flow"
              ]
            },
            "blocks": [
              {
                "id": "ov-knowledge-paragraph-1",
                "kind": "paragraph",
                "text": "During design, a BoK and project knowledge inform literate models and explicit mappings to CML Entities, types, relationships and rules. Cozy projects models into typed code and runtime definitions consumed by Textus/CNCF. Preserving these mappings carries design decisions into implementation.",
                "coreRefs": {
                  "steps": [
                    "ov-knowledge"
                  ],
                  "claims": [
                    "ov-knowledge-claim-1"
                  ],
                  "nodes": [
                    "ov-knowledge-node-1",
