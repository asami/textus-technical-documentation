          {
            "id": "ov-knowledge-section",
            "heading": "Designing from Knowledge and Providing Business Information as Knowledge",
            "coreRefs": {
              "steps": [
                "ov-knowledge"
              ],
              "claims": [
                "ov-knowledge-claim-1",
