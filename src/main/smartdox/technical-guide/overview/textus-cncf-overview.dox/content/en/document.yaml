                "ov-build-flow"
              ]
            },
            "blocks": [
              {
                "id": "ov-build-paragraph-1",
                "kind": "paragraph",
                "text": "Model concepts and operations become typed APIs and executable definitions. Applications reuse components conforming to those contracts and supplement missing business behavior. Combining model-driven and component-based development clarifies component selection, connection conditions and the scope of new implementation.",
                "coreRefs": {
                  "steps": [
                    "ov-build"
