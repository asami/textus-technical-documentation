            "sections": [
              {
                "id": "ov-generation-section",
                "heading": "Direct Execution, Generation and Supplementary Implementation",
                "coreRefs": {
                  "steps": [
                    "ov-generation"
                  ],
                  "claims": [
                    "ov-generation-claim-1",
                    "ov-generation-claim-2"
                  ],
                  "nodes": [
                    "ov-generation-node-1",
                    "ov-generation-node-2"
                  ],
                  "relations": [
                    "ov-generation-relation-1"
                  ],
                  "flows": [
                    "ov-generation-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-generation-paragraph-1",
                    "kind": "paragraph",
                    "text": "Cozy projects CML definitions into typed APIs and connection code and supplies Workflow and state-machine definitions to Textus/CNCF. The runtime follows these definitions for progression and transitions, reducing repeated procedural implementations of the same behavior. Requirements models such as use cases support correspondence and verification with realizing models.",
                    "coreRefs": {
                      "steps": [
                        "ov-generation"
                      ],
                      "claims": [
                        "ov-generation-claim-1"
                      ],
                      "nodes": [
                        "ov-generation-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-generation-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-generation-paragraph-2",
                    "kind": "paragraph",
                    "text": "Business-specific calculations and external connections follow declared types and extension points. Explicit input and output specifications support reuse of existing operations and creation of glue code between them. AI can also provide supplementation and connections within these contracts.",
                    "coreRefs": {
                      "steps": [
                        "ov-generation"
                      ],
                      "claims": [
                        "ov-generation-claim-2"
                      ],
                      "nodes": [
                        "ov-generation-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-generation-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ov-components-section",
                "heading": "Assembling and Distributing Components with Contracts",
                "coreRefs": {
                  "steps": [
                    "ov-components"
                  ],
                  "claims": [
                    "ov-components-claim-1",
                    "ov-components-claim-2",
                    "ov-components-claim-3"
                  ],
                  "nodes": [
                    "ov-components-node-1",
                    "ov-components-node-2",
                    "ov-components-node-3"
                  ],
                  "relations": [
                    "ov-components-relation-1",
                    "ov-components-relation-2"
                  ],
                  "flows": [
                    "ov-components-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-components-paragraph-1",
                    "kind": "paragraph",
                    "text": "In component-based development, a Component owns business responsibilities and exposes capabilities through Services and Operations. Consumers connect to public types and operations. Sharing model-derived contracts across generated artifacts, existing components and extensions allows multiple applications to use the same business capability.",
                    "coreRefs": {
                      "steps": [
                        "ov-components"
                      ],
                      "claims": [
                        "ov-components-claim-1"
                      ],
                      "nodes": [
                        "ov-components-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-components-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-components-paragraph-2",
                    "kind": "paragraph",
                    "text": "Reducing direct dependencies on component internals limits the impact of internal changes that preserve public contracts. Components using shared invocation, persistence and authorization paths connect to the same execution management wherever reused. Functional reuse is therefore combined with reuse of common execution responsibilities.",
                    "coreRefs": {
                      "steps": [
                        "ov-components"
                      ],
                      "claims": [
                        "ov-components-claim-2"
                      ],
                      "nodes": [
                        "ov-components-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-components-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-components-paragraph-3",
                    "kind": "paragraph",
                    "text": "A CAR packages component code, definitions, contracts and dependencies. The Component Repository distribution model associates car lint and CBD Review checks, signatures and publisher verification with the version being accepted. Consumers can use public contracts and review information when installing components. The security guide covers the applicability of checks and signatures.",
                    "coreRefs": {
                      "steps": [
                        "ov-components"
                      ],
                      "claims": [
                        "ov-components-claim-3"
                      ],
                      "nodes": [
                        "ov-components-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-components-flow"
                      ]
                    }
                  },
                  {
                    "id": "component-combination",
                    "kind": "figure",
                    "asset": "images/component-combination-en.png",
                    "caption": "Combining functional reuse with shared execution management",
                    "alt": "Combining functional reuse with shared execution management",
                    "coreRefs": {
                      "steps": [
                        "ov-components"
                      ],
                      "claims": [
                        "ov-components-claim-1",
                        "ov-components-claim-2",
                        "ov-components-claim-3"
