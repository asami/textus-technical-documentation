                        "ov-components-node-3"
                      ],
                      "relations": [
                        "ov-components-relation-1",
                        "ov-components-relation-2"
                      ],
                      "flows": [
                        "ov-components-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ov-runtime-section",
            "heading": "Running Components in a Shared Execution Architecture",
            "coreRefs": {
              "steps": [
                "ov-runtime"
              ],
              "claims": [
                "ov-runtime-claim-1"
              ],
              "nodes": [
                "ov-runtime-node-1",
                "ov-runtime-node-2"
              ],
              "relations": [
                "ov-runtime-relation-1"
              ],
              "flows": [
                "ov-runtime-flow"
              ]
            },
            "blocks": [
              {
                "id": "ov-runtime-paragraph-1",
                "kind": "paragraph",
                "text": "Once components are assembled, the runtime assigns request admission, business rules, commit and response responsibilities. This section first describes Application, Domain and persistent state, then the Operation and UoW paths connecting them. Types and functional programming provide a way to connect business-specific processing to this architecture.",
                "coreRefs": {
                  "steps": [
                    "ov-runtime"
                  ],
                  "claims": [
                    "ov-runtime-claim-1"
                  ],
                  "nodes": [
                    "ov-runtime-node-1",
                    "ov-runtime-node-2"
                  ],
                  "relations": [
                    "ov-runtime-relation-1"
                  ],
                  "flows": [
                    "ov-runtime-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ov-tiers-section",
                "heading": "Separating Application, Domain and Persistent State",
                "coreRefs": {
                  "steps": [
                    "ov-tiers"
                  ],
                  "claims": [
                    "ov-tiers-claim-1",
                    "ov-tiers-claim-2",
                    "ov-tiers-claim-3"
                  ],
                  "nodes": [
                    "ov-tiers-node-1",
                    "ov-tiers-node-2",
                    "ov-tiers-node-3"
                  ],
                  "relations": [
                    "ov-tiers-relation-1",
                    "ov-tiers-relation-2"
                  ],
                  "flows": [
                    "ov-tiers-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-tiers-paragraph-1",
                    "kind": "paragraph",
                    "text": "The Application tier admits requests and routes them to business operations. The Domain tier owns business rules and state operations, with persistent storage as durable authority. This separates scaling external request handling from operating the mechanisms that maintain business-state consistency.",
                    "coreRefs": {
                      "steps": [
                        "ov-tiers"
                      ],
                      "claims": [
                        "ov-tiers-claim-1"
                      ],
                      "nodes": [
                        "ov-tiers-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-tiers-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-tiers-paragraph-2",
                    "kind": "paragraph",
                    "text": "The Domain tier may retain information in memory according to modeled Entity classifications and explicit policies. Updates are persisted through commit paths, while memory remains reconstructible. This combines efficient information access with durable state retention and recovery.",
                    "coreRefs": {
                      "steps": [
                        "ov-tiers"
                      ],
                      "claims": [
                        "ov-tiers-claim-2"
