                "id": "ov-guides-paragraph-1",
                "kind": "paragraph",
                "text": "Use the DDD guide for model design and Modeling and FP for projecting models into calculations and effects. UI covers user interaction; Reactive covers execution under load and failure; Security covers authority and protection. These guides explain different perspectives on the shared path introduced here.",
