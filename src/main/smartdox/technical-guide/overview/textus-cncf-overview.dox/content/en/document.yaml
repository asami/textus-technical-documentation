                  "flows": [
                    "ov-fp-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-fp-paragraph-1",
                    "kind": "paragraph",
                    "text": "Supplementary Scala implementations use types for business values and input/output conditions and compose calculations as pure functions. Separating calculations from acquisition and persistence supports repeatable rule verification, while type mismatches can be detected at compilation. Calculation checks and environment-dependent checks can then be separated.",
                    "coreRefs": {
                      "steps": [
                        "ov-fp"
                      ],
                      "claims": [
                        "ov-fp-claim-1"
                      ],
                      "nodes": [
                        "ov-fp-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-fp-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-fp-paragraph-2",
                    "kind": "paragraph",
                    "text": "Consequence represents success and failure as shared outcomes; Free Monad describes operations such as persistence and communication as programs. Passing their combination through the UoW execution path lets business code describe requested work while the platform applies authorization, commit and finalization. Modeling and FP explains the individual types and composition rules.",
                    "coreRefs": {
                      "steps": [
                        "ov-fp"
                      ],
                      "claims": [
                        "ov-fp-claim-2"
                      ],
                      "nodes": [
                        "ov-fp-node-2"
                      ],
                      "relations": [],
