              ],
              "flows": [
                "ov-interfaces-flow"
              ]
            },
            "blocks": [
              {
                "id": "ov-interfaces-paragraph-1",
                "kind": "paragraph",
                "text": "Standard Web UI and the Textus-connected Flutter application framework construct screens from models and configuration. The Flutter path targets iPhone, Android, tablets, Web and desktop, covering different UI platforms as well as screen dimensions. Shared Views, Displays and Operations reduce repeated definition of business meaning across interfaces.",
                "coreRefs": {
                  "steps": [
                    "ov-interfaces"
                  ],
                  "claims": [
                    "ov-interfaces-claim-1"
                  ],
                  "nodes": [
                    "ov-interfaces-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ov-interfaces-flow"
                  ]
                }
              },
              {
                "id": "ov-interfaces-paragraph-2",
                "kind": "paragraph",
                "text": "An independently developed UI can connect through public REST or gRPC APIs. External-service communication is concentrated in interfaces such as Providers, limiting dependencies of business models on protocols and endpoints. Routing updates back through public Operations, authorization and UoW preserves business behavior as interfaces and connection methods change.",
                "coreRefs": {
