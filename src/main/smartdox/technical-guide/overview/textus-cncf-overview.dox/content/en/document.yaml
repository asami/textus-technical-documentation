                  {
                    "id": "ov-tiers-paragraph-3",
                    "kind": "paragraph",
                    "text": "Short operations can run directly; long-running work can be accepted as Jobs whose Tasks track progression. Job acceptance is distinct from business completion, and each operation uses its corresponding UoW for commit. Admission versus processing capacity and recovery conditions are designed around these responsibilities.",
