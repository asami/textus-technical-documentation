                "sections": []
              },
              {
                "id": "ov-fp-section",
                "heading": "Connecting Business Calculations to the Runtime through Types and Functions",
                "coreRefs": {
                  "steps": [
                    "ov-fp"
                  ],
                  "claims": [
                    "ov-fp-claim-1",
                    "ov-fp-claim-2"
                  ],
                  "nodes": [
