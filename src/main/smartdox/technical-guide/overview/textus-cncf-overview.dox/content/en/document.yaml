              ],
              "flows": [
                "ov-models-flow"
              ]
            },
            "blocks": [
              {
                "id": "ov-models-paragraph-1",
                "kind": "paragraph",
                "text": "No single model describes every part of an application. Starting with terminology and requirements, models divide responsibility among business structure, goal-directed progression, read results and presentation, with explicit relationships between them. These connections help keep business rules from dispersing into UI and persistence code.",
                "coreRefs": {
                  "steps": [
                    "ov-models"
                  ],
                  "claims": [
                    "ov-models-claim-1"
                  ],
                  "nodes": [
                    "ov-models-node-1",
