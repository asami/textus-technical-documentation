            "sections": [
              {
                "id": "ov-domain-application-section",
                "heading": "Connecting Domain and Application Models",
                "coreRefs": {
                  "steps": [
                    "ov-domain-application"
                  ],
                  "claims": [
                    "ov-domain-application-claim-1",
                    "ov-domain-application-claim-2"
                  ],
                  "nodes": [
                    "ov-domain-application-node-1",
                    "ov-domain-application-node-2"
                  ],
                  "relations": [
                    "ov-domain-application-relation-1"
                  ],
                  "flows": [
                    "ov-domain-application-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-domain-application-paragraph-1",
                    "kind": "paragraph",
                    "text": "DDD and PoEAA provide reference perspectives for organizing the models and connections needed in development. Domain models center on static structures such as Entities, Values and Aggregates, defining business concepts and update rules. Application models center on Workflows derived from use cases, coordinating domain operations to achieve goals. State machines specify states and permitted transitions; rule models organize decision conditions.",
                    "coreRefs": {
                      "steps": [
                        "ov-domain-application"
                      ],
                      "claims": [
                        "ov-domain-application-claim-1"
                      ],
                      "nodes": [
                        "ov-domain-application-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-domain-application-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-domain-application-paragraph-2",
                    "kind": "paragraph",
                    "text": "Use cases are requirements models describing goals, examples and expected outcomes. They are connected to realizing Workflows, state machines, Operations and Entities rather than executed directly. Examples and model relationships support consistency checks. BoK-managed glossaries and literate models retain the meanings and rationale used across these connections.",
                    "coreRefs": {
                      "steps": [
                        "ov-domain-application"
                      ],
                      "claims": [
                        "ov-domain-application-claim-2"
                      ],
                      "nodes": [
                        "ov-domain-application-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-domain-application-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ov-view-display-section",
                "heading": "Connecting Reading and Presentation to Business Operations",
                "coreRefs": {
                  "steps": [
                    "ov-view-display"
                  ],
                  "claims": [
                    "ov-view-display-claim-1"
                  ],
                  "nodes": [
                    "ov-view-display-node-1",
                    "ov-view-display-node-2"
                  ],
                  "relations": [
                    "ov-view-display-relation-1"
                  ],
                  "flows": [
                    "ov-view-display-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-view-display-paragraph-1",
                    "kind": "paragraph",
                    "text": "Views express meaningful read results for particular purposes; Displays sit outside them and express presentation fields and offered actions. This separation supports projection of the same business meaning into Web, Flutter and other UIs. User actions return through public Operations, preserving update rules across screens.",
                    "coreRefs": {
                      "steps": [
                        "ov-view-display"
                      ],
                      "claims": [
                        "ov-view-display-claim-1"
                      ],
                      "nodes": [
                        "ov-view-display-node-1",
                        "ov-view-display-node-2"
                      ],
                      "relations": [
                        "ov-view-display-relation-1"
                      ],
                      "flows": [
                        "ov-view-display-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ov-build-section",
            "heading": "Reusing Components through Model Contracts",
            "coreRefs": {
              "steps": [
                "ov-build"
