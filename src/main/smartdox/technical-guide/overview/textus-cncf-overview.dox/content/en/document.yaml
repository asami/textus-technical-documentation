                        "ov-fp-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ov-interfaces-section",
            "heading": "Connecting UIs and External Systems to Shared Business Contracts",
            "coreRefs": {
              "steps": [
                "ov-interfaces"
              ],
              "claims": [
                "ov-interfaces-claim-1",
                "ov-interfaces-claim-2"
              ],
