              },
              {
                "id": "ov-operation-path-section",
                "heading": "Sharing the Path from Operation to Commit",
                "coreRefs": {
                  "steps": [
                    "ov-operation-path"
                  ],
                  "claims": [
                    "ov-operation-path-claim-1",
                    "ov-operation-path-claim-2"
