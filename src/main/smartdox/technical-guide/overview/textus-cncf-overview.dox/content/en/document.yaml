          {
            "id": "ov-models-section",
            "heading": "Modeling from Business Meaning to User Interaction",
            "coreRefs": {
              "steps": [
                "ov-models"
              ],
              "claims": [
                "ov-models-claim-1"
              ],
              "nodes": [
                "ov-models-node-1",
