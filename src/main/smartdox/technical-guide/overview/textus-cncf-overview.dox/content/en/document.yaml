                  ],
                  "relations": [
                    "ov-knowledge-relation-1"
                  ],
                  "flows": [
                    "ov-knowledge-flow"
                  ]
                }
              },
              {
                "id": "ov-knowledge-paragraph-2",
                "kind": "paragraph",
                "text": "At runtime, Entity-based business information connects to Information, representations such as RDF, and search or AI delivery. Design knowledge and business records remain distinct while identity, provenance and permissions are preserved. The separate guides Designing Domain Models from a BoK and Using Entities as Knowledge explain these paths. Knowledge retrieval and business mutation use distinct paths.",
                "coreRefs": {
