                  "flows": [
                    "ov-operation-path-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-operation-path-paragraph-1",
                    "kind": "paragraph",
                    "text": "Requests from UIs and APIs reach business processing after input, identity and Operation-authorization checks. Access to target Entities or external resources is subject to the corresponding authorization and resource conditions. Routing different entry points through this path reduces repeated construction of execution contexts and protection code.",
                    "coreRefs": {
                      "steps": [
                        "ov-operation-path"
                      ],
                      "claims": [
                        "ov-operation-path-claim-1"
                      ],
                      "nodes": [
                        "ov-operation-path-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-operation-path-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-operation-path-paragraph-2",
                    "kind": "paragraph",
                    "text": "Proposed changes produced by business calculations are passed to UoW commit handling. Because successful calculations can still encounter persistence failures, the caller receives an outcome including commit, while the platform handles abort and resource finalization as required. Separating business calculation from changes to shared state clarifies verification conditions and failure-handling responsibilities.",
                    "coreRefs": {
                      "steps": [
                        "ov-operation-path"
                      ],
                      "claims": [
                        "ov-operation-path-claim-2"
                      ],
                      "nodes": [
                        "ov-operation-path-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-operation-path-flow"
                      ]
                    }
                  },
                  {
                    "id": "execution-boundaries",
                    "kind": "figure",
                    "asset": "images/execution-boundaries-en.png",
                    "caption": "Request, calculation, effect and commit paths",
                    "alt": "Request, calculation, effect and commit paths",
                    "coreRefs": {
