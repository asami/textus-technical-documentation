            "sections": []
          },
          {
            "id": "ov-quality-section",
            "heading": "Supporting Quality through the Execution Architecture",
            "coreRefs": {
              "steps": [
                "ov-quality"
              ],
              "claims": [
                "ov-quality-claim-1"
