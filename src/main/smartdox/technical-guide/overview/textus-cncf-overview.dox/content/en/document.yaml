            "sections": [
              {
                "id": "ov-reactive-section",
                "heading": "Maintaining Responsiveness by Aligning Admission and Capacity",
                "coreRefs": {
                  "steps": [
                    "ov-reactive"
                  ],
                  "claims": [
                    "ov-reactive-claim-1",
                    "ov-reactive-claim-2"
                  ],
                  "nodes": [
                    "ov-reactive-node-1",
                    "ov-reactive-node-2"
                  ],
                  "relations": [
                    "ov-reactive-relation-1"
                  ],
                  "flows": [
                    "ov-reactive-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-reactive-paragraph-1",
                    "kind": "paragraph",
                    "text": "Aligning Application admission, Job queues and Task concurrency with Domain capacity limits unbounded growth of active work. Long-running operations return acceptance separately from completion, allowing progress to be shown meanwhile. Capacity-aware admission and progression management together support responsiveness.",
                    "coreRefs": {
                      "steps": [
                        "ov-reactive"
                      ],
                      "claims": [
                        "ov-reactive-claim-1"
                      ],
                      "nodes": [
                        "ov-reactive-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-reactive-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-reactive-paragraph-2",
                    "kind": "paragraph",
                    "text": "Typed messages and operation composition expose dependencies, while the runtime handles queues, capacity limits and failure isolation. Scaling the Application side also requires attention to Domain and storage capacity. This combination of processing descriptions and execution control supports the four reactive traits: responsiveness, resilience, elasticity and message-driven interaction.",
                    "coreRefs": {
                      "steps": [
                        "ov-reactive"
                      ],
                      "claims": [
                        "ov-reactive-claim-2"
                      ],
                      "nodes": [
                        "ov-reactive-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-reactive-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ov-recovery-section",
                "heading": "Combining Efficient Memory Use with State Recovery",
                "coreRefs": {
                  "steps": [
                    "ov-recovery"
                  ],
                  "claims": [
                    "ov-recovery-claim-1",
                    "ov-recovery-claim-2"
                  ],
                  "nodes": [
                    "ov-recovery-node-1",
                    "ov-recovery-node-2"
                  ],
                  "relations": [
                    "ov-recovery-relation-1"
                  ],
                  "flows": [
                    "ov-recovery-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-recovery-paragraph-1",
                    "kind": "paragraph",
                    "text": "Memory use governed by Entity classification and retention policy improves access to frequently read information. Durable authority and explicit UoW commit boundaries support reconstruction from committed state after process memory is lost. This requires a clear division between memory-resident information and information that must be persisted.",
                    "coreRefs": {
                      "steps": [
                        "ov-recovery"
                      ],
                      "claims": [
                        "ov-recovery-claim-1"
                      ],
                      "nodes": [
                        "ov-recovery-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-recovery-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-recovery-paragraph-2",
                    "kind": "paragraph",
                    "text": "For long-running work, durable Job or Task progression, UoW commit outcomes and observation together support decisions about completed work and resumption. Conditions preventing duplicate effects and maintaining consistency with external services are defined at these boundaries. The Reactive guide details retention, release, retry and recovery policies.",
                    "coreRefs": {
                      "steps": [
                        "ov-recovery"
                      ],
                      "claims": [
                        "ov-recovery-claim-2"
                      ],
                      "nodes": [
                        "ov-recovery-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-recovery-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ov-security-section",
                "heading": "Embedding Security Mechanisms in Standard Paths",
                "coreRefs": {
                  "steps": [
                    "ov-security"
                  ],
                  "claims": [
                    "ov-security-claim-1",
                    "ov-security-claim-2"
                  ],
                  "nodes": [
                    "ov-security-node-1",
                    "ov-security-node-2"
                  ],
                  "relations": [
                    "ov-security-relation-1"
                  ],
                  "flows": [
                    "ov-security-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-security-paragraph-1",
                    "kind": "paragraph",
                    "text": "Connecting Web, Flutter and external APIs to the same public Operations allows shared Operation authorization for authenticated subjects and target-Entity authorization during processing. Input constraints and resource restrictions further reduce repeated protection code as entry points multiply.",
                    "coreRefs": {
                      "steps": [
                        "ov-security"
                      ],
                      "claims": [
                        "ov-security-claim-1"
                      ],
                      "nodes": [
                        "ov-security-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-security-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-security-paragraph-2",
                    "kind": "paragraph",
                    "text": "Artifact checks, signatures and publisher verification support installation decisions; runtime authorization and Capabilities limit accessible operations and resources. Proposed Profiles group Capabilities for shared configuration, while stronger-isolation uses can add container separation. Reviewed artifact acceptance is combined with granting only the authority needed at the destination. The Security guide distinguishes availability and applicability of each mechanism.",
                    "coreRefs": {
                      "steps": [
                        "ov-security"
                      ],
                      "claims": [
                        "ov-security-claim-2"
                      ],
                      "nodes": [
                        "ov-security-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-security-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ov-development-section",
            "heading": "Evolving Applications through Matched Responsibilities and Checks",
            "coreRefs": {
              "steps": [
                "ov-development"
              ],
              "claims": [
                "ov-development-claim-1",
                "ov-development-claim-2"
              ],
              "nodes": [
                "ov-development-node-1",
                "ov-development-node-2"
              ],
              "relations": [
                "ov-development-relation-1"
              ],
              "flows": [
                "ov-development-flow"
              ]
            },
            "blocks": [
              {
                "id": "ov-development-paragraph-1",
                "kind": "paragraph",
                "text": "Changes to business meaning belong in models, specific calculations in supplementary implementations, and capacity or authority adjustments in configuration. Type checks, model/component checks, business examples and runtime observation address their respective conditions. Matching responsibilities to checks reduces repeated examination of the entire implementation and its operational assumptions.",
                "coreRefs": {
                  "steps": [
                    "ov-development"
                  ],
                  "claims": [
                    "ov-development-claim-1"
                  ],
                  "nodes": [
                    "ov-development-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ov-development-flow"
                  ]
                }
              },
              {
                "id": "ov-development-paragraph-2",
                "kind": "paragraph",
                "text": "Model-driven and component-based development require learning, but reuse of components and runtime mechanisms reduces application-specific implementation and review. AI can supplement and connect typed contracts, using mechanical diagnostics to localize corrections. Constraints from models, types, component contracts and runtime controls act at different stages, providing layered harnesses while supporting improvements in development time and AI usage cost.",
                "coreRefs": {
                  "steps": [
                    "ov-development"
                  ],
                  "claims": [
                    "ov-development-claim-2"
                  ],
                  "nodes": [
                    "ov-development-node-2"
                  ],
                  "relations": [],
                  "flows": [
                    "ov-development-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
