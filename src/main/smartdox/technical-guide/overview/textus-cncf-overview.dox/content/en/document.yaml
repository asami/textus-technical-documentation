            "blocks": [
              {
                "id": "ov-quality-paragraph-1",
                "kind": "paragraph",
                "text": "The execution architecture provides boundaries for quality conditions at admission, business operations, commit and resource use. Responsiveness, recovery and security combine mechanisms along these responsibilities. The following sections explain which boundary each mechanism owns and how combinations reduce implementation burden or inconsistency.",
