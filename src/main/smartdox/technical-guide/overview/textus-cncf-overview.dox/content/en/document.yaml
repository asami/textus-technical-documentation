        ],
        "sections": [
          {
            "id": "ov-purpose-section",
            "heading": "Models as a Foundation for Development and Execution",
            "coreRefs": {
              "steps": [
                "ov-purpose"
              ],
              "claims": [
                "ov-purpose-claim-1",
                "ov-purpose-claim-2"
              ],
              "nodes": [
                "ov-purpose-node-1",
                "ov-purpose-node-2"
              ],
              "relations": [
                "ov-purpose-relation-1"
              ],
              "flows": [
                "ov-purpose-flow"
              ]
            },
            "blocks": [
              {
                "id": "ov-purpose-paragraph-1",
                "kind": "paragraph",
                "text": "Business applications combine specific rules with recurring responsibilities such as invocation, persistence, authorization and failure handling. Textus/CNCF expresses business meaning in models and typed contracts, reuses existing components and delegates common responsibilities to the runtime. This focuses application-specific implementation and verification on business-specific behavior.",
                "coreRefs": {
                  "steps": [
                    "ov-purpose"
                  ],
                  "claims": [
                    "ov-purpose-claim-1"
                  ],
                  "nodes": [
                    "ov-purpose-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ov-purpose-flow"
                  ]
                }
              },
              {
                "id": "ov-purpose-paragraph-2",
                "kind": "paragraph",
                "text": "The SimpleModeling reference architecture expresses this division through models, development tools and runtime infrastructure. Its modeling approach, Cozy and Textus can each be used individually. Together, they share model-defined contracts across generation, component assembly and execution, reducing repeated specification and management code at each stage.",
                "coreRefs": {
                  "steps": [
                    "ov-purpose"
                  ],
                  "claims": [
                    "ov-purpose-claim-2"
                  ],
                  "nodes": [
                    "ov-purpose-node-2"
                  ],
                  "relations": [],
                  "flows": [
                    "ov-purpose-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "ov-roles-section",
            "heading": "How SimpleModeling, CML, Cozy, Textus and CNCF Relate",
            "coreRefs": {
              "steps": [
                "ov-roles"
              ],
              "claims": [
                "ov-roles-claim-1",
                "ov-roles-claim-2"
              ],
              "nodes": [
                "ov-roles-node-1",
                "ov-roles-node-2"
              ],
              "relations": [
                "ov-roles-relation-1"
              ],
              "flows": [
                "ov-roles-flow"
              ]
            },
            "blocks": [
              {
                "id": "ov-roles-paragraph-1",
                "kind": "paragraph",
                "text": "CML describes models; Cozy analyzes, projects and generates from them. Textus runs applications assembled from components, while CNCF provides shared execution contracts and mechanisms within the platform. Here, CNCF means Cloud Native Component Framework.",
                "coreRefs": {
                  "steps": [
                    "ov-roles"
                  ],
                  "claims": [
                    "ov-roles-claim-1"
                  ],
                  "nodes": [
                    "ov-roles-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ov-roles-flow"
                  ]
                }
              },
              {
                "id": "ov-roles-paragraph-2",
                "kind": "paragraph",
                "text": "Development projects models into typed APIs, connection code and executable definitions, combining them with extensions and existing components. Installation resolves the runtime and artifacts used by Textus; execution follows CNCF’s shared paths. The following sections explain how these handoffs support reuse, execution management, UI reach and quality.",
                "coreRefs": {
                  "steps": [
                    "ov-roles"
                  ],
                  "claims": [
                    "ov-roles-claim-2"
                  ],
                  "nodes": [
