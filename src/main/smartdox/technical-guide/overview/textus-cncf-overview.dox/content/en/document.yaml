        "blocks": [
          {
            "id": "textus-cncf-overview-paragraph-1",
            "kind": "paragraph",
            "text": "Textus/CNCF combines business models and reusable components to run applications on shared infrastructure. Developers define business meaning and specific behavior, connecting UI, persistence, authority and load handling to platform mechanisms. This guide follows description, component assembly, execution and operation to explain what these technology combinations provide.",
            "coreRefs": {
              "steps": [
