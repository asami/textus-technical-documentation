                  {
                    "id": "ov-tiers-paragraph-2",
                    "kind": "paragraph",
                    "text": "Domain側は、モデルで指定したEntityの分類と明示的な方針に従って、情報をメモリへ保持できます。更新は確定経路を通して永続化し、メモリを再構成可能な領域として扱います。これにより、情報へのアクセスを効率化する方法と、状態を保持・復旧する方法を組み合わせられます。",
                    "coreRefs": {
