                  {
                    "id": "ov-tiers-paragraph-3",
                    "kind": "paragraph",
                    "text": "短い操作は直接実行し、長い処理はJobとして受け付けてTaskの進行を管理する経路を選べます。Jobの受付と業務処理の完了を分け、各操作の確定は対応するUoWで扱います。受付量と処理能力の関係、障害時の再開条件は、この分担を基に設計します。",
