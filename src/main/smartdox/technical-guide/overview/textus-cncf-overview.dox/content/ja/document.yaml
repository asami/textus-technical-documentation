                    "text": "業務計算で得た変更候補は、UoWの確定処理へ渡します。計算が成功しても保存が失敗する場合があるため、確定を含む結果を呼出し元へ返し、必要な中止と資源の終了処理を共通基盤で扱います。業務規則を計算する責務と、その変更を共有状態へ反映する責務を分けることで、検証する条件と失敗を扱う場所が明確になります。",
