                "id": "ov-reactive-section",
                "heading": "受付と処理能力を合わせて応答を保つ",
                "coreRefs": {
                  "steps": [
                    "ov-reactive"
                  ],
                  "claims": [
                    "ov-reactive-claim-1",
                    "ov-reactive-claim-2"
                  ],
                  "nodes": [
                    "ov-reactive-node-1",
                    "ov-reactive-node-2"
                  ],
                  "relations": [
                    "ov-reactive-relation-1"
                  ],
                  "flows": [
                    "ov-reactive-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-reactive-paragraph-1",
                    "kind": "paragraph",
                    "text": "Application側の受付制御、Jobの待ち行列、Taskの同時実行数をDomain側の処理能力に合わせると、受け付けた仕事を無制限に実行中の処理へ増やすことを抑えられます。長い処理は受付結果と完了結果を分けて返すため、その間も利用者に進行を示せます。実行能力に合わせた受付と、進行の管理を組み合わせて応答性を支えます。",
                    "coreRefs": {
                      "steps": [
                        "ov-reactive"
                      ],
                      "claims": [
                        "ov-reactive-claim-1"
                      ],
                      "nodes": [
                        "ov-reactive-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-reactive-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-reactive-paragraph-2",
                    "kind": "paragraph",
                    "text": "型付きのメッセージと操作の合成は、処理間の依存関係を明示し、実行基盤は待ち行列や容量制限、障害の分離を担当します。Application側を増やす場合もDomainや保存先の容量を合わせて扱います。リアクティブの四特性である応答性、耐障害性、弾力性、メッセージ駆動を、このような処理の記述と実行制御の組合せで支えます。",
                    "coreRefs": {
                      "steps": [
                        "ov-reactive"
                      ],
                      "claims": [
                        "ov-reactive-claim-2"
                      ],
                      "nodes": [
                        "ov-reactive-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-reactive-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ov-recovery-section",
                "heading": "メモリの利用効率と状態の復旧を両立させる",
                "coreRefs": {
                  "steps": [
                    "ov-recovery"
                  ],
                  "claims": [
                    "ov-recovery-claim-1",
                    "ov-recovery-claim-2"
                  ],
                  "nodes": [
                    "ov-recovery-node-1",
                    "ov-recovery-node-2"
                  ],
                  "relations": [
                    "ov-recovery-relation-1"
                  ],
                  "flows": [
                    "ov-recovery-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-recovery-paragraph-1",
                    "kind": "paragraph",
                    "text": "Entityの分類と保持方針に従うメモリ利用は、頻繁に参照する情報へのアクセスを効率化します。永続状態を正本とし、UoWの確定境界を明確にすることで、実行プロセスのメモリを失っても、確定済みの状態から再構成する設計にできます。メモリに置く情報と、保存しなければならない情報を分担することが、この組合せの条件です。",
                    "coreRefs": {
                      "steps": [
                        "ov-recovery"
                      ],
                      "claims": [
                        "ov-recovery-claim-1"
                      ],
                      "nodes": [
                        "ov-recovery-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-recovery-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-recovery-paragraph-2",
                    "kind": "paragraph",
                    "text": "長い処理では、永続化するJobやTaskの進行情報と、各UoWの確定結果、観測情報を合わせて、完了した処理と再開すべき処理を判断します。再実行による重複を防ぐ条件や、外部サービスとの整合性もこの境界で定めます。詳細な保持・解放・再試行・復旧の方針はリアクティブガイドへつなぎます。",
                    "coreRefs": {
                      "steps": [
                        "ov-recovery"
                      ],
                      "claims": [
                        "ov-recovery-claim-2"
                      ],
                      "nodes": [
                        "ov-recovery-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-recovery-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ov-security-section",
                "heading": "標準経路へセキュリティ機構を組み込む",
                "coreRefs": {
                  "steps": [
                    "ov-security"
                  ],
                  "claims": [
                    "ov-security-claim-1",
                    "ov-security-claim-2"
                  ],
                  "nodes": [
                    "ov-security-node-1",
                    "ov-security-node-2"
                  ],
                  "relations": [
                    "ov-security-relation-1"
                  ],
                  "flows": [
                    "ov-security-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ov-security-paragraph-1",
                    "kind": "paragraph",
                    "text": "Web、Flutter、外部APIの呼出しを同じ公開Operationへ接続すると、認証した主体に対するOperationの認可と、処理中の対象Entityへの認可を共通経路で適用できます。入力制約と資源利用の制限も組み合わせることで、入口が増えても、画面や業務処理ごとに保護を作り直す範囲を抑えられます。",
                    "coreRefs": {
                      "steps": [
                        "ov-security"
                      ],
                      "claims": [
                        "ov-security-claim-1"
                      ],
                      "nodes": [
                        "ov-security-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-security-flow"
                      ]
                    }
                  },
                  {
                    "id": "ov-security-paragraph-2",
                    "kind": "paragraph",
                    "text": "配布物の検査と署名・配布元の確認は導入時の判断を支え、実行時の認可とCapabilityは利用できる操作や資源を限定します。用途別のCapabilityセットをProfileで管理する構想は設定の共通化を支え、強い隔離が必要な用途ではコンテナによる区画分離を追加します。検査済みの部品を導入することと、利用先で必要な権限だけを与えることを組み合わせます。各機構の提供状況と適用条件はセキュリティガイドで区別します。",
                    "coreRefs": {
                      "steps": [
                        "ov-security"
                      ],
                      "claims": [
                        "ov-security-claim-2"
                      ],
                      "nodes": [
                        "ov-security-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ov-security-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ov-development-section",
            "heading": "責務と検査を対応付けて変更を進める",
            "coreRefs": {
              "steps": [
                "ov-development"
              ],
              "claims": [
                "ov-development-claim-1",
                "ov-development-claim-2"
              ],
              "nodes": [
                "ov-development-node-1",
                "ov-development-node-2"
              ],
              "relations": [
                "ov-development-relation-1"
              ],
              "flows": [
                "ov-development-flow"
              ]
            },
            "blocks": [
              {
                "id": "ov-development-paragraph-1",
                "kind": "paragraph",
                "text": "変更時には、業務の意味を変える箇所をモデルへ、固有の計算を補完実装へ、容量や権限の調整を設定へ反映します。型検査、モデル・部品の検査、業務の実例検証、実行時の観測を、それぞれが確認できる条件に使います。責務と検査を対応付けることで、変更のたびに実装全体と運用上の条件を一から読み直す負担を減らせます。",
                "coreRefs": {
                  "steps": [
                    "ov-development"
                  ],
                  "claims": [
                    "ov-development-claim-1"
                  ],
                  "nodes": [
                    "ov-development-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ov-development-flow"
                  ]
                }
              },
              {
                "id": "ov-development-paragraph-2",
                "kind": "paragraph",
                "text": "モデル駆動とCBDには学習が必要ですが、既存部品と共通基盤の利用によって、個別に実装・レビューする範囲を減らせます。AIは型付き契約の中で補完と接続を行い、機械的な検査から修正箇所を絞れます。モデル、型、部品契約、実行時制御が異なる段階で制約を働かせるため、開発速度とAI利用コストの改善を図りながら、誤りを抑える多重のハーネスとしても利用できます。",
                "coreRefs": {
                  "steps": [
                    "ov-development"
                  ],
                  "claims": [
                    "ov-development-claim-2"
                  ],
                  "nodes": [
                    "ov-development-node-2"
                  ],
                  "relations": [],
                  "flows": [
                    "ov-development-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "ov-conclusion-section",
            "heading": "まとめ",
            "coreRefs": {
              "steps": [
                "ov-conclusion"
              ],
              "claims": [
                "ov-conclusion-claim-1"
              ],
              "nodes": [
