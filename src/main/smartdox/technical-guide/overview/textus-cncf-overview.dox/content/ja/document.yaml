                    "id": "ov-operation-path-paragraph-1",
                    "kind": "paragraph",
                    "text": "UIやAPIからの要求は、入力と実行主体の確認、Operationの認可を経て業務処理へ渡ります。処理中に対象Entityや外部資源を利用するときも、対応する認可と資源利用の条件を確認します。入口の違いをこの経路へ集めることで、業務処理ごとに実行文脈や保護を組み立てる負担を減らします。",
