            "id": "textus-cncf-overview-paragraph-1",
            "kind": "paragraph",
            "text": "Textus/CNCFは、業務モデルと再利用可能な部品を組み合わせ、共通の実行基盤でアプリケーションを動作させる仕組みを提供します。開発者が業務の意味と固有の処理を定め、UI、保存、権限、負荷への対応を基盤の機構へ接続する構成です。本書では、モデルの記述から部品化、実行、運用までを通して、各技術の組合せによって何が得られるかを説明します。",
