            "blocks": [
              {
                "id": "ov-conclusion-paragraph-1",
                "kind": "paragraph",
                "text": "Textus/CNCFは、業務モデル、型付きの部品契約、共通の実行管理を組み合わせます。開発者は業務の意味と固有の処理に集中し、既存機能を再利用しながら、複数のUI、保存、権限、負荷や障害への対応を同じ実行構成へ接続できます。この分担によって個別の実装と確認を減らし、必要な品質を共通基盤の機構と業務の検証で支えます。AIによる補完も、この構成の中で利用できます。",
                "coreRefs": {
