                "id": "ov-purpose-paragraph-1",
                "kind": "paragraph",
                "text": "業務アプリケーションには、固有の規則を実現する処理と、呼出し、保存、認可、障害対応などに共通する処理があります。Textus/CNCFは、業務の意味をモデルと型付きの契約へ表し、既存の部品を利用しながら、共通する処理を実行基盤へ任せる構成を取ります。これにより、個別に実装・確認する範囲を業務固有の部分へ絞りやすくなります。",
