                    "id": "ov-tiers-paragraph-1",
                    "kind": "paragraph",
                    "text": "Application tierは要求を受け付け、対象の業務操作へ処理を渡します。Domain tierは業務規則と状態への操作を担い、永続状態を長期的な正本とします。この分担により、外部からの要求を受ける側の増減と、業務状態の整合性を管理する側の運用を分けて設計できます。",
                    "coreRefs": {
