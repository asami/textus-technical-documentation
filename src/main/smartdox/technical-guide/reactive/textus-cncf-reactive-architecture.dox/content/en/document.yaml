          {
            "id": "reactive-adoption-section",
            "heading": "Verifying Qualities and Using Shared Infrastructure",
            "coreRefs": {
              "steps": [
                "reactive-adoption"
              ],
              "claims": [
                "reactive-adoption-claim-1"
              ],
              "nodes": [
                "reactive-adoption-node-1",
