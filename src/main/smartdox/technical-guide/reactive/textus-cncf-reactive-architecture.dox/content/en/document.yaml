            "blocks": [
              {
                "id": "reactive-resilience-paragraph-1",
                "kind": "paragraph",
                "text": "The design spans individual failures, resource termination, recovery from durable records, and runtime replacement. Retaining committed facts at each boundary and isolating failed parts supports resilience and continued responsiveness.",
