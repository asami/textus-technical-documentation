                        "reactive-tiers-node-3"
                      ],
                      "relations": [
                        "reactive-tiers-relation-1",
                        "reactive-tiers-relation-2"
                      ],
                      "flows": [
                        "reactive-tiers-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "reactive-state-section",
            "heading": "Placing Business State and Read Models",
            "coreRefs": {
              "steps": [
                "reactive-state"
              ],
              "claims": [
                "reactive-state-claim-1"
              ],
              "nodes": [
                "reactive-state-node-1",
                "reactive-state-node-effect"
              ],
              "relations": [
                "reactive-state-relation-effect"
              ],
              "flows": [
                "reactive-state-flow"
              ]
            },
            "blocks": [
              {
                "id": "reactive-state-paragraph-1",
                "kind": "paragraph",
                "text": "The Domain tier combines fast resident execution, recovery from persistent state, and CQRS separation of writes and reads. Performance and consistency result from connecting these mechanisms while retaining their separate responsibilities.",
                "coreRefs": {
                  "steps": [
                    "reactive-state"
                  ],
                  "claims": [
                    "reactive-state-claim-1"
                  ],
                  "nodes": [
                    "reactive-state-node-1",
                    "reactive-state-node-effect"
                  ],
                  "relations": [
                    "reactive-state-relation-effect"
                  ],
                  "flows": [
                    "reactive-state-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "reactive-memory-section",
                "heading": "Using Memory to Accelerate Execution and Reads",
                "coreRefs": {
                  "steps": [
                    "reactive-memory"
                  ],
                  "claims": [
                    "reactive-memory-claim-1",
                    "reactive-memory-claim-2",
                    "reactive-memory-claim-3"
                  ],
                  "nodes": [
                    "reactive-memory-node-1",
                    "reactive-memory-node-2",
                    "reactive-memory-node-3"
                  ],
                  "relations": [
                    "reactive-memory-relation-1",
                    "reactive-memory-relation-2"
                  ],
                  "flows": [
                    "reactive-memory-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-memory-paragraph-1",
                    "kind": "paragraph",
                    "text": "Domain Subsystems retain EntitySpace, Entity Realms, indexes, dictionaries, and caches in memory to reduce repeated retrieval and reconstruction. Residency depends on Entity purpose and state: stable master data is a candidate, while stateful business Entities may remain resident while active. Large document bodies and media use separate storage and read paths. Linking model classifications to residency policy balances responsiveness and memory consumption.",
                    "coreRefs": {
                      "steps": [
                        "reactive-memory"
                      ],
                      "claims": [
                        "reactive-memory-claim-1"
                      ],
                      "nodes": [
                        "reactive-memory-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-memory-paragraph-2",
                    "kind": "paragraph",
                    "text": "Memory residency is a performance mechanism, not a substitute for durability. Domain rules and UoW govern committed storage updates, whose outcomes then update or invalidate Working Sets and Views. A resident revision does not bypass authoritative concurrency checks. This combines fast reads with update consistency and reconstructability after failure.",
                    "coreRefs": {
                      "steps": [
                        "reactive-memory"
                      ],
                      "claims": [
                        "reactive-memory-claim-2"
                      ],
                      "nodes": [
                        "reactive-memory-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-memory-paragraph-3",
                    "kind": "paragraph",
                    "text": "While a Working Set loads, eligible searches fall back to persistent storage instead of treating an unloaded set as empty business data. Long-running servers amortize warm-up costs through reuse, while short-lived command invocations can use store-first paths. The design therefore addresses startup responsiveness and recovery time as well as steady-state performance. Residency, persistence, and reconstruction are designed together to balance responsiveness, consistency, recoverability, and resource efficiency.",
                    "coreRefs": {
                      "steps": [
                        "reactive-memory"
                      ],
                      "claims": [
                        "reactive-memory-claim-3"
                      ],
                      "nodes": [
                        "reactive-memory-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-memory-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "reactive-cqrs-section",
                "heading": "Separating Command and Query Paths with CQRS",
                "coreRefs": {
                  "steps": [
                    "reactive-cqrs"
                  ],
                  "claims": [
                    "reactive-cqrs-claim-1",
                    "reactive-cqrs-claim-2",
                    "reactive-cqrs-claim-3"
                  ],
                  "nodes": [
                    "reactive-cqrs-node-1",
                    "reactive-cqrs-node-2",
                    "reactive-cqrs-node-3"
                  ],
                  "relations": [
                    "reactive-cqrs-relation-1",
                    "reactive-cqrs-relation-2"
                  ],
                  "flows": [
                    "reactive-cqrs-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-cqrs-paragraph-1",
                    "kind": "paragraph",
                    "text": "In CQRS, Commands change business state and Queries read it. Textus/CNCF models Entity as the authoritative business data, Aggregate as the write-side operations and invariants, and View as the read-side information structure. Updates follow Aggregate business operations rather than presentation-oriented View shapes. This allows consistency-sensitive writes and responsiveness-oriented reads to be tuned separately.",
                    "coreRefs": {
                      "steps": [
                        "reactive-cqrs"
                      ],
                      "claims": [
                        "reactive-cqrs-claim-1"
                      ],
                      "nodes": [
                        "reactive-cqrs-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-cqrs-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-cqrs-paragraph-2",
                    "kind": "paragraph",
                    "text": "Events produced by updates can trigger View reconstruction or invalidation and subsequent work. Read-side projections are reconstructable derived state. With asynchronous refresh, a committed update and a refreshed View need not become visible simultaneously, so freshness and reread conditions must be explicit. These consistency conditions connect CQRS and message-driven processing to responsiveness.",
                    "coreRefs": {
                      "steps": [
                        "reactive-cqrs"
                      ],
                      "claims": [
                        "reactive-cqrs-claim-2"
                      ],
                      "nodes": [
                        "reactive-cqrs-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-cqrs-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-cqrs-paragraph-3",
                    "kind": "paragraph",
                    "text": "Queries normally execute directly and return results. Under the current execution contract, Commands explicitly select direct responses or Job management. Neither mandatory Jobs for every Command nor separate distributed stores for every Query are assumed. Choosing the separation required by the use case limits waiting and execution-management overhead. The Aggregate/View/Event division provides a structure for tuning read performance while preserving data consistency.",
                    "coreRefs": {
                      "steps": [
                        "reactive-cqrs"
                      ],
                      "claims": [
                        "reactive-cqrs-claim-3"
                      ],
                      "nodes": [
                        "reactive-cqrs-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-cqrs-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-cqrs-memory",
                    "kind": "figure",
                    "asset": "images/reactive-cqrs-memory-en.png",
                    "caption": "Figure 2. Write and read paths. Memory and Views are reconstructible and follow committed updates.",
                    "alt": "Figure 2. Write and read paths. Memory and Views are reconstructible and follow committed updates.",
                    "coreRefs": {
                      "steps": [
                        "reactive-cqrs",
                        "reactive-memory"
                      ],
                      "claims": [
                        "reactive-cqrs-claim-1",
                        "reactive-cqrs-claim-2",
                        "reactive-cqrs-claim-3",
