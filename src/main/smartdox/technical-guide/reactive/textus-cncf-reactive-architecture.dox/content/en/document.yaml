            "sections": [
              {
                "id": "reactive-observability-section",
                "heading": "Connecting Quality Attributes to Observation and Verification",
                "coreRefs": {
                  "steps": [
                    "reactive-observability"
                  ],
                  "claims": [
                    "reactive-observability-claim-1",
                    "reactive-observability-claim-2"
                  ],
