            "blocks": [
              {
                "id": "reactive-adoption-paragraph-1",
                "kind": "paragraph",
                "text": "Both specifications and execution checks establish shared mechanism behavior and system performance and availability. Application-defined business conditions and infrastructure-owned execution controls remain explicit.",
