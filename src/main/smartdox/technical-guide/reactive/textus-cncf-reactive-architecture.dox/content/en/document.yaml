                        "reactive-events-claim-2",
                        "reactive-events-claim-3"
                      ],
                      "nodes": [
                        "reactive-recovery-node-1",
                        "reactive-recovery-node-2",
                        "reactive-recovery-node-3",
                        "reactive-events-node-1",
                        "reactive-events-node-2",
                        "reactive-events-node-3"
                      ],
                      "relations": [
                        "reactive-recovery-relation-1",
