                        "reactive-events-relation-1",
                        "reactive-events-relation-2"
                      ],
                      "flows": [
                        "reactive-recovery-flow",
                        "reactive-events-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-recovery-paragraph-1",
                    "kind": "paragraph",
                    "text": "Consequence and Conclusion carry structured outcomes such as invalid input, authorization refusal, unmet business conditions, and execution failure. Work that did not start is distinguished from work that failed after execution and correlated with Job and Task results. Retaining how far execution progressed, beyond catching exceptions, is essential to resilience and observability.",
                    "coreRefs": {
                      "steps": [
                        "reactive-recovery"
                      ],
                      "claims": [
                        "reactive-recovery-claim-1"
                      ],
                      "nodes": [
                        "reactive-recovery-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-recovery-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-recovery-paragraph-2",
                    "kind": "paragraph",
                    "text": "A retry is another execution attempt for the same logical work. Eligible failures, attempt counts, delays, and idempotency conditions must be defined. Where earlier Tasks have committed, business undo requires explicitly modeled compensation operations. Infrastructure does not infer undo semantics from changed data. Missing or failed compensation leaves an explicit recovery-required state.",
                    "coreRefs": {
                      "steps": [
                        "reactive-recovery"
                      ],
                      "claims": [
                        "reactive-recovery-claim-2"
                      ],
                      "nodes": [
                        "reactive-recovery-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-recovery-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-recovery-paragraph-3",
                    "kind": "paragraph",
                    "text": "Persisting a Job record does not by itself make external effects safe to replay. Resumption requires conditions concerning input, definitions, authority, providers, compatibility, and idempotency. Started work with an uncertain outcome is subject to recovery decisions rather than being treated as unstarted and automatically resubmitted. Durable records combined with resumption conditions reduce duplicate effects during recovery.",
                    "coreRefs": {
                      "steps": [
                        "reactive-recovery"
                      ],
                      "claims": [
                        "reactive-recovery-claim-3"
                      ],
                      "nodes": [
                        "reactive-recovery-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-recovery-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "reactive-resources-section",
                "heading": "Managing Cancellation and Resource Release Centrally",
                "coreRefs": {
                  "steps": [
                    "reactive-resources"
                  ],
                  "claims": [
                    "reactive-resources-claim-1",
                    "reactive-resources-claim-2"
                  ],
                  "nodes": [
                    "reactive-resources-node-1",
                    "reactive-resources-node-2"
                  ],
                  "relations": [
                    "reactive-resources-relation-1"
                  ],
                  "flows": [
                    "reactive-resources-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-resources-paragraph-1",
                    "kind": "paragraph",
                    "text": "UoW manages operational resources acquired during execution and releases them on success, failure, abort, or disposal. Transaction commit and abort are coordinated with, but distinct from, releasing processes or temporary streams. Remaining releases are attempted after a release failure, preserving both primary and cleanup failures. This limits resource leaks that would otherwise degrade performance over time.",
                    "coreRefs": {
                      "steps": [
                        "reactive-resources"
                      ],
                      "claims": [
                        "reactive-resources-claim-1"
                      ],
                      "nodes": [
                        "reactive-resources-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-resources-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-resources-paragraph-2",
                    "kind": "paragraph",
                    "text": "Job cancellation signals running work to stop, while termination confirmation and resource collection follow the resource lifecycle. An await timeout, a cancellation request, and actual termination are different events. Distinguishing them prevents reporting completion with resources still active or treating committed work as unexecuted. Cancellation and cleanup management preserve resource efficiency and limit the accumulated unfinished work that can undermine responsiveness and resilience.",
                    "coreRefs": {
                      "steps": [
                        "reactive-resources"
                      ],
                      "claims": [
                        "reactive-resources-claim-2"
                      ],
                      "nodes": [
                        "reactive-resources-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-resources-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "reactive-availability-section",
                "heading": "Combining Memory Residency with Active/Standby Operation",
                "coreRefs": {
                  "steps": [
                    "reactive-availability"
                  ],
                  "claims": [
                    "reactive-availability-claim-1",
                    "reactive-availability-claim-2",
                    "reactive-availability-claim-3"
                  ],
                  "nodes": [
                    "reactive-availability-node-1",
                    "reactive-availability-node-2",
                    "reactive-availability-node-3"
                  ],
                  "relations": [
                    "reactive-availability-relation-1",
                    "reactive-availability-relation-2"
                  ],
                  "flows": [
                    "reactive-availability-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-availability-paragraph-1",
                    "kind": "paragraph",
                    "text": "Domain Subsystem availability design assigns mutations to Active, while a ready Standby may serve read-only or cache workloads permitted by consistency requirements. Standby is not implicitly another writer. Extending CQRS distinctions into deployment and authority supports read performance and consistent writes while preparing a replacement.",
                    "coreRefs": {
                      "steps": [
                        "reactive-availability"
                      ],
                      "claims": [
                        "reactive-availability-claim-1"
                      ],
                      "nodes": [
                        "reactive-availability-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-availability-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-availability-paragraph-2",
                    "kind": "paragraph",
                    "text": "A replacement starts from admitted CAR artifacts, configuration, and persistent state, warms required memory, and establishes readiness. Routing and mutation authority switch before the old runtime drains and terminates. The architecture uses common paths for rotation, releases, and failover, exercising recovery during normal operation and combining long-lived memory use with replaceability.",
                    "coreRefs": {
                      "steps": [
                        "reactive-availability"
                      ],
                      "claims": [
                        "reactive-availability-claim-2"
                      ],
                      "nodes": [
                        "reactive-availability-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-availability-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-availability-paragraph-3",
                    "kind": "paragraph",
                    "text": "Select an HA topology for the required recovery time and cost. Reconstructible memory, transfer of write authority and available dependencies together support availability, resilience and recoverability.",
                    "coreRefs": {
                      "steps": [
                        "reactive-availability"
                      ],
                      "claims": [
                        "reactive-availability-claim-3"
                      ],
                      "nodes": [
                        "reactive-availability-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-availability-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-replacement-path",
                    "kind": "figure",
                    "asset": "images/reactive-replacement-path-en.png",
                    "caption": "Figure 5. Planned replacement design. Prepare from durable state, then switch routing and write authority. Failure recovery also uses surviving execution records.",
                    "alt": "Figure 5. Planned replacement design. Prepare from durable state, then switch routing and write authority. Failure recovery also uses surviving execution records.",
                    "coreRefs": {
                      "steps": [
                        "reactive-availability"
                      ],
                      "claims": [
