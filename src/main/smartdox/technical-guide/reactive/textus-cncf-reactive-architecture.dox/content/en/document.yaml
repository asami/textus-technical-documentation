              {
                "id": "reactive-foundation-paragraph-complexity",
                "kind": "paragraph",
                "text": "Asynchronous processing introduces additional concerns: ordering, completion tracking, data consistency, and duplicate execution during retries. Implementing these controls separately for each business process leads to different conventions and makes consistent system-wide behavior harder to maintain.",
                "coreRefs": {
                  "steps": [
                    "reactive-foundation"
                  ],
                  "claims": [
                    "reactive-foundation-claim-1"
                  ],
                  "nodes": [
                    "reactive-foundation-node-1",
                    "reactive-foundation-node-complexity",
                    "reactive-foundation-node-effect"
                  ],
                  "relations": [
                    "reactive-foundation-relation-complexity",
                    "reactive-foundation-relation-effect"
                  ],
                  "flows": [
                    "reactive-foundation-flow"
                  ]
                }
              },
              {
                "id": "reactive-foundation-paragraph-runtime",
                "kind": "paragraph",
                "text": "Business processing built with CML models and standard CNCF facilities connects to shared execution mechanisms. Tier and component responsibilities, message-based communication, Job management, resource management, and failure handling operate along this execution path, reducing the need to construct asynchronous controls for each business process. In ordinary development, developers can concentrate on business models and logic while receiving reactive support from the runtime. Having the infrastructure take responsibility for technically demanding controls and apply them to implementations following standard conventions is a central feature of this architecture.",
                "coreRefs": {
                  "steps": [
                    "reactive-foundation"
                  ],
                  "claims": [
                    "reactive-foundation-claim-1"
                  ],
                  "nodes": [
                    "reactive-foundation-node-1",
