                    "reactive-qualities-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-qualities-paragraph-1",
                    "kind": "paragraph",
                    "text": "The Reactive Manifesto identifies responsiveness, resilience, elasticity, and message-driven communication as interrelated characteristics. Textus/CNCF aims to return a result, acceptance state, or failure within an appropriate time despite changing load or partial failures. This requires a path for admission, execution, and outcome inspection, rather than asynchronous execution alone. Reference: The Reactive Manifesto (https://www.reactivemanifesto.org/).",
                    "coreRefs": {
                      "steps": [
                        "reactive-qualities"
                      ],
                      "claims": [
                        "reactive-qualities-claim-1"
                      ],
                      "nodes": [
                        "reactive-qualities-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-qualities-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-qualities-paragraph-2",
                    "kind": "paragraph",
                    "text": "Message-driven communication reduces temporal dependencies so that load and failures can be managed separately. Textus/CNCF distinguishes requests, facts, and execution management through Commands, Events, and Jobs.",
                    "coreRefs": {
                      "steps": [
                        "reactive-qualities"
                      ],
                      "claims": [
                        "reactive-qualities-claim-2"
                      ],
                      "nodes": [
                        "reactive-qualities-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-qualities-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-qualities-paragraph-3",
                    "kind": "paragraph",
                    "text": "Using the benefits of asynchronous architecture also requires preserving consistency and security, and making separated processing observable and testable. The following mapping covers these controls and organizes combinations of Textus/CNCF mechanisms through ten quality perspectives.",
                    "coreRefs": {
                      "steps": [
                        "reactive-qualities"
                      ],
                      "claims": [
                        "reactive-qualities-claim-3"
                      ],
                      "nodes": [
                        "reactive-qualities-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-qualities-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
