                "reactive-foundation-relation-effect"
              ],
              "flows": [
                "reactive-foundation-flow"
              ]
            },
            "blocks": [
              {
                "id": "reactive-foundation-paragraph-1",
                "kind": "paragraph",
                "text": "Connecting backend processes through asynchronous messages removes the need for callers and receivers to remain active together, making capacity and placement easier to adjust for each component. Combining this separation with capacity adjustment, load control, failure isolation, and recovery supports the following quality improvements.",
                "coreRefs": {
                  "steps": [
                    "reactive-foundation"
                  ],
                  "claims": [
                    "reactive-foundation-claim-1"
                  ],
                  "nodes": [
                    "reactive-foundation-node-1",
                    "reactive-foundation-node-complexity",
                    "reactive-foundation-node-effect"
                  ],
                  "relations": [
                    "reactive-foundation-relation-complexity",
                    "reactive-foundation-relation-effect"
                  ],
                  "flows": [
                    "reactive-foundation-flow"
                  ]
                }
              },
              {
                "id": "reactive-quality-benefits",
                "kind": "table",
                "caption": "Table 1. Quality improvements supported by reactive architecture",
                "columns": [
                  {
                    "id": "col-1",
                    "heading": "Quality attribute"
                  },
