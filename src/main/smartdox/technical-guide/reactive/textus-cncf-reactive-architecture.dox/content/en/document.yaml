          },
          {
            "id": "reactive-program-section",
            "heading": "Connecting Program Descriptions to Shared Execution",
            "coreRefs": {
              "steps": [
                "reactive-program"
              ],
              "claims": [
                "reactive-program-claim-1"
              ],
              "nodes": [
                "reactive-program-node-1",
                "reactive-program-node-effect"
              ],
              "relations": [
                "reactive-program-relation-effect"
              ],
              "flows": [
                "reactive-program-flow"
              ]
            },
            "blocks": [
              {
                "id": "reactive-program-paragraph-1",
                "kind": "paragraph",
                "text": "Types and pure functional composition make computation semantics explicit and hand effectful execution to shared infrastructure. This reduces individually implemented control logic and establishes the boundary for applying reactive execution controls.",
                "coreRefs": {
                  "steps": [
                    "reactive-program"
                  ],
                  "claims": [
                    "reactive-program-claim-1"
                  ],
                  "nodes": [
                    "reactive-program-node-1",
                    "reactive-program-node-effect"
                  ],
                  "relations": [
                    "reactive-program-relation-effect"
                  ],
                  "flows": [
                    "reactive-program-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "reactive-composition-section",
                "heading": "Aligning Computation Semantics with Types and Consequence",
                "coreRefs": {
                  "steps": [
                    "reactive-composition"
                  ],
                  "claims": [
                    "reactive-composition-claim-1",
                    "reactive-composition-claim-2"
                  ],
                  "nodes": [
                    "reactive-composition-node-1",
                    "reactive-composition-node-2"
                  ],
                  "relations": [
                    "reactive-composition-relation-1"
                  ],
                  "flows": [
                    "reactive-composition-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-composition-paragraph-1",
                    "kind": "paragraph",
                    "text": "Consequence represents outcomes and structured failures. Dependent computations compose through flatMap and stop progressing after failure. Independent input checks compose applicatively through zip APIs to aggregate errors across fields. Expressing this distinction through types and APIs lets business logic and infrastructure share failure semantics, reducing ad hoc exception handling and review effort.",
                    "coreRefs": {
                      "steps": [
                        "reactive-composition"
                      ],
                      "claims": [
                        "reactive-composition-claim-1"
                      ],
                      "nodes": [
                        "reactive-composition-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-composition-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-composition-paragraph-2",
                    "kind": "paragraph",
                    "text": "Pure functions compute outputs from explicit inputs, reducing hidden-state dependencies. Monadic composition expresses dependency; applicative composition expresses independent structure. Neither automatically guarantees asynchronous or parallel execution. Types and composition rules widen the scope of checkable properties and make computations easier to hand to shared execution mechanisms, connecting maintainability and testability to reactive execution.",
                    "coreRefs": {
                      "steps": [
                        "reactive-composition"
                      ],
                      "claims": [
                        "reactive-composition-claim-2"
                      ],
                      "nodes": [
                        "reactive-composition-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-composition-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-composition-roles",
                    "kind": "table",
                    "caption": "Table 4. Responsibilities of types and functional composition",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Mechanism"
                      },
                      {
                        "id": "col-2",
                        "heading": "What it describes"
                      },
                      {
                        "id": "col-3",
                        "heading": "Relation to execution"
                      }
                    ],
                    "rows": [
                      {
                        "id": "reactive-composition-roles-row-1",
                        "cells": [
                          "Pure functions / types",
                          "Inputs, outputs and valid connections",
                          "Check computation and composition locally"
                        ]
                      },
                      {
                        "id": "reactive-composition-roles-row-2",
                        "cells": [
                          "Consequence / flatMap",
                          "Dependent sequencing and failures",
                          "Stop subsequent processing on failure"
                        ]
                      },
                      {
                        "id": "reactive-composition-roles-row-3",
                        "cells": [
                          "Applicative / zip",
                          "Independent checks",
                          "Accumulate multiple input errors"
                        ]
                      },
                      {
                        "id": "reactive-composition-roles-row-4",
                        "cells": [
                          "Free Monad / UoW",
                          "Operation descriptions separate from execution",
                          "Share execution, commit and resource cleanup"
                        ]
                      }
                    ],
                    "coreRefs": {
                      "steps": [
                        "reactive-composition",
                        "reactive-uow"
                      ],
                      "claims": [
                        "reactive-composition-claim-1",
