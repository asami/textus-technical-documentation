                  }
                ],
                "rows": [
                  {
                    "id": "reactive-quality-benefits-row-1",
                    "cells": [
                      "Scalability",
                      "Increase capacity for heavily loaded processing",
                      "Separate processing and distribute load across execution instances"
                    ]
                  },
                  {
                    "id": "reactive-quality-benefits-row-2",
                    "cells": [
                      "Elasticity",
                      "Adjust capacity as demand changes",
                      "Combine instance scaling with admission control based on downstream capacity"
                    ]
                  },
                  {
                    "id": "reactive-quality-benefits-row-3",
                    "cells": [
                      "High availability",
                      "Continue service when part of the system stops",
                      "Contain failures and combine redundancy with routing to available instances"
                    ]
                  },
                  {
                    "id": "reactive-quality-benefits-row-4",
                    "cells": [
                      "Resilience / recoverability",
                      "Limit failure propagation and recover work",
                      "Isolate and record failures; manage retries and resumption"
                    ]
                  },
                  {
                    "id": "reactive-quality-benefits-row-5",
                    "cells": [
                      "Responsiveness",
                      "Limit response delays from long-running work and overload",
                      "Separate acceptance from completion; bound pending and concurrent work"
                    ]
                  },
                  {
                    "id": "reactive-quality-benefits-row-6",
                    "cells": [
                      "Extensibility / flexibility",
                      "Limit the impact of adding or changing components",
                      "Preserve message contracts while separating component processing and timing"
                    ]
                  },
                  {
                    "id": "reactive-quality-benefits-row-7",
                    "cells": [
                      "Resource efficiency / cost",
                      "Reduce resources held while waiting and excessive standing capacity",
                      "Combine non-blocking execution with demand-dependent resource allocation"
                    ]
                  }
                ],
                "coreRefs": {
