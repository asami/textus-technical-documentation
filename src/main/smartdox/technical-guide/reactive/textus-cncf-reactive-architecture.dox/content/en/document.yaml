        "blocks": [
          {
            "id": "textus-cncf-reactive-architecture-paragraph-1",
            "kind": "paragraph",
            "text": "Cloud applications require scalable processing capacity, flexibility to extend and change functionality, and high availability. Textus/CNCF embeds the complex execution controls supporting these qualities in shared infrastructure, so that development using CML models and standard CNCF facilities can obtain reactive behavior. This guide explains the architecture and combinations of mechanisms that make this division of responsibilities possible.",
