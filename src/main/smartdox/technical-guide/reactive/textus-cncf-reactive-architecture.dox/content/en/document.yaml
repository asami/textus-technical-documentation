                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "reactive-uow-section",
                "heading": "Separating Description and Execution with Free Monad and UoW",
                "coreRefs": {
                  "steps": [
                    "reactive-uow"
                  ],
                  "claims": [
                    "reactive-uow-claim-1",
                    "reactive-uow-claim-2"
                  ],
                  "nodes": [
                    "reactive-uow-node-1",
                    "reactive-uow-node-2"
                  ],
                  "relations": [
                    "reactive-uow-relation-1"
                  ],
                  "flows": [
                    "reactive-uow-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-uow-paragraph-1",
                    "kind": "paragraph",
                    "text": "A Free Monad Program composes descriptions of reads, writes, and external calls. ConsequenceT incorporates Consequence outcome and failure rules into that description. Consequence owns outcome semantics, the Free Monad owns operation description and composition, and the interpreter connects them to execution. This avoids embedding transport, resource management, and failure control together in business code.",
                    "coreRefs": {
                      "steps": [
                        "reactive-uow"
                      ],
                      "claims": [
                        "reactive-uow-claim-1"
                      ],
                      "nodes": [
                        "reactive-uow-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-uow-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-uow-paragraph-2",
                    "kind": "paragraph",
                    "text": "An ActionCall is an execution unit bound to an execution context. ActionEngine and UoW coordinate authorization, execution observation, commit and abort, and resource termination. Job-managed execution uses this same path. Security, consistency, and observability controls can therefore apply to the same operation without separate business implementations for synchronous and asynchronous execution. This boundary between operation descriptions and execution control supports maintainability, modifiability, and testability as well as security and consistency.",
                    "coreRefs": {
                      "steps": [
                        "reactive-uow"
                      ],
                      "claims": [
                        "reactive-uow-claim-2"
                      ],
                      "nodes": [
                        "reactive-uow-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-uow-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-uow-path",
                    "kind": "figure",
                    "asset": "images/reactive-uow-path-en.png",
                    "caption": "Figure 3. From business descriptions to shared execution. Consequence describes outcomes, Free Monad describes operations, and UoW owns commit and resource boundaries.",
                    "alt": "Figure 3. From business descriptions to shared execution. Consequence describes outcomes, Free Monad describes operations, and UoW owns commit and resource boundaries.",
                    "coreRefs": {
                      "steps": [
                        "reactive-uow"
                      ],
                      "claims": [
                        "reactive-uow-claim-1",
                        "reactive-uow-claim-2"
                      ],
                      "nodes": [
                        "reactive-uow-node-1",
                        "reactive-uow-node-2"
                      ],
                      "relations": [
                        "reactive-uow-relation-1"
                      ],
                      "flows": [
                        "reactive-uow-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "reactive-coordination-section",
            "heading": "Connecting Load and Business Progression to Execution Management",
            "coreRefs": {
              "steps": [
                "reactive-coordination"
              ],
              "claims": [
                "reactive-coordination-claim-1"
              ],
              "nodes": [
                "reactive-coordination-node-1",
                "reactive-coordination-node-effect"
              ],
              "relations": [
                "reactive-coordination-relation-effect"
              ],
              "flows": [
                "reactive-coordination-flow"
              ]
            },
            "blocks": [
              {
                "id": "reactive-coordination-paragraph-1",
                "kind": "paragraph",
                "text": "Jobs retain work identity and outcomes, capacity controls bound admitted work, and Events and business models define conditions for progression. Connecting admission to completion keeps asynchronous processing traceable and controllable.",
                "coreRefs": {
                  "steps": [
                    "reactive-coordination"
                  ],
                  "claims": [
                    "reactive-coordination-claim-1"
                  ],
                  "nodes": [
                    "reactive-coordination-node-1",
                    "reactive-coordination-node-effect"
                  ],
                  "relations": [
                    "reactive-coordination-relation-effect"
                  ],
                  "flows": [
                    "reactive-coordination-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "reactive-jobs-section",
                "heading": "Tracking Work from Admission to Completion through Job Management",
                "coreRefs": {
                  "steps": [
                    "reactive-jobs"
                  ],
                  "claims": [
                    "reactive-jobs-claim-1",
                    "reactive-jobs-claim-2",
                    "reactive-jobs-claim-3"
                  ],
                  "nodes": [
                    "reactive-jobs-node-1",
                    "reactive-jobs-node-2",
                    "reactive-jobs-node-3"
                  ],
                  "relations": [
                    "reactive-jobs-relation-1",
                    "reactive-jobs-relation-2"
                  ],
                  "flows": [
                    "reactive-jobs-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-jobs-paragraph-1",
                    "kind": "paragraph",
                    "text": "Long-running work can be admitted as a Job and continue after a Job identifier is returned. A synchronous interface can instead await its result. A Job is a managed work instance, and a Task is an observable execution step within it. Admission success is not business success; status and results establish completion. This distinction supports both UI responsiveness and traceability.",
                    "coreRefs": {
                      "steps": [
                        "reactive-jobs"
                      ],
                      "claims": [
                        "reactive-jobs-claim-1"
                      ],
                      "nodes": [
                        "reactive-jobs-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-jobs-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-jobs-paragraph-2",
                    "kind": "paragraph",
                    "text": "JobEngine manages queueing, start, results, retries, cancellation, and selected persistence for explicitly Job-managed work. Built-in asynchronous Commands and Event continuations connect to its scheduler path. Reducing separately launched asynchronous work keeps processing visible and subjects it to common load controls and operational inspection.",
                    "coreRefs": {
                      "steps": [
                        "reactive-jobs"
                      ],
                      "claims": [
                        "reactive-jobs-claim-2"
                      ],
                      "nodes": [
                        "reactive-jobs-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-jobs-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-jobs-paragraph-3",
                    "kind": "paragraph",
                    "text": "Tasks follow UoW commit and abort rules, but an entire Job is not necessarily one database transaction. A later Task can fail after an earlier Task has committed. Recording admission, individual Task outcomes, and the final Job result separately retains the facts required for retries, compensation, and user-facing results. Combining Job tracking with UoW commit management supports observability, recoverability, and consistency alongside responsiveness.",
                    "coreRefs": {
                      "steps": [
                        "reactive-jobs"
                      ],
                      "claims": [
                        "reactive-jobs-claim-3"
                      ],
                      "nodes": [
                        "reactive-jobs-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-jobs-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "reactive-load-section",
                "heading": "Applying Load and Resource Limits to Execution",
                "coreRefs": {
                  "steps": [
                    "reactive-load"
                  ],
                  "claims": [
                    "reactive-load-claim-1",
                    "reactive-load-claim-2",
                    "reactive-load-claim-3"
                  ],
                  "nodes": [
                    "reactive-load-node-1",
                    "reactive-load-node-2",
                    "reactive-load-node-3"
                  ],
                  "relations": [
                    "reactive-load-relation-1",
                    "reactive-load-relation-2"
                  ],
                  "flows": [
                    "reactive-load-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-load-paragraph-1",
                    "kind": "paragraph",
                    "text": "Worker concurrency is limited, and pending work, inputs, and retained results also require bounds. Requests beyond capacity are handled as refusals or waiting according to admission policy, distinct from accepted work. A queue alone does not solve overload; waiting time, memory, and execution slots must be managed together.",
                    "coreRefs": {
                      "steps": [
                        "reactive-load"
                      ],
                      "claims": [
                        "reactive-load-claim-1"
                      ],
                      "nodes": [
                        "reactive-load-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-load-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-load-paragraph-2",
                    "kind": "paragraph",
                    "text": "In message-driven systems, back-pressure adjusts sending or admission to receiver capacity. For Textus/CNCF, Job admission outcomes, backlog, and worker saturation provide inputs for Application-tier and operational control. Bounded admission should not be confused with implemented stream-demand control across every path.",
                    "coreRefs": {
                      "steps": [
                        "reactive-load"
                      ],
                      "claims": [
                        "reactive-load-claim-2"
                      ],
                      "nodes": [
                        "reactive-load-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-load-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-load-paragraph-3",
                    "kind": "paragraph",
                    "text": "Admission rate, queue time, execution time, retained memory, and failure rate inform Application concurrency and Domain capacity. Functional Subsystem boundaries, read-side Views, and authorized read-only Standby workloads provide additional controls. Maintaining responsiveness requires limiting contention and resource consumption rather than maximizing parallelism without bounds.",
                    "coreRefs": {
                      "steps": [
                        "reactive-load"
                      ],
                      "claims": [
                        "reactive-load-claim-3"
                      ],
                      "nodes": [
                        "reactive-load-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-load-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-job-admission",
                    "kind": "figure",
                    "asset": "images/reactive-job-admission-en.png",
                    "caption": "Figure 4. Job admission and execution. Admission, Task commit and Job completion are distinct; both queue size and concurrency are bounded.",
                    "alt": "Figure 4. Job admission and execution. Admission, Task commit and Job completion are distinct; both queue size and concurrency are bounded.",
                    "coreRefs": {
                      "steps": [
                        "reactive-jobs",
                        "reactive-load"
                      ],
                      "claims": [
                        "reactive-jobs-claim-1",
                        "reactive-jobs-claim-2",
                        "reactive-jobs-claim-3",
                        "reactive-load-claim-1",
                        "reactive-load-claim-2",
                        "reactive-load-claim-3"
                      ],
                      "nodes": [
                        "reactive-jobs-node-1",
                        "reactive-jobs-node-2",
                        "reactive-jobs-node-3",
                        "reactive-load-node-1",
                        "reactive-load-node-2",
                        "reactive-load-node-3"
                      ],
                      "relations": [
                        "reactive-jobs-relation-1",
                        "reactive-jobs-relation-2",
                        "reactive-load-relation-1",
                        "reactive-load-relation-2"
                      ],
                      "flows": [
                        "reactive-jobs-flow",
                        "reactive-load-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "reactive-events-section",
                "heading": "Connecting Events, Workflows, and State Machines",
                "coreRefs": {
                  "steps": [
                    "reactive-events"
                  ],
                  "claims": [
                    "reactive-events-claim-1",
                    "reactive-events-claim-2",
                    "reactive-events-claim-3"
                  ],
                  "nodes": [
                    "reactive-events-node-1",
                    "reactive-events-node-2",
                    "reactive-events-node-3"
                  ],
                  "relations": [
                    "reactive-events-relation-1",
                    "reactive-events-relation-2"
                  ],
                  "flows": [
                    "reactive-events-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-events-paragraph-1",
                    "kind": "paragraph",
                    "text": "Messages and business models describe different concerns. Their roles are connected explicitly, choosing synchronous execution, follow-up within the same Job, or a separate Job according to transaction relationships and response timing.",
                    "coreRefs": {
                      "steps": [
                        "reactive-events"
                      ],
                      "claims": [
                        "reactive-events-claim-1"
                      ],
                      "nodes": [
                        "reactive-events-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-events-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-events-paragraph-2",
                    "kind": "paragraph",
                    "text": "Workflows describe business progression, while state machines define allowed states and transitions. Binding execution steps to Operations and Jobs distinguishes business waiting, approval, and transitions from execution queueing, retries, and completion. Connecting model-defined progression to shared execution paths combines message-driven flexibility with business correctness.",
                    "coreRefs": {
                      "steps": [
                        "reactive-events"
                      ],
                      "claims": [
                        "reactive-events-claim-2"
                      ],
                      "nodes": [
                        "reactive-events-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-events-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-events-paragraph-3",
                    "kind": "paragraph",
                    "text": "Failure to dispatch follow-up work after a committed update does not undo that update. Commit and delivery outcomes are recorded separately for redelivery or recovery decisions. State consistency and resilient delivery depend on coordinating distinct boundaries. Connecting Event delivery to business transition rules makes message-driven flexibility compatible with data consistency and correctness.",
                    "coreRefs": {
                      "steps": [
                        "reactive-events"
                      ],
                      "claims": [
                        "reactive-events-claim-3"
                      ],
                      "nodes": [
                        "reactive-events-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-events-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-coordination-roles",
                    "kind": "table",
                    "caption": "Table 5. Distinguishing requests, facts, execution and business progression",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Element"
                      },
                      {
                        "id": "col-2",
                        "heading": "Concern"
                      },
                      {
                        "id": "col-3",
                        "heading": "Connection"
                      }
                    ],
                    "rows": [
                      {
                        "id": "reactive-coordination-roles-row-1",
                        "cells": [
                          "Command",
                          "Requested business action",
                          "Operation; direct response or Job"
                        ]
                      },
                      {
                        "id": "reactive-coordination-roles-row-2",
                        "cells": [
                          "Event",
                          "A fact that has occurred",
                          "View update, follow-up work and dispatch record"
                        ]
                      },
                      {
                        "id": "reactive-coordination-roles-row-3",
                        "cells": [
                          "Job / Task",
                          "Execution and observable stages",
                          "UoW, retry, cancellation and outcomes"
                        ]
