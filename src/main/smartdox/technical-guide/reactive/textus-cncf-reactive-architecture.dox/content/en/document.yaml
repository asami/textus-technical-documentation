              {
                "id": "reactive-tiers-section",
                "heading": "Separating Application and Domain Tier Responsibilities",
                "coreRefs": {
                  "steps": [
                    "reactive-tiers"
                  ],
                  "claims": [
                    "reactive-tiers-claim-1",
                    "reactive-tiers-claim-2",
                    "reactive-tiers-claim-3"
                  ],
                  "nodes": [
                    "reactive-tiers-node-1",
                    "reactive-tiers-node-2",
                    "reactive-tiers-node-3"
                  ],
                  "relations": [
                    "reactive-tiers-relation-1",
                    "reactive-tiers-relation-2"
                  ],
                  "flows": [
                    "reactive-tiers-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-tiers-paragraph-1",
                    "kind": "paragraph",
                    "text": "The UI tier owns user interaction. The Application tier handles request admission, authentication and input binding, use-case coordination, Domain Operation invocation, and responses. The Domain tier owns business rules, invariants, state transitions, and authoritative updates. Applications invoke public Domain operations instead of updating its DataStore directly, preserving business consistency across additional UIs and ingress paths.",
                    "coreRefs": {
                      "steps": [
                        "reactive-tiers"
                      ],
                      "claims": [
                        "reactive-tiers-claim-1"
                      ],
                      "nodes": [
                        "reactive-tiers-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-tiers-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-tiers-paragraph-2",
                    "kind": "paragraph",
                    "text": "The Application tier prefers Cloud Functions where appropriate, using short-lived execution and demand-dependent concurrency. The Domain tier runs as long-lived Subsystems that reuse resident data and indexes. DataStores retain persistent data. Avoiding Domain initialization for each request while adjusting public-side processing capacity supports performance and operating cost.",
                    "coreRefs": {
                      "steps": [
                        "reactive-tiers"
                      ],
                      "claims": [
                        "reactive-tiers-claim-2"
                      ],
                      "nodes": [
                        "reactive-tiers-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-tiers-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-tiers-paragraph-3",
                    "kind": "paragraph",
                    "text": "Scaling the Application tier alone does not increase Domain or DataStore capacity. Ingress concurrency, admission limits, and pending Job capacity must be designed against downstream capacity. Elasticity combines capacity adjustment with load control to maintain response time and stability; it does not mean accepting unlimited work. Coordinating Application scaling with Domain admission is what makes scalability and elasticity compatible with responsiveness.",
                    "coreRefs": {
                      "steps": [
                        "reactive-tiers"
                      ],
                      "claims": [
                        "reactive-tiers-claim-3"
                      ],
                      "nodes": [
                        "reactive-tiers-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-tiers-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-tier-map",
                    "kind": "figure",
                    "asset": "images/reactive-tier-map-en.png",
                    "caption": "Figure 1. Tiers and capacity. Application scaling is coordinated with Domain admission limits; durable state remains in DataStore.",
                    "alt": "Figure 1. Tiers and capacity. Application scaling is coordinated with Domain admission limits; durable state remains in DataStore.",
                    "coreRefs": {
                      "steps": [
                        "reactive-tiers"
                      ],
                      "claims": [
                        "reactive-tiers-claim-1",
                        "reactive-tiers-claim-2",
                        "reactive-tiers-claim-3"
                      ],
                      "nodes": [
                        "reactive-tiers-node-1",
