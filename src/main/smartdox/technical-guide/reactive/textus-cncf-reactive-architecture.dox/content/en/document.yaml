              ]
            },
            "blocks": [
              {
                "id": "reactive-conclusion-paragraph-1",
                "kind": "paragraph",
                "text": "Textus/CNCF connects model and component structures to shared execution mechanisms, centralizing the complex controls required for asynchronous processing. By using CML models and standard CNCF facilities, developers can use the mechanisms supporting reactive qualities without implementing them individually. The architecture combines development focused on business meaning with execution supporting responsiveness, resilience, and elasticity.",
                "coreRefs": {
