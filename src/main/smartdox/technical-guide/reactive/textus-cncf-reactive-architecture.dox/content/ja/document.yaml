                  "flows": [
                    "reactive-cqrs-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-cqrs-paragraph-1",
                    "kind": "paragraph",
                    "text": "CQRSでは、Commandが業務状態を変更し、Queryが状態を参照します。Textus/CNCFのモデルでは、Entityを業務データの正本とし、Aggregateが更新側の操作と不変条件を、Viewが参照側の情報構成を担います。画面に便利なViewの形で更新規則を決めず、Aggregateの業務操作を通して変更します。整合性を守る更新経路と、応答性を高める参照経路を別々に調整できます。",
                    "coreRefs": {
                      "steps": [
                        "reactive-cqrs"
                      ],
                      "claims": [
                        "reactive-cqrs-claim-1"
                      ],
                      "nodes": [
                        "reactive-cqrs-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-cqrs-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-cqrs-paragraph-2",
                    "kind": "paragraph",
                    "text": "更新から生じたEventを、Viewの再構成や無効化、後続処理の契機へ接続します。参照側の投影は再構築可能な派生状態として扱います。非同期で反映する場合には、更新の確定とViewの反映完了が同時とは限らないため、必要な鮮度と更新後の再参照条件を定めます。CQRSとメッセージ駆動を組み合わせる際は、この整合性の条件が応答性との接点になります。",
                    "coreRefs": {
                      "steps": [
                        "reactive-cqrs"
                      ],
                      "claims": [
                        "reactive-cqrs-claim-2"
                      ],
                      "nodes": [
                        "reactive-cqrs-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-cqrs-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-cqrs-paragraph-3",
                    "kind": "paragraph",
                    "text": "Queryは通常、直接実行して結果を返します。Commandについても、現在の実行契約では直接応答とJob管理を明示的に選択します。すべてのCommandを必ずJobにすることや、すべての参照を別の分散ストアへ移すことを前提にしません。業務の要求に応じて必要な分離を選び、待ち時間と実行管理の費用を抑えます。 Aggregate・View・Eventの分担が、データ整合性を保ちつつ参照の性能を調整するための構造になります。",
                    "coreRefs": {
