                "blocks": [
                  {
                    "id": "reactive-resources-paragraph-1",
                    "kind": "paragraph",
                    "text": "UoWは、処理中に取得した実行用資源を管理し、成功、失敗、中止、破棄の終端で解放します。トランザクションのcommit・abortと、プロセスや一時ストリーム等の解放は別の責務として接続します。一つの解放が失敗しても残りを試み、元の失敗原因と解放時の失敗を保持します。資源の漏れによる継続的な性能低下を抑えるための仕組みです。",
                    "coreRefs": {
                      "steps": [
                        "reactive-resources"
                      ],
