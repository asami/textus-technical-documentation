                  ],
                  "relations": [
                    "reactive-memory-relation-1",
                    "reactive-memory-relation-2"
                  ],
                  "flows": [
                    "reactive-memory-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-memory-paragraph-1",
                    "kind": "paragraph",
                    "text": "Domain SubsystemはEntitySpace、Entity Realm、索引、辞書、キャッシュなどをメモリに保持し、繰り返しの取得と再構成を減らします。常駐範囲はEntityの用途と状態で定めます。安定したマスターは常駐候補、状態を持つ業務Entityは実行中のものを候補とし、文書本文や画像などの大きな内容は別の保存・参照経路へ分けます。モデル上の分類と常駐方針を結び付け、応答性とメモリ使用量を両立させます。",
                    "coreRefs": {
                      "steps": [
                        "reactive-memory"
                      ],
                      "claims": [
                        "reactive-memory-claim-1"
                      ],
                      "nodes": [
                        "reactive-memory-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-memory-paragraph-2",
                    "kind": "paragraph",
                    "text": "メモリ常駐は性能の仕組みであり、永続性の代わりではありません。更新はDomainの規則とUoWを通して保存先へ確定し、その結果に従ってWorking SetやViewを更新・無効化します。常駐している古いリビジョンを根拠に保存先の競合検査を省略しません。これにより、高速な参照経路を使いながら、更新の整合性と障害後の再構築可能性を保ちます。",
                    "coreRefs": {
                      "steps": [
                        "reactive-memory"
                      ],
                      "claims": [
                        "reactive-memory-claim-2"
                      ],
                      "nodes": [
                        "reactive-memory-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-memory-paragraph-3",
                    "kind": "paragraph",
                    "text": "Working Setの読込み中は、適用対象の検索を永続ストアへフォールバックさせ、未読込みの集合を空の業務データとして扱わないようにします。長時間動作するサーバーはウォームアップの費用を継続利用で回収し、短命なコマンド実行はストア中心の経路を選べます。通常時の性能だけでなく、起動時の応答と復旧時間も含めた設計です。 常駐範囲、永続化、再構築を一緒に定めることで、性能・応答性、データ整合性、回復可能性、資源効率を調整します。",
                    "coreRefs": {
                      "steps": [
                        "reactive-memory"
                      ],
                      "claims": [
                        "reactive-memory-claim-3"
                      ],
                      "nodes": [
                        "reactive-memory-node-3"
