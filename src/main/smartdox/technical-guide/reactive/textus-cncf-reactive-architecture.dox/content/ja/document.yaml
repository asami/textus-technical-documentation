                  {
                    "id": "reactive-tiers-paragraph-2",
                    "kind": "paragraph",
                    "text": "Application tierは、適した処理にCloud Functionを優先し、短命な実行と要求量に応じた実行数の調整を利用します。Domain tierは、メモリ上のデータや索引を継続利用する長寿命のSubsystemとして構成します。永続データはDataStoreが保持します。要求ごとにDomainを初期化する費用を避けつつ、公開側の処理量を調整する構成が、性能と運用コストを支えます。",
                    "coreRefs": {
                      "steps": [
                        "reactive-tiers"
                      ],
                      "claims": [
                        "reactive-tiers-claim-2"
                      ],
                      "nodes": [
                        "reactive-tiers-node-2"
