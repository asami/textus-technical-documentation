              {
                "id": "reactive-foundation-paragraph-complexity",
                "kind": "paragraph",
                "text": "非同期化すると、処理の順序や完了の確認、データの整合性、再試行に伴う重複実行など、管理すべき事項が増えます。これらの制御を業務処理ごとに実装すると、処理間で方式が異なり、システム全体で一貫した動作を保つことが難しくなります。",
                "coreRefs": {
                  "steps": [
