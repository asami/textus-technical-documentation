                    }
                  },
                  {
                    "id": "reactive-resources-paragraph-2",
                    "kind": "paragraph",
                    "text": "Jobの取消しは実行中の処理へ停止を伝え、資源の終了確認と回収はそのライフサイクルに従って行います。応答の待機がタイムアウトしたこと、取消しを要求したこと、実際に処理が止まったことは同じではありません。これらを区別することで、資源を残したまま完了扱いすることや、既に確定した処理を未実行として扱うことを防ぎます。 取消しと解放の管理は資源効率を保ち、蓄積した未終了処理が応答性や耐障害性を損なうことを抑えます。",
                    "coreRefs": {
                      "steps": [
