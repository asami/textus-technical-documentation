                  {
                    "id": "reactive-composition-paragraph-2",
                    "kind": "paragraph",
                    "text": "純粋関数は、明示した入力から出力を求める計算として扱い、隠れた状態への依存を減らします。モナドは依存関係を、アプリカティブは独立して組み合わせられる構造を表します。これらは非同期化や並列実行を自動的に保証するものではありません。型と合成規則で検査できる範囲を広げ、共通の実行機構へ処理を渡しやすくすることが、保守性・検証容易性とリアクティブな実行をつなぐ役割です。",
