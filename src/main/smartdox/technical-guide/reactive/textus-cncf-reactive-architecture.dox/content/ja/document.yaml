          {
            "id": "textus-cncf-reactive-architecture-paragraph-1",
            "kind": "paragraph",
            "text": "クラウドアプリケーションには、負荷に応じた処理能力の拡大、機能の拡張や変更への柔軟性、高可用性が求められます。Textus/CNCFは、これらを支える複雑な実行制御を共通基盤に組み込み、CMLのモデルとCNCFの標準機能を使う開発からリアクティブな動作を得られるようにしています。本書では、この分担を実現するアーキテクチャと技術の組合せを説明します。",
            "coreRefs": {
