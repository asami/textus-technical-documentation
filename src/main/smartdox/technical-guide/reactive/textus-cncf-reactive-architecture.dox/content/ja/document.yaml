            "blocks": [
              {
                "id": "reactive-state-paragraph-1",
                "kind": "paragraph",
                "text": "Domain tierでは、メモリによる高速な実行、永続状態による復旧、CQRSによる更新・参照の分担を組み合わせます。どれか一つだけで性能と整合性を満たすのではなく、それぞれの責務を保ったまま接続します。",
                "coreRefs": {
