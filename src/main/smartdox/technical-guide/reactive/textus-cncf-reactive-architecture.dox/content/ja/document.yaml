              {
                "id": "reactive-foundation-paragraph-1",
                "kind": "paragraph",
                "text": "バックエンドの処理を非同期のメッセージで連携させると、呼出し側と処理側が同時に動作し続ける必要がなくなり、部品ごとに処理能力や配置を調整しやすくなります。この分離に、容量の調整、負荷制御、障害の隔離と回復を組み合わせることで、次の品質改善につながります。",
