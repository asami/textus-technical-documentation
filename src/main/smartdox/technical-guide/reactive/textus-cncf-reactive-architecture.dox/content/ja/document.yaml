            "blocks": [
              {
                "id": "reactive-coordination-paragraph-1",
                "kind": "paragraph",
                "text": "Job管理で処理の所在と結果を保持し、容量制御で受け入れられる仕事を限定し、Eventと業務モデルで次に進む条件を定めます。受付から完了までをつなぐことで、非同期化した処理を追跡可能で制御可能なものとして扱います。",
                "coreRefs": {
