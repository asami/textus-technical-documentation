                    "id": "reactive-events-paragraph-1",
                    "kind": "paragraph",
                    "text": "メッセージと業務モデルは、それぞれ異なる対象を記述します。役割を区別した上で接続し、必要なトランザクション関係と応答時点に応じて、同期・同一Job内の後続・別Jobでの実行を選びます。",
