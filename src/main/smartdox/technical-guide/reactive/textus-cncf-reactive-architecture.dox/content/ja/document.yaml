                "blocks": [
                  {
                    "id": "reactive-qualities-paragraph-1",
                    "kind": "paragraph",
                    "text": "リアクティブ宣言は、応答性、耐障害性、弾力性、メッセージ駆動を相互に関連する四つの特性として整理しています。Textus/CNCFでは、負荷の変動や部分的な障害があっても、要求に対して適切な時間で結果、受付状態、失敗を返せることを目指します。単に処理を非同期化するだけでなく、その処理を受け入れ、実行し、結果を確認できる経路を設計します。参考：リアクティブ宣言（https://www.reactivemanifesto.org/）。",
                    "coreRefs": {
                      "steps": [
                        "reactive-qualities"
                      ],
                      "claims": [
                        "reactive-qualities-claim-1"
                      ],
                      "nodes": [
                        "reactive-qualities-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-qualities-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-qualities-paragraph-2",
                    "kind": "paragraph",
                    "text": "メッセージ駆動は、処理間の時間的な依存を減らし、負荷や障害を分離して扱うための構成です。Textus/CNCFでは、Command、Event、Jobで要求、発生した事実、実行管理を区別します。",
                    "coreRefs": {
                      "steps": [
                        "reactive-qualities"
                      ],
                      "claims": [
                        "reactive-qualities-claim-2"
                      ],
                      "nodes": [
                        "reactive-qualities-node-2"
