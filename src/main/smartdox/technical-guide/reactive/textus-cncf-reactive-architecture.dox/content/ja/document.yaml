                  ],
                  "relations": [
                    "reactive-scope-relation-1",
                    "reactive-scope-relation-2"
                  ],
                  "flows": [
                    "reactive-scope-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-scope-paragraph-1",
                    "kind": "paragraph",
                    "text": "開発者は、CMLでEntity、Aggregate、View、Workflow、状態機械、公開Operationを定義し、CNCFの標準機能で業務処理を組み立てます。モデル操作と標準APIが共通の実行経路につながるため、非同期処理のスケジューリング、進行の追跡、資源の管理などを個別に実装せずに利用できます。通常はこの作法に従い、必要な処理量や可用性に応じて配備と設定を調整します。業務固有の補償や許容するデータの鮮度などは、業務の条件として定めます。",
                    "coreRefs": {
                      "steps": [
                        "reactive-scope"
                      ],
                      "claims": [
                        "reactive-scope-claim-1"
                      ],
                      "nodes": [
                        "reactive-scope-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-scope-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-scope-paragraph-2",
                    "kind": "paragraph",
                    "text": "本書はリアクティブ性を支える技術体系の全体を扱います。ConsequenceとFree Monadの実装、共通のAction／UoW経路、Jobのスケジューリング・制御、Working Setの参照経路には実装があります。永続Jobの詳細な再開・資源予算・UoW連携には個別の実装・受入れ段階があり、可用性Profileや交代の全経路についても採用する版の対応範囲を確認します。分散Active-Active、複数拠点の可用性、全通信経路の自動的なバックプレッシャーを一括した提供済み機能とは扱いません。",
                    "coreRefs": {
                      "steps": [
                        "reactive-scope"
                      ],
                      "claims": [
                        "reactive-scope-claim-2"
                      ],
                      "nodes": [
                        "reactive-scope-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-scope-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-scope-paragraph-3",
                    "kind": "paragraph",
                    "text": "セキュリティ技術ガイドは、各層の権限と保護を説明します。UI技術ガイドは、表示、操作、受付・完了の見せ方を説明します。本書は、それらの背後で処理を継続し、負荷と失敗を扱う実行アーキテクチャを説明します。同じティア、コンポーネント、モデル、実行境界を複数の品質属性に活用する関係です。",
                    "coreRefs": {
                      "steps": [
                        "reactive-scope"
                      ],
                      "claims": [
