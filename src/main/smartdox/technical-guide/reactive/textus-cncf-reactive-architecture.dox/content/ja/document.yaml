              },
              {
                "id": "reactive-foundation-paragraph-runtime",
                "kind": "paragraph",
                "text": "Textus/CNCFでは、CMLで定義したモデルとCNCFの標準機能を使って業務処理を構成すると、その処理が共通の実行機構へ接続されます。ティアとコンポーネントの分担、メッセージによる連携、ジョブ管理、資源管理、障害対応がこの実行経路で働くため、開発者が業務処理ごとに非同期制御を組み立てる必要を減らせます。通常の開発では業務のモデルと処理に集中しながら、実行基盤によるリアクティブ性の支援を受けられます。技術的に難しい制御を基盤が引き受け、標準的な作法に沿う実装へ適用することが、このアーキテクチャの要点です。",
                "coreRefs": {
