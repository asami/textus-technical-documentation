                "blocks": [
                  {
                    "id": "reactive-composition-paragraph-1",
                    "kind": "paragraph",
                    "text": "Consequenceは、処理結果と構造化された失敗を扱います。前の結果に依存する処理はflatMapによって順につなぎ、失敗した場合に後続へ進まない構造にします。独立した入力検査はzip系APIでアプリカティブに合成し、複数項目のエラーをまとめます。この区別を型とAPIへ表すことで、業務処理と実行基盤が失敗の意味を共有でき、個別の例外処理とレビューの負担を減らします。",
                    "coreRefs": {
