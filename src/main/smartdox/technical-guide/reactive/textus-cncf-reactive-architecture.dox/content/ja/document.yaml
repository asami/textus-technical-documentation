                  ],
                  "flows": [
                    "reactive-jobs-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-jobs-paragraph-1",
                    "kind": "paragraph",
                    "text": "長時間の処理はJobとして受け付け、Jobの識別子を返してから実行を継続できます。同期インターフェースではJobの完了を待って結果を返す構成も選べます。Jobは実行単位、Taskはその中の観測可能な処理段階です。受付の成功は業務処理の成功ではなく、Jobの状態と結果を通して完了を確認します。この区別が、UIの応答性と処理の追跡可能性を両立させます。",
                    "coreRefs": {
                      "steps": [
                        "reactive-jobs"
                      ],
                      "claims": [
                        "reactive-jobs-claim-1"
                      ],
                      "nodes": [
                        "reactive-jobs-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-jobs-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-jobs-paragraph-2",
                    "kind": "paragraph",
                    "text": "JobEngineは、明示的にJob管理を選択した処理の待機、開始、結果、再試行、取消し、必要な永続化を管理します。組込みの非同期CommandやEventの後続処理は、このスケジューラーの経路へ接続します。個別に非同期処理を起動する実装を減らすことで、処理中の仕事を見失わず、負荷制御と運用上の確認を同じ対象へ適用できます。",
                    "coreRefs": {
                      "steps": [
                        "reactive-jobs"
                      ],
                      "claims": [
                        "reactive-jobs-claim-2"
                      ],
                      "nodes": [
                        "reactive-jobs-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-jobs-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-jobs-paragraph-3",
                    "kind": "paragraph",
                    "text": "Taskの実行はUoWの確定・中止の規則に従いますが、Job全体が一つのデータベース・トランザクションとは限りません。前のTaskが確定した後に後続が失敗する場合があります。処理の受付、各Taskの確定、Jobの最終結果を区別して記録することで、再試行や補償、利用者への結果表示に必要な事実を保持します。 Jobの追跡とUoWの確定管理を組み合わせることで、応答性だけでなく、観測可能性・回復可能性・データ整合性を支えます。",
                    "coreRefs": {
                      "steps": [
                        "reactive-jobs"
                      ],
                      "claims": [
