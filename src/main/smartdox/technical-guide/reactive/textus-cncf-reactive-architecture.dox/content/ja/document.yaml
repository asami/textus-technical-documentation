                "id": "reactive-conclusion-paragraph-1",
                "kind": "paragraph",
                "text": "Textus/CNCFは、モデルとコンポーネントの構造を共通の実行機構へ接続し、非同期処理の複雑な制御を基盤に集約します。開発者はCMLのモデルとCNCFの標準機能を使うことで、リアクティブ性を支える仕組みを個別に実装せずに利用できます。業務に集中できる開発方法と、応答性・耐障害性・弾力性を支える実行を一体にすることが、このアーキテクチャの効果です。",
