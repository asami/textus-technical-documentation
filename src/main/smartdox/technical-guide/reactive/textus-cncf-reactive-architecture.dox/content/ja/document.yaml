                  {
                    "id": "reactive-observability-paragraph-1",
                    "kind": "paragraph",
                    "text": "要求、Operation、Job、Task、UoW、Eventの識別子と相関を用いて、受付から完了までをたどります。待機時間と実行時間、ワーカーの飽和、再試行、確定後の配送失敗を区別して記録すると、遅延が入口、実行、保存、後続処理のどこで生じたかを確認できます。観測可能性は、弾力性の調整と耐障害性の運用判断を支えます。",
                    "coreRefs": {
                      "steps": [
                        "reactive-observability"
                      ],
                      "claims": [
                        "reactive-observability-claim-1"
                      ],
                      "nodes": [
                        "reactive-observability-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-observability-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-observability-paragraph-2",
                    "kind": "paragraph",
                    "text": "型と実行仕様で確認する性質に加え、過負荷での受付、競合更新、失敗時の解放、取消し、再試行、プロセス再起動、Standbyへの交代をシナリオとして検証します。応答時間や処理量は、実際のデータ量、常駐範囲、並行数、外部依存を使って測定します。機構の存在と、対象システムが必要な品質を満たすことを結び付ける作業です。",
