                    }
                  },
                  {
                    "id": "reactive-qualities-paragraph-3",
                    "kind": "paragraph",
                    "text": "非同期な構成の利点を活かすには、データ整合性やセキュリティを保ち、分離した処理を観測・検証できることも必要です。以下では、こうした制御を含め、Textus/CNCFの技術の組合せを十の品質属性から整理します。",
