                        "reactive-recovery-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-recovery-paragraph-2",
                    "kind": "paragraph",
                    "text": "再試行は同じ論理的な仕事に対する新しい実行試行です。対象となる失敗、回数、待機、冪等性の条件を定めます。前のTaskが確定済みの場合は、業務上の取消しに相当する補償操作を明示的にモデル化します。基盤が更新内容から自動的に取消しの意味を推測することはありません。補償できない場合や補償が失敗した場合は、回復が必要な状態として残します。",
                    "coreRefs": {
                      "steps": [
                        "reactive-recovery"
                      ],
                      "claims": [
                        "reactive-recovery-claim-2"
                      ],
                      "nodes": [
                        "reactive-recovery-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-recovery-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-recovery-paragraph-3",
                    "kind": "paragraph",
                    "text": "Jobの記録を保存しても、外部作用を安全に再実行できるとは限りません。再開には入力、定義、権限、プロバイダー、互換性、冪等性などの条件を確認します。開始済みで結果が確定できない仕事は、未実行とみなして自動再投入せず、回復判断の対象にします。永続記録と再開条件を組み合わせることで、復旧による重複実行を抑えます。",
