                  ],
                  "flows": [
                    "reactive-availability-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "reactive-availability-paragraph-1",
                    "kind": "paragraph",
                    "text": "Domain Subsystemの可用性設計では、Activeが更新を担当し、Standbyは準備状態を保ちながら、整合性条件が許す読取りやキャッシュ処理を担当できます。Standbyを無条件に第二の更新系とは扱いません。CQRSによる読取り・更新の区別を配備と権限へつなぎ、参照性能と更新の一貫性を保ちながら交代先を準備します。",
                    "coreRefs": {
                      "steps": [
                        "reactive-availability"
                      ],
                      "claims": [
                        "reactive-availability-claim-1"
                      ],
                      "nodes": [
                        "reactive-availability-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-availability-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-availability-paragraph-2",
                    "kind": "paragraph",
                    "text": "交代先は、受け入れたCARと設定、永続状態から起動し、必要なメモリをウォームアップして準備状態を確認します。新規要求の経路と更新権限を切り替え、旧系の処理をドレインして終了します。定期交換、リリース、障害時の交代に共通する経路を使う構想によって、復旧手順を通常運用でも確認し、長寿命のメモリ利用と交換可能性を両立させます。",
                    "coreRefs": {
                      "steps": [
                        "reactive-availability"
                      ],
                      "claims": [
                        "reactive-availability-claim-2"
                      ],
                      "nodes": [
                        "reactive-availability-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-availability-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-availability-paragraph-3",
                    "kind": "paragraph",
                    "text": "HA構成は、必要な復旧時間と費用に合わせて選びます。再構築可能なメモリ、更新権限の切替え、依存先の可用性を揃えることが、可用性・耐障害性と回復可能性を支える条件です。",
                    "coreRefs": {
                      "steps": [
                        "reactive-availability"
                      ],
                      "claims": [
                        "reactive-availability-claim-3"
                      ],
                      "nodes": [
                        "reactive-availability-node-3"
