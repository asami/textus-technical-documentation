                "blocks": [
                  {
                    "id": "reactive-tiers-paragraph-1",
                    "kind": "paragraph",
                    "text": "UI tierは利用者との対話を、Application tierは要求の受付、認証情報と入力の接続、ユースケースの調整、DomainのOperation呼出し、結果の返却を担当します。Domain tierは業務規則、不変条件、状態遷移、更新の確定を担当します。Application tierからDomain内部のDataStoreを直接更新せず、公開された操作を通すことで、UIや受付方式が増えても業務の整合性を同じ経路で維持します。",
                    "coreRefs": {
                      "steps": [
                        "reactive-tiers"
                      ],
                      "claims": [
                        "reactive-tiers-claim-1"
                      ],
                      "nodes": [
                        "reactive-tiers-node-1"
