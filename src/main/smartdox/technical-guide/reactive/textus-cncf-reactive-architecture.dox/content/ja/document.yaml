                  {
                    "id": "reactive-events-paragraph-2",
                    "kind": "paragraph",
                    "text": "Workflowは業務の進行を、状態機械は対象が取り得る状態と許される遷移を記述します。その中の実行をOperationやJobへ結び付けることで、業務上の待機・承認・遷移と、処理の待機・再試行・完了を区別します。モデルで許された進行を共通の実行経路へ渡すことが、メッセージ駆動の柔軟性と業務の正しさを両立させます。",
                    "coreRefs": {
