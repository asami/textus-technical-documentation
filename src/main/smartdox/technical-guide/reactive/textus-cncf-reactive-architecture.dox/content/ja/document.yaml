                      "flows": [
                        "reactive-load-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-load-paragraph-2",
                    "kind": "paragraph",
                    "text": "メッセージ駆動の構成では、受信側の処理能力に合わせて送信や受付を調整することがバックプレッシャーの役割です。Textus/CNCFでは、Jobの受付結果、待機量、ワーカーの飽和状態を、Application tierや運用側の制御へ接続する設計が重要になります。受付制限があることと、全経路にストリーム型の需要制御が実装されていることは区別します。",
                    "coreRefs": {
                      "steps": [
                        "reactive-load"
                      ],
                      "claims": [
                        "reactive-load-claim-2"
                      ],
                      "nodes": [
                        "reactive-load-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "reactive-load-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-load-paragraph-3",
                    "kind": "paragraph",
                    "text": "受付率、待機時間、実行時間、保持メモリ、失敗率を観測し、Applicationの実行数とDomainの容量を調整します。Subsystemの機能分割、参照用View、許可されたStandbyへの読取り分散も調整手段です。応答性を維持するために、無制限な並列化ではなく、競合と資源消費を抑えた構成を選びます。",
