                  {
                    "id": "reactive-recovery-paragraph-1",
                    "kind": "paragraph",
                    "text": "Consequence／Conclusionによって、入力の誤り、認可の拒否、業務条件の不成立、実行時の失敗などを構造化して伝えます。実行されなかった処理と、実行後に失敗した処理を区別し、JobやTaskの結果に関連付けます。単に例外を捕捉するだけでなく、どこまで処理したかを保持することが、耐障害性と観測可能性の前提です。",
                    "coreRefs": {
