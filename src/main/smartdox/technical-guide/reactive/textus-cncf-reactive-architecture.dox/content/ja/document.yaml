                    "reactive-memory"
                  ],
                  "claims": [
                    "reactive-memory-claim-1",
                    "reactive-memory-claim-2",
                    "reactive-memory-claim-3"
                  ],
                  "nodes": [
                    "reactive-memory-node-1",
