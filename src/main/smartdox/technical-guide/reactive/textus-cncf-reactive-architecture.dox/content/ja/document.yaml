                      "relations": [],
                      "flows": [
                        "reactive-tiers-flow"
                      ]
                    }
                  },
                  {
                    "id": "reactive-tiers-paragraph-3",
                    "kind": "paragraph",
                    "text": "Application tierだけを増やしても、DomainやDataStoreの処理能力は増えません。入口の同時実行数、受付制限、Jobの待機容量をDomainの容量と合わせて設計します。弾力性は無制限に仕事を受け付けることではなく、容量の増減と負荷の抑制を組み合わせ、応答時間と安定性を維持することとして扱います。 Applicationの伸縮とDomainの受付制御を連動させることが、拡張性・弾力性を性能・応答性と両立させる条件です。",
                    "coreRefs": {
                      "steps": [
                        "reactive-tiers"
                      ],
                      "claims": [
                        "reactive-tiers-claim-3"
