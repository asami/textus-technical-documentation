                "blocks": [
                  {
                    "id": "reactive-uow-paragraph-1",
                    "kind": "paragraph",
                    "text": "Free MonadによるProgramは、保存、参照、外部呼出しなどの操作を記述として組み合わせます。ConsequenceTは、その記述へConsequenceの結果・失敗の規則を組み込みます。Consequenceが結果の意味を、Free Monadが操作の記述と合成を担当し、インタープリタが実際の実行経路へ接続します。業務コードへ通信、資源管理、失敗処理を一体で埋め込まずに済む構造です。",
