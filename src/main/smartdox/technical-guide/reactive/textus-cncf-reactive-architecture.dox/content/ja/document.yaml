                  {
                    "id": "reactive-uow-paragraph-2",
                    "kind": "paragraph",
                    "text": "ActionCallは実行コンテキストに結び付いた処理単位であり、ActionEngineとUoWが認可との連携、実行の観測、commit・abort、資源の終了処理を担当します。Jobから実行する場合も、この共通経路を利用します。同期・非同期ごとに別の業務実装を用意せず、同じ操作へ安全性・整合性・観測可能性の制御を適用することができます。 操作の記述と実行制御を分離したこの境界は、セキュリティと整合性に加えて、保守性・変更容易性、検証容易性にも寄与します。",
