                    "text": "データ更新が確定した後で後続処理の投入に失敗した場合、その失敗によって既に確定した更新が取り消されたとは扱いません。更新の確定と配送の結果を別々に記録し、再配送や回復の判断へつなぎます。状態の整合性と配送の耐障害性は、異なる境界を連携させて確保します。 Eventの配送と業務の遷移規則を接続することで、メッセージ駆動の柔軟性をデータ整合性・正確性と両立させます。",
