                "blocks": [
                  {
                    "id": "reactive-load-paragraph-1",
                    "kind": "paragraph",
                    "text": "ワーカーの並行実行数を制限し、待機する処理や入力、結果などの保持量にも上限を設けます。処理能力を超える要求は、選択した受付方針に従って拒否や待機として扱い、受付できた仕事と区別します。キューを置くだけでは過負荷を解決できないため、待機時間、メモリ、実行枠を合わせて管理することが必要です。",
                    "coreRefs": {
                      "steps": [
