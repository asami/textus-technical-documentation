              },
              {
                "id": "textus-cncf-knowledge-modeling-boundary-paragraph-2",
                "kind": "paragraph",
                "text": "TerminologyメタデータとCMLの生成契約には仕様があります。一方、任意のBoKを読み込んで適切なEntityを自動設計し、知識提供まで一括して完了する機能を本書は前提としません。利用する用語管理、対応検査、生成、実行の範囲をプロジェクトで確認し、小さな業務例で接続を確かめます。",
