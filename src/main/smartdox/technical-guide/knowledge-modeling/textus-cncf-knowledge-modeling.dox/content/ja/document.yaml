              {
                "id": "textus-cncf-knowledge-modeling-change-paragraph-2",
                "kind": "paragraph",
                "text": "AIは共有された用語と受理したモデルを根拠に設計・実装を補助できます。対応漏れや不整合を対象の文書・モデルへ結び付けて返す検査と組み合わせると、修正する範囲を絞れます。知識の提示だけでなく、その知識と成果物の対応を保つ仕組みが知識ハーネスになります。",
