          {
            "id": "textus-cncf-knowledge-modeling-paragraph-1",
            "kind": "paragraph",
            "text": "業務知識をソフトウェアの設計へ使うには、用語の意味と、その意味を実現するモデルの対応を保持する必要があります。本書は、BoKとプロジェクト固有の知識から文芸モデル、CML、Cozyによる具体化へ進む設計経路を説明します。Entityを実行時に知識として提供する経路は、別のガイドで扱います。",
            "coreRefs": {
              "steps": [
