              {
                "id": "textus-cncf-knowledge-modeling-change-paragraph-1",
                "kind": "paragraph",
                "text": "変更時は、用語の意味、適用する業務、規則のどこが変わったかを先に定めます。関連する文芸モデルとCMLを更新し、生成物と補完処理への影響を確認します。機械的検査は参照・型・形式化した条件を確認し、人間のレビューは業務上の区別や規則の妥当性を判断します。",
                "coreRefs": {
