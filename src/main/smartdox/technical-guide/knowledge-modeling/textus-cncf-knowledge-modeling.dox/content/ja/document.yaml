            "blocks": [
              {
                "id": "textus-cncf-knowledge-modeling-model-paragraph-1",
                "kind": "paragraph",
                "text": "文芸モデルに業務の背景、要求、用語の定義、実例と判断理由を記述し、CMLで構造・型・関係・規則を形式化します。継続して識別する対象はEntity、値として扱うものはValueやDatatype、振る舞いはOperationや状態機械などへ分担します。BoKの各用語を一律にEntityへ変換する方式ではありません。",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-knowledge-modeling-model"
                  ],
                  "claims": [
                    "textus-cncf-knowledge-modeling-model-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-knowledge-modeling-model-node-1",
