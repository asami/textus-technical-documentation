                  ],
                  "flows": [
                    "textus-cncf-knowledge-modeling-model-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-knowledge-modeling-model-paragraph-2",
                "kind": "paragraph",
                "text": "書籍の例では、管理する版と所蔵する一冊を分け、ISBNが識別する対象と適用条件を定めます。タイトルや識別子の型、対象同士の関係、変更する公開操作を同じ文脈で決めます。要求された区別を型と関係へ表すことで、実装時に意味を推測し直す範囲を減らします。",
                "coreRefs": {
