              },
              {
                "id": "textus-cncf-knowledge-modeling-projection-paragraph-2",
                "kind": "paragraph",
                "text": "CozyのTerminologyメタデータ仕様は、用語参照、モデル要素、ラベル、出典、参照の範囲を区別して保持します。同じ名前であることから参照や同義関係を推測するものではありません。この明示的な対応と生成契約を使うことで、どの業務上の定義がどの型・操作へつながるかを確認できます。",
