              {
                "id": "textus-cncf-knowledge-modeling-boundary-paragraph-1",
                "kind": "paragraph",
                "text": "本書の成果は、知識を根拠として設計されたモデルと、その対応関係です。実行時の個々の書籍データをInformationやRDF等へ接続する仕組みは、「Entityを知識として扱う」ガイドで説明します。モデル定義と業務データを分けた上で識別子と対応をつなぎ、設計時の意味を実行時にも利用します。",
