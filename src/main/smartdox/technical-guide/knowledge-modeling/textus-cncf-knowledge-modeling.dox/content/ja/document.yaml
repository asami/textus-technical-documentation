              {
                "id": "textus-cncf-knowledge-modeling-projection-paragraph-1",
                "kind": "paragraph",
                "text": "CozyはCMLを解析し、受理した型・制約・Operationの契約を、型付きコード、スキーマ、実行定義や接続構造へ具体化します。Textus／CNCFはその定義と登録された処理を利用します。業務固有の計算や外部接続は、生成された型と公開契約の中で補完します。",
                "coreRefs": {
