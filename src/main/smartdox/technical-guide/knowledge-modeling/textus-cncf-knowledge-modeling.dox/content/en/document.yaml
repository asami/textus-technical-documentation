          {
            "id": "textus-cncf-knowledge-modeling-change-section",
            "heading": "Relating Changes Back to Knowledge and Models",
            "coreRefs": {
              "steps": [
                "textus-cncf-knowledge-modeling-change"
              ],
              "claims": [
                "textus-cncf-knowledge-modeling-change-claim-1",
                "textus-cncf-knowledge-modeling-change-claim-2"
              ],
              "nodes": [
                "textus-cncf-knowledge-modeling-change-node-1",
                "textus-cncf-knowledge-modeling-change-node-2"
              ],
              "relations": [
                "textus-cncf-knowledge-modeling-change-relation-1"
              ],
              "flows": [
                "textus-cncf-knowledge-modeling-change-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-knowledge-modeling-change-paragraph-1",
                "kind": "paragraph",
                "text": "A change first identifies which meaning, business scope or rule has changed. Update the related literate model and CML, then inspect generated artifacts and supplementary behavior. Mechanical checks examine references, types and formalized conditions; human review judges business distinctions and rule validity.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-knowledge-modeling-change"
                  ],
                  "claims": [
                    "textus-cncf-knowledge-modeling-change-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-knowledge-modeling-change-node-1",
                    "textus-cncf-knowledge-modeling-change-node-2"
                  ],
                  "relations": [
                    "textus-cncf-knowledge-modeling-change-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-knowledge-modeling-change-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-knowledge-modeling-change-paragraph-2",
                "kind": "paragraph",
                "text": "AI can assist design and implementation using shared terms and admitted models. Checks that relate missing or inconsistent mappings back to specific documents and models narrow the correction scope. A knowledge harness combines useful knowledge with mechanisms that preserve its relationship to work products.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-knowledge-modeling-change"
                  ],
                  "claims": [
                    "textus-cncf-knowledge-modeling-change-claim-2"
                  ],
                  "nodes": [
                    "textus-cncf-knowledge-modeling-change-node-1",
                    "textus-cncf-knowledge-modeling-change-node-2"
                  ],
                  "relations": [
                    "textus-cncf-knowledge-modeling-change-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-knowledge-modeling-change-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "textus-cncf-knowledge-modeling-boundary-section",
            "heading": "Separating Design Knowledge from Runtime Knowledge",
            "coreRefs": {
              "steps": [
                "textus-cncf-knowledge-modeling-boundary"
              ],
              "claims": [
                "textus-cncf-knowledge-modeling-boundary-claim-1",
                "textus-cncf-knowledge-modeling-boundary-claim-2"
              ],
              "nodes": [
                "textus-cncf-knowledge-modeling-boundary-node-1",
                "textus-cncf-knowledge-modeling-boundary-node-2"
              ],
              "relations": [
                "textus-cncf-knowledge-modeling-boundary-relation-1"
              ],
              "flows": [
                "textus-cncf-knowledge-modeling-boundary-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-knowledge-modeling-boundary-paragraph-1",
                "kind": "paragraph",
                "text": "The outcome of this guide is a knowledge-informed model and its explicit mappings. The companion guide, Using Entities as Knowledge, describes connecting individual runtime book records to Information and representations such as RDF. Model definitions and business data remain distinct while identifiers and mappings connect their meanings.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-knowledge-modeling-boundary"
                  ],
                  "claims": [
                    "textus-cncf-knowledge-modeling-boundary-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-knowledge-modeling-boundary-node-1",
                    "textus-cncf-knowledge-modeling-boundary-node-2"
                  ],
                  "relations": [
                    "textus-cncf-knowledge-modeling-boundary-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-knowledge-modeling-boundary-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-knowledge-modeling-boundary-paragraph-2",
                "kind": "paragraph",
                "text": "Terminology metadata and CML generation have specified contracts. This guide does not assume a universal facility that reads any BoK, designs suitable Entities and completes knowledge delivery automatically. Confirm the selected terminology management, mapping checks, generation and runtime support, then exercise their connection with a small business example.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-knowledge-modeling-boundary"
                  ],
                  "claims": [
                    "textus-cncf-knowledge-modeling-boundary-claim-2"
                  ],
