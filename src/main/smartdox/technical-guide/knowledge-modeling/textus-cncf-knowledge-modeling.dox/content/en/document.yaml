        "blocks": [
          {
            "id": "textus-cncf-knowledge-modeling-paragraph-1",
            "kind": "paragraph",
            "text": "Using business knowledge in software design requires explicit relationships between term meanings and the models that realize them. This guide follows the design path from a BoK and project knowledge through literate models and CML to Cozy projection. A separate guide covers using Entities as knowledge at runtime.",
            "coreRefs": {
              "steps": [
                "textus-cncf-knowledge-modeling"
              ],
              "claims": [
                "textus-cncf-knowledge-modeling-claim-1"
              ],
              "nodes": [
                "textus-cncf-knowledge-modeling-node-1",
                "textus-cncf-knowledge-modeling-node-2"
              ],
              "relations": [
                "textus-cncf-knowledge-modeling-relation-1"
              ],
              "flows": [
                "textus-cncf-knowledge-modeling-flow"
              ]
            }
          }
        ],
        "sections": [
          {
            "id": "textus-cncf-knowledge-modeling-context-section",
            "heading": "Relating Shared Knowledge to Business Context",
            "coreRefs": {
              "steps": [
                "textus-cncf-knowledge-modeling-context"
              ],
              "claims": [
                "textus-cncf-knowledge-modeling-context-claim-1",
                "textus-cncf-knowledge-modeling-context-claim-2"
              ],
              "nodes": [
                "textus-cncf-knowledge-modeling-context-node-1",
                "textus-cncf-knowledge-modeling-context-node-2"
              ],
              "relations": [
                "textus-cncf-knowledge-modeling-context-relation-1"
              ],
              "flows": [
                "textus-cncf-knowledge-modeling-context-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-knowledge-modeling-context-paragraph-1",
                "kind": "paragraph",
                "text": "A BoK provides shared terms, concepts and technical knowledge. A project adds its business context, requirements, constraints and design decisions. Identifiers, sources and scopes distinguish shared definitions from project-specific definitions and expose cases where the same word has different meanings.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-knowledge-modeling-context"
                  ],
                  "claims": [
                    "textus-cncf-knowledge-modeling-context-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-knowledge-modeling-context-node-1",
                    "textus-cncf-knowledge-modeling-context-node-2"
                  ],
                  "relations": [
                    "textus-cncf-knowledge-modeling-context-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-knowledge-modeling-context-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-knowledge-modeling-context-paragraph-2",
                "kind": "paragraph",
                "text": "Matching names alone does not determine model elements. For example, a book may mean a work, an edition or a physical copy; each interpretation changes identity and attribute ownership. Prose and examples establish the intended subject and distinctions, and the decision is retained as a model mapping.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-knowledge-modeling-context"
                  ],
                  "claims": [
                    "textus-cncf-knowledge-modeling-context-claim-2"
                  ],
                  "nodes": [
                    "textus-cncf-knowledge-modeling-context-node-1",
                    "textus-cncf-knowledge-modeling-context-node-2"
                  ],
                  "relations": [
                    "textus-cncf-knowledge-modeling-context-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-knowledge-modeling-context-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "textus-cncf-knowledge-modeling-model-section",
            "heading": "Defining Entities, Values and Rules through Literate Models",
            "coreRefs": {
              "steps": [
                "textus-cncf-knowledge-modeling-model"
              ],
              "claims": [
                "textus-cncf-knowledge-modeling-model-claim-1",
                "textus-cncf-knowledge-modeling-model-claim-2"
              ],
              "nodes": [
                "textus-cncf-knowledge-modeling-model-node-1",
                "textus-cncf-knowledge-modeling-model-node-2"
              ],
              "relations": [
                "textus-cncf-knowledge-modeling-model-relation-1"
              ],
              "flows": [
                "textus-cncf-knowledge-modeling-model-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-knowledge-modeling-model-paragraph-1",
                "kind": "paragraph",
                "text": "Literate models retain context, requirements, term definitions, examples and rationale; CML formalizes structure, types, relationships and rules. Subjects requiring persistent identity become Entities, values become Values or Datatypes, and behavior uses Operations or state machines. BoK terms are not uniformly converted into Entities.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-knowledge-modeling-model"
                  ],
                  "claims": [
                    "textus-cncf-knowledge-modeling-model-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-knowledge-modeling-model-node-1",
                    "textus-cncf-knowledge-modeling-model-node-2"
                  ],
                  "relations": [
                    "textus-cncf-knowledge-modeling-model-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-knowledge-modeling-model-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-knowledge-modeling-model-paragraph-2",
                "kind": "paragraph",
                "text": "In the book example, distinguish a managed edition from a held copy and specify what an ISBN identifies and under which conditions. Define title and identifier types, relationships and public mutation operations in the same context. Types and relationships preserve required distinctions and reduce repeated interpretation during implementation.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-knowledge-modeling-model"
                  ],
                  "claims": [
                    "textus-cncf-knowledge-modeling-model-claim-2"
                  ],
                  "nodes": [
                    "textus-cncf-knowledge-modeling-model-node-1",
                    "textus-cncf-knowledge-modeling-model-node-2"
                  ],
                  "relations": [
                    "textus-cncf-knowledge-modeling-model-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-knowledge-modeling-model-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "textus-cncf-knowledge-modeling-projection-section",
            "heading": "Carrying Meaning into Types and Connections with Cozy",
            "coreRefs": {
              "steps": [
                "textus-cncf-knowledge-modeling-projection"
              ],
              "claims": [
                "textus-cncf-knowledge-modeling-projection-claim-1",
                "textus-cncf-knowledge-modeling-projection-claim-2"
              ],
              "nodes": [
                "textus-cncf-knowledge-modeling-projection-node-1",
                "textus-cncf-knowledge-modeling-projection-node-2"
              ],
              "relations": [
                "textus-cncf-knowledge-modeling-projection-relation-1"
              ],
              "flows": [
                "textus-cncf-knowledge-modeling-projection-flow"
              ]
            },
            "blocks": [
              {
                "id": "textus-cncf-knowledge-modeling-projection-paragraph-1",
                "kind": "paragraph",
                "text": "Cozy parses CML and projects admitted types, constraints and Operation contracts into typed code, schemas, runtime definitions and connections. Textus/CNCF consumes those definitions and registered behavior. Business-specific calculations and external integration supplement generated types and public contracts.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-knowledge-modeling-projection"
                  ],
                  "claims": [
                    "textus-cncf-knowledge-modeling-projection-claim-1"
                  ],
                  "nodes": [
                    "textus-cncf-knowledge-modeling-projection-node-1",
                    "textus-cncf-knowledge-modeling-projection-node-2"
                  ],
                  "relations": [
                    "textus-cncf-knowledge-modeling-projection-relation-1"
                  ],
                  "flows": [
                    "textus-cncf-knowledge-modeling-projection-flow"
                  ]
                }
              },
              {
                "id": "textus-cncf-knowledge-modeling-projection-paragraph-2",
                "kind": "paragraph",
                "text": "Cozy terminology metadata distinguishes term references, model elements, labels, attribution and reference boundaries. It does not infer references or synonyms from matching names. Explicit mappings and generation contracts allow a business definition to be traced to its types and operations.",
                "coreRefs": {
                  "steps": [
                    "textus-cncf-knowledge-modeling-projection"
                  ],
                  "claims": [
                    "textus-cncf-knowledge-modeling-projection-claim-2"
                  ],
