                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "fp-effects-section",
            "heading": "Describing Programs of Operations Executed through UoW",
            "coreRefs": {
              "steps": [
                "fp-effects"
              ],
              "claims": [
                "fp-effects-claim-1"
              ],
              "nodes": [
                "fp-effects-node-1",
                "fp-effects-node-2"
              ],
              "relations": [
                "fp-effects-relation-1"
              ],
              "flows": [
                "fp-effects-flow"
              ]
            },
            "blocks": [
              {
                "id": "fp-effects-paragraph-1",
                "kind": "paragraph",
                "text": "Shared outcome semantics do not determine where persistence or communication occurs or who manages it. Textus/CNCF uses UoW, or Unit of Work, as a unit of execution management and exposes typed operations for that path. Free Monad composes those operations into a program description before execution.",
                "coreRefs": {
                  "steps": [
                    "fp-effects"
                  ],
                  "claims": [
                    "fp-effects-claim-1"
                  ],
                  "nodes": [
                    "fp-effects-node-1",
                    "fp-effects-node-2"
                  ],
                  "relations": [
                    "fp-effects-relation-1"
                  ],
                  "flows": [
                    "fp-effects-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "fp-operation-algebra-section",
                "heading": "Defining an Operation Vocabulary and Its Types",
                "coreRefs": {
                  "steps": [
                    "fp-operation-algebra"
                  ],
                  "claims": [
                    "fp-operation-algebra-claim-1",
                    "fp-operation-algebra-claim-2"
                  ],
                  "nodes": [
                    "fp-operation-algebra-node-1",
                    "fp-operation-algebra-node-2"
                  ],
                  "relations": [
                    "fp-operation-algebra-relation-1"
                  ],
                  "flows": [
                    "fp-operation-algebra-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-operation-algebra-paragraph-1",
                    "kind": "paragraph",
                    "text": "UnitOfWorkOp[A] represents an operation and its arguments with a result type A. EntityStore reads and writes and HTTP requests are part of this typed vocabulary. Business programs compose public operations; the interpreter supplies their execution. This forms an internal DSL used within Scala.",
                    "coreRefs": {
                      "steps": [
                        "fp-operation-algebra"
                      ],
                      "claims": [
                        "fp-operation-algebra-claim-1"
                      ],
                      "nodes": [
                        "fp-operation-algebra-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-operation-algebra-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-operation-algebra-paragraph-2",
                    "kind": "paragraph",
                    "text": "An explicit vocabulary shares implementation choices and connection contracts. Callers need less repeated code for target selection, authorization and transaction control. Types alone cannot prevent direct I/O outside the common path, so dependency checks and review verify adherence to that boundary.",
                    "coreRefs": {
                      "steps": [
                        "fp-operation-algebra"
                      ],
                      "claims": [
                        "fp-operation-algebra-claim-2"
                      ],
                      "nodes": [
                        "fp-operation-algebra-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-operation-algebra-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "fp-free-program-section",
                "heading": "Separating Description from Interpretation with Free Monad",
                "coreRefs": {
                  "steps": [
                    "fp-free-program"
                  ],
                  "claims": [
                    "fp-free-program-claim-1",
                    "fp-free-program-claim-2"
                  ],
                  "nodes": [
                    "fp-free-program-node-1",
                    "fp-free-program-node-2"
                  ],
                  "relations": [
                    "fp-free-program-relation-1"
                  ],
                  "flows": [
                    "fp-free-program-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-free-program-paragraph-1",
                    "kind": "paragraph",
                    "text": "CNCF’s Program[F, A] is a Free Monad program combining operations F to obtain A. It describes dependencies such as saving data and choosing later operations from earlier responses. When construction handles only descriptions and immutable values, a program involving external operations can be assembled purely.",
                    "coreRefs": {
                      "steps": [
                        "fp-free-program"
                      ],
                      "claims": [
                        "fp-free-program-claim-1"
                      ],
                      "nodes": [
                        "fp-free-program-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-free-program-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-free-program-paragraph-2",
                    "kind": "paragraph",
                    "text": "The interpreter maps operations to concrete processing and supplies results to later steps. Free Monad separates business description from execution policy; it does not itself make external processing safe. Branches may depend on runtime responses, so not every path is enumerable beforehand. Verification checks operations and outcomes for supplied responses.",
                    "coreRefs": {
                      "steps": [
                        "fp-free-program"
                      ],
                      "claims": [
                        "fp-free-program-claim-2"
                      ],
                      "nodes": [
                        "fp-free-program-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-free-program-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "fp-combined-result-section",
                "heading": "Combining Consequence with Operation Descriptions",
                "coreRefs": {
                  "steps": [
                    "fp-combined-result"
                  ],
                  "claims": [
                    "fp-combined-result-claim-1",
                    "fp-combined-result-claim-2"
                  ],
                  "nodes": [
                    "fp-combined-result-node-1",
                    "fp-combined-result-node-2"
                  ],
                  "relations": [
                    "fp-combined-result-relation-1"
                  ],
                  "flows": [
                    "fp-combined-result-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-combined-result-paragraph-1",
                    "kind": "paragraph",
                    "text": "Consequence alone is not a deferred description of persistence or communication. Free Monad alone does not select how business failure is represented or stops a continuation. CNCF uses ConsequenceT to define UowM, combining a Program with Consequence outcomes. The combination handles operation descriptions and success/failure composition together.",
                    "coreRefs": {
                      "steps": [
                        "fp-combined-result"
                      ],
                      "claims": [
                        "fp-combined-result-claim-1"
                      ],
                      "nodes": [
                        "fp-combined-result-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-combined-result-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-combined-result-paragraph-2",
                    "kind": "paragraph",
                    "text": "A Consequence returned by a pure calculation can be lifted into the program, and its success value passed to a persistence operation. Business failure skips later operation construction; runtime failures return through the same outcome vocabulary. Types govern operation inputs and outputs, composition governs result flow, and the interpreter with UoW governs effects and commitment.",
                    "coreRefs": {
                      "steps": [
                        "fp-combined-result"
                      ],
                      "claims": [
                        "fp-combined-result-claim-2"
                      ],
                      "nodes": [
                        "fp-combined-result-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-combined-result-flow"
                      ]
                    }
                  },
                  {
                    "id": "program-and-outcome",
                    "kind": "figure",
                    "asset": "images/program-and-outcome-en.png",
                    "caption": "Consequence handles outcomes; Free Monad handles operation descriptions",
                    "alt": "Consequence handles outcomes; Free Monad handles operation descriptions",
                    "coreRefs": {
                      "steps": [
                        "fp-combined-result"
                      ],
                      "claims": [
                        "fp-combined-result-claim-1",
                        "fp-combined-result-claim-2"
                      ],
                      "nodes": [
                        "fp-combined-result-node-1",
                        "fp-combined-result-node-2"
                      ],
                      "relations": [
                        "fp-combined-result-relation-1"
                      ],
                      "flows": [
                        "fp-combined-result-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "fp-execution-section",
            "heading": "Passing Described Operations to Shared Execution",
            "coreRefs": {
              "steps": [
                "fp-execution"
              ],
              "claims": [
                "fp-execution-claim-1"
              ],
              "nodes": [
                "fp-execution-node-1",
                "fp-execution-node-2"
              ],
              "relations": [
                "fp-execution-relation-1"
              ],
              "flows": [
                "fp-execution-flow"
              ]
            },
            "blocks": [
              {
                "id": "fp-execution-paragraph-1",
                "kind": "paragraph",
                "text": "The assembled program is passed to an interpreter bound to an execution context. This connects described operations to authorization, Providers, storage and UoW termination. Model-governed calculations combine with environment-dependent controls to produce behavior.",
                "coreRefs": {
                  "steps": [
                    "fp-execution"
                  ],
                  "claims": [
                    "fp-execution-claim-1"
                  ],
                  "nodes": [
                    "fp-execution-node-1",
                    "fp-execution-node-2"
                  ],
                  "relations": [
                    "fp-execution-relation-1"
                  ],
                  "flows": [
                    "fp-execution-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "fp-commit-section",
                "heading": "Distinguishing Successful Calculation from Committed Updates",
                "coreRefs": {
                  "steps": [
                    "fp-commit"
                  ],
                  "claims": [
                    "fp-commit-claim-1",
                    "fp-commit-claim-2"
                  ],
                  "nodes": [
                    "fp-commit-node-1",
                    "fp-commit-node-2"
                  ],
                  "relations": [
                    "fp-commit-relation-1"
                  ],
                  "flows": [
                    "fp-commit-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-commit-paragraph-1",
                    "kind": "paragraph",
                    "text": "The standard UnitOfWorkInterpreter.run interprets the program and proceeds to UoW commit when the business outcome also succeeds. It returns the value after commit succeeds; failed calculation or interpretation follows the abort path. Evaluation-only APIs within an existing UoW leave commit or abort ownership with the caller.",
                    "coreRefs": {
                      "steps": [
                        "fp-commit"
                      ],
                      "claims": [
                        "fp-commit-claim-1"
                      ],
                      "nodes": [
                        "fp-commit-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-commit-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-commit-paragraph-2",
                    "kind": "paragraph",
                    "text": "Calculating a quotation, validating a candidate update and committing it to storage are distinct outcomes. Concurrent changes may occur before commitment, requiring appropriate storage-side conflict checks. Each API defines what its Consequence success means; successful acceptance or calculation must not be presented as durable completion.",
                    "coreRefs": {
                      "steps": [
                        "fp-commit"
                      ],
                      "claims": [
                        "fp-commit-claim-2"
                      ],
                      "nodes": [
                        "fp-commit-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-commit-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "fp-failure-resources-section",
                "heading": "Defining Failure Cleanup and Conditions for Re-execution",
                "coreRefs": {
                  "steps": [
                    "fp-failure-resources"
                  ],
                  "claims": [
                    "fp-failure-resources-claim-1",
                    "fp-failure-resources-claim-2"
                  ],
                  "nodes": [
                    "fp-failure-resources-node-1",
                    "fp-failure-resources-node-2"
                  ],
                  "relations": [
                    "fp-failure-resources-relation-1"
                  ],
                  "flows": [
                    "fp-failure-resources-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-failure-resources-paragraph-1",
                    "kind": "paragraph",
                    "text": "UoW separately manages transaction participants and the release of operational resources acquired during execution. Primary failures and cleanup failures remain structured information. Cleanup belongs with the execution owner rather than being scattered across business functions.",
                    "coreRefs": {
                      "steps": [
                        "fp-failure-resources"
                      ],
                      "claims": [
                        "fp-failure-resources-claim-1"
                      ],
                      "nodes": [
                        "fp-failure-resources-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-failure-resources-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-failure-resources-paragraph-2",
                    "kind": "paragraph",
                    "text": "Already-sent external communication is not undone by UoW abort. Re-executed work requires duplicate-detection conditions and, where needed, compensation operations and their commit boundaries. Recovery distinguishes reproducible pure calculations from effectful retries governed by business and Provider contracts.",
                    "coreRefs": {
                      "steps": [
                        "fp-failure-resources"
                      ],
                      "claims": [
                        "fp-failure-resources-claim-2"
                      ],
                      "nodes": [
                        "fp-failure-resources-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-failure-resources-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "fp-reactive-section",
            "heading": "Connecting Functional Descriptions to Reactive Execution",
            "coreRefs": {
              "steps": [
                "fp-reactive"
              ],
              "claims": [
                "fp-reactive-claim-1"
              ],
              "nodes": [
                "fp-reactive-node-1",
                "fp-reactive-node-2"
              ],
              "relations": [
                "fp-reactive-relation-1"
              ],
              "flows": [
                "fp-reactive-flow"
              ]
            },
            "blocks": [
              {
                "id": "fp-reactive-paragraph-1",
                "kind": "paragraph",
                "text": "Variable load and partial failures require systems to remain responsive while preserving business rules. The Reactive Manifesto identifies responsiveness, resilience, elasticity and message-driven operation. FP makes computation meaning and composition explicit; runtime infrastructure manages waiting, isolation, delivery and resource allocation. Connecting the two reduces execution-control code mixed into business logic.",
                "coreRefs": {
                  "steps": [
                    "fp-reactive"
                  ],
                  "claims": [
                    "fp-reactive-claim-1"
                  ],
                  "nodes": [
                    "fp-reactive-node-1",
                    "fp-reactive-node-2"
                  ],
                  "relations": [
                    "fp-reactive-relation-1"
                  ],
                  "flows": [
                    "fp-reactive-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "fp-asynchrony-section",
                "heading": "Executing Asynchronous Work while Preserving Dependencies",
                "coreRefs": {
                  "steps": [
                    "fp-asynchrony"
                  ],
                  "claims": [
                    "fp-asynchrony-claim-1",
                    "fp-asynchrony-claim-2"
                  ],
                  "nodes": [
                    "fp-asynchrony-node-1",
                    "fp-asynchrony-node-2"
                  ],
                  "relations": [
                    "fp-asynchrony-relation-1"
                  ],
                  "flows": [
                    "fp-asynchrony-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-asynchrony-paragraph-1",
                    "kind": "paragraph",
                    "text": "Monadic composition preserves result dependencies, while applicative structure expresses independence. An asynchronous execution mechanism that can exploit that independence may choose concurrency under bounded capacity. Consequence and Free Monad do not themselves make processing asynchronous or parallel.",
                    "coreRefs": {
                      "steps": [
                        "fp-asynchrony"
                      ],
                      "claims": [
                        "fp-asynchrony-claim-1"
                      ],
                      "nodes": [
                        "fp-asynchrony-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-asynchrony-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-asynchrony-paragraph-2",
                    "kind": "paragraph",
                    "text": "Textus/CNCF can explicitly submit long work as a Job whose Tasks use shared operation and UoW paths. Job acceptance, individual commits and overall completion are distinct. This supports progress tracking without indefinitely blocking the UI and shares business calculations and failure meanings across synchronous and asynchronous use.",
                    "coreRefs": {
                      "steps": [
                        "fp-asynchrony"
                      ],
                      "claims": [
                        "fp-asynchrony-claim-2"
                      ],
                      "nodes": [
                        "fp-asynchrony-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-asynchrony-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "fp-reactive-quality-section",
                "heading": "Relating the Combination to the Four Reactive Traits",
                "coreRefs": {
                  "steps": [
                    "fp-reactive-quality"
                  ],
                  "claims": [
                    "fp-reactive-quality-claim-1",
                    "fp-reactive-quality-claim-2"
                  ],
                  "nodes": [
                    "fp-reactive-quality-node-1",
                    "fp-reactive-quality-node-2"
                  ],
                  "relations": [
                    "fp-reactive-quality-relation-1"
                  ],
                  "flows": [
                    "fp-reactive-quality-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-reactive-quality-paragraph-1",
                    "kind": "paragraph",
                    "text": "Pure calculations and immutable values make work easier to partition and reproduce. Structured failure provides information for recovery decisions. Typed Commands and Events combined with explicit execution owners preserve business meaning across messages and isolated processing units.",
                    "coreRefs": {
                      "steps": [
                        "fp-reactive-quality"
                      ],
                      "claims": [
                        "fp-reactive-quality-claim-1"
                      ],
                      "nodes": [
                        "fp-reactive-quality-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-reactive-quality-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-reactive-quality-paragraph-2",
                    "kind": "paragraph",
                    "text": "Responsiveness and elasticity require coordination among Job queue capacity, concurrency limits, Domain capacity and delivery flow control. Resilience combines isolation, retry conditions, cleanup and recovery from committed state. FP supplies descriptions to which these controls can be applied; actual quality depends on the selected execution mechanisms and operational configuration.",
                    "coreRefs": {
                      "steps": [
                        "fp-reactive-quality"
                      ],
                      "claims": [
                        "fp-reactive-quality-claim-2"
                      ],
                      "nodes": [
                        "fp-reactive-quality-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-reactive-quality-flow"
                      ]
                    }
                  },
                  {
                    "id": "functional-reactive",
                    "kind": "figure",
                    "asset": "images/functional-reactive-en.png",
