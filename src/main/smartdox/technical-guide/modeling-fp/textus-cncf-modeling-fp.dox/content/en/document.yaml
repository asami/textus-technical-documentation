                "sections": []
              },
              {
                "id": "fp-ai-harness-section",
                "heading": "Keeping AI Supplementation within Models and Shared Contracts",
                "coreRefs": {
                  "steps": [
                    "fp-ai-harness"
                  ],
                  "claims": [
                    "fp-ai-harness-claim-1",
                    "fp-ai-harness-claim-2"
                  ],
                  "nodes": [
                    "fp-ai-harness-node-1",
                    "fp-ai-harness-node-2"
                  ],
                  "relations": [
                    "fp-ai-harness-relation-1"
                  ],
                  "flows": [
                    "fp-ai-harness-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-ai-harness-paragraph-1",
                    "kind": "paragraph",
                    "text": "Pure functional programming, monads and Free Monad require learning and manual effort. Supplying AI with types, operation contracts and established composition examples helps produce supplementary code within this structure. People define business meaning, failure handling and commit boundaries, while type checks and boundary-specific verification check the result.",
                    "coreRefs": {
                      "steps": [
                        "fp-ai-harness"
                      ],
                      "claims": [
                        "fp-ai-harness-claim-1"
                      ],
                      "nodes": [
                        "fp-ai-harness-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-ai-harness-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-ai-harness-paragraph-2",
                    "kind": "paragraph",
                    "text": "Types constrain values and connections, Consequence standardizes outcomes, and the operation DSL with UoW bounds implementation and execution. Reuse and supplementary glue within these contracts reduce independently invented control logic. The combination also functions as a programming harness, keeping changes and reviews tied to model meaning.",
                    "coreRefs": {
                      "steps": [
                        "fp-ai-harness"
                      ],
                      "claims": [
                        "fp-ai-harness-claim-2"
                      ],
                      "nodes": [
                        "fp-ai-harness-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-ai-harness-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "fp-conclusion-section",
            "heading": "Conclusion",
            "coreRefs": {
              "steps": [
                "fp-conclusion"
              ],
              "claims": [
                "fp-conclusion-claim-1"
              ],
              "nodes": [
                "fp-conclusion-node-1",
