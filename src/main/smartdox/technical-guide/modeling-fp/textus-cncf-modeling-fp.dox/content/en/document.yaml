          {
            "id": "fp-types-section",
            "heading": "Making Business Meaning Concrete in Types and Contracts",
            "coreRefs": {
              "steps": [
                "fp-types"
              ],
              "claims": [
                "fp-types-claim-1"
              ],
              "nodes": [
                "fp-types-node-1",
