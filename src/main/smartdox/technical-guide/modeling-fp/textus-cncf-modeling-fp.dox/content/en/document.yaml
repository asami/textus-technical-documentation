        "sections": [
          {
            "id": "fp-landscape-section",
            "heading": "From Modeling to Execution",
            "coreRefs": {
              "steps": [
                "fp-landscape"
              ],
              "claims": [
                "fp-landscape-claim-1",
                "fp-landscape-claim-2"
              ],
              "nodes": [
                "fp-landscape-node-1",
                "fp-landscape-node-2"
              ],
              "relations": [
                "fp-landscape-relation-1"
              ],
              "flows": [
                "fp-landscape-flow"
              ]
            },
            "blocks": [
              {
                "id": "fp-landscape-paragraph-1",
                "kind": "paragraph",
                "text": "The DDD guide explains the overall combination of business meaning, progression, updates and persistence, and reading and presentation. This guide examines how those models are expressed as programs. Assuming use cases are already defined, it relates business concepts and operations to types, calculations and executable work.",
                "coreRefs": {
                  "steps": [
                    "fp-landscape"
                  ],
                  "claims": [
                    "fp-landscape-claim-1"
                  ],
                  "nodes": [
                    "fp-landscape-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "fp-landscape-flow"
                  ]
                }
              },
              {
                "id": "fp-landscape-paragraph-2",
                "kind": "paragraph",
                "text": "Types define admissible values and connections; pure functions describe calculations over them. Consequence provides a shared representation of results and failure. Persistence and communication are composed as Free Monad programs and passed to an interpreter and UoW. Each stage carries established meaning forward through contracts understood by the next stage.",
                "coreRefs": {
                  "steps": [
                    "fp-landscape"
                  ],
                  "claims": [
                    "fp-landscape-claim-2"
                  ],
                  "nodes": [
