              ],
              "relations": [
                "fp-conclusion-relation-1"
              ],
              "flows": [
                "fp-conclusion-flow"
              ]
            },
            "blocks": [
              {
                "id": "fp-conclusion-paragraph-1",
                "kind": "paragraph",
                "text": "Types and pure functions turn business models into calculations; Consequence connects outcomes, Free Monad describes operations, and the shared UoW path executes them. This division combines business calculation with reactive execution controls while preserving model meaning. Applying the same contracts and verification to AI supplementation makes these advanced techniques more accessible in development.",
                "coreRefs": {
                  "steps": [
                    "fp-conclusion"
                  ],
                  "claims": [
                    "fp-conclusion-claim-1"
                  ],
                  "nodes": [
