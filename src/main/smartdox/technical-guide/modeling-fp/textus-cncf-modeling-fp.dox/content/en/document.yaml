          {
            "id": "fp-example-section",
            "heading": "Tracing Model-to-Execution Connections through Quotation Confirmation",
            "coreRefs": {
              "steps": [
                "fp-example"
              ],
              "claims": [
                "fp-example-claim-1",
                "fp-example-claim-2"
              ],
              "nodes": [
                "fp-example-node-1",
                "fp-example-node-2"
              ],
              "relations": [
                "fp-example-relation-1"
              ],
              "flows": [
                "fp-example-flow"
              ]
            },
            "blocks": [
              {
                "id": "fp-example-paragraph-1",
                "kind": "paragraph",
                "text": "Quantity and currency are validated independently, then validated values enter the quotation calculation. A price snapshot and rule version are explicit inputs to the pure computation of an amount and proposed update. Only successful Consequence values connect to persistence operations in a Free Monad program passed to the interpreter.",
                "coreRefs": {
                  "steps": [
                    "fp-example"
                  ],
                  "claims": [
                    "fp-example-claim-1"
                  ],
                  "nodes": [
                    "fp-example-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "fp-example-flow"
                  ]
                }
              },
              {
                "id": "fp-example-paragraph-2",
                "kind": "paragraph",
                "text": "Execution checks authorization and required concurrency conditions and commits updates through UoW. Notifications and View updates follow the selected delivery and projection path. The diagram traces responsibilities on success. Invalid inputs, rejected business conditions and storage conflicts stop at different boundaries and return different outcomes.",
                "coreRefs": {
                  "steps": [
                    "fp-example"
                  ],
                  "claims": [
