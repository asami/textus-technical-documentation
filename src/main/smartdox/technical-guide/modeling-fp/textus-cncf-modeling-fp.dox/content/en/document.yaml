        "blocks": [
          {
            "id": "textus-cncf-modeling-fp-paragraph-1",
            "kind": "paragraph",
            "text": "This guide explains how business models become types and functions and connect to execution involving success, failure, persistence and communication. It follows the combination of types, pure functional programming, Consequence, Free Monad and UoW in Textus/CNCF. Two books on functional domain modeling provide reference perspectives, extending to the connection with reactive execution.",
