                          "Are incompatible values connected?",
                          "Type checking",
                          "Encoded connection conditions"
                        ]
                      },
                      {
                        "id": "verification-mapping-row-2",
                        "cells": [
                          "Does calculation satisfy business rules?",
                          "Example and property tests",
                          "Outputs for fixed inputs"
                        ]
                      },
                      {
                        "id": "verification-mapping-row-3",
