                    "fp-types-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "fp-domain-types-section",
                "heading": "Representing Values, States and Constraints with Types",
                "coreRefs": {
                  "steps": [
                    "fp-domain-types"
                  ],
                  "claims": [
                    "fp-domain-types-claim-1",
                    "fp-domain-types-claim-2"
                  ],
                  "nodes": [
                    "fp-domain-types-node-1",
                    "fp-domain-types-node-2"
                  ],
                  "relations": [
                    "fp-domain-types-relation-1"
                  ],
                  "flows": [
                    "fp-domain-types-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-domain-types-paragraph-1",
                    "kind": "paragraph",
                    "text": "Quantity, unit price and amount have different meanings in a quotation. Types such as Quantity and Money distinguish them rather than passing interchangeable primitive numbers. Product types group required fields, while sum types represent alternatives such as distinct states.",
                    "coreRefs": {
                      "steps": [
                        "fp-domain-types"
                      ],
                      "claims": [
                        "fp-domain-types-claim-1"
                      ],
                      "nodes": [
                        "fp-domain-types-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-domain-types-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-domain-types-paragraph-2",
                    "kind": "paragraph",
                    "text": "The boundary constructing constrained values checks conditions such as quantity ranges and currency. Distinguishing unchecked from checked values and controlling construction lets downstream functions rely on validated inputs. Conditions involving current state or other records remain in business operations and commit-time checks.",
                    "coreRefs": {
                      "steps": [
                        "fp-domain-types"
                      ],
                      "claims": [
                        "fp-domain-types-claim-2"
                      ],
                      "nodes": [
                        "fp-domain-types-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-domain-types-flow"
                      ]
                    }
                  },
                  {
