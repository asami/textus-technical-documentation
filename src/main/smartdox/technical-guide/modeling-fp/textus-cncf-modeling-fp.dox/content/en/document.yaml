          {
            "id": "fp-verification-section",
            "heading": "Verifying Models, Calculations and Execution Boundaries",
            "coreRefs": {
              "steps": [
                "fp-verification"
              ],
              "claims": [
                "fp-verification-claim-1"
              ],
              "nodes": [
                "fp-verification-node-1",
                "fp-verification-node-2"
              ],
              "relations": [
                "fp-verification-relation-1"
              ],
              "flows": [
                "fp-verification-flow"
              ]
            },
            "blocks": [
              {
                "id": "fp-verification-paragraph-1",
                "kind": "paragraph",
                "text": "Verification is divided among types, pure calculations, operation descriptions and execution boundaries instead of relying solely on end-to-end tests. Explicit responsibilities also clarify what must be checked after a change.",
                "coreRefs": {
                  "steps": [
                    "fp-verification"
                  ],
                  "claims": [
                    "fp-verification-claim-1"
                  ],
                  "nodes": [
                    "fp-verification-node-1",
                    "fp-verification-node-2"
                  ],
                  "relations": [
                    "fp-verification-relation-1"
                  ],
                  "flows": [
                    "fp-verification-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "fp-verification-cases-section",
                "heading": "Using Examples, Properties and Operation Records",
                "coreRefs": {
                  "steps": [
                    "fp-verification-cases"
                  ],
                  "claims": [
                    "fp-verification-cases-claim-1",
                    "fp-verification-cases-claim-2"
                  ],
                  "nodes": [
                    "fp-verification-cases-node-1",
                    "fp-verification-cases-node-2"
                  ],
                  "relations": [
                    "fp-verification-cases-relation-1"
                  ],
                  "flows": [
                    "fp-verification-cases-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-verification-cases-paragraph-1",
                    "kind": "paragraph",
                    "text": "Pure calculations support known input/output examples and properties such as preserving currency or rejecting invalid quantities. Consequence composition is checked for error accumulation and skipped dependent work after failure. Neither algebraic composition laws nor business properties are automatically established by type checking alone.",
                    "coreRefs": {
                      "steps": [
                        "fp-verification-cases"
                      ],
                      "claims": [
                        "fp-verification-cases-claim-1"
                      ],
                      "nodes": [
                        "fp-verification-cases-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-verification-cases-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-verification-cases-paragraph-2",
                    "kind": "paragraph",
                    "text": "A test interpreter or recorder can supply responses and inspect selected operations without performing real communication. CNCF’s planning and recording contract likewise defines recording of visited operations under supplied typed responses. Real Provider authorization, conflicts, commit/abort and resource release need separate verification; a recorded simulation does not establish production behavior.",
                    "coreRefs": {
                      "steps": [
                        "fp-verification-cases"
                      ],
                      "claims": [
                        "fp-verification-cases-claim-2"
                      ],
                      "nodes": [
                        "fp-verification-cases-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-verification-cases-flow"
                      ]
                    }
                  },
                  {
                    "id": "verification-mapping",
                    "kind": "table",
                    "caption": "Properties and verification boundaries",
                    "columns": [
                      {
                        "id": "col-1",
