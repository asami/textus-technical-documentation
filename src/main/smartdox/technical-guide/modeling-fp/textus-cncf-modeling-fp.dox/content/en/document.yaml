              ],
              "flows": [
                "fp-types-flow"
              ]
            },
            "blocks": [
              {
                "id": "fp-types-paragraph-1",
                "kind": "paragraph",
                "text": "Modeling distinguishes business meanings even when values share primitive representations. Carrying these distinctions into types gives communicating functions a shared specification. Types preserve model concepts at implementation boundaries.",
                "coreRefs": {
                  "steps": [
                    "fp-types"
                  ],
                  "claims": [
                    "fp-types-claim-1"
                  ],
                  "nodes": [
                    "fp-types-node-1",
