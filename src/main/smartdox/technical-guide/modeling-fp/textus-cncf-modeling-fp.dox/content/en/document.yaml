              {
                "id": "fp-typed-contracts-section",
                "heading": "Carrying CML Definitions into Reusable Interfaces",
                "coreRefs": {
                  "steps": [
                    "fp-typed-contracts"
                  ],
                  "claims": [
                    "fp-typed-contracts-claim-1",
                    "fp-typed-contracts-claim-2"
                  ],
                  "nodes": [
                    "fp-typed-contracts-node-1",
                    "fp-typed-contracts-node-2"
                  ],
                  "relations": [
                    "fp-typed-contracts-relation-1"
                  ],
                  "flows": [
                    "fp-typed-contracts-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-typed-contracts-paragraph-1",
                    "kind": "paragraph",
                    "text": "Cozy projects CML Entity, Value, Datatype and Operation definitions into typed code and implementation interfaces. Supplementary calculations use those types for inputs and results. Existing operations can be reused and connected without redefining the model’s concepts, supporting reuse and glue code.",
                    "coreRefs": {
                      "steps": [
                        "fp-typed-contracts"
                      ],
                      "claims": [
                        "fp-typed-contracts-claim-1"
                      ],
                      "nodes": [
                        "fp-typed-contracts-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-typed-contracts-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-typed-contracts-paragraph-2",
                    "kind": "paragraph",
                    "text": "Compatible types establish connectability, not complete semantic equivalence. Currency and unit conversions and rule versions remain explicit in names and conversion functions. Aligning model meaning, type contracts and conversion rules reduces decisions that must be repeated at each connection.",
                    "coreRefs": {
                      "steps": [
                        "fp-typed-contracts"
                      ],
                      "claims": [
                        "fp-typed-contracts-claim-2"
                      ],
                      "nodes": [
                        "fp-typed-contracts-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-typed-contracts-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "fp-pure-section",
            "heading": "Composing Business Calculations as Pure Functions",
            "coreRefs": {
              "steps": [
                "fp-pure"
              ],
              "claims": [
                "fp-pure-claim-1"
              ],
              "nodes": [
                "fp-pure-node-1",
                "fp-pure-node-2"
              ],
              "relations": [
                "fp-pure-relation-1"
              ],
              "flows": [
                "fp-pure-flow"
              ]
            },
            "blocks": [
              {
                "id": "fp-pure-paragraph-1",
                "kind": "paragraph",
                "text": "After types define values and connections, business rules become calculations. Separating input-to-result computation from acquisition, persistence and execution management makes model rules easier to understand and verify independently.",
                "coreRefs": {
                  "steps": [
                    "fp-pure"
                  ],
                  "claims": [
                    "fp-pure-claim-1"
                  ],
                  "nodes": [
                    "fp-pure-node-1",
                    "fp-pure-node-2"
                  ],
                  "relations": [
                    "fp-pure-relation-1"
                  ],
                  "flows": [
                    "fp-pure-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "fp-pure-calculation-section",
                "heading": "Making Changing Information Explicit Input",
                "coreRefs": {
                  "steps": [
                    "fp-pure-calculation"
                  ],
                  "claims": [
                    "fp-pure-calculation-claim-1",
                    "fp-pure-calculation-claim-2"
                  ],
                  "nodes": [
                    "fp-pure-calculation-node-1",
                    "fp-pure-calculation-node-2"
                  ],
                  "relations": [
                    "fp-pure-calculation-relation-1"
                  ],
                  "flows": [
                    "fp-pure-calculation-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-pure-calculation-paragraph-1",
                    "kind": "paragraph",
                    "text": "A quotation calculation takes quantity, unit price, discount rules and rounding rules as inputs. Instead of reading the clock or a mutable price catalog inside the function, it receives the relevant time and rule version. Pure functions over immutable inputs reproduce the same outcome for the same input.",
                    "coreRefs": {
                      "steps": [
                        "fp-pure-calculation"
                      ],
                      "claims": [
                        "fp-pure-calculation-claim-1"
                      ],
                      "nodes": [
                        "fp-pure-calculation-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-pure-calculation-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-pure-calculation-paragraph-2",
                    "kind": "paragraph",
                    "text": "State changes can be modeled as calculations from current state and an operation to a proposed next state. Constructing a candidate is separated from committing shared persistent state. Input/output cases test the rule; authorization, conflicts and persistence outcomes are checked along the execution path.",
                    "coreRefs": {
                      "steps": [
                        "fp-pure-calculation"
                      ],
                      "claims": [
                        "fp-pure-calculation-claim-2"
                      ],
                      "nodes": [
                        "fp-pure-calculation-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-pure-calculation-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "fp-type-guarantees-section",
                "heading": "Combining Type Guarantees with Rule Verification",
                "coreRefs": {
                  "steps": [
                    "fp-type-guarantees"
                  ],
                  "claims": [
                    "fp-type-guarantees-claim-1",
                    "fp-type-guarantees-claim-2"
                  ],
                  "nodes": [
                    "fp-type-guarantees-node-1",
                    "fp-type-guarantees-node-2"
                  ],
                  "relations": [
                    "fp-type-guarantees-relation-1"
                  ],
                  "flows": [
                    "fp-type-guarantees-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-type-guarantees-paragraph-1",
                    "kind": "paragraph",
                    "text": "The Curry–Howard correspondence provides a foundation for viewing types as propositions and typed programs as proofs. Composing pure functions while preserving encoded input/output conditions expands compile-time detection of mismatched values and connections. Restricting representations to admissible states reduces errors discovered only at runtime.",
                    "coreRefs": {
                      "steps": [
                        "fp-type-guarantees"
                      ],
                      "claims": [
                        "fp-type-guarantees-claim-1"
                      ],
                      "nodes": [
                        "fp-type-guarantees-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-type-guarantees-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-type-guarantees-paragraph-2",
                    "kind": "paragraph",
                    "text": "This is not a proof of complete business correctness for arbitrary Scala programs. Guarantees concern properties encoded in types and code respecting their assumptions. Discount rules, rounding requirements, termination and external responses require additional checks. Type checking, example and property tests of pure calculations, and execution-boundary checks have distinct roles.",
                    "coreRefs": {
                      "steps": [
                        "fp-type-guarantees"
                      ],
                      "claims": [
                        "fp-type-guarantees-claim-2"
                      ],
                      "nodes": [
                        "fp-type-guarantees-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-type-guarantees-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "fp-consequence-section",
            "heading": "Including Success and Failure in Calculation Contracts",
            "coreRefs": {
              "steps": [
                "fp-consequence"
              ],
              "claims": [
                "fp-consequence-claim-1"
              ],
              "nodes": [
                "fp-consequence-node-1",
                "fp-consequence-node-2"
              ],
              "relations": [
                "fp-consequence-relation-1"
              ],
              "flows": [
                "fp-consequence-flow"
              ]
            },
            "blocks": [
              {
                "id": "fp-consequence-paragraph-1",
                "kind": "paragraph",
                "text": "Business calculations may reject inputs, fail a rule or find no matching object. Representing failure in the result type and composition rules lets subsequent processing account for these outcomes instead of leaving them outside the calculation contract.",
                "coreRefs": {
                  "steps": [
                    "fp-consequence"
                  ],
                  "claims": [
                    "fp-consequence-claim-1"
                  ],
                  "nodes": [
                    "fp-consequence-node-1",
                    "fp-consequence-node-2"
                  ],
                  "relations": [
                    "fp-consequence-relation-1"
                  ],
                  "flows": [
                    "fp-consequence-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "fp-result-model-section",
                "heading": "Aligning Outcome Meaning with Consequence and Conclusion",
                "coreRefs": {
                  "steps": [
                    "fp-result-model"
                  ],
                  "claims": [
                    "fp-result-model-claim-1",
                    "fp-result-model-claim-2"
                  ],
                  "nodes": [
                    "fp-result-model-node-1",
                    "fp-result-model-node-2"
                  ],
                  "relations": [
                    "fp-result-model-relation-1"
                  ],
                  "flows": [
                    "fp-result-model-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-result-model-paragraph-1",
                    "kind": "paragraph",
                    "text": "Textus/CNCF uses Consequence[A] as its shared result type. Success carries a value of type A; Failure carries a Conclusion. Conclusion retains observations, interpretation, disposition, status and causal information. Calculations, component calls and the runtime can therefore exchange outcomes in a common form.",
                    "coreRefs": {
                      "steps": [
                        "fp-result-model"
                      ],
                      "claims": [
                        "fp-result-model-claim-1"
                      ],
                      "nodes": [
                        "fp-result-model-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-result-model-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-result-model-paragraph-2",
                    "kind": "paragraph",
                    "text": "Returning Consequence does not make a function pure: external calls can use the same result type. Pure calculations must still depend only on their inputs. At boundaries with exception-throwing libraries, Consequence.apply or run normalizes exceptions into failure. Outcome representation and the presence of effects are separate concerns.",
                    "coreRefs": {
                      "steps": [
                        "fp-result-model"
                      ],
                      "claims": [
                        "fp-result-model-claim-2"
                      ],
                      "nodes": [
                        "fp-result-model-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-result-model-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "fp-composition-section",
                "heading": "Distinguishing Dependent Processing from Independent Validation",
                "coreRefs": {
                  "steps": [
                    "fp-composition"
                  ],
                  "claims": [
                    "fp-composition-claim-1",
                    "fp-composition-claim-2",
                    "fp-composition-claim-3"
                  ],
                  "nodes": [
                    "fp-composition-node-1",
                    "fp-composition-node-2",
                    "fp-composition-node-3"
                  ],
                  "relations": [
                    "fp-composition-relation-1",
                    "fp-composition-relation-2"
                  ],
                  "flows": [
                    "fp-composition-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-composition-paragraph-1",
                    "kind": "paragraph",
                    "text": "flatMap connects work that depends on a previous success value, such as calculating an amount only after validation succeeds. Failure skips the continuation and propagates unchanged. map transforms a success value. These monadic composition rules reduce repeated success/failure branching in individual functions.",
                    "coreRefs": {
                      "steps": [
                        "fp-composition"
                      ],
                      "claims": [
                        "fp-composition-claim-1"
                      ],
                      "nodes": [
                        "fp-composition-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-composition-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-composition-paragraph-2",
                    "kind": "paragraph",
                    "text": "Independent input checks, such as quantity and currency validation, use zip-based APIs. Consequence.zip combines Conclusions when both checks fail. API choice expresses a business distinction: report independent validation errors together, but stop dependent computation after failure.",
                    "coreRefs": {
                      "steps": [
                        "fp-composition"
                      ],
                      "claims": [
                        "fp-composition-claim-2"
                      ],
                      "nodes": [
                        "fp-composition-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-composition-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-composition-paragraph-3",
                    "kind": "paragraph",
                    "text": "Error accumulation with zip and short-circuiting with flatMap are different rules. The former provides applicative-style composition; choosing an arbitrary Monad composition does not imply the same accumulation. Independence is also distinct from parallel execution: Consequence.zip is not a scheduler that computes its arguments concurrently.",
                    "coreRefs": {
                      "steps": [
                        "fp-composition"
                      ],
                      "claims": [
                        "fp-composition-claim-3"
                      ],
                      "nodes": [
                        "fp-composition-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-composition-flow"
                      ]
                    }
                  },
                  {
                    "id": "dependent-independent",
                    "kind": "figure",
                    "asset": "images/dependent-independent-en.png",
                    "caption": "Dependent short-circuiting and independent error accumulation",
                    "alt": "Dependent short-circuiting and independent error accumulation",
