                    "fp-commit-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-commit-paragraph-1",
                    "kind": "paragraph",
                    "text": "標準のUnitOfWorkInterpreter.runは、プログラムの操作を解釈し、業務結果も成功ならUoWのcommitへ進みます。commitの成功を確認してから結果の値を返し、業務計算や操作が失敗した場合はabortの経路へ進みます。既存UoWの中で評価だけを行うAPIでは、呼出し側が確定・中止を所有します。",
                    "coreRefs": {
                      "steps": [
                        "fp-commit"
                      ],
                      "claims": [
                        "fp-commit-claim-1"
                      ],
                      "nodes": [
                        "fp-commit-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-commit-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-commit-paragraph-2",
                    "kind": "paragraph",
                    "text": "見積金額を計算できたこと、更新候補が妥当なこと、保存先へ更新を確定できたことは異なる結果です。確定までに別の更新と競合する場合があるため、必要な競合検査を保存経路へ接続します。Consequenceの成功値が何の完了を意味するかをAPIごとに定め、受付や計算の成功を永続化の成功として返さないようにします。",
                    "coreRefs": {
                      "steps": [
                        "fp-commit"
                      ],
                      "claims": [
                        "fp-commit-claim-2"
                      ],
                      "nodes": [
