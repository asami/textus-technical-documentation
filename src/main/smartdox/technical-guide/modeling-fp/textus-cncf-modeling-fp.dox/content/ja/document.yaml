                "blocks": [
                  {
                    "id": "fp-composition-paragraph-1",
                    "kind": "paragraph",
                    "text": "前の成功値を使う処理はflatMapでつなぎます。見積りの検査が成功した場合だけ金額計算へ進む、といった依存関係です。失敗時には後続を呼ばず、同じ失敗を返します。mapは成功値を別の値へ変換します。このモナドの合成規則によって、各関数へ同じ成功・失敗の分岐を繰り返し書く範囲を減らせます。",
                    "coreRefs": {
                      "steps": [
                        "fp-composition"
                      ],
                      "claims": [
