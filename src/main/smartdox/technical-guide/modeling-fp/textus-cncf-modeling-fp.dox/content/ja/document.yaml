                    "text": "見積金額を求める計算では、数量、単価、割引規則、丸め規則を入力として扱います。現在時刻や更新される価格表を関数の内部で読み取る代わりに、取得した日時や規則の版を渡します。不変の入力から結果を返す純粋関数にすると、同じ入力で同じ結果を再現できます。",
