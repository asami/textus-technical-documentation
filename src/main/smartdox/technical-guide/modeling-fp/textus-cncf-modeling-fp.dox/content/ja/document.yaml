                  "flows": [
                    "fp-combined-result-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-combined-result-paragraph-1",
                    "kind": "paragraph",
                    "text": "Consequenceだけでは、保存や通信を後で実行する操作記述にはなりません。一方、Free Monadだけでは、業務上の失敗をどの形式で返して後続を止めるかは定まりません。CNCFはConsequenceTを用い、Programの結果にConsequenceを組み込んだUowMを定義します。操作の記述と、成功・失敗を伴う合成を同時に扱うための組合せです。",
                    "coreRefs": {
                      "steps": [
                        "fp-combined-result"
                      ],
                      "claims": [
                        "fp-combined-result-claim-1"
                      ],
                      "nodes": [
                        "fp-combined-result-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-combined-result-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-combined-result-paragraph-2",
                    "kind": "paragraph",
                    "text": "純粋計算が返したConsequenceをこのプログラムへ持ち上げ、成功値を保存操作へ渡すことができます。業務上の失敗なら後続操作を組み立てず、実行時の失敗も同じ結果体系で上位へ返します。型は操作の入出力を、合成規則は結果の接続を、インタープリタとUoWは実際の作用と確定を担当します。",
