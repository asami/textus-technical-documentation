            "sections": [
              {
                "id": "fp-commit-section",
                "heading": "計算の成功と更新の確定を区別する",
                "coreRefs": {
                  "steps": [
                    "fp-commit"
                  ],
                  "claims": [
                    "fp-commit-claim-1",
