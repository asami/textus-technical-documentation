                "id": "fp-execution-paragraph-1",
                "kind": "paragraph",
                "text": "組み立てたプログラムは、実行コンテキストに結び付いたインタープリタへ渡します。ここで業務上の操作記述を、認可、Provider、保存先、UoWの終了処理へ接続します。モデルの規則に従った計算と、環境に依存する制御を組み合わせて動作させます。",
