                    "id": "fp-domain-types-paragraph-2",
                    "kind": "paragraph",
                    "text": "入力を制約付きの型へ変換する入口では、数量の範囲や通貨などを検査します。未検査の値と検査済みの値を型で分け、生成経路を限定すれば、後続の関数は検査済みの値を前提にできます。対象の現在状態や他のデータとの整合性など、実行時に分かる条件は、対応する業務操作と保存時の検査へ残します。",
