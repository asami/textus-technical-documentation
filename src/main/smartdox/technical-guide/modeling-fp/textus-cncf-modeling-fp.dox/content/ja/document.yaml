                    "kind": "paragraph",
                    "text": "業務上の状態変更も、現在の状態と操作から次の状態の候補を返す計算として表せます。その候補を作ることと、共有された永続状態へ確定することを分けます。業務規則の検証には計算の入出力を使い、競合や認可、保存の成否は後述する実行経路で確認します。",
