                "fp-effects-flow"
              ]
            },
            "blocks": [
              {
                "id": "fp-effects-paragraph-1",
                "kind": "paragraph",
                "text": "結果の意味をそろえても、保存や通信をどこで実行し、誰が管理するかは別に決める必要があります。Textus/CNCFではUoW（Unit of Work）を実行管理の単位とし、そこで扱う操作を型付きのAPIとして提供します。Free Monadは、それらの操作を実行前の記述として組み合わせるために使います。",
                "coreRefs": {
                  "steps": [
                    "fp-effects"
                  ],
                  "claims": [
                    "fp-effects-claim-1"
                  ],
                  "nodes": [
                    "fp-effects-node-1",
