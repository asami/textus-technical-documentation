                    "id": "fp-type-guarantees-paragraph-1",
                    "kind": "paragraph",
                    "text": "カーリー＝ハワード対応は、型を命題、型を持つプログラムを証明として捉える基礎になります。型に表した入力・出力の条件を保ちながら純粋関数を合成することで、値の取り違えや接続の不整合をコンパイル時に検出できる範囲が広がります。許される状態を型へ絞る設計は、実行して初めて判明する誤りを減らします。",
