                      "relations": [],
                      "flows": [
                        "fp-composition-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-composition-paragraph-2",
                    "kind": "paragraph",
                    "text": "数量と通貨など、互いの結果を必要としない入力検査はzip系APIでまとめます。Consequenceのzipは、両方が失敗した場合にConclusionを結合します。独立した検査のエラーを一度に伝え、依存する計算は失敗時に止める、という業務上の違いをAPIの選択へ表します。",
                    "coreRefs": {
                      "steps": [
                        "fp-composition"
                      ],
                      "claims": [
                        "fp-composition-claim-2"
                      ],
                      "nodes": [
                        "fp-composition-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-composition-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-composition-paragraph-3",
                    "kind": "paragraph",
                    "text": "zipによるエラー集約とflatMapによる打切りは異なる規則です。前者をアプリカティブな合成として使いますが、任意のMonadの合成を選べば同じ集約になるとは限りません。また、独立性を表すことと並列に実行することは別です。Consequenceのzip自体は、入力結果を並列に計算するスケジューラーではありません。",
                    "coreRefs": {
