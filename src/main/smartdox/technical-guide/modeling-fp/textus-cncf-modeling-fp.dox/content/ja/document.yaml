                    "kind": "paragraph",
                    "text": "この対応をScalaプログラム全体の業務的正しさの証明とは扱いません。保証の対象は型へ表した性質と、その前提を守るコードです。割引率や丸め方が要求通りか、処理が終了するか、外部システムが正しく応答するかは別に確認します。型検査、純粋計算の実例・性質の検査、実行境界の検査を分担します。",
