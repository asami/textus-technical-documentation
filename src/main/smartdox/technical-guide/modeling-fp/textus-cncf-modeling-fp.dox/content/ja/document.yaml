                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "fp-operation-algebra-section",
                "heading": "操作の語彙と入出力を定める",
                "coreRefs": {
                  "steps": [
                    "fp-operation-algebra"
                  ],
                  "claims": [
                    "fp-operation-algebra-claim-1",
                    "fp-operation-algebra-claim-2"
                  ],
                  "nodes": [
                    "fp-operation-algebra-node-1",
                    "fp-operation-algebra-node-2"
                  ],
                  "relations": [
                    "fp-operation-algebra-relation-1"
                  ],
                  "flows": [
                    "fp-operation-algebra-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-operation-algebra-paragraph-1",
                    "kind": "paragraph",
                    "text": "UnitOfWorkOp[A]は、結果としてAを返す操作の種類と引数を表します。EntityStoreの取得・更新やHTTP呼出しなどを、この型付きの語彙として用意します。業務処理は公開された操作を組み合わせ、操作の実行方法は対応するインタープリタが担当します。この操作体系を、Scalaの中で使う内部DSLとして扱えます。",
                    "coreRefs": {
                      "steps": [
                        "fp-operation-algebra"
                      ],
                      "claims": [
                        "fp-operation-algebra-claim-1"
                      ],
                      "nodes": [
                        "fp-operation-algebra-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-operation-algebra-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-operation-algebra-paragraph-2",
                    "kind": "paragraph",
                    "text": "語彙を定めることには、実装手段と接続条件を共有する効果があります。保存処理を使う側が、接続先の選択や認可、トランザクション制御を毎回作り直す範囲を減らせます。共通経路を外れる直接I/Oは型だけでは防げないため、依存関係の検査とレビューで境界への適合を確認します。",
                    "coreRefs": {
                      "steps": [
                        "fp-operation-algebra"
                      ],
                      "claims": [
                        "fp-operation-algebra-claim-2"
                      ],
                      "nodes": [
                        "fp-operation-algebra-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-operation-algebra-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "fp-free-program-section",
                "heading": "Free Monadで記述と解釈を分ける",
                "coreRefs": {
                  "steps": [
                    "fp-free-program"
                  ],
                  "claims": [
                    "fp-free-program-claim-1",
                    "fp-free-program-claim-2"
                  ],
                  "nodes": [
                    "fp-free-program-node-1",
                    "fp-free-program-node-2"
                  ],
                  "relations": [
                    "fp-free-program-relation-1"
                  ],
                  "flows": [
                    "fp-free-program-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "fp-free-program-paragraph-1",
                    "kind": "paragraph",
                    "text": "CNCFのProgram[F, A]は、操作Fを組み合わせて結果Aを得るFree Monadのプログラムです。保存する、応答を受けて次の操作を選ぶ、といった依存関係を記述できます。組立てる関数が操作記述と不変の値だけを扱えば、外部操作を含むプログラムも純粋な記述として構成できます。",
                    "coreRefs": {
                      "steps": [
                        "fp-free-program"
                      ],
                      "claims": [
                        "fp-free-program-claim-1"
                      ],
                      "nodes": [
                        "fp-free-program-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-free-program-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-free-program-paragraph-2",
                    "kind": "paragraph",
                    "text": "インタープリタは、操作を一つずつ実際の処理へ対応付け、結果を次の段階へ渡します。Free Monadは外部処理を安全にする機構そのものではなく、業務の記述と実行方針を分離する構造です。実行結果に依存する分岐もあるため、全経路を実行前に一覧できるとは限りません。検証では、与えた応答に対して現れる操作と結果を確認します。",
                    "coreRefs": {
                      "steps": [
                        "fp-free-program"
                      ],
                      "claims": [
                        "fp-free-program-claim-2"
                      ],
                      "nodes": [
                        "fp-free-program-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-free-program-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "fp-combined-result-section",
                "heading": "Consequenceを操作記述へ組み込む",
                "coreRefs": {
                  "steps": [
                    "fp-combined-result"
                  ],
                  "claims": [
                    "fp-combined-result-claim-1",
                    "fp-combined-result-claim-2"
