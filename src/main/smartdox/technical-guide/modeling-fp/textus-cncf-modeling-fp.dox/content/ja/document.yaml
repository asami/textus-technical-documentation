          {
            "id": "textus-cncf-modeling-fp-paragraph-1",
            "kind": "paragraph",
            "text": "本書は、業務モデルを型と関数で具体化し、成功・失敗、保存、通信を含む実行へつなぐ仕組みを説明します。型、純粋関数型プログラミング、Consequence、Free Monad、UoWの組合せを、Textus/CNCFの実装に沿って整理します。関数型モデリングの2冊を補助線に、リアクティブな実行との接続までを扱います。",
