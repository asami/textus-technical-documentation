                    "text": "純粋な計算と不変の値は、処理の分割や再現を容易にします。構造化した失敗は、呼出し側や実行管理側が復旧を判断する材料になります。型付きのCommand・Eventと実行の所有者を組み合わせると、業務上の意味を保ってメッセージを受け渡し、隔離した処理へ仕事を渡しやすくなります。",
