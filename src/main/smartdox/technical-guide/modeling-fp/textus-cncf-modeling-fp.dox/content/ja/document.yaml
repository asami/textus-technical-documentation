                    "text": "見積りの数量、単価、金額は、それぞれ異なる意味を持ちます。数量と金額を同じ数値型のまま受け渡す代わりに、QuantityやMoneyなどの型で区別します。複数項目をまとめる積型と、いずれかの状態を表す和型を使うと、必要な項目と選択肢をモデルに沿って表現できます。",
