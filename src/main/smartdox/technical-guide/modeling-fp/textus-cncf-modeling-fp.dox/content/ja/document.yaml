                  {
                    "id": "fp-result-model-paragraph-1",
                    "kind": "paragraph",
                    "text": "Textus/CNCFはConsequence[A]を共通の結果型として使います。成功はA型の値を持つSuccess、失敗はConclusionを持つFailureです。Conclusionには観測した事実、その解釈、対処の方向、状態や原因のつながりを保持します。業務計算、部品間の呼出し、実行基盤が同じ形式で結果を扱えます。",
                    "coreRefs": {
                      "steps": [
                        "fp-result-model"
                      ],
                      "claims": [
                        "fp-result-model-claim-1"
                      ],
                      "nodes": [
                        "fp-result-model-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-result-model-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-result-model-paragraph-2",
                    "kind": "paragraph",
                    "text": "Consequenceを返すだけで、その関数が純粋になるわけではありません。外部APIを呼ぶ処理でも同じ結果型を使えます。純粋計算には入力だけへの依存を保ち、例外を投げる外部ライブラリとの境界ではConsequence.applyやrunで失敗を正規化します。結果の表現と、処理が作用を持つかどうかを分けて判断します。",
                    "coreRefs": {
                      "steps": [
                        "fp-result-model"
                      ],
                      "claims": [
                        "fp-result-model-claim-2"
                      ],
                      "nodes": [
                        "fp-result-model-node-2"
