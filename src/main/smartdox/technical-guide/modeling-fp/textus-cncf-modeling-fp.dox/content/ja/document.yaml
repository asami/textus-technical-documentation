                    "id": "fp-typed-contracts-paragraph-2",
                    "kind": "paragraph",
                    "text": "型が合うことは接続可能性の確認であり、業務上の意味が等しいことの全証明ではありません。通貨の変換、単位の変換、規則の版などは、名前と明示的な変換処理へ表します。モデルの意味、型の契約、変換規則をそろえることで、接続時に判断し直す範囲を減らします。",
