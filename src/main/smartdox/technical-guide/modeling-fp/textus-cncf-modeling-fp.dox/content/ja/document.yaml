                    "id": "fp-typed-contracts-paragraph-1",
                    "kind": "paragraph",
                    "text": "CMLで記述したEntity・Value・DatatypeやOperationの定義を、Cozyが型付きコードや実装の接点へ具体化します。補完する業務計算も、その型を入力と結果に使います。モデルで区別した概念を実装で作り直さず、既存の操作と接続できるため、再利用とグルーコードの作成を支えます。",
