              },
              {
                "id": "fp-landscape-paragraph-2",
                "kind": "paragraph",
                "text": "型は扱える値と接続を定め、純粋関数はその値に対する計算を表します。Consequenceは計算結果と失敗を共通の形で返します。保存や通信が必要になったところで、操作をFree Monadによるプログラムとして組み合わせ、インタープリタとUoWへ渡します。前段で定めた意味を、後段が解釈できる契約として引き継ぐ構成です。",
