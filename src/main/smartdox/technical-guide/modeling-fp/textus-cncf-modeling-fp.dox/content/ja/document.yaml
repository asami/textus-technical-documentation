                "id": "fp-reactive-paragraph-1",
                "kind": "paragraph",
                "text": "負荷の変動や部分的な障害がある環境では、業務規則を保ちながら応答を続ける構成が必要です。リアクティブ宣言は、応答性、耐障害性、弾力性、メッセージ駆動の四つの特性を整理しています。FPは処理の意味と合成を明示し、実行基盤は待機、隔離、配送、資源配分を管理します。両者を接続することで、業務ロジックへ実行制御を混在させる範囲を減らします。",
