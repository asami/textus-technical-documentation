                "id": "fp-landscape-paragraph-1",
                "kind": "paragraph",
                "text": "DDD技術ガイドでは、業務の意味、処理の進行、更新と保存、参照と表示を組み合わせる全体像を扱いました。本書では、その内側でモデルをプログラムとして記述する方法を扱います。ユースケースは定義済みとし、業務概念と操作が、どの型、計算、実行処理へ対応するかを確認します。",
