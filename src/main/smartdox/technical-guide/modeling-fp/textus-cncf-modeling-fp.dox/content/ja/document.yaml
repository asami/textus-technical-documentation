                },
                "blocks": [
                  {
                    "id": "fp-failure-resources-paragraph-1",
                    "kind": "paragraph",
                    "text": "UoWは、トランザクションに参加する資源の確定・中止と、動作中に取得した資源の解放を分けて管理します。処理が失敗した場合にも、主たる失敗と終了処理の失敗を構造化した情報として保持します。個々の業務関数に終了処理を散在させず、実行の所有者に集める構成です。",
                    "coreRefs": {
                      "steps": [
                        "fp-failure-resources"
                      ],
                      "claims": [
                        "fp-failure-resources-claim-1"
                      ],
                      "nodes": [
                        "fp-failure-resources-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "fp-failure-resources-flow"
                      ]
                    }
                  },
                  {
                    "id": "fp-failure-resources-paragraph-2",
                    "kind": "paragraph",
                    "text": "送信済みの外部通信などは、UoWのabortだけでは取り消せません。再実行する処理には重複を識別する条件、必要なら補償の操作とその確定範囲を定めます。純粋計算は同じ入力で再現し、作用の再実行は業務とProviderの契約に従う、という分担で復旧を設計します。",
