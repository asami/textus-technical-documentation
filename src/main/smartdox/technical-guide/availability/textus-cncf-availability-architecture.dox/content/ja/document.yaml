                      ]
                    },
                    "text": "イミュータブルインフラストラクチャでは、稼働中の環境へ変更を積み重ねず、受入れ済みの成果物と構成から新しい環境を作って交換します。更新時の再現性と構成の明確さを保ち、異常な環境を使い続ける期間も抑えます。定期交代によって、起動、準備、切替え、排出を日常の運用でも確かめます。"
