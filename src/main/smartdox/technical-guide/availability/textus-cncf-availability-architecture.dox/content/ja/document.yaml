                "text": "ここまでの構造を前提に、役割と状態がどう変化するかを説明します。A・B・Cは変化を説明するための名前であり、常に三台を運用する構成指定ではありません。具体的な操作コマンドではなく、各分野の責務が切替え時にどう協調するかを示します。",
