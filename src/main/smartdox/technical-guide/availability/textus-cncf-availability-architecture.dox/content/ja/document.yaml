                    "text": "多数派や必要な権限を得られない場合は、無理に新Primaryを作らず更新を利用不可にします。確定更新を失わない保証は、正本DataStoreの永続化・複製方式が担う条件です。選出成功やキャッシュ反映位置から、データ損失ゼロを推定してはいけません。"
