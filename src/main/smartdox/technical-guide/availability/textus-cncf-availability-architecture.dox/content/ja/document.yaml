                      "flows": [
                        "ha-normal-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-normal-transitions",
                    "kind": "paragraph",
                    "text": "この通常構造を保ったまま役割や機体を変更するのが切替えです。計画切替えは旧機が協調できる状態で権限を移す動作、障害切替えは旧機の状態や完了を前提にできない場合の動作です。共通の機構を利用しますが、安全条件と結果の扱いは同じではありません。",
