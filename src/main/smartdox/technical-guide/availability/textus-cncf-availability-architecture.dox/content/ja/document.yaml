              {
                "id": "ha-emergency-readonly-section",
                "heading": "障害時・保守時のRead-onlyモード",
                "coreRefs": {
                  "steps": [
                    "ha-emergency-readonly"
                  ],
                  "claims": [
                    "ha-readonly-scope-claim",
                    "ha-readonly-maintenance-claim",
                    "ha-readonly-admission-claim",
                    "ha-readonly-transition-claim",
                    "ha-readonly-data-claim",
                    "ha-readonly-resident-data-claim",
                    "ha-readonly-cache-retention-claim",
                    "ha-readonly-cache-validity-claim",
                    "ha-service-mode-table-claim",
                    "ha-readonly-activation-claim",
                    "ha-readonly-recovery-claim"
                  ],
                  "nodes": [
                    "ha-readonly-scope-node",
                    "ha-readonly-maintenance-node",
                    "ha-readonly-admission-node",
                    "ha-readonly-transition-node",
                    "ha-readonly-data-node",
                    "ha-readonly-resident-data-node",
                    "ha-readonly-cache-retention-node",
                    "ha-readonly-cache-validity-node",
                    "ha-service-mode-table-node",
                    "ha-readonly-activation-node",
                    "ha-readonly-recovery-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-emergency-readonly-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-readonly-scope",
                    "kind": "paragraph",
                    "text": "Read-onlyモードは、対象Subsystemで業務データの更新を止め、条件を満たす参照を継続するための運転モードです。障害時の縮退運転と、計画的な保守作業の両方で利用する設計とします。Read Replicaは実行環境の役割、Read-onlyは業務の提供方針であり、別の軸として扱います。",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-scope-claim"
                      ],
                      "nodes": [
                        "ha-readonly-scope-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-maintenance",
                    "kind": "paragraph",
                    "text": "障害時には、更新の安全性や引継ぎを確認できない状況でも、許可できる参照を残すために使います。保守時には、作業前に新規更新を止め、受付済み処理の結果を確認してから、点検やデータ整備などを行うために使います。保守で必要な管理操作は明示した権限と範囲で別に扱います。作業によって安全な参照を維持できない範囲は停止し、保守中も必ず参照できるとは扱いません。",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-maintenance-claim"
                      ],
                      "nodes": [
                        "ha-readonly-maintenance-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-admission",
                    "kind": "paragraph",
                    "text": "更新の停止は、画面のボタンだけでなく、API、定期処理、Job・Workflow、イベント経由など、業務更新を開始する共通の受付・実行境界で適用します。参照に見える操作が業務データを変更する場合も、その副作用は許可しません。監査記録、観測、キャッシュ管理など運転維持に必要な書込みは、業務更新とは分けた限定経路で扱います。Read-onlyを理由に認証・認可や必須の監査を省略しません。",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-admission-claim"
                      ],
                      "nodes": [
                        "ha-readonly-admission-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-transition",
                    "kind": "paragraph",
                    "text": "移行を要求した時点で、受付済みの更新が残ることがあります。新規受付を閉じ、有効な権限の下で残る処理の結果を確定させる間は「移行中」として表示し、業務更新が止まった状態と区別します。権限を失った機体の完走は前提にせず、Fencingと結果の照合を行います。応答しない旧機や古い経路から更新が続けられる状態を、参照専用が成立したとは扱いません。",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-transition-claim"
                      ],
                      "nodes": [
                        "ha-readonly-transition-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-data",
                    "kind": "paragraph",
                    "text": "参照には、信頼できる正本またはキャッシュと、有効な認可が必要です。同期が遅れている場合は、その鮮度で利用してよい問い合わせだけを提供します。画面や応答には参照専用であること、更新を停止した理由、データの反映状況を示します。最新の確定状態が必要な操作、認可を確認できない操作、データの信頼性を確保できない操作は、参照であっても利用不可にします。",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-data-claim"
                      ],
                      "nodes": [
                        "ha-readonly-data-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-resident-data",
                    "kind": "paragraph",
                    "text": "永続化先が不調な間は、常駐済みのデータで処理できる参照と、ディスクからの再読込みが必要な参照を分けます。キャッシュミスや未構築の索引が必要な場合は、不調な保存先を無制限に待たず、対応する利用不可の応答を返します。最後に確認できた反映状態と利用できる範囲を示し、認証・認可や必須監査などの依存条件も満たす参照を残します。プロセスが停止して常駐状態を失った後は、利用可能な正本や適格な他Replicaから再構築する経路が必要です。",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-resident-data-claim"
                      ],
                      "nodes": [
                        "ha-readonly-resident-data-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-cache-retention",
                    "kind": "paragraph",
                    "text": "Working Setの常駐方針に加えて、業務参照用キャッシュにはRead-only中の保持方針を設けます。通常のTTL切れや定期パージだけを理由に参照可能な値を破棄せず、最後に確認できた値を残します。鮮度の期限と反映状態は記録し続け、期限切れの値は古い可能性があることを示したうえで、許可された参照にだけ使います。保持対象とメモリ予算を明示します。",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-cache-retention-claim"
                      ],
                      "nodes": [
                        "ha-readonly-cache-retention-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-cache-validity",
                    "kind": "paragraph",
                    "text": "この保持方針は、認証セッションや権限の有効期限を延長するものではありません。明示された削除・無効化・失効や、適格な確定更新の同期は引き続き反映します。値を保持できても、無効化された範囲は必要な更新と確認が済むまで提供しません。通常運転への復帰では、必要な正本との同期・照合を行ってから通常のキャッシュ保持方針へ戻します。",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-cache-validity-claim"
                      ],
                      "nodes": [
                        "ha-readonly-cache-validity-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-service-mode-table",
                    "kind": "table",
                    "caption": "業務の提供モードと許可範囲",
                    "columns": [
                      {
                        "id": "col-1",
