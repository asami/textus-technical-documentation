                  {
                    "id": "ha-sme-target",
                    "kind": "paragraph",
                    "text": "中心的な対象は、中小企業の一般的な業務システムです。通常の設定で利用できる標準構成として、必要なサービス継続性を得られることを目指します。利用者が選出、同期、切替えなどの詳細を個別に設計・設定し直すことを、通常の導入の前提にはしません。使いやすさは、このHA水準を現実的な費用と運用負担で利用できるための条件です。",
                    "coreRefs": {
                      "steps": [
                        "ha-target-level"
                      ],
                      "claims": [
                        "ha-sme-target-claim"
                      ],
                      "nodes": [
                        "ha-sme-target-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-target-level-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-target-interpretation",
                    "kind": "paragraph",
                    "text": "狙う水準は、機体の台数やHAという名称ではなく、どの停止・障害まで業務を継続するかで示します。最初の実用化はlocal-haによる計画交換です。実行環境の障害への対応も設計対象ですが、自動障害切替えは別途実装・検証して提供する順序です。ホスト障害への対応はhost-haで必要に応じて選びます。",
                    "coreRefs": {
