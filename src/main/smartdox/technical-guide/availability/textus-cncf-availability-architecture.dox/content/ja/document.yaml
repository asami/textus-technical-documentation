                    "text": "etcd Election／Leaseは選出と期限付き権限の参照実装です。etcdでの権限判定と他の保存先の更新保護は別です。公式仕様：https://etcd.io/docs/v3.6/dev-guide/api_concurrency_reference_v3/ および https://etcd.io/docs/v3.6/learning/api/#lease-api 。"
