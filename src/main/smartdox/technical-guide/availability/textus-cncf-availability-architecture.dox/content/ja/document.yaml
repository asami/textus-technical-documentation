                  {
                    "id": "ha-readonly-activation",
                    "kind": "paragraph",
                    "text": "運用者が、障害対応または保守作業という理由を明示して切り替えられる構成を設計候補とします。障害検知に連動して自動移行する場合も、どの障害条件で、どの参照を残してよいかを明示します。更新できないことを検出しただけで、すべての参照を許可するものではありません。このモードは設計候補であり、CNCFに専用のモードやABIが実装済みという意味ではありません。",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-activation-claim"
