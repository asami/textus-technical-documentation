    "nodes": [
      {
        "nodeRef": "ha-purpose-node",
        "text": "本書は、Textus/CNCFが業務サービスの継続をどのような構造で支えるかを説明する技術ガイドです。まずHAの目的と品質目標を示し、全体構成を実行系、データ・同期系、制御系、配備・運用系へ分けて説明します。その構造を踏まえて、通常運転、計画切替え、障害切替えを読み解きます。イミュータブルインフラストラクチャの採用判断と日常運用は専用ガイドが扱い、本書はHAを構成する責務と相互関係に重点を置きます。"
      },
      {
        "nodeRef": "ha-reading-map-node",
        "text": "第1章で目的、第2章で全体像、第3〜5章で分野別の構造、第6章で状態変化、第7章で配備と運用を扱います。実装順序と参照元は付録へ分けます。本書は設計を説明するもので、記載した機能すべての実装・実環境での検証完了を意味しません。"
      },
      {
        "nodeRef": "ha-purpose-area-intro-node",
        "text": "本章では、構成や手順に先立ち、何を継続し、何を守るためにHAを設けるかを整理します。サービスの継続と更新結果の保全を両立させることが、後の構造を選ぶ基準です。"
      },
      {
        "nodeRef": "ha-business-purpose-node",
        "text": "HA（High Availability、高可用性）の目的は、必要な業務機能を、要求した時間と条件で使い続けられるようにすることです。プロセスの故障だけでなく、実行環境や部品の更新、保守のための交換も継続性へ影響します。Textusでは、通常運転の構成と、環境を交換・復旧する構成を一体として設計します。"
      },
      {
        "nodeRef": "ha-application-goal-node",
        "text": "業務アプリケーションには安定したOperationの境界を提供し、どの物理インスタンスが処理するか、いつ交代するかを基盤が扱います。開発者が業務処理ごとに切替えやReplica管理を作り込まず、業務の規則と必要な品質を指定できることを目標にします。"
      },
      {
        "nodeRef": "ha-quality-table-node",
        "text": "HAで同時に確認する品質"
      },
      {
        "nodeRef": "ha-quality-contract-node",
        "text": "短時間で切り替わること、更新が失われないこと、キャッシュが最新であることは、それぞれ異なる条件です。メモリ常駐は応答性を、正本の永続化は確定状態の保全を、HAは利用継続を支えます。構成を選んだだけで達成したとはせず、保存先と実行経路を含めて、業務の要求に対応する水準を確認します。"
      },
      {
        "nodeRef": "ha-failure-boundary-intro-node",
        "text": "対象とする故障の範囲も先に定めます。同一ホスト上の複数実行環境はプロセス交換には役立ちますが、ホスト全体の停止への対策にはなりません。ホスト障害や拠点障害を扱うには、実行系に加えて保存、調停、ネットワークなどの配置と可用性を揃える必要があります。"
      },
      {
        "nodeRef": "ha-architecture-map-node",
        "text": "TextusのHAは、二台の機体を用意するだけの構成ではありません。業務を実行する構造、状態を保持・同期する構造、処理してよい主体を決める構造、実行環境を配置・観測する構造を組み合わせます。以下の分野は、説明上の責務の分割です。各分野が必ず独立したプロセスや製品になるという意味ではありません。"
      },
      {
        "nodeRef": "ha-concern-tree-node",
        "text": "HAを構成する分野と説明の階層"
      },
      {
        "nodeRef": "ha-area-table-node",
        "text": "分野ごとの責務と接続先"
      },
      {
        "nodeRef": "ha-overview-figure-node",
        "text": "実行・データ・制御・配備の接続"
      },
      {
        "nodeRef": "ha-overview-boundary-node",
        "text": "図は一つのDomain Subsystemに対する論理構成です。枠は物理ホストや障害区画ではありません。実線は業務要求・データの経路、破線は制御・配備・観測の関係を示します。Replicaはメモリ状態を共有する別名ではなく、それぞれ独立した実行環境です。制御サービスの内部リーダーと業務処理のPrimaryも別の概念です。図は主要な関係に絞っています。初期構築や保持中の旧機への同期は、データ構造と切替えの章で説明します。"
      },
      {
        "nodeRef": "ha-request-write-node",
        "text": "更新要求は、安定した業務APIから、正当な新規受付権限を持つPrimaryへ渡されます。Domainの規則とUnitOfWorkで正本への更新結果を確定し、その確定結果が常駐状態や参照用の投影へ反映されます。Application側で接続先を選べることと、更新してよいことの判定は分けます。"
      },
      {
        "nodeRef": "ha-request-read-node",
        "text": "参照要求は、許可された範囲と必要な鮮度を満たすPrimaryまたはRead Replicaへ渡します。Read Replicaが参照に使えることは、更新処理の開始やPrimaryへの昇格を許可されたことを意味しません。参照の利用可否は、認可に加えて、必要なデータが反映済みかという条件でも判断します。"
      },
      {
        "nodeRef": "ha-request-control-node",
        "text": "制御系は、現在の受付主体、各機の準備と同期状態を使い、切替え・保持・退役の可否を判断します。配備系はその判断に対応して実行環境を生成・停止し、観測系は実際の状態と失敗理由を提示します。業務データの確定と制御系の状態更新を、同じ記録や同じ版番号として扱いません。"
      },
      {
        "nodeRef": "ha-immutable-relation-node",
        "text": "HAはサービスを使い続けるための設計であり、イミュータブルインフラストラクチャは実行環境を変更せず交換する運用です。両者は目的が異なりますが、準備済みの別環境へ仕事を引き継ぐ構造を共有します。採用理由や定期交換の運用判断は[[../../immutable-infrastructure/textus-cncf-immutable-infrastructure.dox/index.dox][専用ガイド]]で扱います。"
      },
      {
        "nodeRef": "ha-immutable-purpose-node",
        "text": "イミュータブルインフラストラクチャでは、稼働中の環境へ変更を積み重ねず、受入れ済みの成果物と構成から新しい環境を作って交換します。更新時の再現性と構成の明確さを保ち、異常な環境を使い続ける期間も抑えます。定期交代によって、起動、準備、切替え、排出を日常の運用でも確かめます。"
      },
      {
        "nodeRef": "ha-platform-responsibility-node",
        "text": "この交代はアプリケーション固有の起動スクリプトや切替え処理ではなく、CNCF Runtimeと配備ドライバーが担う設計です。アプリケーションは業務契約と永続化の条件を定め、基盤が準備確認、受付先の変更、キャッシュ追随、排出と退役を管理します。短命であることと変更せず交換することは別の性質です。"
      },
      {
        "nodeRef": "ha-execution-intro-node",
        "text": "実行系は、同じ業務契約を実行できる複数のSubsystemと、それらへ要求を渡す安定した入口から構成します。機体の役割と準備状態を明示し、通常の業務呼出しを、環境の生成・交換の管理から分離します。"
      },
      {
        "nodeRef": "ha-role-table-node",
        "text": "可用性構成の役割"
      },
      {
        "nodeRef": "ha-role-composition-node",
        "text": "Read Replicaは参照サービスの役割、Standbyは昇格に備える役割です。同じ機体が両方を兼ねられますが、読取り可能であるだけでは昇格可能とは限りません。最小構成はPrimaryとStandbyを兼ねるRead Replicaの二台で、将来は複数のRead Replicaを同じ同期基盤へ参加させます。"
      },
      {
        "nodeRef": "ha-retained-role-node",
        "text": "更新の排出が終わった旧Primaryは、保持期間が残っているだけでDrainingとは呼びません。同期を続ける切戻し用の環境として保持します。既存のACTIVE、STANDBY、DRAININGというライフサイクル状態名の変更と、説明用語の採用は別の作業です。"
      },
      {
        "nodeRef": "ha-lifecycle-separation-node",
        "text": "生存はプロセスが応答すること、準備は必要な版・接続・データを備えること、権限は特定の処理を開始・完了してよいことです。これらを独立して捉えることで、起動しただけの機体が更新を始めたり、参照可能なReplicaが勝手にPrimaryになったりすることを防ぎます。"
      },
      {
        "nodeRef": "ha-lifecycle-table-node",
        "text": "実行環境の状態と判断"
      },
      {
        "nodeRef": "ha-lifecycle-state-names-node",
        "text": "既存のACTIVE・STANDBY・DRAININGは実行状態の名前です。本文のPrimary、Read Replica、Standbyは責務や適格性を説明する用語であり、文書上の用語整理だけでAPIや設定の状態名を変更しません。完了待ちが終わった旧機を同期した切戻し用環境として保持する場合、その保持を処理中のDrainingと区別します。"
      },
      {
        "nodeRef": "ha-state-intro-node",
        "text": "データの保全と高速な参照は、役割の異なる状態を接続して実現します。正本の永続化、メモリ常駐、Replica間の反映、実行中の業務処理を分けて説明し、それぞれが切替えへ提供する条件を明確にします。"
      },
      {
        "nodeRef": "ha-state-separation-node",
        "text": "CNCFは、メモリ常駐で応答性を高めながら、業務の継続に必要な状態を特定プロセスのメモリだけに残さない構造を意図しています。更新はDomainの規則とUnitOfWorkを通して正本へ確定し、キャッシュやViewはその結果に従います。交換するのは実行環境であり、確定した業務データや対応済みのJob・Workflow継続記録は別に保持します。一時状態や結果不明の処理は別に扱い、旧メモリのコピーをデータ保全の根拠にしません。"
      },
      {
        "nodeRef": "ha-state-table-node",
        "text": "状態の所有者と再構築"
      },
      {
        "nodeRef": "ha-memory-performance-node",
        "text": "CNCFは、業務処理で利用するデータの多くをメモリに載せることを志向します。EntitySpace、Entity Realm、索引やViewを常駐させ、繰り返しの取得・構築を減らして応答性を高めます。業務の継続に必要な状態を特定プロセスのメモリだけに残さない構造と組み合わせることで、メモリの性能と環境の交換可能性を両立させます。メモリ常駐やReplica台数そのものを、データが永続化された証拠にはしません。"
      },
      {
        "nodeRef": "ha-cache-structure-node",
        "text": "キャッシュ同期は、正本の確定変更を、現在のPrimary、参照提供中のReplica、構築中のReplica、保持中の旧機へ反映する共通基盤です。HA制御はその反映位置と準備状態を使います。同期基盤がPrimaryを選ぶのでも、HA制御が業務更新を再実行してReplicaを揃えるのでもありません。"
      },
      {
        "nodeRef": "ha-cache-commit-node",
        "text": "同期基盤は、処理の受付やメモリ上の変更ではなく、永続化側で確定した更新を扱います。データ確定後、通知前にプロセスが停止しても、更新を取りこぼさず発見して追随できる接続が必要です。abortされた更新を成功した更新として配布しません。"
      },
      {
        "nodeRef": "ha-cache-version-node",
        "text": "更新、削除、無効化、パージを共通に扱い、通知の重複や到着順の逆転で古い値が復活しないようにします。パージはキャッシュを捨てる操作であり、業務データの削除ではありません。パージ前に開始した読込みが遅れて完了しても、新しい世代のキャッシュへ古い値を戻してはいけません。"
      },
      {
        "nodeRef": "ha-cache-progress-node",
        "text": "各機の受信位置と反映済み位置を区別します。反映済み位置は、それ以前の必要な変更をすべて反映した範囲です。Aの遅い確定とBの新規確定も、送信元や到着時刻ではなく、永続化側の順序・版に対応付けます。異なる保存先に根拠のない単一の確定順序を与えません。"
      },
      {
        "nodeRef": "ha-cache-bootstrap-node",
        "text": "Cの初期構築では、対応する整合点が分かる初期状態を取得し、その後の差分へ追随します。構築中の更新を落とさず、必要な反映位置に達してから参照先として利用します。履歴不足や通知の欠落を解消できない場合は、その範囲を未準備にして再構築します。"
      },
      {
        "nodeRef": "ha-read-consistency-node",
        "text": "遅延を許容する読取りと、特定の確定状態を必要とする読取りを区別します。後者では必要な位置へ追随した機体を選ぶか、許可された正本読取り、制限付き待機、利用不可の応答を使います。新Primaryへ接続しただけで、切替え後のAの確定まで反映済みとは限りません。"
      },
      {
        "nodeRef": "ha-update-conflict-node",
