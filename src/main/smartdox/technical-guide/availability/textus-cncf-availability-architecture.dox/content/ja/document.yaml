                "id": "ha-overview-boundary",
                "kind": "paragraph",
                "text": "図は一つのDomain Subsystemに対する論理構成です。枠は物理ホストや障害区画ではありません。実線は業務要求・データの経路、破線は制御・配備・観測の関係を示します。Replicaはメモリ状態を共有する別名ではなく、それぞれ独立した実行環境です。制御サービスの内部リーダーと業務処理のPrimaryも別の概念です。図は主要な関係に絞っています。初期構築や保持中の旧機への同期は、データ構造と切替えの章で説明します。",
