                "id": "ha-state-intro",
                "kind": "paragraph",
                "text": "データの保全と高速な参照は、役割の異なる状態を接続して実現します。正本の永続化、メモリ常駐、Replica間の反映、実行中の業務処理を分けて説明し、それぞれが切替えへ提供する条件を明確にします。",
