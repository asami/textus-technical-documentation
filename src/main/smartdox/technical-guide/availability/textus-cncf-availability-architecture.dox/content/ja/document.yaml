            "kind": "paragraph",
            "text": "本書は、Textus/CNCFが業務サービスの継続をどのような構造で支えるかを説明する技術ガイドです。まずHAの目的と品質目標を示し、全体構成を実行系、データ・同期系、制御系、配備・運用系へ分けて説明します。その構造を踏まえて、通常運転、計画切替え、障害切替えを読み解きます。イミュータブルインフラストラクチャの採用判断と日常運用は専用ガイドが扱い、本書はHAを構成する責務と相互関係に重点を置きます。",
