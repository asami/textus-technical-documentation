                },
                "blocks": [
                  {
                    "id": "ha-normal-composition",
                    "kind": "paragraph",
                    "text": "通常時は、Primaryが新規更新を受け付け、必要に応じてRead Replicaへ参照を分散します。正本の確定結果を共通の同期経路で反映し、制御系は所有権と準備状態を観測します。Standbyは待機しているだけの予備ではなく、許可された参照を処理しながら昇格準備を確認できる役割です。",
                    "coreRefs": {
                      "steps": [
                        "ha-normal"
                      ],
                      "claims": [
                        "ha-normal-composition-claim"
                      ],
                      "nodes": [
                        "ha-normal-composition-node"
