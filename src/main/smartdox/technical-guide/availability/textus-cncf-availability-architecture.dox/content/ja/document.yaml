                      "relations": [],
                      "flows": [
                        "ha-control-flow"
                      ]
                    },
                    "text": "選出や分散合意をCNCFで自作せず、既存の調停基盤を利用します。etcd Election／Leaseが最初の候補で、同等の契約を満たす既設基盤も利用できます。候補を選出できたことだけで、その機体に更新を開始させてはいけません。FencingとReadinessも揃える必要があります。"
                  },
                  {
                    "id": "ha-fencing-boundary",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-control"
                      ],
                      "claims": [
                        "ha-fencing-boundary-claim"
                      ],
                      "nodes": [
                        "ha-fencing-boundary-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-control-flow"
                      ]
                    },
                    "text": "ロードバランサーの切替えやLeaseの確認だけでは、古いPrimaryが保存先へ書き込むことを防げません。必要な境界で権限を強制し、確認から書込みまでの隙間も扱います。etcd内の権限確認は、PostgreSQLや外部サービスへの書込みを自動的には保護しません。"
                  },
                  {
                    "id": "ha-control-topology",
                    "kind": "paragraph",
                    "coreRefs": {
