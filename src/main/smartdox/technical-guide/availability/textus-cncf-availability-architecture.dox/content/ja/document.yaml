                      ]
                    }
                  },
                  {
                    "id": "ha-memory-performance",
                    "kind": "paragraph",
                    "text": "CNCFは、業務処理で利用するデータの多くをメモリに載せることを志向します。EntitySpace、Entity Realm、索引やViewを常駐させ、繰り返しの取得・構築を減らして応答性を高めます。業務の継続に必要な状態を特定プロセスのメモリだけに残さない構造と組み合わせることで、メモリの性能と環境の交換可能性を両立させます。メモリ常駐やReplica台数そのものを、データが永続化された証拠にはしません。",
                    "coreRefs": {
                      "steps": [
                        "ha-memory"
                      ],
                      "claims": [
                        "ha-memory-performance-claim"
                      ],
                      "nodes": [
                        "ha-memory-performance-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-working-set-selection",
                    "kind": "paragraph",
                    "text": "常駐対象は、Entityの分類とWorking Set方針で決めます。マスター系は有効な全件を常駐させます。トランザクション系では活動中の取引に加え、活動中の利用者とその業務に必要なデータをWorking Setとして保持することを想定します。全履歴の常駐を避けつつ、現在の活動に必要な範囲を選ぶ考え方です。現行の分類ではmasterが全件常駐の既定値を持ち、取引Entityのworkflowでは状態項目と活動中の条件を明示する方針が必要です。利用者の活動条件に応じた保持は、これとは別に定義・確認する方針です。",
                    "coreRefs": {
                      "steps": [
                        "ha-memory"
                      ],
                      "claims": [
                        "ha-working-set-selection-claim"
                      ],
                      "nodes": [
                        "ha-working-set-selection-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-working-set-user-context",
                    "kind": "paragraph",
                    "text": "例えば、アクティブユーザーのカート内容、ユーザー自身の住所、配送先などがWorking Setの対象になります。住所のようにそれ自身は状態遷移しない情報も、現在の利用者や取引に必要であれば含めます。Working Setは「現在の業務活動に必要なデータのまとまり」として捉え、利用者の認可範囲を保って保持します。全件常駐するマスターを使う場合はその常駐データを利用します。活動が終わると常駐対象を見直し、正本のデータは独立して保持します。この利用者単位の方針が現行コードで自動適用済みとは扱いません。",
                    "coreRefs": {
                      "steps": [
                        "ha-memory"
                      ],
