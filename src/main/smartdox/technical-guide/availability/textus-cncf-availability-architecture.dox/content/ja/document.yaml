                    "id": "ha-target-service-window",
                    "kind": "paragraph",
                    "text": "一般的な業務で必要な水準は、利用時間帯、許容停止時間、確定データの保全、応答性と費用から選びます。全用途へ同じ稼働率や無条件の無停止を約束するものではありません。ホストや拠点まで保護範囲を広げる場合は、保存先・調停・通信なども同じ条件を満たす構成と確認が必要です。",
