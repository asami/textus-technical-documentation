                    }
                  },
                  {
                    "id": "ha-readonly-recovery",
                    "kind": "paragraph",
                    "text": "通常運転へ戻すには、障害原因の解消または保守作業の完了に加え、正当なPrimary権限とFencing、必要なデータの同期・準備、受付済み更新や結果不明の処理の照合を確認し、復帰を判断します。Primaryが応答したことや保守予定時刻を過ぎたことだけでは解除しません。拒否した更新は未受付として利用者へ明示し、裏で蓄積して復帰後に無断実行しません。すでに受け付けた処理の回復は、その処理の契約に従います。",
