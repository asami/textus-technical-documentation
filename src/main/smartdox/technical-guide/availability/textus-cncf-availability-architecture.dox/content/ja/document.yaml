                    "id": "ha-readonly-goal",
                    "kind": "paragraph",
                    "text": "障害時や保守時に更新を止め、条件を満たす参照を残すRead-onlyモードも、業務継続の設計候補に含めます。メモリに常駐した業務データや索引を活かし、永続化先が不調でも広い範囲の参照業務を続けられることを狙います。通常の全機能を提供できない場合にも利用できる範囲を明示し、参照まで安全に提供できない範囲は利用不可にします。",
