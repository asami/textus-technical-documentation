                        "ha-retention-flow"
                      ]
                    },
                    "text": "計画切替え後のAは、切戻しのために一定期間保持し、その間も新しい確定状態へ追随させます。切戻しは古いメモリへ戻す操作ではありません。保持していたCARの互換性と最新の準備状態を確認し、同じ受付引継ぎと排出の手順で再昇格させます。"
                  },
                  {
                    "id": "ha-retirement-table",
                    "kind": "table",
                    "coreRefs": {
