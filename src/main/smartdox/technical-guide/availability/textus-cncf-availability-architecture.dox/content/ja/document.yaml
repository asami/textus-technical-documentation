                    },
                    "text": "障害時には、応答しないAの排出完了を待ちません。失効した完了権限も継続させず、永続状態から確定済み・取消済み・結果不明を区別します。すでに確定した更新は保持し、結果不明の外部作用やRunning処理は、その回復契約で扱います。新Bでの無条件再実行は行いません。"
