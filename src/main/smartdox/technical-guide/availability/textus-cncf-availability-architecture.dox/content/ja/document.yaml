                    }
                  },
                  {
                    "id": "ha-memory-availability",
                    "kind": "paragraph",
                    "text": "メモリ常駐は、縮退運転の継続性にも寄与します。正本のディスクやDBへのアクセスが遅延・停止しても、既知の確定状態と必要な索引が常駐していれば、そのデータだけで完結する検索・一覧・照会を継続できる構造です。更新を止めて常駐データを活用するRead-onlyモードは、この特性をHAの利用継続へつなぐ設計です。実際に継続できる業務の範囲は、常駐範囲と依存先を含めて確認します。",
                    "coreRefs": {
                      "steps": [
                        "ha-memory"
                      ],
                      "claims": [
                        "ha-memory-availability-claim"
                      ],
                      "nodes": [
                        "ha-memory-availability-node"
