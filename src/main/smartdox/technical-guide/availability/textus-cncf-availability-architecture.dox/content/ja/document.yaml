            "blocks": [
              {
                "id": "ha-control-intro",
                "kind": "paragraph",
                "text": "制御系が決めるのは、どの機体が、どの範囲の処理を、どの条件で扱ってよいかです。経路の変更だけに依存せず、所有者の選出、期限付きの権限、実際の更新拒否、準備状態を組み合わせます。CNCFは既存の調停基盤と業務実行・保存の接続を担います。",
                "coreRefs": {
                  "steps": [
                    "ha-control-area"
                  ],
                  "claims": [
