                    "text": "障害切替えは、Primaryの停止、権限更新の失敗、必要な接続の喪失などで計画的な引継ぎができない場合に使います。応答しないだけでは停止したと断定できません。調停基盤による有効な選出・権限、旧権限を拒否するFencing、候補のReadinessが揃ってから更新を開始します。"
                  },
                  {
                    "id": "ha-failover-no-drain",
                    "kind": "paragraph",
                    "coreRefs": {
