                "blocks": [
                  {
                    "id": "ha-business-purpose",
                    "kind": "paragraph",
                    "text": "HA（High Availability、高可用性）の目的は、必要な業務機能を、要求した時間と条件で使い続けられるようにすることです。プロセスの故障だけでなく、実行環境や部品の更新、保守のための交換も継続性へ影響します。Textusでは、通常運転の構成と、環境を交換・復旧する構成を一体として設計します。",
                    "coreRefs": {
                      "steps": [
                        "ha-goals"
                      ],
                      "claims": [
                        "ha-business-purpose-claim"
                      ],
                      "nodes": [
                        "ha-business-purpose-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-goals-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-application-goal",
                    "kind": "paragraph",
                    "text": "業務アプリケーションには安定したOperationの境界を提供し、どの物理インスタンスが処理するか、いつ交代するかを基盤が扱います。開発者が業務処理ごとに切替えやReplica管理を作り込まず、業務の規則と必要な品質を指定できることを目標にします。",
                    "coreRefs": {
