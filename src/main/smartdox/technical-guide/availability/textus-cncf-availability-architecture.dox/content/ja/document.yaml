                    "text": "イミュータブルインフラストラクチャの採用理由と運用は[[../../immutable-infrastructure/textus-cncf-immutable-infrastructure.dox/index.dox][専用ガイド]]、防御全体との関係は[[../../security/textus-cncf-security-architecture.dox/index.dox][Securityガイド]]、メモリ常駐とUoW・回復可能性は[[../../reactive/textus-cncf-reactive-architecture.dox/index.dox][リアクティブ技術ガイド]]を参照します。",
