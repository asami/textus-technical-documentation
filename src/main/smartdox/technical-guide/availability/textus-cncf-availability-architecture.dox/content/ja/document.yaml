                    "text": "Textus固有の設計根拠はCNCFのAvailability Architecture、Subsystem Runtime Architecture、Runtime Cache Synchronization、およびPhase 108の先行実装計画です。用語と方針の変更は新規ジャーナルへ記録し、過去のジャーナルを書き換えません。本書はそれらを読者向けに説明するガイドです。"
