              {
                "id": "ha-cache-section",
                "heading": "確定更新を共有するキャッシュ同期基盤",
                "coreRefs": {
                  "steps": [
                    "ha-cache"
                  ],
                  "claims": [
                    "ha-cache-structure-claim",
                    "ha-cache-commit-claim",
                    "ha-cache-version-claim",
                    "ha-cache-progress-claim",
                    "ha-cache-bootstrap-claim",
                    "ha-read-consistency-claim"
                  ],
                  "nodes": [
                    "ha-cache-structure-node",
                    "ha-cache-commit-node",
                    "ha-cache-version-node",
                    "ha-cache-progress-node",
                    "ha-cache-bootstrap-node",
                    "ha-read-consistency-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-cache-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-cache-structure",
                    "kind": "paragraph",
                    "text": "キャッシュ同期は、正本の確定変更を、現在のPrimary、参照提供中のReplica、構築中のReplica、保持中の旧機へ反映する共通基盤です。HA制御はその反映位置と準備状態を使います。同期基盤がPrimaryを選ぶのでも、HA制御が業務更新を再実行してReplicaを揃えるのでもありません。",
                    "coreRefs": {
                      "steps": [
                        "ha-cache"
                      ],
                      "claims": [
                        "ha-cache-structure-claim"
                      ],
                      "nodes": [
                        "ha-cache-structure-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-cache-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-cache-commit",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-cache"
                      ],
                      "claims": [
                        "ha-cache-commit-claim"
                      ],
                      "nodes": [
                        "ha-cache-commit-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-cache-flow"
                      ]
                    },
                    "text": "同期基盤は、処理の受付やメモリ上の変更ではなく、永続化側で確定した更新を扱います。データ確定後、通知前にプロセスが停止しても、更新を取りこぼさず発見して追随できる接続が必要です。abortされた更新を成功した更新として配布しません。"
                  },
                  {
                    "id": "ha-cache-version",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-cache"
                      ],
                      "claims": [
                        "ha-cache-version-claim"
                      ],
                      "nodes": [
                        "ha-cache-version-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-cache-flow"
                      ]
                    },
                    "text": "更新、削除、無効化、パージを共通に扱い、通知の重複や到着順の逆転で古い値が復活しないようにします。パージはキャッシュを捨てる操作であり、業務データの削除ではありません。パージ前に開始した読込みが遅れて完了しても、新しい世代のキャッシュへ古い値を戻してはいけません。"
                  },
                  {
                    "id": "ha-cache-progress",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-cache"
                      ],
                      "claims": [
                        "ha-cache-progress-claim"
                      ],
                      "nodes": [
                        "ha-cache-progress-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-cache-flow"
                      ]
                    },
                    "text": "各機の受信位置と反映済み位置を区別します。反映済み位置は、それ以前の必要な変更をすべて反映した範囲です。Aの遅い確定とBの新規確定も、送信元や到着時刻ではなく、永続化側の順序・版に対応付けます。異なる保存先に根拠のない単一の確定順序を与えません。"
                  },
                  {
                    "id": "ha-cache-bootstrap",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-cache"
                      ],
                      "claims": [
                        "ha-cache-bootstrap-claim"
                      ],
                      "nodes": [
                        "ha-cache-bootstrap-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-cache-flow"
                      ]
                    },
                    "text": "Cの初期構築では、対応する整合点が分かる初期状態を取得し、その後の差分へ追随します。構築中の更新を落とさず、必要な反映位置に達してから参照先として利用します。履歴不足や通知の欠落を解消できない場合は、その範囲を未準備にして再構築します。"
                  },
                  {
                    "id": "ha-read-consistency",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-cache"
                      ],
                      "claims": [
                        "ha-read-consistency-claim"
                      ],
                      "nodes": [
                        "ha-read-consistency-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-cache-flow"
                      ]
                    },
                    "text": "遅延を許容する読取りと、特定の確定状態を必要とする読取りを区別します。後者では必要な位置へ追随した機体を選ぶか、許可された正本読取り、制限付き待機、利用不可の応答を使います。新Primaryへ接続しただけで、切替え後のAの確定まで反映済みとは限りません。"
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-updates-section",
                "heading": "更新処理とJob・Workflowの継続",
                "coreRefs": {
                  "steps": [
                    "ha-updates"
                  ],
                  "claims": [
                    "ha-update-conflict-claim",
                    "ha-update-settlement-claim",
                    "ha-long-work-claim"
                  ],
                  "nodes": [
                    "ha-update-conflict-node",
                    "ha-update-settlement-node",
                    "ha-long-work-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-updates-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-update-conflict",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-updates"
                      ],
                      "claims": [
                        "ha-update-conflict-claim"
                      ],
                      "nodes": [
                        "ha-update-conflict-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-updates-flow"
                      ]
                    },
                    "text": "Aの受付済み更新とBの新規更新が同じデータに触れる場合、その競合は正本側のトランザクションや版の検査で扱います。受付順だけで確定順を保証したり、後から届いた値で上書きしたりしません。業務上の因果関係が必要なら、その処理契約で確保します。"
                  },
                  {
                    "id": "ha-update-settlement",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-updates"
                      ],
                      "claims": [
                        "ha-update-settlement-claim"
                      ],
                      "nodes": [
                        "ha-update-settlement-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-updates-flow"
                      ]
                    },
                    "text": "更新の完走とは必ず成功することではなく、実際のcommit、abort、失敗などの結果を確定することです。HTTP応答を返したかだけでは排出完了を判断しません。確定の応答が失われた場合や外部送信の結果が不明な場合は、未実行と決めつけず照合します。"
                  },
                  {
                    "id": "ha-long-work",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-updates"
                      ],
                      "claims": [
                        "ha-long-work-claim"
                      ],
                      "nodes": [
                        "ha-long-work-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-updates-flow"
                      ]
                    },
                    "text": "長時間のJobやWorkflowは、採用版で実際に対応する永続化済みの区切りと回復契約を使います。永続化されているだけで、実行途中のRunningタスクを別機へ移して再実行できるとは限りません。計画交代の時刻だけを理由に有効な受付済み処理を強制中断せず、長引く排出と不確実な結果を観測可能にします。"
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ha-control-area-section",
            "heading": "制御系の構造",
            "coreRefs": {
              "steps": [
                "ha-control-area"
              ],
