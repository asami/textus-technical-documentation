                "blocks": [
                  {
                    "id": "ha-authority-model",
                    "kind": "paragraph",
                    "text": "新規の独立した更新を受け付ける所有者は一つにします。一方、計画切替えでは、切替え前に受け付けた処理を完了するための限定した権限を旧Primaryへ残します。新Primaryが受付を始めた後も旧機が更新を確定できるのは、この限定された処理範囲によります。任意の更新を二台から始められるactive-active構成とは異なります。",
                    "coreRefs": {
                      "steps": [
                        "ha-authority"
                      ],
                      "claims": [
                        "ha-authority-model-claim"
                      ],
                      "nodes": [
                        "ha-authority-model-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-authority-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-switchover-scope",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-authority"
                      ],
                      "claims": [
                        "ha-switchover-scope-claim"
                      ],
                      "nodes": [
                        "ha-switchover-scope-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-authority-flow"
                      ]
                    },
                    "text": "Aから新規の独立した更新を受け付けないよう、古い経路、定期実行、イベント経由の入口も閉じます。一方、受付済み処理の完了権限は、その実際の処理範囲に限定して残します。単純な単一書込みLeaseを切り替えるだけでは、この限定した重なりは実現できません。"
                  },
                  {
                    "id": "ha-authority-loss",
                    "kind": "paragraph",
                    "text": "限定された完了権限も、権限が有効である範囲でのみ使います。権限喪失や障害で失効した機体には、以前の受付済みという理由だけで更新を許しません。実際の保存・外部作用の境界で旧権限を拒否し、すでに起きた作用や結果不明の処理は回復の対象として照合します。",
                    "coreRefs": {
