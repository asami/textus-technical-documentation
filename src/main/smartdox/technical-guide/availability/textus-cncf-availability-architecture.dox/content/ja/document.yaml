                      ],
                      "relations": [],
                      "flows": [
                        "ha-control-flow"
                      ]
                    },
                    "text": "調停基盤の投票メンバー数とRead Replicaの台数は別です。二票の多数決構成は一票を失うと多数派を維持できません。ホスト障害を扱う配備では、独立した投票配置や既存の調停サービスも含めて設計します。Cをリードキャッシュとして追加しても、投票メンバーが自動で増えるわけではありません。"
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-authority-section",
                "heading": "新規受付と旧処理の完了を別の権限で扱う",
                "coreRefs": {
                  "steps": [
