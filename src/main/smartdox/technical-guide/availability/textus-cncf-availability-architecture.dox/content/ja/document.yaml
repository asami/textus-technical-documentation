                    "text": "HAはサービスを使い続けるための設計であり、イミュータブルインフラストラクチャは実行環境を変更せず交換する運用です。両者は目的が異なりますが、準備済みの別環境へ仕事を引き継ぐ構造を共有します。採用理由や定期交換の運用判断は[[../../immutable-infrastructure/textus-cncf-immutable-infrastructure.dox/index.dox][専用ガイド]]で扱います。",
