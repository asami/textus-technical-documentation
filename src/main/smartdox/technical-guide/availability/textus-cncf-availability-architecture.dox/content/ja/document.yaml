                    "text": "Kubernetes client-goのLeader Electionは、それ単体ではFencingを保証しないことを明記しています。PatroniのWatchdogは、権限を維持できない環境を停止する設計例です。参照：https://github.com/kubernetes/client-go/blob/master/tools/leaderelection/leaderelection.go および https://patroni.readthedocs.io/en/latest/watchdog.html 。これらをTextusの受付済み処理の完走契約そのものとは扱いません。"
