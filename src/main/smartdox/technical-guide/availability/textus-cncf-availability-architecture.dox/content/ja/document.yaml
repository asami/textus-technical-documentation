                    "text": "この交代はアプリケーション固有の起動スクリプトや切替え処理ではなく、CNCF Runtimeと配備ドライバーが担う設計です。アプリケーションは業務契約と永続化の条件を定め、基盤が準備確認、受付先の変更、キャッシュ追随、排出と退役を管理します。短命であることと変更せず交換することは別の性質です。"
