                    "ha-application-goal-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-goals-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-business-purpose",
                    "kind": "paragraph",
                    "text": "High availability means keeping required business functions usable within their specified time and operating conditions. Process failures, runtime/component updates and maintenance replacement all affect continuity. Textus designs ordinary service and replacement/recovery as one architecture.",
                    "coreRefs": {
                      "steps": [
                        "ha-goals"
                      ],
                      "claims": [
                        "ha-business-purpose-claim"
                      ],
                      "nodes": [
                        "ha-business-purpose-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-goals-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-application-goal",
                    "kind": "paragraph",
                    "text": "Applications use a stable Operation boundary while the platform manages physical instances and role changes. The goal is to let developers specify business rules and required quality without implementing replica management and switchover in each business handler.",
                    "coreRefs": {
                      "steps": [
                        "ha-goals"
                      ],
                      "claims": [
                        "ha-application-goal-claim"
                      ],
                      "nodes": [
                        "ha-application-goal-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-goals-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-target-level-section",
                "heading": "Target Workloads and Intended HA Level",
                "coreRefs": {
                  "steps": [
                    "ha-target-level"
                  ],
                  "claims": [
                    "ha-sme-target-claim",
                    "ha-target-interpretation-claim",
                    "ha-target-level-table-claim",
                    "ha-target-service-window-claim",
                    "ha-readonly-goal-claim"
                  ],
                  "nodes": [
                    "ha-sme-target-node",
                    "ha-target-interpretation-node",
                    "ha-target-level-table-node",
                    "ha-target-service-window-node",
                    "ha-readonly-goal-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-target-level-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-sme-target",
                    "kind": "paragraph",
                    "text": "The central target is ordinary business systems in small and medium-sized enterprises. A standard configuration should provide the required service continuity through ordinary settings, without making users individually redesign or configure election, synchronization and transfer for routine adoption. Ease of use makes this HA level accessible at realistic cost and operational burden.",
                    "coreRefs": {
                      "steps": [
                        "ha-target-level"
                      ],
                      "claims": [
                        "ha-sme-target-claim"
                      ],
                      "nodes": [
                        "ha-sme-target-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-target-level-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-target-interpretation",
                    "kind": "paragraph",
                    "text": "Express the intended level by which maintenance and failure conditions preserve business service, not by instance count or an HA label. The first operational delivery is planned replacement with local-ha. Runtime failure handling is also an architectural target, but automatic failover follows its own implementation and qualification. Select host-ha where host-failure tolerance is required.",
                    "coreRefs": {
                      "steps": [
                        "ha-target-level"
                      ],
                      "claims": [
                        "ha-target-interpretation-claim"
                      ],
                      "nodes": [
                        "ha-target-interpretation-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-target-level-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-target-level-table",
                    "kind": "table",
                    "caption": "Intended HA Levels and Boundaries",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Intended Boundary"
                      },
                      {
                        "id": "col-2",
                        "heading": "Target Business Continuity"
                      },
                      {
                        "id": "col-3",
                        "heading": "Configuration and Delivery Order"
                      }
                    ],
                    "rows": [
                      {
                        "id": "ha-target-level-table-row-1",
                        "cells": [
                          "Runtime and planned maintenance",
                          "Target continuity through updates/replacement for ordinary SME business, and runtime-failure handling",
                          "local-ha; planned replacement first, automatic failover qualified subsequently"
                        ]
                      },
                      {
                        "id": "ha-target-level-table-row-2",
                        "cells": [
                          "Host failure",
                          "Select takeover on another host according to business requirements",
                          "host-ha, with aligned runtime and dependency failure boundaries"
                        ]
                      },
                      {
                        "id": "ha-target-level-table-row-3",
                        "cells": [
                          "AZ or site failure",
                          "Design broader continuity including site loss as a separate configuration",
                          "Future scope; not current standard delivery or a Phase 108 completion condition"
                        ]
                      }
                    ],
                    "coreRefs": {
                      "steps": [
                        "ha-target-level"
                      ],
                      "claims": [
                        "ha-target-level-table-claim"
                      ],
                      "nodes": [
                        "ha-target-level-table-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-target-level-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-target-service-window",
                    "kind": "paragraph",
                    "text": "Choose the business-appropriate level from service hours, tolerated downtime, committed-data preservation, responsiveness and cost. This does not promise one availability percentage or unconditional uninterrupted service for every use. Extending protection to hosts or sites requires storage, coordination, networking and other dependencies to meet the same qualified boundary.",
                    "coreRefs": {
                      "steps": [
                        "ha-target-level"
                      ],
                      "claims": [
                        "ha-target-service-window-claim"
                      ],
                      "nodes": [
                        "ha-target-service-window-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-target-level-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-goal",
                    "kind": "paragraph",
                    "text": "Read-only for failure or maintenance is a proposed continuity level that stops mutations while preserving qualified reads. Resident business data and indexes are intended to sustain a broad range of read work even when persistence access is impaired. Make the available scope explicit when full service cannot continue, and leave unavailable any read scope that cannot be served safely.",
                    "coreRefs": {
                      "steps": [
                        "ha-target-level"
                      ],
                      "claims": [
                        "ha-readonly-goal-claim"
                      ],
                      "nodes": [
                        "ha-readonly-goal-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-target-level-flow"
                      ]
                    }
                  }
