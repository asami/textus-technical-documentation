                    },
                    "caption": "Availability roles",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Term"
                      },
                      {
                        "id": "col-2",
                        "heading": "Responsibility"
                      }
                    ],
                    "rows": [
                      {
                        "id": "ha-role-table-row-1",
                        "cells": [
                          "Primary",
                          "Admit new authoritative mutations"
                        ]
                      },
                      {
                        "id": "ha-role-table-row-2",
