        "blocks": [
          {
            "id": "ha-purpose",
            "kind": "paragraph",
            "text": "This technical guide explains the structure through which Textus/CNCF supports business-service continuity. It starts with HA purpose and quality targets, then separates execution, data/synchronization, control, and deployment/operation. Normal service, planned switchover and failover are explained in terms of that structure. The companion immutable-infrastructure guide covers adoption and everyday replacement operation; this guide focuses on HA responsibilities and their relationships.",
            "coreRefs": {
              "steps": [
                "textus-cncf-availability-architecture"
              ],
              "claims": [
                "ha-purpose-claim"
              ],
              "nodes": [
                "ha-purpose-node"
              ],
              "relations": [],
              "flows": [
                "textus-cncf-availability-architecture-flow"
              ]
            }
          },
          {
            "id": "ha-reading-map",
            "kind": "paragraph",
            "text": "Chapter 1 establishes purpose; Chapter 2 presents the whole architecture; Chapters 3–5 explain its structural areas; Chapter 6 covers changes of state; Chapter 7 covers deployment and operation. Delivery order and sources are separated into the appendix. This is an architectural explanation, not a claim that every described capability has been implemented and qualified.",
            "coreRefs": {
              "steps": [
                "textus-cncf-availability-architecture"
              ],
              "claims": [
                "ha-reading-map-claim"
              ],
              "nodes": [
