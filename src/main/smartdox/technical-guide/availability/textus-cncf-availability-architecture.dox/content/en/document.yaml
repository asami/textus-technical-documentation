                "sections": []
              },
              {
                "id": "ha-failover-section",
                "heading": "Recovering Authority and Business State After Failure",
                "coreRefs": {
                  "steps": [
                    "ha-failover"
                  ],
                  "claims": [
                    "ha-failover-purpose-claim",
                    "ha-failover-no-drain-claim",
                    "ha-protocol-table-claim",
                    "ha-failover-loss-claim"
                  ],
                  "nodes": [
                    "ha-failover-purpose-node",
                    "ha-failover-no-drain-node",
                    "ha-protocol-table-node",
                    "ha-failover-loss-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-failover-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-failover-purpose",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-failover"
                      ],
                      "claims": [
                        "ha-failover-purpose-claim"
                      ],
                      "nodes": [
                        "ha-failover-purpose-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-failover-flow"
                      ]
                    },
                    "text": "Failover applies when a crash, ownership-renewal failure or loss of required connectivity prevents cooperative transfer. Lack of response does not prove the process stopped. Mutation service begins only after valid takeover ownership, effective fencing of former authority and candidate readiness are established."
                  },
                  {
                    "id": "ha-failover-no-drain",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-failover"
                      ],
                      "claims": [
                        "ha-failover-no-drain-claim"
                      ],
                      "nodes": [
                        "ha-failover-no-drain-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-failover-flow"
                      ]
                    },
                    "text": "Do not wait for an unreachable A to acknowledge drain. Do not preserve invalidated completion authority. Reconcile committed, aborted and uncertain outcomes from durable state. Preserve confirmed changes and use owning recovery contracts for uncertain effects and Running work instead of blindly executing them again on B."
                  },
                  {
                    "id": "ha-protocol-table",
                    "kind": "table",
                    "coreRefs": {
                      "steps": [
                        "ha-failover"
                      ],
                      "claims": [
                        "ha-protocol-table-claim"
                      ],
                      "nodes": [
                        "ha-protocol-table-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-failover-flow"
                      ]
                    },
                    "caption": "Two switching protocols",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Concern"
                      },
                      {
                        "id": "col-2",
                        "heading": "Switchover"
                      },
                      {
