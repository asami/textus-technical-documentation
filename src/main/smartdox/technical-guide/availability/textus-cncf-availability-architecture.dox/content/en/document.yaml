                          "Failed, unreachable or no longer authorized"
                        ]
                      },
                      {
                        "id": "ha-protocol-table-row-2",
                        "cells": [
                          "Admitted work",
                          "Settle its outcome on A",
                          "Reconcile authoritative facts and perform only eligible recovery"
                        ]
                      },
                      {
                        "id": "ha-protocol-table-row-3",
                        "cells": [
                          "Promotion",
                          "Readiness and controlled admission transfer",
                          "Election, valid ownership, fencing and readiness"
                        ]
                      },
                      {
                        "id": "ha-protocol-table-row-4",
                        "cells": [
                          "Waiting",
                          "Drain, replacement Read Replica and retention conditions",
                          "No unreachable-node drain acknowledgement required"
                        ]
                      },
                      {
                        "id": "ha-protocol-table-row-5",
                        "cells": [
                          "Former runtime returns",
                          "Keep a synchronized fallback",
                          "Rejoin as replica; never self-restore Primary role"
                        ]
                      }
                    ]
                  },
                  {
                    "id": "ha-failover-loss",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-failover"
                      ],
                      "claims": [
                        "ha-failover-loss-claim"
                      ],
                      "nodes": [
                        "ha-failover-loss-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-failover-flow"
                      ]
                    },
                    "text": "Without required control ownership/quorum, do not force a new Primary; report mutations unavailable. Preservation of acknowledged writes depends on the authoritative DataStore durability/replication contract. Election success or a cache position does not imply zero data loss."
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-emergency-readonly-section",
                "heading": "Read-only Mode for Failure and Maintenance",
                "coreRefs": {
                  "steps": [
                    "ha-emergency-readonly"
                  ],
                  "claims": [
                    "ha-readonly-scope-claim",
                    "ha-readonly-maintenance-claim",
                    "ha-readonly-admission-claim",
                    "ha-readonly-transition-claim",
                    "ha-readonly-data-claim",
                    "ha-readonly-resident-data-claim",
                    "ha-readonly-cache-retention-claim",
                    "ha-readonly-cache-validity-claim",
                    "ha-service-mode-table-claim",
                    "ha-readonly-activation-claim",
                    "ha-readonly-recovery-claim"
                  ],
                  "nodes": [
                    "ha-readonly-scope-node",
                    "ha-readonly-maintenance-node",
                    "ha-readonly-admission-node",
                    "ha-readonly-transition-node",
                    "ha-readonly-data-node",
                    "ha-readonly-resident-data-node",
                    "ha-readonly-cache-retention-node",
                    "ha-readonly-cache-validity-node",
                    "ha-service-mode-table-node",
                    "ha-readonly-activation-node",
                    "ha-readonly-recovery-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-emergency-readonly-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-readonly-scope",
                    "kind": "paragraph",
                    "text": "Read-only is an operating mode that stops business-data mutations in the target Subsystem while retaining qualified reads. It is proposed for both failure-time degradation and planned maintenance. Read Replica is a runtime role; Read-only is a business-service mode. They are separate axes.",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-scope-claim"
                      ],
                      "nodes": [
                        "ha-readonly-scope-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-maintenance",
                    "kind": "paragraph",
                    "text": "During failure, preserve permitted reads when safe mutations or takeover cannot be established. For maintenance, close new mutations before work, settle admitted outcomes, then perform inspection or data maintenance. Necessary administrative maintenance actions have separately explicit authority and scope. Stop any read scope that the work makes unsafe; read availability is not guaranteed during every maintenance task.",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-maintenance-claim"
                      ],
                      "nodes": [
                        "ha-readonly-maintenance-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-admission",
                    "kind": "paragraph",
                    "text": "Enforce the mutation stop at shared admission/execution boundaries for APIs, scheduled work, Jobs/Workflows and event-triggered business changes, not merely screen controls. Do not allow business mutations hidden in apparent read operations. Necessary audit, observation and cache-management writes use separately bounded operational paths. Read-only does not bypass authentication, authorization or required audit.",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-admission-claim"
                      ],
                      "nodes": [
                        "ha-readonly-admission-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-transition",
                    "kind": "paragraph",
                    "text": "Updates may already be admitted when transition is requested. Close new admission and show transition in progress while validly authorized remaining work settles; distinguish this from established business read-only service. Do not assume a runtime with lost authority can finish: enforce fencing and reconcile outcomes. Read-only is not established if unreachable former members or stale routes can still perform unauthorized mutations.",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-transition-claim"
                      ],
                      "nodes": [
                        "ha-readonly-transition-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-data",
                    "kind": "paragraph",
                    "text": "Reads require trusted authoritative or cached data and valid authorization. With synchronization lag, serve only queries whose freshness contract allows it. Responses/UI identify read-only service, the mutation-stop reason and data application status. Refuse even a read when it requires a newer confirmed state, authorization cannot be established or data trust cannot be maintained.",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-data-claim"
                      ],
                      "nodes": [
                        "ha-readonly-data-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-resident-data",
                    "kind": "paragraph",
                    "text": "While persistence access is impaired, separate reads completed from resident data from those requiring disk reload. A cache miss or unavailable index must not wait indefinitely for impaired storage; return the corresponding unavailable outcome. Expose the last qualified applied state and available scope, and retain only reads meeting authentication, authorization, required audit and other dependencies. After process loss removes resident state, reconstruction requires an available authoritative source or qualified replica.",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-resident-data-claim"
                      ],
                      "nodes": [
                        "ha-readonly-resident-data-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-cache-retention",
                    "kind": "paragraph",
                    "text": "In addition to Working Set residency, business-read caches have a Read-only retention policy. Do not discard usable values merely because ordinary TTL expiry or scheduled purge occurs; retain the last qualified values. Keep freshness deadlines and applied-state metadata meaningful, mark expired values as potentially stale, and use them only for permitted reads. Declare retained scope and memory budget.",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-cache-retention-claim"
                      ],
                      "nodes": [
                        "ha-readonly-cache-retention-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-cache-validity",
                    "kind": "paragraph",
                    "text": "Retention does not extend authentication-session or permission validity. Continue to apply explicit deletion, invalidation, revocation and qualified committed-change synchronization. Retaining bytes does not permit serving an invalidated scope before required refresh and checks. Before restoring normal cache retention, qualify required synchronization and reconciliation with authoritative state.",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-cache-validity-claim"
                      ],
                      "nodes": [
                        "ha-readonly-cache-validity-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-service-mode-table",
                    "kind": "table",
                    "caption": "Business Service Modes and Permitted Work",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Service Mode"
                      },
                      {
                        "id": "col-2",
                        "heading": "Business Mutations"
                      },
                      {
                        "id": "col-3",
                        "heading": "Reads"
                      }
                    ],
                    "rows": [
                      {
                        "id": "ha-service-mode-table-row-1",
                        "cells": [
                          "Normal operation",
                          "Admit/execute with valid authority and readiness",
                          "Authorized reads with required freshness"
                        ]
                      },
                      {
                        "id": "ha-service-mode-table-row-2",
                        "cells": [
                          "Read-only (failure / maintenance)",
                          "Refuse new business mutations; show draining old work separately during transition",
                          "Continue only trusted, authorized, freshness-qualified reads"
                        ]
                      },
                      {
                        "id": "ha-service-mode-table-row-3",
                        "cells": [
                          "Unavailable",
                          "Do not admit",
                          "Do not serve reads whose conditions cannot be met"
                        ]
                      }
                    ],
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-service-mode-table-claim"
                      ],
                      "nodes": [
                        "ha-service-mode-table-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-activation",
                    "kind": "paragraph",
                    "text": "The proposal allows operator selection with an explicit reason: failure response or maintenance. Automatic transition from failure detection must specify eligible failure conditions and permitted reads. Detecting mutation unavailability does not authorize all reads. This is a design proposal, not an implemented dedicated CNCF mode or ABI.",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-activation-claim"
                      ],
                      "nodes": [
                        "ha-readonly-activation-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-readonly-recovery",
                    "kind": "paragraph",
                    "text": "Return to normal operation after resolving the failure cause or completing maintenance, and qualifying Primary authority/fencing, synchronization/readiness and admitted or uncertain outcomes. A responding Primary or an elapsed maintenance window alone is insufficient. Identify refused mutations as unadmitted; do not silently accumulate and execute them after recovery. Previously admitted work follows its own recovery contract.",
                    "coreRefs": {
                      "steps": [
                        "ha-emergency-readonly"
                      ],
                      "claims": [
                        "ha-readonly-recovery-claim"
                      ],
                      "nodes": [
                        "ha-readonly-recovery-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-emergency-readonly-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-retention-section",
                "heading": "Retention, Switch-back and Retirement Conditions",
                "coreRefs": {
                  "steps": [
                    "ha-retention"
                  ],
                  "claims": [
                    "ha-fallback-current-claim",
                    "ha-retirement-table-claim",
                    "ha-retirement-scope-claim",
                    "ha-car-compatibility-claim"
                  ],
                  "nodes": [
                    "ha-fallback-current-node",
                    "ha-retirement-table-node",
                    "ha-retirement-scope-node",
                    "ha-car-compatibility-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-retention-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-fallback-current",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-retention"
                      ],
                      "claims": [
                        "ha-fallback-current-claim"
                      ],
                      "nodes": [
                        "ha-fallback-current-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-retention-flow"
                      ]
                    },
                    "text": "Retain A for a configured fallback window after planned transfer and keep it synchronized. Switch-back is not restoration of old memory. Recheck retained CAR compatibility and current readiness, then use the same controlled admission-transfer and drain protocol for reactivation."
                  },
                  {
                    "id": "ha-retirement-table",
                    "kind": "table",
                    "coreRefs": {
                      "steps": [
                        "ha-retention"
                      ],
                      "claims": [
                        "ha-retirement-table-claim"
                      ],
                      "nodes": [
                        "ha-retirement-table-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-retention-flow"
                      ]
                    },
                    "caption": "Conditions for planned retirement",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Condition"
                      },
                      {
                        "id": "col-2",
                        "heading": "Required observation"
                      }
                    ],
                    "rows": [
                      {
                        "id": "ha-retirement-table-row-1",
                        "cells": [
                          "Admitted updates",
                          "Former Primary outcomes are settled"
                        ]
                      },
                      {
                        "id": "ha-retirement-table-row-2",
                        "cells": [
                          "Replacement Read Replica",
                          "Required read/takeover capacity is ready"
                        ]
                      },
                      {
                        "id": "ha-retirement-table-row-3",
                        "cells": [
                          "Retention and observation",
                          "Configured window and health criteria are satisfied"
                        ]
                      },
                      {
                        "id": "ha-retirement-table-row-4",
                        "cells": [
                          "Outstanding work",
                          "No switch-back or uncertain outcome requires the retained runtime"
                        ]
                      }
                    ]
                  },
                  {
                    "id": "ha-retirement-scope",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-retention"
                      ],
                      "claims": [
                        "ha-retirement-scope-claim"
                      ],
                      "nodes": [
                        "ha-retirement-scope-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-retention-flow"
                      ]
                    },
                    "text": "Planned retirement requires every condition, not merely timer expiry. Isolation or shutdown of a failed runtime is separate from these graceful-retirement waits. Required outcome and reconciliation information must survive independently of that runtime."
                  },
                  {
                    "id": "ha-car-compatibility",
                    "kind": "paragraph",
                    "text": "For a component update, fallback requires the retained CAR to remain compatible with current business data. Breaking storage changes leave the ordinary automatic route and require maintenance. Suspected compromised runtimes do not qualify for normal fallback retention.",
                    "coreRefs": {
                      "steps": [
                        "ha-retention"
                      ],
                      "claims": [
                        "ha-car-compatibility-claim"
                      ],
                      "nodes": [
                        "ha-car-compatibility-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-retention-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ha-deployment-area-section",
            "heading": "Deployment and Operation Structure",
            "coreRefs": {
              "steps": [
                "ha-deployment-area"
              ],
              "claims": [
                "ha-deployment-intro-claim"
              ],
              "nodes": [
                "ha-deployment-intro-node"
              ],
              "relations": [],
              "flows": [
                "ha-deployment-area-flow"
              ]
            },
            "blocks": [
              {
                "id": "ha-deployment-intro",
                "kind": "paragraph",
                "text": "Physical realization relates logical structure to failure domains, dependencies, resources, observation and operating decisions. Declare the offered availability boundary and select the configuration and qualification it requires.",
                "coreRefs": {
                  "steps": [
                    "ha-deployment-area"
                  ],
                  "claims": [
                    "ha-deployment-intro-claim"
                  ],
                  "nodes": [
                    "ha-deployment-intro-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-deployment-area-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ha-profiles-section",
                "heading": "Deployment Profiles and Failure Domains",
                "coreRefs": {
                  "steps": [
                    "ha-profiles"
                  ],
                  "claims": [
                    "ha-profile-table-claim",
                    "ha-profile-driver-claim",
                    "ha-profile-dependencies-claim"
                  ],
                  "nodes": [
                    "ha-profile-table-node",
                    "ha-profile-driver-node",
                    "ha-profile-dependencies-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-profiles-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-profile-table",
                    "kind": "table",
                    "caption": "Qualification Boundaries by Configuration",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Configuration"
                      },
                      {
                        "id": "col-2",
                        "heading": "Intended Boundary"
                      },
                      {
                        "id": "col-3",
                        "heading": "Separate Qualification"
                      }
                    ],
                    "rows": [
                      {
                        "id": "ha-profile-table-row-1",
                        "cells": [
                          "single",
                          "One runtime; planned reconstruction may interrupt service",
                          "No continuous-service or replacement-capacity HA claim"
                        ]
                      },
                      {
                        "id": "ha-profile-table-row-2",
                        "cells": [
                          "local-ha",
                          "Multiple runtimes on one host; runtime failures and planned replacement",
                          "Host/OS/power failure and storage/coordination failure"
                        ]
                      },
                      {
                        "id": "ha-profile-table-row-3",
                        "cells": [
                          "host-ha",
                          "Separate hosts with qualified takeover after host loss",
                          "Storage, coordination, network and identity must meet the same requirement"
                        ]
                      }
                    ],
                    "coreRefs": {
                      "steps": [
                        "ha-profiles"
                      ],
                      "claims": [
                        "ha-profile-table-claim"
                      ],
                      "nodes": [
                        "ha-profile-table-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-profiles-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-profile-driver",
                    "kind": "paragraph",
                    "text": "CNCF manages logical roles, readiness and authority; the Deployment Driver realizes processes, containers and host placement. The first physical route targets Docker Compose local-ha without requiring Kubernetes. Changing deployment technology does not change the readiness/authority conditions for handing over business work.",
                    "coreRefs": {
                      "steps": [
                        "ha-profiles"
                      ],
                      "claims": [
                        "ha-profile-driver-claim"
                      ],
                      "nodes": [
                        "ha-profile-driver-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-profiles-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-profile-dependencies",
                    "kind": "paragraph",
                    "text": "Separate runtime hosts do not establish system-wide host tolerance if DataStore, messaging, storage, coordination, identity/secrets or networking remain incompatible single points of failure. Multi-AZ/site availability is future scope requiring integrated consistency and recovery policy. Box count is not availability evidence.",
                    "coreRefs": {
                      "steps": [
                        "ha-profiles"
                      ],
                      "claims": [
                        "ha-profile-dependencies-claim"
                      ],
                      "nodes": [
                        "ha-profile-dependencies-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-profiles-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-operation-section",
                "heading": "Observe Actual State and Qualify Continuity",
                "coreRefs": {
                  "steps": [
                    "ha-operation"
                  ],
                  "claims": [
                    "ha-native-evidence-claim",
                    "ha-observation-claim"
                  ],
                  "nodes": [
                    "ha-native-evidence-node",
                    "ha-observation-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-operation-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-native-evidence",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-operation"
                      ],
                      "claims": [
                        "ha-native-evidence-claim"
                      ],
                      "nodes": [
                        "ha-native-evidence-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-operation-flow"
                      ]
                    },
                    "text": "Use separate runtime instances and authoritative data to demonstrate admission moving from A to B while an update remains active, followed by propagation of A’s late commit to B/C. Vary replacement readiness, unsettled work, retention and switch-back conditions independently and verify that A is not retired prematurely."
                  },
                  {
                    "id": "ha-observation",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-operation"
                      ],
                      "claims": [
                        "ha-observation-claim"
                      ],
                      "nodes": [
                        "ha-observation-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-operation-flow"
                      ]
                    },
                    "text": "Observe Primary admission ownership, member roles, Lease/fencing, readiness, replication lag/gaps, draining work, retention and unmet retirement conditions. Repeat scheduled rotation, selected compatible-CAR replacement and current-state switch-back. Cadence and retention are deployment policy, not hard-coded one-day CNCF constants."
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-policy-section",
                "heading": "Choose Policy, Cost and Ownership",
                "coreRefs": {
                  "steps": [
                    "ha-policy"
                  ],
                  "claims": [
                    "ha-policy-profiles-claim",
                    "ha-policy-cost-claim",
                    "ha-policy-observation-owner-claim"
                  ],
                  "nodes": [
                    "ha-policy-profiles-node",
                    "ha-policy-cost-node",
                    "ha-policy-observation-owner-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-policy-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-policy-profiles",
                    "kind": "paragraph",
                    "text": "For ordinary SME workloads, the goal is to obtain the intended continuity level by selecting a standard availability configuration through ordinary settings. Detailed settings are overrides for intentional changes to read freshness, cadence, readiness, drain or retention. Relate quality targets to configuration rather than scattering these choices through business code. Actual settings and default availability depend on the selected version.",
                    "coreRefs": {
                      "steps": [
                        "ha-policy"
                      ],
                      "claims": [
                        "ha-policy-profiles-claim"
                      ],
                      "nodes": [
                        "ha-policy-profiles-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-policy-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-policy-cost",
                    "kind": "paragraph",
                    "text": "Standing replicas, temporary reconstruction capacity, longer retention and frequent rotation cost resources and operational effort. Choose them against tolerated downtime, data preservation and responsiveness. Platform mechanisms do not remove responsibility for business requirements and configuration decisions.",
                    "coreRefs": {
                      "steps": [
                        "ha-policy"
                      ],
                      "claims": [
                        "ha-policy-cost-claim"
                      ],
                      "nodes": [
                        "ha-policy-cost-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-policy-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-policy-observation-owner",
                    "kind": "paragraph",
                    "text": "CNCF Runtime owns role, authority, synchronization and transfer facts; Control Center presents them operationally. A healthy screen is not evidence of durable updates or promotion authority. Feed actual rotation and failure qualification back into evidence for the selected quality targets.",
                    "coreRefs": {
                      "steps": [
                        "ha-policy"
                      ],
                      "claims": [
                        "ha-policy-observation-owner-claim"
                      ],
                      "nodes": [
                        "ha-policy-observation-owner-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-policy-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ha-appendix-area-section",
            "heading": "Appendix: Delivery Plan and Sources",
            "coreRefs": {
              "steps": [
                "ha-appendix-area"
              ],
              "claims": [
                "ha-appendix-intro-claim"
              ],
              "nodes": [
                "ha-appendix-intro-node"
              ],
              "relations": [],
              "flows": [
                "ha-appendix-area-flow"
              ]
            },
            "blocks": [
              {
                "id": "ha-appendix-intro",
                "kind": "paragraph",
                "text": "Keep architecture distinct from current delivery order and qualification. This appendix records planning and sources as of 2026-11-13, following the structural explanation and preserving the distinction between design and delivered capability.",
                "coreRefs": {
                  "steps": [
                    "ha-appendix-area"
                  ],
                  "claims": [
                    "ha-appendix-intro-claim"
                  ],
                  "nodes": [
                    "ha-appendix-intro-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-appendix-area-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ha-delivery-section",
                "heading": "First Delivery and Qualification",
                "coreRefs": {
                  "steps": [
                    "ha-delivery"
                  ],
                  "claims": [
                    "ha-first-delivery-claim",
                    "ha-priority-table-claim",
                    "ha-safety-first-claim",
                    "ha-first-deployment-claim",
                    "ha-guide-status-claim",
                    "ha-registered-data-service-plans-claim"
                  ],
                  "nodes": [
                    "ha-first-delivery-node",
                    "ha-priority-table-node",
                    "ha-safety-first-node",
                    "ha-first-deployment-node",
                    "ha-guide-status-node",
                    "ha-registered-data-service-plans-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-delivery-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-first-delivery",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-delivery"
                      ],
                      "claims": [
                        "ha-first-delivery-claim"
                      ],
                      "nodes": [
                        "ha-first-delivery-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-delivery-flow"
                      ]
                    },
                    "text": "The highest priority is the minimum practical immutable-infrastructure path. Deliver planned transfer, cache catch-up, a current fallback, conditional retirement, scheduled rotation and compatible-CAR replacement before completing broad automatic Failover or large/multi-site topologies."
                  },
                  {
                    "id": "ha-priority-table",
                    "kind": "table",
                    "coreRefs": {
                      "steps": [
                        "ha-delivery"
                      ],
                      "claims": [
                        "ha-priority-table-claim"
                      ],
                      "nodes": [
                        "ha-priority-table-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-delivery-flow"
                      ]
                    },
                    "caption": "First operational implementation order",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Order"
                      },
                      {
                        "id": "col-2",
                        "heading": "Delivery"
                      },
                      {
                        "id": "col-3",
                        "heading": "What to prove"
                      }
                    ],
                    "rows": [
                      {
                        "id": "ha-priority-table-row-1",
                        "cells": [
                          "IR-01",
                          "Owning admission/persistence/control integration",
                          "New admission, scoped completion and authority-loss refusal"
                        ]
                      },
                      {
                        "id": "ha-priority-table-row-2",
                        "cells": [
                          "IR-02",
                          "Generic cache synchronization",
                          "Versions, applied progress, late commits, deletion/purge and catch-up across A/B/C"
                        ]
                      },
                      {
                        "id": "ha-priority-table-row-3",
                        "cells": [
                          "IR-03",
                          "Planned transfer",
                          "A completes admitted updates after B begins new admission"
                        ]
                      },
                      {
                        "id": "ha-priority-table-row-4",
                        "cells": [
                          "IR-04",
                          "Retention and repeated operation",
                          "Switch-back, retirement, scheduling and compatible-CAR change"
                        ]
                      },
                      {
                        "id": "ha-priority-table-row-5",
                        "cells": [
                          "IR-05",
                          "Operational qualification",
                          "Real separate processes and authoritative data, including refusal and uncertainty"
                        ]
                      }
                    ]
                  },
                  {
                    "id": "ha-safety-first",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-delivery"
                      ],
                      "claims": [
                        "ha-safety-first-claim"
                      ],
                      "nodes": [
                        "ha-safety-first-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-delivery-flow"
                      ]
                    },
                    "text": "The first route still refuses invalid-authority updates and promotion of unready instances. Before automatic Failover is qualified, report its absence and make mutations safely unavailable when necessary. Prioritization does not defer safety conditions."
                  },
                  {
                    "id": "ha-first-deployment",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-delivery"
                      ],
                      "claims": [
                        "ha-first-deployment-claim"
                      ],
                      "nodes": [
                        "ha-first-deployment-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-delivery-flow"
                      ]
                    },
                    "text": "The first physical route follows the existing local-ha/Docker Compose direction and declares its actual failure boundary. Multiple processes on one host do not prove host-failure tolerance. Host-ha, other deployment drivers, replica-scale qualification and multi-site operation need separate evidence."
                  },
                  {
                    "id": "ha-guide-status",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-delivery"
                      ],
                      "claims": [
                        "ha-guide-status-claim"
                      ],
                      "nodes": [
                        "ha-guide-status-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-delivery-flow"
                      ]
                    },
                    "text": "This guide records design direction and first-delivery planning as of 2026-11-12. IR-01 through IR-05 remain open; authoring this guide does not implement or accept the capability. Use it with the reactive/security guides and the actual selected versions, configuration, dependencies and execution evidence."
                  },
                  {
                    "id": "ha-registered-data-service-plans",
                    "kind": "paragraph",
                    "text": "Resident-data extensions and Read-only operation are registered as separate development plans. Phase 123 covers Working Sets for active transactions and users, including carts, user information and addresses. Phase 124 covers business-mutation refusal during failure or maintenance, qualified read continuity, cache retention and return to normal operation. Both are planned and unstarted. First qualify single-runtime routes using existing residency; qualify user-activity extensions and multi-runtime integration against the actual capabilities of their owning foundations. Phase 108 acceptance is unchanged.",
                    "coreRefs": {
                      "steps": [
                        "ha-delivery"
                      ],
                      "claims": [
                        "ha-registered-data-service-plans-claim"
                      ],
                      "nodes": [
                        "ha-registered-data-service-plans-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-delivery-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-references-section",
                "heading": "Design Sources and Companion Guides",
                "coreRefs": {
                  "steps": [
                    "ha-references"
                  ],
                  "claims": [
                    "ha-companion-guides-claim",
                    "ha-local-sources-claim",
                    "ha-election-reference-claim",
                    "ha-fencing-reference-claim"
                  ],
                  "nodes": [
                    "ha-companion-guides-node",
                    "ha-local-sources-node",
                    "ha-election-reference-node",
                    "ha-fencing-reference-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-references-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-companion-guides",
                    "kind": "paragraph",
                    "text": "See the [[../../immutable-infrastructure/textus-cncf-immutable-infrastructure.dox/index.dox][Immutable Infrastructure guide]] for adoption and operation, the [[../../security/textus-cncf-security-architecture.dox/index.dox][Security guide]] for defense, and the [[../../reactive/textus-cncf-reactive-architecture.dox/index.dox][Reactive guide]] for residency, UoW and recoverability.",
                    "coreRefs": {
                      "steps": [
                        "ha-references"
                      ],
                      "claims": [
                        "ha-companion-guides-claim"
                      ],
                      "nodes": [
                        "ha-companion-guides-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-references-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-local-sources",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-references"
                      ],
                      "claims": [
                        "ha-local-sources-claim"
                      ],
                      "nodes": [
                        "ha-local-sources-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-references-flow"
                      ]
                    },
                    "text": "Textus-specific sources are CNCF Availability Architecture, Subsystem Runtime Architecture, Runtime Cache Synchronization and the Phase 108 first-delivery plan. New journal entries record terminology and policy changes; historical journals remain unchanged. This guide explains those sources for readers."
                  },
                  {
                    "id": "ha-election-reference",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-references"
                      ],
                      "claims": [
                        "ha-election-reference-claim"
                      ],
                      "nodes": [
                        "ha-election-reference-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-references-flow"
                      ]
                    },
                    "text": "etcd Election/Lease provides reference mechanisms for election and bounded ownership. Guarding etcd operations and protecting mutations in other stores are separate responsibilities. Official specifications: https://etcd.io/docs/v3.6/dev-guide/api_concurrency_reference_v3/ and https://etcd.io/docs/v3.6/learning/api/#lease-api ."
                  },
                  {
                    "id": "ha-fencing-reference",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-references"
                      ],
                      "claims": [
                        "ha-fencing-reference-claim"
                      ],
                      "nodes": [
                        "ha-fencing-reference-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-references-flow"
                      ]
                    },
                    "text": "Kubernetes client-go explicitly states that leader election alone does not guarantee fencing. Patroni watchdog is an example of stopping an environment that cannot maintain ownership. References: https://github.com/kubernetes/client-go/blob/master/tools/leaderelection/leaderelection.go and https://patroni.readthedocs.io/en/latest/watchdog.html . Neither directly supplies the Textus scoped old-work completion contract."
                  }
                ],
                "sections": []
              }
            ]
          }
        ]
      }
    ]
  },
