                  {
                    "id": "ha-quality-contract",
                    "kind": "paragraph",
                    "text": "Fast takeover, preservation of updates and fresh caches are separate conditions. Memory residency supports responsiveness, authoritative persistence preserves committed state, and HA supports service continuity. Selecting a configuration is not proof of achievement; qualify the required level across storage and execution paths.",
                    "coreRefs": {
                      "steps": [
                        "ha-quality"
                      ],
                      "claims": [
                        "ha-quality-contract-claim"
                      ],
                      "nodes": [
                        "ha-quality-contract-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-quality-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-failure-boundary-intro",
                    "kind": "paragraph",
                    "text": "Define the failure boundary first. Multiple runtimes on one host help process replacement but do not protect against loss of that host. Host or site failures require compatible availability and placement of storage, coordination, networking and execution.",
                    "coreRefs": {
                      "steps": [
                        "ha-quality"
