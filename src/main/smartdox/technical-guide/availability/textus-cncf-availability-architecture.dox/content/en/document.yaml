            "blocks": [
              {
                "id": "ha-purpose-area-intro",
                "kind": "paragraph",
                "text": "Before topology or procedures, establish what must remain usable and what must be preserved. Business-service continuity together with safe update outcomes determines the architecture that follows.",
                "coreRefs": {
                  "steps": [
                    "ha-purpose-area"
                  ],
                  "claims": [
                    "ha-purpose-area-intro-claim"
                  ],
                  "nodes": [
                    "ha-purpose-area-intro-node"
                  ],
                  "relations": [],
