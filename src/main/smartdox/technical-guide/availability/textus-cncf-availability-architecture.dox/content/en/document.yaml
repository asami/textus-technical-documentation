              "relations": [],
              "flows": [
                "ha-behavior-area-flow"
              ]
            },
            "blocks": [
              {
                "id": "ha-behavior-intro",
                "kind": "paragraph",
                "text": "With the structure established, this chapter explains role and state changes. A/B/C are explanatory identities, not a requirement to run three permanent machines. The account concerns cooperation between responsibilities, not operator command instructions.",
                "coreRefs": {
                  "steps": [
                    "ha-behavior-area"
                  ],
                  "claims": [
                    "ha-behavior-intro-claim"
                  ],
                  "nodes": [
                    "ha-behavior-intro-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-behavior-area-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ha-normal-section",
                "heading": "Cooperation During Ordinary Service",
                "coreRefs": {
                  "steps": [
                    "ha-normal"
                  ],
                  "claims": [
                    "ha-normal-composition-claim",
                    "ha-normal-transitions-claim"
                  ],
                  "nodes": [
                    "ha-normal-composition-node",
                    "ha-normal-transitions-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-normal-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-normal-composition",
                    "kind": "paragraph",
                    "text": "Normally the Primary admits mutations and permitted reads may be distributed to Read Replicas. Common synchronization applies authoritative committed results while control observes ownership and readiness. A Standby may serve authorized reads and exercise promotion readiness rather than remaining unused.",
                    "coreRefs": {
                      "steps": [
                        "ha-normal"
                      ],
                      "claims": [
                        "ha-normal-composition-claim"
                      ],
                      "nodes": [
                        "ha-normal-composition-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-normal-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-normal-transitions",
                    "kind": "paragraph",
                    "text": "Transfer changes roles or instances while preserving this ordinary architecture. Planned switchover transfers ownership with a cooperating former runtime; failover cannot rely on its state or completion. They share mechanisms but have different safety and outcome conditions.",
                    "coreRefs": {
                      "steps": [
                        "ha-normal"
                      ],
                      "claims": [
                        "ha-normal-transitions-claim"
                      ],
                      "nodes": [
                        "ha-normal-transitions-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-normal-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-switchover-section",
                "heading": "Role and State Changes in Planned Switchover",
                "coreRefs": {
