    ],
    "nodes": [
      {
        "nodeRef": "ha-purpose-node",
        "text": "This technical guide explains the structure through which Textus/CNCF supports business-service continuity. It starts with HA purpose and quality targets, then separates execution, data/synchronization, control, and deployment/operation. Normal service, planned switchover and failover are explained in terms of that structure. The companion immutable-infrastructure guide covers adoption and everyday replacement operation; this guide focuses on HA responsibilities and their relationships."
      },
      {
        "nodeRef": "ha-reading-map-node",
        "text": "Chapter 1 establishes purpose; Chapter 2 presents the whole architecture; Chapters 3–5 explain its structural areas; Chapter 6 covers changes of state; Chapter 7 covers deployment and operation. Delivery order and sources are separated into the appendix. This is an architectural explanation, not a claim that every described capability has been implemented and qualified."
      },
      {
        "nodeRef": "ha-purpose-area-intro-node",
        "text": "Before topology or procedures, establish what must remain usable and what must be preserved. Business-service continuity together with safe update outcomes determines the architecture that follows."
      },
      {
        "nodeRef": "ha-business-purpose-node",
        "text": "High availability means keeping required business functions usable within their specified time and operating conditions. Process failures, runtime/component updates and maintenance replacement all affect continuity. Textus designs ordinary service and replacement/recovery as one architecture."
      },
      {
        "nodeRef": "ha-application-goal-node",
        "text": "Applications use a stable Operation boundary while the platform manages physical instances and role changes. The goal is to let developers specify business rules and required quality without implementing replica management and switchover in each business handler."
      },
      {
        "nodeRef": "ha-quality-table-node",
        "text": "Quality Concerns to Qualify Together"
      },
      {
        "nodeRef": "ha-quality-contract-node",
        "text": "Fast takeover, preservation of updates and fresh caches are separate conditions. Memory residency supports responsiveness, authoritative persistence preserves committed state, and HA supports service continuity. Selecting a configuration is not proof of achievement; qualify the required level across storage and execution paths."
      },
      {
        "nodeRef": "ha-failure-boundary-intro-node",
        "text": "Define the failure boundary first. Multiple runtimes on one host help process replacement but do not protect against loss of that host. Host or site failures require compatible availability and placement of storage, coordination, networking and execution."
      },
      {
        "nodeRef": "ha-architecture-map-node",
        "text": "Textus HA is more than two machines. It combines business execution, state preservation/synchronization, authority control, and environment deployment/observation. These are divisions of responsibility; each need not be a separate process or product."
      },
      {
        "nodeRef": "ha-concern-tree-node",
        "text": "HA Concern Hierarchy"
      },
      {
        "nodeRef": "ha-area-table-node",
        "text": "Responsibilities and Connections by Area"
      },
      {
        "nodeRef": "ha-overview-figure-node",
        "text": "Execution, Data, Control and Deployment Connections"
      },
      {
        "nodeRef": "ha-overview-boundary-node",
        "text": "The figure shows the logical architecture for one Domain Subsystem. Boxes are not host or failure-domain boundaries. Solid lines are request/data paths; dashed lines are control, deployment and observation relationships. Replicas are separate runtimes, not aliases for shared memory. The coordination service internal leader is distinct from the business Primary. The figure selects principal relationships. The data and transition chapters explain initial construction and synchronization of retained former runtimes."
      },
      {
        "nodeRef": "ha-request-write-node",
        "text": "A stable business API sends a mutation to the Primary holding valid new-admission authority. Domain rules and UnitOfWork establish the authoritative outcome; committed results update resident state and read projections. Selecting an endpoint is distinct from authorization to mutate."
      },
      {
        "nodeRef": "ha-request-read-node",
        "text": "Reads use a Primary or Read Replica meeting authorization and freshness requirements. Eligibility to serve reads grants neither mutation admission nor promotion. Read eligibility therefore depends on both authorization and required applied data state."
      },
      {
        "nodeRef": "ha-request-control-node",
        "text": "Control consumes admission ownership, readiness and synchronization to decide transfer, retention and retirement. Deployment realizes runtime creation/stop, and observation exposes actual state and failure reasons. Business commits and control-state changes are not one record or one revision sequence."
      },
      {
        "nodeRef": "ha-immutable-relation-node",
        "text": "HA concerns service continuity; immutable infrastructure concerns replacing environments rather than modifying them in place. Their purposes differ, but they share the structure for handing work to prepared runtimes. The [[../../immutable-infrastructure/textus-cncf-immutable-infrastructure.dox/index.dox][companion guide]] covers adoption and regular-replacement policy."
      },
      {
        "nodeRef": "ha-immutable-purpose-node",
        "text": "Immutable infrastructure replaces an environment from admitted artifacts and configuration instead of accumulating in-place changes. It preserves reproducibility and a known configuration while limiting continued use of an unhealthy environment. Regular rotation exercises startup, preparation, transfer and drain during ordinary operation."
      },
      {
        "nodeRef": "ha-platform-responsibility-node",
        "text": "CNCF Runtime and deployment drivers own rotation rather than application-specific startup scripts and switching logic. Applications define business and persistence contracts; the infrastructure manages readiness, admission routing, cache catch-up, drain and retirement. A short lifetime and replacement without in-place modification are distinct properties."
      },
      {
        "nodeRef": "ha-execution-intro-node",
        "text": "Execution consists of multiple Subsystems implementing the same business contract and a stable entry that routes work to them. Explicit roles and readiness separate ordinary business calls from environment creation and replacement."
      },
      {
        "nodeRef": "ha-role-table-node",
        "text": "Availability roles"
      },
      {
        "nodeRef": "ha-role-composition-node",
        "text": "Read Replica describes read service; Standby describes promotion readiness. One instance may hold both roles, but read availability alone does not qualify it for promotion. The minimal topology has a Primary and a Standby-capable Read Replica, with additional Read Replicas joining the same synchronization infrastructure later."
      },
      {
        "nodeRef": "ha-retained-role-node",
        "text": "After its admitted work has settled, a former Primary is no longer draining merely because its retention window remains open. It remains a synchronized fallback. Adopting explanatory role names is separate from renaming existing ACTIVE, STANDBY or DRAINING lifecycle states."
      },
      {
        "nodeRef": "ha-lifecycle-separation-node",
        "text": "Liveness means a process responds; readiness means it has required versions, connections and data; authority means it may start or finish particular work. Keeping them separate prevents a merely running instance from admitting mutations or a readable replica from promoting itself."
      },
      {
        "nodeRef": "ha-lifecycle-table-node",
        "text": "Runtime State and Decisions"
      },
      {
        "nodeRef": "ha-lifecycle-state-names-node",
        "text": "Existing ACTIVE, STANDBY and DRAINING names describe lifecycle states. Primary, Read Replica and Standby explain responsibilities and eligibility; prose does not rename APIs or configuration tokens. After draining ends, synchronized fallback retention is distinct from still executing old work."
      },
      {
        "nodeRef": "ha-state-intro-node",
        "text": "Data preservation and fast reads connect different categories of state. This chapter distinguishes authoritative persistence, memory residency, replica application and running business work, and states the conditions each supplies to transfer."
      },
      {
        "nodeRef": "ha-state-separation-node",
        "text": "CNCF deliberately combines memory-resident responsiveness with an architecture that does not leave continuity-critical state solely in one process. Domain rules and UnitOfWork govern authoritative commits; caches and Views follow their outcomes. Replacement concerns the runtime, while committed business data and supported durable Job/Workflow records remain independent. Treat transient and uncertain work separately; an old memory copy is not proof of durability."
      },
      {
        "nodeRef": "ha-state-table-node",
        "text": "State Ownership and Reconstruction"
      },
      {
        "nodeRef": "ha-memory-performance-node",
        "text": "CNCF aims to keep much of the data used in business processing resident in memory. Resident EntitySpace, Entity Realms, indexes and Views reduce repeated retrieval/construction for responsiveness. Combining this with independent continuity-critical state supports both performance and replacement. Residency or replica count alone is not proof of durable data."
      },
      {
        "nodeRef": "ha-cache-structure-node",
        "text": "Cache synchronization distributes authoritative committed changes to the current Primary, serving replicas, warming members and retained former runtimes. HA control consumes applied progress and readiness. Synchronization does not elect the Primary, and HA does not synchronize replicas by replaying business mutations."
      },
      {
        "nodeRef": "ha-cache-commit-node",
        "text": "Synchronization follows committed source changes, not request acceptance or speculative memory updates. If a process stops after commit but before notification, the owning persistence integration must allow the change to be discovered and applied. Aborted updates are not distributed as successful changes."
      },
      {
        "nodeRef": "ha-cache-version-node",
        "text": "Handle updates, deletion, invalidation and scoped purge under common semantics. Duplicate or reordered notifications must not resurrect older values. Purge discards cache state rather than authoritative data, and a late load started before purge must not repopulate a newer cache generation with stale values."
      },
      {
        "nodeRef": "ha-cache-progress-node",
        "text": "Track received progress separately from applied-through progress. Applied-through covers all required preceding changes. Late A commits and new B commits follow source-owned ordering/versions rather than publisher identity or arrival time. Do not invent a single commit order across independent stores that provide no such order."
      },
      {
        "nodeRef": "ha-cache-bootstrap-node",
        "text": "Build C from a consistent baseline with a corresponding source position, then catch up subsequent changes without losing updates during construction. Admit it for reads only after reaching the required state. An unrecoverable history gap makes the affected scope unready and requires reconstruction."
      },
      {
        "nodeRef": "ha-read-consistency-node",
        "text": "Separate lag-tolerant reads from reads requiring a particular confirmed state. The latter need an eligible caught-up replica, an authorized authoritative read, bounded waiting or an unavailable outcome. Routing to the new Primary does not prove that A commits occurring after transfer have reached its cache."
      },
      {
        "nodeRef": "ha-update-conflict-node",
        "text": "If old admitted A work and new B work touch the same data, authoritative transactions/version checks handle the conflict. Admission order alone does not establish commit order, and last-arriving values must not overwrite newer state. Required business causal ordering belongs to the owning work contract."
      },
      {
        "nodeRef": "ha-update-settlement-node",
        "text": "Completing admitted work does not guarantee business success; it establishes an actual commit, abort or failure disposition. HTTP response completion alone is not drain completion. A lost commit acknowledgement or uncertain external send requires reconciliation, not an assumption that nothing happened."
      },
      {
        "nodeRef": "ha-long-work-node",
        "text": "Long-running Jobs and Workflows use durable boundaries and recovery contracts actually supported by the selected version. Persistence alone does not make an interrupted Running task transferable or replayable. A rotation deadline must not force-interrupt valid admitted work; prolonged drain and uncertain outcomes remain observable."
      },
      {
        "nodeRef": "ha-control-intro-node",
        "text": "Control determines which runtime may perform which work under which conditions. Ownership selection, bounded authority, actual refusal and readiness work together instead of relying only on routing. CNCF connects established coordination to business execution and persistence."
      },
      {
        "nodeRef": "ha-control-table-node",
        "text": "Shared control mechanisms"
      },
      {
        "nodeRef": "ha-control-reuse-node",
        "text": "Reuse established coordination instead of implementing election or consensus inside CNCF. etcd Election/Lease is the first candidate, while an existing equivalent facility can qualify. Winning an election alone is insufficient to begin mutation service: effective fencing and readiness are also required."
      },
      {
        "nodeRef": "ha-fencing-boundary-node",
        "text": "Changing load-balancer routing or checking a Lease does not itself prevent an old Primary from writing to storage. Enforce authority at each required boundary, including the race between a check and an effect. A leadership check within etcd does not automatically protect PostgreSQL commits or external-provider effects."
      },
      {
        "nodeRef": "ha-control-topology-node",
        "text": "Control voters and Read Replicas are separate memberships. A two-voter majority system cannot retain a majority after losing one voter. Host-failure deployments must include suitable independent voters or an existing coordination service. Adding C as a read cache does not automatically add a voter."
      },
      {
        "nodeRef": "ha-authority-model-node",
        "text": "There is one owner of new independent mutation admission. Planned transfer separately retains narrowly scoped authority for old admitted work. A former Primary may commit after the new Primary starts admission only within that retained scope. This is not unrestricted active-active mutation service."
      },
      {
        "nodeRef": "ha-switchover-scope-node",
        "text": "Close independent new mutation admission on A, including stale routes, scheduled work and event entry. Retain completion authority only for the actual already admitted work scope. Merely transferring an ordinary single-writer Lease does not implement this controlled overlap."
      },
      {
        "nodeRef": "ha-authority-loss-node",
        "text": "Scoped completion authority remains usable only while valid. Lost authority or failure does not permit writes merely because work was admitted earlier. Reject invalid authority at actual storage/external-effect boundaries, and reconcile effects already performed or left uncertain."
      },
      {
        "nodeRef": "ha-behavior-intro-node",
        "text": "With the structure established, this chapter explains role and state changes. A/B/C are explanatory identities, not a requirement to run three permanent machines. The account concerns cooperation between responsibilities, not operator command instructions."
      },
      {
        "nodeRef": "ha-normal-composition-node",
        "text": "Normally the Primary admits mutations and permitted reads may be distributed to Read Replicas. Common synchronization applies authoritative committed results while control observes ownership and readiness. A Standby may serve authorized reads and exercise promotion readiness rather than remaining unused."
      },
      {
        "nodeRef": "ha-normal-transitions-node",
        "text": "Transfer changes roles or instances while preserving this ordinary architecture. Planned switchover transfers ownership with a cooperating former runtime; failover cannot rely on its state or completion. They share mechanisms but have different safety and outcome conditions."
      },
      {
        "nodeRef": "ha-switchover-purpose-node",
        "text": "Planned Switchover replaces a cooperating Primary for regular rotation or a compatible CAR change. New reads and updates move to B first. Former Primary A continues updates admitted before transfer and the child work needed to complete them."
      },
      {
        "nodeRef": "ha-abc-table-node",
        "text": "A/B/C during planned Switchover"
      },
      {
        "nodeRef": "ha-failover-purpose-node",
        "text": "Failover applies when a crash, ownership-renewal failure or loss of required connectivity prevents cooperative transfer. Lack of response does not prove the process stopped. Mutation service begins only after valid takeover ownership, effective fencing of former authority and candidate readiness are established."
      },
      {
        "nodeRef": "ha-failover-no-drain-node",
        "text": "Do not wait for an unreachable A to acknowledge drain. Do not preserve invalidated completion authority. Reconcile committed, aborted and uncertain outcomes from durable state. Preserve confirmed changes and use owning recovery contracts for uncertain effects and Running work instead of blindly executing them again on B."
      },
      {
        "nodeRef": "ha-protocol-table-node",
        "text": "Two switching protocols"
      },
      {
        "nodeRef": "ha-failover-loss-node",
        "text": "Without required control ownership/quorum, do not force a new Primary; report mutations unavailable. Preservation of acknowledged writes depends on the authoritative DataStore durability/replication contract. Election success or a cache position does not imply zero data loss."
      },
      {
        "nodeRef": "ha-fallback-current-node",
        "text": "Retain A for a configured fallback window after planned transfer and keep it synchronized. Switch-back is not restoration of old memory. Recheck retained CAR compatibility and current readiness, then use the same controlled admission-transfer and drain protocol for reactivation."
      },
      {
        "nodeRef": "ha-retirement-table-node",
        "text": "Conditions for planned retirement"
      },
      {
        "nodeRef": "ha-retirement-scope-node",
        "text": "Planned retirement requires every condition, not merely timer expiry. Isolation or shutdown of a failed runtime is separate from these graceful-retirement waits. Required outcome and reconciliation information must survive independently of that runtime."
      },
      {
        "nodeRef": "ha-car-compatibility-node",
        "text": "For a component update, fallback requires the retained CAR to remain compatible with current business data. Breaking storage changes leave the ordinary automatic route and require maintenance. Suspected compromised runtimes do not qualify for normal fallback retention."
      },
      {
        "nodeRef": "ha-deployment-intro-node",
        "text": "Physical realization relates logical structure to failure domains, dependencies, resources, observation and operating decisions. Declare the offered availability boundary and select the configuration and qualification it requires."
      },
      {
        "nodeRef": "ha-profile-table-node",
        "text": "Qualification Boundaries by Configuration"
      },
      {
        "nodeRef": "ha-profile-driver-node",
        "text": "CNCF manages logical roles, readiness and authority; the Deployment Driver realizes processes, containers and host placement. The first physical route targets Docker Compose local-ha without requiring Kubernetes. Changing deployment technology does not change the readiness/authority conditions for handing over business work."
      },
      {
        "nodeRef": "ha-profile-dependencies-node",
        "text": "Separate runtime hosts do not establish system-wide host tolerance if DataStore, messaging, storage, coordination, identity/secrets or networking remain incompatible single points of failure. Multi-AZ/site availability is future scope requiring integrated consistency and recovery policy. Box count is not availability evidence."
      },
      {
        "nodeRef": "ha-native-evidence-node",
        "text": "Use separate runtime instances and authoritative data to demonstrate admission moving from A to B while an update remains active, followed by propagation of A’s late commit to B/C. Vary replacement readiness, unsettled work, retention and switch-back conditions independently and verify that A is not retired prematurely."
      },
      {
        "nodeRef": "ha-observation-node",
        "text": "Observe Primary admission ownership, member roles, Lease/fencing, readiness, replication lag/gaps, draining work, retention and unmet retirement conditions. Repeat scheduled rotation, selected compatible-CAR replacement and current-state switch-back. Cadence and retention are deployment policy, not hard-coded one-day CNCF constants."
      },
      {
        "nodeRef": "ha-policy-profiles-node",
        "text": "For ordinary SME workloads, the goal is to obtain the intended continuity level by selecting a standard availability configuration through ordinary settings. Detailed settings are overrides for intentional changes to read freshness, cadence, readiness, drain or retention. Relate quality targets to configuration rather than scattering these choices through business code. Actual settings and default availability depend on the selected version."
      },
      {
        "nodeRef": "ha-policy-cost-node",
        "text": "Standing replicas, temporary reconstruction capacity, longer retention and frequent rotation cost resources and operational effort. Choose them against tolerated downtime, data preservation and responsiveness. Platform mechanisms do not remove responsibility for business requirements and configuration decisions."
      },
      {
        "nodeRef": "ha-policy-observation-owner-node",
        "text": "CNCF Runtime owns role, authority, synchronization and transfer facts; Control Center presents them operationally. A healthy screen is not evidence of durable updates or promotion authority. Feed actual rotation and failure qualification back into evidence for the selected quality targets."
      },
      {
        "nodeRef": "ha-appendix-intro-node",
        "text": "Keep architecture distinct from current delivery order and qualification. This appendix records planning and sources as of 2026-11-13, following the structural explanation and preserving the distinction between design and delivered capability."
      },
      {
        "nodeRef": "ha-first-delivery-node",
        "text": "The highest priority is the minimum practical immutable-infrastructure path. Deliver planned transfer, cache catch-up, a current fallback, conditional retirement, scheduled rotation and compatible-CAR replacement before completing broad automatic Failover or large/multi-site topologies."
      },
      {
        "nodeRef": "ha-priority-table-node",
        "text": "First operational implementation order"
      },
      {
        "nodeRef": "ha-safety-first-node",
        "text": "The first route still refuses invalid-authority updates and promotion of unready instances. Before automatic Failover is qualified, report its absence and make mutations safely unavailable when necessary. Prioritization does not defer safety conditions."
      },
      {
        "nodeRef": "ha-first-deployment-node",
        "text": "The first physical route follows the existing local-ha/Docker Compose direction and declares its actual failure boundary. Multiple processes on one host do not prove host-failure tolerance. Host-ha, other deployment drivers, replica-scale qualification and multi-site operation need separate evidence."
      },
      {
        "nodeRef": "ha-guide-status-node",
        "text": "This guide records design direction and first-delivery planning as of 2026-11-12. IR-01 through IR-05 remain open; authoring this guide does not implement or accept the capability. Use it with the reactive/security guides and the actual selected versions, configuration, dependencies and execution evidence."
      },
      {
        "nodeRef": "ha-companion-guides-node",
        "text": "See the [[../../immutable-infrastructure/textus-cncf-immutable-infrastructure.dox/index.dox][Immutable Infrastructure guide]] for adoption and operation, the [[../../security/textus-cncf-security-architecture.dox/index.dox][Security guide]] for defense, and the [[../../reactive/textus-cncf-reactive-architecture.dox/index.dox][Reactive guide]] for residency, UoW and recoverability."
      },
      {
        "nodeRef": "ha-local-sources-node",
        "text": "Textus-specific sources are CNCF Availability Architecture, Subsystem Runtime Architecture, Runtime Cache Synchronization and the Phase 108 first-delivery plan. New journal entries record terminology and policy changes; historical journals remain unchanged. This guide explains those sources for readers."
      },
      {
        "nodeRef": "ha-election-reference-node",
        "text": "etcd Election/Lease provides reference mechanisms for election and bounded ownership. Guarding etcd operations and protecting mutations in other stores are separate responsibilities. Official specifications: https://etcd.io/docs/v3.6/dev-guide/api_concurrency_reference_v3/ and https://etcd.io/docs/v3.6/learning/api/#lease-api ."
      },
      {
        "nodeRef": "ha-fencing-reference-node",
        "text": "Kubernetes client-go explicitly states that leader election alone does not guarantee fencing. Patroni watchdog is an example of stopping an environment that cannot maintain ownership. References: https://github.com/kubernetes/client-go/blob/master/tools/leaderelection/leaderelection.go and https://patroni.readthedocs.io/en/latest/watchdog.html . Neither directly supplies the Textus scoped old-work completion contract."
      },
      {
        "nodeRef": "ha-sme-target-node",
        "text": "The central target is ordinary business systems in small and medium-sized enterprises. A standard configuration should provide the required service continuity through ordinary settings, without making users individually redesign or configure election, synchronization and transfer for routine adoption. Ease of use makes this HA level accessible at realistic cost and operational burden."
      },
      {
        "nodeRef": "ha-target-interpretation-node",
        "text": "Express the intended level by which maintenance and failure conditions preserve business service, not by instance count or an HA label. The first operational delivery is planned replacement with local-ha. Runtime failure handling is also an architectural target, but automatic failover follows its own implementation and qualification. Select host-ha where host-failure tolerance is required."
      },
      {
        "nodeRef": "ha-target-level-table-node",
        "text": "Intended HA Levels and Boundaries"
      },
      {
        "nodeRef": "ha-target-service-window-node",
        "text": "Choose the business-appropriate level from service hours, tolerated downtime, committed-data preservation, responsiveness and cost. This does not promise one availability percentage or unconditional uninterrupted service for every use. Extending protection to hosts or sites requires storage, coordination, networking and other dependencies to meet the same qualified boundary."
      },
      {
        "nodeRef": "ha-readonly-scope-node",
        "text": "Read-only is an operating mode that stops business-data mutations in the target Subsystem while retaining qualified reads. It is proposed for both failure-time degradation and planned maintenance. Read Replica is a runtime role; Read-only is a business-service mode. They are separate axes."
      },
      {
        "nodeRef": "ha-readonly-admission-node",
        "text": "Enforce the mutation stop at shared admission/execution boundaries for APIs, scheduled work, Jobs/Workflows and event-triggered business changes, not merely screen controls. Do not allow business mutations hidden in apparent read operations. Necessary audit, observation and cache-management writes use separately bounded operational paths. Read-only does not bypass authentication, authorization or required audit."
      },
      {
        "nodeRef": "ha-readonly-transition-node",
        "text": "Updates may already be admitted when transition is requested. Close new admission and show transition in progress while validly authorized remaining work settles; distinguish this from established business read-only service. Do not assume a runtime with lost authority can finish: enforce fencing and reconcile outcomes. Read-only is not established if unreachable former members or stale routes can still perform unauthorized mutations."
      },
      {
        "nodeRef": "ha-readonly-data-node",
        "text": "Reads require trusted authoritative or cached data and valid authorization. With synchronization lag, serve only queries whose freshness contract allows it. Responses/UI identify read-only service, the mutation-stop reason and data application status. Refuse even a read when it requires a newer confirmed state, authorization cannot be established or data trust cannot be maintained."
      },
      {
        "nodeRef": "ha-service-mode-table-node",
        "text": "Business Service Modes and Permitted Work"
      },
      {
        "nodeRef": "ha-readonly-activation-node",
        "text": "The proposal allows operator selection with an explicit reason: failure response or maintenance. Automatic transition from failure detection must specify eligible failure conditions and permitted reads. Detecting mutation unavailability does not authorize all reads. This is a design proposal, not an implemented dedicated CNCF mode or ABI."
      },
      {
        "nodeRef": "ha-readonly-recovery-node",
        "text": "Return to normal operation after resolving the failure cause or completing maintenance, and qualifying Primary authority/fencing, synchronization/readiness and admitted or uncertain outcomes. A responding Primary or an elapsed maintenance window alone is insufficient. Identify refused mutations as unadmitted; do not silently accumulate and execute them after recovery. Previously admitted work follows its own recovery contract."
      },
      {
        "nodeRef": "ha-readonly-goal-node",
        "text": "Read-only for failure or maintenance is a proposed continuity level that stops mutations while preserving qualified reads. Resident business data and indexes are intended to sustain a broad range of read work even when persistence access is impaired. Make the available scope explicit when full service cannot continue, and leave unavailable any read scope that cannot be served safely."
      },
      {
        "nodeRef": "ha-readonly-maintenance-node",
        "text": "During failure, preserve permitted reads when safe mutations or takeover cannot be established. For maintenance, close new mutations before work, settle admitted outcomes, then perform inspection or data maintenance. Necessary administrative maintenance actions have separately explicit authority and scope. Stop any read scope that the work makes unsafe; read availability is not guaranteed during every maintenance task."
      },
      {
        "nodeRef": "ha-memory-availability-node",
        "text": "Residency also supports degraded-service continuity. When authoritative disk or database access is slow or unavailable, known committed resident state and required indexes can support searches, lists and inquiries completed from that state. Read-only connects this property to HA by stopping mutations and using resident data. Qualify the actual supported business scope against resident coverage and dependencies."
      },
      {
        "nodeRef": "ha-readonly-resident-data-node",
        "text": "While persistence access is impaired, separate reads completed from resident data from those requiring disk reload. A cache miss or unavailable index must not wait indefinitely for impaired storage; return the corresponding unavailable outcome. Expose the last qualified applied state and available scope, and retain only reads meeting authentication, authorization, required audit and other dependencies. After process loss removes resident state, reconstruction requires an available authoritative source or qualified replica."
      },
      {
        "nodeRef": "ha-working-set-selection-node",
