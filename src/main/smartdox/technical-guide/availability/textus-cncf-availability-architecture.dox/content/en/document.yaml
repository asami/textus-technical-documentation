                          "Standby",
                          "Be qualified and ready for promotion to Primary"
                        ]
                      },
                      {
                        "id": "ha-role-table-row-4",
                        "cells": [
                          "Draining Former Primary",
                          "Complete only work admitted before the transfer"
                        ]
                      }
                    ]
                  },
                  {
                    "id": "ha-role-composition",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-roles"
                      ],
                      "claims": [
                        "ha-role-composition-claim"
                      ],
                      "nodes": [
                        "ha-role-composition-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-roles-flow"
                      ]
                    },
                    "text": "Read Replica describes read service; Standby describes promotion readiness. One instance may hold both roles, but read availability alone does not qualify it for promotion. The minimal topology has a Primary and a Standby-capable Read Replica, with additional Read Replicas joining the same synchronization infrastructure later."
                  },
                  {
                    "id": "ha-retained-role",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-roles"
                      ],
                      "claims": [
                        "ha-retained-role-claim"
                      ],
                      "nodes": [
                        "ha-retained-role-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-roles-flow"
                      ]
                    },
                    "text": "After its admitted work has settled, a former Primary is no longer draining merely because its retention window remains open. It remains a synchronized fallback. Adopting explanatory role names is separate from renaming existing ACTIVE, STANDBY or DRAINING lifecycle states."
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-lifecycle-section",
                "heading": "Liveness, Readiness, Authority and Runtime Lifetime",
                "coreRefs": {
                  "steps": [
                    "ha-lifecycle"
                  ],
                  "claims": [
                    "ha-lifecycle-separation-claim",
                    "ha-lifecycle-table-claim",
                    "ha-lifecycle-state-names-claim"
                  ],
                  "nodes": [
                    "ha-lifecycle-separation-node",
                    "ha-lifecycle-table-node",
                    "ha-lifecycle-state-names-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-lifecycle-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-lifecycle-separation",
                    "kind": "paragraph",
                    "text": "Liveness means a process responds; readiness means it has required versions, connections and data; authority means it may start or finish particular work. Keeping them separate prevents a merely running instance from admitting mutations or a readable replica from promoting itself.",
                    "coreRefs": {
                      "steps": [
                        "ha-lifecycle"
                      ],
                      "claims": [
                        "ha-lifecycle-separation-claim"
                      ],
                      "nodes": [
                        "ha-lifecycle-separation-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-lifecycle-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-lifecycle-table",
                    "kind": "table",
                    "caption": "Runtime State and Decisions",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Stage"
                      },
                      {
                        "id": "col-2",
                        "heading": "Meaning"
                      },
                      {
                        "id": "col-3",
                        "heading": "Relation to Authority"
                      }
                    ],
                    "rows": [
                      {
                        "id": "ha-lifecycle-table-row-1",
                        "cells": [
                          "Startup and warm-up",
                          "Build runtime/cache from artifacts and authoritative state",
                          "Do not admit ordinary use while unready"
                        ]
                      },
                      {
                        "id": "ha-lifecycle-table-row-2",
                        "cells": [
                          "Ready",
                          "Meet compatibility, synchronization and other use requirements",
                          "Qualify read service and promotion separately"
                        ]
                      },
                      {
                        "id": "ha-lifecycle-table-row-3",
                        "cells": [
                          "Primary or read service",
                          "Serve business work in admitted roles",
                          "Mutations require valid admission/execution authority"
                        ]
                      },
                      {
                        "id": "ha-lifecycle-table-row-4",
                        "cells": [
                          "Drain, retention and retirement",
                          "Check old outcomes, replacement capacity and retention",
                          "Former Primary status grants no new admission"
                        ]
                      }
                    ],
                    "coreRefs": {
                      "steps": [
                        "ha-lifecycle"
                      ],
                      "claims": [
                        "ha-lifecycle-table-claim"
                      ],
                      "nodes": [
                        "ha-lifecycle-table-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-lifecycle-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-lifecycle-state-names",
                    "kind": "paragraph",
                    "text": "Existing ACTIVE, STANDBY and DRAINING names describe lifecycle states. Primary, Read Replica and Standby explain responsibilities and eligibility; prose does not rename APIs or configuration tokens. After draining ends, synchronized fallback retention is distinct from still executing old work.",
                    "coreRefs": {
                      "steps": [
                        "ha-lifecycle"
                      ],
                      "claims": [
                        "ha-lifecycle-state-names-claim"
                      ],
                      "nodes": [
                        "ha-lifecycle-state-names-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-lifecycle-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ha-state-area-section",
            "heading": "Data and Synchronization Structure",
            "coreRefs": {
              "steps": [
                "ha-state-area"
              ],
              "claims": [
                "ha-state-intro-claim"
              ],
              "nodes": [
                "ha-state-intro-node"
              ],
              "relations": [],
              "flows": [
                "ha-state-area-flow"
              ]
            },
            "blocks": [
              {
                "id": "ha-state-intro",
                "kind": "paragraph",
                "text": "Data preservation and fast reads connect different categories of state. This chapter distinguishes authoritative persistence, memory residency, replica application and running business work, and states the conditions each supplies to transfer.",
                "coreRefs": {
                  "steps": [
                    "ha-state-area"
                  ],
                  "claims": [
                    "ha-state-intro-claim"
                  ],
                  "nodes": [
                    "ha-state-intro-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-state-area-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ha-memory-section",
                "heading": "Committed, Resident and Transient State",
                "coreRefs": {
                  "steps": [
                    "ha-memory"
                  ],
                  "claims": [
                    "ha-state-separation-claim",
                    "ha-state-table-claim",
                    "ha-memory-performance-claim",
                    "ha-working-set-selection-claim",
                    "ha-working-set-user-context-claim",
                    "ha-memory-availability-claim"
                  ],
                  "nodes": [
                    "ha-state-separation-node",
                    "ha-state-table-node",
                    "ha-memory-performance-node",
                    "ha-working-set-selection-node",
                    "ha-working-set-user-context-node",
                    "ha-memory-availability-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-memory-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-state-separation",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-memory"
                      ],
                      "claims": [
                        "ha-state-separation-claim"
                      ],
                      "nodes": [
                        "ha-state-separation-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-memory-flow"
                      ]
                    },
                    "text": "CNCF deliberately combines memory-resident responsiveness with an architecture that does not leave continuity-critical state solely in one process. Domain rules and UnitOfWork govern authoritative commits; caches and Views follow their outcomes. Replacement concerns the runtime, while committed business data and supported durable Job/Workflow records remain independent. Treat transient and uncertain work separately; an old memory copy is not proof of durability."
                  },
                  {
                    "id": "ha-state-table",
                    "kind": "table",
                    "caption": "State Ownership and Reconstruction",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "State"
                      },
                      {
                        "id": "col-2",
                        "heading": "Authority and Lifetime"
                      },
                      {
                        "id": "col-3",
                        "heading": "HA Connection"
                      }
                    ],
                    "rows": [
                      {
                        "id": "ha-state-table-row-1",
                        "cells": [
                          "Committed business data",
                          "Authoritative DataStore, independent of runtime lifetime",
                          "Use committed outcomes and storage failure boundaries as preservation conditions"
                        ]
                      },
                      {
                        "id": "ha-state-table-row-2",
                        "cells": [
                          "Entities, indexes, Working Sets and Views",
                          "Resident state built from authoritative baseline and committed changes",
                          "Rebuild after loss and qualify readiness from required applied progress"
                        ]
                      },
                      {
                        "id": "ha-state-table-row-3",
                        "cells": [
                          "Admitted work and intermediate computation",
                          "Execution scope and its supported durable records",
                          "Separate planned drain from failure outcome reconciliation"
                        ]
                      }
                    ],
                    "coreRefs": {
                      "steps": [
                        "ha-memory"
                      ],
                      "claims": [
                        "ha-state-table-claim"
                      ],
                      "nodes": [
                        "ha-state-table-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-memory-performance",
                    "kind": "paragraph",
                    "text": "CNCF aims to keep much of the data used in business processing resident in memory. Resident EntitySpace, Entity Realms, indexes and Views reduce repeated retrieval/construction for responsiveness. Combining this with independent continuity-critical state supports both performance and replacement. Residency or replica count alone is not proof of durable data.",
                    "coreRefs": {
                      "steps": [
                        "ha-memory"
                      ],
                      "claims": [
                        "ha-memory-performance-claim"
                      ],
                      "nodes": [
                        "ha-memory-performance-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-working-set-selection",
                    "kind": "paragraph",
                    "text": "Entity classification and Working Set policy select resident data. Keep all valid master records resident. For transactional use, the intended Working Set includes active transactions and data required by active users and their business activity. Select current activity needs without retaining all historical data. Current master defaults select full residency; workflow business entities require explicit state-field and active-state policy. User-activity-based residency needs separately defined and qualified policy.",
                    "coreRefs": {
                      "steps": [
                        "ha-memory"
                      ],
                      "claims": [
                        "ha-working-set-selection-claim"
                      ],
                      "nodes": [
                        "ha-working-set-selection-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-working-set-user-context",
                    "kind": "paragraph",
                    "text": "Examples include an active user cart, the user own address and delivery destinations. Data such as an address need not itself undergo state transitions to be included when required by current users or transactions. Treat the Working Set as the data needed for current business activity, retaining per-user authorization boundaries. Reuse already resident master data where applicable. Re-evaluate residency when activity ends while retaining authoritative data independently. Do not claim this user-scoped policy is already applied automatically by current code.",
                    "coreRefs": {
                      "steps": [
                        "ha-memory"
                      ],
                      "claims": [
                        "ha-working-set-user-context-claim"
                      ],
                      "nodes": [
                        "ha-working-set-user-context-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-memory-availability",
                    "kind": "paragraph",
                    "text": "Residency also supports degraded-service continuity. When authoritative disk or database access is slow or unavailable, known committed resident state and required indexes can support searches, lists and inquiries completed from that state. Read-only connects this property to HA by stopping mutations and using resident data. Qualify the actual supported business scope against resident coverage and dependencies.",
                    "coreRefs": {
                      "steps": [
                        "ha-memory"
                      ],
                      "claims": [
                        "ha-memory-availability-claim"
                      ],
                      "nodes": [
                        "ha-memory-availability-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-memory-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-cache-section",
                "heading": "Common Cache Synchronization for Committed Changes",
                "coreRefs": {
                  "steps": [
                    "ha-cache"
                  ],
                  "claims": [
                    "ha-cache-structure-claim",
                    "ha-cache-commit-claim",
                    "ha-cache-version-claim",
                    "ha-cache-progress-claim",
                    "ha-cache-bootstrap-claim",
                    "ha-read-consistency-claim"
                  ],
                  "nodes": [
                    "ha-cache-structure-node",
                    "ha-cache-commit-node",
                    "ha-cache-version-node",
                    "ha-cache-progress-node",
                    "ha-cache-bootstrap-node",
                    "ha-read-consistency-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-cache-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-cache-structure",
                    "kind": "paragraph",
                    "text": "Cache synchronization distributes authoritative committed changes to the current Primary, serving replicas, warming members and retained former runtimes. HA control consumes applied progress and readiness. Synchronization does not elect the Primary, and HA does not synchronize replicas by replaying business mutations.",
                    "coreRefs": {
                      "steps": [
                        "ha-cache"
                      ],
                      "claims": [
                        "ha-cache-structure-claim"
                      ],
                      "nodes": [
                        "ha-cache-structure-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-cache-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-cache-commit",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-cache"
                      ],
                      "claims": [
                        "ha-cache-commit-claim"
                      ],
                      "nodes": [
                        "ha-cache-commit-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-cache-flow"
                      ]
                    },
                    "text": "Synchronization follows committed source changes, not request acceptance or speculative memory updates. If a process stops after commit but before notification, the owning persistence integration must allow the change to be discovered and applied. Aborted updates are not distributed as successful changes."
                  },
                  {
                    "id": "ha-cache-version",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-cache"
                      ],
                      "claims": [
                        "ha-cache-version-claim"
                      ],
                      "nodes": [
                        "ha-cache-version-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-cache-flow"
                      ]
                    },
                    "text": "Handle updates, deletion, invalidation and scoped purge under common semantics. Duplicate or reordered notifications must not resurrect older values. Purge discards cache state rather than authoritative data, and a late load started before purge must not repopulate a newer cache generation with stale values."
                  },
                  {
                    "id": "ha-cache-progress",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-cache"
                      ],
                      "claims": [
                        "ha-cache-progress-claim"
                      ],
                      "nodes": [
                        "ha-cache-progress-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-cache-flow"
                      ]
                    },
                    "text": "Track received progress separately from applied-through progress. Applied-through covers all required preceding changes. Late A commits and new B commits follow source-owned ordering/versions rather than publisher identity or arrival time. Do not invent a single commit order across independent stores that provide no such order."
                  },
                  {
                    "id": "ha-cache-bootstrap",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-cache"
                      ],
                      "claims": [
                        "ha-cache-bootstrap-claim"
                      ],
                      "nodes": [
                        "ha-cache-bootstrap-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-cache-flow"
                      ]
                    },
                    "text": "Build C from a consistent baseline with a corresponding source position, then catch up subsequent changes without losing updates during construction. Admit it for reads only after reaching the required state. An unrecoverable history gap makes the affected scope unready and requires reconstruction."
                  },
                  {
                    "id": "ha-read-consistency",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-cache"
                      ],
                      "claims": [
                        "ha-read-consistency-claim"
                      ],
                      "nodes": [
                        "ha-read-consistency-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-cache-flow"
                      ]
                    },
                    "text": "Separate lag-tolerant reads from reads requiring a particular confirmed state. The latter need an eligible caught-up replica, an authorized authoritative read, bounded waiting or an unavailable outcome. Routing to the new Primary does not prove that A commits occurring after transfer have reached its cache."
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-updates-section",
                "heading": "Update Processing and Job/Workflow Continuity",
                "coreRefs": {
                  "steps": [
                    "ha-updates"
                  ],
                  "claims": [
                    "ha-update-conflict-claim",
                    "ha-update-settlement-claim",
                    "ha-long-work-claim"
                  ],
                  "nodes": [
                    "ha-update-conflict-node",
                    "ha-update-settlement-node",
                    "ha-long-work-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-updates-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-update-conflict",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-updates"
                      ],
                      "claims": [
                        "ha-update-conflict-claim"
                      ],
                      "nodes": [
                        "ha-update-conflict-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-updates-flow"
                      ]
                    },
                    "text": "If old admitted A work and new B work touch the same data, authoritative transactions/version checks handle the conflict. Admission order alone does not establish commit order, and last-arriving values must not overwrite newer state. Required business causal ordering belongs to the owning work contract."
                  },
                  {
                    "id": "ha-update-settlement",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-updates"
                      ],
                      "claims": [
                        "ha-update-settlement-claim"
                      ],
                      "nodes": [
                        "ha-update-settlement-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-updates-flow"
                      ]
                    },
                    "text": "Completing admitted work does not guarantee business success; it establishes an actual commit, abort or failure disposition. HTTP response completion alone is not drain completion. A lost commit acknowledgement or uncertain external send requires reconciliation, not an assumption that nothing happened."
                  },
                  {
                    "id": "ha-long-work",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-updates"
                      ],
                      "claims": [
                        "ha-long-work-claim"
                      ],
                      "nodes": [
                        "ha-long-work-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-updates-flow"
                      ]
                    },
                    "text": "Long-running Jobs and Workflows use durable boundaries and recovery contracts actually supported by the selected version. Persistence alone does not make an interrupted Running task transferable or replayable. A rotation deadline must not force-interrupt valid admitted work; prolonged drain and uncertain outcomes remain observable."
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ha-control-area-section",
            "heading": "Control Structure",
            "coreRefs": {
              "steps": [
                "ha-control-area"
              ],
              "claims": [
                "ha-control-intro-claim"
              ],
              "nodes": [
                "ha-control-intro-node"
              ],
              "relations": [],
              "flows": [
                "ha-control-area-flow"
              ]
            },
            "blocks": [
              {
                "id": "ha-control-intro",
                "kind": "paragraph",
                "text": "Control determines which runtime may perform which work under which conditions. Ownership selection, bounded authority, actual refusal and readiness work together instead of relying only on routing. CNCF connects established coordination to business execution and persistence.",
                "coreRefs": {
                  "steps": [
                    "ha-control-area"
                  ],
                  "claims": [
                    "ha-control-intro-claim"
                  ],
                  "nodes": [
                    "ha-control-intro-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-control-area-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ha-control-section",
                "heading": "Election, Lease, Fencing and Readiness Responsibilities",
                "coreRefs": {
                  "steps": [
                    "ha-control"
                  ],
                  "claims": [
                    "ha-control-table-claim",
                    "ha-control-reuse-claim",
                    "ha-fencing-boundary-claim",
                    "ha-control-topology-claim"
                  ],
                  "nodes": [
                    "ha-control-table-node",
                    "ha-control-reuse-node",
                    "ha-fencing-boundary-node",
                    "ha-control-topology-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-control-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-control-table",
                    "kind": "table",
                    "coreRefs": {
                      "steps": [
                        "ha-control"
                      ],
                      "claims": [
                        "ha-control-table-claim"
                      ],
                      "nodes": [
                        "ha-control-table-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-control-flow"
                      ]
                    },
                    "caption": "Shared control mechanisms",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Mechanism"
                      },
                      {
                        "id": "col-2",
                        "heading": "What it establishes"
                      }
                    ],
                    "rows": [
                      {
                        "id": "ha-control-table-row-1",
                        "cells": [
                          "Leader Election",
                          "Select the owner of new Primary admission"
                        ]
                      },
                      {
                        "id": "ha-control-table-row-2",
                        "cells": [
                          "Lease",
                          "Maintain bounded ownership and expire it when renewal fails"
                        ]
                      },
                      {
                        "id": "ha-control-table-row-3",
                        "cells": [
                          "Fencing",
                          "Reject invalid-authority mutations at actual execution and storage boundaries"
                        ]
                      },
                      {
                        "id": "ha-control-table-row-4",
                        "cells": [
                          "Readiness",
                          "Check compatibility, persistent-state access, synchronization and warm-up"
                        ]
                      }
                    ]
                  },
                  {
                    "id": "ha-control-reuse",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-control"
                      ],
                      "claims": [
                        "ha-control-reuse-claim"
                      ],
                      "nodes": [
                        "ha-control-reuse-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-control-flow"
                      ]
                    },
                    "text": "Reuse established coordination instead of implementing election or consensus inside CNCF. etcd Election/Lease is the first candidate, while an existing equivalent facility can qualify. Winning an election alone is insufficient to begin mutation service: effective fencing and readiness are also required."
                  },
                  {
                    "id": "ha-fencing-boundary",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-control"
                      ],
                      "claims": [
                        "ha-fencing-boundary-claim"
                      ],
                      "nodes": [
                        "ha-fencing-boundary-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-control-flow"
                      ]
                    },
                    "text": "Changing load-balancer routing or checking a Lease does not itself prevent an old Primary from writing to storage. Enforce authority at each required boundary, including the race between a check and an effect. A leadership check within etcd does not automatically protect PostgreSQL commits or external-provider effects."
                  },
                  {
                    "id": "ha-control-topology",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-control"
                      ],
                      "claims": [
                        "ha-control-topology-claim"
                      ],
                      "nodes": [
                        "ha-control-topology-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-control-flow"
                      ]
                    },
                    "text": "Control voters and Read Replicas are separate memberships. A two-voter majority system cannot retain a majority after losing one voter. Host-failure deployments must include suitable independent voters or an existing coordination service. Adding C as a read cache does not automatically add a voter."
                  }
                ],
                "sections": []
              },
              {
                "id": "ha-authority-section",
                "heading": "Separate New Admission from Old-work Completion",
                "coreRefs": {
                  "steps": [
                    "ha-authority"
                  ],
                  "claims": [
                    "ha-authority-model-claim",
                    "ha-switchover-scope-claim",
                    "ha-authority-loss-claim"
                  ],
                  "nodes": [
                    "ha-authority-model-node",
                    "ha-switchover-scope-node",
                    "ha-authority-loss-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ha-authority-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ha-authority-model",
                    "kind": "paragraph",
                    "text": "There is one owner of new independent mutation admission. Planned transfer separately retains narrowly scoped authority for old admitted work. A former Primary may commit after the new Primary starts admission only within that retained scope. This is not unrestricted active-active mutation service.",
                    "coreRefs": {
                      "steps": [
                        "ha-authority"
                      ],
                      "claims": [
                        "ha-authority-model-claim"
                      ],
                      "nodes": [
                        "ha-authority-model-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-authority-flow"
                      ]
                    }
                  },
                  {
                    "id": "ha-switchover-scope",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ha-authority"
                      ],
                      "claims": [
                        "ha-switchover-scope-claim"
                      ],
                      "nodes": [
                        "ha-switchover-scope-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-authority-flow"
                      ]
                    },
                    "text": "Close independent new mutation admission on A, including stale routes, scheduled work and event entry. Retain completion authority only for the actual already admitted work scope. Merely transferring an ordinary single-writer Lease does not implement this controlled overlap."
                  },
                  {
                    "id": "ha-authority-loss",
                    "kind": "paragraph",
                    "text": "Scoped completion authority remains usable only while valid. Lost authority or failure does not permit writes merely because work was admitted earlier. Reject invalid authority at actual storage/external-effect boundaries, and reconcile effects already performed or left uncertain.",
                    "coreRefs": {
                      "steps": [
                        "ha-authority"
                      ],
                      "claims": [
                        "ha-authority-loss-claim"
                      ],
                      "nodes": [
                        "ha-authority-loss-node"
                      ],
                      "relations": [],
                      "flows": [
                        "ha-authority-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ha-behavior-area-section",
            "heading": "Normal and Transitional Behavior",
            "coreRefs": {
              "steps": [
                "ha-behavior-area"
              ],
              "claims": [
                "ha-behavior-intro-claim"
              ],
              "nodes": [
                "ha-behavior-intro-node"
