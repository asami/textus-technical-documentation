                    "ha-purpose-area-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ha-goals-section",
                "heading": "Why Business Continuity Needs HA",
                "coreRefs": {
                  "steps": [
                    "ha-goals"
                  ],
                  "claims": [
                    "ha-business-purpose-claim",
                    "ha-application-goal-claim"
                  ],
