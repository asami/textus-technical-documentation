              {
                "id": "ui-development-paragraph-2",
                "kind": "paragraph",
                "text": "NICT編集工房は、一覧・詳細、編集、端末機能などを通してTFAFとUIモデルの設計を検討する参照アプリケーションです。共通データソースの境界を保ちながら仮データからサーバーへ切り替え、画面と業務処理の接続を確認します。この実例から共通化できる部分を基盤へ戻すことで、モデルだけで先に画面体系を固定することを避けます。",
                "coreRefs": {
                  "steps": [
