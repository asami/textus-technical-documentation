                  "flows": [
                    "ui-development-flow"
                  ]
                }
              },
              {
                "id": "ui-development-paragraph-3",
                "kind": "paragraph",
                "text": "本書は、実装中の機能と設計方針を含むアーキテクチャを説明しています。Static WebのページView投影には実装があり、Logical UIやDisplayには仕様が整備されていますが、モデルから各画面へ至る全経路の提供完了を示すものではありません。Progressive Static WebとUX Profileには構想・設計段階の項目があります。RESTまたはgRPCで独自UIを接続する際も、採用する版の公開APIとアダプターの提供範囲を確認します。特に本稿ではgRPC接続を構成上の選択肢として位置付け、提供済みの標準アダプターとは断定しません。",
                "coreRefs": {
                  "steps": [
                    "ui-development"
