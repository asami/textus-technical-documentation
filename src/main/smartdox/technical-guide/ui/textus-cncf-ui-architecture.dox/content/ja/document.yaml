            "blocks": [
              {
                "id": "ui-foundation-paragraph-1",
                "kind": "paragraph",
                "text": "SimpleModelingはモデル駆動とコンポーネント指向を組み合わせ、Textusがその実行を支えます。UIについても、要求から画面に必要な情報と操作を定め、公開された業務契約へ接続します。画面を変えるたびに業務規則まで書き直す負担を減らし、複数のUIから同じ業務機能を利用することが、この構成の目的です。",
                "coreRefs": {
                  "steps": [
                    "ui-foundation"
                  ],
                  "claims": [
                    "ui-foundation-claim-1"
                  ],
                  "nodes": [
                    "ui-foundation-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ui-foundation-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ui-model-section",
                "heading": "要求から画面と操作を定める",
                "coreRefs": {
                  "steps": [
                    "ui-model"
                  ],
                  "claims": [
                    "ui-model-claim-1",
                    "ui-model-claim-2",
                    "ui-model-claim-3"
                  ],
                  "nodes": [
                    "ui-model-node-1",
                    "ui-model-node-2",
                    "ui-model-node-3"
                  ],
                  "relations": [
                    "ui-model-relation-1",
                    "ui-model-relation-2"
                  ],
                  "flows": [
                    "ui-model-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ui-model-paragraph-1",
                    "kind": "paragraph",
                    "text": "UIモデルは、利用者が何を参照し、何を入力し、どの操作を行うかを表します。CozyのLogical UIでは、業務ユースケースからシステム・ユースケース、UIユースケースへ要求を具体化し、画面と操作の対応を定めます。画面の要求にFlutterのWidget構造やHTTPの通信手順を埋め込まず、業務上の意味を保持します。",
                    "coreRefs": {
                      "steps": [
                        "ui-model"
                      ],
                      "claims": [
                        "ui-model-claim-1"
                      ],
                      "nodes": [
                        "ui-model-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ui-model-flow"
                      ]
                    }
                  },
                  {
                    "id": "ui-model-paragraph-2",
                    "kind": "paragraph",
                    "text": "情報の取得と業務操作は、コンポーネントが公開するService・Operationの契約へ接続します。一覧には検索、詳細には個別の参照、実行ボタンにはCommandなどの対応を定めます。UIモデルとOperationモデルを明示的なバインディングで結ぶことで、表示の都合で業務処理を作り直す範囲を減らします。",
                    "coreRefs": {
                      "steps": [
                        "ui-model"
                      ],
                      "claims": [
                        "ui-model-claim-2"
                      ],
                      "nodes": [
                        "ui-model-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ui-model-flow"
                      ]
                    }
                  },
                  {
                    "id": "ui-model-paragraph-3",
                    "kind": "paragraph",
                    "text": "要求から画面、画面からOperationへの対応を保持すると、ユースケースに必要な操作があるか、公開されていない処理を画面から呼んでいないかを確認できます。生成された画面だけを仕様とせず、要求・モデル・公開契約を照合することが、モデル駆動のUI開発の基礎になります。",
                    "coreRefs": {
                      "steps": [
                        "ui-model"
                      ],
                      "claims": [
                        "ui-model-claim-3"
                      ],
                      "nodes": [
                        "ui-model-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "ui-model-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "view-display-section",
                "heading": "業務データを表示用の契約へ投影する",
                "coreRefs": {
                  "steps": [
                    "view-display"
                  ],
                  "claims": [
                    "view-display-claim-1",
                    "view-display-claim-2",
                    "view-display-claim-3"
