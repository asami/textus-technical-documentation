                  ],
                  "nodes": [
                    "flutter-ui-node-platforms",
                    "flutter-ui-node-model-driven",
                    "flutter-ui-node-1",
                    "flutter-ui-node-2",
                    "flutter-ui-node-3"
                  ],
                  "relations": [
                    "flutter-ui-relation-platforms-model",
                    "flutter-ui-relation-model-runtime",
                    "flutter-ui-relation-1",
                    "flutter-ui-relation-2"
                  ],
                  "flows": [
                    "flutter-ui-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "flutter-ui-paragraph-platforms",
                    "kind": "paragraph",
                    "text": "Textusと連動するFlutterのアプリケーション・フレームワーク上でUIアプリケーションを構築します。この基盤は、iPhone／Androidのスマートフォン、タブレット、Webアプリケーション、デスクトップアプリケーションを対象とします。マルチスクリーンは、画面サイズへの適応に加え、異なるUI基盤上でアプリケーションを提供することを含みます。Flutter Webは、CNCFがサーバー側でHTMLを構成する標準Web UIとは別の実現方式です。",
                    "coreRefs": {
                      "steps": [
                        "flutter-ui"
                      ],
                      "claims": [
                        "flutter-ui-claim-platforms"
                      ],
                      "nodes": [
                        "flutter-ui-node-platforms"
                      ],
                      "relations": [],
                      "flows": [
                        "flutter-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "flutter-ui-paragraph-model-driven",
                    "kind": "paragraph",
                    "text": "モデル駆動UIでは、表示する情報、利用者の操作、Textusの業務処理との接続を、個々のUI基盤の実装から分けて記述します。このモデルをアプリケーション・フレームワークの設定とバインディングへつなぐことで、業務上の意味と操作の関係を共通化しながら、複数の実行環境へUIアプリケーションを展開できます。各環境への対応を画面ごとの個別実装だけに任せず、モデルと共通基盤で支える構成です。",
                    "coreRefs": {
                      "steps": [
                        "flutter-ui"
                      ],
                      "claims": [
                        "flutter-ui-claim-model-driven"
                      ],
                      "nodes": [
                        "flutter-ui-node-model-driven"
                      ],
                      "relations": [],
                      "flows": [
                        "flutter-ui-flow"
                      ]
