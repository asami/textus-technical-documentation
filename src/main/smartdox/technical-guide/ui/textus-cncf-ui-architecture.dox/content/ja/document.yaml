                  ],
                  "flows": [
                    "view-display-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "view-display-paragraph-1",
                    "kind": "paragraph",
                    "text": "業務状態とその更新規則は、サーバー側のドメイン・モデルとOperationが担当します。Viewは、利用者に必要な情報を参照用にまとめます。ストレージや外部プロバイダーの生データを直接画面へ渡さず、参照の意味とアクセス範囲を明確にします。",
                    "coreRefs": {
                      "steps": [
                        "view-display"
                      ],
                      "claims": [
                        "view-display-claim-1"
                      ],
                      "nodes": [
                        "view-display-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "view-display-flow"
                      ]
                    }
                  },
                  {
                    "id": "view-display-paragraph-2",
                    "kind": "paragraph",
                    "text": "Displayは、認可されたViewと表示定義から、項目・値・参照先・操作の情報を表示向けに投影します。CNCFのDisplay契約は、型のある入力と登録された変換を使い、同じ入力から同じ投影結果を得る構成を定めます。表示用文字列から業務データを逆算したり、投影によってViewを書き換えたりしません。",
                    "coreRefs": {
                      "steps": [
                        "view-display"
                      ],
                      "claims": [
                        "view-display-claim-2"
                      ],
                      "nodes": [
                        "view-display-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "view-display-flow"
                      ]
                    }
                  },
                  {
                    "id": "view-display-paragraph-3",
                    "kind": "paragraph",
                    "text": "この分離により、業務上の意味を保ちながら、WebとFlutterで異なる見せ方を採用できます。View・Displayは共有可能な参照の仕組みであり、すべての独自UIに採用を求めるものではありません。独自UIは、用途に適した公開APIのデータ契約を利用できます。",
                    "coreRefs": {
                      "steps": [
                        "view-display"
                      ],
                      "claims": [
                        "view-display-claim-3"
                      ],
                      "nodes": [
                        "view-display-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "view-display-flow"
