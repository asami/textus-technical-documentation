                    "text": "サーバーでは、公開するService・Operationに対応付けてAPIを用意し、通信境界で受け取った要求を共通の業務処理へ渡します。入力と結果の型、対象の識別子、エラー、契約の版を定め、RESTとgRPCの表現をその契約へ対応付けます。独自UIは必要に応じてView・Displayを利用できますが、Displayの採用と通信方式の選択は別の判断です。",
