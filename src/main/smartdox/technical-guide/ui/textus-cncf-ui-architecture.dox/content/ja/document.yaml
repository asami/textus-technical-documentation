            "blocks": [
              {
                "id": "ui-conclusion-paragraph-1",
                "kind": "paragraph",
                "text": "Textus/CNCFのUIアーキテクチャは、要求、参照・操作の契約、画面の実現方式をつなぎます。Textusと連動するFlutterのアプリケーション・フレームワークでは、モデル駆動UIと共通ランタイムを組み合わせ、スマートフォン・タブレット・Web・デスクトップへ展開します。標準Web UIやREST／gRPCで接続する独自UIも選択でき、業務の規則と確定状態をサーバーで共有しながら、各用途に適した表示と操作を構成できます。",
