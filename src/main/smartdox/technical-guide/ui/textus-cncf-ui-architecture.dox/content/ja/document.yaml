                  ],
                  "flows": [
                    "web-ui-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "web-ui-paragraph-1",
                    "kind": "paragraph",
                    "text": "CNCFのStatic Web Applicationは、要求の実行コンテキストとページ用Viewを使い、意味のある初期HTMLをサーバー側で組み立てる方式です。Staticは、すべてのページを事前生成するという意味ではありません。利用者や参照対象に応じてページを構成し、初期表示のためにブラウザーが画面各部のAPIを個別に呼び出す構造を避けます。",
                    "coreRefs": {
                      "steps": [
                        "web-ui"
                      ],
                      "claims": [
                        "web-ui-claim-1"
                      ],
                      "nodes": [
                        "web-ui-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "web-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "web-ui-paragraph-2",
                    "kind": "paragraph",
                    "text": "Web UI DSLの設計では、一覧、詳細、操作フォームなどをTextus Widgetとして表し、Bootstrap CoreのHTML構造へ変換します。UX Profileは、その意味を保ちながら表示や操作感を調整する層です。Material DesignもProfileの対象として整理されています。画面の意味、HTML構造、表示方針を分けることで、各画面で同じ基礎構造を作り直す負担を減らします。",
                    "coreRefs": {
                      "steps": [
                        "web-ui"
                      ],
                      "claims": [
                        "web-ui-claim-2"
                      ],
                      "nodes": [
                        "web-ui-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "web-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "web-ui-paragraph-3",
                    "kind": "paragraph",
                    "text": "Progressive Static Webの構想では、サーバーが返すHTMLを基礎に、必要な箇所へJavaScriptによる操作支援を追加します。通常のフォーム操作と追加した動的操作を同じ業務Operationへ接続し、ブラウザー側の状態を業務処理の確定結果として扱わないことが基本です。",
                    "coreRefs": {
                      "steps": [
                        "web-ui"
                      ],
                      "claims": [
                        "web-ui-claim-3"
                      ],
                      "nodes": [
                        "web-ui-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "web-ui-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "flutter-ui-section",
                "heading": "Textusと連動するFlutter基盤でマルチスクリーンのUIアプリを構築する",
                "coreRefs": {
                  "steps": [
                    "flutter-ui"
                  ],
                  "claims": [
                    "flutter-ui-claim-platforms",
                    "flutter-ui-claim-model-driven",
                    "flutter-ui-claim-1",
