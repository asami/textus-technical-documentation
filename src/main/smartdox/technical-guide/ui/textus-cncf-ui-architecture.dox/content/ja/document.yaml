              {
                "id": "ui-realization-paragraph-1",
                "kind": "paragraph",
                "text": "画面の実現方式として、CNCFの標準Web UI、Textus Flutter基盤を利用するUI、外部で独自に作成してAPIで接続するUIを扱います。これらは必ず同じDisplay経路を通る三種類のレンダラーではなく、共有する基盤の範囲が異なる構成です。選択の中心は、画面技術そのものだけでなく、表示・通信・業務処理のどこまでを共通基盤に任せるかにあります。",
