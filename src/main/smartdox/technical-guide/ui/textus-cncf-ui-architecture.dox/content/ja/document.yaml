            "kind": "paragraph",
            "text": "本書は、Textus Document Componentの技術解説として、SimpleModeling／Textus／CNCFのUIアーキテクチャを整理します。モデル、公開API、表示契約、WebとFlutterの実行基盤がどのように組み合わさるかを説明し、RESTまたはgRPCで外部の独自UIを接続する構成も扱います。",
