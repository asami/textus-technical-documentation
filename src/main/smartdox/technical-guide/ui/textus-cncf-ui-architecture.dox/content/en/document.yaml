          {
            "id": "ui-realization-section",
            "heading": "Choosing among Three UI Architectures",
            "coreRefs": {
              "steps": [
                "ui-realization"
              ],
              "claims": [
                "ui-realization-claim-1"
              ],
              "nodes": [
                "ui-realization-node-1"
              ],
              "relations": [],
              "flows": [
                "ui-realization-flow"
              ]
            },
            "blocks": [
              {
                "id": "ui-realization-paragraph-1",
                "kind": "paragraph",
                "text": "The guide covers the CNCF standard Web UI, UI built on Textus Flutter infrastructure, and an independently developed UI connected through APIs. These are architectures with different shared infrastructure boundaries, not three renderers that must all use the same Display pipeline. The choice concerns which presentation, communication, and business responsibilities the shared infrastructure should own.",
                "coreRefs": {
                  "steps": [
                    "ui-realization"
                  ],
                  "claims": [
                    "ui-realization-claim-1"
                  ],
                  "nodes": [
                    "ui-realization-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ui-realization-flow"
                  ]
                }
              },
              {
                "id": "ui-path-comparison",
                "kind": "table",
                "caption": "Table 1. Three UI approaches and their shared infrastructure",
                "columns": [
                  {
                    "id": "col-1",
                    "heading": "Approach"
                  },
                  {
                    "id": "col-2",
                    "heading": "Shared infrastructure"
                  },
                  {
                    "id": "col-3",
                    "heading": "Application responsibility"
                  }
                ],
                "rows": [
                  {
                    "id": "ui-path-comparison-row-1",
                    "cells": [
                      "Standard Web UI",
                      "Page Views, HTML assembly, shared Widgets",
                      "Display definitions and Operation bindings"
                    ]
                  },
                  {
                    "id": "ui-path-comparison-row-2",
