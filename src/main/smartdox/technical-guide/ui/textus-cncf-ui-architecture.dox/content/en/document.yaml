                      "Textus Flutter UI",
                      "Device / transport Core and TFAF screens",
                      "Configuration, typed bindings and extensions"
                    ]
                  },
                  {
                    "id": "ui-path-comparison-row-3",
                    "cells": [
                      "Custom UI + API",
                      "Public Operations, authentication, authorization and rules",
                      "Screens, transport, outcome checks and retry conditions"
