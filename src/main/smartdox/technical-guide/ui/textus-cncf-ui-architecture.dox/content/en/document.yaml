              },
              {
                "id": "external-ui-section",
                "heading": "Connecting a Custom UI through REST or gRPC",
                "coreRefs": {
                  "steps": [
                    "external-ui"
                  ],
                  "claims": [
                    "external-ui-claim-1",
                    "external-ui-claim-2",
                    "external-ui-claim-3"
                  ],
                  "nodes": [
                    "external-ui-node-1",
                    "external-ui-node-2",
                    "external-ui-node-3"
                  ],
                  "relations": [
                    "external-ui-relation-1",
                    "external-ui-relation-2"
                  ],
                  "flows": [
                    "external-ui-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "external-ui-paragraph-1",
                    "kind": "paragraph",
                    "text": "The UI architecture also allows an independently developed Web or native UI to connect to the server through REST or gRPC. This option does not require the standard Web UI or TFAF and can accommodate existing frontends or specialized interfaces. The custom UI owns screen composition, interactions, and client-side state.",
                    "coreRefs": {
                      "steps": [
                        "external-ui"
                      ],
                      "claims": [
                        "external-ui-claim-1"
                      ],
                      "nodes": [
                        "external-ui-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "external-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "external-ui-paragraph-2",
                    "kind": "paragraph",
                    "text": "The server exposes APIs bound to public Services and Operations and routes requests from the transport boundary to shared business behavior. Input and result types, resource identities, errors, and contract versions define the mapping for REST and gRPC representations. A custom UI may use Views and Display where useful, but adopting Display and choosing a transport are separate decisions.",
                    "coreRefs": {
                      "steps": [
                        "external-ui"
                      ],
                      "claims": [
                        "external-ui-claim-2"
                      ],
                      "nodes": [
                        "external-ui-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "external-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "external-ui-paragraph-3",
                    "kind": "paragraph",
                    "text": "Authentication, authorization, input validation, business rules, state transitions, and persistence are enforced on the server. Hiding a button or checking input on a screen does not establish permission or business validity. This division allows multiple UIs to share business capabilities while evolving their presentation technology independently. Each UI implements and verifies the selected API version, error handling, authentication integration, and retry conditions.",
                    "coreRefs": {
                      "steps": [
                        "external-ui"
                      ],
                      "claims": [
                        "external-ui-claim-3"
                      ],
                      "nodes": [
                        "external-ui-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "external-ui-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ui-consistency-section",
            "heading": "Maintaining Consistency between Presentation and Business Execution",
            "coreRefs": {
              "steps": [
                "ui-consistency"
              ],
              "claims": [
                "ui-consistency-claim-1"
              ],
              "nodes": [
                "ui-consistency-node-1"
              ],
              "relations": [],
              "flows": [
                "ui-consistency-flow"
              ]
            },
            "blocks": [
              {
                "id": "ui-consistency-paragraph-1",
                "kind": "paragraph",
                "text": "After choosing a UI realization, the application must handle user context, permission, and update outcomes consistently. Presentation information, input requests, and confirmed business state are distinct and connect to shared execution contracts.",
                "coreRefs": {
                  "steps": [
                    "ui-consistency"
                  ],
                  "claims": [
                    "ui-consistency-claim-1"
                  ],
                  "nodes": [
                    "ui-consistency-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ui-consistency-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ui-context-section",
                "heading": "Aligning Presentation Context and Access Authority",
                "coreRefs": {
                  "steps": [
                    "ui-context"
                  ],
                  "claims": [
                    "ui-context-claim-1",
                    "ui-context-claim-2"
                  ],
                  "nodes": [
                    "ui-context-node-1",
                    "ui-context-node-2"
                  ],
                  "relations": [
                    "ui-context-relation-1"
                  ],
                  "flows": [
                    "ui-context-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ui-context-paragraph-1",
                    "kind": "paragraph",
                    "text": "Presentation depends on the user, workspace, language, and time conventions. Carrying server-resolved execution context into reading and presentation reduces discrepancies between displayed and operated-on resources. Client presentation preferences remain distinct from server-determined access authority.",
                    "coreRefs": {
                      "steps": [
                        "ui-context"
                      ],
                      "claims": [
                        "ui-context-claim-1"
                      ],
                      "nodes": [
                        "ui-context-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ui-context-flow"
                      ]
                    }
                  },
                  {
                    "id": "ui-context-paragraph-2",
                    "kind": "paragraph",
                    "text": "Information about available UI actions does not replace server authorization at execution time, because permissions or resource state may change after rendering. The server checks access to the Operation and its target when called. The security architecture guide in the same Document Component explains authentication and authorization in detail.",
                    "coreRefs": {
                      "steps": [
                        "ui-context"
                      ],
                      "claims": [
                        "ui-context-claim-2"
                      ],
                      "nodes": [
                        "ui-context-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ui-context-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ui-mutation-section",
                "heading": "Connecting User Actions to Confirmed State",
                "coreRefs": {
                  "steps": [
                    "ui-mutation"
                  ],
                  "claims": [
                    "ui-mutation-claim-1",
                    "ui-mutation-claim-2",
                    "ui-mutation-claim-3"
                  ],
                  "nodes": [
                    "ui-mutation-node-1",
                    "ui-mutation-node-2",
                    "ui-mutation-node-3"
                  ],
                  "relations": [
                    "ui-mutation-relation-1",
                    "ui-mutation-relation-2"
                  ],
                  "flows": [
                    "ui-mutation-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ui-mutation-paragraph-1",
                    "kind": "paragraph",
                    "text": "Labels and formatted values are not mutation specifications. Editing invokes an Operation through a mutation binding with input types and resource identity. Information used to detect update conflicts, such as a resource revision, remains distinct from display-definition and wire-schema versions.",
                    "coreRefs": {
                      "steps": [
                        "ui-mutation"
                      ],
                      "claims": [
                        "ui-mutation-claim-1"
                      ],
                      "nodes": [
                        "ui-mutation-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ui-mutation-flow"
                      ]
                    }
                  },
                  {
                    "id": "ui-mutation-paragraph-2",
                    "kind": "paragraph",
                    "text": "Transport, business execution and UI refresh can fail independently. The next action depends on which stage has a confirmed outcome.",
                    "coreRefs": {
                      "steps": [
                        "ui-mutation"
                      ],
                      "claims": [
                        "ui-mutation-claim-2"
                      ],
                      "nodes": [
                        "ui-mutation-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ui-mutation-flow"
                      ]
                    }
                  },
                  {
                    "id": "ui-mutation-paragraph-3",
                    "kind": "paragraph",
                    "text": "Shared client infrastructure handles contract-based communication, outcome classification, and refresh coordination, while screens present progress, completion, or required corrections. Custom UIs implement the same distinctions. Integration checks therefore include rejection, conflicts, communication loss, and reconnection as well as visual behavior.",
                    "coreRefs": {
                      "steps": [
                        "ui-mutation"
                      ],
                      "claims": [
                        "ui-mutation-claim-3"
                      ],
                      "nodes": [
                        "ui-mutation-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "ui-mutation-flow"
                      ]
                    }
                  },
                  {
                    "id": "ui-operation-outcome",
                    "kind": "figure",
                    "asset": "images/ui-operation-outcome-en.png",
                    "caption": "Figure 4. From a mutation request to redisplaying committed state. Authorization, commit and UI refresh are separate stages.",
                    "alt": "Figure 4. From a mutation request to redisplaying committed state. Authorization, commit and UI refresh are separate stages.",
                    "coreRefs": {
                      "steps": [
                        "ui-mutation",
                        "ui-context"
                      ],
                      "claims": [
                        "ui-mutation-claim-1",
                        "ui-mutation-claim-2",
