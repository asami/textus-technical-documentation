        "sections": [
          {
            "id": "ui-foundation-section",
            "heading": "Shared Foundations of UI Architecture",
            "coreRefs": {
              "steps": [
                "ui-foundation"
              ],
              "claims": [
                "ui-foundation-claim-1"
              ],
              "nodes": [
                "ui-foundation-node-1"
              ],
              "relations": [],
              "flows": [
                "ui-foundation-flow"
              ]
            },
            "blocks": [
              {
                "id": "ui-foundation-paragraph-1",
                "kind": "paragraph",
                "text": "SimpleModeling combines model-driven and component-based development, supported by Textus execution. Its UI architecture derives required information and interactions from requirements and connects them to public business contracts. This reduces the need to rewrite business rules when screens change and supports access to the same business capabilities from multiple UIs.",
                "coreRefs": {
                  "steps": [
                    "ui-foundation"
                  ],
                  "claims": [
                    "ui-foundation-claim-1"
                  ],
                  "nodes": [
                    "ui-foundation-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ui-foundation-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ui-model-section",
                "heading": "From Requirements to Screens and Actions",
                "coreRefs": {
                  "steps": [
                    "ui-model"
                  ],
                  "claims": [
                    "ui-model-claim-1",
                    "ui-model-claim-2",
                    "ui-model-claim-3"
                  ],
                  "nodes": [
                    "ui-model-node-1",
                    "ui-model-node-2",
                    "ui-model-node-3"
                  ],
                  "relations": [
                    "ui-model-relation-1",
                    "ui-model-relation-2"
                  ],
                  "flows": [
                    "ui-model-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ui-model-paragraph-1",
                    "kind": "paragraph",
                    "text": "A UI model describes what users read, enter, and do. Cozy Logical UI refines business use cases into system use cases and then UI use cases, establishing the relationship between screens and actions. Keeping Flutter widget structures and HTTP procedures out of screen requirements preserves their business meaning.",
                    "coreRefs": {
                      "steps": [
                        "ui-model"
                      ],
                      "claims": [
                        "ui-model-claim-1"
                      ],
                      "nodes": [
                        "ui-model-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ui-model-flow"
                      ]
                    }
                  },
                  {
                    "id": "ui-model-paragraph-2",
                    "kind": "paragraph",
                    "text": "Information retrieval and business actions bind to public Service and Operation contracts. A list binds to a query, a detail screen to an individual read, and an action button to a command. Explicit bindings between UI and Operation models reduce the need to reimplement business behavior for presentation.",
                    "coreRefs": {
                      "steps": [
                        "ui-model"
                      ],
                      "claims": [
                        "ui-model-claim-2"
                      ],
                      "nodes": [
                        "ui-model-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ui-model-flow"
                      ]
                    }
                  },
                  {
                    "id": "ui-model-paragraph-3",
                    "kind": "paragraph",
                    "text": "Retaining the mappings from requirements to screens and from screens to Operations makes it possible to check that required actions exist and that screens do not invoke private behavior. Model-driven UI development checks requirements, models, and public contracts together instead of treating generated screens as the sole specification.",
                    "coreRefs": {
                      "steps": [
                        "ui-model"
                      ],
                      "claims": [
                        "ui-model-claim-3"
                      ],
                      "nodes": [
                        "ui-model-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "ui-model-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "view-display-section",
                "heading": "Projecting Business Data into Presentation Contracts",
                "coreRefs": {
                  "steps": [
                    "view-display"
                  ],
                  "claims": [
                    "view-display-claim-1",
                    "view-display-claim-2",
                    "view-display-claim-3"
                  ],
                  "nodes": [
                    "view-display-node-1",
                    "view-display-node-2",
                    "view-display-node-3"
                  ],
                  "relations": [
                    "view-display-relation-1",
                    "view-display-relation-2"
                  ],
                  "flows": [
                    "view-display-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "view-display-paragraph-1",
                    "kind": "paragraph",
                    "text": "Server-side domain models and Operations own business state and update rules. A View organizes information for reading. It defines read-side meaning and access scope rather than passing raw storage or provider data directly to a screen.",
                    "coreRefs": {
                      "steps": [
                        "view-display"
                      ],
                      "claims": [
                        "view-display-claim-1"
                      ],
                      "nodes": [
                        "view-display-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "view-display-flow"
                      ]
                    }
                  },
                  {
                    "id": "view-display-paragraph-2",
                    "kind": "paragraph",
                    "text": "Display projects authorized Views and display definitions into presentation information such as fields, values, references, and actions. The CNCF Display contract uses typed inputs and registered conversions to produce the same projection from the same inputs. It neither reconstructs business data from display strings nor modifies a View during projection.",
                    "coreRefs": {
                      "steps": [
                        "view-display"
                      ],
                      "claims": [
                        "view-display-claim-2"
                      ],
                      "nodes": [
                        "view-display-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "view-display-flow"
                      ]
                    }
                  },
                  {
                    "id": "view-display-paragraph-3",
                    "kind": "paragraph",
                    "text": "This separation supports different Web and Flutter presentations while preserving business meaning. Views and Display provide reusable read-side contracts; they are not mandatory for every custom UI. A custom UI can consume the public API data contract appropriate to its use case.",
                    "coreRefs": {
                      "steps": [
                        "view-display"
                      ],
                      "claims": [
                        "view-display-claim-3"
                      ],
                      "nodes": [
                        "view-display-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "view-display-flow"
                      ]
                    }
                  },
                  {
                    "id": "ui-view-projection",
                    "kind": "figure",
                    "asset": "images/ui-view-projection-en.png",
                    "caption": "Figure 2. Read projection is separate from mutation. Changes use Operations rather than writing display values back into domain state.",
                    "alt": "Figure 2. Read projection is separate from mutation. Changes use Operations rather than writing display values back into domain state.",
                    "coreRefs": {
                      "steps": [
                        "view-display",
                        "ui-mutation"
                      ],
                      "claims": [
