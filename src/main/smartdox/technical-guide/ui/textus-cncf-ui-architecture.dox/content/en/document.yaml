            "sections": [
              {
                "id": "web-ui-section",
                "heading": "Composing the Standard Web UI",
                "coreRefs": {
                  "steps": [
                    "web-ui"
                  ],
                  "claims": [
                    "web-ui-claim-1",
                    "web-ui-claim-2",
                    "web-ui-claim-3"
                  ],
                  "nodes": [
                    "web-ui-node-1",
                    "web-ui-node-2",
                    "web-ui-node-3"
                  ],
                  "relations": [
                    "web-ui-relation-1",
                    "web-ui-relation-2"
                  ],
                  "flows": [
                    "web-ui-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "web-ui-paragraph-1",
                    "kind": "paragraph",
                    "text": "A CNCF Static Web Application constructs meaningful initial HTML on the server from the request execution context and a page View. Static does not mean that every page is generated in advance. Pages can depend on the user and requested resource without requiring separate browser API calls for every region of the initial display.",
                    "coreRefs": {
                      "steps": [
                        "web-ui"
                      ],
                      "claims": [
                        "web-ui-claim-1"
                      ],
                      "nodes": [
                        "web-ui-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "web-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "web-ui-paragraph-2",
                    "kind": "paragraph",
                    "text": "The Web UI DSL design represents lists, details, and action forms as Textus Widgets and maps them to Bootstrap Core HTML structures. A UX Profile adjusts presentation and interaction while retaining their meaning; Material Design is also a profile target. Separating screen meaning, HTML structure, and presentation policy reduces repeated implementation of the same foundations.",
                    "coreRefs": {
                      "steps": [
                        "web-ui"
                      ],
                      "claims": [
                        "web-ui-claim-2"
                      ],
                      "nodes": [
                        "web-ui-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "web-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "web-ui-paragraph-3",
                    "kind": "paragraph",
                    "text": "The Progressive Static Web direction adds JavaScript interaction where needed on top of server-delivered HTML. Ordinary form submissions and enhanced interactions connect to the same business Operations. Browser state is not treated as the authoritative result of a committed business action.",
                    "coreRefs": {
                      "steps": [
                        "web-ui"
                      ],
                      "claims": [
                        "web-ui-claim-3"
                      ],
                      "nodes": [
                        "web-ui-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "web-ui-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "flutter-ui-section",
                "heading": "Building Multiscreen UI Applications on a Flutter Framework Connected to Textus",
                "coreRefs": {
                  "steps": [
                    "flutter-ui"
                  ],
                  "claims": [
                    "flutter-ui-claim-platforms",
                    "flutter-ui-claim-model-driven",
                    "flutter-ui-claim-1",
                    "flutter-ui-claim-2",
                    "flutter-ui-claim-3"
                  ],
                  "nodes": [
                    "flutter-ui-node-platforms",
                    "flutter-ui-node-model-driven",
                    "flutter-ui-node-1",
                    "flutter-ui-node-2",
                    "flutter-ui-node-3"
                  ],
                  "relations": [
                    "flutter-ui-relation-platforms-model",
                    "flutter-ui-relation-model-runtime",
                    "flutter-ui-relation-1",
                    "flutter-ui-relation-2"
                  ],
                  "flows": [
                    "flutter-ui-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "flutter-ui-paragraph-platforms",
                    "kind": "paragraph",
                    "text": "UI applications are built on a Flutter application framework connected to Textus. This infrastructure targets iPhone and Android smartphones, tablets, Web applications, and desktop applications. Multiscreen support includes providing applications on different UI platforms as well as adapting to screen sizes. Flutter Web is a separate realization from the standard CNCF Web UI, which composes HTML on the server.",
                    "coreRefs": {
                      "steps": [
                        "flutter-ui"
                      ],
                      "claims": [
                        "flutter-ui-claim-platforms"
                      ],
                      "nodes": [
                        "flutter-ui-node-platforms"
                      ],
                      "relations": [],
                      "flows": [
                        "flutter-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "flutter-ui-paragraph-model-driven",
                    "kind": "paragraph",
                    "text": "Model-driven UI describes displayed information, user actions, and connections to Textus business operations separately from individual UI platform implementations. Connecting this model to application-framework configuration and bindings supports deployment across execution environments while sharing business meaning and interaction relationships. Models and shared infrastructure carry this responsibility rather than leaving every screen to implement platform support independently.",
                    "coreRefs": {
                      "steps": [
                        "flutter-ui"
                      ],
                      "claims": [
                        "flutter-ui-claim-model-driven"
                      ],
                      "nodes": [
                        "flutter-ui-node-model-driven"
                      ],
                      "relations": [],
                      "flows": [
                        "flutter-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "ui-model-multiplatform",
                    "kind": "figure",
                    "asset": "images/ui-model-multiplatform-en.png",
                    "caption": "Figure 3. Model-driven UI targets multiple platforms. Screen meaning and operation bindings are shared; layout and input adapt to each platform.",
                    "alt": "Figure 3. Model-driven UI targets multiple platforms. Screen meaning and operation bindings are shared; layout and input adapt to each platform.",
                    "coreRefs": {
                      "steps": [
                        "flutter-ui"
                      ],
                      "claims": [
                        "flutter-ui-claim-platforms",
                        "flutter-ui-claim-model-driven",
                        "flutter-ui-claim-1",
                        "flutter-ui-claim-2",
                        "flutter-ui-claim-3"
                      ],
                      "nodes": [
                        "flutter-ui-node-platforms",
                        "flutter-ui-node-model-driven",
                        "flutter-ui-node-1",
                        "flutter-ui-node-2",
                        "flutter-ui-node-3"
                      ],
                      "relations": [
                        "flutter-ui-relation-platforms-model",
                        "flutter-ui-relation-model-runtime",
                        "flutter-ui-relation-1",
                        "flutter-ui-relation-2"
                      ],
                      "flows": [
                        "flutter-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "flutter-ui-paragraph-1",
                    "kind": "paragraph",
                    "text": "The Flutter infrastructure separates device and transport mechanisms from application screens such as lists, details and editing. Business-specific configuration and extensions connect to those layers as shown below.",
                    "coreRefs": {
                      "steps": [
                        "flutter-ui"
                      ],
                      "claims": [
                        "flutter-ui-claim-1"
                      ],
                      "nodes": [
                        "flutter-ui-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "flutter-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "ui-flutter-roles",
                    "kind": "table",
                    "caption": "Table 2. Responsibilities in the Flutter stack",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Layer"
                      },
                      {
                        "id": "col-2",
                        "heading": "Responsibility"
                      },
                      {
                        "id": "col-3",
                        "heading": "Combined effect"
                      }
                    ],
                    "rows": [
                      {
                        "id": "ui-flutter-roles-row-1",
                        "cells": [
                          "Flutter Core",
                          "Device features, transport and display regions",
                          "Provides common interfaces for platform differences"
                        ]
                      },
                      {
                        "id": "ui-flutter-roles-row-2",
                        "cells": [
                          "TFAF",
                          "List / detail / edit, search, navigation and approval",
                          "Configures reusable application screens"
                        ]
                      },
                      {
                        "id": "ui-flutter-roles-row-3",
                        "cells": [
                          "Application",
                          "Business configuration, bindings and extensions",
                          "Connects screens to shared business contracts"
                        ]
                      }
                    ],
                    "coreRefs": {
                      "steps": [
                        "flutter-ui"
                      ],
                      "claims": [
                        "flutter-ui-claim-platforms",
                        "flutter-ui-claim-model-driven",
                        "flutter-ui-claim-1",
                        "flutter-ui-claim-2",
                        "flutter-ui-claim-3"
                      ],
                      "nodes": [
                        "flutter-ui-node-platforms",
                        "flutter-ui-node-model-driven",
                        "flutter-ui-node-1",
                        "flutter-ui-node-2",
                        "flutter-ui-node-3"
                      ],
                      "relations": [
                        "flutter-ui-relation-platforms-model",
                        "flutter-ui-relation-model-runtime",
                        "flutter-ui-relation-1",
                        "flutter-ui-relation-2"
                      ],
                      "flows": [
                        "flutter-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "flutter-ui-paragraph-2",
                    "kind": "paragraph",
                    "text": "Standard screens are intended to configure reusable TFAF implementations. The target pipeline has Cozy generate configuration and typed bindings from UI models, supplemented by generated Dart or custom code where configuration is insufficient. Keeping generation, configuration, and custom extensions separate makes model changes and shared-runtime improvements easier to propagate across UI applications.",
                    "coreRefs": {
                      "steps": [
                        "flutter-ui"
                      ],
                      "claims": [
                        "flutter-ui-claim-2"
                      ],
                      "nodes": [
                        "flutter-ui-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "flutter-ui-flow"
                      ]
                    }
                  },
                  {
                    "id": "flutter-ui-paragraph-3",
                    "kind": "paragraph",
                    "text": "Within each execution environment, presentation and interaction adapt to screen size and input methods such as touch, mouse, and keyboard. Lists and details can appear sequentially on compact screens and side by side on expanded screens. On foldable devices, TFAF uses region and boundary information supplied by Core for layout decisions. Separating selection and editing state from layout keeps business interaction state independent of presentation changes.",
                    "coreRefs": {
                      "steps": [
                        "flutter-ui"
                      ],
                      "claims": [
                        "flutter-ui-claim-3"
                      ],
                      "nodes": [
                        "flutter-ui-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "flutter-ui-flow"
                      ]
                    }
                  },
