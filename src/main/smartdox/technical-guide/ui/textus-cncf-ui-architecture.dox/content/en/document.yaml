          {
            "id": "textus-cncf-ui-architecture-paragraph-1",
            "kind": "paragraph",
            "text": "As technical documentation in the Textus Document Component, this guide describes the SimpleModeling/Textus/CNCF UI architecture. It explains how models, public APIs, presentation contracts, and Web and Flutter infrastructure cooperate, including an independently developed UI connected through REST or gRPC.",
            "coreRefs": {
