          },
          {
            "id": "ui-development-section",
            "heading": "Developing across Models, Generation, and Execution",
            "coreRefs": {
              "steps": [
                "ui-development"
              ],
              "claims": [
                "ui-development-claim-1",
                "ui-development-claim-2",
                "ui-development-claim-3"
              ],
              "nodes": [
                "ui-development-node-1",
                "ui-development-node-2",
                "ui-development-node-3"
              ],
              "relations": [
                "ui-development-relation-1",
                "ui-development-relation-2"
              ],
              "flows": [
                "ui-development-flow"
              ]
            },
            "blocks": [
              {
                "id": "ui-development-paragraph-1",
                "kind": "paragraph",
                "text": "The model-driven path aims to use requirements and public contracts as inputs for Cozy-generated configuration and bindings, with execution handled by Textus and client frameworks. Separating generated artifacts from handwritten extensions supports regeneration after model changes. The custom-UI path uses the same public contract boundary while allowing a different frontend development process.",
                "coreRefs": {
                  "steps": [
                    "ui-development"
                  ],
                  "claims": [
                    "ui-development-claim-1"
                  ],
                  "nodes": [
                    "ui-development-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ui-development-flow"
                  ]
                }
              },
              {
                "id": "ui-development-paragraph-2",
                "kind": "paragraph",
                "text": "NICT Editing Studio serves as a reference application for developing TFAF and UI-model design through lists, details, editing, and device features. Keeping a common data-source boundary supports a transition from fixture data to server-backed data for integration checks. Feeding reusable patterns back into the frameworks avoids fixing the UI model in isolation from working applications.",
                "coreRefs": {
                  "steps": [
                    "ui-development"
                  ],
                  "claims": [
                    "ui-development-claim-2"
                  ],
                  "nodes": [
                    "ui-development-node-2"
                  ],
                  "relations": [],
                  "flows": [
                    "ui-development-flow"
                  ]
                }
              },
              {
                "id": "ui-development-paragraph-3",
                "kind": "paragraph",
                "text": "This guide describes an architecture that includes implementation work and design directions. Static Web page-View projection has an implementation, and Logical UI and Display have specifications; this does not establish completion of every model-to-screen path. Progressive Static Web and UX Profiles include proposal and design work. A custom UI using REST or gRPC must confirm the public APIs and adapters available in its selected release. In particular, this guide positions gRPC connectivity as an architectural option without claiming a shipped standard adapter.",
                "coreRefs": {
                  "steps": [
                    "ui-development"
                  ],
                  "claims": [
                    "ui-development-claim-3"
                  ],
                  "nodes": [
                    "ui-development-node-3"
                  ],
                  "relations": [],
                  "flows": [
                    "ui-development-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "ui-conclusion-section",
            "heading": "Conclusion",
            "coreRefs": {
              "steps": [
                "ui-conclusion"
              ],
              "claims": [
                "ui-conclusion-claim-1"
              ],
              "nodes": [
                "ui-conclusion-node-1"
              ],
              "relations": [],
              "flows": [
                "ui-conclusion-flow"
              ]
            },
            "blocks": [
              {
                "id": "ui-conclusion-paragraph-1",
                "kind": "paragraph",
                "text": "Textus/CNCF UI architecture connects requirements, read and operation contracts, and presentation implementations. A Flutter application framework connected to Textus combines model-driven UI with a shared runtime to support smartphone, tablet, Web, and desktop applications. Standard Web UI and custom UI connected through REST or gRPC remain alternatives, sharing business rules and confirmed state on the server while providing presentation and interaction suited to each use case.",
                "coreRefs": {
                  "steps": [
                    "ui-conclusion"
                  ],
                  "claims": [
                    "ui-conclusion-claim-1"
                  ],
                  "nodes": [
                    "ui-conclusion-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ui-conclusion-flow"
                  ]
                }
              }
            ],
            "sections": []
          }
        ]
      }
