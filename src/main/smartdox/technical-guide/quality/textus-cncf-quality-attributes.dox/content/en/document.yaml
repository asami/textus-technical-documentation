                      "Application scaling + Domain capacity + admission control",
                      "Match capacity and admitted work to changing demand"
                    ]
                  },
                  {
                    "id": "qa-runtime-map-row-3",
                    "cells": [
                      "Availability / resilience",
                      "Component boundaries + state management + redundancy/failover",
                      "Limit propagation and sustain service with the selected deployment"
                    ]
                  },
                  {
                    "id": "qa-runtime-map-row-4",
                    "cells": [
