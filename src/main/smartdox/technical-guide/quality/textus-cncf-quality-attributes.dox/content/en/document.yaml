            "sections": []
          },
          {
            "id": "qa-common-path-section",
            "heading": "Connecting Models and Components to Shared Execution",
            "coreRefs": {
              "steps": [
                "qa-common-path"
              ],
              "claims": [
                "qa-models-claim",
                "qa-contracts-claim",
                "qa-execution-figure-claim",
                "qa-programs-claim"
              ],
              "nodes": [
                "qa-models-node",
                "qa-contracts-node",
                "qa-execution-figure-node",
                "qa-programs-node"
              ],
              "relations": [
                "qa-common-path-relation-1",
                "qa-common-path-relation-2",
                "qa-common-path-relation-3"
              ],
              "flows": [
                "qa-common-path-flow"
              ]
            },
            "blocks": [
              {
                "id": "qa-models",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-common-path"
                  ],
                  "claims": [
                    "qa-models-claim"
                  ],
                  "nodes": [
                    "qa-models-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-common-path-flow"
                  ]
                },
                "text": "CML defines Aggregates and Views based on Entities, Workflows based on state machines, business rules, and public Operations. Textus directly executes executable models, while Cozy generates typed APIs and connecting structures. This reduces repeated implementation of model semantics and constraints in code and screens, connecting business rules to runtime operations."
              },
              {
                "id": "qa-contracts",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-common-path"
                  ],
                  "claims": [
                    "qa-contracts-claim"
                  ],
                  "nodes": [
                    "qa-contracts-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-common-path-flow"
                  ]
                },
                "text": "CBD defines component responsibilities and public contracts. APIs and SPIs define external contacts, while data operations and external effects connect to the UoW path. Independent components thereby run under shared authorization, commit, and resource management. Quality benefits come both from component independence and from reconnecting reused components to the same runtime controls."
              },
              {
                "id": "qa-execution-figure",
                "kind": "figure",
                "coreRefs": {
                  "steps": [
                    "qa-common-path"
                  ],
                  "claims": [
                    "qa-execution-figure-claim"
                  ],
                  "nodes": [
                    "qa-execution-figure-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-common-path-flow"
                  ]
                },
                "asset": "images/execution-boundaries-en.png",
                "caption": "Figure 1. Shared execution boundaries for model-connected business operations: authorization, commit, and resource termination.",
                "alt": "Figure 1. Shared execution boundaries for model-connected business operations: authorization, commit, and resource termination."
              },
              {
                "id": "qa-programs",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-common-path"
                  ],
                  "claims": [
                    "qa-programs-claim"
                  ],
                  "nodes": [
                    "qa-programs-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-common-path-flow"
                  ]
                },
                "text": "Types and pure functional composition make inputs, outputs, and valid connections explicit. Consequence/Conclusion standardize outcomes and failure information, while Free Monad operation descriptions pass to UoW execution. Reducing controls embedded in supplementary code also makes AI-written processing easier to connect to shared runtime management. Type checks and runtime controls address different classes of errors and work together."
              }
            ],
            "sections": []
          },
          {
            "id": "qa-reactive-section",
            "heading": "Managing Asynchronous Benefits and Complexity in the Runtime",
            "coreRefs": {
              "steps": [
                "qa-reactive"
              ],
              "claims": [
                "qa-reactive-benefits-claim",
                "qa-reactive-runtime-claim",
                "qa-tiers-figure-claim",
                "qa-reactive-balance-claim"
              ],
              "nodes": [
                "qa-reactive-benefits-node",
                "qa-reactive-runtime-node",
                "qa-tiers-figure-node",
                "qa-reactive-balance-node"
              ],
              "relations": [
                "qa-reactive-relation-1",
                "qa-reactive-relation-2",
                "qa-reactive-relation-3"
              ],
              "flows": [
                "qa-reactive-flow"
              ]
            },
            "blocks": [
              {
                "id": "qa-reactive-benefits",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-reactive"
                  ],
                  "claims": [
                    "qa-reactive-benefits-claim"
                  ],
                  "nodes": [
                    "qa-reactive-benefits-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-reactive-flow"
                  ]
                },
                "text": "Reactive architecture uses messages to reduce temporal dependencies, combined with load distribution, capacity adjustment, and failure isolation. The Reactive Manifesto organizes this relationship through responsiveness, resilience, elasticity, and message-driven communication. Combining asynchronous processing with load control and recovery supports performance, availability, and flexibility. Reference: The Reactive Manifesto (https://www.reactivemanifesto.org/)."
              },
              {
                "id": "qa-reactive-runtime",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-reactive"
                  ],
                  "claims": [
                    "qa-reactive-runtime-claim"
                  ],
                  "nodes": [
                    "qa-reactive-runtime-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-reactive-flow"
                  ]
                },
                "text": "Asynchronous processing must handle ordering, completion, retries, duplicates, and data freshness. Textus/CNCF connects Jobs/Tasks, state machines, Workflows, UoW, events, and common outcome semantics to provide managed execution paths. Implementations using models and standard facilities run through these paths, reducing the need for application-specific schedulers and progress management. The architecture delegates the technical complexity of reactive execution to the infrastructure."
              },
              {
                "id": "qa-tiers-figure",
                "kind": "figure",
                "coreRefs": {
                  "steps": [
                    "qa-reactive"
                  ],
                  "claims": [
                    "qa-tiers-figure-claim"
                  ],
                  "nodes": [
                    "qa-tiers-figure-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-reactive-flow"
                  ]
                },
                "asset": "images/tier-lifetimes-en.png",
                "caption": "Figure 2. Responsibilities for admission, long-running work, business state, and persistence. Acceptance differs from completion, and progression differs from commit.",
                "alt": "Figure 2. Responsibilities for admission, long-running work, business state, and persistence. Acceptance differs from completion, and progression differs from commit."
              },
              {
                "id": "qa-reactive-balance",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-reactive"
                  ],
                  "claims": [
                    "qa-reactive-balance-claim"
                  ],
                  "nodes": [
                    "qa-reactive-balance-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-reactive-flow"
                  ]
                },
                "text": "Application scaling is coordinated with Domain and DataStore capacity. Working Sets and Views reduce loading, while Aggregates and UoW manage updates. Faster reads still require distinguishing committed updates from View refresh and defining acceptable freshness. Coordinating capacity, latency, and consistency along the same execution path provides a system-level effect beyond isolated optimizations."
              }
            ],
            "sections": []
          },
          {
            "id": "qa-protection-section",
            "heading": "Applying Protection, Consistency, and Traceability to the Same Operation",
            "coreRefs": {
              "steps": [
                "qa-protection"
              ],
              "claims": [
                "qa-security-runtime-claim",
                "qa-audit-consistency-claim",
                "qa-policy-claim"
              ],
              "nodes": [
                "qa-security-runtime-node",
                "qa-audit-consistency-node",
                "qa-policy-node"
              ],
              "relations": [
                "qa-protection-relation-1",
                "qa-protection-relation-2"
              ],
              "flows": [
                "qa-protection-flow"
              ]
            },
            "blocks": [
              {
                "id": "qa-security-runtime",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-protection"
                  ],
                  "claims": [
                    "qa-security-runtime-claim"
                  ],
                  "nodes": [
                    "qa-security-runtime-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-protection-flow"
                  ]
                },
                "text": "The Presentation tier may use Web, Flutter, or an independently built UI and is not a server-side trust assumption. The Application tier coordinates requests and invokes public Domain Operations. Standard execution carries a shared authenticated context and checks Operation authorization as well as access to target Entities and resources. Common SimpleEntity ownership/group information and UNIX-style read/write permissions reduce independent implementations in each component."
              },
              {
                "id": "qa-audit-consistency",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-protection"
                  ],
                  "claims": [
                    "qa-audit-consistency-claim"
                  ],
                  "nodes": [
                    "qa-audit-consistency-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-protection-flow"
                  ]
                },
                "text": "Authorized operations still follow Aggregate invariants, state-machine transition rules, and UoW commit handling. Relating infrastructure-collected execution records and audit trails to the same operation and target shows what was permitted, what committed, and where failure occurred. Keeping protection decisions, update management, and observation on shared paths reduces gaps between authorization and traceable outcomes."
              },
              {
                "id": "qa-policy",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-protection"
                  ],
                  "claims": [
                    "qa-policy-claim"
                  ],
                  "nodes": [
                    "qa-policy-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-protection-flow"
                  ]
                },
                "text": "Ordinary development connects CML definitions and basic settings to standard paths, reducing bespoke protection and recording code. Who may perform which operations and how long audit records are kept remain application requirements. Stronger isolation or functional restrictions combine deployment choices with Capability restrictions. Shared basic mechanisms provide the starting point for additional requirements."
              }
            ],
            "sections": []
          },
          {
            "id": "qa-evolution-section",
            "heading": "Expanding Functionality and User Platforms while Preserving Contracts",
            "coreRefs": {
              "steps": [
                "qa-evolution"
              ],
              "claims": [
                "qa-reuse-claim",
                "qa-ui-claim",
                "qa-usability-claim"
              ],
              "nodes": [
                "qa-reuse-node",
                "qa-ui-node",
                "qa-usability-node"
              ],
              "relations": [
                "qa-evolution-relation-1",
                "qa-evolution-relation-2"
              ],
              "flows": [
                "qa-evolution-flow"
              ]
            },
            "blocks": [
              {
                "id": "qa-reuse",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-evolution"
                  ],
                  "claims": [
                    "qa-reuse-claim"
                  ],
                  "nodes": [
                    "qa-reuse-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-evolution-flow"
                  ]
                },
                "text": "Functional extensibility differs from capacity scalability. Typed APIs derived from CML and Component/Service/Operation contracts support component reuse and contract-guided connecting code. Keeping external services and storage mechanisms behind SPIs limits provider changes reaching business models. Model checks, compilation, CAR inspection, and component review examine contract/implementation mismatches at different stages."
              },
              {
                "id": "qa-ui",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-evolution"
                  ],
                  "claims": [
                    "qa-ui-claim"
                  ],
                  "nodes": [
                    "qa-ui-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-evolution-flow"
                  ]
                },
                "text": "Views preserve read-result semantics, Displays project them for presentation, and updates return through public Operations. Standard Web UI or Textus-connected Flutter applications can use this division to share business rules across phones, tablets, Web, and Desktop. Independently built UIs connected through REST or gRPC follow the same principle of public contracts and server-side protection. Presentation choice can therefore coexist with consistent business operations."
              },
              {
                "id": "qa-usability",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-evolution"
                  ],
                  "claims": [
                    "qa-usability-claim"
                  ],
                  "nodes": [
                    "qa-usability-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-evolution-flow"
                  ]
                },
                "text": "Usability includes understanding whether work was accepted or completed and whether input needs correction. Mapping common input validation, Consequence/Conclusion, and Job progress to the UI provides consistent meanings for state and failure. Screen sizes, input methods, and accessibility are checked in the target UI. Shared models support semantic consistency; practical usability also depends on how those semantics are presented."
              }
            ],
            "sections": []
          },
          {
            "id": "qa-operation-section",
            "heading": "Starting with Standard Configuration and Adjusting Required Levels",
            "coreRefs": {
              "steps": [
                "qa-operation"
              ],
              "claims": [
                "qa-responsibilities-claim",
                "qa-tradeoffs-claim",
                "qa-responsibility-table-claim",
                "qa-verification-claim",
                "qa-scope-claim"
              ],
              "nodes": [
                "qa-responsibilities-node",
                "qa-tradeoffs-node",
                "qa-responsibility-table-node",
                "qa-verification-node",
                "qa-scope-node"
              ],
              "relations": [
                "qa-operation-relation-1",
                "qa-operation-relation-2",
                "qa-operation-relation-3",
                "qa-operation-relation-4"
              ],
              "flows": [
                "qa-operation-flow"
              ]
            },
            "blocks": [
              {
                "id": "qa-responsibilities",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-operation"
                  ],
                  "claims": [
                    "qa-responsibilities-claim"
                  ],
                  "nodes": [
                    "qa-responsibilities-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-operation-flow"
                  ]
                },
                "text": "Using standard models and facilities also selects the paths that apply quality controls. Developers define business meaning, and the runtime executes common controls. Configuration and deployment adjust throughput, availability, and retention, while business-specific compensation and authorization are specified separately. Separating the choice of application conditions from building their enforcement mechanisms simplifies adoption and operation."
              },
              {
                "id": "qa-tradeoffs",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-operation"
                  ],
                  "claims": [
                    "qa-tradeoffs-claim"
                  ],
                  "nodes": [
                    "qa-tradeoffs-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-operation-flow"
                  ]
                },
                "text": "Quality attributes interact. More resident data can reduce retrieval time while affecting memory cost and reconstruction time. Asynchronous read-model updates can improve responsiveness while requiring freshness rules. Redundancy and stronger isolation support availability and protection but add deployment and operating costs. Select combinations for the required levels and reuse standard mechanisms to reduce bespoke implementation and verification."
              },
              {
                "id": "qa-responsibility-table",
                "kind": "table",
                "coreRefs": {
                  "steps": [
                    "qa-operation"
                  ],
                  "claims": [
                    "qa-responsibility-table-claim"
                  ],
                  "nodes": [
                    "qa-responsibility-table-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-operation-flow"
                  ]
                },
                "caption": "Infrastructure and application responsibilities",
                "columns": [
                  {
                    "id": "col-1",
                    "heading": "Concern"
                  },
                  {
                    "id": "col-2",
                    "heading": "Shared infrastructure"
                  },
                  {
                    "id": "col-3",
                    "heading": "Development/operations choices"
                  }
                ],
                "rows": [
                  {
                    "id": "qa-responsibility-table-row-1",
                    "cells": [
                      "Business data and progression",
                      "Model operations, transitions, and commit",
                      "Invariants, allowed transitions, read freshness"
                    ]
                  },
                  {
                    "id": "qa-responsibility-table-row-2",
                    "cells": [
                      "Asynchronous execution",
                      "Admission/progress/outcome and resource management",
                      "Direct/Job selection, workload, business retries/compensation"
                    ]
                  },
                  {
                    "id": "qa-responsibility-table-row-3",
                    "cells": [
                      "Protection and audit",
                      "Authenticated context, operation/data checks, records",
                      "Authentication method, permissions, retention/access"
                    ]
                  },
                  {
                    "id": "qa-responsibility-table-row-4",
                    "cells": [
                      "Availability and recovery",
                      "Failover/reconstruction paths in selected configurations",
                      "Failure assumptions, redundancy scope, recovery time/cost"
                    ]
                  },
                  {
                    "id": "qa-responsibility-table-row-5",
                    "cells": [
                      "Presentation and integration",
                      "Shared business/presentation contracts and extension points",
                      "UI platform, external services, usage environments"
                    ]
                  }
                ]
              },
              {
                "id": "qa-verification",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-operation"
                  ],
                  "claims": [
                    "qa-verification-claim"
                  ],
                  "nodes": [
                    "qa-verification-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-operation-flow"
                  ]
                },
                "text": "Model and type checks detect inconsistent rules and connections. Runtime checks cover responses under representative load, committed state and recovery after failure, and authorization decisions with audit records. Correlating admission, Operation, Job/Task, and UoW records identifies whether gaps arise in waiting, execution, or retries. Feed findings back into models, configuration, and deployment and recheck under the same conditions."
              },
              {
                "id": "qa-scope",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-operation"
                  ],
                  "claims": [
                    "qa-scope-claim"
                  ],
                  "nodes": [
                    "qa-scope-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-operation-flow"
                  ]
                },
                "text": "This guide describes the technology system and its division of responsibilities. Consult the specialist guides for the implementation scope of the selected version. Durable Job resumption, availability profiles and replacement paths, security profiles and operating procedures, and some UI generation paths include work still under design or development. Record infrastructure support separately from performance and availability levels verified in the target environment."
              }
            ],
            "sections": []
          },
          {
            "id": "qa-conclusion-section",
            "heading": "Conclusion",
            "coreRefs": {
              "steps": [
                "qa-conclusion"
              ],
              "claims": [
                "qa-conclusion-text-claim"
              ],
              "nodes": [
                "qa-conclusion-text-node"
              ],
