            "blocks": [
              {
                "id": "qa-conclusion-text",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-conclusion"
                  ],
                  "claims": [
                    "qa-conclusion-text-claim"
                  ],
                  "nodes": [
                    "qa-conclusion-text-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-conclusion-flow"
                  ]
                },
                "text": "Textus/CNCF combines CML models, component contracts, and shared runtime mechanisms to place quality controls on ordinary development and operating paths. Developers express business conditions in models and configuration and delegate complex execution controls to the infrastructure. Following standard conventions connects applications to multiple quality mechanisms, while application-specific configuration and verification establish the required levels."
              }
            ],
            "sections": []
          },
          {
