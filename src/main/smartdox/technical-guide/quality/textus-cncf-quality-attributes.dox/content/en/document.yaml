                  ],
                  "relations": [],
                  "flows": [
                    "qa-references-flow"
                  ]
                },
                "text": "The following guides provide detailed explanations of individual mechanisms. They are related documents in this repository. This guide provides a quality-oriented entry point; model and implementation details belong to the corresponding specialist guides."
              },
              {
                "id": "qa-external",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-references"
                  ],
                  "claims": [
                    "qa-external-claim"
                  ],
                  "nodes": [
                    "qa-external-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-references-flow"
                  ]
                },
                "text": "For quality attribute scenarios, see SEI, Quality Attribute Workshops, Third Edition (https://www.sei.cmu.edu/documents/716/2003_005_001_14249.pdf). For reactive architecture and its four characteristics, see The Reactive Manifesto (https://www.reactivemanifesto.org/). The Textus/CNCF mappings in this guide organize the related technical guides by quality attribute, informed by these general concepts."
              },
