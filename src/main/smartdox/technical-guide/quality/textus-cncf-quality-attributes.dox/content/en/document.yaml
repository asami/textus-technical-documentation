          {
            "id": "textus-cncf-quality-attributes-purpose",
            "kind": "paragraph",
            "text": "Textus/CNCF makes shared authorization, consistency, reactive execution, and observation available through ordinary development with CML models and standard CNCF facilities. This guide starts from non-functional requirements and quality attributes to explain combined effects, infrastructure and developer responsibilities, and application-specific configuration and verification.",
            "coreRefs": {
