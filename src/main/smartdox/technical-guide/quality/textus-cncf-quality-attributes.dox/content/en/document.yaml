        "sections": [
          {
            "id": "qa-requirements-section",
            "heading": "Expressing Non-functional Requirements through Qualities and Conditions",
            "coreRefs": {
              "steps": [
                "qa-requirements"
              ],
              "claims": [
                "qa-meaning-claim",
                "qa-scenarios-claim",
                "qa-requirement-examples-claim"
              ],
              "nodes": [
                "qa-meaning-node",
                "qa-scenarios-node",
                "qa-requirement-examples-node"
              ],
              "relations": [
                "qa-requirements-relation-1",
                "qa-requirements-relation-2"
              ],
              "flows": [
                "qa-requirements-flow"
              ]
            },
            "blocks": [
              {
                "id": "qa-meaning",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-requirements"
                  ],
                  "claims": [
                    "qa-meaning-claim"
                  ],
                  "nodes": [
                    "qa-meaning-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-requirements-flow"
                  ]
                },
                "text": "Functional requirements describe what a system does. Non-functional requirements describe the load, failures, usage environments, and operating conditions under which it must provide that functionality. Quality attributes such as performance, availability, security, and modifiability provide perspectives for organizing these requirements. Cost and deployment constraints also influence the combination of qualities to support."
              },
              {
                "id": "qa-scenarios",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-requirements"
                  ],
                  "claims": [
                    "qa-scenarios-claim"
                  ],
                  "nodes": [
                    "qa-scenarios-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-requirements-flow"
                  ]
                },
                "text": "Terms such as fast or always available do not select an architecture. Define the affected operation, source and event, conditions such as load, expected response, and response measure. For long-running work, distinguish time to acceptance from time to completion. For recovery, distinguish tolerable downtime from tolerable data loss. This follows the quality attribute scenario approach. Reference: SEI Quality Attribute Workshops, Third Edition (https://www.sei.cmu.edu/documents/716/2003_005_001_14249.pdf)."
              },
              {
