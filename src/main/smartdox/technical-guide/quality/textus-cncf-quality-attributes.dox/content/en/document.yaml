          {
            "id": "qa-map-section",
            "heading": "Mapping Quality Attributes to Textus/CNCF",
            "coreRefs": {
              "steps": [
                "qa-map"
              ],
              "claims": [
                "qa-map-purpose-claim",
                "qa-runtime-map-claim",
                "qa-lifecycle-map-claim"
              ],
              "nodes": [
                "qa-map-purpose-node",
                "qa-runtime-map-node",
                "qa-lifecycle-map-node"
              ],
              "relations": [
                "qa-map-relation-1",
                "qa-map-relation-2"
              ],
              "flows": [
                "qa-map-flow"
              ]
            },
            "blocks": [
              {
                "id": "qa-map-purpose",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-map"
                  ],
                  "claims": [
                    "qa-map-purpose-claim"
                  ],
                  "nodes": [
                    "qa-map-purpose-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-map-flow"
                  ]
                },
                "text": "Textus/CNCF reduces the quality controls that must be added separately to each business process by placing them in models, component contracts, and shared execution paths. Using CML models and standard CNCF facilities connects business operations to authorization, update management, asynchronous execution, and observation. The following tables map these combinations to their effects from a development and operations perspective; they do not reproduce a formal quality standard classification."
              },
              {
                "id": "qa-runtime-map",
                "kind": "table",
                "coreRefs": {
                  "steps": [
                    "qa-map"
                  ],
                  "claims": [
                    "qa-runtime-map-claim"
                  ],
                  "nodes": [
                    "qa-runtime-map-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-map-flow"
                  ]
                },
                "caption": "Runtime qualities and supporting combinations",
                "columns": [
                  {
                    "id": "col-1",
                    "heading": "Quality attribute"
                  },
                  {
                    "id": "col-2",
                    "heading": "Textus/CNCF combination"
                  },
                  {
                    "id": "col-3",
                    "heading": "Effect"
                  }
                ],
                "rows": [
                  {
                    "id": "qa-runtime-map-row-1",
                    "cells": [
                      "Performance / responsiveness",
                      "Working Sets and Views + direct/Job execution + load control",
                      "Reduce loading and waiting; distinguish acceptance from completion"
                    ]
                  },
                  {
                    "id": "qa-runtime-map-row-2",
                    "cells": [
