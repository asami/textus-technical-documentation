                },
                "text": "型と純粋関数型の合成は、入力・出力と接続できる処理を明示します。Consequence／Conclusionは成功・失敗とその情報を揃え、Free Monadによる操作記述をUoWの実行へ渡します。複雑な制御を補完コードへ埋め込む範囲を減らすため、AIが作成した処理も共通基盤の管理へ接続しやすくなります。型による検査と実行時の管理は、異なる範囲の誤りを扱う仕組みとして組み合わせます。"
              }
