              ],
              "flows": [
                "qa-protection-flow"
              ]
            },
            "blocks": [
              {
                "id": "qa-security-runtime",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-protection"
                  ],
                  "claims": [
                    "qa-security-runtime-claim"
                  ],
                  "nodes": [
                    "qa-security-runtime-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-protection-flow"
                  ]
                },
                "text": "Presentation tierは、Web、Flutter、外部の独自UIなどで構成でき、サーバー側の信頼の前提には置きません。Application tierが要求を調整し、Domain tierの公開Operationを呼び出します。標準経路では、共通の認証文脈を引き継ぎ、Operationの認可に加えて、対象Entityと利用資源の条件を確認します。SimpleEntityの所有者・グループなどの基本情報とUNIX型のread／write権限を共通に扱うことで、部品ごとの独自実装を減らします。"
              },
              {
                "id": "qa-audit-consistency",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-protection"
                  ],
                  "claims": [
                    "qa-audit-consistency-claim"
                  ],
                  "nodes": [
                    "qa-audit-consistency-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-protection-flow"
                  ]
                },
                "text": "許可された操作も、Aggregateの不変条件、状態機械の遷移条件、UoWの確定処理に従います。基盤が収集する実行記録と監査証跡を同じ操作や対象へ関連付けると、何が許可され、何が確定し、どこで失敗したかを確認できます。保護の判定、更新管理、観測を同じ経路へ置くことで、認可されたが更新結果を追えない、といった分断を減らします。"
              },
              {
                "id": "qa-policy",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-protection"
                  ],
                  "claims": [
                    "qa-policy-claim"
                  ],
                  "nodes": [
                    "qa-policy-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-protection-flow"
                  ]
                },
                "text": "通常の開発では、CMLの定義と基本設定を標準経路へ接続し、業務ごとに保護や記録の機構を実装する負担を減らします。誰に何を許可するか、監査記録をどれだけ保存するかは用途の条件です。より強い区画分離や機能制限が必要な場合は、配備構成とCapabilityの制限を組み合わせます。共通の基本機構を起点に、必要な範囲を追加する分担です。"
              }
            ],
            "sections": []
          },
          {
            "id": "qa-evolution-section",
            "heading": "業務契約を保ちながら変更と利用環境を広げる",
            "coreRefs": {
              "steps": [
                "qa-evolution"
              ],
              "claims": [
                "qa-reuse-claim",
                "qa-ui-claim",
                "qa-usability-claim"
              ],
              "nodes": [
                "qa-reuse-node",
