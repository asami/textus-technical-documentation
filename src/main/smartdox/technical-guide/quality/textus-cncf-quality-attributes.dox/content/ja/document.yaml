                "text": "本書はTextus/CNCFの技術体系と責務分担をまとめています。利用時には採用する版の実装範囲を各専門ガイドで確認します。永続Jobの再開、可用性Profileと交代経路、用途別セキュリティProfileや運用手順、UIの生成経路などには設計・整備中の項目もあります。標準機構による支援と、対象環境で確認した性能や可用性の水準は分けて記録します。"
