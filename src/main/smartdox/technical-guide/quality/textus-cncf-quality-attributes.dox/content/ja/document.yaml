                  "relations": [],
                  "flows": [
                    "qa-reactive-flow"
                  ]
                },
                "text": "非同期処理では、順序、完了、再試行、重複、データの鮮度を扱う必要があります。Textus/CNCFは、Job／Task、状態機械、Workflow、UoW、イベントと共通の結果表現を接続し、これらを管理する経路を用意します。開発者がモデルと標準機能に沿って実装すると、この経路で処理が実行されるため、スケジューラや進行管理を業務処理ごとに作る必要を減らせます。リアクティブ性の実現に必要な技術的な複雑さを基盤へ委ねる構成です。"
