          {
            "id": "textus-cncf-quality-attributes-purpose",
            "kind": "paragraph",
            "text": "Textus/CNCFは、CMLのモデルとCNCFの標準機能を使う通常の開発から、認可、整合性、リアクティブな実行、観測などの共通機構を利用できるようにしています。本書は、非機能要求と品質属性を起点に、技術の組合せによる効果、基盤と開発者の分担、用途に応じた構成と確認を説明します。",
