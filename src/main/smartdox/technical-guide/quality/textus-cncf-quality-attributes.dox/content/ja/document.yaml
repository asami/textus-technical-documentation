                  "relations": [],
                  "flows": [
                    "qa-requirements-flow"
                  ]
                },
                "text": "機能要求が「何を行うか」を示すのに対し、非機能要求は、その機能をどのような負荷、障害、利用環境、運用条件の下で提供するかを示します。性能、可用性、セキュリティ、変更容易性などの品質属性は、その要求を整理する観点です。非機能要求には費用や配備環境などの制約も含まれ、複数の品質を合わせて満たす構成を選びます。"
              },
              {
                "id": "qa-scenarios",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-requirements"
                  ],
                  "claims": [
                    "qa-scenarios-claim"
                  ],
                  "nodes": [
                    "qa-scenarios-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-requirements-flow"
                  ]
                },
                "text": "「速い」「止まらない」だけでは、必要な構成を選べません。対象の操作、要求や障害の発生源、発生する事象、負荷などの条件、期待する応答、確認する尺度を定めます。例えば長時間処理では、受付までの時間と処理完了までの時間を分け、障害後には、許容する停止時間と失ってよいデータの範囲を分けます。これは品質属性シナリオによる要求の具体化に対応します。参考：SEI Quality Attribute Workshops, Third Edition（https://www.sei.cmu.edu/documents/716/2003_005_001_14249.pdf）。"
