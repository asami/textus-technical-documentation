                "text": "Textus/CNCFは、CMLのモデル、コンポーネントの契約、共通の実行機構を組み合わせ、品質対策を通常の開発と運用の経路へ組み込みます。開発者は業務に必要な条件をモデルと設定へ表し、複雑な実行制御を基盤へ委ねます。標準的な作法で作ることが複数の品質対策の利用につながり、用途に応じた構成と確認によって必要な水準へ調整できることが、このアーキテクチャの効果です。"
