                },
                "text": "CMLは、Entityを基盤とするAggregate・View、状態機械を基盤とするWorkflow、業務規則と公開Operationを定義します。実行可能なモデルはTextusが直接実行し、Cozyは型付きAPIや接続構造を生成します。モデルにある意味と制約をコードや画面ごとに再実装する範囲が減り、業務規則と実行時の操作を対応付けられます。"
              },
              {
                "id": "qa-contracts",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-common-path"
                  ],
                  "claims": [
                    "qa-contracts-claim"
                  ],
                  "nodes": [
                    "qa-contracts-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-common-path-flow"
                  ]
                },
                "text": "CBDは、各コンポーネントの責務と公開契約を定めます。外部との接点をAPIとSPIへ集め、内部のデータ操作や外部作用をUoWの経路へ接続することで、独立した部品を共通の認可・確定・資源管理の下で動かします。部品の独立性だけでなく、その部品をどこで再利用しても同じ実行上の扱いへ接続できることが、品質の維持に寄与します。"
              },
