                  ],
                  "relations": [],
                  "flows": [
                    "qa-operation-flow"
                  ]
                },
                "text": "標準のモデルと機能を使うことは、品質対策を適用する経路を選ぶことでもあります。開発者は業務の意味を定め、基盤は共通の制御を実行します。処理量、可用性、保持期間などの目標に応じて設定と配備を調整し、業務固有の補償や認可を指定します。用途に必要な条件を決めることと、その条件を適用する機構を自前で開発することを分けることで、導入と運用を簡単にします。"
              },
              {
                "id": "qa-tradeoffs",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-operation"
                  ],
                  "claims": [
                    "qa-tradeoffs-claim"
                  ],
                  "nodes": [
                    "qa-tradeoffs-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-operation-flow"
                  ]
                },
                "text": "品質属性は独立には決まりません。メモリ常駐を増やすと取得時間を減らせる一方、メモリ費用と再構築時間に影響します。参照を非同期に更新すると応答性を高めやすい一方、鮮度の条件が必要です。冗長化や強い区画分離は可用性や保護を支えますが、配備と運用の費用を増やします。求める水準に合わせてこれらを組み合わせ、標準機構の再利用で個別実装と確認の負担を抑えます。"
              },
