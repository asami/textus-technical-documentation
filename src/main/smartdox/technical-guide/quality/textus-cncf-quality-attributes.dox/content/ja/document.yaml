                "text": "リアクティブな構成では、メッセージによって処理間の時間的な依存を減らし、負荷の分散、実行数の調整、障害の隔離を組み合わせます。リアクティブ宣言の応答性、耐障害性、弾力性、メッセージ駆動は、この関係を整理した四つの特性です。非同期化に負荷制御と回復を組み合わせることが、性能、可用性、柔軟性への効果につながります。参考：リアクティブ宣言（https://www.reactivemanifesto.org/ja）。"
              },
