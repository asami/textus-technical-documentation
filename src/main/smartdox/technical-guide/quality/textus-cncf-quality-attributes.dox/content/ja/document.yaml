              ],
              "relations": [
                "qa-evolution-relation-1",
                "qa-evolution-relation-2"
              ],
              "flows": [
                "qa-evolution-flow"
              ]
            },
            "blocks": [
              {
                "id": "qa-reuse",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-evolution"
                  ],
                  "claims": [
                    "qa-reuse-claim"
                  ],
                  "nodes": [
                    "qa-reuse-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-evolution-flow"
                  ]
                },
                "text": "機能拡張の柔軟性は、処理能力の拡張とは別の品質です。CMLから得られる型付きAPIとComponent／Service／Operationの契約を利用すると、既存部品を再利用し、必要な接続コードを契約に沿って作れます。外部サービスや保存方式をSPIの実装側へ分けることで、接続先の変更が業務モデルへ及ぶ範囲を抑えます。モデル検査、コンパイル、CARの検査、部品のレビューを組み合わせると、変更した契約と実装の不一致を異なる段階で確認できます。"
              },
              {
                "id": "qa-ui",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-evolution"
                  ],
                  "claims": [
                    "qa-ui-claim"
                  ],
                  "nodes": [
                    "qa-ui-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-evolution-flow"
                  ]
                },
                "text": "Viewは参照結果の意味を、Displayは表示への投影を担い、更新は公開Operationへ戻します。この分担を使って標準Web UIやTextusと連動するFlutterアプリケーションを構成すると、業務規則を共有しながらスマートフォン、タブレット、Web、Desktopへ展開できます。RESTやgRPCで独自UIを接続する構成も、公開契約とサーバー側の保護を共有する考え方です。表示技術を選択できることと、業務操作の一貫性を保つことを両立させます。"
              },
              {
                "id": "qa-usability",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "qa-evolution"
                  ],
                  "claims": [
                    "qa-usability-claim"
                  ],
                  "nodes": [
                    "qa-usability-node"
                  ],
                  "relations": [],
                  "flows": [
                    "qa-evolution-flow"
                  ]
                },
                "text": "使用性には、処理が受け付けられたか、完了したか、入力を直す必要があるかを利用者が理解できることも含まれます。共通の入力検査、Consequence／Conclusion、Jobの進行情報を画面へ対応付けると、状態や失敗の意味を揃えられます。画面寸法、入力手段、アクセシビリティなどの利用条件は、対象のUIで確認します。共通モデルは意味の一貫性を支え、具体的な使いやすさはその意味を利用者へどう提示するかで決まります。"
              }
            ],
            "sections": []
          },
          {
            "id": "qa-operation-section",
            "heading": "標準構成を起点に必要な水準へ調整する",
