                "text": "モデルと型の検査では、規則や接続の不一致を確認します。実行時には、対象の負荷での応答、障害時の確定状態と回復、許可・拒否と監査記録を確認します。相関情報で受付、Operation、Job／Task、UoWの記録をつなぐと、待機、処理、再試行のどこで目標との差が生じたかを調べられます。結果をモデル・設定・配備の調整へ戻し、同じ条件で確認する流れにします。"
