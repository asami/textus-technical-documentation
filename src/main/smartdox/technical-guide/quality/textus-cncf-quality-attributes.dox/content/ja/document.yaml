                "text": "Application tierの伸縮は、Domain tierとDataStoreの容量に合わせます。DomainではWorking SetとViewで取得の負担を減らし、AggregateとUoWで更新を管理します。参照を高速化する場合も、更新の確定とViewへの反映を区別し、必要な鮮度を定めます。処理能力、応答時間、整合性を同じ実行経路の上で調整することが、個別の高速化とは異なるアーキテクチャ上の効果です。"
              }
            ],
            "sections": []
          },
          {
            "id": "qa-protection-section",
            "heading": "保護・整合性・追跡を一つの操作へ適用する",
            "coreRefs": {
              "steps": [
                "qa-protection"
              ],
              "claims": [
                "qa-security-runtime-claim",
                "qa-audit-consistency-claim",
                "qa-policy-claim"
