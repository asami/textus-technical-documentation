          {
            "id": "aguc-7-section",
            "heading": "整合性と更新の原則",
            "coreRefs": {
              "steps": [
                "aguc-7"
              ],
              "claims": [
                "aguc-7-block-1-claim"
              ],
              "nodes": [
                "aguc-7-context-node",
                "aguc-7-content-node"
              ],
              "relations": [
                "aguc-7-relation"
              ],
              "flows": [
                "aguc-7-flow"
              ]
            },
            "blocks": [
              {
                "kind": "list",
                "items": [
                  {
                    "text": "モデル要素のIDは、表示名の変更やビューの切替えで変えない。",
                    "id": "aguc-7-block-1-item-1",
                    "coreRefs": {
                      "steps": [
                        "aguc-7"
                      ],
                      "claims": [
                        "aguc-7-block-1-claim"
                      ],
                      "nodes": [
                        "aguc-7-context-node"
                      ],
                      "relations": [],
                      "flows": [
                        "aguc-7-flow"
                      ]
                    }
                  },
                  {
                    "text": "一覧と詳細は同じアクター・ゴールを参照する。表示用キャッシュを持つ場合も、正本から再生成できるようにする。",
                    "id": "aguc-7-block-1-item-2",
                    "coreRefs": {
                      "steps": [
                        "aguc-7"
                      ],
                      "claims": [
                        "aguc-7-block-1-claim"
                      ],
                      "nodes": [
                        "aguc-7-context-node"
                      ],
                      "relations": [],
                      "flows": [
                        "aguc-7-flow"
                      ]
                    }
                  },
                  {
                    "text": "アクター、ゴール、ユースケースの改名・関連変更は、両ビューへ反映する。要素の削除時には参照切れを確認する。",
                    "id": "aguc-7-block-1-item-3",
                    "coreRefs": {
                      "steps": [
                        "aguc-7"
                      ],
                      "claims": [
                        "aguc-7-block-1-claim"
                      ],
                      "nodes": [
                        "aguc-7-context-node"
                      ],
                      "relations": [],
                      "flows": [
                        "aguc-7-flow"
                      ]
                    }
                  },
                  {
                    "text": "ゴールやユースケースを分割・統合する場合は、対応関係を明示的に更新する。表示名の類似だけで自動的に同一視しない。",
                    "id": "aguc-7-block-1-item-4",
                    "coreRefs": {
                      "steps": [
                        "aguc-7"
                      ],
                      "claims": [
                        "aguc-7-block-1-claim"
                      ],
                      "nodes": [
                        "aguc-7-context-node"
                      ],
                      "relations": [],
                      "flows": [
                        "aguc-7-flow"
                      ]
                    }
                  },
                  {
                    "text": "ビューの切替えでは詳細を失わない。ゴールのないユースケースや、未具体化のゴールを可視化する。",
                    "id": "aguc-7-block-1-item-5",
                    "coreRefs": {
                      "steps": [
                        "aguc-7"
                      ],
                      "claims": [
                        "aguc-7-block-1-claim"
                      ],
                      "nodes": [
                        "aguc-7-context-node"
                      ],
                      "relations": [],
                      "flows": [
                        "aguc-7-flow"
                      ]
                    }
                  },
                  {
                    "text": "ユースケース一覧の存在だけで、品質要求や制約を満たしたことにはしない。それぞれの関連と確認方法を維持する。",
                    "id": "aguc-7-block-1-item-6",
                    "coreRefs": {
                      "steps": [
                        "aguc-7"
                      ],
                      "claims": [
                        "aguc-7-block-1-claim"
                      ],
                      "nodes": [
                        "aguc-7-context-node"
                      ],
                      "relations": [],
                      "flows": [
                        "aguc-7-flow"
                      ]
                    }
                  }
                ],
                "id": "aguc-7-block-1",
                "coreRefs": {
                  "steps": [
                    "aguc-7"
                  ],
                  "claims": [
                    "aguc-7-block-1-claim"
                  ],
                  "nodes": [
                    "aguc-7-context-node"
                  ],
                  "relations": [],
                  "flows": [
                    "aguc-7-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "aguc-7-1-section",
                "heading": "実装・運用で確認したい振る舞い",
                "coreRefs": {
                  "steps": [
                    "aguc-7-1"
                  ],
                  "claims": [
                    "aguc-7-1-block-1-claim"
                  ],
                  "nodes": [
                    "aguc-7-1-context-node",
                    "aguc-7-1-content-node"
                  ],
                  "relations": [
                    "aguc-7-1-relation"
                  ],
                  "flows": [
                    "aguc-7-1-flow"
                  ]
                },
                "blocks": [
                  {
                    "kind": "paragraph",
                    "text": "アクターとゴールだけで一覧を表示できること、詳細化後も同じ行から対応するユースケースへ移動できること、詳細の更新を一覧へ反映できること、未関連要素を検出できることを確認する。モデルアップ後に詳細ビューへ戻っても条件とフローが失われないことも確認する。",
                    "id": "aguc-7-1-block-1",
                    "coreRefs": {
                      "steps": [
                        "aguc-7-1"
                      ],
                      "claims": [
                        "aguc-7-1-block-1-claim"
                      ],
                      "nodes": [
                        "aguc-7-1-context-node"
