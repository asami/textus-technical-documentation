                  ],
                  "relations": [],
                  "flows": [
                    "aguc-1-flow"
                  ]
                }
              },
              {
                "kind": "paragraph",
                "text": "ユースケースの詳細と一覧は、共通の要求モデルを異なる抽象度で表現する。アクター、ゴール、その対応を同じモデル内で管理し、一覧専用の文章と詳細専用の文章を独立した正本として二重管理しない。",
                "id": "aguc-1-block-2",
                "coreRefs": {
                  "steps": [
                    "aguc-1"
                  ],
                  "claims": [
                    "aguc-1-block-2-claim"
