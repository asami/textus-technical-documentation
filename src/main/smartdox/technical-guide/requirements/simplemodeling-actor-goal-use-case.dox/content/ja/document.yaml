              {
                "kind": "paragraph",
                "text": "アクターゴールリストは、ユースケースモデルが持つ「誰が、何を達成したいか」を一覧として表す抽象ビューである。開発の初期に作って捨てる中間成果物ではなく、開発が進んだ後も全体像を確認するために継続して利用する。",
                "id": "aguc-1-block-1",
