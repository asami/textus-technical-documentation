              },
              {
                "kind": "paragraph",
                "text": "本ガイドの中核は、今回合意したこの位置づけと双方向の使い方である。後述する項目名、ID、JSON、関連の多重度は実装設計の提案であり、既存のCML構文・API・実装済み機能を宣言するものではない。",
                "id": "aguc-1-block-3",
