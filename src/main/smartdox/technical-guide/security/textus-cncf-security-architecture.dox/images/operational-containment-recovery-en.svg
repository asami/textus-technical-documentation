<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4d7086"/></marker></defs><rect width="1500" height="840" fill="#f5f8fb"/><g font-family="sans-serif" fill="#163147"><text x="40" y="55" font-size="28" fill="#163147">Connect detection to containment and recovery</text><circle cx="65" cy="150" r="24" fill="#2e6584"/><text x="58" y="158" font-size="23" fill="white">1</text><rect x="108" y="110" width="1040" height="84" rx="9" fill="#e1edf5" stroke="#c3d5e1"/><text x="128" y="142" font-size="24" fill="#163147">Observe / correlate</text><text x="128" y="174" font-size="20" fill="#163147">Operations / actors / authorization / resources</text><text x="760" y="157" font-size="17" fill="#163147">Identify anomalies and affected scope</text><path d="M65 175 V217" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><circle cx="65" cy="262" r="24" fill="#2e6584"/><text x="58" y="270" font-size="23" fill="white">2</text><rect x="108" y="222" width="1040" height="84" rx="9" fill="#e1edf5" stroke="#c3d5e1"/><text x="128" y="254" font-size="24" fill="#163147">Contain impact</text><text x="128" y="286" font-size="20" fill="#163147">Revoke authority / isolate traffic</text><text x="760" y="269" font-size="17" fill="#163147">Limit further damage</text><path d="M65 287 V329" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><circle cx="65" cy="374" r="24" fill="#2e6584"/><text x="58" y="382" font-size="23" fill="white">3</text><rect x="108" y="334" width="1040" height="84" rx="9" fill="#e1edf5" stroke="#c3d5e1"/><text x="128" y="366" font-size="24" fill="#163147">Replace runtime</text><text x="128" y="398" font-size="20" fill="#163147">Prepare from known artifacts</text><text x="760" y="381" font-size="17" fill="#163147">Use HA / rotation mechanisms</text><path d="M65 399 V441" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><circle cx="65" cy="486" r="24" fill="#2e6584"/><text x="58" y="494" font-size="23" fill="white">4</text><rect x="108" y="446" width="1040" height="84" rx="9" fill="#e1edf5" stroke="#c3d5e1"/><text x="128" y="478" font-size="24" fill="#163147">Examine persistent state</text><text x="128" y="510" font-size="20" fill="#163147">Investigate unauthorized updates / disclosure</text><text x="760" y="493" font-size="17" fill="#163147">Perform required business recovery</text><path d="M65 511 V553" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><circle cx="65" cy="598" r="24" fill="#2e6584"/><text x="58" y="606" font-size="23" fill="white">5</text><rect x="108" y="558" width="1040" height="84" rx="9" fill="#e1edf5" stroke="#c3d5e1"/><text x="128" y="590" font-size="24" fill="#163147">Correct and redeploy</text><text x="128" y="622" font-size="20" fill="#163147">Fix underlying vulnerabilities / configuration</text><text x="760" y="605" font-size="17" fill="#163147">Address reinfection paths</text><text x="40" y="798" font-size="20" fill="#163147">Runtime replacement and data recovery are distinct. Containment and investigation may run in parallel.</text></g></svg>
