<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4b7085"/></marker></defs><rect width="1500" height="1080" fill="#f6f8fb"/><g font-family="Hiragino Sans,Arial,sans-serif" fill="#163147"><text x="50" y="55" font-size="32" font-weight="600">Carry Authenticated Subjects to Operation and Data Checks</text><text x="50" y="97" font-size="23" fill="#476476">Evaluate baseline Entity permissions and application rules through shared authorization paths.</text><rect x="50" y="145" width="910" height="112" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="185" font-size="25" fill="#163147">1  Authentication: establish the subject / caller</text><text x="73" y="230" font-size="23" fill="#244658">Authentication result → SecurityContext / SecuritySubject</text><path d="M505 257 V292" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="300" width="910" height="112" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="340" font-size="25" fill="#163147">2  Operation authorization: may processing start?</text><text x="73" y="385" font-size="23" fill="#244658">Check subject, roles, required authority, execution conditions</text><path d="M505 412 V447" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="455" width="910" height="112" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="495" font-size="25" fill="#163147">3  Business processing: execute the admitted Operation</text><text x="73" y="540" font-size="23" fill="#244658">Route data operations through UnitOfWork</text><path d="M505 567 V602" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="610" width="910" height="112" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="650" font-size="25" fill="#163147">4  UnitOfWork authorization: may the target be accessed?</text><text x="73" y="695" font-size="23" fill="#244658">Evaluate user Permission, relationships, and Guards</text><path d="M505 722 V757" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="765" width="910" height="112" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="805" font-size="25" fill="#163147">5  Access authorized target data and resources</text><text x="73" y="850" font-size="23" fill="#244658">Sandbox constrains resource authority and consumption</text><rect x="1050" y="300" width="400" height="150" rx="12" fill="#fff3dd" stroke="#9cb6c6" stroke-width="2" /><text x="1073" y="340" font-size="25" fill="#163147">Operation rules</text><text x="1073" y="385" font-size="23" fill="#244658">Roles, authority, conditions</text><text x="1073" y="420" font-size="23" fill="#244658">CML / metadata</text><path d="M1050 357 H967" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="1050" y="575" width="400" height="250" rx="12" fill="#fff3dd" stroke="#9cb6c6" stroke-width="2" /><text x="1073" y="615" font-size="25" fill="#163147">Entity and application rules</text><text x="1073" y="660" font-size="23" fill="#244658">owner / group / other</text><text x="1073" y="695" font-size="23" fill="#244658">read / write / execute</text><text x="1073" y="730" font-size="23" fill="#244658">Role / relationship grants</text><text x="1073" y="765" font-size="23" fill="#244658">Attribute / state Guards</text><path d="M1050 667 H967" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="930" width="1400" height="105" rx="12" fill="#e7f1ed" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="970" font-size="25" fill="#163147">Decision, execution, and mutation outcomes → audit trails and observability</text><text x="73" y="1015" font-size="23" fill="#244658">Rejected operations do not execute; only allowed paths proceed.</text><path d="M505 877 V923" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/></g></svg>