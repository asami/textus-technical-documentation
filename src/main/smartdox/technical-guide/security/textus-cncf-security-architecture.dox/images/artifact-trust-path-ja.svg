<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4d7086"/></marker></defs><rect width="1500" height="840" fill="#f5f8fb"/><g font-family="sans-serif" fill="#163147"><text x="40" y="55" font-size="30" fill="#163147">内容の検査・配布元の確認・利用先の受入れを分担します</text><text x="57" y="112" font-size="23" fill="#466276">判断する場所</text><text x="442" y="112" font-size="23" fill="#466276">確認すること</text><text x="982" y="112" font-size="23" fill="#466276">次へ渡すもの</text><rect x="45" y="140" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="189" font-size="23" fill="#163147">開発・生成側</text><rect x="430" y="140" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="189" font-size="23" fill="#163147">モデル契約／Lint／設計レビュー</text><rect x="970" y="140" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="189" font-size="23" fill="#163147">検査対象の完成CAR</text><path d="M220 230 V249" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="252" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="301" font-size="23" fill="#163147">提供者・配布経路</text><rect x="430" y="252" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="301" font-size="23" fill="#163147">署名で提供者と内容を対応付ける</text><rect x="970" y="252" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="301" font-size="23" fill="#163147">CAR＋署名・提供者情報</text><path d="M220 342 V361" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="364" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="413" font-size="23" fill="#163147">Component Repository</text><rect x="430" y="364" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="413" font-size="23" fill="#163147">版と内容を対応付けて配布・取得</text><rect x="970" y="364" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="413" font-size="23" fill="#163147">検証対象となる配布物</text><path d="M220 454 V473" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="476" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="525" font-size="23" fill="#163147">利用先のAdmission</text><rect x="430" y="476" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="525" font-size="23" fill="#163147">契約・依存関係・必要権限と配備方針</text><rect x="970" y="476" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="525" font-size="23" fill="#163147">利用先で許可する実行範囲</text><path d="M220 566 V585" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="588" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="637" font-size="23" fill="#163147">Textusの実行時</text><rect x="430" y="588" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="637" font-size="23" fill="#163147">認可とSandboxで制限を適用</text><rect x="970" y="588" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="637" font-size="23" fill="#163147">許可された操作と資源利用</text><text x="40" y="798" font-size="22" fill="#163147">署名は内容検査の代わりにならず、配布済みであることだけでは実行権限を与えません。</text></g></svg>
