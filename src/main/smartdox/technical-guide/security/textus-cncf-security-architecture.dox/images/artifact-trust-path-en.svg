<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4d7086"/></marker></defs><rect width="1500" height="840" fill="#f5f8fb"/><g font-family="sans-serif" fill="#163147"><text x="40" y="55" font-size="28" fill="#163147">Separate content assessment, publisher verification, and admission</text><text x="57" y="112" font-size="23" fill="#466276">Decision boundary</text><text x="442" y="112" font-size="23" fill="#466276">What is checked</text><text x="982" y="112" font-size="23" fill="#466276">What moves forward</text><rect x="45" y="140" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="189" font-size="19" fill="#163147">Development / generation</text><rect x="430" y="140" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="189" font-size="19" fill="#163147">Model contracts / lint / design review</text><rect x="970" y="140" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="189" font-size="19" fill="#163147">Completed CAR under assessment</text><path d="M220 230 V249" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="252" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="301" font-size="19" fill="#163147">Publisher / distribution</text><rect x="430" y="252" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="301" font-size="19" fill="#163147">Bind publisher and content by signature</text><rect x="970" y="252" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="301" font-size="19" fill="#163147">CAR + signature / publisher information</text><path d="M220 342 V361" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="364" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="413" font-size="19" fill="#163147">Component Repository</text><rect x="430" y="364" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="413" font-size="19" fill="#163147">Relate versions and contents for delivery</text><rect x="970" y="364" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="413" font-size="19" fill="#163147">Artifact to verify</text><path d="M220 454 V473" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="476" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="525" font-size="19" fill="#163147">Consumer admission</text><rect x="430" y="476" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="525" font-size="19" fill="#163147">Contracts / dependencies / authority / local policy</text><rect x="970" y="476" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="525" font-size="19" fill="#163147">Authority admitted by the consumer</text><path d="M220 566 V585" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="588" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="637" font-size="19" fill="#163147">Textus execution</text><rect x="430" y="588" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="637" font-size="19" fill="#163147">Enforce authorization and Sandbox restrictions</text><rect x="970" y="588" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="637" font-size="19" fill="#163147">Permitted operations and resources</text><text x="40" y="798" font-size="20" fill="#163147">A signature does not replace assessment; distribution alone does not grant execution authority.</text></g></svg>
