<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526579"/></marker></defs><rect width="1440" height="870" fill="#f5f7fa"/><g font-family="sans-serif" fill="#183047"><text x="45" y="55" font-size="32" fill="#183047">ティアの役割に合わせて、性能とセキュリティを両立する</text><rect x="40" y="85" width="1360" height="64" rx="8" fill="#e2e8ef"/><text x="52" y="124" font-size="22" fill="#183047">共通基盤：Immutable Infrastructure — 既知の構成から生成し、環境ごと交換する</text><rect x="40" y="175" width="660" height="550" rx="14" fill="white" stroke="#cedbe4"/><rect x="720" y="175" width="680" height="550" rx="14" fill="white" stroke="#cedbe4"/><text x="60" y="215" font-size="25" fill="#183047">Applicationティア｜Cloud Function First</text><text x="740" y="215" font-size="25" fill="#183047">Domainティア｜メモリ常駐＋HA</text><text x="60" y="260" font-size="21" fill="#183047">性能：環境の再利用で初期化・応答の負担を抑える</text><text x="740" y="260" font-size="21" fill="#183047">性能：メモリ上のデータと計算を継続活用する</text><rect x="60" y="305" width="170" height="48" rx="8" fill="#dcecf5"/><text x="72" y="336" font-size="20" fill="#183047">環境Aを生成</text><path d="M230 329 L260 329" stroke="#526579" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="265" y="305" width="120" height="48" rx="8" fill="#dcecf5"/><text x="277" y="336" font-size="20" fill="#183047">要求1</text><rect x="395" y="305" width="120" height="48" rx="8" fill="#dcecf5"/><text x="407" y="336" font-size="20" fill="#183047">要求2</text><rect x="525" y="305" width="120" height="48" rx="8" fill="#dcecf5"/><text x="537" y="336" font-size="20" fill="#183047">要求3</text><path d="M265 366 L645 366" stroke="#247ca0" stroke-width="3"/><text x="280" y="398" font-size="20" fill="#183047">同じ実行環境を再利用</text><path d="M645 329 L667 329" stroke="#526579" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M667 329 L667 435" stroke="#526579" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M667 435 L630 435" stroke="#526579" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="455" y="411" width="180" height="48" rx="8" fill="#ece9e6"/><text x="467" y="442" font-size="20" fill="#183047">環境Aを廃棄</text><rect x="60" y="460" width="170" height="48" rx="8" fill="#dcecf5"/><text x="72" y="491" font-size="20" fill="#183047">環境Bを生成</text><path d="M230 484 L260 484" stroke="#526579" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="265" y="460" width="170" height="48" rx="8" fill="#dcecf5"/><text x="277" y="491" font-size="20" fill="#183047">後続の要求</text><text x="60" y="560" font-size="21" fill="#183047">セキュリティ：状態を隔離し、短命性を活かす</text><text x="60" y="610" font-size="22" fill="#183047">要求終了 ≠ 環境の即時廃棄</text><text x="60" y="647" font-size="19" fill="#183047">寿命と効果は実行基盤の管理方針に依存</text><text x="740" y="306" font-size="19" fill="#183047">旧Active</text><rect x="740" y="325" width="345" height="55" rx="8" fill="#dcecf5"/><text x="752" y="359.5" font-size="20" fill="#183047">更新処理を継続</text><path d="M1085 352 L1110 352" stroke="#526579" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1115" y="325" width="115" height="55" rx="8" fill="#eee9e2"/><text x="1127" y="359.5" font-size="20" fill="#183047">Drain</text><path d="M1230 352 L1250 352" stroke="#526579" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1255" y="325" width="120" height="55" rx="8" fill="#eee9e2"/><text x="1267" y="359.5" font-size="20" fill="#183047">廃棄</text><text x="740" y="423" font-size="19" fill="#183047">新Runtime</text><rect x="740" y="440" width="165" height="55" rx="8" fill="#dcefe7"/><text x="752" y="474.5" font-size="18" fill="#183047">生成・受入れ</text><path d="M905 467 L925 467" stroke="#526579" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="930" y="440" width="270" height="55" rx="8" fill="#dcefe7"/><text x="942" y="474.5" font-size="18" fill="#183047">Standby：準備・読取り</text><path d="M1200 467 L1220 467" stroke="#526579" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1225" y="440" width="150" height="55" rx="8" fill="#bee3d2"/><text x="1237" y="474.5" font-size="19" fill="#183047">新Active</text><path d="M1210 437 L1210 390" stroke="#526579" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="1218" y="416" font-size="17" fill="#183047">昇格</text><text x="740" y="535" font-size="20" fill="#183047">旧Activeの稼働中に交換先を準備</text><text x="740" y="580" font-size="20" fill="#183047">セキュリティ：定期交代で侵害状態の継続を抑える</text><text x="740" y="625" font-size="20" fill="#183047">頻繁な廃棄によるウォームアップを避ける</text><text x="740" y="662" font-size="20" fill="#183047">読取りで準備状態を確認してから役割を切り替える</text><text x="45" y="780" font-size="25" fill="#183047">寿命を一律に短くせず、各ティアの性能要件に合わせて再利用と交換を設計する</text><text x="45" y="824" font-size="21" fill="#183047">永続データのアクセス制御・資格情報の失効・脆弱性修正を併用</text></g></svg>
