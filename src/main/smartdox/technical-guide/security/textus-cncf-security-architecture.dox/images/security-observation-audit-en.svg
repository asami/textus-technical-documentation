<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4b7085"/></marker></defs><rect width="1500" height="1060" fill="#f6f8fb"/><g font-family="Hiragino Sans,Arial,sans-serif" fill="#163147"><text x="50" y="55" font-size="32" font-weight="600">From Security Controls to Observation, Audit, and Response</text><text x="50" y="97" font-size="23" fill="#476476">Correlate through shared execution context; use records for diagnosis and audit.</text><rect x="280" y="140" width="940" height="145" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="303" y="180" font-size="25" fill="#163147">Shared execution: Operation → UnitOfWork → data operations</text><text x="303" y="225" font-size="23" fill="#244658">Record subjects, Components, targets, and decision outcomes</text><text x="303" y="260" font-size="23" fill="#244658">Relate execution using traceId / correlationId</text><path d="M510 285 V312 H375 V335" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><path d="M990 285 V312 H1125 V335" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="340" width="650" height="215" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="380" font-size="25" fill="#163147">Observability information</text><text x="73" y="425" font-size="23" fill="#244658">Logs, traces, and metrics</text><text x="73" y="460" font-size="23" fill="#244658">Collected through the ordinary OTLP path</text><text x="73" y="495" font-size="23" fill="#244658">Describe behavior, performance, anomalies</text><rect x="800" y="340" width="650" height="215" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="823" y="380" font-size="25" fill="#163147">Facts used for auditing</text><text x="823" y="425" font-size="23" fill="#244658">Events / audit records: operations and outcomes</text><text x="823" y="460" font-size="23" fill="#244658">Entity metadata: creation / update attribution</text><text x="823" y="495" font-size="23" fill="#244658">Automatically recorded on shared paths</text><path d="M700 445 H795" fill="none" stroke="#4b7085" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="710" y="420" font-size="19" fill="#244658">Link</text><path d="M375 555 V620" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><path d="M1125 555 V620" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="625" width="650" height="150" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="665" font-size="25" fill="#163147">Diagnosis and anomaly detection</text><text x="73" y="710" font-size="23" fill="#244658">Inspect behavior through tools such as Control Center</text><text x="73" y="745" font-size="23" fill="#244658">Locate anomalies and investigate impact</text><rect x="800" y="625" width="650" height="150" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="823" y="665" font-size="25" fill="#163147">Auditing and operation-history review</text><text x="823" y="710" font-size="23" fill="#244658">Who acted, when, on what target, and how</text><text x="823" y="745" font-size="23" fill="#244658">Examine authority use and allowed / denied outcomes</text><path d="M375 775 V815 H590 V850" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><path d="M1125 775 V815 H910 V850" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="280" y="855" width="940" height="125" rx="12" fill="#e7f1ed" stroke="#9cb6c6" stroke-width="2" /><text x="303" y="895" font-size="25" fill="#163147">Impact investigation → revoke / isolate → replace / recover</text><text x="303" y="940" font-size="23" fill="#244658">Select responses using Component authority, dependencies, and deployment</text><text x="55" y="1020" font-size="21" fill="#244658">Set retention and read permissions by purpose; do not copy credentials or unnecessary personal data.</text></g></svg>