<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4b7085"/></marker></defs><rect width="1500" height="900" fill="#f6f8fb"/><g font-family="Hiragino Sans,Arial,sans-serif" fill="#163147"><text x="50" y="55" font-size="32" font-weight="600">From Standard Operation to Application-Specific Security</text><text x="50" y="97" font-size="23" fill="#476476">Apply baseline protection through shared paths; select rules and deployment controls.</text><rect x="50" y="155" width="430" height="265" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="195" font-size="25" fill="#163147">1  CML and standard paths</text><text x="73" y="240" font-size="23" fill="#244658">Models and basic settings</text><text x="73" y="275" font-size="23" fill="#244658">Authenticated-subject propagation</text><text x="73" y="310" font-size="23" fill="#244658">Shared Operation / Entity checks</text><text x="73" y="345" font-size="23" fill="#244658">Automatic audit / observation</text><rect x="535" y="155" width="430" height="265" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="558" y="195" font-size="25" fill="#163147">2  Business authorization</text><text x="558" y="240" font-size="23" fill="#244658">Build on owner / group / other</text><text x="558" y="275" font-size="23" fill="#244658">Add roles, relations, state</text><text x="558" y="310" font-size="23" fill="#244658">Scope targets, actions, conditions</text><text x="558" y="345" font-size="23" fill="#244658">Evaluate through shared paths</text><rect x="1020" y="155" width="430" height="265" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="1043" y="195" font-size="25" fill="#163147">3  Deployment and operation</text><text x="1043" y="240" font-size="23" fill="#244658">Limit capabilities for the use case</text><text x="1043" y="275" font-size="23" fill="#244658">Isolate compartments / endpoints</text><text x="1043" y="310" font-size="23" fill="#244658">Configure auditing and recovery</text><text x="1043" y="345" font-size="23" fill="#244658">Balance protection and workload</text><path d="M480 285 H530" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><path d="M965 285 H1015" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><text x="55" y="477" font-size="24" fill="#244658">Shared foundation: CBD boundaries, authentication / authorization, resource controls, audit / observability</text><rect x="50" y="525" width="1400" height="300" rx="14" fill="#fff8e9" stroke="#c9aa67" stroke-width="2" stroke-dasharray="10 7"/><text x="75" y="568" font-size="26" fill="#244658">Planned guidance: three provisions for selection and configuration</text><rect x="75" y="605" width="420" height="175" rx="12" fill="#ffffff" stroke="#9cb6c6" stroke-width="2" /><text x="98" y="645" font-size="25" fill="#163147">Operation patterns</text><text x="98" y="690" font-size="23" fill="#244658">Use cases, assets, configurations</text><text x="98" y="725" font-size="23" fill="#244658">Effects and operational burden</text><rect x="540" y="605" width="420" height="175" rx="12" fill="#ffffff" stroke="#9cb6c6" stroke-width="2" /><text x="563" y="645" font-size="25" fill="#163147">Profiles</text><text x="563" y="690" font-size="23" fill="#244658">Bundle the required settings</text><text x="563" y="725" font-size="23" fill="#244658">Apply coherently with few choices</text><rect x="1005" y="605" width="420" height="175" rx="12" fill="#ffffff" stroke="#9cb6c6" stroke-width="2" /><text x="1028" y="645" font-size="25" fill="#163147">Design / operation guides</text><text x="1028" y="690" font-size="23" fill="#244658">Business settings, checks, audits</text><text x="1028" y="725" font-size="23" fill="#244658">Revocation and recovery</text></g></svg>