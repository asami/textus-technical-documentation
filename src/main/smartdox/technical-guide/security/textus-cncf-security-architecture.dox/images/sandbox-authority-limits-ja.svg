<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="728" viewBox="0 0 1500 728"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4d7086"/></marker></defs><rect width="1500" height="728" fill="#f5f8fb"/><g font-family="sans-serif" fill="#163147"><text x="40" y="55" font-size="30" fill="#163147">「何を使えるか」と「どこまで使えるか」を分けて制御します</text><text x="57" y="112" font-size="23" fill="#466276">制御の軸</text><text x="442" y="112" font-size="23" fill="#466276">与える情報・判定</text><text x="982" y="112" font-size="23" fill="#466276">対象となる作用</text><rect x="45" y="140" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="189" font-size="23" fill="#163147">主体と業務権限</text><rect x="430" y="140" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="189" font-size="23" fill="#163147">SecuritySubject／Operation・Entity認可</text><rect x="970" y="140" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="189" font-size="23" fill="#163147">誰が、どの操作・対象を扱うか</text><path d="M220 230 V249" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="252" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="301" font-size="23" fill="#163147">資源への権限</text><rect x="430" y="252" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="301" font-size="23" fill="#163147">Capability／Sandboxの許可範囲</text><rect x="970" y="252" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="301" font-size="23" fill="#163147">ネットワーク・ファイル・プロセス等</text><path d="M220 342 V361" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="364" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="413" font-size="23" fill="#163147">資源の消費量</text><rect x="430" y="364" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="413" font-size="23" fill="#163147">ExecutionLimits</text><rect x="970" y="364" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="413" font-size="23" fill="#163147">時間・メモリ等の消費上限</text><path d="M220 454 V473" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="476" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="525" font-size="23" fill="#163147">共通の実行文脈</text><rect x="430" y="476" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="525" font-size="23" fill="#163147">ExecutionContext</text><rect x="970" y="476" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="525" font-size="23" fill="#163147">主体・権限・制限・観測情報を接続</text><text x="40" y="686" font-size="22" fill="#163147">AIへの指示だけに頼らず、実行基盤が資源アクセスと消費量を制限します。</text></g></svg>
