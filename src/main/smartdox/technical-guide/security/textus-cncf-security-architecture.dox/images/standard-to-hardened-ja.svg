<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4b7085"/></marker></defs><rect width="1500" height="900" fill="#f6f8fb"/><g font-family="Hiragino Sans,Arial,sans-serif" fill="#163147"><text x="50" y="55" font-size="32" font-weight="600">標準運用から用途別のセキュリティ構成へ</text><text x="50" y="97" font-size="23" fill="#476476">基本の保護を共通基盤から適用し、必要な規則と構成を選ぶ</text><rect x="50" y="155" width="430" height="265" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="195" font-size="25" fill="#163147">1  CMLと標準経路</text><text x="73" y="240" font-size="23" fill="#244658">モデルと基本設定</text><text x="73" y="275" font-size="23" fill="#244658">認証された主体の受渡し</text><text x="73" y="310" font-size="23" fill="#244658">Operation・Entityの共通判定</text><text x="73" y="345" font-size="23" fill="#244658">監査・観測の自動記録</text><rect x="535" y="155" width="430" height="265" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="558" y="195" font-size="25" fill="#163147">2  業務固有の認可</text><text x="558" y="240" font-size="23" fill="#244658">owner / group / other を基本に</text><text x="558" y="275" font-size="23" fill="#244658">役割・関係・属性・状態を指定</text><text x="558" y="310" font-size="23" fill="#244658">対象・操作・条件を絞る</text><text x="558" y="345" font-size="23" fill="#244658">同じ判定経路で評価</text><rect x="1020" y="155" width="430" height="265" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="1043" y="195" font-size="25" fill="#163147">3  配備・運用の強化</text><text x="1043" y="240" font-size="23" fill="#244658">用途に応じた機能制限</text><text x="1043" y="275" font-size="23" fill="#244658">区画分離と接続先の限定</text><text x="1043" y="310" font-size="23" fill="#244658">監査・復旧の構成</text><text x="1043" y="345" font-size="23" fill="#244658">効果と運用負担を合わせて選択</text><path d="M480 285 H530" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><path d="M965 285 H1015" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><text x="55" y="477" font-size="24" fill="#244658">共通の土台：CBDの境界、認証・認可、資源制御、監査・可観測性</text><rect x="50" y="525" width="1400" height="300" rx="14" fill="#fff8e9" stroke="#c9aa67" stroke-width="2" stroke-dasharray="10 7"/><text x="75" y="568" font-size="26" fill="#244658">今後の整備方針：選択と設定を支える三つの提供物</text><rect x="75" y="605" width="420" height="175" rx="12" fill="#ffffff" stroke="#9cb6c6" stroke-width="2" /><text x="98" y="645" font-size="25" fill="#163147">運用パターン</text><text x="98" y="690" font-size="23" fill="#244658">用途・保護対象・構成</text><text x="98" y="725" font-size="23" fill="#244658">効果と運用負担</text><rect x="540" y="605" width="420" height="175" rx="12" fill="#ffffff" stroke="#9cb6c6" stroke-width="2" /><text x="563" y="645" font-size="25" fill="#163147">プロファイル</text><text x="563" y="690" font-size="23" fill="#244658">必要な設定を一組にする</text><text x="563" y="725" font-size="23" fill="#244658">少ない選択で一貫して適用</text><rect x="1005" y="605" width="420" height="175" rx="12" fill="#ffffff" stroke="#9cb6c6" stroke-width="2" /><text x="1028" y="645" font-size="25" fill="#163147">設計・運用手順書</text><text x="1028" y="690" font-size="23" fill="#244658">業務設定・動作確認・監査</text><text x="1028" y="725" font-size="23" fill="#244658">失効・復旧まで案内</text></g></svg>