<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="728" viewBox="0 0 1500 728"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4d7086"/></marker></defs><rect width="1500" height="728" fill="#f5f8fb"/><g font-family="sans-serif" fill="#163147"><text x="40" y="55" font-size="28" fill="#163147">Separate what execution may use from how much it may consume</text><text x="57" y="112" font-size="23" fill="#466276">Control dimension</text><text x="442" y="112" font-size="23" fill="#466276">Decision / supplied information</text><text x="982" y="112" font-size="23" fill="#466276">Controlled effect</text><rect x="45" y="140" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="189" font-size="19" fill="#163147">Identity and business authority</text><rect x="430" y="140" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="189" font-size="19" fill="#163147">SecuritySubject / operation and entity checks</text><rect x="970" y="140" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="189" font-size="19" fill="#163147">Who may act on which target</text><path d="M220 230 V249" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="252" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="301" font-size="19" fill="#163147">Resource authority</text><rect x="430" y="252" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="301" font-size="19" fill="#163147">Capabilities / Sandbox permissions</text><rect x="970" y="252" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="301" font-size="19" fill="#163147">Network / filesystem / process access</text><path d="M220 342 V361" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="364" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="413" font-size="19" fill="#163147">Resource consumption</text><rect x="430" y="364" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="413" font-size="19" fill="#163147">ExecutionLimits</text><rect x="970" y="364" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="413" font-size="19" fill="#163147">Time / memory and other resource bounds</text><path d="M220 454 V473" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="476" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="525" font-size="19" fill="#163147">Shared execution context</text><rect x="430" y="476" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="525" font-size="19" fill="#163147">ExecutionContext</text><rect x="970" y="476" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="525" font-size="19" fill="#163147">Connect subject, authority, limits, observations</text><text x="40" y="686" font-size="20" fill="#163147">Runtime controls enforce resource access and limits rather than relying on AI instructions alone.</text></g></svg>
