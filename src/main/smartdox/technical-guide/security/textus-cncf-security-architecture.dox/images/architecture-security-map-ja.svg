<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4d7086"/></marker></defs><rect width="1500" height="840" fill="#f5f8fb"/><g font-family="sans-serif" fill="#163147"><text x="40" y="55" font-size="30" fill="#163147">全体アーキテクチャと保護の適用点</text><text x="57" y="112" font-size="23" fill="#466276">段階・担当</text><text x="442" y="112" font-size="23" fill="#466276">次へ引き継ぐ内容</text><text x="982" y="112" font-size="23" fill="#466276">セキュリティの役割</text><rect x="45" y="140" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="189" font-size="23" fill="#163147">文芸モデル・用語集・BoK</text><rect x="430" y="140" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="189" font-size="23" fill="#163147">要求／業務の意味／判断理由</text><rect x="970" y="140" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="189" font-size="23" fill="#163147">守る対象と規則を共有</text><path d="M220 230 V249" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="252" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="301" font-size="23" fill="#163147">CML：業務モデル</text><rect x="430" y="252" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="301" font-size="23" fill="#163147">構造／振る舞い／制約</text><rect x="970" y="252" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="301" font-size="23" fill="#163147">入力・操作・権限を明示</text><path d="M220 342 V361" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="364" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="413" font-size="23" fill="#163147">Cozy：生成と構成</text><rect x="430" y="364" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="413" font-size="23" fill="#163147">実装／契約／SAR・CAR</text><rect x="970" y="364" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="413" font-size="23" fill="#163147">規則を生成物へ反映</text><path d="M220 454 V473" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="476" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="525" font-size="23" fill="#163147">Textus：配備と実行</text><rect x="430" y="476" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="525" font-size="23" fill="#163147">業務処理／データアクセス</text><rect x="970" y="476" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="525" font-size="23" fill="#163147">受入れ・認可・資源制御</text><path d="M220 566 V585" stroke="#4d7086" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="588" width="370" height="88" rx="8" fill="#dce9f1"/><text x="59" y="637" font-size="23" fill="#163147">運用とフィードバック</text><rect x="430" y="588" width="525" height="88" rx="8" fill="#ffffff"/><text x="444" y="637" font-size="23" fill="#163147">観測結果／修正／再配備</text><rect x="970" y="588" width="485" height="88" rx="8" fill="#e0efe6"/><text x="984" y="637" font-size="23" fill="#163147">隔離・失効・交換・復旧</text><text x="40" y="798" font-size="22" fill="#163147">実行で得た情報は、モデルの修正と運用の見直しへ戻します。</text></g></svg>
