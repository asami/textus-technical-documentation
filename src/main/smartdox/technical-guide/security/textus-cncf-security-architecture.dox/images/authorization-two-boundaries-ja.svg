<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4b7085"/></marker></defs><rect width="1500" height="1080" fill="#f6f8fb"/><g font-family="Hiragino Sans,Arial,sans-serif" fill="#163147"><text x="50" y="55" font-size="32" font-weight="600">認証した主体を、操作と対象データの判定へ引き継ぐ</text><text x="50" y="97" font-size="23" fill="#476476">Entityの基本権限と用途別の規則を、共通の認可経路で評価する</text><rect x="50" y="145" width="910" height="112" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="185" font-size="25" fill="#163147">1  認証：本人・呼出し元を確認</text><text x="73" y="230" font-size="23" fill="#244658">認証結果 → SecurityContext / SecuritySubject</text><path d="M505 257 V292" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="300" width="910" height="112" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="340" font-size="25" fill="#163147">2  Operation認可：処理を開始できるか</text><text x="73" y="385" font-size="23" fill="#244658">主体・役割・必要権限・実行条件を確認</text><path d="M505 412 V447" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="455" width="910" height="112" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="495" font-size="25" fill="#163147">3  業務処理：許可されたOperationを実行</text><text x="73" y="540" font-size="23" fill="#244658">データ操作はUnitOfWorkを通す</text><path d="M505 567 V602" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="610" width="910" height="112" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="650" font-size="25" fill="#163147">4  UnitOfWork認可：対象へアクセスできるか</text><text x="73" y="695" font-size="23" fill="#244658">利用者のPermission・関係・Guardを評価</text><path d="M505 722 V757" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="765" width="910" height="112" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="805" font-size="25" fill="#163147">5  認可された対象データ・資源へアクセス</text><text x="73" y="850" font-size="23" fill="#244658">Sandboxが資源への権限と消費量を制御</text><rect x="1050" y="300" width="400" height="150" rx="12" fill="#fff3dd" stroke="#9cb6c6" stroke-width="2" /><text x="1073" y="340" font-size="25" fill="#163147">Operationの規則</text><text x="1073" y="385" font-size="23" fill="#244658">役割・権限・実行条件</text><text x="1073" y="420" font-size="23" fill="#244658">CML / メタデータ</text><path d="M1050 357 H967" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="1050" y="575" width="400" height="250" rx="12" fill="#fff3dd" stroke="#9cb6c6" stroke-width="2" /><text x="1073" y="615" font-size="25" fill="#163147">Entityと用途別の規則</text><text x="1073" y="660" font-size="23" fill="#244658">owner / group / other</text><text x="1073" y="695" font-size="23" fill="#244658">read / write / execute</text><text x="1073" y="730" font-size="23" fill="#244658">役割・関係からの権限</text><text x="1073" y="765" font-size="23" fill="#244658">属性・状態のGuard</text><path d="M1050 667 H967" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="930" width="1400" height="105" rx="12" fill="#e7f1ed" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="970" font-size="25" fill="#163147">判定・実行・更新の結果 → 監査証跡と可観測性</text><text x="73" y="1015" font-size="23" fill="#244658">拒否された操作は実行しない。許可された経路だけが次へ進む。</text><path d="M505 877 V923" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/></g></svg>