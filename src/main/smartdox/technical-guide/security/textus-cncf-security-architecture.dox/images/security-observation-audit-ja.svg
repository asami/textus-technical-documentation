<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4b7085"/></marker></defs><rect width="1500" height="1060" fill="#f6f8fb"/><g font-family="Hiragino Sans,Arial,sans-serif" fill="#163147"><text x="50" y="55" font-size="32" font-weight="600">セキュリティ制御から観測・監査・対応へ</text><text x="50" y="97" font-size="23" fill="#476476">共通の実行文脈で関連付け、診断と監査の目的に応じて利用する</text><rect x="280" y="140" width="940" height="145" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="303" y="180" font-size="25" fill="#163147">共通の実行経路：Operation → UnitOfWork → データ操作</text><text x="303" y="225" font-size="23" fill="#244658">主体・Component・対象・判定結果を記録</text><text x="303" y="260" font-size="23" fill="#244658">traceId / correlationId で実行を関連付け</text><path d="M510 285 V312 H375 V335" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><path d="M990 285 V312 H1125 V335" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="340" width="650" height="215" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="380" font-size="25" fill="#163147">可観測性の情報</text><text x="73" y="425" font-size="23" fill="#244658">ログ・トレース・メトリクス</text><text x="73" y="460" font-size="23" fill="#244658">通常のOTLP経路へ収集</text><text x="73" y="495" font-size="23" fill="#244658">実行の経過・性能・異常を表す</text><rect x="800" y="340" width="650" height="215" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="823" y="380" font-size="25" fill="#163147">監査に用いる事実</text><text x="823" y="425" font-size="23" fill="#244658">Event・監査記録：操作と結果の履歴</text><text x="823" y="460" font-size="23" fill="#244658">Entityメタデータ：作成・更新の帰属</text><text x="823" y="495" font-size="23" fill="#244658">共通処理点と更新経路で自動記録</text><path d="M700 445 H795" fill="none" stroke="#4b7085" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="710" y="420" font-size="19" fill="#244658">関連付け</text><path d="M375 555 V620" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><path d="M1125 555 V620" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="50" y="625" width="650" height="150" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="73" y="665" font-size="25" fill="#163147">診断・異常検出</text><text x="73" y="710" font-size="23" fill="#244658">Control Center等で処理の経過を確認</text><text x="73" y="745" font-size="23" fill="#244658">異常の発生箇所と影響を調べる</text><rect x="800" y="625" width="650" height="150" rx="12" fill="#e6eff5" stroke="#9cb6c6" stroke-width="2" /><text x="823" y="665" font-size="25" fill="#163147">監査・操作履歴の確認</text><text x="823" y="710" font-size="23" fill="#244658">誰が・いつ・何に・何をしたか</text><text x="823" y="745" font-size="23" fill="#244658">権限行使と許可・拒否の結果を確認</text><path d="M375 775 V815 H590 V850" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><path d="M1125 775 V815 H910 V850" fill="none" stroke="#4b7085" stroke-width="3"  marker-end="url(#a)"/><rect x="280" y="855" width="940" height="125" rx="12" fill="#e7f1ed" stroke="#9cb6c6" stroke-width="2" /><text x="303" y="895" font-size="25" fill="#163147">影響調査 → 権限失効・隔離 → 環境交換・業務復旧</text><text x="303" y="940" font-size="23" fill="#244658">Componentの権限・依存関係・配備構成と照合して対応を選ぶ</text><text x="55" y="1020" font-size="21" fill="#244658">保存期間・閲覧権限は用途別に設定。認証情報や不要な個人情報を記録へ複製しない。</text></g></svg>