                    "text": "受入れ済みの不変のCARと配備構成から実行環境を再構築できると、問題のある環境を隔離し、既知の構成へ交換できます。交換対象は配備単位で決まり、そこに含まれるComponentと依存先を確認します。"
                  },
                  {
                    "id": "immutable-runtime-block-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-1"
                      ],
                      "nodes": [
                        "immutable-runtime-explanation-node-1"
                      ],
                      "relations": [
                        "immutable-runtime-explanation-relation-1",
                        "immutable-runtime-explanation-relation-2"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "Domainティアは、Primaryが新規更新を受け付け、Read Replicaが許可された参照を提供する構成を取ります。StandbyはPrimaryへの昇格準備が整った性質であり、参照提供とは分けて確認します。準備済みの交換先を持つことで、メモリ常駐による応答性と環境の交換可能性を両立させる設計です。"
                  },
                  {
                    "id": "immutable-runtime-cooperation-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-cooperation-2"
                      ],
                      "nodes": [
                        "immutable-runtime-explanation-node-3"
                      ],
                      "relations": [
                        "immutable-runtime-explanation-relation-2",
                        "immutable-runtime-relation-lifetime-control"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "メモリ常駐の性能を活かしながら交換可能性を確保するため、待機系の準備と交代を組み合わせます。具体的な昇格・ドレインの手順は次節で説明します。"
                  },
                  {
                    "id": "immutable-runtime-lifetime-control",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-lifetime-control"
                      ],
                      "nodes": [
                        "immutable-runtime-node-lifetime-control"
                      ],
                      "relations": [
                        "immutable-runtime-relation-lifetime-control",
                        "immutable-runtime-relation-lifecycle-concepts"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "モデルとティア分割で機能・権限・到達経路を限定し、不変の成果物から実行環境を再構築できるようにします。環境交換は、問題のある実行環境を隔離して既知の構成へ戻す手段です。"
                  },
                  {
                    "id": "immutable-runtime-lifecycle-concepts",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-lifecycle-concepts"
                      ],
                      "nodes": [
                        "immutable-runtime-node-lifecycle-concepts"
                      ],
                      "relations": [
                        "immutable-runtime-relation-lifecycle-concepts",
                        "immutable-runtime-relation-persistence-boundaries"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "実行環境の変更方法と寿命は別の設計軸です。Mutableは稼働中の環境を更新し、Immutableは変更せず置換します。Ephemeralは寿命を短く管理する性質で、Immutableと組み合わせられます。Cloud Functionの短命性も、実行基盤の再利用・廃棄方針に応じて扱います。"
                  },
                  {
                    "id": "immutable-runtime-persistence-boundaries",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-persistence-boundaries"
                      ],
                      "nodes": [
                        "immutable-runtime-node-persistence-boundaries"
                      ],
                      "relations": [
                        "immutable-runtime-relation-persistence-boundaries",
                        "immutable-runtime-relation-replacement-limits"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "CNCFはメモリを高速化に使い、業務の継続に必要な状態を特定プロセスのメモリだけに残さない構造を意図しています。更新はDomainの規則とUnitOfWorkを通して正本へ確定し、キャッシュやViewはその結果から再構築できるようにします。実行環境の交換で確定データを失わないことは、保存先の永続化契約と回復手順を含めて確認します。途中の計算や結果不明の処理は、確定済みデータと区別します。"
                  },
                  {
                    "id": "immutable-runtime-replacement-limits",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
