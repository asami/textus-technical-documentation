                          "relations": [
                            "tiers-depends-on-tiers-explanation-node-2"
                          ],
                          "flows": [
                            "tiers-flow"
                          ]
                        },
                        "text": "Domain tierは、Applicationから渡された認証状態と呼出し元を検証・解決し、自分の規則で操作を認可します。Operationの呼出し可否に加え、UnitOfWorkで対象Entityへのアクセスを判定し、業務規則と状態遷移の条件を適用します。さらにSandboxで利用できる資源と消費量を制限します。Applicationからの呼出しであることや、Domain内部の処理であることだけでは、無制限の権限を与えません。"
                      },
                      {
                        "id": "tiers-layered-protection",
                        "kind": "paragraph",
                        "text": "ティア間では責務・権限・到達経路を限定し、Domain内部では共通機構によって操作・対象データ・資源の規則を適用します。要求が外部から内部へ進んでも、許可範囲は無条件に広がりません。Presentationの技術選択、ApplicationのCloud Function Firstと機能・権限の限定、Domain内部の制御を組み合わせることで、システム全体のセキュリティ強度を支えます。",
