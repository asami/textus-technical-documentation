                  {
                    "id": "cml-cozy-execution-paragraph-2",
                    "kind": "paragraph",
                    "text": "モデルで定めた操作・状態・制約を実行へ引き継ぐことで、業務の概念を実装ごとに書き直す箇所を減らします。補完実装にも同じ契約と権限の境界を適用します。",
