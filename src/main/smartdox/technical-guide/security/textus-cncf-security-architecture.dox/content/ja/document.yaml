                "textus-cncf-security-architecture-relation-rationale-4"
              ],
              "flows": [
                "textus-cncf-security-architecture-flow"
              ]
            },
            "text": "通常の開発・運用で利用する基本機構と、用途別の認可、配備・運用上の強化を分けて説明します。今後整備する運用パターン、プロファイル、手順書は、それらを少ない設定で組み合わせるための方針です。"
          },
          {
            "id": "textus-cncf-security-architecture-foundation",
            "kind": "paragraph",
            "text": "SimpleModelingは、業務知識をモデルとして捉え、動くソフトウェアへつなげる技術体系です。CMLでモデルを記述し、Cozyで実装やコンポーネントを自動生成し、Textus上で動作させます。文芸モデルと知識処理、モデル駆動、コンポーネント指向、クラウド・ネイティブを組み合わせて、開発と運用を支えます。",
