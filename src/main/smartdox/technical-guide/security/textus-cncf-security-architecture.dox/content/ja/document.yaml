                      ]
                    }
                  },
                  {
                    "id": "component-repository-expanded-3",
                    "kind": "paragraph",
                    "text": "利用者は、出所が確認でき、所定のCAR lint・CBD Reviewを経た版を選択できます。チェックサムは取得時の破損検出、署名は配布元と内容の確認、lintとReviewは内容の検査を担当します。この分担をRepositoryで管理することで、利用者が個々の部品の検証状況を調べ、再利用の判断へつなげられます。",
                    "coreRefs": {
