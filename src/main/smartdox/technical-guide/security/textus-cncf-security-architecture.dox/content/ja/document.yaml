                    "text": "コンポーネント指向開発（CBD）は、SimpleModelingの根幹をなす開発方式です。責務の分離、部品の再利用と組合せ、変更の局所化、独立した検査や交換など、ソフトウェアの開発と運用に幅広い利点をもたらします。セキュリティも、こうしたCBDの特性が有効に働く領域の一つです。"
