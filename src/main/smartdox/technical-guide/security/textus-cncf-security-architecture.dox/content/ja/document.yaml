                    "text": "CBDが区画と接点を定め、モデルと検査がその契約・必要権限を確認します。実行時には区画を越える呼出しを認可し、区画内部でも対象データと資源利用を制御します。「区画を作る構造」「区画を越える際の制御」「区画内部での制御」を共通機構で結び付けることで、独立性を保ちながら確認漏れと影響範囲を抑えます。この関係は、後述するティアごとの役割分担にも適用します。"
