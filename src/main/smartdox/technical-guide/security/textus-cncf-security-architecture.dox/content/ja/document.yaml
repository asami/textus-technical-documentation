                "blocks": [
                  {
                    "id": "textus-overview-paragraph-1",
                    "kind": "paragraph",
                    "text": "Textusは、SimpleModelingで開発するアプリケーションとコンポーネントの実行・運用基盤です。業務処理の呼出し、データの管理、外部サービスとの連携、実行資源の管理、観測と運用などの共通機能を提供する体系として構成します。CNCF（Cloud-Native Component Framework）は、その中でコンポーネントの実行とクラウド環境への接続を支えるフレームワークです。",
                    "coreRefs": {
                      "steps": [
                        "textus-overview"
                      ],
                      "claims": [
                        "textus-overview-claim-1"
                      ],
                      "nodes": [
                        "textus-overview-node-1"
