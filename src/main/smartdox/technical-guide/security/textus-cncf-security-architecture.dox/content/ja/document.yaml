                    ],
                    "sections": []
                  },
                  {
                    "id": "authorization-decision-section",
                    "heading": "誰が何をできるかを判断する認可モデル",
                    "coreRefs": {
                      "steps": [
                        "authorization-decision"
                      ],
                      "claims": [
                        "authorization-decision-claim-expanded-1",
                        "authorization-decision-claim-expanded-2",
                        "authorization-decision-claim-expanded-3",
                        "authorization-decision-claim-expanded-4"
                      ],
                      "nodes": [
                        "authorization-decision-expanded-node-1",
                        "authorization-decision-expanded-node-2",
                        "authorization-decision-expanded-node-3",
                        "authorization-decision-expanded-node-4"
                      ],
                      "relations": [
                        "authorization-decision-expanded-relation-1",
                        "authorization-decision-expanded-relation-2",
                        "authorization-decision-expanded-relation-3"
                      ],
                      "flows": [
                        "authorization-decision-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "authorization-decision-expanded-1",
                        "kind": "paragraph",
                        "text": "Textus/CNCFは、役割、対象EntityのPermission、主体と対象の関係から有効な権限を求め、属性・状態・実行条件をGuardで確認します。これらをCapabilityとGuardの共通モデルで評価します。",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-expanded-1"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-1"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-1"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-expanded-2",
                        "kind": "paragraph",
                        "text": "Capabilityは許可された操作能力です。主体に与える権限に加え、対象EntityのPermissionや関係から、その対象に限った権限を求めます。すべてのEntityの権限を利用者側へ列挙する必要はありません。",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-expanded-2"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-2"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-1",
                            "authorization-decision-expanded-relation-2"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-expanded-3",
                        "kind": "paragraph",
                        "text": "Guardは、その権限を現在の対象と状況で使える条件を確認します。権限の付与源ではありません。判定には、Guardを満たすことと、有効なCapabilityが対象操作の要求を満たすことの両方が必要です。",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-expanded-3"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-3"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-2",
                            "authorization-decision-expanded-relation-3"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-privilege-baseline",
                        "kind": "paragraph",
                        "text": "設計方針：運用上の特権は数値のレベルで管理し、代表値に root、admin、application admin、user などの名前を対応づけます。各レベルには基本Capabilityの集合があり、割り当てた対象範囲ごとに追加・除外できます。例えばアプリAの管理者に監査ログの閲覧を追加しても、アプリBには適用されません。追加と除外が重なる場合は除外を優先します。",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-privilege-baseline"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-3"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-2",
                            "authorization-decision-expanded-relation-3"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-privilege-entity-access",
                        "kind": "paragraph",
                        "text": "主体に割り当てるレベルと、Entityの操作に必要なレベルは別々に指定します。通常のEntityは user を既定とし、例えば非公開の資料を読むには、所有者や対象別の閲覧権も確認します。所有者の変更から特権レベルを導出しません。信頼できる管理経路で root を行使する主体は、管理専用Entityを含むすべてのEntityを参照・更新できます。同じ利用者でも、通常のアプリ経由では管理専用Entityを直接取得できず、一覧・検索・投影にも現れません。",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-privilege-entity-access"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-3"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-2",
                            "authorization-decision-expanded-relation-3"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-privilege-rollout",
                        "kind": "paragraph",
                        "text": "実装方針：初期段階はレベル・操作・対象範囲の固定表で判定し、Capability評価へ移行するときは同じ許可・拒否例で結果を照合します。現行コードには所有者の値を特権の既定値に使う経路があり、この設計を適用するには保存済みデータの扱いも決める必要があります。具体的な数値とその順序は今後確定します。",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-privilege-rollout"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-3"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-2",
                            "authorization-decision-expanded-relation-3"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-expanded-4",
                        "kind": "paragraph",
                        "text": "用途別の手法と設定対象を次の表に整理します。任意形式のACLは現在の標準Permissionとは区別する拡張項目です。ServiceInternalやSystemなどの実行モードも、利用者の対象別権限とは分け、明示された用途で使用します。",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-expanded-4"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-4"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-3"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-methods-table",
                        "kind": "table",
                        "caption": "用途に応じた認可手法と設定対象",
                        "columns": [
                          {
                            "id": "method",
                            "heading": "手法・機構"
                          },
                          {
                            "id": "configuration",
