                        "text": "TypeScriptやFlutterなどで独立したPresentationを実装する場合、受け取ったデータを描画する際のエスケープや安全なAPIの選択は、そのUI基盤で適用します。Textus側はAPIへの入力、返却するデータの認可・範囲、機微情報を制御します。担当位置を分けることで、サーバーの標準APIによる保護とPresentation側の出力保護を接続します。"
