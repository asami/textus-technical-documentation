                          ]
                        },
                        "text": "ティアは実行・配備上の区分です。本書では、利用者との対話を担当するPresentation tierをUIティアとも呼びます。Application tierは外部要求の受付と業務操作の組合せを、Domain tierは業務規則と状態の管理を担当します。"
                      },
                      {
                        "id": "tiers-cooperation-1",
                        "kind": "paragraph",
                        "coreRefs": {
