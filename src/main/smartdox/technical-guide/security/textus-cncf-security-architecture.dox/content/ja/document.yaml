                            "id": "authorization-method-row-1",
                            "cells": [
                              "RBAC：役割に応じた認可",
                              "利用者・サービスの役割とOperationの要求",
                              "担当者・管理者など、業務機能を利用できる範囲を指定する"
                            ]
