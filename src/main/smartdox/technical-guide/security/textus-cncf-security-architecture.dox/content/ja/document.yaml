                  {
                    "id": "cml-cozy-execution-paragraph-3",
                    "kind": "paragraph",
                    "text": "セキュリティの観点では、入力制約や操作の公開範囲、必要な権限がモデル上の説明に留まらず、生成物と実行時の判定へ引き継がれることが重要です。モデルの検査、生成された契約の確認、Textus上での認可と資源制御をつなぐことで、モデル駆動を保護の適用経路として利用します。",
