                            "auth-cache-explanation-relation-3"
                          ],
                          "flows": [
                            "auth-cache-flow"
                          ]
                        },
                        "text": "キャッシュに該当がなければUser Managementへ問い合わせます。User Managementも自分のメモリー・キャッシュを利用してからUser DBへアクセスします。通常経路はCloud Function内メモリー、User Management内メモリー・キャッシュ、User DBの順になります。"
                      },
                      {
                        "id": "auth-cache-block-3",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
