                      ],
                      "relations": [
                        "runtime-rotation-explanation-relation-2"
                      ],
                      "flows": [
                        "runtime-rotation-flow"
                      ]
                    },
                    "text": "この構成は、交換を特別な事故対応だけにせず、通常運用でも使えるようにする設計です。定期交換は侵害検出、永続データの正しさの確認、バックアップを代替しません。2026年11月13日時点ではPhase 108の先行実装項目は未着手で、ここで述べる更新保全・同期・交換の一体運用を実装済みとは扱いません。"
