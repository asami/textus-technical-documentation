                        "provided-scope-relation-argument-1"
                      ],
                      "flows": [
                        "provided-scope-flow"
                      ]
                    },
                    "text": "本書の技術一覧は、SimpleModelingとTextusがフルセットとして揃える設計上の範囲を示します。実際に利用できる範囲は、採用するTextus/CNCFの版、SAR/CAR、認証プロバイダー、配備構成によって定まります。例えば、共通の認証経路があっても、外部認証方式ごとの利用可否は提供済みアダプターと設定によります。"
                  },
                  {
                    "id": "provided-scope-argument-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "provided-scope"
                      ],
                      "claims": [
                        "provided-scope-claim-argument-2"
                      ],
                      "nodes": [
                        "provided-scope-node-argument-2"
                      ],
                      "relations": [
                        "provided-scope-relation-argument-1"
                      ],
                      "flows": [
                        "provided-scope-flow"
                      ]
                    },
                    "text": "導入時には、各機構について、利用する提供物と版、必要な設定、動作を確認した範囲を対応付けます。開発中・未対応の項目は同じ保護範囲の中で識別し、拡充対象を明確にします。本書は設計の根拠と相互関係を扱い、提供状況の確定情報は各コンポーネントの仕様・リリース情報と照合します。"
