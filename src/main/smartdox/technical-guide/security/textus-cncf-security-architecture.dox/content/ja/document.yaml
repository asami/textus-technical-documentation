                    "text": "モデルが表す条件は、生成物と契約の対応を確認するテストやレビュー、配備時の受入れ判定、Textus/CNCFによる実行時の認可と資源制限へ引き継ぎます。モデル駆動開発が条件の明示・検査・一貫した変換を支え、実行基盤が実際の操作にその条件を適用します。Cloud FunctionとContainerのように実現方法が異なる場合も、この対応を維持することがセキュリティ上重要になります。"
