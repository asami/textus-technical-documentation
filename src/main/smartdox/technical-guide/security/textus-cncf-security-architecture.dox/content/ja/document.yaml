                "blocks": [
                  {
                    "id": "security-operation-patterns-paragraph-1",
                    "kind": "paragraph",
                    "text": "標準の扱いやすさを維持したまま、用途に必要な防御を少ない設定で選べるようにすることが、今後の整備方針です。個々の機構を組み合わせる知識を、再利用できる運用パターン・プロファイル・手順書としてまとめます。",
                    "coreRefs": {
                      "steps": [
                        "security-operation-patterns"
                      ],
                      "claims": [
                        "security-operation-patterns-claim-1"
                      ],
                      "nodes": [
                        "security-operation-patterns-node-1"
                      ],
                      "relations": [
                        "security-operation-patterns-relation-1"
                      ],
                      "flows": [
                        "security-operation-patterns-flow"
                      ]
                    }
                  },
                  {
                    "id": "security-operation-patterns-paragraph-2",
                    "kind": "paragraph",
                    "text": "候補には、標準的な業務利用、外部公開、機微情報の取扱い、強い区画分離を必要とする用途があります。各パターンに、保護対象、対策の組合せ、効果、運用負担を示し、用途と負担から選べる構成にします。",
                    "coreRefs": {
                      "steps": [
                        "security-operation-patterns"
                      ],
                      "claims": [
                        "security-operation-patterns-claim-2"
                      ],
                      "nodes": [
                        "security-operation-patterns-node-2"
                      ],
                      "relations": [
                        "security-operation-patterns-relation-1",
                        "security-operation-patterns-relation-2"
                      ],
                      "flows": [
                        "security-operation-patterns-flow"
                      ]
                    }
                  },
                  {
                    "id": "security-operation-patterns-paragraph-3",
                    "kind": "paragraph",
                    "text": "プロファイルは、選んだパターンに必要な設定をまとめて適用する役割を持ちます。既存の構想にあるCapability Profileで利用可能な機能を限定し、Security Profileで防御方針を選び、業務固有の認可をCMLと設定で指定する分担につなげます。用途別の組合せをあらかじめ整理することで、個々の機構を独立に設定する際の食い違いや適用漏れを減らします。",
                    "coreRefs": {
                      "steps": [
                        "security-operation-patterns"
                      ],
                      "claims": [
                        "security-operation-patterns-claim-3"
                      ],
                      "nodes": [
                        "security-operation-patterns-node-3"
