                        "text": "モデルの型・長さ・件数等の入力制約は、制約違反の要求をパラメータ検査で拒否し、不要な内部処理やメモリ消費を抑えます。形式上は妥当な要求の大量到来は別の問題であり、レート制限と下流の受入れ制御で扱います。"
