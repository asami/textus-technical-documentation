                            "auth-cache-explanation-relation-1",
                            "auth-cache-explanation-relation-2"
                          ],
                          "flows": [
                            "auth-cache-flow"
                          ]
                        },
                        "text": "Cloud Functionの標準キャッシュは、credentialのfingerprintまたは証拠の識別情報からAuthHandleへの、容量とTTLを制限したインスタンス内メモリーとします。AuthHandleは有効期間を持つ不透明な参照であり、キャッシュの永続化やインスタンス間共有は前提にしません。キャッシュのTTLとAuthHandle自体の有効期限、セッションの無効化・失効の扱いを合わせて検証します。"
                      },
                      {
                        "id": "auth-cache-block-2",
                        "kind": "paragraph",
