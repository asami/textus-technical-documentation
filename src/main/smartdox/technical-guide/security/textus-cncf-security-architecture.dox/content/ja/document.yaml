                    "text": "脅威の要件で必要性を説明できない独自ハッシュ検査や大規模なロールバック機構は、複雑さや欠陥を増やすことがあります。実行環境の交換を基本経路とし、追加の完全性検査は対象とする脅威を明確にして選びます。"
