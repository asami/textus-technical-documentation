                    "id": "component-repository-expanded-1",
                    "kind": "paragraph",
                    "text": "配布側では、モデル・契約・実装をCARへまとめ、CAR lintで機械的な違反を検査し、CBD Reviewで権限や依存関係、設計の意味を確認します。署名付きの配布では、その検査対象に対応する完成CARへ署名します。Component RepositoryはCARの版、依存関係、検証結果の参照、署名と提供者の情報を対応付けて配布する構成とします。",
                    "coreRefs": {
