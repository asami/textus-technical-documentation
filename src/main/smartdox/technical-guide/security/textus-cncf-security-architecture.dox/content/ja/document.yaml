                        "text": "検査は、プロバイダー側のエッジ・WAF・レート制限・bot対策、要求の検証、明白なcredential不正の拒否、Cloud Functionへの受入れ、本人確認の解決、Domainでの認可、Domain Operationの順に、安価な処理から高価な処理へ進めます。この順序と下流の同時実行数の制限を組み合わせ、公開側の負荷がUser ManagementやDomainへそのまま流れ込むことを抑えます。"
