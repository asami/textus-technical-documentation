                    "kind": "paragraph",
                    "text": "取得側はCARを一時領域へダウンロードし、完成した取得物のチェックサムと、署名がある場合は信頼する鍵による署名を検証します。成功したそのCARを利用可能なキャッシュへ登録し、展開・ローディングへ進みます。検証後に別のファイルを取り直して検証済みとして扱いません。",
