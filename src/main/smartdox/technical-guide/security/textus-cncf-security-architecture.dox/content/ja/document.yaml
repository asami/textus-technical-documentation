                          ],
                          "relations": [
                            "auth-cache-explanation-relation-3"
                          ],
                          "flows": [
                            "auth-cache-flow"
                          ]
                        },
                        "text": "標準構成ではインスタンス内のキャッシュを利用し、保持先と通信経路を絞ります。Redisなどの外部共有キャッシュは、実測に基づく拡張性の要求がある場合に検討します。その際は、追加する通信、整合性管理、保持情報、運用上の保護を、負荷軽減の効果と合わせて評価します。"
