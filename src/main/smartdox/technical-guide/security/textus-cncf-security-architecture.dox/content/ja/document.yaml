                    "text": "保護の範囲は、認証、操作とデータの認可、入力・出力の保護、実行資源の制限、配布物の信頼性、監査・観測・復旧です。「フルセット」は、この一連の範囲を体系的に揃える設計を指します。標準経路で適用する機構、用途に応じて選ぶ構成、今後整備する項目を、各節で区別します。"
