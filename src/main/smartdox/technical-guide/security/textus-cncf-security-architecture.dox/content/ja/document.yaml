                "blocks": [
                  {
                    "id": "simplemodeling-overview-paragraph-1",
                    "kind": "paragraph",
                    "text": "SimpleModelingは、文芸モデル駆動開発を軸に、業務知識からソフトウェアの開発・実行・運用までをつなぐ方法論と技術体系です。文芸モデルでは、業務の背景、目的、要求、判断理由を文章と構造化したモデルで表します。用語集とBoK（知識体系）を通して文書とモデルの意味を対応付け、人間と生成AIが開発の文脈を共有できるようにします。",
                    "coreRefs": {
                      "steps": [
                        "simplemodeling-overview"
                      ],
                      "claims": [
                        "simplemodeling-overview-claim-1"
                      ],
                      "nodes": [
                        "simplemodeling-overview-node-1"
                      ],
                      "relations": [
                        "simplemodeling-overview-relation-1"
                      ],
                      "flows": [
                        "simplemodeling-overview-flow"
                      ]
                    }
                  },
                  {
                    "id": "simplemodeling-overview-paragraph-2",
                    "kind": "paragraph",
                    "text": "この体系は、ドメイン・モデリング、モデル駆動、オブジェクト・関数統合型プログラミング、コンポーネント指向開発、クラウド・ネイティブ・アプリケーション構築を組み合わせています。ドメイン・モデリングは業務の概念と規則を捉え、モデル駆動はそれを実装と実行へつなぎます。オブジェクトと関数の統合は状態と計算の表現を支え、コンポーネント指向は契約を持つ部品の組合せを、クラウド・ネイティブは実行環境への配備と継続的な運用を支えます。",
                    "coreRefs": {
                      "steps": [
                        "simplemodeling-overview"
                      ],
                      "claims": [
                        "simplemodeling-overview-claim-2"
                      ],
                      "nodes": [
                        "simplemodeling-overview-node-2"
                      ],
                      "relations": [
                        "simplemodeling-overview-relation-1",
                        "simplemodeling-overview-relation-2"
                      ],
                      "flows": [
                        "simplemodeling-overview-flow"
                      ]
                    }
                  },
                  {
                    "id": "simplemodeling-overview-paragraph-3",
                    "kind": "paragraph",
                    "text": "知識処理では、文芸モデル、ドメインのモデル、開発に用いる知識を用語によって結び付けます。SimpleModeling.orgが提供する技術情報とBoKを基礎に、プロジェクト固有の用語、ドメイン知識、設計上の判断を加えます。これらを人間が読む文書として利用するとともに、生成AIが参照する外部知識へ接続することで、モデルの記述・レビュー・生成を支える構成を目指します。",
                    "coreRefs": {
