                          "flows": [
                            "tiers-flow"
                          ]
                        },
                        "text": "Presentation tierは、TypeScript／Node.jsやFlutterなど、Textusとは異なる技術で構築できます。Textusのセキュリティ機構を直接利用できない構成も想定し、Presentationを信頼の前提にしないZero Trustの境界を設けます。クライアント側の検査や画面上の操作制限は、サーバー側の入力検証や認可の代わりにはしません。"
                      },
                      {
                        "id": "tiers-block-1",
                        "kind": "paragraph",
                        "coreRefs": {
