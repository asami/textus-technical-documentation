                    },
                    "text": "Textus/CNCFは、悪意ある攻撃、ソフトウェアの欠陥、運用ミス、AIによる誤判断を異なる原因として区別しつつ、それらが同じauthority boundaryを越えようとする問題として統一的に扱います。"
