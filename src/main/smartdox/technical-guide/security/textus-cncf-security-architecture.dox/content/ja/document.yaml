                "textus-cncf-security-architecture-relation-rationale-2",
                "textus-cncf-security-architecture-relation-rationale-3",
                "textus-cncf-security-architecture-relation-rationale-4"
              ],
              "flows": [
                "textus-cncf-security-architecture-flow"
              ]
            }
          },
          {
            "id": "textus-cncf-security-architecture-argument-2",
            "kind": "paragraph",
            "coreRefs": {
              "steps": [
                "textus-cncf-security-architecture"
              ],
              "claims": [
                "textus-cncf-security-architecture-claim-rationale-1"
