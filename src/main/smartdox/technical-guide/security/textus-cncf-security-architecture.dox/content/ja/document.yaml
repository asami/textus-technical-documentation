                          "flows": [
                            "tiers-flow"
                          ]
                        },
                        "text": "Application tierは外部要求の検証と業務操作の組合せを担当し、Domainの公開APIを通して連携します。Cloud Function Firstで処理を小さく構成し、Domainの内部データへ直接到達する権限を持たせません。具体的な機能・権限の絞り方は次節で説明します。"
                      },
                      {
                        "id": "tiers-block-3",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "tiers"
                          ],
                          "claims": [
                            "tiers-claim-3"
