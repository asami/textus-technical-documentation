                      ],
                      "relations": [
                        "configuration-boundary-relation-argument-1"
                      ],
                      "flows": [
                        "configuration-boundary-flow"
                      ]
                    },
                    "text": "基盤が提供するのは、認証・認可・制約・観測等を一貫して適用する機構です。どの利用者にどの業務操作を許可するか、どの情報を機微情報として扱うか、どの外部サービスを信頼するかは、業務の責任者と開発・運用担当者が定めます。SimpleModelingの作法は、それらの判断をモデルと設定へ置く場所を与えます。"
                  },
                  {
                    "id": "configuration-boundary-argument-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "configuration-boundary"
                      ],
                      "claims": [
                        "configuration-boundary-claim-argument-2"
                      ],
                      "nodes": [
                        "configuration-boundary-node-argument-2"
                      ],
                      "relations": [
                        "configuration-boundary-relation-argument-1"
                      ],
                      "flows": [
                        "configuration-boundary-flow"
                      ]
                    },
                    "text": "標準APIを外れて直接SQL、ネットワーク、ファイル、プロセスを扱う経路は、通常の保護がどこまで適用されるかを確認する対象になります。例外経路を識別し、必要な権限と検査を明示することで、拡張を含むSAR/CARでも共通基盤との接続を保ちます。"
