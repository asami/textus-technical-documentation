                    "text": "図はApplicationの再利用・廃棄とDomainの準備・交代を概略で示します。図中のActiveは本文のPrimaryに対応し、Standbyは昇格準備を表します。Read Replicaとしての参照提供と、旧系の保持・退役条件は本文の説明に従います。時間幅は実際の所要時間を表しません。"
