                      "flows": [
                        "security-operation-patterns-flow"
                      ]
                    }
                  },
                  {
                    "id": "security-operation-patterns-paragraph-4",
                    "kind": "paragraph",
                    "text": "手順書では、パターンの選択から業務権限・配備の設定、許可・拒否と監査記録の確認、失効・復旧までを案内します。選んだ構成と実際の動作を対応付けることで、設定の簡略化と確認可能性を両立させます。",
