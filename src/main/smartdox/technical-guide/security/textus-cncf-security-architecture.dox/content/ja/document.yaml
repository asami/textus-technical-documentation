                    "text": "SimpleModelingでは、モデルに宣言した操作と必要権限に沿って、標準のAPIと実行経路を構成します。通常の生成物へ与える権限や低水準の操作を必要な範囲に絞ることで、実装が利用できる危険な操作の余地を小さくします。モデルに基づく生成は、共通の対策を繰り返し適用し、個々の業務処理でセキュリティ機構を組み立てる負担を減らす役割を持ちます。"
