        "nodeRef": "developer-security-contract-node-argument-1",
        "text": "開発者はCMLで業務の構造・操作・状態変更を定義し、利用する認証方式や業務上の公開範囲を設定します。基本的な権限には既定値を利用し、用途固有の役割・関係・条件が必要な箇所を追加します。基盤が判定機構を提供し、モデルと設定が業務ごとの方針を表す分担です。"
