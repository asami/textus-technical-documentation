                        "text": "入力モデルと型付きRepository/DataStore APIは、サーバー側で扱う入力とデータ操作を制約します。TextusがHTMLを生成する経路では、出力文脈に応じたレンダラーで出力を保護し、HTTPの更新操作には入口のCSRF方針を適用します。"
