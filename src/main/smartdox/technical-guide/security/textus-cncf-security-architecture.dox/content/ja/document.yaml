                "blocks": [
                  {
                    "id": "cml-cozy-execution-paragraph-1",
                    "kind": "paragraph",
                    "text": "CMLで業務の構造、振る舞い、制約を記述し、実行可能なモデルはTextusが直接解釈・実行します。Cozyは型付きAPIや実装の接続構造、コンポーネントの構成を生成します。モデルの直接実行とコード生成を組み合わせ、個別の補完処理を標準の実行経路へ接続します。",
                    "coreRefs": {
                      "steps": [
