                        "text": "SQL文字列の直接連結、信頼できない値のHTMLへの直接挿入、直接のファイル・ネットワーク・プロセス操作は、標準経路から外れる箇所として識別し、lintとレビューの対象にします。入力は宣言したOperation入力モデルへ束縛し、Entityへの無制限の一括代入や安全でないデシリアライズを避けます。"
