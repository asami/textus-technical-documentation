              ],
              "flows": [
                "textus-cncf-security-architecture-flow"
              ]
            },
            "text": "SimpleModelingとTextusは、Literate Model-Driven Cloud-Native Development with Object-Functional Paradigms for the AI Eraをテーマに、開発方法論と実行環境を一体化した技術体系です。文芸モデル駆動開発、オブジェクト・関数統合、コンポーネント指向、クラウド・ネイティブ技術を組み合わせ、AI時代のクラウド・ネイティブな業務アプリケーションのための開発方法論とアプリケーション・フレームワークを提供します。"
          },
          {
            "id": "textus-cncf-security-architecture-abstract-2",
            "kind": "paragraph",
            "text": "本書は、CBDによるコンポーネントの独立性と、認証・認可などの共通機構を組み合わせるセキュリティ・アーキテクチャを解説します。別技術で構築するPresentation tierを信頼の前提にせず、Application・Domainの役割分担とDomain内部の対策で保護する構成を示します。モデルに記述した規則を、検査・配布・受入れから実行・観測・復旧へ引き継ぐ流れも説明します。",
            "coreRefs": {
              "steps": [
                "textus-cncf-security-architecture"
              ],
              "claims": [
                "textus-cncf-security-architecture-claim-abstract-2"
              ],
              "nodes": [
                "textus-cncf-security-architecture-node-framework-security-goal"
              ],
              "relations": [
                "textus-cncf-security-architecture-relation-rationale-1",
                "textus-cncf-security-architecture-relation-rationale-2",
                "textus-cncf-security-architecture-relation-rationale-3",
                "textus-cncf-security-architecture-relation-rationale-4"
              ],
              "flows": [
                "textus-cncf-security-architecture-flow"
              ]
            }
          },
          {
            "id": "textus-cncf-security-architecture-abstract-3",
            "kind": "paragraph",
            "text": "CMLでモデルを定義し、Textusの標準構成で実行・運用することで、一般的な認証・認可の機構が自動的に適用されます。開発者は機構そのものを部品ごとに実装せず、利用する認証方式と業務固有の権限をモデル・設定で指定します。通常の開発と運用を通して基本的な保護を得ながら、用途に応じて認可を細かく調整できます。",
            "coreRefs": {
              "steps": [
                "textus-cncf-security-architecture"
              ],
              "claims": [
                "textus-cncf-security-architecture-claim-abstract-3"
              ],
              "nodes": [
                "textus-cncf-security-architecture-node-framework-security-goal"
              ],
              "relations": [
