                      },
                      {
                        "id": "authorization-decision-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "authorization-decision"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "authorization-configuration-section",
                    "heading": "既定の保護から用途別の許可範囲へ絞り込む",
                    "coreRefs": {
                      "steps": [
                        "authorization-configuration"
                      ],
                      "claims": [
                        "authorization-configuration-claim-1",
                        "authorization-configuration-claim-2",
                        "authorization-configuration-claim-3",
                        "authorization-configuration-claim-4"
                      ],
                      "nodes": [
                        "authorization-configuration-node-1",
                        "authorization-configuration-node-2",
                        "authorization-configuration-node-3",
                        "authorization-configuration-node-4"
                      ],
                      "relations": [
                        "authorization-configuration-relation-1",
                        "authorization-configuration-relation-2",
                        "authorization-configuration-relation-3"
                      ],
                      "flows": [
                        "authorization-configuration-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "authorization-configuration-paragraph-1",
                        "kind": "paragraph",
                        "text": "用途別の規則は、CMLのACCESS、Operationの認可メタデータ、資源別の設定へ記述します。Entityやコレクション単位の既定値を起点に、必要な公開範囲と操作を指定します。",
                        "coreRefs": {
                          "steps": [
                            "authorization-configuration"
                          ],
                          "claims": [
                            "authorization-configuration-claim-1"
                          ],
                          "nodes": [
                            "authorization-configuration-node-1"
                          ],
                          "relations": [
                            "authorization-configuration-relation-1"
                          ],
                          "flows": [
                            "authorization-configuration-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-configuration-paragraph-2",
                        "kind": "paragraph",
                        "text": "許可範囲は、Component・Service・Operation、コレクションや対象Entity、read・update・deleteなどの操作、属性や状態の条件を組み合わせて指定します。作成はまだ対象Entityがないためコレクション単位で判断し、search/listは呼出し権限に加えて結果の可視範囲を絞ります。関連の変更やStoreの管理にも、それぞれの資源と操作に対応する規則を適用します。",
                        "coreRefs": {
                          "steps": [
                            "authorization-configuration"
                          ],
                          "claims": [
                            "authorization-configuration-claim-2"
                          ],
                          "nodes": [
                            "authorization-configuration-node-2"
                          ],
                          "relations": [
                            "authorization-configuration-relation-1",
                            "authorization-configuration-relation-2"
                          ],
                          "flows": [
                            "authorization-configuration-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-configuration-paragraph-3",
                        "kind": "paragraph",
                        "text": "例えば、資料編集Operationを編集担当者に許可し、対象資料は担当関係を持つものに限定し、同一テナントかつ編集中というGuardを適用します。対象を担当資料だけに限定する場合は、所有者・グループ等の別の付与経路でも意図しない許可が生じないよう設定します。",
                        "coreRefs": {
                          "steps": [
                            "authorization-configuration"
                          ],
                          "claims": [
                            "authorization-configuration-claim-3"
                          ],
                          "nodes": [
                            "authorization-configuration-node-3"
                          ],
                          "relations": [
                            "authorization-configuration-relation-2",
                            "authorization-configuration-relation-3"
                          ],
                          "flows": [
                            "authorization-configuration-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-configuration-paragraph-4",
                        "kind": "paragraph",
                        "text": "この精密な指定は、過大な権限を減らし、誤操作や侵害時に操作できる対象を限定します。SimpleEntityが判断材料を揃え、モデル・設定が用途を表し、共通のOperation・UnitOfWork判定が実行へ適用することで、基本的な保護から細かな認可まで同じ開発経路で扱えます。",
                        "coreRefs": {
                          "steps": [
                            "authorization-configuration"
                          ],
                          "claims": [
                            "authorization-configuration-claim-4"
                          ],
                          "nodes": [
                            "authorization-configuration-node-4"
                          ],
                          "relations": [
                            "authorization-configuration-relation-3"
                          ],
                          "flows": [
                            "authorization-configuration-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-configuration-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "authorization-configuration"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "operation-authorization-section",
                    "heading": "Operationを呼び出せるかを実行前に判定する",
                    "coreRefs": {
                      "steps": [
                        "operation-authorization"
                      ],
                      "claims": [
                        "operation-authorization-claim-expanded-1",
                        "operation-authorization-claim-expanded-2",
                        "operation-authorization-claim-expanded-3"
                      ],
                      "nodes": [
                        "operation-authorization-expanded-node-1",
                        "operation-authorization-expanded-node-2",
                        "operation-authorization-expanded-node-3"
                      ],
                      "relations": [
                        "operation-authorization-expanded-relation-1",
                        "operation-authorization-expanded-relation-2"
                      ],
                      "flows": [
                        "operation-authorization-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "operation-authorization-expanded-1",
                        "kind": "paragraph",
                        "text": "Operation認可は、Component・Service・Operationを呼び出せるかを判定します。Subsystemは認証状態を解決した後、ActionCallを作成・実行する前にこの判定を行います。Web、REST、コマンドなどの入口を共通の判定へ集め、Web側で許可されたことだけを理由に業務処理を開始しません。",
                        "coreRefs": {
                          "steps": [
                            "operation-authorization"
                          ],
                          "claims": [
                            "operation-authorization-claim-expanded-1"
                          ],
                          "nodes": [
                            "operation-authorization-expanded-node-1"
                          ],
                          "relations": [
                            "operation-authorization-expanded-relation-1"
                          ],
                          "flows": [
                            "operation-authorization-flow"
                          ]
                        }
                      },
                      {
                        "id": "operation-authorization-expanded-2",
                        "kind": "paragraph",
                        "text": "ルールには匿名利用の可否、実行モード、必要なprivilege、役割、スコープ、Capabilityなどを記述します。Operation定義、CMLの生成メタデータ、Subsystemの宣言を共通のルールへ反映し、各ハンドラーが認可関数を呼び忘れないことに依存しません。",
                        "coreRefs": {
                          "steps": [
                            "operation-authorization"
                          ],
                          "claims": [
                            "operation-authorization-claim-expanded-2"
                          ],
                          "nodes": [
                            "operation-authorization-expanded-node-2"
                          ],
                          "relations": [
                            "operation-authorization-expanded-relation-1",
                            "operation-authorization-expanded-relation-2"
                          ],
                          "flows": [
                            "operation-authorization-flow"
                          ]
                        }
                      },
                      {
                        "id": "operation-authorization-expanded-3",
                        "kind": "paragraph",
                        "text": "例えば「資料編集」のOperationを呼び出す権限があっても、他の組織が所有する資料を編集できるとは限りません。Operation認可は業務処理へ入るための判定であり、実際の対象Entityへのアクセスは次のUnitOfWork境界で改めて判定します。",
                        "coreRefs": {
                          "steps": [
                            "operation-authorization"
                          ],
                          "claims": [
                            "operation-authorization-claim-expanded-3"
                          ],
                          "nodes": [
                            "operation-authorization-expanded-node-3"
                          ],
                          "relations": [
                            "operation-authorization-expanded-relation-2"
                          ],
                          "flows": [
                            "operation-authorization-flow"
                          ]
                        }
                      },
                      {
                        "id": "operation-authorization-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "operation-authorization"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "entity-authorization-section",
                    "heading": "UnitOfWorkで対象Entityへのアクセスを判定する",
                    "coreRefs": {
                      "steps": [
                        "entity-authorization"
                      ],
                      "claims": [
                        "entity-authorization-claim-expanded-1",
                        "entity-authorization-claim-expanded-2",
                        "entity-authorization-claim-expanded-3",
                        "entity-authorization-claim-expanded-4"
                      ],
                      "nodes": [
                        "entity-authorization-expanded-node-1",
                        "entity-authorization-expanded-node-2",
                        "entity-authorization-expanded-node-3",
                        "entity-authorization-expanded-node-4"
                      ],
                      "relations": [
                        "entity-authorization-expanded-relation-1",
                        "entity-authorization-expanded-relation-2",
                        "entity-authorization-expanded-relation-3"
                      ],
                      "flows": [
                        "entity-authorization-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "entity-authorization-expanded-1",
                        "kind": "paragraph",
                        "text": "業務処理が対象Entityを読み書きする際は、保護された内部DSLからUnitOfWorkを発行し、UnitOfWorkInterpreterで認可します。主体、対象コレクション・Entity、操作種別、関係、実行条件を合わせて評価します。Operationへ入れたことだけでは、任意のデータにアクセスできません。",
                        "coreRefs": {
                          "steps": [
                            "entity-authorization"
                          ],
                          "claims": [
                            "entity-authorization-claim-expanded-1"
                          ],
                          "nodes": [
                            "entity-authorization-expanded-node-1"
                          ],
                          "relations": [
                            "entity-authorization-expanded-relation-1"
                          ],
                          "flows": [
                            "entity-authorization-flow"
                          ]
                        }
                      },
                      {
                        "id": "entity-authorization-expanded-2",
                        "kind": "paragraph",
                        "text": "既存EntityではPermissionや関係をread・update・delete等の要求権限へ対応付けます。実行用の投影データに必要な権限情報がない場合は、永続化側の正規レコードを参照します。作成はコレクションや資源クラス単位で判定し、利用者の権限によるsearch/listでは結果の可視範囲も絞ります。",
                        "coreRefs": {
                          "steps": [
                            "entity-authorization"
                          ],
                          "claims": [
                            "entity-authorization-claim-expanded-2"
                          ],
                          "nodes": [
                            "entity-authorization-expanded-node-2"
                          ],
                          "relations": [
                            "entity-authorization-expanded-relation-1",
                            "entity-authorization-expanded-relation-2"
                          ],
                          "flows": [
                            "entity-authorization-flow"
                          ]
                        }
                      },
                      {
                        "id": "entity-authorization-expanded-3",
                        "kind": "paragraph",
                        "text": "利用者のPermissionを評価するUserPermission、サービス内部のServiceInternal、基盤処理のSystemを区別します。内部処理やSystemは明示された実行上の役割であり、ネットワークの内側にいるという理由で選ぶものではありません。Componentを越えるサービスアクセスには、明示的なサービス権限が必要になります。",
                        "coreRefs": {
                          "steps": [
                            "entity-authorization"
                          ],
                          "claims": [
                            "entity-authorization-claim-expanded-3"
                          ],
                          "nodes": [
                            "entity-authorization-expanded-node-3"
                          ],
                          "relations": [
                            "entity-authorization-expanded-relation-2",
                            "entity-authorization-expanded-relation-3"
                          ],
