                    "text": "Textus/CNCFでは、セキュリティをアプリケーション実装の後から追加する機能として扱いません。セキュリティは、システムの構造、権限、信頼境界、実行境界、配布単位、運用方式を決めるアーキテクチャ段階からの第一級要素です。"
