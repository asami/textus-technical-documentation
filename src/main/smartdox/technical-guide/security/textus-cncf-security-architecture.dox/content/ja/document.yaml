                          ],
                          "flows": [
                            "function-realization-flow"
                          ]
                        },
                        "text": "Applicationティアの処理は、コンテナまたはCloud Functionとして実行します。Cloud Functionは、クラウドの実行基盤が要求やイベントに応じて呼び出す処理単位です。"
                      },
                      {
                        "id": "function-realization-cooperation-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "function-realization"
                          ],
                          "claims": [
                            "function-realization-claim-cooperation-1"
                          ],
                          "nodes": [
                            "function-realization-explanation-node-3"
                          ],
                          "relations": [
                            "function-realization-relation-term-definition",
                            "function-realization-explanation-relation-1"
                          ],
                          "flows": [
                            "function-realization-flow"
                          ]
                        },
                        "text": "Cloud Function Firstは、コストと拡張性に加え、公開側の機能と権限を小さく保つための選択です。Operation単位の処理へ必要な権限だけを付与し、Domain DB、CAR Runtime、任意のファイル操作などの不要な機能を持たせません。Domainへは公開APIを通して接続し、Domain側で操作と対象データを認可します。Cloud Functionの処理単位と、この権限・接続先の限定を組み合わせることで、Application側の欠陥や侵害が及ぼせる範囲を抑えます。"
                      },
                      {
                        "id": "function-realization-block-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "function-realization"
                          ],
                          "claims": [
                            "function-realization-claim-1"
                          ],
                          "nodes": [
                            "function-realization-explanation-node-1"
                          ],
                          "relations": [
                            "function-realization-explanation-relation-1",
                            "function-realization-explanation-relation-2"
                          ],
                          "flows": [
                            "function-realization-flow"
                          ]
                        },
                        "text": "CMLでは通常のService/Operationとしてアプリケーションをモデル化し、クラウド・プロバイダーの概念を基本要素にはしません。生成時には全Application Operationを含む完全なCNCF Containerを用意し、そのうちCloud Functionに適したOperationを追加のCloud Functionとしての実現へ投影します。"
                      },
                      {
                        "id": "function-realization-block-2",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "function-realization"
                          ],
                          "claims": [
                            "function-realization-claim-2"
                          ],
                          "nodes": [
                            "function-realization-explanation-node-2"
                          ],
                          "relations": [
                            "function-realization-explanation-relation-2",
                            "function-realization-relation-ephemeral-execution"
                          ],
                          "flows": [
                            "function-realization-flow"
                          ]
                        },
                        "text": "Cloud Functionとして表現できるかという候補判定と、特定プロバイダーへ配備できるかという判定は区別します。Cloud Functionに適さない処理は完全なContainer実現を利用し、その場合もApplicationとDomainの責務・権限の境界を維持します。実行形式の選択が変わっても、同じ業務契約と権限方針を適用します。"
                      },
                      {
                        "id": "function-realization-ephemeral-execution",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "function-realization"
                          ],
                          "claims": [
                            "function-realization-claim-ephemeral-execution"
                          ],
                          "nodes": [
                            "function-realization-node-ephemeral-execution"
                          ],
                          "relations": [
                            "function-realization-relation-ephemeral-execution"
                          ],
                          "flows": [
                            "function-realization-flow"
                          ]
                        },
                        "text": "Cloud Functionは性能要件に応じて実行環境を再利用し、初期化の負担や応答時間を抑えます。呼出しごとの処理時間と実行環境の寿命を分けて捉え、呼出し間の状態の隔離と、不要になった環境の廃棄を組み合わせます。長時間維持するコンテナよりも実行環境が短命に管理される構成では、侵害状態の持続時間を抑える効果を期待できます。この効果は実行基盤の隔離・再利用・廃棄の方針に依存するため、Applicationティアではそれらの特性と応答性能を合わせて評価します。"
                      },
