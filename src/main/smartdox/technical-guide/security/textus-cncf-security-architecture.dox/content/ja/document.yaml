      {
        "nodeRef": "full-set-scope-node-argument-2",
        "text": "例えば、注文の更新要求では、利用者を認証するだけでなく、更新操作の利用権限、対象注文へのアクセス権限、入力制約、業務状態の変更条件を確認する必要があります。配備する実装の検査と実行資源の制限は、その処理を支える別の保護です。異常が発生した場合は、どの主体がどの注文を変更したかを追跡し、必要な権限失効と復旧へつなぎます。この一連の対応を共通基盤で支えることが、フルセットという目標の具体的な意味です。"
