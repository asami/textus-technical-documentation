                    "text": "CBDでは、Componentの内部実装をカプセル化し、外部へ公開するインターフェースを定めます。Component間の連携をProvided/Required契約へ集約し、依存関係を明示することで、外部から操作できる接点を限定し、内部への不用意なアクセスや意図しない結合を減らします。責務と接点が明確になるため、保護する対象と確認すべき経路も特定しやすくなります。これが、CBDの構造そのものがセキュリティに寄与する部分です。"
