                ],
                "sections": [
                  {
                    "id": "shared-security-mechanisms-section",
                    "heading": "独立したコンポーネントを共通の認証・認可で運用する",
                    "coreRefs": {
                      "steps": [
                        "shared-security-mechanisms"
                      ],
                      "claims": [
                        "shared-security-mechanisms-claim-1",
                        "shared-security-mechanisms-claim-2",
                        "shared-security-mechanisms-claim-3"
                      ],
                      "nodes": [
                        "shared-security-mechanisms-node-1",
                        "shared-security-mechanisms-node-2",
                        "shared-security-mechanisms-node-3"
                      ],
                      "relations": [
                        "shared-security-mechanisms-relation-1",
                        "shared-security-mechanisms-relation-2"
                      ],
                      "flows": [
                        "shared-security-mechanisms-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "shared-security-mechanisms-paragraph-1",
                        "kind": "paragraph",
                        "text": "コンポーネント化しても、認証状態の受渡しや認可の適用方法が部品ごとに異なると、それらを接続し、一貫して運用するための個別対応が必要になります。Textus/CNCFでは、主体の表現、認可の判定機構、実行文脈、監査・観測の経路を共通化します。",
                        "coreRefs": {
                          "steps": [
                            "shared-security-mechanisms"
                          ],
                          "claims": [
                            "shared-security-mechanisms-claim-1"
                          ],
                          "nodes": [
                            "shared-security-mechanisms-node-1"
                          ],
                          "relations": [
                            "shared-security-mechanisms-relation-1"
                          ],
                          "flows": [
                            "shared-security-mechanisms-flow"
                          ]
                        }
                      },
                      {
                        "id": "shared-security-mechanisms-paragraph-2",
                        "kind": "paragraph",
                        "text": "共通化するのは機構です。各Component・Domainは、自分が公開する操作と管理するデータについて、必要権限や業務上の許可条件を定めます。認証された主体を共通の形式で受け取り、それぞれの規則で判定するため、連携先で認証済みであることを、そのまま自分の操作やデータへの許可にはしません。",
                        "coreRefs": {
                          "steps": [
                            "shared-security-mechanisms"
                          ],
                          "claims": [
                            "shared-security-mechanisms-claim-2"
                          ],
                          "nodes": [
                            "shared-security-mechanisms-node-2"
                          ],
                          "relations": [
                            "shared-security-mechanisms-relation-1",
                            "shared-security-mechanisms-relation-2"
                          ],
                          "flows": [
                            "shared-security-mechanisms-flow"
                          ]
                        }
                      },
                      {
                        "id": "shared-security-mechanisms-paragraph-3",
                        "kind": "paragraph",
                        "text": "この構成により、部品ごとに認証処理や認可の接続コードを作る負担を減らし、異なる入口や連携先でも共通の判定手順を適用できます。認証状態の失効を各経路へ反映し、主体・操作・対象・判定結果を関連付けて観測することで、区画ごとの独立性を保ちながらシステム全体を管理・運用します。",
                        "coreRefs": {
                          "steps": [
                            "shared-security-mechanisms"
                          ],
                          "claims": [
                            "shared-security-mechanisms-claim-3"
                          ],
                          "nodes": [
                            "shared-security-mechanisms-node-3"
                          ],
                          "relations": [
                            "shared-security-mechanisms-relation-2"
                          ],
                          "flows": [
                            "shared-security-mechanisms-flow"
                          ]
                        }
                      },
                      {
                        "id": "shared-security-mechanisms-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "shared-security-mechanisms"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "authentication-subjects-section",
                    "heading": "認証する主体と認証プロバイダーの役割",
                    "coreRefs": {
                      "steps": [
                        "authentication-subjects"
                      ],
                      "claims": [
                        "authentication-subjects-claim-expanded-4",
                        "authentication-subjects-claim-expanded-1",
                        "authentication-subjects-claim-expanded-2",
                        "authentication-subjects-claim-expanded-3"
                      ],
                      "nodes": [
                        "authentication-subjects-expanded-node-4",
                        "authentication-subjects-expanded-node-1",
                        "authentication-subjects-expanded-node-2",
                        "authentication-subjects-expanded-node-3"
                      ],
                      "relations": [
                        "authentication-subjects-relation-ordered-1",
                        "authentication-subjects-relation-ordered-2",
                        "authentication-subjects-relation-ordered-3"
                      ],
                      "flows": [
                        "authentication-subjects-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "authentication-subjects-expanded-1",
                        "kind": "paragraph",
                        "text": "認証は、要求を行う主体の識別情報と認証の事実を確立します。人間の利用者だけでなく、呼出し元のサービスやサブシステムも対象になります。利用者を代行する呼出しでは、利用者の識別と呼出し元サービスの識別を区別します。",
                        "coreRefs": {
                          "steps": [
                            "authentication-subjects"
                          ],
                          "claims": [
                            "authentication-subjects-claim-expanded-1"
                          ],
                          "nodes": [
                            "authentication-subjects-expanded-node-1"
                          ],
                          "relations": [
                            "authentication-subjects-relation-ordered-1"
                          ],
                          "flows": [
                            "authentication-subjects-flow"
                          ]
                        }
                      },
                      {
                        "id": "authentication-subjects-expanded-2",
                        "kind": "paragraph",
                        "text": "CNCFは入口で認証情報を受け取り、配備設定に従って主体に対応する認証プロバイダーを選びます。人間のアカウント、資格情報、セッションはtextus-user-accountなどの人間向けプロバイダーが扱い、サービス認証は対応する別のプロバイダーの責務とします。CNCFは成功した認証結果を共通の実行コンテキストへ取り込みます。",
                        "coreRefs": {
                          "steps": [
                            "authentication-subjects"
                          ],
                          "claims": [
                            "authentication-subjects-claim-expanded-2"
                          ],
                          "nodes": [
                            "authentication-subjects-expanded-node-2"
                          ],
                          "relations": [
                            "authentication-subjects-relation-ordered-1",
                            "authentication-subjects-relation-ordered-2"
                          ],
                          "flows": [
                            "authentication-subjects-flow"
                          ]
                        }
                      },
                      {
                        "id": "authentication-subjects-expanded-3",
                        "kind": "paragraph",
                        "text": "外部認証では、プロバイダー・アダプターが方式に応じた署名、発行者、利用先、有効期限、コールバック状態などを検証します。検証済みの外部主体は、プロバイダーと安定した主体識別子の組で内部UserAccountへ対応付けます。メールアドレスだけによる誤った結合を避け、外部トークンは内部セッションやDomain権限へ直接置き換えません。未検証の認証情報、利用が許可されていない方式、未登録のアダプターは認証失敗とします。各方式の利用可否は、提供済みアダプターと配備設定によります。",
                        "coreRefs": {
                          "steps": [
                            "authentication-subjects"
                          ],
                          "claims": [
                            "authentication-subjects-claim-expanded-3"
                          ],
                          "nodes": [
                            "authentication-subjects-expanded-node-3"
                          ],
                          "relations": [
                            "authentication-subjects-relation-ordered-2",
                            "authentication-subjects-relation-ordered-3"
                          ],
                          "flows": [
                            "authentication-subjects-flow"
                          ]
                        }
                      },
                      {
                        "id": "authentication-subjects-expanded-4",
                        "kind": "paragraph",
                        "text": "認証方式ごとの検証を専用プロバイダーへ集約し、成功した結果を共通の認証状態へ揃えると、業務処理が方式ごとに資格情報を解釈する箇所を減らせます。Textus/CNCFは、人間の認証結果を内部のAccessSession・RefreshSessionへ統一し、共通の実行コンテキストへ引き継ぎます。方式固有の検証と業務上の認可を分離することで、異なる入口でも一貫した主体の扱いを保ちます。",
                        "coreRefs": {
                          "steps": [
                            "authentication-subjects"
                          ],
                          "claims": [
                            "authentication-subjects-claim-expanded-4"
                          ],
                          "nodes": [
                            "authentication-subjects-expanded-node-4"
                          ],
                          "relations": [
                            "authentication-subjects-relation-ordered-3"
                          ],
                          "flows": [
                            "authentication-subjects-flow"
                          ]
                        }
                      },
                      {
                        "id": "authentication-subjects-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "authentication-subjects"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "auth-handle-section",
                    "heading": "内部の認証状態とAuthHandleによる連携",
                    "coreRefs": {
                      "steps": [
                        "auth-handle"
                      ],
                      "claims": [
                        "auth-handle-claim-expanded-1",
                        "auth-handle-claim-expanded-2",
                        "auth-handle-claim-expanded-3"
                      ],
                      "nodes": [
                        "auth-handle-expanded-node-1",
                        "auth-handle-expanded-node-2",
                        "auth-handle-expanded-node-3"
                      ],
                      "relations": [
                        "auth-handle-expanded-relation-1",
                        "auth-handle-expanded-relation-2"
                      ],
                      "flows": [
                        "auth-handle-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "auth-handle-expanded-1",
                        "kind": "paragraph",
                        "text": "SecurityContextは、実行基盤が認証結果から構築する主体・認証状態の受渡し形式です。認可では、そこから認証状態、役割、スコープ、グループ、権限、業務境界の属性などを正規化したSecuritySubjectを利用します。各業務処理が外部claimを独自に読み直して権限を組み立てる方式にしません。",
                        "coreRefs": {
                          "steps": [
                            "auth-handle"
                          ],
                          "claims": [
                            "auth-handle-claim-expanded-1"
                          ],
                          "nodes": [
                            "auth-handle-expanded-node-1"
                          ],
                          "relations": [
                            "auth-handle-expanded-relation-1"
                          ],
                          "flows": [
                            "auth-handle-flow"
                          ]
                        }
                      },
                      {
                        "id": "auth-handle-expanded-2",
                        "kind": "paragraph",
                        "text": "Cloud Function連携では、中央のUser Managementが解決した認証状態への、有効期間を持つ不透明な参照としてAuthHandleを用います。AuthHandleはUserId、外部OAuthトークン、権限一覧、直列化したExecutionContextではありません。Applicationはその内容を編集して権限を増やさず、対象Domainへ参照を渡します。",
                        "coreRefs": {
                          "steps": [
                            "auth-handle"
                          ],
                          "claims": [
                            "auth-handle-claim-expanded-2"
                          ],
                          "nodes": [
                            "auth-handle-expanded-node-2"
                          ],
                          "relations": [
                            "auth-handle-expanded-relation-1",
                            "auth-handle-expanded-relation-2"
                          ],
                          "flows": [
                            "auth-handle-flow"
                          ]
                        }
                      },
                      {
                        "id": "auth-handle-expanded-3",
                        "kind": "paragraph",
                        "text": "一つのApplication Operationが複数Domainを連携させる場合も、同じ有効なAuthHandleを利用できます。各Domainは参照を解決し、対象操作と資源について自分の方針で認可します。有効期限、アカウントやセッションの無効化、失効とキャッシュの扱いを合わせて定め、古い参照が無制限に権限を維持しないようにします。",
                        "coreRefs": {
                          "steps": [
                            "auth-handle"
                          ],
                          "claims": [
                            "auth-handle-claim-expanded-3"
                          ],
                          "nodes": [
                            "auth-handle-expanded-node-3"
                          ],
                          "relations": [
                            "auth-handle-expanded-relation-2"
                          ],
                          "flows": [
                            "auth-handle-flow"
                          ]
                        }
                      },
                      {
                        "id": "auth-handle-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "auth-handle"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "domain-ingress-section",
                    "heading": "Cloud Function向けDomain APIで認証情報を共通の認可経路へ接続する",
                    "coreRefs": {
                      "steps": [
                        "domain-ingress"
                      ],
                      "claims": [
                        "domain-ingress-claim-expanded-1",
                        "domain-ingress-claim-expanded-2"
                      ],
                      "nodes": [
                        "domain-ingress-expanded-node-1",
                        "domain-ingress-expanded-node-2"
                      ],
                      "relations": [
                        "domain-ingress-expanded-relation-1"
                      ],
                      "flows": [
                        "domain-ingress-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "domain-ingress-expanded-1",
                        "kind": "paragraph",
                        "text": "Cloud Function向けDomain APIは、Operation要求、AuthHandle、Cloud Functionまたはサービスの識別情報、必要な観測文脈を受け取ります。これらを信頼境界で解決し、Domainが利用するSecurityContextとExecutionContextへ正規化します。Applicationから渡された任意のclaimを、そのまま権限にはしません。",
                        "coreRefs": {
                          "steps": [
                            "domain-ingress"
                          ],
                          "claims": [
                            "domain-ingress-claim-expanded-1"
                          ],
                          "nodes": [
                            "domain-ingress-expanded-node-1"
                          ],
                          "relations": [
                            "domain-ingress-expanded-relation-1"
                          ],
                          "flows": [
                            "domain-ingress-flow"
                          ]
                        }
                      },
                      {
                        "id": "domain-ingress-expanded-2",
                        "kind": "paragraph",
                        "text": "正規化後は通常のOperation呼出しへ合流し、Operation認可を経てActionCallを実行します。その処理が発行するUnitOfWorkには対象資源の認可を適用します。Applicationの実行方式や、その外側のPresentation技術が異なっても、Domain内部では同じ判定経路を利用します。",
                        "coreRefs": {
                          "steps": [
                            "domain-ingress"
                          ],
                          "claims": [
                            "domain-ingress-claim-expanded-2"
                          ],
                          "nodes": [
                            "domain-ingress-expanded-node-2"
                          ],
                          "relations": [
                            "domain-ingress-expanded-relation-1"
                          ],
                          "flows": [
                            "domain-ingress-flow"
                          ]
                        }
                      },
                      {
                        "id": "domain-ingress-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "domain-ingress"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "simple-entity-security-foundation-section",
                    "heading": "SimpleEntityの基本情報と既定値で認可の基礎を揃える",
                    "coreRefs": {
                      "steps": [
                        "simple-entity-security-foundation"
                      ],
                      "claims": [
                        "simple-entity-security-foundation-claim-1",
                        "simple-entity-security-foundation-claim-2",
                        "simple-entity-security-foundation-claim-3",
                        "simple-entity-security-foundation-claim-4",
                        "simple-entity-security-foundation-claim-unix-permission-baseline"
                      ],
                      "nodes": [
                        "simple-entity-security-foundation-node-1",
                        "simple-entity-security-foundation-node-2",
                        "simple-entity-security-foundation-node-3",
                        "simple-entity-security-foundation-node-4"
                      ],
                      "relations": [
                        "simple-entity-security-foundation-relation-1",
                        "simple-entity-security-foundation-relation-2",
                        "simple-entity-security-foundation-relation-3"
                      ],
                      "flows": [
                        "simple-entity-security-foundation-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "simple-entity-security-foundation-paragraph-1",
                        "kind": "paragraph",
                        "text": "認可機構があっても、所有者や権限の情報がデータごとに異なったり、作成時に設定されなかったりすると、対象単位の判定を一律に適用できません。個別開発では、この情報構造と保存・参照の扱いを揃える作業が、細かな認可を実装する際の制約になります。",
                        "coreRefs": {
                          "steps": [
                            "simple-entity-security-foundation"
                          ],
                          "claims": [
                            "simple-entity-security-foundation-claim-1"
                          ],
                          "nodes": [
                            "simple-entity-security-foundation-node-1"
                          ],
                          "relations": [
                            "simple-entity-security-foundation-relation-1"
                          ],
                          "flows": [
                            "simple-entity-security-foundation-flow"
                          ]
                        }
                      },
                      {
                        "id": "simple-entity-security-foundation-paragraph-2",
                        "kind": "paragraph",
                        "text": "SimpleEntityは、UNIX型のowner・group・otherに基づく権限情報を共通の基本情報として持ちます。SecurityAttributesは所有者とグループの識別情報、および各区分のread・write・execute権を保持します。認証機構が確認した主体とその所属を、この対象側の情報へ対応付けてアクセスを判断します。ライフサイクル、公開、監査の基本情報も、状態や公開期間に関する条件と追跡を支えます。",
                        "coreRefs": {
                          "steps": [
                            "simple-entity-security-foundation"
                          ],
                          "claims": [
                            "simple-entity-security-foundation-claim-2"
                          ],
                          "nodes": [
                            "simple-entity-security-foundation-node-2"
                          ],
                          "relations": [
                            "simple-entity-security-foundation-relation-1",
                            "simple-entity-security-foundation-relation-2"
                          ],
                          "flows": [
                            "simple-entity-security-foundation-flow"
                          ]
                        }
                      },
                      {
                        "id": "simple-entity-security-foundation-paragraph-3",
                        "kind": "paragraph",
                        "text": "標準の開発経路では、Entity作成時に所有者情報と権限を補完します。利用者の権限で読み書きする経路では、owner・group・otherのread・write権を自動判定します。業務用Entityの既定値は次表のとおりで、公開コンテンツはpublic-readなどの明示的なプロファイルで扱います。サービス内部や基盤処理の実行モードは、後述のUnitOfWork認可で区別します。",
                        "coreRefs": {
                          "steps": [
                            "simple-entity-security-foundation"
                          ],
                          "claims": [
                            "simple-entity-security-foundation-claim-3",
                            "simple-entity-security-foundation-claim-unix-permission-baseline"
                          ],
                          "nodes": [
                            "simple-entity-security-foundation-node-3"
                          ],
                          "relations": [
                            "simple-entity-security-foundation-relation-2",
                            "simple-entity-security-foundation-relation-3"
                          ],
                          "flows": [
                            "simple-entity-security-foundation-flow"
                          ]
                        }
                      },
                      {
                        "id": "entity-default-permissions",
                        "kind": "table",
                        "caption": "業務用Entityの既定権限",
