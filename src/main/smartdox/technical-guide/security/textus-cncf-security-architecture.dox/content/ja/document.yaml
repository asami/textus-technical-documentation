                            "auth-cache-flow"
                          ]
                        },
                        "text": "認証状態への参照を再利用するキャッシュは、同じ要求に伴う繰返しの認証状態照会を減らし、User ManagementとUser DBの負荷を抑えます。保持する場所、容量、有効期間を限定することで、参照の複製範囲と保持量も管理できます。これは認証基盤の可用性と情報管理への寄与であり、操作の許可はAuthHandleの有効性と各Domainの認可によって判定します。"
                      },
                      {
                        "id": "auth-cache-block-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "auth-cache"
                          ],
