                      "flows": [
                        "runtime-rotation-flow"
                      ]
                    },
                    "text": "計画交換では、準備のできたBへ新しい参照・更新の受付を移し、旧Primary Aは受付済みの更新とその完了に必要な処理だけを継続します。交換用Read Replica Cを起動し、Aの遅い確定もB・Cへ同期します。Aは旧処理の結果が確定し、Cの準備、保持・観測と切戻しの条件を満たすまで、必要な同期を続けます。"
                  },
                  {
                    "id": "runtime-rotation-block-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "runtime-rotation"
                      ],
                      "claims": [
                        "runtime-rotation-claim-2"
                      ],
                      "nodes": [
                        "runtime-rotation-explanation-node-2"
                      ],
                      "relations": [
                        "runtime-rotation-explanation-relation-1",
                        "runtime-rotation-explanation-relation-2"
                      ],
                      "flows": [
                        "runtime-rotation-flow"
                      ]
                    },
                    "text": "旧Primaryは、予定時刻や保持時間だけを理由に廃棄しません。定期交換は起動・準備・切替え・排出を日常運用で確かめる方法であり、日次は固定の標準値ではありません。障害切替えでは旧権限の更新を実際の保存・実行境界で拒否し、新しい権限と準備を確認します。侵害が疑われる旧環境には、計画交換の切戻し方針を適用しません。"
                  },
                  {
                    "id": "runtime-rotation-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "runtime-rotation"
                      ],
                      "claims": [
