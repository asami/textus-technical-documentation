                    "text": "業務上の操作、入出力、状態、公開範囲、必要権限をモデルに明示すると、何を保護し、誰にどの操作を許すかを、個々の実装から切り離して確認できます。CMLはService/OperationやCapabilityなどの意味を保持し、契約の不足や不整合をモデルの検査とレビューの対象にします。業務上の意図とセキュリティ上の条件を同じモデルで扱うことで、設計段階で両者の対応を確認しやすくなります。"
