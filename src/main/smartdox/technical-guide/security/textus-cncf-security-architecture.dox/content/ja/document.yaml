                      ],
                      "relations": [
                        "immutable-runtime-relation-replacement-limits",
                        "immutable-runtime-relation-performance-security-balance"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "環境の交換は、侵害状態が同じ実行環境に残る期間を抑えるために用います。資格情報の更新・失効、原因となった実装の修正、永続状態の確認との分担は「交換と業務上の復旧」で説明します。"
                  },
                  {
                    "id": "immutable-runtime-performance-security-balance",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-performance-security-balance"
                      ],
                      "nodes": [
                        "immutable-runtime-node-performance-security-balance"
                      ],
                      "relations": [
                        "immutable-runtime-relation-performance-security-balance"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "Applicationでは環境の再利用と廃棄、Domainではメモリ常駐性能を維持する準備済み環境への交代を選びます。更新・定期交換・セキュリティ対応は共通の交換機構を使い、障害時には別の権限・回復条件を適用します。採用理由、日常運用、費用と効果は[[../../immutable-infrastructure/textus-cncf-immutable-infrastructure.dox/index.dox][イミュータブルインフラストラクチャ技術ガイド]]、同期と切替えの詳細は[[../../availability/textus-cncf-availability-architecture.dox/index.dox][可用性・HA技術ガイド]]を参照します。"
                  },
