                    "text": "優先する流れは、権限を限定し、観測・検出し、影響を封じ込めて権限を失効させ、不変の実行環境へ交換し、権威ある永続状態から復旧することです。一方、配布時の脅威モデルに必要な成果物の完全性検証まで不要とするものではありません。"
