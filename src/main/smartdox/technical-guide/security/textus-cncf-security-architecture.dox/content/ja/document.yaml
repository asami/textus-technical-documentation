                    "text": "モデル駆動開発は、業務の概念や規則を実装技術より高い抽象度で記述し、その意味をプログラムの生成や実行へ結び付ける開発方式です。SimpleModelingでは、ドメイン知識に近い表現、共通のモデルに基づく設計と実装、複数の実装方式への展開などに活用しています。モデルとして意味を明示し、検査や変換に利用できるという特性は、セキュリティにも役立ちます。"
