                    "id": "component-repository-expanded-4",
                    "kind": "paragraph",
                    "text": "取得・検証したCARを、利用先でそのまま無制限に実行するわけではありません。必要権限、依存CAR、runtimeや更新の互換性を配備方針と照合し、許可した範囲を認可とSandboxへ適用します。利用中の依存関係や脆弱性情報も更新判断へつなぎ、過去の検証結果を将来のすべての構成に対する保証としません。",
