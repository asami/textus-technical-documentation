            "sections": [
              {
                "id": "simplemodeling-overview-section",
                "heading": "The SimpleModeling Technology System",
                "coreRefs": {
                  "steps": [
                    "simplemodeling-overview"
                  ],
                  "claims": [
                    "simplemodeling-overview-claim-1",
                    "simplemodeling-overview-claim-2",
                    "simplemodeling-overview-claim-3"
                  ],
                  "nodes": [
                    "simplemodeling-overview-node-1",
                    "simplemodeling-overview-node-2",
                    "simplemodeling-overview-node-3"
                  ],
                  "relations": [
                    "simplemodeling-overview-relation-1",
                    "simplemodeling-overview-relation-2"
                  ],
                  "flows": [
                    "simplemodeling-overview-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "simplemodeling-overview-paragraph-1",
                    "kind": "paragraph",
                    "text": "SimpleModeling is a methodology and technology system centered on literate model-driven development, connecting business knowledge to software development, execution, and operation. Literate models express business context, goals, requirements, and rationale through prose and structured models. Glossaries and a Body of Knowledge (BoK) relate the meaning of documents and models so that people and generative AI can share development context.",
                    "coreRefs": {
                      "steps": [
                        "simplemodeling-overview"
                      ],
                      "claims": [
                        "simplemodeling-overview-claim-1"
                      ],
                      "nodes": [
                        "simplemodeling-overview-node-1"
                      ],
                      "relations": [
                        "simplemodeling-overview-relation-1"
                      ],
                      "flows": [
                        "simplemodeling-overview-flow"
                      ]
                    }
                  },
                  {
                    "id": "simplemodeling-overview-paragraph-2",
                    "kind": "paragraph",
                    "text": "The system combines domain modeling, model-driven development, object-functional programming, component-based development, and cloud-native application development. Domain modeling captures business concepts and rules, while model-driven development connects them to implementation and execution. Object-functional programming supports the expression of state and computation, components compose parts through contracts, and cloud-native techniques support deployment and ongoing operation.",
                    "coreRefs": {
                      "steps": [
                        "simplemodeling-overview"
                      ],
                      "claims": [
                        "simplemodeling-overview-claim-2"
                      ],
                      "nodes": [
                        "simplemodeling-overview-node-2"
                      ],
                      "relations": [
                        "simplemodeling-overview-relation-1",
                        "simplemodeling-overview-relation-2"
                      ],
                      "flows": [
                        "simplemodeling-overview-flow"
                      ]
                    }
                  },
                  {
                    "id": "simplemodeling-overview-paragraph-3",
                    "kind": "paragraph",
                    "text": "Knowledge processing connects literate models, domain models, and development knowledge through shared terms. Technical material and the BoK provided by SimpleModeling.org form a foundation to which projects add terminology, domain knowledge, and design decisions. The aim is to use this information both as human-readable documentation and as external knowledge for generative AI, supporting model authoring, review, and generation.",
                    "coreRefs": {
                      "steps": [
                        "simplemodeling-overview"
                      ],
                      "claims": [
                        "simplemodeling-overview-claim-3"
                      ],
                      "nodes": [
                        "simplemodeling-overview-node-3"
                      ],
                      "relations": [
                        "simplemodeling-overview-relation-2"
                      ],
                      "flows": [
                        "simplemodeling-overview-flow"
                      ]
                    }
                  },
                  {
                    "id": "simplemodeling-overview-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "simplemodeling-overview"
                  }
                ],
                "sections": []
              },
              {
                "id": "cml-cozy-execution-section",
                "heading": "Connect CML Models to Generation and Direct Execution",
                "coreRefs": {
                  "steps": [
                    "cml-cozy-execution"
                  ],
                  "claims": [
                    "cml-cozy-execution-claim-1",
                    "cml-cozy-execution-claim-2",
                    "cml-cozy-execution-claim-3"
                  ],
                  "nodes": [
                    "cml-cozy-execution-node-1",
                    "cml-cozy-execution-node-2",
                    "cml-cozy-execution-node-3"
                  ],
                  "relations": [
                    "cml-cozy-execution-relation-1",
                    "cml-cozy-execution-relation-2"
                  ],
                  "flows": [
                    "cml-cozy-execution-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "cml-cozy-execution-paragraph-1",
                    "kind": "paragraph",
                    "text": "CML describes business structures, behavior, and constraints, and Textus directly interprets and executes executable models. Cozy generates typed APIs, implementation connections, and component structures. Direct model execution and code generation connect application-specific supplementary processing to standard execution paths.",
                    "coreRefs": {
                      "steps": [
                        "cml-cozy-execution"
                      ],
                      "claims": [
                        "cml-cozy-execution-claim-1"
                      ],
                      "nodes": [
                        "cml-cozy-execution-node-1"
                      ],
                      "relations": [
                        "cml-cozy-execution-relation-1"
                      ],
                      "flows": [
                        "cml-cozy-execution-flow"
                      ]
                    }
                  },
                  {
                    "id": "cml-cozy-execution-paragraph-2",
                    "kind": "paragraph",
                    "text": "Carrying modeled operations, state, and constraints into execution reduces repeated manual translations of business concepts. Supplementary implementations follow the same contracts and authority boundaries.",
                    "coreRefs": {
                      "steps": [
                        "cml-cozy-execution"
                      ],
                      "claims": [
                        "cml-cozy-execution-claim-2"
                      ],
                      "nodes": [
                        "cml-cozy-execution-node-2"
                      ],
                      "relations": [
                        "cml-cozy-execution-relation-1",
                        "cml-cozy-execution-relation-2"
                      ],
                      "flows": [
                        "cml-cozy-execution-flow"
                      ]
                    }
                  },
                  {
                    "id": "cml-cozy-execution-paragraph-3",
                    "kind": "paragraph",
                    "text": "For security, input constraints, operation exposure, and required authority must be carried into generated artifacts and runtime decisions. Connecting model inspection and generated-contract checks to authorization and resource controls on Textus makes model-driven development a path for applying protection.",
                    "coreRefs": {
                      "steps": [
                        "cml-cozy-execution"
                      ],
                      "claims": [
                        "cml-cozy-execution-claim-3"
                      ],
                      "nodes": [
                        "cml-cozy-execution-node-3"
                      ],
                      "relations": [
                        "cml-cozy-execution-relation-2"
                      ],
                      "flows": [
                        "cml-cozy-execution-flow"
                      ]
                    }
                  },
                  {
                    "id": "cml-cozy-execution-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "cml-cozy-execution"
                  }
                ],
                "sections": []
              },
              {
                "id": "textus-overview-section",
                "heading": "Textus and SAR/CAR",
                "coreRefs": {
                  "steps": [
                    "textus-overview"
                  ],
                  "claims": [
                    "textus-overview-claim-1",
                    "textus-overview-claim-2",
                    "textus-overview-claim-3"
                  ],
                  "nodes": [
                    "textus-overview-node-1",
                    "textus-overview-node-2",
                    "textus-overview-node-3"
                  ],
                  "relations": [
                    "textus-overview-relation-1",
                    "textus-overview-relation-2"
                  ],
                  "flows": [
                    "textus-overview-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "textus-overview-paragraph-1",
                    "kind": "paragraph",
                    "text": "Textus is the execution and operational platform for applications and components developed with SimpleModeling. It is organized as shared infrastructure for business-operation invocation, data management, external-service integration, execution resources, observation, and operations. CNCF (Cloud-Native Component Framework) supports component execution and connection to cloud environments within that platform.",
                    "coreRefs": {
                      "steps": [
                        "textus-overview"
                      ],
                      "claims": [
                        "textus-overview-claim-1"
                      ],
                      "nodes": [
                        "textus-overview-node-1"
                      ],
                      "relations": [
                        "textus-overview-relation-1"
                      ],
                      "flows": [
                        "textus-overview-flow"
                      ]
                    }
                  },
                  {
                    "id": "textus-overview-paragraph-2",
                    "kind": "paragraph",
                    "text": "SARs and CARs are units for composing, distributing, and consuming applications and components. This guide focuses particularly on inspecting a CAR's contracts, dependencies, required authority, and implementation, and relating those contents to deployment and execution. Developers package application-specific behavior into these units and combine it with shared Textus facilities.",
                    "coreRefs": {
                      "steps": [
                        "textus-overview"
                      ],
                      "claims": [
                        "textus-overview-claim-2"
                      ],
                      "nodes": [
                        "textus-overview-node-2"
                      ],
                      "relations": [
                        "textus-overview-relation-1",
                        "textus-overview-relation-2"
                      ],
                      "flows": [
                        "textus-overview-flow"
                      ]
                    }
                  },
                  {
                    "id": "textus-overview-paragraph-3",
                    "kind": "paragraph",
                    "text": "Authentication, authorization, input/output protection, resource limits, auditing, and observation are integrated into standard invocation, data-access, and resource-use paths. CML definitions and basic configuration connect to these paths, reducing per-handler security implementation.",
                    "coreRefs": {
                      "steps": [
                        "textus-overview"
                      ],
                      "claims": [
                        "textus-overview-claim-3"
                      ],
                      "nodes": [
                        "textus-overview-node-3"
                      ],
                      "relations": [
                        "textus-overview-relation-2"
                      ],
                      "flows": [
                        "textus-overview-flow"
                      ]
                    }
                  },
                  {
                    "id": "textus-overview-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "textus-overview"
                  }
                ],
                "sections": []
              },
              {
                "id": "overall-architecture-section",
                "heading": "Connecting Knowledge, Models, Generation, Execution, and Operations",
                "coreRefs": {
                  "steps": [
                    "overall-architecture"
                  ],
                  "claims": [
                    "overall-architecture-claim-1",
                    "overall-architecture-claim-2",
                    "overall-architecture-claim-3"
                  ],
                  "nodes": [
                    "overall-architecture-node-1",
                    "overall-architecture-node-2",
