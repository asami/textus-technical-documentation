                "operations-and-recovery-claim-boundary"
              ],
              "nodes": [
                "operations-and-recovery-explanation-node-1",
                "operations-and-recovery-explanation-node-2",
                "operations-and-recovery-explanation-node-3",
                "operations-and-recovery-explanation-node-4"
              ],
              "relations": [
                "operations-and-recovery-explanation-relation-1",
                "operations-and-recovery-explanation-relation-2",
                "operations-and-recovery-explanation-relation-3"
              ],
              "flows": [
                "operations-and-recovery-flow"
              ]
            },
            "blocks": [
              {
                "id": "operations-and-recovery-explanation-problem",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "operations-and-recovery"
                  ],
                  "claims": [
                    "operations-and-recovery-claim-problem"
                  ],
                  "nodes": [
                    "operations-and-recovery-explanation-node-1"
                  ],
                  "relations": [
                    "operations-and-recovery-explanation-relation-1"
                  ],
                  "flows": [
                    "operations-and-recovery-flow"
                  ]
                },
                "text": "Prevention and authority limits still require planning for faulty behavior within admitted scope and for compromised execution environments. Operations must not depend solely on repeatedly declaring a running environment safe."
              },
              {
                "id": "operational-containment-recovery-figure",
                "kind": "figure",
                "asset": "images/operational-containment-recovery-en.png",
                "caption": "Replacement is combined with revocation, persistent-state examination, and correction of causes. The diagram relates response activities rather than mandating one sequential schedule.",
                "alt": "Connect detection to containment and recovery. Observe / correlate / Operations / actors / authorization / resources / Identify anomalies and affected scope; Contain impact / Revoke authority / isolate traffic / Limit further damage; Replace runtime / Prepare from known artifacts / Use HA / rotation mechanisms; Examine persistent state / Investigate unauthorized updates / disclosure / Perform required business recovery; Correct and redeploy / Fix underlying vulnerabilities / configuration / Address reinfection paths",
                "coreRefs": {
                  "steps": [
                    "operations-and-recovery"
                  ],
                  "claims": [
                    "operations-and-recovery-claim-problem",
                    "operations-and-recovery-claim-combination",
                    "operations-and-recovery-claim-effect",
                    "operations-and-recovery-claim-boundary"
                  ],
                  "nodes": [
                    "operations-and-recovery-explanation-node-1",
                    "operations-and-recovery-explanation-node-2",
                    "operations-and-recovery-explanation-node-3",
                    "operations-and-recovery-explanation-node-4"
                  ],
                  "relations": [
                    "operations-and-recovery-explanation-relation-1",
                    "operations-and-recovery-explanation-relation-2",
                    "operations-and-recovery-explanation-relation-3"
                  ],
                  "flows": [
                    "operations-and-recovery-flow"
                  ]
                }
              },
              {
                "id": "operations-and-recovery-explanation-combination",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "operations-and-recovery"
                  ],
                  "claims": [
                    "operations-and-recovery-claim-combination"
                  ],
                  "nodes": [
                    "operations-and-recovery-explanation-node-2"
                  ],
                  "relations": [
                    "operations-and-recovery-explanation-relation-1",
                    "operations-and-recovery-explanation-relation-2"
                  ],
                  "flows": [
                    "operations-and-recovery-flow"
                  ]
                },
                "text": "Audit and observation records collected through shared paths support examination of operation history and incident impact. Responses select authority revocation, communication isolation, and runtime replacement, followed by persistent-state checks and business recovery. The HA and rotation arrangements below are deployment and operational configurations that support this response."
              },
              {
                "id": "operations-and-recovery-explanation-effect",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "operations-and-recovery"
                  ],
                  "claims": [
                    "operations-and-recovery-claim-effect"
                  ],
                  "nodes": [
                    "operations-and-recovery-explanation-node-3"
                  ],
                  "relations": [
                    "operations-and-recovery-explanation-relation-2",
                    "operations-and-recovery-explanation-relation-3"
                  ],
                  "flows": [
                    "operations-and-recovery-flow"
                  ]
                },
                "text": "Component contracts and dependencies are associated with observations of execution subjects, authorization decisions, and execution environments. Compartment-specific authority limits constrain impact, while shared observability supports system-wide tracing and selection of revocation, isolation, and replacement targets."
              },
              {
                "id": "operations-and-recovery-explanation-boundary",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "operations-and-recovery"
                  ],
                  "claims": [
                    "operations-and-recovery-claim-boundary"
                  ],
                  "nodes": [
                    "operations-and-recovery-explanation-node-4"
                  ],
                  "relations": [
                    "operations-and-recovery-explanation-relation-3"
                  ],
                  "flows": [
                    "operations-and-recovery-flow"
                  ]
                },
                "text": "Replacing an execution environment does not undo unauthorized business updates or past disclosure. This recovery path assumes examination of observations and persistent state, with separate business recovery where needed."
              },
              {
                "id": "operations-and-recovery-logical-structure",
                "kind": "logical-structure",
                "stepRef": "operations-and-recovery"
              }
            ],
            "sections": [
              {
                "id": "observability-section",
                "heading": "Connect Security and Observability and Use Audit Trails",
                "coreRefs": {
                  "steps": [
                    "observability"
                  ],
                  "claims": [
                    "observability-claim-cooperation-1",
                    "observability-claim-1",
                    "observability-claim-2",
                    "observability-claim-audit-collection",
                    "observability-claim-audit-use",
                    "observability-claim-distinct-diagnostic-audit-lifecycles"
