                      ],
                      "relations": [
                        "observability-relation-audit-4"
                      ],
                      "flows": [
                        "observability-flow"
                      ]
                    },
                    "text": "Observation retains identifiers and outcomes needed for decisions without copying credentials, tokens, or unnecessary personal data into logs and traces. This preserves diagnostic value while limiting sensitive information accumulated in the observation infrastructure and the impact of its disclosure."
                  },
                  {
                    "id": "observability-logical-structure",
