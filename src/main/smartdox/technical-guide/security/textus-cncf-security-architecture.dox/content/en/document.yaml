                            "lifecycle-explanation-relation-2"
                          ],
                          "flows": [
                            "lifecycle-flow"
                          ]
                        }
                      },
                      {
                        "id": "lifecycle-block-2-item-4",
                        "text": "Observe: trace subjects, operations, targets, and decisions through common paths to assess impact across collaborating components.",
                        "coreRefs": {
                          "steps": [
                            "lifecycle"
                          ],
                          "claims": [
                            "lifecycle-claim-5"
                          ],
                          "nodes": [
                            "lifecycle-explanation-node-2"
                          ],
                          "relations": [
                            "lifecycle-explanation-relation-1",
