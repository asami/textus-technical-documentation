        "blocks": [
          {
            "id": "textus-cncf-security-architecture-argument-1",
            "kind": "paragraph",
            "coreRefs": {
              "steps": [
                "textus-cncf-security-architecture"
              ],
              "claims": [
                "textus-cncf-security-architecture-claim-1"
              ],
              "nodes": [
                "textus-cncf-security-architecture-node-framework-security-goal"
              ],
              "relations": [
                "textus-cncf-security-architecture-relation-rationale-1",
                "textus-cncf-security-architecture-relation-rationale-2",
                "textus-cncf-security-architecture-relation-rationale-3",
                "textus-cncf-security-architecture-relation-rationale-4"
              ],
              "flows": [
                "textus-cncf-security-architecture-flow"
              ]
            },
            "text": "SimpleModeling and Textus form an integrated technology system combining a development methodology with an execution environment under the theme “Literate Model-Driven Cloud-Native Development with Object-Functional Paradigms for the AI Era.” They combine literate model-driven development, object-functional paradigms, component orientation, and cloud-native technologies, providing a development methodology and application framework for cloud-native business applications in the AI era."
          },
          {
            "id": "textus-cncf-security-architecture-abstract-2",
            "kind": "paragraph",
            "text": "This guide explains a security architecture that combines component independence through CBD with shared mechanisms such as authentication and authorization. It describes protection through Application and Domain responsibilities and controls within the Domain, without assuming trust in a Presentation tier built with other technologies. It also follows modeled rules through inspection, distribution, admission, execution, observation, and recovery.",
            "coreRefs": {
              "steps": [
                "textus-cncf-security-architecture"
              ],
              "claims": [
                "textus-cncf-security-architecture-claim-abstract-2"
              ],
              "nodes": [
                "textus-cncf-security-architecture-node-framework-security-goal"
              ],
              "relations": [
                "textus-cncf-security-architecture-relation-rationale-1",
                "textus-cncf-security-architecture-relation-rationale-2",
                "textus-cncf-security-architecture-relation-rationale-3",
                "textus-cncf-security-architecture-relation-rationale-4"
              ],
              "flows": [
                "textus-cncf-security-architecture-flow"
              ]
            }
          },
          {
            "id": "textus-cncf-security-architecture-abstract-3",
            "kind": "paragraph",
            "text": "Defining models in CML and running them with the standard Textus configuration automatically applies common authentication and authorization mechanisms. Developers specify the authentication method and business-specific permissions through models and configuration rather than implementing these mechanisms in each component. Ordinary development and operation provide baseline protection, with authorization refined for each application.",
            "coreRefs": {
              "steps": [
                "textus-cncf-security-architecture"
              ],
              "claims": [
                "textus-cncf-security-architecture-claim-abstract-3"
              ],
              "nodes": [
                "textus-cncf-security-architecture-node-framework-security-goal"
              ],
              "relations": [
                "textus-cncf-security-architecture-relation-rationale-1",
                "textus-cncf-security-architecture-relation-rationale-2",
                "textus-cncf-security-architecture-relation-rationale-3",
                "textus-cncf-security-architecture-relation-rationale-4"
              ],
              "flows": [
                "textus-cncf-security-architecture-flow"
              ]
            }
          },
          {
            "id": "textus-cncf-security-architecture-argument-2",
            "kind": "paragraph",
            "coreRefs": {
              "steps": [
                "textus-cncf-security-architecture"
              ],
              "claims": [
                "textus-cncf-security-architecture-claim-rationale-1"
              ],
              "nodes": [
                "textus-cncf-security-architecture-node-standard-path"
              ],
              "relations": [
                "textus-cncf-security-architecture-relation-rationale-1"
              ],
              "flows": [
                "textus-cncf-security-architecture-flow"
              ]
            },
            "text": "CBD and models make compartments, contracts, and required authority explicit; CAR inspection, distribution, and admission at the destination connect them to execution."
          },
          {
            "id": "textus-cncf-security-architecture-argument-3",
            "kind": "paragraph",
            "coreRefs": {
              "steps": [
                "textus-cncf-security-architecture"
              ],
              "claims": [
                "textus-cncf-security-architecture-claim-rationale-2"
              ],
              "nodes": [
                "textus-cncf-security-architecture-node-protection-coverage"
              ],
              "relations": [
                "textus-cncf-security-architecture-relation-rationale-2"
              ],
              "flows": [
                "textus-cncf-security-architecture-flow"
              ]
            },
            "text": "Authenticated subjects propagate through shared execution context to Operation and target-Entity authorization and resource controls. UNIX-style Entity permissions provide the baseline, combined with application-specific authorization rules."
          },
          {
            "id": "textus-cncf-security-architecture-argument-4",
            "kind": "paragraph",
            "coreRefs": {
              "steps": [
                "textus-cncf-security-architecture"
              ],
              "claims": [
                "textus-cncf-security-architecture-claim-rationale-3"
              ],
              "nodes": [
                "textus-cncf-security-architecture-node-operational-continuity"
              ],
              "relations": [
                "textus-cncf-security-architecture-relation-rationale-3"
              ],
              "flows": [
                "textus-cncf-security-architecture-flow"
              ]
            },
            "text": "During operation, execution and data-mutation records are collected automatically for diagnosis, auditing, and impact investigation. Revocation, isolation, runtime replacement, and recovery are combined according to the selected deployment and operational policy."
          },
          {
            "id": "textus-cncf-security-architecture-argument-5",
            "kind": "paragraph",
            "coreRefs": {
              "steps": [
                "textus-cncf-security-architecture"
              ],
              "claims": [
                "textus-cncf-security-architecture-claim-rationale-4"
              ],
              "nodes": [
                "textus-cncf-security-architecture-node-adoption-scope"
              ],
              "relations": [
                "textus-cncf-security-architecture-relation-rationale-4"
              ],
              "flows": [
                "textus-cncf-security-architecture-flow"
              ]
            },
            "text": "The guide distinguishes baseline mechanisms used in ordinary development and operation from application-specific authorization and deployment or operational hardening. Planned operation patterns, profiles, and guides aim to combine them through a small number of settings."
          },
          {
            "id": "textus-cncf-security-architecture-foundation",
            "kind": "paragraph",
            "text": "SimpleModeling connects business knowledge expressed as models to working software. Models are written in CML, Cozy generates implementations and components, and Textus runs them. Literate models and knowledge processing, model-driven development, components, and cloud-native techniques combine to support development and operation.",
            "coreRefs": {
