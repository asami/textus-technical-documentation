                          ],
                          "flows": [
                            "lifecycle-flow"
                          ]
                        }
                      },
                      {
                        "id": "lifecycle-block-2-item-3",
                        "text": "Verify: inspect model-to-CAR correspondence and carry the inspected content into admission at the destination.",
                        "coreRefs": {
                          "steps": [
                            "lifecycle"
                          ],
                          "claims": [
                            "lifecycle-claim-4"
                          ],
                          "nodes": [
