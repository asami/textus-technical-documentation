                  ]
                },
                "blocks": [
                  {
                    "id": "safe-application-paths-explanation-problem",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "safe-application-paths"
                      ],
                      "claims": [
                        "safe-application-paths-claim-problem"
                      ],
                      "nodes": [
                        "safe-application-paths-explanation-node-1"
                      ],
                      "relations": [
                        "safe-application-paths-explanation-relation-1"
                      ],
                      "flows": [
                        "safe-application-paths-flow"
                      ]
                    },
                    "text": "Even an authorized request from the intended user can lead to disclosure or unintended actions if input handling, output, data updates, or sensitive-information handling is defective."
                  },
                  {
                    "id": "safe-application-paths-explanation-combination",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "safe-application-paths"
                      ],
                      "claims": [
                        "safe-application-paths-claim-combination"
                      ],
                      "nodes": [
                        "safe-application-paths-explanation-node-2"
                      ],
                      "relations": [
                        "safe-application-paths-explanation-relation-1",
                        "safe-application-paths-explanation-relation-2"
                      ],
                      "flows": [
                        "safe-application-paths-flow"
                      ]
                    },
                    "text": "Common controls are built into standard APIs and input models, while sensitive-information classifications define retention and output scope."
                  },
                  {
                    "id": "safe-application-paths-explanation-effect",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "safe-application-paths"
                      ],
                      "claims": [
                        "safe-application-paths-claim-effect"
                      ],
                      "nodes": [
                        "safe-application-paths-explanation-node-3"
                      ],
                      "relations": [
                        "safe-application-paths-explanation-relation-2",
                        "safe-application-paths-explanation-relation-3"
                      ],
                      "flows": [
                        "safe-application-paths-flow"
                      ]
                    },
                    "text": "These controls reduce implementation defects within authorized processing and complement the impact limits imposed by authorization and resource restrictions."
                  },
                  {
                    "id": "safe-application-paths-explanation-boundary",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "safe-application-paths"
                      ],
                      "claims": [
                        "safe-application-paths-claim-boundary"
                      ],
                      "nodes": [
                        "safe-application-paths-explanation-node-4"
                      ],
                      "relations": [
                        "safe-application-paths-explanation-relation-3"
                      ],
                      "flows": [
                        "safe-application-paths-flow"
                      ]
                    },
                    "text": "The following sections explain the standard and exception paths and decisions about retaining or delegating sensitive information."
                  },
                  {
                    "id": "safe-application-paths-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "safe-application-paths"
                  }
