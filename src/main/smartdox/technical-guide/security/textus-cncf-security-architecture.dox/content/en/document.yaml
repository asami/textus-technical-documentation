                  ]
                },
                "blocks": [
                  {
                    "id": "local-testing-block-3",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "local-testing"
                      ],
                      "claims": [
                        "local-testing-claim-3"
                      ],
                      "nodes": [
                        "local-testing-explanation-node-3"
                      ],
                      "relations": [
                        "local-testing-explanation-relation-1"
                      ],
                      "flows": [
                        "local-testing-flow"
                      ]
                    },
                    "text": "When Containers and Cloud Functions realize the same logical Operation, shared executable specifications check externally observable contracts, including input checks, authorization, rejection responses, and state changes. These tests aim to detect discrepancies such as one realization accepting an operation that should be rejected or changing state after rejecting it."
                  },
                  {
                    "id": "local-testing-block-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "local-testing"
                      ],
                      "claims": [
                        "local-testing-claim-1"
                      ],
                      "nodes": [
                        "local-testing-explanation-node-1"
                      ],
                      "relations": [
                        "local-testing-explanation-relation-1",
                        "local-testing-explanation-relation-2"
                      ],
                      "flows": [
                        "local-testing-flow"
                      ]
                    },
                    "text": "As an adapter implementing the common Cloud Function ABI, Local/Test allows checks of the common core and boundary behavior independently of provider-specific environments. Repeatable checks under controlled conditions help detect security-behavior regressions caused by generator or adapter changes early."
                  },
                  {
                    "id": "local-testing-block-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "local-testing"
                      ],
                      "claims": [
                        "local-testing-claim-2"
                      ],
                      "nodes": [
                        "local-testing-explanation-node-2"
                      ],
                      "relations": [
                        "local-testing-explanation-relation-2",
                        "local-testing-explanation-relation-3"
                      ],
                      "flows": [
                        "local-testing-flow"
                      ]
                    },
                    "text": "Verification starts with repeatable checks of the shared core and Local/Test, then covers Domain integration, Active/Standby and caches, and provider-adapter contracts. Tests in the actual cloud finally check deployment authority and reachable paths."
                  },
                  {
                    "id": "local-testing-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "local-testing"
                      ],
                      "claims": [
                        "local-testing-claim-cooperation-1"
                      ],
                      "nodes": [
                        "local-testing-explanation-node-4"
                      ],
                      "relations": [
                        "local-testing-explanation-relation-3"
                      ],
                      "flows": [
                        "local-testing-flow"
                      ]
                    },
                    "text": "Shared executable specifications check Operation contracts, while adapter-contract checks examine interfaces with execution environments. Deployment acceptance tests check cloud-specific permission settings and actual reachable paths. This division combines repeatable verification with checks of conditions observable only in the real environment."
                  },
                  {
                    "id": "local-testing-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "local-testing"
                  }
                ],
                "sections": []
              },
              {
                "id": "ai-development-section",
                "heading": "Control AI Development Risks by Separating the Actor from Its Artifacts",
                "coreRefs": {
                  "steps": [
                    "ai-development"
                  ],
                  "claims": [
                    "ai-development-claim-cooperation-1",
                    "ai-development-claim-2",
                    "ai-development-claim-4",
                    "ai-development-claim-1"
                  ],
                  "nodes": [
                    "ai-development-explanation-node-4",
                    "ai-development-explanation-node-2",
                    "ai-development-explanation-node-3",
                    "ai-development-explanation-node-1"
                  ],
                  "relations": [
                    "ai-development-explanation-relation-1",
                    "ai-development-explanation-relation-2",
                    "ai-development-explanation-relation-3"
                  ],
                  "flows": [
                    "ai-development-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ai-development-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ai-development"
                      ],
                      "claims": [
                        "ai-development-claim-cooperation-1"
                      ],
                      "nodes": [
                        "ai-development-explanation-node-4"
                      ],
                      "relations": [
                        "ai-development-explanation-relation-1"
                      ],
                      "flows": [
                        "ai-development-flow"
                      ]
                    },
                    "text": "AI development allows the development actor and its generated artifacts to be managed separately. Restricting the actor's tool and resource authority through Sandbox limits the effects of misjudgments during development. Routing generated artifacts through the ordinary model, CAR, review, and admission process checks defects before introduction into applications. Together, these mechanisms control development-time effects and artifact quality separately."
                  },
                  {
                    "id": "ai-development-block-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ai-development"
                      ],
                      "claims": [
                        "ai-development-claim-2"
                      ],
                      "nodes": [
                        "ai-development-explanation-node-2"
                      ],
                      "relations": [
                        "ai-development-explanation-relation-1",
                        "ai-development-explanation-relation-2"
                      ],
                      "flows": [
                        "ai-development-flow"
                      ]
                    },
                    "text": "sm-workflow manages development stages and accumulated verification results, while CAR lint and CBD Review check mechanical violations and design issues in generated artifacts. Feeding findings into correction and revalidation provides adoption decisions with evidence from shared criteria beyond the generating AI's own assessment."
                  },
                  {
                    "id": "ai-development-block-4",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ai-development"
                      ],
                      "claims": [
                        "ai-development-claim-4"
                      ],
                      "nodes": [
                        "ai-development-explanation-node-3"
                      ],
                      "relations": [
                        "ai-development-explanation-relation-2",
                        "ai-development-explanation-relation-3"
                      ],
                      "flows": [
                        "ai-development-flow"
                      ]
                    },
                    "text": "Human review is included for high-authority operations, exceptions to standard paths, and consequential admission and release decisions. It connects automated findings with judgments about acceptable business effects and exceptions."
                  },
                  {
                    "id": "ai-development-block-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "ai-development"
                      ],
                      "claims": [
                        "ai-development-claim-1"
                      ],
                      "nodes": [
                        "ai-development-explanation-node-1"
                      ],
                      "relations": [
                        "ai-development-explanation-relation-3"
                      ],
                      "flows": [
                        "ai-development-flow"
                      ]
                    },
                    "text": "Artifact assessment is based on contract conformance and verification results, whether the author is AI or human. Shared checks preserve the same adoption criteria across generation methods."
                  },
                  {
                    "id": "ai-development-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "ai-development"
                  }
                ],
                "sections": []
              }
            ]
