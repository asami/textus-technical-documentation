                            "simple-entity-security-foundation-relation-2",
                            "simple-entity-security-foundation-relation-3"
                          ],
                          "flows": [
                            "simple-entity-security-foundation-flow"
                          ]
                        }
                      },
                      {
                        "id": "simple-entity-security-foundation-paragraph-4",
                        "kind": "paragraph",
                        "text": "The same metadata and decision paths support authorization based on roles, relationships, attributes, and state. The next section explains how these methods divide responsibility for grants and conditions.",
                        "coreRefs": {
                          "steps": [
                            "simple-entity-security-foundation"
