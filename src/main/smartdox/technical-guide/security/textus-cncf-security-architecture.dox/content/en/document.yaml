    "nodes": [
      {
        "nodeRef": "purpose-explanation-node-1",
        "text": "Design authority and boundaries in the architecture"
      },
      {
        "nodeRef": "purpose-explanation-node-2",
        "text": "Address different causes at shared authority boundaries"
      },
      {
        "nodeRef": "purpose-explanation-node-3",
        "text": "Treat authority and resource boundaries as shared design concerns"
      },
      {
        "nodeRef": "cbd-explanation-node-foundation",
        "text": "CBD as a foundation of SimpleModeling"
      },
      {
        "nodeRef": "cbd-explanation-node-1",
        "text": "CBD structure limits interaction points and dependencies"
      },
      {
        "nodeRef": "cbd-explanation-node-2",
        "text": "Independent components share security mechanisms"
      },
      {
        "nodeRef": "cbd-explanation-node-3",
        "text": "Combine compartment structure, boundary controls, and internal controls"
      },
      {
        "nodeRef": "model-driven-explanation-node-foundation",
        "text": "Model-driven properties used by SimpleModeling"
      },
      {
        "nodeRef": "model-driven-explanation-node-1",
        "text": "Make business meaning and protection conditions explicit and inspectable"
      },
      {
        "nodeRef": "model-driven-explanation-node-2",
        "text": "Carry conditions consistently from shared models into implementations"
      },
      {
        "nodeRef": "model-driven-explanation-node-3",
        "text": "Constrain authority and dangerous operations through model-based generation"
      },
      {
        "nodeRef": "model-driven-explanation-node-4",
        "text": "Carry model conditions into deployment and runtime checks"
      },
      {
        "nodeRef": "application-boundary-explanation-node-1",
        "text": "Keep server protection independent of Presentation checks"
      },
      {
        "nodeRef": "application-boundary-explanation-node-2",
        "text": "Application ingress verification and bounded authority"
      },
      {
        "nodeRef": "application-boundary-explanation-node-3",
        "text": "Limit effects on Domain regardless of UI technology"
      },
      {
        "nodeRef": "application-boundary-explanation-node-4",
        "text": "Authorize in Domain after admission"
      },
      {
        "nodeRef": "tiers-explanation-node-1",
        "text": "Bound Application functionality, authority, and destinations with Cloud Function First"
      },
      {
        "nodeRef": "tiers-explanation-node-2",
        "text": "Control operations, data, rules, and resources within Domain"
      },
      {
        "nodeRef": "tiers-explanation-node-3",
        "text": "Do not assume trust in Presentation using other technologies"
      },
      {
        "nodeRef": "function-realization-explanation-node-1",
        "text": "Generate a complete Container and eligible Cloud Functions"
      },
      {
        "nodeRef": "function-realization-explanation-node-2",
        "text": "Retain the same contracts and authority boundaries in Containers"
      },
      {
        "nodeRef": "function-realization-explanation-node-3",
        "text": "Small processing units and limited authority contain public-tier impact"
      },
      {
        "nodeRef": "traffic-admission-explanation-node-1",
        "text": "Cheap ingress checks and downstream concurrency limits"
      },
      {
        "nodeRef": "traffic-admission-explanation-node-2",
        "text": "Assign distinct roles to input constraints and admission"
      },
      {
        "nodeRef": "traffic-admission-explanation-node-3",
        "text": "Resource protection still requires business authorization"
      },
      {
        "nodeRef": "identity-and-authorization-explanation-node-1",
        "text": "Transfer common authentication state; authorize at the destination"
      },
      {
        "nodeRef": "identity-and-authorization-explanation-node-2",
        "text": "Authentication, Operation authorization, Entity authorization, and Sandbox"
      },
      {
        "nodeRef": "identity-and-authorization-explanation-node-3",
        "text": "Authentication establishes the subject, and shared decision paths use SimpleEntity metadata and default permissions to apply baseline protection. Application-specific rules use the same paths, so additional authorization methods do not require separate decision engines in each component."
      },
      {
        "nodeRef": "identity-and-authorization-explanation-node-4",
        "text": "Address defects in authorized processing"
      },
      {
        "nodeRef": "sandbox-explanation-node-1",
        "text": "Safety Sandbox limits unauthorized resource actions arising from malicious code, bugs, operational mistakes, and AI errors."
      },
      {
        "nodeRef": "sandbox-explanation-node-2",
        "text": "ExecutionContext, SandboxContext, Capability, and ExecutionLimits constrain authority and resource consumption for files, networks, processes, HTTP, DataStores, and external services."
      },
      {
        "nodeRef": "sandbox-explanation-node-3",
        "text": "Instructions and Skills guide AI behavior. Sandbox complements that guidance with technical restrictions by rejecting operations not admitted by the runtime."
      },
      {
        "nodeRef": "sandbox-explanation-node-4",
        "text": "Hard limits cannot be exceeded by the execution subject. Soft limits can be adjusted within those bounds by an authorized execution context. Authority to use a resource and the amount that may be consumed are configured separately."
      },
      {
        "nodeRef": "sandbox-explanation-node-5",
        "text": "Runtime limits still leave defects within permitted scope"
      },
      {
        "nodeRef": "auth-cache-explanation-node-1",
        "text": "Control storage, capacity, TTL, and reference validity"
      },
      {
        "nodeRef": "auth-cache-explanation-node-2",
        "text": "On misses use User Management, then User DB if needed"
      },
      {
        "nodeRef": "auth-cache-explanation-node-3",
        "text": "Assess shared caching by benefit and protection cost"
      },
      {
        "nodeRef": "auth-cache-explanation-node-4",
        "text": "Reuse lookups to reduce load while retaining Domain authorization"
      },
      {
        "nodeRef": "safe-application-paths-explanation-node-1",
        "text": "Authorization and implementation correctness are distinct"
      },
      {
        "nodeRef": "safe-application-paths-explanation-node-2",
        "text": "Combine models, standard APIs, and data minimization"
      },
      {
        "nodeRef": "safe-application-paths-explanation-node-3",
        "text": "Reduce dangerous operations and retained sensitive data"
      },
      {
        "nodeRef": "safe-application-paths-explanation-node-4",
        "text": "Connect escape hatches to pre-deployment inspection"
      },
      {
        "nodeRef": "safe-by-construction-explanation-node-1",
        "text": "Use typed APIs and models as the normal path"
      },
      {
        "nodeRef": "safe-by-construction-explanation-node-2",
        "text": "Identify dangerous direct operations as escape hatches"
      },
      {
        "nodeRef": "safe-by-construction-explanation-node-3",
        "text": "Constrain SQL, output, mutation, and input paths"
      },
      {
        "nodeRef": "safe-by-construction-explanation-node-4",
        "text": "Standard paths, escape-hatch review, and Sandbox complement each other"
      },
      {
        "nodeRef": "sensitive-information-explanation-node-1",
        "text": "Choose retention and delegation by classification"
      },
      {
        "nodeRef": "sensitive-information-explanation-node-2",
        "text": "Apply classification to retention and observations"
      },
      {
        "nodeRef": "sensitive-information-explanation-node-3",
        "text": "Verify the delegated boundary as well"
      },
      {
        "nodeRef": "car-explanation-node-1",
        "text": "Distribute immutable CARs with identified versions and content"
      },
      {
        "nodeRef": "car-explanation-node-2",
        "text": "Collect contracts, authority, dependencies, and code"
      },
      {
        "nodeRef": "car-explanation-node-3",
        "text": "Inspect and reuse contracts and implementation as one artifact"
      },
      {
        "nodeRef": "car-explanation-node-4",
        "text": "Connect content assessment and local authority decisions to runtime boundaries"
      },
      {
        "nodeRef": "function-packaging-explanation-node-1",
        "text": "Shared TypeScript with thin platform adapters"
      },
      {
        "nodeRef": "function-packaging-explanation-node-2",
        "text": "Align inspected and distributed artifacts and deliver shared-code fixes"
      },
      {
        "nodeRef": "function-packaging-explanation-node-3",
        "text": "Reduce variation through common checks and localized adapters"
      },
      {
        "nodeRef": "local-testing-explanation-node-1",
        "text": "Detect regressions through repeatable Local/Test checks"
      },
      {
        "nodeRef": "local-testing-explanation-node-2",
        "text": "Stage core, boundary, integration, and cloud checks"
      },
      {
        "nodeRef": "local-testing-explanation-node-3",
        "text": "Detect authorization, rejection, and state-change discrepancies with shared specifications"
      },
      {
        "nodeRef": "local-testing-explanation-node-4",
        "text": "Separate common-contract checks from cloud permission and reachability checks"
      },
      {
        "nodeRef": "lint-admission-explanation-node-1",
        "text": "Separate static violations from semantic/design judgments"
      },
      {
        "nodeRef": "lint-admission-explanation-node-2",
        "text": "Separate check success from authority admission"
      },
      {
        "nodeRef": "lint-admission-explanation-node-3",
        "text": "Retain execution limits after admission"
      },
      {
        "nodeRef": "ai-development-explanation-node-1",
        "text": "Apply the same contracts and evidence criteria across generation methods"
      },
      {
        "nodeRef": "ai-development-explanation-node-2",
        "text": "Carry inspection, correction, and revalidation evidence into adoption"
      },
      {
        "nodeRef": "ai-development-explanation-node-3",
        "text": "Connect high-authority operations, exceptions, and key decisions to human review"
      },
      {
        "nodeRef": "ai-development-explanation-node-4",
        "text": "Separate actor authority limits from artifact inspection"
      },
      {
        "nodeRef": "operations-and-recovery-explanation-node-1",
        "text": "Anomalies that remain after prevention and constraint"
      },
      {
        "nodeRef": "operations-and-recovery-explanation-node-2",
        "text": "Audit and observation records collected through shared paths support examination of operation history and incident impact. Responses select authority revocation, communication isolation, and runtime replacement, followed by persistent-state checks and business recovery. The HA and rotation arrangements below are deployment and operational configurations that support this response."
      },
      {
        "nodeRef": "operations-and-recovery-explanation-node-3",
        "text": "Use compartment authority and common observations to scope response"
      },
      {
        "nodeRef": "operations-and-recovery-explanation-node-4",
        "text": "Distinguish replaceability from state correctness"
      },
      {
        "nodeRef": "observability-explanation-node-1",
        "text": "Diagnose using correlated evidence across layers"
      },
      {
        "nodeRef": "observability-explanation-node-2",
        "text": "Retain diagnostic evidence while limiting secret replication"
      },
      {
        "nodeRef": "observability-explanation-node-3",
        "text": "Relating audit records and diagnostics to Component authority, dependencies, and deployment configuration supports cross-component impact investigation and selection of revocation, isolation, and replacement targets. This connects recording mechanisms to audits and incident response."
      },
      {
        "nodeRef": "immutable-runtime-explanation-node-1",
        "text": "The Domain uses a Primary for new mutations and Read Replicas for authorized reads. Standby describes readiness for promotion, which is checked separately from read service. Prepared replacements are designed to combine memory-resident responsiveness with replaceable environments."
      },
      {
        "nodeRef": "immutable-runtime-explanation-node-2",
        "text": "Support isolation with reconstructible artifacts and prepared replacements"
      },
      {
        "nodeRef": "immutable-runtime-explanation-node-3",
        "text": "Align runtime roles with switchability"
      },
      {
        "nodeRef": "runtime-rotation-explanation-node-1",
        "text": "During planned replacement, new read/update admission moves to ready B while former Primary A continues only admitted updates and required completion work. Start replacement Read Replica C and propagate late A commits to B/C. Keep A synchronized until old outcomes settle and replacement capacity, retention/observation and switch-back conditions are satisfied."
      },
      {
        "nodeRef": "runtime-rotation-explanation-node-2",
        "text": "Do not discard a former Primary solely on a scheduled time or elapsed retention. Regular replacement exercises startup, readiness, transfer and drain; daily cadence is not a fixed default. Failover rejects invalid-authority effects at actual storage/execution boundaries and requires valid takeover authority and readiness. Planned fallback policy does not permit returning to a suspected compromised environment."
      },
      {
        "nodeRef": "runtime-rotation-explanation-node-3",
        "text": "This design makes replacement an ordinary operational path rather than an incident-only action. Regular replacement does not replace compromise detection, persistent-state checks or backups. As of 2026-11-13, Phase 108 first-delivery items remain open; integrated update preservation, synchronization and replacement are not claimed implemented."
      },
      {
        "nodeRef": "replace-not-prove-clean-explanation-node-1",
        "text": "Limit authority, detect, contain, replace, and recover"
      },
      {
        "nodeRef": "replace-not-prove-clean-explanation-node-2",
        "text": "Select mechanisms for justified threats"
      },
      {
        "nodeRef": "replace-not-prove-clean-explanation-node-3",
        "text": "Recover separately from effects replacement cannot undo"
      },
      {
        "nodeRef": "lifecycle-explanation-node-1",
        "text": "Place defensive roles across the lifecycle"
      },
      {
        "nodeRef": "lifecycle-explanation-node-2",
        "text": "Prevention, constraint, verification, observation, containment, recovery"
      },
      {
        "nodeRef": "lifecycle-explanation-node-3",
        "text": "The six roles complement each other beyond a linear process"
      },
      {
        "nodeRef": "control-matrix-explanation-node-1",
        "text": "Map threats, controls, complements, and limits"
      },
      {
        "nodeRef": "control-matrix-explanation-node-2",
        "text": "Check combinations and limits for each threat"
      },
      {
        "nodeRef": "authentication-subjects-expanded-node-1",
        "text": "Distinguish people, services, and subsystems"
      },
      {
        "nodeRef": "authentication-subjects-expanded-node-2",
        "text": "Separate method-specific verification from common mechanics"
      },
      {
        "nodeRef": "authentication-subjects-expanded-node-3",
        "text": "Verify and explicitly link external subjects to internal accounts"
      },
      {
        "nodeRef": "authentication-subjects-expanded-node-4",
        "text": "Align subject handling through dedicated verification and normalized results"
      },
      {
        "nodeRef": "auth-handle-expanded-node-1",
        "text": "Normalize authentication state into a shared subject"
      },
      {
        "nodeRef": "auth-handle-expanded-node-2",
        "text": "Cloud Functions pass a reference to authentication state"
      },
      {
        "nodeRef": "auth-handle-expanded-node-3",
        "text": "Share identity resolution while retaining Domain-local authorization"
      },
      {
        "nodeRef": "authorization-decision-expanded-node-1",
        "text": "Textus/CNCF derives effective authority from roles, target-Entity Permission, and subject-target relationships, and checks attributes, state, and execution conditions through Guards. These are evaluated through a shared Capability-and-Guard model."
      },
      {
        "nodeRef": "authorization-decision-expanded-node-2",
        "text": "Derive effective authority from Capability and Permission"
      },
      {
        "nodeRef": "authorization-decision-expanded-node-3",
        "text": "Guards evaluate conditions for exercising authority"
      },
      {
        "nodeRef": "authorization-decision-expanded-node-4",
        "text": "Integrate RBAC, DAC, ReBAC, and ABAC into the same decision"
      },
      {
        "nodeRef": "operation-authorization-expanded-node-1",
        "text": "A common authorization point across ingress types"
      },
      {
        "nodeRef": "operation-authorization-expanded-node-2",
        "text": "Apply model and deployment declarations as runtime rules"
      },
      {
        "nodeRef": "operation-authorization-expanded-node-3",
        "text": "Invocation permission is distinct from target-data permission"
      },
      {
        "nodeRef": "entity-authorization-expanded-node-1",
        "text": "Authorize concrete resource access separately"
      },
      {
        "nodeRef": "entity-authorization-expanded-node-2",
        "text": "For existing Entities, Permission and relationships map to required authority for read, update, delete, and other actions. When an execution projection lacks required permission metadata, the canonical persisted record is consulted. Creation is authorized at collection or resource-class level; search/list under user permissions also restricts result visibility."
      },
      {
        "nodeRef": "entity-authorization-expanded-node-3",
        "text": "Declare service-internal and system authority explicitly"
      },
      {
        "nodeRef": "entity-authorization-expanded-node-4",
        "text": "Keep implementation paths within both authorization stages"
      },
      {
        "nodeRef": "capability-context-expanded-node-1",
        "text": "Carry runtime-managed ExecutionContext through processing"
      },
      {
        "nodeRef": "capability-context-expanded-node-2",
        "text": "Connect authorization and resource control through shared subjects and conditions"
      },
      {
        "nodeRef": "domain-ingress-expanded-node-1",
        "text": "Receive user and calling-service identity information"
      },
      {
        "nodeRef": "domain-ingress-expanded-node-2",
        "text": "Join the normal Operation and UnitOfWork authorization stages"
      },
      {
        "nodeRef": "repository-signature-expanded-node-1",
        "text": "Separate content assessment from artifact authenticity"
      },
      {
        "nodeRef": "repository-signature-expanded-node-2",
        "text": "Bind assessed, signed, and distributed artifacts"
      },
      {
        "nodeRef": "repository-signature-expanded-node-3",
        "text": "Connect publisher keys to an established trust root"
      },
      {
        "nodeRef": "repository-signature-expanded-node-4",
        "text": "Distinguish signed use from the general retrieval contract"
      },
      {
        "nodeRef": "component-repository-expanded-node-1",
        "text": "Associate checks and signatures with the distribution unit"
      },
      {
        "nodeRef": "component-repository-expanded-node-2",
        "text": "Verify the downloaded CAR before admitting those bytes to cache"
      },
      {
        "nodeRef": "component-repository-expanded-node-3",
        "text": "Use provenance and assessment in component selection"
      },
      {
        "nodeRef": "component-repository-expanded-node-4",
        "text": "Check local authority, dependencies, and update conditions"
      },
      {
        "nodeRef": "tiers-node-term-definition",
        "text": "Separate Presentation, Application, and Domain responsibilities"
      },
      {
        "nodeRef": "function-realization-node-term-definition",
        "text": "Cloud Function meaning and execution form"
      },
      {
        "nodeRef": "function-realization-node-ephemeral-execution",
        "text": "Short-lived execution and environment reuse"
      },
      {
        "nodeRef": "immutable-runtime-node-lifetime-control",
        "text": "Models and tier separation limit functionality, authority, and reachable paths, while immutable artifacts allow runtime reconstruction. Replacement isolates a problematic runtime and returns execution to a known configuration."
      },
      {
        "nodeRef": "immutable-runtime-node-lifecycle-concepts",
        "text": "Distinguish replacement method from lifetime"
      },
      {
        "nodeRef": "immutable-runtime-node-persistence-boundaries",
        "text": "CNCF deliberately uses memory for acceleration without leaving continuity-critical state solely in one process. Domain rules and UnitOfWork govern authoritative commits, from which caches and Views can be reconstructed. Preserving committed data across replacement must be qualified with the storage durability contract and recovery procedure. Intermediate computation and uncertain outcomes remain distinct from committed data."
      },
      {
        "nodeRef": "immutable-runtime-node-replacement-limits",
        "text": "Protect replacement, credentials, and persistent state together"
      },
      {
        "nodeRef": "immutable-runtime-node-performance-security-balance",
        "text": "The figure sketches Application reuse/disposal and Domain preparation/rotation. Its Active corresponds to Primary in the text; Standby denotes promotion readiness. Read Replica service and old-runtime retention/retirement follow the text conditions. Widths are not elapsed time."
      },
      {
        "nodeRef": "full-set-scope-node-argument-1",
        "text": "Protection covers authentication, operation and data authorization, input/output handling, runtime resource limits, artifact trust, auditing, observation, and recovery. A full set refers to systematic coverage of this lifecycle. Each section distinguishes mechanisms applied through standard paths, configurations selected for particular uses, and planned additions."
      },
      {
        "nodeRef": "full-set-scope-node-argument-2",
        "text": "For an order update, identifying the user is only one requirement. Permission to invoke the update, access to the target order, input constraints, and conditions for changing business state must also be checked. Inspection of the deployed implementation and resource limits provide additional protection. If an anomaly occurs, observations must connect the actor and order change to revocation and recovery. Supporting that complete path through shared infrastructure makes the full-set goal concrete."
      },
      {
        "nodeRef": "full-set-scope-node-argument-3",
        "text": "Understanding each mechanism requires identifying what it protects, where it is enforced, who defines its rules, and what it passes to other mechanisms. This guide explains the architecture at that technical depth. Protocol details, complete API specifications, configuration catalogs, and implementation algorithms are developed in dedicated technical articles and specifications."
      },
      {
        "nodeRef": "developer-security-contract-node-argument-1",
        "text": "Developers define business structures, operations, and state changes in CML and configure authentication methods and business visibility. Defaults supply basic permissions, with application-specific roles, relationships, and conditions added where required. The platform supplies decision mechanisms, while models and configuration express business policy."
      },
      {
        "nodeRef": "developer-security-contract-node-argument-2",
        "text": "Running CML Operations and Entities through standard paths invokes shared mechanisms for authenticated-subject propagation, operation and target-data authorization, and audit recording. Developers do not need to add these calls to each business handler. The authentication and authorization chapter explains UNIX-style target-Entity permissions and the authorization methods combined with them."
      },
      {
        "nodeRef": "developer-security-contract-node-argument-3",
        "text": "For example, allowing a department’s assigned staff to update only in-progress orders requires rules for department, assignment, and order state. Shared infrastructure applies these rules at operation and target-data checkpoints."
      },
      {
        "nodeRef": "security-foundations-node-argument-1",
        "text": "Textus/CNCF provides the main security mechanisms needed by ordinary business applications through shared infrastructure. CML definitions and standard execution and operation paths apply baseline protection. Defaults prioritize ease of adoption and daily operation, especially reducing the burden on beginners of assembling individual mechanisms."
      },
      {
        "nodeRef": "security-foundations-node-argument-2",
        "text": "Business-specific authorization rules and, where needed, capability restrictions, compartment isolation, and recovery arrangements build on this baseline. The guide explains the roles and connections of these mechanisms, then presents the planned patterns, profiles, and guides for selecting application-appropriate configurations."
      },
      {
        "nodeRef": "standard-development-path-node-argument-1",
        "text": "Bind CBD boundaries and modeled conditions to the same component"
      },
      {
        "nodeRef": "standard-development-path-node-argument-2",
        "text": "Associate inspection results with CARs for distribution and admission"
      },
      {
        "nodeRef": "standard-development-path-node-argument-3",
        "text": "Make business models into protection conditions the platform can apply"
      },
      {
        "nodeRef": "distribution-trust-node-argument-1",
        "text": "Carrying assessment results to consumers requires relating the assessed contents to what is deployed. Signatures establish publisher and content identity, Component Repositories provide a shared distribution path, and consumer-side admission checks suitability for local deployment conditions and authority policies."
      },
      {
        "nodeRef": "distribution-trust-node-argument-2",
        "text": "Component contracts and inspection results are carried to the destination, where granted authority is determined. Connecting admission to the runtime controls in the next chapter combines reuse of assessed components with destination-specific authority limits."
      },
      {
        "nodeRef": "security-coverage-node-argument-1",
        "text": "Admitted components run through shared authentication and authorization paths that apply the target Component or Domain’s rules. External-request admission, operation and data authorization, input and output protection, and resource limits each address a different boundary."
      },
      {
        "nodeRef": "security-coverage-node-argument-2",
        "text": "The following sections first map threats to controls and then explain each boundary's structure and processing. Identifying decision inputs, enforcement paths, and information passed to the next mechanism makes the connections between controls technically understandable."
      },
      {
        "nodeRef": "provided-scope-node-argument-1",
        "text": "The technology inventory describes the architectural scope that SimpleModeling and Textus aim to provide as a full set. Available capabilities depend on the selected Textus/CNCF release, SARs and CARs, authentication providers, and deployment. For example, a shared authentication path does not determine which external authentication methods have available adapters and configuration."
      },
      {
        "nodeRef": "provided-scope-node-argument-2",
        "text": "Adoption relates each mechanism to its supplying artifact and version, required configuration, and verified behavior. In-development and unsupported items are identified within the same coverage model so that expansion remains explicit. This guide explains design rationale and relationships; confirmed availability is checked against component specifications and release information."
      },
      {
        "nodeRef": "configuration-boundary-node-argument-1",
        "text": "The platform supplies consistent mechanisms for authentication, authorization, constraints, and observation. Business owners and development and operations teams determine permitted business actions, sensitive information, and trusted external services. SimpleModeling conventions provide explicit places for those decisions in models and configuration."
      },
      {
        "nodeRef": "configuration-boundary-node-argument-2",
        "text": "Paths using direct SQL, network, filesystem, or process access outside standard APIs require an explicit assessment of which protections still apply. Identifying escape paths and their authority and checks maintains the connection to shared infrastructure when SARs and CARs are extended."
      },
      {
        "nodeRef": "conclusion-node-argument-1",
        "text": "CML and CBD define targets, operations, and interfaces, and shared infrastructure authorizes authenticated subjects. Standard paths provide baseline protection through UNIX-style Entity permissions and defaults, with application-specific authorization using the same information and decision mechanisms."
      },
      {
        "nodeRef": "conclusion-node-argument-2",
        "text": "Tier trust boundaries, resource controls, and inspection and distribution mechanisms work together, while automatically collected records support auditing, observation, and recovery. The planned patterns, profiles, and guides build on beginner-friendly standard operation to make application-specific hardening easier to select."
      },
      {
        "nodeRef": "delivery-and-responsibility-node-argument-1",
        "text": "Adoption starts with baseline protection through standard paths and business-specific authorization settings. Exposure and information sensitivity guide capability restrictions, compartment isolation, auditing, and recovery configurations."
      },
      {
        "nodeRef": "delivery-and-responsibility-node-argument-2",
        "text": "The following sections cover available components, business-specific settings, and planned operation patterns. They distinguish using existing mechanisms from plans to simplify selection and configuration."
      },
      {
        "nodeRef": "textus-cncf-security-architecture-node-framework-security-goal",
        "text": "An application platform combining independence and shared protection"
      },
      {
        "nodeRef": "textus-cncf-security-architecture-node-standard-path",
        "text": "Apply protection through standard development"
      },
      {
        "nodeRef": "textus-cncf-security-architecture-node-protection-coverage",
        "text": "Authenticated subjects propagate through shared execution context to Operation and target-Entity authorization and resource controls. UNIX-style Entity permissions provide the baseline, combined with application-specific authorization rules."
      },
      {
        "nodeRef": "textus-cncf-security-architecture-node-operational-continuity",
        "text": "During operation, execution and data-mutation records are collected automatically for diagnosis, auditing, and impact investigation. Revocation, isolation, runtime replacement, and recovery are combined according to the selected deployment and operational policy."
      },
      {
        "nodeRef": "textus-cncf-security-architecture-node-adoption-scope",
        "text": "The guide distinguishes baseline mechanisms used in ordinary development and operation from application-specific authorization and deployment or operational hardening. Planned operation patterns, profiles, and guides aim to combine them through a small number of settings."
      },
      {
        "nodeRef": "simplemodeling-overview-node-1",
        "text": "Literate models and shared knowledge"
      },
      {
        "nodeRef": "simplemodeling-overview-node-2",
        "text": "Five connected technical disciplines"
      },
      {
        "nodeRef": "simplemodeling-overview-node-3",
        "text": "Knowledge processing and generative AI"
      },
      {
        "nodeRef": "cml-cozy-execution-node-1",
        "text": "CML describes business structures, behavior, and constraints, and Textus directly interprets and executes executable models. Cozy generates typed APIs, implementation connections, and component structures. Direct model execution and code generation connect application-specific supplementary processing to standard execution paths."
      },
      {
        "nodeRef": "cml-cozy-execution-node-2",
        "text": "Carrying modeled operations, state, and constraints into execution reduces repeated manual translations of business concepts. Supplementary implementations follow the same contracts and authority boundaries."
      },
      {
        "nodeRef": "cml-cozy-execution-node-3",
        "text": "Carrying constraints into runtime protection"
      },
      {
        "nodeRef": "textus-overview-node-1",
        "text": "Shared execution and operational infrastructure"
      },
      {
        "nodeRef": "textus-overview-node-2",
        "text": "Composition and distribution units"
      },
      {
        "nodeRef": "textus-overview-node-3",
        "text": "Authentication, authorization, input/output protection, resource limits, auditing, and observation are integrated into standard invocation, data-access, and resource-use paths. CML definitions and basic configuration connect to these paths, reducing per-handler security implementation."
      },
      {
        "nodeRef": "overall-architecture-node-1",
        "text": "Relating knowledge and models"
      },
      {
        "nodeRef": "overall-architecture-node-2",
        "text": "Connecting Cozy to Textus"
      },
      {
        "nodeRef": "overall-architecture-node-3",
        "text": "Cloud execution and operational feedback"
      },
      {
        "nodeRef": "security-position-node-1",
        "text": "Apply modeled conditions at CBD interfaces"
      },
      {
        "nodeRef": "security-position-node-2",
        "text": "Shared mechanisms and the external Presentation trust boundary"
