                      "flows": [
                        "observability-flow"
                      ]
                    }
                  },
                  {
                    "id": "observability-audit-use",
                    "kind": "paragraph",
                    "text": "Observability diagnoses behavior and anomalies; auditing examines operation history and authority use using primary facts such as Events. Identifiers connect the two, while retention and read permissions follow each purpose. Entity creation/update metadata provides attribution cues and is used alongside Events and audit records that represent operation history.",
                    "coreRefs": {
                      "steps": [
                        "observability"
                      ],
                      "claims": [
                        "observability-claim-audit-use",
                        "observability-claim-distinct-diagnostic-audit-lifecycles"
