                      ]
                    },
                    "text": "The Textus/CNCF Security Harness conceptually forms the following lifecycle."
                  },
                  {
                    "id": "lifecycle-block-2",
                    "kind": "list",
                    "coreRefs": {
                      "steps": [
                        "lifecycle"
                      ],
                      "claims": [
                        "lifecycle-claim-2",
