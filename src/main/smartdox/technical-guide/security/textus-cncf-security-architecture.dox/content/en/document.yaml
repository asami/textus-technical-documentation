      {
        "nodeRef": "security-position-node-3",
        "text": "Connect development to distribution, execution, and operation"
      },
      {
        "nodeRef": "simplemodeling-textus-introduction-node-1",
        "text": "From SimpleModeling to Textus"
      },
      {
        "nodeRef": "simplemodeling-textus-introduction-node-2",
        "text": "From the architecture to security"
      },
      {
        "nodeRef": "textus-cncf-security-architecture-node-architecture-foundation",
        "text": "The overall SimpleModeling and Textus architecture"
      },
      {
        "nodeRef": "simplemodeling-textus-introduction-node-security-position",
        "text": "Security across development, execution, and operations"
      },
      {
        "nodeRef": "component-security-boundaries-node-1",
        "text": "Inspect components with explicit contracts"
      },
      {
        "nodeRef": "component-security-boundaries-node-2",
        "text": "Apply component-specific rules at shared checkpoints"
      },
      {
        "nodeRef": "component-security-boundaries-node-3",
        "text": "Define isolation and replacement scope in deployment"
      },
      {
        "nodeRef": "shared-security-mechanisms-node-1",
        "text": "Reduce per-component security integration"
      },
      {
        "nodeRef": "shared-security-mechanisms-node-2",
        "text": "Share mechanisms while retaining component-specific policies"
      },
      {
        "nodeRef": "shared-security-mechanisms-node-3",
        "text": "Combine independence with system-wide operation"
      },
      {
        "nodeRef": "tiers-node-layered-protection",
        "text": "Limit permission expansion through controls between and within tiers"
      },
      {
        "nodeRef": "simple-entity-security-foundation-node-1",
        "text": "Object-side information is a prerequisite for authorization"
      },
      {
        "nodeRef": "simple-entity-security-foundation-node-2",
        "text": "SimpleEntity provides common decision inputs"
      },
      {
        "nodeRef": "simple-entity-security-foundation-node-3",
        "text": "Standard paths supply ownership and permissions when an Entity is created. Paths operating under user permissions automatically check owner/group/other read/write rights. The following table shows business-Entity defaults; public content uses explicit profiles such as public-read. Service-internal and framework execution modes are distinguished in the UnitOfWork authorization section."
      },
      {
        "nodeRef": "simple-entity-security-foundation-node-4",
        "text": "The same metadata and decision paths support authorization based on roles, relationships, attributes, and state. The next section explains how these methods divide responsibility for grants and conditions."
      },
      {
