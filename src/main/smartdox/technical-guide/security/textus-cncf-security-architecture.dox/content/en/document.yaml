              {
                "id": "simplemodeling-textus-introduction-paragraph-2",
                "kind": "paragraph",
                "text": "Business models are written in CML, and implementations and components generated by Cozy are connected to Textus. The following overview establishes the architecture needed to understand how security controls are applied.",
