                      ],
                      "relations": [
                        "lifecycle-explanation-relation-1",
                        "lifecycle-explanation-relation-2"
                      ],
                      "flows": [
                        "lifecycle-flow"
                      ]
                    },
                    "items": [
                      {
                        "id": "lifecycle-block-2-item-1",
                        "text": "Prevent: input models and standard APIs reduce the need to implement hazardous operations individually.",
                        "coreRefs": {
                          "steps": [
                            "lifecycle"
                          ],
                          "claims": [
                            "lifecycle-claim-2"
                          ],
                          "nodes": [
                            "lifecycle-explanation-node-2"
                          ],
                          "relations": [
                            "lifecycle-explanation-relation-1",
                            "lifecycle-explanation-relation-2"
                          ],
                          "flows": [
                            "lifecycle-flow"
                          ]
                        }
                      },
                      {
                        "id": "lifecycle-block-2-item-2",
                        "text": "Constrain: shared authorization and Sandbox controls enforce component-specific limits at interfaces bounded by CBD.",
                        "coreRefs": {
                          "steps": [
                            "lifecycle"
                          ],
                          "claims": [
                            "lifecycle-claim-3"
                          ],
                          "nodes": [
