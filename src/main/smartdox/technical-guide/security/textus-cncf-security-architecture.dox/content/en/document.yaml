                  {
                    "id": "architecture-security-map-figure",
                    "kind": "figure",
                    "asset": "images/architecture-security-map-en.png",
                    "caption": "Each stage carries specific information forward and contributes protection, from knowledge through execution and operations.",
                    "alt": "Architecture and security enforcement points. Literate models / glossary / BoK / Requirements / meaning / rationale / Share protection goals and rules; CML: business models / Structure / behavior / constraints / Declare inputs, operations, authority; Cozy: generation / composition / Implementation / contracts / SAR / CAR / Carry rules into artifacts; Textus: deployment / execution / Operations / data access / Admission / authorization / limits; Operations / feedback / Observations / fixes / redeployment / Isolation / revocation / recovery",
                    "coreRefs": {
                      "steps": [
                        "overall-architecture"
                      ],
                      "claims": [
                        "overall-architecture-claim-1",
                        "overall-architecture-claim-2",
                        "overall-architecture-claim-3"
                      ],
                      "nodes": [
                        "overall-architecture-node-1",
