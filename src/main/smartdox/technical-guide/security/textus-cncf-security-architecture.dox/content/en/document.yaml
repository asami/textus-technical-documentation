                    ],
                    "sections": []
                  },
                  {
                    "id": "authorization-decision-section",
                    "heading": "The Authorization Decision Model",
                    "coreRefs": {
                      "steps": [
                        "authorization-decision"
                      ],
                      "claims": [
                        "authorization-decision-claim-expanded-1",
                        "authorization-decision-claim-expanded-2",
                        "authorization-decision-claim-expanded-3",
                        "authorization-decision-claim-expanded-4"
                      ],
                      "nodes": [
                        "authorization-decision-expanded-node-1",
                        "authorization-decision-expanded-node-2",
                        "authorization-decision-expanded-node-3",
                        "authorization-decision-expanded-node-4"
                      ],
                      "relations": [
                        "authorization-decision-expanded-relation-1",
                        "authorization-decision-expanded-relation-2",
                        "authorization-decision-expanded-relation-3"
                      ],
                      "flows": [
                        "authorization-decision-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "authorization-decision-expanded-1",
                        "kind": "paragraph",
                        "text": "Textus/CNCF derives effective authority from roles, target-Entity Permission, and subject-target relationships, and checks attributes, state, and execution conditions through Guards. These are evaluated through a shared Capability-and-Guard model.",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-expanded-1"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-1"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-1"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-expanded-2",
                        "kind": "paragraph",
                        "text": "A Capability is an allowed ability to perform an action. In addition to subject grants, target-specific authority is derived from Entity Permission or relationships; permissions for every Entity need not be enumerated on the user.",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-expanded-2"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-2"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-1",
                            "authorization-decision-expanded-relation-2"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-expanded-3",
                        "kind": "paragraph",
                        "text": "A Guard checks conditions under which authority may be used for the current target and context; it does not grant authority. A decision requires both satisfied Guards and effective Capabilities meeting the requested action’s requirements.",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-expanded-3"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-3"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-2",
                            "authorization-decision-expanded-relation-3"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-privilege-baseline",
                        "kind": "paragraph",
                        "text": "Design policy: operational privileges use numeric levels with names such as root, admin, application admin and user. Each level supplies a baseline set of capabilities. Additions and exclusions apply within the assignment’s scope, with exclusions taking precedence. Granting audit-log access to an administrator for application A applies only within A.",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-privilege-baseline"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-3"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-2",
                            "authorization-decision-expanded-relation-3"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-privilege-entity-access",
                        "kind": "paragraph",
                        "text": "Distinguish the level assigned to a subject from the level required to operate on an Entity. Ordinary Entities default to user; reading a private document still requires the applicable ownership or object-access checks. Changing the owner does not assign a privilege level. A subject exercising root through the trusted management route can read and update every Entity, including management-only records. Application routes exclude management-only records from direct reads, lists, search results and projections, including requests from that same user.",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-privilege-entity-access"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-3"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-2",
                            "authorization-decision-expanded-relation-3"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-privilege-rollout",
                        "kind": "paragraph",
                        "text": "Implementation plan: initially use a fixed table of levels, operations and scopes. When adopting capability evaluation, verify it against the same allow and deny cases. Existing code paths default the privilege field from the owner, so adoption includes deciding how to interpret persisted values. Numeric assignments and ordering remain to be specified.",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-privilege-rollout"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-3"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-2",
                            "authorization-decision-expanded-relation-3"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-expanded-4",
                        "kind": "paragraph",
                        "text": "The following table relates application-specific methods to configuration inputs. Arbitrary ACL lists are an extension distinct from the current standard Permission model. Execution modes such as ServiceInternal and System are also distinct from user object-level permissions and are used for their explicitly declared purposes.",
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-expanded-4"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-4"
                          ],
                          "relations": [
                            "authorization-decision-expanded-relation-3"
                          ],
                          "flows": [
                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-methods-table",
                        "kind": "table",
                        "caption": "Authorization methods and configuration inputs",
                        "columns": [
                          {
                            "id": "method",
                            "heading": "Method/mechanism"
                          },
                          {
                            "id": "configuration",
                            "heading": "Configuration inputs"
                          },
                          {
                            "id": "effect",
                            "heading": "Application scope"
                          }
                        ],
                        "rows": [
                          {
                            "id": "authorization-method-row-1",
                            "cells": [
                              "RBAC: role-based authorization",
                              "User/service roles and Operation requirements",
                              "Define which business functions staff, administrators, or other roles may use"
                            ]
                          },
                          {
                            "id": "authorization-method-row-2",
                            "cells": [
                              "DAC/Permission: owner and group access",
                              "SimpleEntity owner/group/other read/write/execute rights",
                              "Grant read, update, and other access per target object"
                            ]
                          },
                          {
                            "id": "authorization-method-row-3",
                            "cells": [
                              "ReBAC: subject-target relationships",
                              "Subject/Entity attribute matches and actions granted by a relation",
                              "Allow a customer to read the order they placed"
                            ]
                          },
                          {
                            "id": "authorization-method-row-4",
                            "cells": [
                              "ABAC/Guard: attribute and contextual conditions",
                              "Conditions such as tenant, publication state, and publication window",
                              "Reject out-of-condition targets despite a grant and narrow list visibility"
                            ]
                          },
                          {
                            "id": "authorization-method-row-5",
                            "cells": [
                              "Capability: specific action authority",
