                    "observability-relation-audit-3",
                    "observability-relation-audit-4"
                  ],
                  "flows": [
                    "observability-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "observability-block-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "observability"
                      ],
                      "claims": [
                        "observability-claim-1"
                      ],
                      "nodes": [
                        "observability-explanation-node-1"
                      ],
                      "relations": [
                        "observability-relation-audit-1"
                      ],
                      "flows": [
                        "observability-flow"
                      ]
                    },
                    "text": "In Textus/CNCF, security controls and observability cooperate along shared execution paths. Information from Operations, authorization, the runtime, Subsystems, and infrastructure is collected through the ordinary OTLP path for diagnosis through tools such as Control Center. Execution context and trace or correlation identifiers connect subjects, Components, Operations, target resources, and decisions, allowing control outcomes to be examined alongside processing behavior."
                  },
                  {
                    "id": "observability-audit-collection",
                    "kind": "paragraph",
                    "text": "Along standard Operation-execution and data-mutation paths, the platform automatically collects audit trails. Shared checkpoints such as authorization and persistence record outcomes, while the platform initializes and updates SimpleEntity creation and update identities and timestamps. This reduces per-handler recording code and omissions, supplying evidence of who performed which operation on what target, when, and with what outcome.",
                    "coreRefs": {
                      "steps": [
                        "observability"
                      ],
                      "claims": [
                        "observability-claim-audit-collection"
                      ],
                      "nodes": [
                        "observability-node-audit-collection"
                      ],
                      "relations": [
                        "observability-relation-audit-1",
                        "observability-relation-audit-2"
                      ],
                      "flows": [
                        "observability-flow"
                      ]
                    }
                  },
                  {
                    "id": "security-observation-audit-figure",
                    "kind": "figure",
                    "asset": "images/security-observation-audit-en.png",
                    "caption": "Execution context correlates records for diagnosis and auditing. Entity update metadata and operation history are distinct information.",
                    "alt": "Shared Operation/UnitOfWork checkpoints record diagnostics and audit facts. Trace and correlation IDs connect diagnosis, auditing, impact investigation, and revocation/isolation/recovery.",
                    "coreRefs": {
                      "steps": [
                        "observability"
                      ],
                      "claims": [
                        "observability-claim-cooperation-1",
                        "observability-claim-1",
                        "observability-claim-2",
