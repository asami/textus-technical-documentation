                  "flows": [
                    "overall-architecture-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "overall-architecture-paragraph-1",
                    "kind": "paragraph",
                    "text": "The architecture starts with literate models of requirements and rationale, together with glossaries and the BoK. Domain modeling organizes business structure and behavior, and CML expresses models that lead to execution. Maintaining correspondence among documents, terms, and models shares both what must be implemented and why particular rules are required.",
                    "coreRefs": {
                      "steps": [
                        "overall-architecture"
                      ],
                      "claims": [
                        "overall-architecture-claim-1"
                      ],
                      "nodes": [
