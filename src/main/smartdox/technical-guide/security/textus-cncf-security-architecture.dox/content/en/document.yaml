                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "function-realization-section",
                    "heading": "Limit Public-Tier Impact with Small Cloud Functions and Bounded Authority",
                    "coreRefs": {
                      "steps": [
                        "function-realization"
                      ],
                      "claims": [
                        "function-realization-claim-term-definition",
                        "function-realization-claim-cooperation-1",
                        "function-realization-claim-1",
                        "function-realization-claim-2",
                        "function-realization-claim-ephemeral-execution"
                      ],
                      "nodes": [
                        "function-realization-node-term-definition",
                        "function-realization-explanation-node-3",
                        "function-realization-explanation-node-1",
                        "function-realization-explanation-node-2",
                        "function-realization-node-ephemeral-execution"
                      ],
                      "relations": [
                        "function-realization-relation-term-definition",
                        "function-realization-explanation-relation-1",
                        "function-realization-explanation-relation-2",
                        "function-realization-relation-ephemeral-execution"
                      ],
                      "flows": [
                        "function-realization-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "function-realization-term-definition",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "function-realization"
                          ],
                          "claims": [
                            "function-realization-claim-term-definition"
                          ],
                          "nodes": [
                            "function-realization-node-term-definition"
                          ],
                          "relations": [
                            "function-realization-relation-term-definition"
                          ],
                          "flows": [
                            "function-realization-flow"
                          ]
                        },
                        "text": "Processing in the Application tier runs in a container or as a Cloud Function. A Cloud Function is a unit of processing invoked by a cloud execution platform in response to a request or event."
                      },
                      {
                        "id": "function-realization-cooperation-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "function-realization"
                          ],
                          "claims": [
                            "function-realization-claim-cooperation-1"
                          ],
                          "nodes": [
                            "function-realization-explanation-node-3"
                          ],
                          "relations": [
                            "function-realization-relation-term-definition",
                            "function-realization-explanation-relation-1"
                          ],
                          "flows": [
                            "function-realization-flow"
                          ]
                        },
                        "text": "Cloud Function First is chosen for cost and scalability and for keeping public-tier functionality and authority small. Each Operation-sized function receives only the authority it needs, without unnecessary facilities such as Domain DB access, a CAR Runtime, or arbitrary file operations. It connects to the Domain through public APIs, where operations and target-data access are authorized. Combining the Cloud Function execution unit with these authority and destination restrictions limits the effects of defects or compromise in the Application tier."
                      },
                      {
                        "id": "function-realization-block-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "function-realization"
                          ],
                          "claims": [
                            "function-realization-claim-1"
                          ],
                          "nodes": [
                            "function-realization-explanation-node-1"
                          ],
                          "relations": [
                            "function-realization-explanation-relation-1",
                            "function-realization-explanation-relation-2"
                          ],
                          "flows": [
                            "function-realization-flow"
                          ]
                        },
                        "text": "Applications are modeled in CML as ordinary Services and Operations; cloud-provider concepts are not fundamental modeling elements. Generation produces a complete CNCF Container containing all Application Operations and additionally projects cloud-function-eligible Operations into Cloud Function realizations."
                      },
                      {
                        "id": "function-realization-block-2",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "function-realization"
                          ],
                          "claims": [
                            "function-realization-claim-2"
                          ],
                          "nodes": [
                            "function-realization-explanation-node-2"
                          ],
                          "relations": [
                            "function-realization-explanation-relation-2",
                            "function-realization-relation-ephemeral-execution"
                          ],
                          "flows": [
                            "function-realization-flow"
                          ]
                        },
                        "text": "Cloud Function candidacy and eligibility for deployment to a particular provider are separate decisions. Operations unsuitable for Cloud Functions use the complete Container realization while retaining the responsibility and authority boundaries between Application and Domain. The same business contracts and authority policies apply across choices of execution form."
                      },
                      {
                        "id": "function-realization-ephemeral-execution",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "function-realization"
                          ],
                          "claims": [
                            "function-realization-claim-ephemeral-execution"
                          ],
                          "nodes": [
                            "function-realization-node-ephemeral-execution"
                          ],
                          "relations": [
                            "function-realization-relation-ephemeral-execution"
                          ],
                          "flows": [
                            "function-realization-flow"
                          ]
                        },
                        "text": "Cloud Functions reuse execution environments to meet performance requirements, reducing initialization overhead and response latency. Invocation duration is distinguished from environment lifetime, combining isolation of state between invocations with disposal of environments when no longer needed. Where environments are managed with shorter lifetimes than long-running containers, this can reduce the persistence of compromise. The effect depends on the platform's isolation, reuse, and disposal policies, which are evaluated alongside response performance in the Application tier."
                      },
                      {
                        "id": "function-realization-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "function-realization"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "traffic-admission-section",
                    "heading": "Cloud Functions in the Application tier as a Security and Availability Boundary",
                    "coreRefs": {
                      "steps": [
                        "traffic-admission"
                      ],
                      "claims": [
                        "traffic-admission-claim-4",
                        "traffic-admission-claim-cooperation-1",
                        "traffic-admission-claim-cooperation-2"
                      ],
                      "nodes": [
                        "traffic-admission-explanation-node-1",
                        "traffic-admission-explanation-node-2",
                        "traffic-admission-explanation-node-3"
                      ],
                      "relations": [
                        "traffic-admission-explanation-relation-1",
                        "traffic-admission-explanation-relation-2"
                      ],
                      "flows": [
                        "traffic-admission-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "traffic-admission-block-4",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "traffic-admission"
                          ],
                          "claims": [
                            "traffic-admission-claim-4"
                          ],
                          "nodes": [
                            "traffic-admission-explanation-node-1"
                          ],
                          "relations": [
                            "traffic-admission-explanation-relation-1"
                          ],
                          "flows": [
                            "traffic-admission-flow"
                          ]
                        },
                        "text": "Checks proceed from inexpensive to expensive processing: provider edge/WAF/rate/bot controls, request validation, rejection of obviously invalid credentials, Cloud Function admission, identity resolution, Domain authorization, and finally the Domain Operation. Combining this ordering with bounded downstream concurrency limits the propagation of public-facing load into User Management and Domains."
                      },
                      {
                        "id": "traffic-admission-cooperation-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "traffic-admission"
                          ],
                          "claims": [
                            "traffic-admission-claim-cooperation-1"
                          ],
                          "nodes": [
                            "traffic-admission-explanation-node-2"
                          ],
                          "relations": [
                            "traffic-admission-explanation-relation-1",
                            "traffic-admission-explanation-relation-2"
                          ],
                          "flows": [
                            "traffic-admission-flow"
                          ]
                        },
                        "text": "Model constraints on types, lengths, and counts reject violating requests during parameter validation and reduce unnecessary internal work and memory consumption. Large volumes of otherwise valid requests are a separate issue, handled by rate limits and downstream admission."
                      },
                      {
                        "id": "traffic-admission-cooperation-2",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "traffic-admission"
                          ],
                          "claims": [
                            "traffic-admission-claim-cooperation-2"
                          ],
                          "nodes": [
                            "traffic-admission-explanation-node-3"
                          ],
                          "relations": [
                            "traffic-admission-explanation-relation-2"
                          ],
                          "flows": [
                            "traffic-admission-flow"
                          ]
                        },
                        "text": "These controls form a resource-protection admission boundary. Requests that pass it still require identity resolution by User Management and authorization by each Domain."
                      },
                      {
                        "id": "traffic-admission-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "traffic-admission"
                      }
                    ],
                    "sections": []
                  }
                ]
              },
              {
                "id": "identity-and-authorization-section",
                "heading": "Apply Authority from Identity Resolution Through Execution",
                "coreRefs": {
                  "steps": [
                    "identity-and-authorization"
                  ],
                  "claims": [
                    "identity-and-authorization-claim-problem",
                    "identity-and-authorization-claim-combination",
                    "identity-and-authorization-claim-effect",
                    "identity-and-authorization-claim-boundary"
                  ],
                  "nodes": [
                    "identity-and-authorization-explanation-node-1",
                    "identity-and-authorization-explanation-node-2",
                    "identity-and-authorization-explanation-node-3",
                    "identity-and-authorization-explanation-node-4"
                  ],
                  "relations": [
                    "identity-and-authorization-explanation-relation-1",
                    "identity-and-authorization-explanation-relation-2",
                    "identity-and-authorization-explanation-relation-3"
                  ],
                  "flows": [
                    "identity-and-authorization-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "identity-and-authorization-explanation-problem",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "identity-and-authorization"
                      ],
                      "claims": [
                        "identity-and-authorization-claim-problem"
                      ],
                      "nodes": [
                        "identity-and-authorization-explanation-node-1"
                      ],
                      "relations": [
                        "identity-and-authorization-explanation-relation-1"
                      ],
                      "flows": [
                        "identity-and-authorization-flow"
                      ]
                    },
                    "text": "Requests admitted by the Application are still authorized in the Domain according to subject, operation, and target. Textus shares authentication-state representation and decision mechanisms while applying each Component or Domain’s own rules."
                  },
                  {
                    "id": "authorization-two-boundaries-figure",
                    "kind": "figure",
                    "asset": "images/authorization-two-boundaries-en.png",
                    "caption": "The authenticated subject passes through two authorization boundaries. Shared mechanisms evaluate Entity baseline permissions and application-specific rules and connect allowed/denied outcomes to records.",
                    "alt": "Authentication → Operation authorization → business processing → UnitOfWork target authorization → resource access. Entity permissions, roles, relationships, and Guards feed decisions; outcomes feed audit and observation.",
                    "coreRefs": {
                      "steps": [
                        "identity-and-authorization"
                      ],
                      "claims": [
                        "identity-and-authorization-claim-problem",
                        "identity-and-authorization-claim-combination",
                        "identity-and-authorization-claim-effect",
                        "identity-and-authorization-claim-boundary"
                      ],
                      "nodes": [
                        "identity-and-authorization-explanation-node-1",
                        "identity-and-authorization-explanation-node-2",
                        "identity-and-authorization-explanation-node-3",
                        "identity-and-authorization-explanation-node-4"
                      ],
                      "relations": [
                        "identity-and-authorization-explanation-relation-1",
                        "identity-and-authorization-explanation-relation-2",
                        "identity-and-authorization-explanation-relation-3"
                      ],
                      "flows": [
                        "identity-and-authorization-flow"
                      ]
                    }
                  },
                  {
                    "id": "identity-and-authorization-explanation-combination",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "identity-and-authorization"
                      ],
                      "claims": [
                        "identity-and-authorization-claim-combination"
                      ],
                      "nodes": [
                        "identity-and-authorization-explanation-node-2"
                      ],
                      "relations": [
                        "identity-and-authorization-explanation-relation-1",
                        "identity-and-authorization-explanation-relation-2"
                      ],
                      "flows": [
                        "identity-and-authorization-flow"
                      ]
                    },
                    "text": "A subject-specific authentication provider verifies the user or caller and normalizes the result into internal authentication state and SecuritySubject. Authorization has two stages: permission to invoke an Operation and permission to access target Entities during execution. AuthHandle carries authentication state into this common path for Cloud Function coordination, while Sandbox limits runtime resources."
                  },
                  {
                    "id": "identity-and-authorization-explanation-effect",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "identity-and-authorization"
                      ],
                      "claims": [
                        "identity-and-authorization-claim-effect"
                      ],
                      "nodes": [
                        "identity-and-authorization-explanation-node-3"
                      ],
                      "relations": [
                        "identity-and-authorization-explanation-relation-2",
                        "identity-and-authorization-explanation-relation-3"
                      ],
                      "flows": [
                        "identity-and-authorization-flow"
                      ]
                    },
                    "text": "Authentication establishes the subject, and shared decision paths use SimpleEntity metadata and default permissions to apply baseline protection. Application-specific rules use the same paths, so additional authorization methods do not require separate decision engines in each component."
                  },
                  {
                    "id": "identity-and-authorization-explanation-boundary",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "identity-and-authorization"
                      ],
                      "claims": [
                        "identity-and-authorization-claim-boundary"
                      ],
                      "nodes": [
                        "identity-and-authorization-explanation-node-4"
                      ],
                      "relations": [
                        "identity-and-authorization-explanation-relation-3"
                      ],
                      "flows": [
                        "identity-and-authorization-flow"
                      ]
                    },
                    "text": "Defects in input handling or SQL and HTML construction can still cause problems within admitted authority. The next chapter reduces those defects through models and standard APIs and connects exceptional paths to inspection."
                  },
                  {
                    "id": "identity-and-authorization-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "identity-and-authorization"
                  }
                ],
                "sections": [
                  {
                    "id": "shared-security-mechanisms-section",
                    "heading": "Operate Independent Components Through Shared Authentication and Authorization",
                    "coreRefs": {
                      "steps": [
                        "shared-security-mechanisms"
                      ],
                      "claims": [
                        "shared-security-mechanisms-claim-1",
                        "shared-security-mechanisms-claim-2",
                        "shared-security-mechanisms-claim-3"
                      ],
                      "nodes": [
                        "shared-security-mechanisms-node-1",
                        "shared-security-mechanisms-node-2",
                        "shared-security-mechanisms-node-3"
                      ],
                      "relations": [
                        "shared-security-mechanisms-relation-1",
                        "shared-security-mechanisms-relation-2"
                      ],
                      "flows": [
                        "shared-security-mechanisms-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "shared-security-mechanisms-paragraph-1",
                        "kind": "paragraph",
                        "text": "Componentization still requires custom integration and operational coordination when components differ in how they transfer authentication state and apply authorization. Textus/CNCF shares the representation of subjects, authorization mechanisms, execution context, and audit and observability paths.",
                        "coreRefs": {
                          "steps": [
                            "shared-security-mechanisms"
                          ],
                          "claims": [
                            "shared-security-mechanisms-claim-1"
                          ],
                          "nodes": [
                            "shared-security-mechanisms-node-1"
                          ],
                          "relations": [
                            "shared-security-mechanisms-relation-1"
                          ],
                          "flows": [
                            "shared-security-mechanisms-flow"
                          ]
                        }
                      },
                      {
                        "id": "shared-security-mechanisms-paragraph-2",
                        "kind": "paragraph",
                        "text": "The mechanisms are shared. Each Component or Domain defines the authority and business conditions required for its public operations and managed data. It receives an authenticated subject in a common form and evaluates its own rules; authentication or permission elsewhere does not by itself authorize access to its operations or data.",
                        "coreRefs": {
                          "steps": [
                            "shared-security-mechanisms"
                          ],
                          "claims": [
                            "shared-security-mechanisms-claim-2"
                          ],
                          "nodes": [
                            "shared-security-mechanisms-node-2"
                          ],
                          "relations": [
                            "shared-security-mechanisms-relation-1",
                            "shared-security-mechanisms-relation-2"
                          ],
                          "flows": [
                            "shared-security-mechanisms-flow"
                          ]
                        }
                      },
                      {
                        "id": "shared-security-mechanisms-paragraph-3",
                        "kind": "paragraph",
                        "text": "This arrangement reduces per-component authentication implementations and authorization integration code while applying common decision procedures across entry points and collaborating components. Propagating revocation of authentication state and correlating subjects, operations, targets, and decisions supports system-wide management and operation while preserving component independence.",
                        "coreRefs": {
                          "steps": [
                            "shared-security-mechanisms"
                          ],
                          "claims": [
                            "shared-security-mechanisms-claim-3"
                          ],
                          "nodes": [
                            "shared-security-mechanisms-node-3"
                          ],
                          "relations": [
                            "shared-security-mechanisms-relation-2"
                          ],
                          "flows": [
                            "shared-security-mechanisms-flow"
                          ]
                        }
                      },
                      {
                        "id": "shared-security-mechanisms-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "shared-security-mechanisms"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "authentication-subjects-section",
                    "heading": "Authentication Subjects and Provider Responsibilities",
                    "coreRefs": {
                      "steps": [
                        "authentication-subjects"
                      ],
                      "claims": [
                        "authentication-subjects-claim-expanded-4",
                        "authentication-subjects-claim-expanded-1",
                        "authentication-subjects-claim-expanded-2",
                        "authentication-subjects-claim-expanded-3"
                      ],
                      "nodes": [
                        "authentication-subjects-expanded-node-4",
                        "authentication-subjects-expanded-node-1",
                        "authentication-subjects-expanded-node-2",
                        "authentication-subjects-expanded-node-3"
                      ],
                      "relations": [
                        "authentication-subjects-relation-ordered-1",
                        "authentication-subjects-relation-ordered-2",
                        "authentication-subjects-relation-ordered-3"
                      ],
                      "flows": [
                        "authentication-subjects-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "authentication-subjects-expanded-1",
                        "kind": "paragraph",
                        "text": "Authentication establishes a requesting subject's identity and authentication facts. Subjects include human users, services, and subsystems. A call made on a user's behalf distinguishes the user's identity from the identity of the calling service.",
                        "coreRefs": {
                          "steps": [
                            "authentication-subjects"
                          ],
                          "claims": [
                            "authentication-subjects-claim-expanded-1"
                          ],
                          "nodes": [
                            "authentication-subjects-expanded-node-1"
                          ],
                          "relations": [
                            "authentication-subjects-relation-ordered-1"
                          ],
                          "flows": [
                            "authentication-subjects-flow"
                          ]
                        }
                      },
                      {
                        "id": "authentication-subjects-expanded-2",
                        "kind": "paragraph",
                        "text": "CNCF receives authentication input at ingress and selects a subject-specific provider according to deployment configuration. Human-oriented providers such as textus-user-account manage human accounts, credentials, and sessions; service authentication belongs to a corresponding separate provider. CNCF incorporates successful results into the common execution context.",
                        "coreRefs": {
                          "steps": [
                            "authentication-subjects"
                          ],
                          "claims": [
                            "authentication-subjects-claim-expanded-2"
                          ],
                          "nodes": [
                            "authentication-subjects-expanded-node-2"
                          ],
                          "relations": [
                            "authentication-subjects-relation-ordered-1",
                            "authentication-subjects-relation-ordered-2"
                          ],
                          "flows": [
                            "authentication-subjects-flow"
                          ]
                        }
                      },
                      {
                        "id": "authentication-subjects-expanded-3",
                        "kind": "paragraph",
                        "text": "External-authentication adapters verify method-specific signatures, issuer, audience, expiry, callback state, and related conditions. Verified external subjects map to internal UserAccounts through the provider and a stable subject identifier. This avoids incorrect linking based only on email addresses; external tokens are not used directly as internal sessions or Domain authority. Unverified credentials, disallowed methods, and unregistered adapters fail authentication. Availability of each method depends on implemented adapters and deployment configuration.",
                        "coreRefs": {
                          "steps": [
                            "authentication-subjects"
                          ],
                          "claims": [
                            "authentication-subjects-claim-expanded-3"
                          ],
                          "nodes": [
                            "authentication-subjects-expanded-node-3"
                          ],
                          "relations": [
                            "authentication-subjects-relation-ordered-2",
                            "authentication-subjects-relation-ordered-3"
                          ],
                          "flows": [
                            "authentication-subjects-flow"
                          ]
                        }
                      },
                      {
                        "id": "authentication-subjects-expanded-4",
                        "kind": "paragraph",
                        "text": "Concentrating method-specific verification in dedicated providers and normalizing successful results into common authentication state reduces the places where business code must interpret credentials. Textus/CNCF normalizes human authentication results into internal AccessSession and RefreshSession state and carries them into the shared execution context. Separating method-specific verification from business authorization preserves consistent handling of subjects across entry points.",
                        "coreRefs": {
                          "steps": [
                            "authentication-subjects"
                          ],
                          "claims": [
                            "authentication-subjects-claim-expanded-4"
                          ],
                          "nodes": [
                            "authentication-subjects-expanded-node-4"
                          ],
                          "relations": [
                            "authentication-subjects-relation-ordered-3"
                          ],
                          "flows": [
                            "authentication-subjects-flow"
                          ]
                        }
                      },
                      {
                        "id": "authentication-subjects-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "authentication-subjects"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "auth-handle-section",
                    "heading": "Internal Authentication State and AuthHandle Coordination",
                    "coreRefs": {
                      "steps": [
                        "auth-handle"
                      ],
                      "claims": [
                        "auth-handle-claim-expanded-1",
                        "auth-handle-claim-expanded-2",
                        "auth-handle-claim-expanded-3"
                      ],
                      "nodes": [
                        "auth-handle-expanded-node-1",
                        "auth-handle-expanded-node-2",
                        "auth-handle-expanded-node-3"
                      ],
                      "relations": [
                        "auth-handle-expanded-relation-1",
                        "auth-handle-expanded-relation-2"
                      ],
                      "flows": [
                        "auth-handle-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "auth-handle-expanded-1",
                        "kind": "paragraph",
                        "text": "SecurityContext is the runtime carrier built from authentication results. Authorization uses SecuritySubject, which normalizes authentication state, roles, scopes, groups, capabilities, and business-boundary attributes. Business handlers do not independently reinterpret external claims to construct authority.",
                        "coreRefs": {
                          "steps": [
                            "auth-handle"
                          ],
                          "claims": [
                            "auth-handle-claim-expanded-1"
                          ],
                          "nodes": [
                            "auth-handle-expanded-node-1"
                          ],
                          "relations": [
                            "auth-handle-expanded-relation-1"
                          ],
                          "flows": [
                            "auth-handle-flow"
                          ]
                        }
                      },
                      {
                        "id": "auth-handle-expanded-2",
                        "kind": "paragraph",
                        "text": "Cloud Function coordination uses AuthHandle as an opaque, bounded-lifetime reference to authentication state resolved by central User Management. It is not a UserId, external OAuth token, capability list, or serialized ExecutionContext. Applications pass the reference to target Domains rather than editing it to increase authority.",
                        "coreRefs": {
                          "steps": [
                            "auth-handle"
                          ],
                          "claims": [
                            "auth-handle-claim-expanded-2"
                          ],
                          "nodes": [
                            "auth-handle-expanded-node-2"
                          ],
                          "relations": [
                            "auth-handle-expanded-relation-1",
                            "auth-handle-expanded-relation-2"
                          ],
                          "flows": [
                            "auth-handle-flow"
                          ]
                        }
                      },
                      {
                        "id": "auth-handle-expanded-3",
                        "kind": "paragraph",
                        "text": "An Application Operation coordinating several Domains may reuse the same valid AuthHandle. Each Domain resolves the reference and applies its own authorization policy to operations and resources. Expiry, account or session deactivation, revocation, and cache behavior must be defined together so that stale references do not preserve authority indefinitely.",
                        "coreRefs": {
                          "steps": [
                            "auth-handle"
                          ],
                          "claims": [
                            "auth-handle-claim-expanded-3"
                          ],
                          "nodes": [
                            "auth-handle-expanded-node-3"
                          ],
                          "relations": [
                            "auth-handle-expanded-relation-2"
                          ],
                          "flows": [
                            "auth-handle-flow"
                          ]
                        }
                      },
                      {
                        "id": "auth-handle-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "auth-handle"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "domain-ingress-section",
                    "heading": "Connect Domain API for Cloud Functions to the Common Authorization Path",
                    "coreRefs": {
                      "steps": [
                        "domain-ingress"
                      ],
                      "claims": [
                        "domain-ingress-claim-expanded-1",
                        "domain-ingress-claim-expanded-2"
                      ],
                      "nodes": [
                        "domain-ingress-expanded-node-1",
                        "domain-ingress-expanded-node-2"
                      ],
                      "relations": [
                        "domain-ingress-expanded-relation-1"
                      ],
                      "flows": [
                        "domain-ingress-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "domain-ingress-expanded-1",
                        "kind": "paragraph",
                        "text": "Domain API for Cloud Functions receives the Operation request, AuthHandle, calling Cloud Function or service identity, and required observation context. It resolves them at the trust boundary and normalizes them into Domain SecurityContext and ExecutionContext. Arbitrary Application-supplied claims do not become authority.",
                        "coreRefs": {
                          "steps": [
                            "domain-ingress"
                          ],
                          "claims": [
                            "domain-ingress-claim-expanded-1"
                          ],
                          "nodes": [
                            "domain-ingress-expanded-node-1"
                          ],
                          "relations": [
                            "domain-ingress-expanded-relation-1"
                          ],
                          "flows": [
                            "domain-ingress-flow"
                          ]
                        }
                      },
                      {
                        "id": "domain-ingress-expanded-2",
                        "kind": "paragraph",
                        "text": "After normalization, requests enter the ordinary Operation path, pass Operation authorization, and execute ActionCall. UnitOfWork requests issued by that processing receive target-resource authorization. The Domain uses the same decision path regardless of the Application execution form or the Presentation technology outside it.",
                        "coreRefs": {
                          "steps": [
                            "domain-ingress"
                          ],
                          "claims": [
                            "domain-ingress-claim-expanded-2"
                          ],
                          "nodes": [
                            "domain-ingress-expanded-node-2"
                          ],
                          "relations": [
                            "domain-ingress-expanded-relation-1"
                          ],
                          "flows": [
                            "domain-ingress-flow"
                          ]
                        }
                      },
                      {
                        "id": "domain-ingress-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "domain-ingress"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "simple-entity-security-foundation-section",
                    "heading": "Establish Authorization Foundations with SimpleEntity Metadata and Defaults",
                    "coreRefs": {
                      "steps": [
                        "simple-entity-security-foundation"
                      ],
                      "claims": [
                        "simple-entity-security-foundation-claim-1",
                        "simple-entity-security-foundation-claim-2",
                        "simple-entity-security-foundation-claim-3",
                        "simple-entity-security-foundation-claim-4",
                        "simple-entity-security-foundation-claim-unix-permission-baseline"
                      ],
                      "nodes": [
                        "simple-entity-security-foundation-node-1",
                        "simple-entity-security-foundation-node-2",
                        "simple-entity-security-foundation-node-3",
                        "simple-entity-security-foundation-node-4"
                      ],
                      "relations": [
                        "simple-entity-security-foundation-relation-1",
                        "simple-entity-security-foundation-relation-2",
                        "simple-entity-security-foundation-relation-3"
                      ],
                      "flows": [
                        "simple-entity-security-foundation-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "simple-entity-security-foundation-paragraph-1",
                        "kind": "paragraph",
                        "text": "Even with authorization mechanisms, inconsistent ownership or permission data, or missing initialization, prevents uniform object-level decisions. In bespoke development, aligning this information and its persistence and retrieval becomes a practical constraint on implementing fine-grained authorization.",
                        "coreRefs": {
                          "steps": [
                            "simple-entity-security-foundation"
                          ],
                          "claims": [
                            "simple-entity-security-foundation-claim-1"
                          ],
                          "nodes": [
                            "simple-entity-security-foundation-node-1"
                          ],
                          "relations": [
                            "simple-entity-security-foundation-relation-1"
                          ],
                          "flows": [
                            "simple-entity-security-foundation-flow"
                          ]
                        }
                      },
                      {
                        "id": "simple-entity-security-foundation-paragraph-2",
                        "kind": "paragraph",
                        "text": "SimpleEntity carries common permission metadata based on the UNIX-style owner/group/other model. SecurityAttributes holds owner and group identities and read/write/execute rights for each category. Access decisions relate the subject and memberships established through authentication to this target-side information. Lifecycle, publication, and audit metadata also support state and publication-window conditions and traceability.",
                        "coreRefs": {
                          "steps": [
                            "simple-entity-security-foundation"
                          ],
                          "claims": [
                            "simple-entity-security-foundation-claim-2"
                          ],
                          "nodes": [
                            "simple-entity-security-foundation-node-2"
                          ],
                          "relations": [
                            "simple-entity-security-foundation-relation-1",
                            "simple-entity-security-foundation-relation-2"
                          ],
                          "flows": [
                            "simple-entity-security-foundation-flow"
                          ]
                        }
                      },
                      {
                        "id": "simple-entity-security-foundation-paragraph-3",
                        "kind": "paragraph",
                        "text": "Standard paths supply ownership and permissions when an Entity is created. Paths operating under user permissions automatically check owner/group/other read/write rights. The following table shows business-Entity defaults; public content uses explicit profiles such as public-read. Service-internal and framework execution modes are distinguished in the UnitOfWork authorization section.",
                        "coreRefs": {
                          "steps": [
                            "simple-entity-security-foundation"
                          ],
                          "claims": [
                            "simple-entity-security-foundation-claim-3",
                            "simple-entity-security-foundation-claim-unix-permission-baseline"
                          ],
                          "nodes": [
                            "simple-entity-security-foundation-node-3"
                          ],
                          "relations": [
                            "simple-entity-security-foundation-relation-2",
                            "simple-entity-security-foundation-relation-3"
                          ],
                          "flows": [
                            "simple-entity-security-foundation-flow"
                          ]
                        }
                      },
                      {
                        "id": "entity-default-permissions",
                        "kind": "table",
                        "caption": "Default Permissions for Business Entities",
                        "columns": [
