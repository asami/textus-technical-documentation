                              "Permit creation in a selected collection or mutation of a specified association"
                            ]
                          },
                          {
                            "id": "authorization-method-row-6",
                            "cells": [
                              "Privilege and execution conditions: administrative restrictions",
                              "Privilege ceiling, execution mode, anonymous access, and feature enablement",
                              "Constrain production administration beyond merely having an administrator role"
                            ]
                          }
                        ],
                        "coreRefs": {
                          "steps": [
                            "authorization-decision"
                          ],
                          "claims": [
                            "authorization-decision-claim-expanded-1",
                            "authorization-decision-claim-expanded-2",
                            "authorization-decision-claim-expanded-3",
                            "authorization-decision-claim-expanded-4"
                          ],
                          "nodes": [
                            "authorization-decision-expanded-node-1",
