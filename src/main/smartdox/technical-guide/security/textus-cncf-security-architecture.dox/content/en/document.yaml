                      "flows": [
                        "overall-architecture-flow"
                      ]
                    }
                  },
                  {
                    "id": "overall-architecture-paragraph-2",
                    "kind": "paragraph",
                    "text": "Cozy transforms CML models into implementations and components and supports their composition as SAR/CAR artifacts. Generated artifacts undergo assessment and deployment admission before use on Textus. This connection joins the transfer of model contracts into artifacts with the runtime application of those contracts.",
                    "coreRefs": {
                      "steps": [
                        "overall-architecture"
                      ],
                      "claims": [
                        "overall-architecture-claim-2"
                      ],
                      "nodes": [
                        "overall-architecture-node-2"
                      ],
                      "relations": [
                        "overall-architecture-relation-1",
                        "overall-architecture-relation-2"
                      ],
                      "flows": [
                        "overall-architecture-flow"
                      ]
                    }
                  },
                  {
                    "id": "overall-architecture-paragraph-3",
                    "kind": "paragraph",
                    "text": "Execution and deployment separate Presentation (UI), Application, and Domain responsibilities. The Presentation tier may use other technologies; the Application tier receives external requests and coordinates business operations, while the Domain manages business rules and state. Operations observe results and resource use and feed them back into authority review, fixes, and redeployment.",
                    "coreRefs": {
                      "steps": [
                        "overall-architecture"
                      ],
                      "claims": [
                        "overall-architecture-claim-3"
                      ],
                      "nodes": [
                        "overall-architecture-node-3"
                      ],
                      "relations": [
                        "overall-architecture-relation-2"
                      ],
                      "flows": [
                        "overall-architecture-flow"
                      ]
                    }
                  },
                  {
                    "id": "overall-architecture-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "overall-architecture"
                  }
                ],
                "sections": []
              },
              {
                "id": "security-position-section",
                "heading": "Security Within the Overall Architecture",
                "coreRefs": {
                  "steps": [
                    "security-position"
                  ],
                  "claims": [
                    "security-position-claim-1",
                    "security-position-claim-2",
                    "security-position-claim-3"
                  ],
                  "nodes": [
                    "security-position-node-1",
                    "security-position-node-2",
                    "security-position-node-3"
                  ],
                  "relations": [
                    "security-position-relation-1",
                    "security-position-relation-2"
                  ],
                  "flows": [
                    "security-position-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "security-position-paragraph-1",
                    "kind": "paragraph",
                    "text": "Models describe protected targets and conditions, and CBD limits the interfaces where rules apply. Shared infrastructure evaluates them at those interfaces, reducing repeated integration of controls into individual implementations.",
                    "coreRefs": {
                      "steps": [
                        "security-position"
                      ],
                      "claims": [
                        "security-position-claim-1"
                      ],
                      "nodes": [
                        "security-position-node-1"
                      ],
                      "relations": [
                        "security-position-relation-1"
                      ],
                      "flows": [
                        "security-position-flow"
                      ]
                    }
                  },
                  {
                    "id": "security-position-paragraph-2",
                    "kind": "paragraph",
                    "text": "Components retain their independence while sharing authentication and authorization mechanisms on the Textus side. The Presentation tier may use other technologies, so direct use of Textus mechanisms is not assumed; requests are verified at the server boundary.",
                    "coreRefs": {
                      "steps": [
                        "security-position"
                      ],
                      "claims": [
                        "security-position-claim-2"
                      ],
                      "nodes": [
                        "security-position-node-2"
                      ],
                      "relations": [
                        "security-position-relation-1",
                        "security-position-relation-2"
                      ],
                      "flows": [
                        "security-position-flow"
                      ]
                    }
                  },
                  {
                    "id": "security-position-paragraph-3",
                    "kind": "paragraph",
                    "text": "The next chapter defines coverage and the division of responsibility between developers and the platform, followed by the connections among models, inspection, distribution, execution, and operations.",
                    "coreRefs": {
                      "steps": [
                        "security-position"
                      ],
                      "claims": [
                        "security-position-claim-3"
                      ],
                      "nodes": [
                        "security-position-node-3"
                      ],
                      "relations": [
                        "security-position-relation-2"
                      ],
                      "flows": [
                        "security-position-flow"
                      ]
                    }
                  },
                  {
                    "id": "security-position-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "security-position"
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "security-foundations-section",
            "heading": "Build on Standard Protection for Application-Specific Security",
            "coreRefs": {
              "steps": [
                "security-foundations"
              ],
              "claims": [
                "security-foundations-claim-argument-1",
                "security-foundations-claim-argument-2",
                "security-foundations-claim-baseline-refinement-hardening"
              ],
              "nodes": [
                "security-foundations-node-argument-1",
                "security-foundations-node-argument-2"
              ],
              "relations": [
                "security-foundations-relation-argument-1"
              ],
              "flows": [
                "security-foundations-flow"
              ]
            },
            "blocks": [
              {
                "id": "security-foundations-argument-1",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "security-foundations"
                  ],
                  "claims": [
                    "security-foundations-claim-argument-1"
                  ],
                  "nodes": [
                    "security-foundations-node-argument-1"
                  ],
                  "relations": [
                    "security-foundations-relation-argument-1"
                  ],
                  "flows": [
                    "security-foundations-flow"
                  ]
                },
                "text": "Textus/CNCF provides the main security mechanisms needed by ordinary business applications through shared infrastructure. CML definitions and standard execution and operation paths apply baseline protection. Defaults prioritize ease of adoption and daily operation, especially reducing the burden on beginners of assembling individual mechanisms."
              },
              {
                "id": "security-foundations-argument-2",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "security-foundations"
                  ],
                  "claims": [
                    "security-foundations-claim-argument-2",
                    "security-foundations-claim-baseline-refinement-hardening"
                  ],
                  "nodes": [
                    "security-foundations-node-argument-2"
                  ],
                  "relations": [
                    "security-foundations-relation-argument-1"
                  ],
                  "flows": [
                    "security-foundations-flow"
                  ]
                },
                "text": "Business-specific authorization rules and, where needed, capability restrictions, compartment isolation, and recovery arrangements build on this baseline. The guide explains the roles and connections of these mechanisms, then presents the planned patterns, profiles, and guides for selecting application-appropriate configurations."
              },
              {
                "id": "standard-to-hardened-figure",
                "kind": "figure",
                "asset": "images/standard-to-hardened-en.png",
                "caption": "Standard protection combines with business authorization and deployment/operational hardening. The lower layer shows planned guidance for selection and configuration.",
                "alt": "CML and standard paths lead to baseline protection and application-specific authorization/configuration. Planned patterns, profiles, and guides support selection and verification.",
                "coreRefs": {
                  "steps": [
                    "security-foundations"
                  ],
                  "claims": [
                    "security-foundations-claim-argument-1",
                    "security-foundations-claim-argument-2",
                    "security-foundations-claim-baseline-refinement-hardening"
                  ],
                  "nodes": [
                    "security-foundations-node-argument-1",
                    "security-foundations-node-argument-2"
                  ],
                  "relations": [
                    "security-foundations-relation-argument-1"
                  ],
                  "flows": [
                    "security-foundations-flow"
                  ]
                }
              },
              {
                "id": "security-foundations-logical-structure",
                "kind": "logical-structure",
                "stepRef": "security-foundations"
              }
            ],
            "sections": [
              {
                "id": "full-set-scope-section",
                "heading": "Cover Business-Application Protection from Development to Operation",
                "coreRefs": {
                  "steps": [
                    "full-set-scope"
                  ],
                  "claims": [
                    "full-set-scope-claim-argument-1",
                    "full-set-scope-claim-argument-2",
                    "full-set-scope-claim-argument-3"
                  ],
                  "nodes": [
                    "full-set-scope-node-argument-1",
                    "full-set-scope-node-argument-2",
                    "full-set-scope-node-argument-3"
                  ],
                  "relations": [
                    "full-set-scope-relation-argument-1",
                    "full-set-scope-relation-argument-2"
                  ],
                  "flows": [
                    "full-set-scope-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "full-set-scope-argument-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "full-set-scope"
                      ],
                      "claims": [
                        "full-set-scope-claim-argument-1"
                      ],
                      "nodes": [
                        "full-set-scope-node-argument-1"
                      ],
                      "relations": [
                        "full-set-scope-relation-argument-1"
                      ],
                      "flows": [
                        "full-set-scope-flow"
                      ]
                    },
                    "text": "Protection covers authentication, operation and data authorization, input/output handling, runtime resource limits, artifact trust, auditing, observation, and recovery. A full set refers to systematic coverage of this lifecycle. Each section distinguishes mechanisms applied through standard paths, configurations selected for particular uses, and planned additions."
                  },
                  {
                    "id": "full-set-scope-argument-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "full-set-scope"
                      ],
                      "claims": [
                        "full-set-scope-claim-argument-2"
                      ],
                      "nodes": [
                        "full-set-scope-node-argument-2"
                      ],
                      "relations": [
                        "full-set-scope-relation-argument-1",
                        "full-set-scope-relation-argument-2"
                      ],
                      "flows": [
                        "full-set-scope-flow"
                      ]
                    },
                    "text": "For an order update, identifying the user is only one requirement. Permission to invoke the update, access to the target order, input constraints, and conditions for changing business state must also be checked. Inspection of the deployed implementation and resource limits provide additional protection. If an anomaly occurs, observations must connect the actor and order change to revocation and recovery. Supporting that complete path through shared infrastructure makes the full-set goal concrete."
                  },
                  {
                    "id": "full-set-scope-argument-3",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "full-set-scope"
                      ],
                      "claims": [
                        "full-set-scope-claim-argument-3"
                      ],
                      "nodes": [
                        "full-set-scope-node-argument-3"
                      ],
                      "relations": [
                        "full-set-scope-relation-argument-2"
                      ],
                      "flows": [
                        "full-set-scope-flow"
                      ]
                    },
                    "text": "Understanding each mechanism requires identifying what it protects, where it is enforced, who defines its rules, and what it passes to other mechanisms. This guide explains the architecture at that technical depth. Protocol details, complete API specifications, configuration catalogs, and implementation algorithms are developed in dedicated technical articles and specifications."
                  },
                  {
                    "id": "full-set-scope-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "full-set-scope"
                  }
                ],
                "sections": []
              },
              {
                "id": "developer-security-contract-section",
                "heading": "The Developer's Declarations and the Platform's Responsibilities",
                "coreRefs": {
                  "steps": [
                    "developer-security-contract"
                  ],
                  "claims": [
                    "developer-security-contract-claim-argument-1",
                    "developer-security-contract-claim-argument-2",
                    "developer-security-contract-claim-argument-3",
                    "developer-security-contract-claim-cml-standard-security"
                  ],
                  "nodes": [
                    "developer-security-contract-node-argument-1",
                    "developer-security-contract-node-argument-2",
                    "developer-security-contract-node-argument-3"
                  ],
                  "relations": [
                    "developer-security-contract-relation-argument-1",
                    "developer-security-contract-relation-argument-2"
                  ],
                  "flows": [
                    "developer-security-contract-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "developer-security-contract-argument-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "developer-security-contract"
                      ],
                      "claims": [
                        "developer-security-contract-claim-argument-1"
                      ],
                      "nodes": [
                        "developer-security-contract-node-argument-1"
                      ],
                      "relations": [
                        "developer-security-contract-relation-argument-1"
                      ],
                      "flows": [
                        "developer-security-contract-flow"
                      ]
                    },
                    "text": "Developers define business structures, operations, and state changes in CML and configure authentication methods and business visibility. Defaults supply basic permissions, with application-specific roles, relationships, and conditions added where required. The platform supplies decision mechanisms, while models and configuration express business policy."
                  },
                  {
                    "id": "developer-security-contract-argument-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "developer-security-contract"
                      ],
                      "claims": [
                        "developer-security-contract-claim-argument-2",
                        "developer-security-contract-claim-cml-standard-security"
                      ],
                      "nodes": [
                        "developer-security-contract-node-argument-2"
                      ],
                      "relations": [
                        "developer-security-contract-relation-argument-1",
                        "developer-security-contract-relation-argument-2"
                      ],
                      "flows": [
                        "developer-security-contract-flow"
                      ]
                    },
                    "text": "Running CML Operations and Entities through standard paths invokes shared mechanisms for authenticated-subject propagation, operation and target-data authorization, and audit recording. Developers do not need to add these calls to each business handler. The authentication and authorization chapter explains UNIX-style target-Entity permissions and the authorization methods combined with them."
                  },
                  {
                    "id": "developer-security-contract-argument-3",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "developer-security-contract"
                      ],
                      "claims": [
                        "developer-security-contract-claim-argument-3"
                      ],
                      "nodes": [
                        "developer-security-contract-node-argument-3"
                      ],
                      "relations": [
                        "developer-security-contract-relation-argument-2"
                      ],
                      "flows": [
                        "developer-security-contract-flow"
                      ]
                    },
                    "text": "For example, allowing a department’s assigned staff to update only in-progress orders requires rules for department, assignment, and order state. Shared infrastructure applies these rules at operation and target-data checkpoints."
                  },
                  {
                    "id": "developer-security-contract-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "developer-security-contract"
                  }
                ],
                "sections": []
              },
              {
                "id": "purpose-section",
                "heading": "Security as a First-Class Architectural Concern",
                "coreRefs": {
                  "steps": [
                    "purpose"
                  ],
                  "claims": [
                    "purpose-claim-1",
                    "purpose-claim-3",
                    "purpose-claim-cooperation-1"
                  ],
                  "nodes": [
                    "purpose-explanation-node-1",
                    "purpose-explanation-node-2",
                    "purpose-explanation-node-3"
                  ],
                  "relations": [
                    "purpose-explanation-relation-1",
                    "purpose-explanation-relation-2"
                  ],
                  "flows": [
                    "purpose-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "purpose-block-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "purpose"
                      ],
                      "claims": [
                        "purpose-claim-1"
                      ],
                      "nodes": [
                        "purpose-explanation-node-1"
                      ],
                      "relations": [
                        "purpose-explanation-relation-1"
                      ],
                      "flows": [
                        "purpose-flow"
                      ]
                    },
                    "text": "Textus/CNCF treats security as a first-class concern at the architectural stage, when system structure, authority, trust boundaries, execution boundaries, distribution units, and operational practices are determined. It does not treat security as a feature to be added after application implementation."
                  },
                  {
                    "id": "purpose-block-3",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "purpose"
                      ],
                      "claims": [
                        "purpose-claim-3"
                      ],
                      "nodes": [
                        "purpose-explanation-node-2"
                      ],
                      "relations": [
                        "purpose-explanation-relation-1",
                        "purpose-explanation-relation-2"
                      ],
                      "flows": [
                        "purpose-flow"
                      ]
                    },
                    "text": "Textus/CNCF distinguishes malicious attacks, software defects, operational mistakes, and AI misjudgments as different causes, while addressing them through a common architectural concern: attempts to cross an authority boundary."
                  },
                  {
                    "id": "purpose-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "purpose"
                      ],
                      "claims": [
                        "purpose-claim-cooperation-1"
                      ],
                      "nodes": [
                        "purpose-explanation-node-3"
                      ],
                      "relations": [
                        "purpose-explanation-relation-2"
                      ],
                      "flows": [
                        "purpose-flow"
                      ]
                    },
                    "text": "A boundary defines which actors may use which operations and resources under which conditions. Attacks and mistakes remain distinct causes, while mechanisms restricting unauthorized effects can be shared."
                  },
                  {
                    "id": "purpose-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "purpose"
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "standard-development-path-section",
            "heading": "How SimpleModeling Conventions Lead to Protection",
            "coreRefs": {
              "steps": [
                "standard-development-path"
              ],
              "claims": [
                "standard-development-path-claim-argument-1",
                "standard-development-path-claim-argument-2",
                "standard-development-path-claim-argument-3"
              ],
              "nodes": [
                "standard-development-path-node-argument-1",
                "standard-development-path-node-argument-2",
                "standard-development-path-node-argument-3"
              ],
              "relations": [
                "standard-development-path-relation-argument-1",
                "standard-development-path-relation-argument-2"
              ],
              "flows": [
                "standard-development-path-flow"
              ]
            },
            "blocks": [
              {
                "id": "standard-development-path-argument-1",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "standard-development-path"
                  ],
                  "claims": [
                    "standard-development-path-claim-argument-1"
                  ],
                  "nodes": [
                    "standard-development-path-node-argument-1"
                  ],
                  "relations": [
                    "standard-development-path-relation-argument-1"
                  ],
                  "flows": [
                    "standard-development-path-flow"
                  ]
                },
                "text": "Operations, inputs, states, and required authority described in models are mapped to the responsibilities and interfaces defined by CBD. Reflecting them in SARs and CARs lets component independence and protection conditions be checked against the same artifact."
              },
              {
                "id": "standard-development-path-argument-2",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "standard-development-path"
                  ],
                  "claims": [
                    "standard-development-path-claim-argument-2"
                  ],
                  "nodes": [
                    "standard-development-path-node-argument-2"
                  ],
                  "relations": [
                    "standard-development-path-relation-argument-1",
                    "standard-development-path-relation-argument-2"
                  ],
                  "flows": [
                    "standard-development-path-flow"
                  ]
                },
                "text": "Shared generation rules and checks verify correspondence between models and implementations. Inspection results are associated with a CAR’s version and content and passed into distribution and admission in the next chapter."
              },
              {
                "id": "standard-development-path-argument-3",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "standard-development-path"
                  ],
                  "claims": [
                    "standard-development-path-claim-argument-3"
                  ],
                  "nodes": [
                    "standard-development-path-node-argument-3"
                  ],
                  "relations": [
                    "standard-development-path-relation-argument-2"
                  ],
                  "flows": [
                    "standard-development-path-flow"
                  ]
                },
                "text": "This development path connects the business models and component contracts authored by developers to protection conditions that shared infrastructure can apply."
              },
              {
                "id": "standard-development-path-logical-structure",
                "kind": "logical-structure",
                "stepRef": "standard-development-path"
              }
            ],
            "sections": [
              {
                "id": "cbd-section",
                "heading": "Security Supported by Component-Based Development",
                "coreRefs": {
                  "steps": [
                    "cbd"
                  ],
                  "claims": [
                    "cbd-claim-foundation",
                    "cbd-claim-2",
                    "cbd-claim-3",
                    "cbd-claim-cooperation-1"
                  ],
                  "nodes": [
                    "cbd-explanation-node-foundation",
                    "cbd-explanation-node-1",
                    "cbd-explanation-node-2",
                    "cbd-explanation-node-3"
                  ],
                  "relations": [
                    "cbd-composition-relation-1",
                    "cbd-composition-relation-2",
                    "cbd-composition-relation-3"
                  ],
                  "flows": [
                    "cbd-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "cbd-foundation",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "cbd"
                      ],
                      "claims": [
                        "cbd-claim-foundation"
                      ],
                      "nodes": [
                        "cbd-explanation-node-foundation"
                      ],
                      "relations": [
                        "cbd-composition-relation-1"
                      ],
                      "flows": [
                        "cbd-flow"
                      ]
                    },
                    "text": "Component-Based Development (CBD) is a foundational development approach in SimpleModeling. Separation of responsibilities, component reuse and composition, localized changes, and independent inspection and replacement provide broad benefits for software development and operation. Security is one of the areas in which these properties of CBD are particularly useful."
                  },
                  {
                    "id": "cbd-block-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "cbd"
                      ],
                      "claims": [
                        "cbd-claim-2"
                      ],
                      "nodes": [
                        "cbd-explanation-node-1"
                      ],
                      "relations": [
                        "cbd-composition-relation-2"
                      ],
                      "flows": [
                        "cbd-flow"
                      ]
                    },
                    "text": "CBD encapsulates each Component's internal implementation and defines the interfaces exposed to other components. Concentrating collaboration at Provided/Required contracts and making dependencies explicit limits exposed interaction points and reduces inadvertent access to internals and unintended coupling. Clear responsibilities and interaction points also make protected assets and paths requiring inspection easier to identify. These are the contributions that the structure of CBD itself makes to security."
                  },
                  {
                    "id": "cbd-block-3",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "cbd"
                      ],
                      "claims": [
                        "cbd-claim-3"
                      ],
                      "nodes": [
                        "cbd-explanation-node-2"
                      ],
                      "relations": [
                        "cbd-composition-relation-3"
                      ],
                      "flows": [
                        "cbd-flow"
                      ]
                    },
                    "text": "Textus/CNCF shares authentication, authorization, execution-context, and observability mechanisms while preserving each component’s responsibilities and authority rules. This connects independent components to consistent control and operation."
                  },
                  {
                    "id": "cbd-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "cbd"
                      ],
                      "claims": [
                        "cbd-claim-cooperation-1"
                      ],
                      "nodes": [
                        "cbd-explanation-node-3"
                      ],
                      "relations": [
                        "cbd-composition-relation-1",
                        "cbd-composition-relation-2",
                        "cbd-composition-relation-3"
                      ],
                      "flows": [
                        "cbd-flow"
                      ]
                    },
                    "text": "CBD defines compartments and interfaces, while models and inspection establish their contracts and required authority. At runtime, calls crossing compartments are authorized, and target-data access and resource use are controlled inside each compartment. Shared mechanisms connect compartment structure, controls at crossings, and controls within compartments, preserving independence while reducing missed checks and limiting impact. The same relationship applies to the tier responsibilities described later."
                  },
                  {
                    "id": "cbd-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "cbd"
                  }
                ],
                "sections": []
              },
              {
                "id": "model-driven-section",
                "heading": "Security Supported by Model-Driven Development",
                "coreRefs": {
                  "steps": [
                    "model-driven"
                  ],
                  "claims": [
                    "model-driven-claim-foundation",
                    "model-driven-claim-1",
                    "model-driven-claim-2",
                    "model-driven-claim-3",
                    "model-driven-claim-cooperation-1"
                  ],
                  "nodes": [
                    "model-driven-explanation-node-foundation",
                    "model-driven-explanation-node-1",
                    "model-driven-explanation-node-2",
                    "model-driven-explanation-node-3",
                    "model-driven-explanation-node-4"
                  ],
                  "relations": [
                    "model-driven-explanation-relation-foundation",
                    "model-driven-explanation-relation-1",
                    "model-driven-explanation-relation-2",
                    "model-driven-explanation-relation-3"
                  ],
                  "flows": [
                    "model-driven-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "model-driven-foundation",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "model-driven"
                      ],
                      "claims": [
                        "model-driven-claim-foundation"
                      ],
                      "nodes": [
                        "model-driven-explanation-node-foundation"
                      ],
                      "relations": [
                        "model-driven-explanation-relation-foundation"
                      ],
                      "flows": [
                        "model-driven-flow"
                      ]
                    },
                    "text": "Model-driven development describes business concepts and rules at a higher level of abstraction than implementation technologies and connects their meaning to program generation and execution. SimpleModeling uses it for domain-oriented expression, design and implementation grounded in shared models, and support for multiple implementation approaches. Making meaning explicit in models and available for inspection and transformation also benefits security."
                  },
                  {
                    "id": "model-driven-block-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "model-driven"
                      ],
                      "claims": [
                        "model-driven-claim-1"
                      ],
                      "nodes": [
                        "model-driven-explanation-node-1"
                      ],
                      "relations": [
                        "model-driven-explanation-relation-foundation",
                        "model-driven-explanation-relation-1"
                      ],
                      "flows": [
                        "model-driven-flow"
                      ]
                    },
                    "text": "Explicit models of business operations, inputs and outputs, state, exposure, and required authority make it possible to review what is protected and who may perform which operations independently of individual implementations. CML retains semantics such as Service/Operation and Capability so that missing or inconsistent contracts can be examined through model checks and reviews. Representing business intent and security conditions in the same model makes their correspondence easier to assess during design."
                  },
                  {
                    "id": "model-driven-block-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "model-driven"
                      ],
                      "claims": [
                        "model-driven-claim-2"
                      ],
                      "nodes": [
                        "model-driven-explanation-node-2"
                      ],
                      "relations": [
                        "model-driven-explanation-relation-1",
                        "model-driven-explanation-relation-2"
                      ],
                      "flows": [
                        "model-driven-flow"
                      ]
                    },
                    "text": "Projecting semantics from a shared model into Scala/CNCF Containers, lightweight TypeScript Cloud Functions, API contracts, CAR metadata, and deployment constraints reduces the places where the same conditions must be restated in code and configuration. Changes to exposure or required authority can originate in the model, flow into generated artifacts, and be checked for correspondence. Consistent model-driven transformation reduces omissions and discrepancies between implementation approaches."
                  },
                  {
                    "id": "model-driven-block-3",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "model-driven"
                      ],
                      "claims": [
                        "model-driven-claim-3"
                      ],
                      "nodes": [
                        "model-driven-explanation-node-3"
                      ],
                      "relations": [
                        "model-driven-explanation-relation-2",
                        "model-driven-explanation-relation-3"
                      ],
                      "flows": [
                        "model-driven-flow"
                      ]
                    },
                    "text": "SimpleModeling uses modeled operations and required authority to organize standard APIs and execution paths. Restricting the authority and low-level operations available to normal generated artifacts to what is needed reduces opportunities for dangerous implementation behavior. Model-based generation applies shared controls repeatedly and reduces the effort of assembling security mechanisms separately for each business operation."
                  },
                  {
                    "id": "model-driven-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "model-driven"
                      ],
                      "claims": [
                        "model-driven-claim-cooperation-1"
                      ],
                      "nodes": [
                        "model-driven-explanation-node-4"
                      ],
                      "relations": [
                        "model-driven-explanation-relation-3"
                      ],
                      "flows": [
                        "model-driven-flow"
                      ]
                    },
                    "text": "Conditions expressed in models are carried into tests and reviews of generated artifacts against their contracts, deployment admission, and runtime authorization and resource limits in Textus/CNCF. Model-driven development supports explicit conditions, inspection, and consistent transformation; the runtime applies those conditions to actual operations. Maintaining this correspondence across different realizations, including Cloud Functions and Containers, is important for security."
                  },
                  {
                    "id": "model-driven-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "model-driven"
                  }
                ],
                "sections": []
              },
              {
                "id": "component-security-boundaries-section",
                "heading": "Connect Component Boundaries to Inspection, Execution, and Deployment",
                "coreRefs": {
                  "steps": [
                    "component-security-boundaries"
                  ],
                  "claims": [
                    "component-security-boundaries-claim-1",
                    "component-security-boundaries-claim-2",
                    "component-security-boundaries-claim-3"
                  ],
                  "nodes": [
                    "component-security-boundaries-node-1",
                    "component-security-boundaries-node-2",
                    "component-security-boundaries-node-3"
                  ],
                  "relations": [
                    "component-security-boundaries-relation-1",
                    "component-security-boundaries-relation-2"
                  ],
                  "flows": [
                    "component-security-boundaries-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "component-security-boundaries-paragraph-1",
                    "kind": "paragraph",
                    "text": "CBD defines boundaries for responsibilities, internal data, public operations, and dependencies. Packaging those modeled boundaries in a CAR makes it possible to inspect which implementation carries which contracts and required authority as a component.",
                    "coreRefs": {
                      "steps": [
                        "component-security-boundaries"
                      ],
                      "claims": [
                        "component-security-boundaries-claim-1"
                      ],
                      "nodes": [
                        "component-security-boundaries-node-1"
                      ],
                      "relations": [
                        "component-security-boundaries-relation-1"
                      ],
                      "flows": [
                        "component-security-boundaries-flow"
                      ]
                    }
                  },
                  {
                    "id": "component-security-boundaries-paragraph-2",
                    "kind": "paragraph",
                    "text": "At runtime, public Operation calls and UnitOfWork access to target data pass through shared authorization mechanisms, while resource use is connected to the Sandbox. Mapping component-specific rules to checkpoints on standard paths applies enforceable restrictions to structural boundaries.",
                    "coreRefs": {
                      "steps": [
                        "component-security-boundaries"
                      ],
                      "claims": [
                        "component-security-boundaries-claim-2"
                      ],
                      "nodes": [
                        "component-security-boundaries-node-2"
                      ],
                      "relations": [
                        "component-security-boundaries-relation-1",
                        "component-security-boundaries-relation-2"
                      ],
                      "flows": [
                        "component-security-boundaries-flow"
                      ]
                    }
                  },
                  {
                    "id": "component-security-boundaries-paragraph-3",
                    "kind": "paragraph",
                    "text": "Deployment defines execution-environment authority and communication paths according to Presentation, Application, and Domain responsibilities and trust boundaries. Requests from a Presentation tier using other technologies also enter server-side verification and authorization. Component boundaries need not map one-to-one to processes or containers; deployment configuration determines isolation and replacement scope.",
                    "coreRefs": {
                      "steps": [
                        "component-security-boundaries"
                      ],
                      "claims": [
                        "component-security-boundaries-claim-3"
                      ],
                      "nodes": [
                        "component-security-boundaries-node-3"
                      ],
                      "relations": [
                        "component-security-boundaries-relation-2"
                      ],
                      "flows": [
                        "component-security-boundaries-flow"
                      ]
                    }
                  },
                  {
                    "id": "component-security-boundaries-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "component-security-boundaries"
                  }
                ],
                "sections": []
              },
              {
                "id": "car-section",
                "heading": "Package Boundary Descriptions in Inspectable CARs",
                "coreRefs": {
                  "steps": [
                    "car"
                  ],
                  "claims": [
                    "car-claim-3",
                    "car-claim-1",
                    "car-claim-2",
                    "car-claim-cooperation-1"
                  ],
                  "nodes": [
                    "car-explanation-node-3",
                    "car-explanation-node-1",
                    "car-explanation-node-2",
                    "car-explanation-node-4"
                  ],
                  "relations": [
                    "car-explanation-relation-1",
                    "car-explanation-relation-2",
                    "car-explanation-relation-3"
                  ],
                  "flows": [
                    "car-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "car-block-3",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "car"
                      ],
                      "claims": [
                        "car-claim-3"
                      ],
                      "nodes": [
                        "car-explanation-node-3"
                      ],
                      "relations": [
                        "car-explanation-relation-1"
                      ],
                      "flows": [
                        "car-flow"
                      ]
                    },
                    "text": "Bundling contracts, required authority, dependencies, and implementation in one distribution unit makes designed boundaries inspectable against the component that will actually be used. CAR retains this correspondence and provides a common artifact for CAR lint, CBD Review, and admission decisions. Carrying the inspection target as a component supports reuse based on assessment results."
                  },
                  {
                    "id": "car-block-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "car"
                      ],
                      "claims": [
                        "car-claim-1"
                      ],
                      "nodes": [
                        "car-explanation-node-1"
                      ],
                      "relations": [
                        "car-explanation-relation-1",
                        "car-explanation-relation-2"
                      ],
                      "flows": [
                        "car-flow"
                      ]
                    },
                    "text": "CAR identity and version associate models, implementation, and inspection results with the same distributable. Verification after distribution and admission at the destination are covered in the next chapter."
                  },
                  {
                    "id": "car-block-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "car"
                      ],
                      "claims": [
                        "car-claim-2"
                      ],
                      "nodes": [
                        "car-explanation-node-2"
                      ],
                      "relations": [
                        "car-explanation-relation-2",
                        "car-explanation-relation-3"
                      ],
                      "flows": [
                        "car-flow"
                      ]
                    },
                    "text": "A CAR can aggregate inspectable information such as Component identity, Operations, dependencies, Capabilities, implementation artifacts, Subcomponents, and documentation."
                  },
                  {
                    "id": "car-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "car"
                      ],
                      "claims": [
                        "car-claim-cooperation-1"
                      ],
                      "nodes": [
                        "car-explanation-node-4"
                      ],
                      "relations": [
                        "car-explanation-relation-3"
                      ],
                      "flows": [
                        "car-flow"
                      ]
                    },
                    "text": "The model-to-implementation correspondence described in a CAR is inspected, and required authority is checked against deployment policy. Applying admitted authority through the runtime connects artifact descriptions to execution boundaries. Content assessment and decisions about authority granted by the consuming environment take place at their respective stages."
                  },
                  {
                    "id": "car-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "car"
                  }
                ],
                "sections": []
              },
              {
                "id": "lint-admission-section",
                "heading": "Lint, Review and Admission",
                "coreRefs": {
