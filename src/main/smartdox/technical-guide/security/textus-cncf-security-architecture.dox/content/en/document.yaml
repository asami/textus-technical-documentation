                "sections": [
                  {
                    "id": "safe-by-construction-section",
                    "heading": "Safe-by-Construction Application Security",
                    "coreRefs": {
                      "steps": [
                        "safe-by-construction"
                      ],
                      "claims": [
                        "safe-by-construction-claim-2",
                        "safe-by-construction-claim-3",
                        "safe-by-construction-claim-4",
                        "safe-by-construction-claim-cooperation-1"
                      ],
                      "nodes": [
                        "safe-by-construction-explanation-node-1",
                        "safe-by-construction-explanation-node-2",
                        "safe-by-construction-explanation-node-3",
                        "safe-by-construction-explanation-node-4"
                      ],
                      "relations": [
                        "safe-by-construction-explanation-relation-1",
                        "safe-by-construction-explanation-relation-2",
                        "safe-by-construction-explanation-relation-3"
                      ],
                      "flows": [
                        "safe-by-construction-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "safe-by-construction-block-2",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "safe-by-construction"
                          ],
                          "claims": [
                            "safe-by-construction-claim-2"
                          ],
                          "nodes": [
                            "safe-by-construction-explanation-node-1"
                          ],
                          "relations": [
                            "safe-by-construction-explanation-relation-1"
                          ],
                          "flows": [
                            "safe-by-construction-flow"
                          ]
                        },
                        "text": "Input models and typed Repository/DataStore APIs constrain server-side inputs and data operations. Where Textus generates HTML, a context-aware renderer protects that output, and HTTP mutations follow the ingress CSRF policy."
                      },
                      {
                        "id": "safe-by-construction-block-3",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "safe-by-construction"
                          ],
                          "claims": [
                            "safe-by-construction-claim-3"
                          ],
                          "nodes": [
                            "safe-by-construction-explanation-node-2"
                          ],
                          "relations": [
                            "safe-by-construction-explanation-relation-1",
                            "safe-by-construction-explanation-relation-2"
                          ],
                          "flows": [
                            "safe-by-construction-flow"
                          ]
                        },
                        "text": "Direct SQL concatenation, inserting untrusted values directly into HTML, and direct file, network, or process access are identified as departures from standard paths and inspected by lint and review. Inputs are bound to declared Operation input models rather than unrestricted Entity assignment or unsafe deserialization."
                      },
                      {
                        "id": "safe-by-construction-block-4",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "safe-by-construction"
                          ],
                          "claims": [
                            "safe-by-construction-claim-4"
                          ],
                          "nodes": [
                            "safe-by-construction-explanation-node-3"
                          ],
                          "relations": [
                            "safe-by-construction-explanation-relation-2",
                            "safe-by-construction-explanation-relation-3"
                          ],
                          "flows": [
                            "safe-by-construction-flow"
                          ]
                        },
                        "text": "For an independent Presentation built with TypeScript, Flutter, or another platform, escaping and safe rendering API choices are applied on that UI platform. Textus controls API inputs, authorization and scope of returned data, and sensitive information. This division connects protection through server-side standard APIs with output protection in the Presentation."
                      },
                      {
                        "id": "safe-by-construction-cooperation-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "safe-by-construction"
                          ],
                          "claims": [
                            "safe-by-construction-claim-cooperation-1"
                          ],
                          "nodes": [
                            "safe-by-construction-explanation-node-4"
                          ],
                          "relations": [
                            "safe-by-construction-explanation-relation-3"
                          ],
                          "flows": [
                            "safe-by-construction-flow"
                          ]
                        },
                        "text": "Standard APIs provide implementation paths less prone to common defects; escape-hatch inspection covers departures from those paths. Sandbox additionally limits accessible external resources. These controls work together because authorized processing can still contain implementation defects."
                      },
                      {
                        "id": "safe-by-construction-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "safe-by-construction"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "sensitive-information-section",
                    "heading": "Sensitive Information",
                    "coreRefs": {
                      "steps": [
                        "sensitive-information"
                      ],
                      "claims": [
                        "sensitive-information-claim-4",
                        "sensitive-information-claim-cooperation-1",
                        "sensitive-information-claim-cooperation-2"
                      ],
                      "nodes": [
                        "sensitive-information-explanation-node-1",
                        "sensitive-information-explanation-node-2",
                        "sensitive-information-explanation-node-3"
                      ],
                      "relations": [
                        "sensitive-information-explanation-relation-1",
                        "sensitive-information-explanation-relation-2"
                      ],
                      "flows": [
                        "sensitive-information-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "sensitive-information-block-4",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "sensitive-information"
                          ],
                          "claims": [
                            "sensitive-information-claim-4"
                          ],
                          "nodes": [
                            "sensitive-information-explanation-node-1"
                          ],
                          "relations": [
                            "sensitive-information-explanation-relation-1"
                          ],
                          "flows": [
                            "sensitive-information-flow"
                          ]
                        },
                        "text": "The sensitive-information model distinguishes ordinary Domain values, Sensitive Personal Data, Sensitive Identity, Credentials, Secrets, highly sensitive values excluded from retention, and external Sensitive References/Results. When a provider or operating system can own high-value secrets or interactions, delegation includes the UI where possible; only the business references, assertions, and results needed by Textus are returned."
                      },
                      {
                        "id": "sensitive-information-cooperation-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "sensitive-information"
                          ],
                          "claims": [
                            "sensitive-information-claim-cooperation-1"
                          ],
                          "nodes": [
                            "sensitive-information-explanation-node-2"
                          ],
                          "relations": [
                            "sensitive-information-explanation-relation-1",
                            "sensitive-information-explanation-relation-2"
                          ],
                          "flows": [
                            "sensitive-information-flow"
                          ]
                        },
                        "text": "Classification guides what business data is retained, which interactions are delegated, and what may enter logs and traces. Combining reduced retention with authority and output-path limits reduces opportunities for disclosure and its effects."
                      },
                      {
                        "id": "sensitive-information-cooperation-2",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "sensitive-information"
                          ],
                          "claims": [
                            "sensitive-information-claim-cooperation-2"
                          ],
                          "nodes": [
                            "sensitive-information-explanation-node-3"
                          ],
                          "relations": [
                            "sensitive-information-explanation-relation-2"
                          ],
                          "flows": [
                            "sensitive-information-flow"
                          ]
                        },
                        "text": "Map external identities to internal Textus Subject/User IDs rather than propagating them without limits into ordinary Domains. Delegation is not a guarantee about the provider; returned references, assertions, and results must be checked in their authorization context."
                      },
                      {
                        "id": "sensitive-information-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "sensitive-information"
                      }
                    ],
                    "sections": []
                  }
                ]
              }
            ]
          },
          {
            "id": "operations-and-recovery-section",
            "heading": "Contain Incidents and Recover",
            "coreRefs": {
              "steps": [
                "operations-and-recovery"
              ],
              "claims": [
                "operations-and-recovery-claim-problem",
                "operations-and-recovery-claim-combination",
