                  }
                ],
                "sections": []
              },
              {
                "id": "runtime-rotation-section",
                "heading": "Distinguish Planned Replacement from Failure and Compromise Response",
                "coreRefs": {
                  "steps": [
                    "runtime-rotation"
                  ],
                  "claims": [
                    "runtime-rotation-claim-1",
                    "runtime-rotation-claim-2",
                    "runtime-rotation-claim-cooperation-1"
                  ],
                  "nodes": [
                    "runtime-rotation-explanation-node-1",
                    "runtime-rotation-explanation-node-2",
                    "runtime-rotation-explanation-node-3"
                  ],
                  "relations": [
                    "runtime-rotation-explanation-relation-1",
                    "runtime-rotation-explanation-relation-2"
                  ],
                  "flows": [
                    "runtime-rotation-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "runtime-rotation-block-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "runtime-rotation"
                      ],
                      "claims": [
                        "runtime-rotation-claim-1"
                      ],
                      "nodes": [
                        "runtime-rotation-explanation-node-1"
                      ],
                      "relations": [
                        "runtime-rotation-explanation-relation-1"
                      ],
                      "flows": [
                        "runtime-rotation-flow"
                      ]
                    },
                    "text": "During planned replacement, new read/update admission moves to ready B while former Primary A continues only admitted updates and required completion work. Start replacement Read Replica C and propagate late A commits to B/C. Keep A synchronized until old outcomes settle and replacement capacity, retention/observation and switch-back conditions are satisfied."
                  },
                  {
                    "id": "runtime-rotation-block-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "runtime-rotation"
                      ],
                      "claims": [
                        "runtime-rotation-claim-2"
                      ],
                      "nodes": [
                        "runtime-rotation-explanation-node-2"
                      ],
                      "relations": [
                        "runtime-rotation-explanation-relation-1",
                        "runtime-rotation-explanation-relation-2"
                      ],
                      "flows": [
                        "runtime-rotation-flow"
                      ]
                    },
                    "text": "Do not discard a former Primary solely on a scheduled time or elapsed retention. Regular replacement exercises startup, readiness, transfer and drain; daily cadence is not a fixed default. Failover rejects invalid-authority effects at actual storage/execution boundaries and requires valid takeover authority and readiness. Planned fallback policy does not permit returning to a suspected compromised environment."
                  },
                  {
                    "id": "runtime-rotation-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "runtime-rotation"
                      ],
                      "claims": [
                        "runtime-rotation-claim-cooperation-1"
                      ],
                      "nodes": [
                        "runtime-rotation-explanation-node-3"
                      ],
                      "relations": [
                        "runtime-rotation-explanation-relation-2"
                      ],
                      "flows": [
                        "runtime-rotation-flow"
                      ]
                    },
                    "text": "This design makes replacement an ordinary operational path rather than an incident-only action. Regular replacement does not replace compromise detection, persistent-state checks or backups. As of 2026-11-13, Phase 108 first-delivery items remain open; integrated update preservation, synchronization and replacement are not claimed implemented."
                  },
                  {
                    "id": "runtime-rotation-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "runtime-rotation"
                  }
                ],
                "sections": []
              },
              {
                "id": "replace-not-prove-clean-section",
                "heading": "Combine Replacement with Business Recovery",
                "coreRefs": {
                  "steps": [
                    "replace-not-prove-clean"
                  ],
                  "claims": [
                    "replace-not-prove-clean-claim-2",
                    "replace-not-prove-clean-claim-cooperation-1",
                    "replace-not-prove-clean-claim-cooperation-2"
                  ],
                  "nodes": [
                    "replace-not-prove-clean-explanation-node-1",
                    "replace-not-prove-clean-explanation-node-2",
                    "replace-not-prove-clean-explanation-node-3"
                  ],
                  "relations": [
                    "replace-not-prove-clean-explanation-relation-1",
                    "replace-not-prove-clean-explanation-relation-2"
                  ],
                  "flows": [
                    "replace-not-prove-clean-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "replace-not-prove-clean-block-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "replace-not-prove-clean"
                      ],
                      "claims": [
                        "replace-not-prove-clean-claim-2"
                      ],
                      "nodes": [
                        "replace-not-prove-clean-explanation-node-1"
                      ],
                      "relations": [
                        "replace-not-prove-clean-explanation-relation-1"
                      ],
                      "flows": [
                        "replace-not-prove-clean-flow"
                      ]
                    },
                    "text": "The preferred flow limits authority, observes and detects, contains impact and revokes authority, replaces the immutable runtime, and recovers from authoritative persistent state. This does not remove the need for artifact-integrity verification where the distribution threat model requires it."
                  },
                  {
                    "id": "replace-not-prove-clean-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "replace-not-prove-clean"
                      ],
                      "claims": [
                        "replace-not-prove-clean-claim-cooperation-1"
                      ],
                      "nodes": [
                        "replace-not-prove-clean-explanation-node-2"
                      ],
                      "relations": [
                        "replace-not-prove-clean-explanation-relation-1",
                        "replace-not-prove-clean-explanation-relation-2"
                      ],
                      "flows": [
                        "replace-not-prove-clean-flow"
                      ]
                    },
                    "text": "Custom hash checking or large rollback mechanisms without a justified threat requirement can add complexity and defects. Use environment replacement as the normal recovery path and select additional integrity checks for explicit threats."
                  },
                  {
                    "id": "replace-not-prove-clean-cooperation-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "replace-not-prove-clean"
                      ],
                      "claims": [
                        "replace-not-prove-clean-claim-cooperation-2"
                      ],
                      "nodes": [
                        "replace-not-prove-clean-explanation-node-3"
                      ],
                      "relations": [
                        "replace-not-prove-clean-explanation-relation-2"
                      ],
                      "flows": [
                        "replace-not-prove-clean-flow"
                      ]
                    },
                    "text": "Replacement avoids continuing to use a problematic environment; it does not undo disclosure or unauthorized persistent changes. Define incident response to include necessary state examination and business recovery."
                  },
                  {
                    "id": "replace-not-prove-clean-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "replace-not-prove-clean"
                  }
                ],
                "sections": []
              },
              {
                "id": "lifecycle-section",
                "heading": "Security Lifecycle",
                "coreRefs": {
                  "steps": [
                    "lifecycle"
                  ],
                  "claims": [
                    "lifecycle-claim-1",
                    "lifecycle-claim-2",
                    "lifecycle-claim-3",
                    "lifecycle-claim-4",
                    "lifecycle-claim-5",
                    "lifecycle-claim-6",
                    "lifecycle-claim-7",
                    "lifecycle-claim-cooperation-1"
