              },
              {
                "id": "function-packaging-section",
                "heading": "Align Inspection Scope with Shared Code and Self-Contained Artifacts",
                "coreRefs": {
                  "steps": [
                    "function-packaging"
                  ],
                  "claims": [
                    "function-packaging-claim-cooperation-1",
                    "function-packaging-claim-1",
                    "function-packaging-claim-2"
                  ],
                  "nodes": [
                    "function-packaging-explanation-node-3",
                    "function-packaging-explanation-node-1",
                    "function-packaging-explanation-node-2"
                  ],
                  "relations": [
                    "function-packaging-explanation-relation-1",
                    "function-packaging-explanation-relation-2"
                  ],
                  "flows": [
                    "function-packaging-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "function-packaging-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "function-packaging"
                      ],
                      "claims": [
                        "function-packaging-claim-cooperation-1"
                      ],
                      "nodes": [
                        "function-packaging-explanation-node-3"
                      ],
                      "relations": [
                        "function-packaging-explanation-relation-1"
                      ],
                      "flows": [
                        "function-packaging-flow"
                      ]
                    },
                    "text": "Sharing an implementation across execution environments enables common checks on the same processing and concentrates control fixes in the same source. Thin adapters isolate environment-specific behavior and bound what must be examined for each provider. Packaging the implementation under inspection with its deployment information helps align what is assessed with what is deployed."
                  },
                  {
                    "id": "function-packaging-block-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "function-packaging"
                      ],
                      "claims": [
                        "function-packaging-claim-1"
                      ],
                      "nodes": [
                        "function-packaging-explanation-node-1"
                      ],
                      "relations": [
                        "function-packaging-explanation-relation-1",
                        "function-packaging-explanation-relation-2"
                      ],
                      "flows": [
                        "function-packaging-flow"
                      ]
                    },
                    "text": "TypeScript is the initial Cloud Function generation target. One provider-neutral common core is maintained, with thin Local/Test, AWS, and Google adapters connecting it to each execution environment. The adapters use a shared Cloud Function ABI."
                  },
                  {
                    "id": "function-packaging-block-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "function-packaging"
                      ],
                      "claims": [
                        "function-packaging-claim-2"
                      ],
                      "nodes": [
                        "function-packaging-explanation-node-2"
                      ],
                      "relations": [
                        "function-packaging-explanation-relation-2"
                      ],
                      "flows": [
                        "function-packaging-flow"
                      ]
                    },
                    "text": "Each Cloud Function Subcomponent CAR contains the shared TypeScript, target adapter, and deployment metadata as a self-contained artifact. Common-core fixes are shared at source level, tested with each adapter, and distributed as updates. No separate Cloud Function CAR is introduced solely to deduplicate shared code."
                  },
                  {
                    "id": "function-packaging-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "function-packaging"
                  }
                ],
                "sections": []
              },
              {
                "id": "local-testing-section",
                "heading": "Check Security Behavior Across Realizations with Shared Executable Specifications",
                "coreRefs": {
                  "steps": [
                    "local-testing"
                  ],
                  "claims": [
                    "local-testing-claim-3",
                    "local-testing-claim-1",
                    "local-testing-claim-2",
