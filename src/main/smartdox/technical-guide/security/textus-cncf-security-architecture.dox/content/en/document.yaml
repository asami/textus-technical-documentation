          {
            "id": "delivery-and-responsibility-section",
            "heading": "Use the Standard Configuration and Strengthen It for the Application",
            "coreRefs": {
              "steps": [
                "delivery-and-responsibility"
              ],
              "claims": [
                "delivery-and-responsibility-claim-argument-1",
                "delivery-and-responsibility-claim-argument-2"
              ],
              "nodes": [
                "delivery-and-responsibility-node-argument-1",
                "delivery-and-responsibility-node-argument-2"
              ],
              "relations": [
                "delivery-and-responsibility-relation-argument-1"
              ],
              "flows": [
                "delivery-and-responsibility-flow"
              ]
            },
            "blocks": [
              {
                "id": "delivery-and-responsibility-argument-1",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "delivery-and-responsibility"
                  ],
                  "claims": [
                    "delivery-and-responsibility-claim-argument-1"
                  ],
                  "nodes": [
                    "delivery-and-responsibility-node-argument-1"
                  ],
                  "relations": [
                    "delivery-and-responsibility-relation-argument-1"
                  ],
                  "flows": [
                    "delivery-and-responsibility-flow"
                  ]
                },
                "text": "Adoption starts with baseline protection through standard paths and business-specific authorization settings. Exposure and information sensitivity guide capability restrictions, compartment isolation, auditing, and recovery configurations."
              },
              {
                "id": "delivery-and-responsibility-argument-2",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "delivery-and-responsibility"
                  ],
                  "claims": [
                    "delivery-and-responsibility-claim-argument-2"
                  ],
                  "nodes": [
                    "delivery-and-responsibility-node-argument-2"
                  ],
                  "relations": [
                    "delivery-and-responsibility-relation-argument-1"
                  ],
                  "flows": [
                    "delivery-and-responsibility-flow"
                  ]
                },
                "text": "The following sections cover available components, business-specific settings, and planned operation patterns. They distinguish using existing mechanisms from plans to simplify selection and configuration."
              },
              {
                "id": "delivery-and-responsibility-logical-structure",
                "kind": "logical-structure",
                "stepRef": "delivery-and-responsibility"
              }
            ],
            "sections": [
              {
                "id": "provided-scope-section",
                "heading": "Relating the Architecture to Available Capabilities",
                "coreRefs": {
                  "steps": [
                    "provided-scope"
                  ],
                  "claims": [
                    "provided-scope-claim-argument-1",
                    "provided-scope-claim-argument-2"
                  ],
                  "nodes": [
                    "provided-scope-node-argument-1",
                    "provided-scope-node-argument-2"
                  ],
                  "relations": [
                    "provided-scope-relation-argument-1"
                  ],
                  "flows": [
                    "provided-scope-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "provided-scope-argument-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "provided-scope"
                      ],
                      "claims": [
                        "provided-scope-claim-argument-1"
                      ],
                      "nodes": [
                        "provided-scope-node-argument-1"
                      ],
                      "relations": [
                        "provided-scope-relation-argument-1"
                      ],
                      "flows": [
                        "provided-scope-flow"
                      ]
                    },
                    "text": "The technology inventory describes the architectural scope that SimpleModeling and Textus aim to provide as a full set. Available capabilities depend on the selected Textus/CNCF release, SARs and CARs, authentication providers, and deployment. For example, a shared authentication path does not determine which external authentication methods have available adapters and configuration."
                  },
                  {
                    "id": "provided-scope-argument-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "provided-scope"
                      ],
                      "claims": [
                        "provided-scope-claim-argument-2"
                      ],
                      "nodes": [
                        "provided-scope-node-argument-2"
                      ],
                      "relations": [
                        "provided-scope-relation-argument-1"
                      ],
                      "flows": [
                        "provided-scope-flow"
                      ]
                    },
                    "text": "Adoption relates each mechanism to its supplying artifact and version, required configuration, and verified behavior. In-development and unsupported items are identified within the same coverage model so that expansion remains explicit. This guide explains design rationale and relationships; confirmed availability is checked against component specifications and release information."
                  },
                  {
                    "id": "provided-scope-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "provided-scope"
                  }
                ],
                "sections": []
              },
              {
                "id": "configuration-boundary-section",
                "heading": "Application-Specific Rules and the Scope of Standard Paths",
                "coreRefs": {
                  "steps": [
                    "configuration-boundary"
                  ],
                  "claims": [
                    "configuration-boundary-claim-argument-1",
                    "configuration-boundary-claim-argument-2"
                  ],
                  "nodes": [
                    "configuration-boundary-node-argument-1",
                    "configuration-boundary-node-argument-2"
                  ],
                  "relations": [
                    "configuration-boundary-relation-argument-1"
                  ],
                  "flows": [
                    "configuration-boundary-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "configuration-boundary-argument-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "configuration-boundary"
                      ],
                      "claims": [
                        "configuration-boundary-claim-argument-1"
                      ],
                      "nodes": [
                        "configuration-boundary-node-argument-1"
                      ],
                      "relations": [
                        "configuration-boundary-relation-argument-1"
                      ],
                      "flows": [
                        "configuration-boundary-flow"
                      ]
                    },
                    "text": "The platform supplies consistent mechanisms for authentication, authorization, constraints, and observation. Business owners and development and operations teams determine permitted business actions, sensitive information, and trusted external services. SimpleModeling conventions provide explicit places for those decisions in models and configuration."
                  },
                  {
                    "id": "configuration-boundary-argument-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "configuration-boundary"
                      ],
                      "claims": [
                        "configuration-boundary-claim-argument-2"
                      ],
                      "nodes": [
                        "configuration-boundary-node-argument-2"
                      ],
                      "relations": [
                        "configuration-boundary-relation-argument-1"
                      ],
                      "flows": [
                        "configuration-boundary-flow"
                      ]
                    },
                    "text": "Paths using direct SQL, network, filesystem, or process access outside standard APIs require an explicit assessment of which protections still apply. Identifying escape paths and their authority and checks maintains the connection to shared infrastructure when SARs and CARs are extended."
                  },
                  {
                    "id": "configuration-boundary-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "configuration-boundary"
                  }
                ],
                "sections": []
              },
              {
                "id": "security-operation-patterns-section",
                "heading": "Move from Usable Defaults to Application-Specific Security Operation Patterns",
                "coreRefs": {
                  "steps": [
                    "security-operation-patterns"
                  ],
                  "claims": [
                    "security-operation-patterns-claim-1",
                    "security-operation-patterns-claim-2",
                    "security-operation-patterns-claim-3",
                    "security-operation-patterns-claim-4"
                  ],
                  "nodes": [
                    "security-operation-patterns-node-1",
                    "security-operation-patterns-node-2",
                    "security-operation-patterns-node-3",
                    "security-operation-patterns-node-4"
                  ],
                  "relations": [
                    "security-operation-patterns-relation-1",
                    "security-operation-patterns-relation-2",
                    "security-operation-patterns-relation-3"
                  ],
                  "flows": [
                    "security-operation-patterns-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "security-operation-patterns-paragraph-1",
                    "kind": "paragraph",
                    "text": "The planned direction is to make application-appropriate protection selectable with a small number of settings while retaining standard usability. Knowledge about combining individual mechanisms will be packaged into reusable operation patterns, profiles, and guides.",
                    "coreRefs": {
                      "steps": [
                        "security-operation-patterns"
                      ],
                      "claims": [
                        "security-operation-patterns-claim-1"
                      ],
                      "nodes": [
                        "security-operation-patterns-node-1"
                      ],
                      "relations": [
                        "security-operation-patterns-relation-1"
                      ],
                      "flows": [
                        "security-operation-patterns-flow"
                      ]
                    }
                  },
                  {
                    "id": "security-operation-patterns-paragraph-2",
                    "kind": "paragraph",
                    "text": "Candidates include ordinary business use, public-facing services, sensitive information, and strong compartment isolation. Each pattern will describe protected assets, combined controls, effects, and operational burden so selection reflects application needs and cost.",
                    "coreRefs": {
                      "steps": [
                        "security-operation-patterns"
                      ],
                      "claims": [
                        "security-operation-patterns-claim-2"
                      ],
                      "nodes": [
                        "security-operation-patterns-node-2"
                      ],
                      "relations": [
                        "security-operation-patterns-relation-1",
                        "security-operation-patterns-relation-2"
                      ],
                      "flows": [
                        "security-operation-patterns-flow"
                      ]
                    }
                  },
                  {
                    "id": "security-operation-patterns-paragraph-3",
                    "kind": "paragraph",
                    "text": "Profiles are intended to apply the settings required by a selected pattern as a coherent set. This builds on the existing design: Capability Profile limits available capabilities, Security Profile selects the protection posture, and CML and configuration specify business-specific authorization. Predefined combinations reduce inconsistent settings and omissions that can arise when mechanisms are configured independently.",
                    "coreRefs": {
                      "steps": [
                        "security-operation-patterns"
                      ],
                      "claims": [
                        "security-operation-patterns-claim-3"
                      ],
                      "nodes": [
                        "security-operation-patterns-node-3"
                      ],
                      "relations": [
                        "security-operation-patterns-relation-2",
                        "security-operation-patterns-relation-3"
                      ],
                      "flows": [
                        "security-operation-patterns-flow"
                      ]
                    }
                  },
                  {
                    "id": "security-operation-patterns-paragraph-4",
                    "kind": "paragraph",
                    "text": "Guides will cover pattern selection, business-permission and deployment settings, allow/deny and audit-record checks, and revocation and recovery. Connecting the selected configuration to actual behavior combines simpler setup with verifiability.",
                    "coreRefs": {
                      "steps": [
                        "security-operation-patterns"
                      ],
                      "claims": [
                        "security-operation-patterns-claim-4"
                      ],
                      "nodes": [
                        "security-operation-patterns-node-4"
                      ],
                      "relations": [
                        "security-operation-patterns-relation-3"
                      ],
                      "flows": [
                        "security-operation-patterns-flow"
                      ]
                    }
                  },
                  {
                    "id": "planned-security-guidance",
                    "kind": "table",
                    "caption": "Planned Patterns, Profiles, and Guides",
                    "columns": [
                      {
