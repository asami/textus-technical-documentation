                      ],
                      "relations": [
                        "control-matrix-explanation-relation-1"
                      ],
                      "flows": [
                        "control-matrix-flow"
                      ]
                    }
                  },
                  {
                    "id": "control-matrix-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "control-matrix"
                  }
                ],
                "sections": []
              },
              {
                "id": "application-boundary-section",
                "heading": "Limit the Admission of External Requests",
                "coreRefs": {
                  "steps": [
                    "application-boundary"
                  ],
                  "claims": [
                    "application-boundary-claim-problem",
                    "application-boundary-claim-combination",
                    "application-boundary-claim-effect",
                    "application-boundary-claim-boundary"
                  ],
                  "nodes": [
                    "application-boundary-explanation-node-1",
                    "application-boundary-explanation-node-2",
                    "application-boundary-explanation-node-3",
                    "application-boundary-explanation-node-4"
                  ],
                  "relations": [
                    "application-boundary-explanation-relation-1",
                    "application-boundary-explanation-relation-2",
                    "application-boundary-explanation-relation-3"
                  ],
                  "flows": [
                    "application-boundary-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "application-boundary-explanation-problem",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "application-boundary"
                      ],
                      "claims": [
                        "application-boundary-claim-problem"
                      ],
                      "nodes": [
                        "application-boundary-explanation-node-1"
                      ],
                      "relations": [
                        "application-boundary-explanation-relation-1"
                      ],
                      "flows": [
                        "application-boundary-flow"
                      ]
                    },
                    "text": "External-request admission needs a structure in which public-tier checks and processing do not bypass internal protection."
                  },
                  {
                    "id": "application-boundary-explanation-combination",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "application-boundary"
                      ],
                      "claims": [
                        "application-boundary-claim-combination"
                      ],
                      "nodes": [
                        "application-boundary-explanation-node-2"
                      ],
                      "relations": [
                        "application-boundary-explanation-relation-1",
                        "application-boundary-explanation-relation-2"
                      ],
                      "flows": [
                        "application-boundary-flow"
                      ]
                    },
                    "text": "The following sections explain tier-specific trust boundaries, the restriction of public processing through Cloud Function First, and admission control that limits propagation of overload."
                  },
                  {
                    "id": "application-boundary-explanation-effect",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "application-boundary"
                      ],
                      "claims": [
                        "application-boundary-claim-effect"
                      ],
                      "nodes": [
                        "application-boundary-explanation-node-3"
                      ],
                      "relations": [
                        "application-boundary-explanation-relation-2",
                        "application-boundary-explanation-relation-3"
                      ],
                      "flows": [
                        "application-boundary-flow"
                      ]
                    },
                    "text": "These mechanisms control the scope of exposed functionality and authority, and the amount of work forwarded internally."
                  },
                  {
                    "id": "application-boundary-explanation-boundary",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "application-boundary"
                      ],
                      "claims": [
                        "application-boundary-claim-boundary"
                      ],
                      "nodes": [
                        "application-boundary-explanation-node-4"
                      ],
                      "relations": [
                        "application-boundary-explanation-relation-3"
                      ],
                      "flows": [
                        "application-boundary-flow"
                      ]
                    },
                    "text": "Authorization of admitted requests against operations and target data is connected to subsequent decisions in the Domain."
                  },
                  {
                    "id": "application-boundary-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "application-boundary"
                  }
                ],
                "sections": [
                  {
                    "id": "tiers-section",
                    "heading": "Three-Tier Trust Architecture",
                    "coreRefs": {
                      "steps": [
                        "tiers"
                      ],
                      "claims": [
                        "tiers-claim-term-definition",
                        "tiers-claim-cooperation-1",
                        "tiers-claim-1",
                        "tiers-claim-3",
                        "tiers-claim-layered-protection",
                        "tiers-claim-cloud-function-first"
                      ],
                      "nodes": [
                        "tiers-node-term-definition",
                        "tiers-explanation-node-3",
                        "tiers-explanation-node-1",
                        "tiers-explanation-node-2",
                        "tiers-node-layered-protection"
                      ],
                      "relations": [
                        "tiers-depends-on-tiers-node-term-definition",
                        "tiers-depends-on-tiers-explanation-node-3",
                        "tiers-depends-on-tiers-explanation-node-1",
                        "tiers-depends-on-tiers-explanation-node-2"
                      ],
                      "flows": [
                        "tiers-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "tiers-term-definition",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "tiers"
                          ],
                          "claims": [
                            "tiers-claim-term-definition"
                          ],
                          "nodes": [
                            "tiers-node-term-definition"
                          ],
                          "relations": [
                            "tiers-depends-on-tiers-node-term-definition"
                          ],
                          "flows": [
                            "tiers-flow"
                          ]
                        },
                        "text": "A tier is an execution and deployment division. This guide also calls the Presentation tier, which handles user interaction, the UI tier. The Application tier receives external requests and coordinates business operations, while the Domain tier manages business rules and state."
                      },
                      {
                        "id": "tiers-cooperation-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "tiers"
                          ],
                          "claims": [
                            "tiers-claim-cooperation-1"
                          ],
                          "nodes": [
                            "tiers-explanation-node-3"
                          ],
                          "relations": [
                            "tiers-depends-on-tiers-explanation-node-3"
                          ],
                          "flows": [
                            "tiers-flow"
                          ]
                        },
                        "text": "The Presentation tier can be built with technologies other than Textus, such as TypeScript/Node.js or Flutter. The architecture accommodates clients that cannot use Textus security mechanisms directly and establishes a Zero Trust boundary that does not assume trust in the Presentation tier. Client-side checks and screen-level operation restrictions do not replace server-side input validation or authorization."
                      },
                      {
                        "id": "tiers-block-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "tiers"
                          ],
                          "claims": [
                            "tiers-claim-1",
                            "tiers-claim-cloud-function-first"
                          ],
                          "nodes": [
                            "tiers-explanation-node-1"
                          ],
                          "relations": [
                            "tiers-depends-on-tiers-explanation-node-1"
                          ],
                          "flows": [
                            "tiers-flow"
                          ]
                        },
                        "text": "The Application tier verifies external requests and coordinates business operations through public Domain APIs. Cloud Function First keeps execution units small, without authority to access internal Domain data directly. The next section explains how functionality and authority are restricted."
                      },
                      {
                        "id": "tiers-block-3",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "tiers"
                          ],
                          "claims": [
                            "tiers-claim-3"
                          ],
                          "nodes": [
                            "tiers-explanation-node-2"
                          ],
                          "relations": [
                            "tiers-depends-on-tiers-explanation-node-2"
                          ],
                          "flows": [
                            "tiers-flow"
                          ]
                        },
                        "text": "The Domain tier verifies and resolves authentication state and caller identity received from the Application and authorizes operations under its own rules. In addition to permission to invoke an Operation, UnitOfWork checks access to target Entities, and business rules and state-transition conditions are applied. The Sandbox further limits accessible resources and consumption. Calls from the Application or execution inside the Domain do not by themselves confer unrestricted authority."
                      },
                      {
                        "id": "tiers-layered-protection",
                        "kind": "paragraph",
                        "text": "Between tiers, responsibilities, authority, and reachable paths are bounded; within the Domain, shared mechanisms apply rules for operations, target data, and resources. Moving a request from outside to inside does not automatically widen its permissions. Combining Presentation technology choice, Cloud Function First with bounded Application functionality and authority, and internal Domain controls supports the security of the system as a whole.",
                        "coreRefs": {
                          "steps": [
                            "tiers"
                          ],
                          "claims": [
                            "tiers-claim-layered-protection"
                          ],
                          "nodes": [
                            "tiers-node-layered-protection"
                          ],
                          "relations": [
                            "tiers-depends-on-tiers-node-term-definition",
                            "tiers-depends-on-tiers-explanation-node-3",
                            "tiers-depends-on-tiers-explanation-node-1",
                            "tiers-depends-on-tiers-explanation-node-2"
                          ],
                          "flows": [
                            "tiers-flow"
                          ]
                        }
                      },
                      {
                        "id": "tier-security-responsibilities",
                        "kind": "table",
                        "caption": "Tier Responsibilities and Boundaries",
                        "columns": [
                          {
                            "id": "tier-security-responsibilities-col-0",
