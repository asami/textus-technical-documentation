              },
              {
                "id": "immutable-runtime-section",
                "heading": "Support Replacement with Immutable Artifacts and Prepared Environments",
                "coreRefs": {
                  "steps": [
                    "immutable-runtime"
                  ],
                  "claims": [
                    "immutable-runtime-claim-cooperation-1",
                    "immutable-runtime-claim-1",
                    "immutable-runtime-claim-cooperation-2",
                    "immutable-runtime-claim-lifetime-control",
                    "immutable-runtime-claim-lifecycle-concepts",
                    "immutable-runtime-claim-persistence-boundaries",
                    "immutable-runtime-claim-replacement-limits",
                    "immutable-runtime-claim-performance-security-balance"
                  ],
                  "nodes": [
                    "immutable-runtime-explanation-node-2",
                    "immutable-runtime-explanation-node-1",
                    "immutable-runtime-explanation-node-3",
                    "immutable-runtime-node-lifetime-control",
                    "immutable-runtime-node-lifecycle-concepts",
                    "immutable-runtime-node-persistence-boundaries",
                    "immutable-runtime-node-replacement-limits",
                    "immutable-runtime-node-performance-security-balance"
                  ],
                  "relations": [
                    "immutable-runtime-explanation-relation-1",
                    "immutable-runtime-explanation-relation-2",
                    "immutable-runtime-relation-lifetime-control",
                    "immutable-runtime-relation-lifecycle-concepts",
                    "immutable-runtime-relation-persistence-boundaries",
                    "immutable-runtime-relation-replacement-limits",
                    "immutable-runtime-relation-performance-security-balance"
                  ],
                  "flows": [
                    "immutable-runtime-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "immutable-runtime-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-cooperation-1"
                      ],
                      "nodes": [
                        "immutable-runtime-explanation-node-2"
                      ],
                      "relations": [
                        "immutable-runtime-explanation-relation-1"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "Reconstructing execution environments from admitted immutable CARs and deployment configuration allows a problematic environment to be isolated and replaced with a known configuration. The deployment unit determines replacement scope, including its components and dependencies."
                  },
                  {
                    "id": "immutable-runtime-block-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-1"
                      ],
                      "nodes": [
                        "immutable-runtime-explanation-node-1"
                      ],
                      "relations": [
                        "immutable-runtime-explanation-relation-1",
                        "immutable-runtime-explanation-relation-2"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "The Domain uses a Primary for new mutations and Read Replicas for authorized reads. Standby describes readiness for promotion, which is checked separately from read service. Prepared replacements are designed to combine memory-resident responsiveness with replaceable environments."
                  },
                  {
                    "id": "immutable-runtime-cooperation-2",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-cooperation-2"
                      ],
                      "nodes": [
                        "immutable-runtime-explanation-node-3"
                      ],
                      "relations": [
                        "immutable-runtime-explanation-relation-2",
                        "immutable-runtime-relation-lifetime-control"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "Preparing standby environments and rotating them preserves replacement capability while retaining the performance of memory-resident execution. The next section explains promotion and drain."
                  },
                  {
                    "id": "immutable-runtime-lifetime-control",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-lifetime-control"
                      ],
                      "nodes": [
                        "immutable-runtime-node-lifetime-control"
                      ],
                      "relations": [
                        "immutable-runtime-relation-lifetime-control",
                        "immutable-runtime-relation-lifecycle-concepts"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "Models and tier separation limit functionality, authority, and reachable paths, while immutable artifacts allow runtime reconstruction. Replacement isolates a problematic runtime and returns execution to a known configuration."
                  },
                  {
                    "id": "immutable-runtime-lifecycle-concepts",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-lifecycle-concepts"
                      ],
                      "nodes": [
                        "immutable-runtime-node-lifecycle-concepts"
                      ],
                      "relations": [
                        "immutable-runtime-relation-lifecycle-concepts",
                        "immutable-runtime-relation-persistence-boundaries"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "How an environment changes and how long it lives are separate design axes. Mutable environments are updated in place; immutable environments are replaced. Ephemeral describes a short managed lifetime and can be combined with immutability. Cloud Function lifetimes also depend on runtime reuse and disposal policy."
                  },
                  {
                    "id": "immutable-runtime-persistence-boundaries",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-persistence-boundaries"
                      ],
                      "nodes": [
                        "immutable-runtime-node-persistence-boundaries"
                      ],
                      "relations": [
                        "immutable-runtime-relation-persistence-boundaries",
                        "immutable-runtime-relation-replacement-limits"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "CNCF deliberately uses memory for acceleration without leaving continuity-critical state solely in one process. Domain rules and UnitOfWork govern authoritative commits, from which caches and Views can be reconstructed. Preserving committed data across replacement must be qualified with the storage durability contract and recovery procedure. Intermediate computation and uncertain outcomes remain distinct from committed data."
                  },
                  {
                    "id": "immutable-runtime-replacement-limits",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-replacement-limits"
                      ],
                      "nodes": [
                        "immutable-runtime-node-replacement-limits"
                      ],
                      "relations": [
                        "immutable-runtime-relation-replacement-limits",
                        "immutable-runtime-relation-performance-security-balance"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "Environment replacement limits how long a compromise persists in the same environment. Its relationship to credential renewal and revocation, correction of the implementation cause, and persistent-state checks is covered under replacement and business recovery."
                  },
                  {
                    "id": "immutable-runtime-performance-security-balance",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-performance-security-balance"
                      ],
                      "nodes": [
                        "immutable-runtime-node-performance-security-balance"
                      ],
                      "relations": [
                        "immutable-runtime-relation-performance-security-balance"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    },
                    "text": "Application runtimes use reuse/disposal; the Domain rotates into prepared environments while retaining resident-memory performance. Updates, regular replacement and security response share a replacement mechanism, with distinct authority/recovery conditions for failure. See the [[../../immutable-infrastructure/textus-cncf-immutable-infrastructure.dox/index.dox][Immutable Infrastructure guide]] for adoption, operation and cost/effect, and [[../../availability/textus-cncf-availability-architecture.dox/index.dox][Availability and HA guide]] for synchronization and transfer details."
                  },
                  {
                    "id": "tier-performance-security-figure",
                    "kind": "figure",
                    "asset": "images/tier-performance-security-en.png",
                    "caption": "Balancing performance and security in Application and Domain tiers",
                    "alt": "Application environments serve multiple requests before disposal. Domain prepares a Standby while the old Active serves, then promotes it and drains and disposes of the old instance.",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-performance-security-balance"
                      ],
                      "nodes": [
                        "immutable-runtime-node-performance-security-balance"
                      ],
                      "relations": [
                        "immutable-runtime-relation-performance-security-balance"
                      ],
                      "flows": [
                        "immutable-runtime-flow"
                      ]
                    }
                  },
                  {
                    "id": "immutable-runtime-tier-comparison-caption",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "immutable-runtime"
                      ],
                      "claims": [
                        "immutable-runtime-claim-performance-security-balance"
                      ],
                      "nodes": [
