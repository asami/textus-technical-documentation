                            "authorization-decision-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-decision-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "authorization-decision"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "authorization-configuration-section",
                    "heading": "Refine Default Protection into Application-Specific Permission Scope",
                    "coreRefs": {
                      "steps": [
                        "authorization-configuration"
                      ],
                      "claims": [
                        "authorization-configuration-claim-1",
                        "authorization-configuration-claim-2",
                        "authorization-configuration-claim-3",
                        "authorization-configuration-claim-4"
                      ],
                      "nodes": [
                        "authorization-configuration-node-1",
                        "authorization-configuration-node-2",
                        "authorization-configuration-node-3",
                        "authorization-configuration-node-4"
                      ],
                      "relations": [
                        "authorization-configuration-relation-1",
                        "authorization-configuration-relation-2",
                        "authorization-configuration-relation-3"
                      ],
                      "flows": [
                        "authorization-configuration-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "authorization-configuration-paragraph-1",
                        "kind": "paragraph",
                        "text": "Application-specific rules are declared through CML ACCESS, Operation authorization metadata, and resource-specific configuration. Entity or collection defaults provide the starting point for specifying required visibility and actions.",
                        "coreRefs": {
                          "steps": [
                            "authorization-configuration"
                          ],
                          "claims": [
                            "authorization-configuration-claim-1"
                          ],
                          "nodes": [
                            "authorization-configuration-node-1"
                          ],
                          "relations": [
                            "authorization-configuration-relation-1"
                          ],
                          "flows": [
                            "authorization-configuration-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-configuration-paragraph-2",
                        "kind": "paragraph",
                        "text": "Permission scope combines Component/Service/Operation, collection or target Entity, actions such as read/update/delete, and attribute or state conditions. Creation is authorized at collection level because the Entity does not yet exist; search/list additionally narrows result visibility. Association changes and Store administration use rules for their respective resources and actions.",
                        "coreRefs": {
                          "steps": [
                            "authorization-configuration"
                          ],
                          "claims": [
                            "authorization-configuration-claim-2"
                          ],
                          "nodes": [
                            "authorization-configuration-node-2"
                          ],
                          "relations": [
                            "authorization-configuration-relation-1",
                            "authorization-configuration-relation-2"
                          ],
                          "flows": [
                            "authorization-configuration-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-configuration-paragraph-3",
                        "kind": "paragraph",
                        "text": "For example, document-editing Operations can be available to editors, target documents limited to assigned ones, and Guards require the same tenant and an editable state. When access must be limited to assigned documents, other grant paths such as owner/group permissions are configured to avoid unintended grants.",
                        "coreRefs": {
                          "steps": [
                            "authorization-configuration"
                          ],
                          "claims": [
                            "authorization-configuration-claim-3"
                          ],
                          "nodes": [
                            "authorization-configuration-node-3"
                          ],
                          "relations": [
                            "authorization-configuration-relation-2",
                            "authorization-configuration-relation-3"
                          ],
                          "flows": [
                            "authorization-configuration-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-configuration-paragraph-4",
                        "kind": "paragraph",
                        "text": "Precise scope reduces excessive authority and limits the targets that mistakes or compromise can affect. SimpleEntity supplies decision inputs, models and configuration express application policy, and shared Operation and UnitOfWork checks enforce it. The same development path therefore supports both baseline protection and fine-grained authorization.",
                        "coreRefs": {
                          "steps": [
                            "authorization-configuration"
                          ],
                          "claims": [
                            "authorization-configuration-claim-4"
                          ],
                          "nodes": [
                            "authorization-configuration-node-4"
                          ],
                          "relations": [
                            "authorization-configuration-relation-3"
                          ],
                          "flows": [
                            "authorization-configuration-flow"
                          ]
                        }
                      },
                      {
                        "id": "authorization-configuration-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "authorization-configuration"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "operation-authorization-section",
                    "heading": "Authorize Operation Invocation Before Execution",
                    "coreRefs": {
                      "steps": [
                        "operation-authorization"
                      ],
                      "claims": [
                        "operation-authorization-claim-expanded-1",
                        "operation-authorization-claim-expanded-2",
                        "operation-authorization-claim-expanded-3"
                      ],
                      "nodes": [
                        "operation-authorization-expanded-node-1",
                        "operation-authorization-expanded-node-2",
                        "operation-authorization-expanded-node-3"
                      ],
                      "relations": [
                        "operation-authorization-expanded-relation-1",
                        "operation-authorization-expanded-relation-2"
                      ],
                      "flows": [
                        "operation-authorization-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "operation-authorization-expanded-1",
                        "kind": "paragraph",
                        "text": "Operation authorization decides whether a Component/Service/Operation may be invoked. After resolving authentication state, the Subsystem evaluates the rule before creating or executing ActionCall. Web, REST, command, and other ingress paths converge here; Web admission alone does not start business logic.",
                        "coreRefs": {
                          "steps": [
                            "operation-authorization"
                          ],
                          "claims": [
                            "operation-authorization-claim-expanded-1"
                          ],
                          "nodes": [
                            "operation-authorization-expanded-node-1"
                          ],
                          "relations": [
                            "operation-authorization-expanded-relation-1"
                          ],
                          "flows": [
                            "operation-authorization-flow"
                          ]
                        }
                      },
                      {
                        "id": "operation-authorization-expanded-2",
                        "kind": "paragraph",
                        "text": "Rules describe anonymous access, execution modes, required privilege, roles, scopes, and Capabilities. Operation definitions, generated CML metadata, and Subsystem declarations feed a common runtime rule rather than relying on every handler to remember an authorization call.",
                        "coreRefs": {
                          "steps": [
                            "operation-authorization"
                          ],
                          "claims": [
                            "operation-authorization-claim-expanded-2"
                          ],
                          "nodes": [
                            "operation-authorization-expanded-node-2"
                          ],
                          "relations": [
                            "operation-authorization-expanded-relation-1",
                            "operation-authorization-expanded-relation-2"
                          ],
                          "flows": [
                            "operation-authorization-flow"
                          ]
                        }
                      },
                      {
                        "id": "operation-authorization-expanded-3",
                        "kind": "paragraph",
                        "text": "Permission to invoke a document-editing Operation does not necessarily permit editing a document owned by another organization. Operation authorization admits business processing; access to the actual Entity is evaluated separately at the UnitOfWork boundary.",
                        "coreRefs": {
                          "steps": [
                            "operation-authorization"
                          ],
                          "claims": [
                            "operation-authorization-claim-expanded-3"
                          ],
                          "nodes": [
                            "operation-authorization-expanded-node-3"
                          ],
                          "relations": [
                            "operation-authorization-expanded-relation-2"
                          ],
                          "flows": [
                            "operation-authorization-flow"
                          ]
                        }
                      },
                      {
                        "id": "operation-authorization-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "operation-authorization"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "entity-authorization-section",
                    "heading": "Authorize Target-Entity Access at UnitOfWork",
                    "coreRefs": {
                      "steps": [
                        "entity-authorization"
                      ],
                      "claims": [
                        "entity-authorization-claim-expanded-1",
                        "entity-authorization-claim-expanded-2",
                        "entity-authorization-claim-expanded-3",
                        "entity-authorization-claim-expanded-4"
                      ],
                      "nodes": [
                        "entity-authorization-expanded-node-1",
                        "entity-authorization-expanded-node-2",
                        "entity-authorization-expanded-node-3",
                        "entity-authorization-expanded-node-4"
                      ],
                      "relations": [
                        "entity-authorization-expanded-relation-1",
                        "entity-authorization-expanded-relation-2",
                        "entity-authorization-expanded-relation-3"
                      ],
                      "flows": [
                        "entity-authorization-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "entity-authorization-expanded-1",
                        "kind": "paragraph",
                        "text": "Business processing issues UnitOfWork requests through the protected internal DSL, and UnitOfWorkInterpreter authorizes Entity access. The decision combines subject, collection and Entity, access kind, relations, and execution conditions. Admission to an Operation does not permit arbitrary data access.",
                        "coreRefs": {
                          "steps": [
                            "entity-authorization"
                          ],
                          "claims": [
                            "entity-authorization-claim-expanded-1"
                          ],
                          "nodes": [
                            "entity-authorization-expanded-node-1"
                          ],
                          "relations": [
                            "entity-authorization-expanded-relation-1"
                          ],
                          "flows": [
                            "entity-authorization-flow"
                          ]
                        }
                      },
                      {
                        "id": "entity-authorization-expanded-2",
                        "kind": "paragraph",
                        "text": "For existing Entities, Permission and relationships map to required authority for read, update, delete, and other actions. When an execution projection lacks required permission metadata, the canonical persisted record is consulted. Creation is authorized at collection or resource-class level; search/list under user permissions also restricts result visibility.",
                        "coreRefs": {
                          "steps": [
                            "entity-authorization"
                          ],
                          "claims": [
                            "entity-authorization-claim-expanded-2"
                          ],
                          "nodes": [
                            "entity-authorization-expanded-node-2"
                          ],
                          "relations": [
                            "entity-authorization-expanded-relation-1",
                            "entity-authorization-expanded-relation-2"
                          ],
                          "flows": [
                            "entity-authorization-flow"
                          ]
                        }
                      },
                      {
                        "id": "entity-authorization-expanded-3",
                        "kind": "paragraph",
                        "text": "Distinguish UserPermission, ServiceInternal, and System access modes. Internal and System processing are declared execution roles, not consequences of network location. Cross-Component service access requires an explicit service grant.",
                        "coreRefs": {
                          "steps": [
                            "entity-authorization"
                          ],
                          "claims": [
                            "entity-authorization-claim-expanded-3"
                          ],
                          "nodes": [
                            "entity-authorization-expanded-node-3"
                          ],
                          "relations": [
                            "entity-authorization-expanded-relation-2",
                            "entity-authorization-expanded-relation-3"
                          ],
                          "flows": [
                            "entity-authorization-flow"
                          ]
                        }
                      },
                      {
                        "id": "entity-authorization-expanded-4",
                        "kind": "paragraph",
                        "text": "Operation authorization controls entry, while UnitOfWork authorization controls resources used during execution. Both use the same SecurityContext and report denials through common diagnostics and observation. Direct Store access from business code is not the normal path; Sandbox additionally limits available resources and consumption.",
                        "coreRefs": {
                          "steps": [
                            "entity-authorization"
                          ],
                          "claims": [
                            "entity-authorization-claim-expanded-4"
                          ],
                          "nodes": [
                            "entity-authorization-expanded-node-4"
                          ],
                          "relations": [
                            "entity-authorization-expanded-relation-3"
                          ],
                          "flows": [
                            "entity-authorization-flow"
                          ]
                        }
                      },
                      {
                        "id": "entity-authorization-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "entity-authorization"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "capability-context-section",
                    "heading": "Carry Authorization into ExecutionContext and Sandbox",
                    "coreRefs": {
                      "steps": [
                        "capability-context"
                      ],
                      "claims": [
                        "capability-context-claim-expanded-2",
                        "capability-context-claim-expanded-1"
                      ],
                      "nodes": [
                        "capability-context-expanded-node-2",
                        "capability-context-expanded-node-1"
                      ],
                      "relations": [
                        "capability-context-expanded-relation-1"
                      ],
                      "flows": [
                        "capability-context-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "capability-context-expanded-2",
                        "kind": "paragraph",
                        "text": "Carrying the authenticated subject, authorization conditions, and resource limits in a shared execution context enables checks throughout processing to use the same subject and constraints. Operation and UnitOfWork checks assess authority over operations and targets; Safety Sandbox limits access to and consumption of files, networks, processes, DataStores, and other resources. Connecting these responsibilities through common context reduces discrepancies between authorization and resource control.",
                        "coreRefs": {
                          "steps": [
                            "capability-context"
                          ],
                          "claims": [
                            "capability-context-claim-expanded-2"
                          ],
                          "nodes": [
                            "capability-context-expanded-node-2"
                          ],
                          "relations": [
                            "capability-context-expanded-relation-1"
                          ],
                          "flows": [
                            "capability-context-flow"
                          ]
                        }
                      },
                      {
                        "id": "capability-context-expanded-1",
                        "kind": "paragraph",
                        "text": "ExecutionContext holds SecurityContext, Sandbox, resource limits, observation information, and other execution conditions. The runtime constructs and manages this context and passes it to business processing, reducing places where individual handlers independently reconstruct authority from separate parameters.",
                        "coreRefs": {
                          "steps": [
                            "capability-context"
                          ],
                          "claims": [
                            "capability-context-claim-expanded-1"
                          ],
                          "nodes": [
                            "capability-context-expanded-node-1"
                          ],
                          "relations": [
                            "capability-context-expanded-relation-1"
                          ],
                          "flows": [
                            "capability-context-flow"
                          ]
                        }
                      },
                      {
                        "id": "capability-context-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "capability-context"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "sandbox-section",
                    "heading": "Constrain Admitted Execution Through Safety Sandbox",
                    "coreRefs": {
                      "steps": [
                        "sandbox"
                      ],
                      "claims": [
                        "sandbox-claim-1",
                        "sandbox-claim-2",
                        "sandbox-claim-3",
                        "sandbox-claim-4",
                        "sandbox-claim-cooperation-1"
                      ],
                      "nodes": [
                        "sandbox-explanation-node-1",
                        "sandbox-explanation-node-2",
                        "sandbox-explanation-node-3",
                        "sandbox-explanation-node-4",
                        "sandbox-explanation-node-5"
                      ],
                      "relations": [
                        "sandbox-explanation-relation-1",
                        "sandbox-explanation-relation-2",
                        "sandbox-explanation-relation-3",
                        "sandbox-explanation-relation-4"
                      ],
                      "flows": [
                        "sandbox-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "sandbox-block-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "sandbox"
                          ],
                          "claims": [
                            "sandbox-claim-1"
                          ],
                          "nodes": [
                            "sandbox-explanation-node-1"
                          ],
                          "relations": [
                            "sandbox-explanation-relation-1"
                          ],
                          "flows": [
                            "sandbox-flow"
                          ]
                        },
                        "text": "Safety Sandbox limits unauthorized resource actions arising from malicious code, bugs, operational mistakes, and AI errors."
                      },
                      {
                        "id": "sandbox-authority-limits-figure",
                        "kind": "figure",
                        "asset": "images/sandbox-authority-limits-en.png",
                        "caption": "Business authorization, external-resource permissions, and consumption limits remain distinct and are connected to execution through ExecutionContext.",
                        "alt": "Separate what execution may use from how much it may consume. Identity and business authority / SecuritySubject / operation and entity checks / Who may act on which target; Resource authority / Capabilities / Sandbox permissions / Network / filesystem / process access; Resource consumption / ExecutionLimits / Time / memory and other resource bounds; Shared execution context / ExecutionContext / Connect subject, authority, limits, observations",
                        "coreRefs": {
                          "steps": [
                            "sandbox"
                          ],
                          "claims": [
                            "sandbox-claim-1",
                            "sandbox-claim-2",
                            "sandbox-claim-3",
                            "sandbox-claim-4",
                            "sandbox-claim-cooperation-1"
                          ],
                          "nodes": [
                            "sandbox-explanation-node-1",
                            "sandbox-explanation-node-2",
                            "sandbox-explanation-node-3",
                            "sandbox-explanation-node-4",
                            "sandbox-explanation-node-5"
                          ],
                          "relations": [
                            "sandbox-explanation-relation-1",
                            "sandbox-explanation-relation-2",
                            "sandbox-explanation-relation-3",
                            "sandbox-explanation-relation-4"
                          ],
                          "flows": [
                            "sandbox-flow"
                          ]
                        }
                      },
                      {
                        "id": "sandbox-block-2",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "sandbox"
                          ],
                          "claims": [
                            "sandbox-claim-2"
                          ],
                          "nodes": [
                            "sandbox-explanation-node-2"
                          ],
                          "relations": [
                            "sandbox-explanation-relation-1",
                            "sandbox-explanation-relation-2"
                          ],
                          "flows": [
                            "sandbox-flow"
                          ]
                        },
                        "text": "ExecutionContext, SandboxContext, Capability, and ExecutionLimits constrain authority and resource consumption for files, networks, processes, HTTP, DataStores, and external services."
                      },
                      {
                        "id": "sandbox-block-3",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "sandbox"
                          ],
                          "claims": [
                            "sandbox-claim-3"
                          ],
                          "nodes": [
                            "sandbox-explanation-node-3"
                          ],
                          "relations": [
                            "sandbox-explanation-relation-2",
                            "sandbox-explanation-relation-3"
                          ],
                          "flows": [
                            "sandbox-flow"
                          ]
                        },
                        "text": "Instructions and Skills guide AI behavior. Sandbox complements that guidance with technical restrictions by rejecting operations not admitted by the runtime."
                      },
                      {
                        "id": "sandbox-block-4",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "sandbox"
                          ],
                          "claims": [
                            "sandbox-claim-4"
                          ],
                          "nodes": [
                            "sandbox-explanation-node-4"
                          ],
                          "relations": [
                            "sandbox-explanation-relation-3",
                            "sandbox-explanation-relation-4"
                          ],
                          "flows": [
                            "sandbox-flow"
                          ]
                        },
                        "text": "Hard limits cannot be exceeded by the execution subject. Soft limits can be adjusted within those bounds by an authorized execution context. Authority to use a resource and the amount that may be consumed are configured separately."
                      },
                      {
                        "id": "sandbox-cooperation-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "sandbox"
                          ],
                          "claims": [
                            "sandbox-claim-cooperation-1"
                          ],
                          "nodes": [
                            "sandbox-explanation-node-5"
                          ],
                          "relations": [
                            "sandbox-explanation-relation-4"
                          ],
                          "flows": [
                            "sandbox-flow"
                          ]
                        },
                        "text": "Sandbox limits authority and resources; it does not establish that behavior within those limits is correct for the business. Combine it with input models, standard APIs, and business-rule checks, and address remaining anomalies through observation, containment, and recovery."
                      },
                      {
                        "id": "sandbox-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "sandbox"
                      }
                    ],
                    "sections": []
                  },
                  {
                    "id": "auth-cache-section",
                    "heading": "Reduce Authentication Load with Bounded Caches",
                    "coreRefs": {
                      "steps": [
                        "auth-cache"
                      ],
                      "claims": [
                        "auth-cache-claim-cooperation-1",
                        "auth-cache-claim-1",
                        "auth-cache-claim-2",
                        "auth-cache-claim-3"
                      ],
                      "nodes": [
                        "auth-cache-explanation-node-4",
                        "auth-cache-explanation-node-1",
                        "auth-cache-explanation-node-2",
                        "auth-cache-explanation-node-3"
                      ],
                      "relations": [
                        "auth-cache-explanation-relation-1",
                        "auth-cache-explanation-relation-2",
                        "auth-cache-explanation-relation-3"
                      ],
                      "flows": [
                        "auth-cache-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "auth-cache-cooperation-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "auth-cache"
                          ],
                          "claims": [
                            "auth-cache-claim-cooperation-1"
                          ],
                          "nodes": [
                            "auth-cache-explanation-node-4"
                          ],
                          "relations": [
                            "auth-cache-explanation-relation-1"
                          ],
                          "flows": [
                            "auth-cache-flow"
                          ]
                        },
                        "text": "Reusing references to authentication state reduces repeated state lookups associated with requests and lowers load on User Management and the User DB. Bounding storage location, capacity, and lifetime also controls where references are replicated and how much is retained. This contributes to authentication-service availability and information management; permission to perform an operation is determined through AuthHandle validity and each Domain's authorization."
                      },
                      {
                        "id": "auth-cache-block-1",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "auth-cache"
                          ],
                          "claims": [
                            "auth-cache-claim-1"
                          ],
                          "nodes": [
                            "auth-cache-explanation-node-1"
                          ],
                          "relations": [
                            "auth-cache-explanation-relation-1",
                            "auth-cache-explanation-relation-2"
                          ],
                          "flows": [
                            "auth-cache-flow"
                          ]
                        },
                        "text": "The standard Cloud Function cache is instance-local memory mapping credential fingerprints or evidence identifiers to AuthHandles, with bounded capacity and TTL. An AuthHandle is an opaque reference with a validity period; persistent or cross-instance shared caching is not assumed. Cache TTL, AuthHandle expiration, and session invalidation and revocation behavior are verified together."
                      },
                      {
                        "id": "auth-cache-block-2",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "auth-cache"
                          ],
                          "claims": [
                            "auth-cache-claim-2"
                          ],
                          "nodes": [
                            "auth-cache-explanation-node-2"
                          ],
                          "relations": [
                            "auth-cache-explanation-relation-2",
                            "auth-cache-explanation-relation-3"
                          ],
                          "flows": [
                            "auth-cache-flow"
                          ]
                        },
                        "text": "A cache miss calls User Management. User Management uses its own memory and caches before accessing the User DB. The normal path is Cloud Function instance memory, then User Management memory and caches, then the User DB."
                      },
                      {
                        "id": "auth-cache-block-3",
                        "kind": "paragraph",
                        "coreRefs": {
                          "steps": [
                            "auth-cache"
                          ],
                          "claims": [
                            "auth-cache-claim-3"
                          ],
                          "nodes": [
                            "auth-cache-explanation-node-3"
                          ],
                          "relations": [
                            "auth-cache-explanation-relation-3"
                          ],
                          "flows": [
                            "auth-cache-flow"
                          ]
                        },
                        "text": "The standard configuration uses instance-local caches to keep storage locations and communication paths limited. External shared caches such as Redis are considered when measured scalability requirements justify them. Their additional communication, consistency management, retained information, and operational protection are evaluated alongside the expected load reduction."
                      },
                      {
                        "id": "auth-cache-logical-structure",
                        "kind": "logical-structure",
                        "stepRef": "auth-cache"
                      }
                    ],
                    "sections": []
                  }
                ]
              },
              {
                "id": "safe-application-paths-section",
                "heading": "Reduce Defects and Disclosure in Authorized Processing",
                "coreRefs": {
                  "steps": [
                    "safe-application-paths"
                  ],
                  "claims": [
                    "safe-application-paths-claim-problem",
                    "safe-application-paths-claim-combination",
                    "safe-application-paths-claim-effect",
                    "safe-application-paths-claim-boundary"
