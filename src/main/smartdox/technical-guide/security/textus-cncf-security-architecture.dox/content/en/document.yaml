                "distribution-trust-node-argument-1",
                "distribution-trust-node-argument-2"
              ],
              "relations": [
                "distribution-trust-relation-argument-1"
              ],
              "flows": [
                "distribution-trust-flow"
              ]
            },
            "blocks": [
              {
                "id": "distribution-trust-argument-1",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "distribution-trust"
                  ],
                  "claims": [
                    "distribution-trust-claim-argument-1"
                  ],
                  "nodes": [
                    "distribution-trust-node-argument-1"
                  ],
                  "relations": [
                    "distribution-trust-relation-argument-1"
                  ],
                  "flows": [
                    "distribution-trust-flow"
                  ]
                },
                "text": "Carrying assessment results to consumers requires relating the assessed contents to what is deployed. Signatures establish publisher and content identity, Component Repositories provide a shared distribution path, and consumer-side admission checks suitability for local deployment conditions and authority policies."
              },
              {
                "id": "artifact-trust-path-figure",
                "kind": "figure",
                "asset": "images/artifact-trust-path-en.png",
                "caption": "Assessment, signatures, repositories, admission, and runtime controls make distinct decisions. This is the architectural relationship; availability is discussed in the text.",
                "alt": "Separate content assessment, publisher verification, and admission. Development / generation / Model contracts / lint / design review / Completed CAR under assessment; Publisher / distribution / Bind publisher and content by signature / CAR + signature / publisher information; Component Repository / Relate versions and contents for delivery / Artifact to verify; Consumer admission / Contracts / dependencies / authority / local policy / Authority admitted by the consumer; Textus execution / Enforce authorization and Sandbox restrictions / Permitted operations and resources",
                "coreRefs": {
                  "steps": [
                    "distribution-trust"
                  ],
                  "claims": [
                    "distribution-trust-claim-argument-1",
                    "distribution-trust-claim-argument-2"
                  ],
                  "nodes": [
                    "distribution-trust-node-argument-1",
                    "distribution-trust-node-argument-2"
                  ],
                  "relations": [
                    "distribution-trust-relation-argument-1"
                  ],
                  "flows": [
                    "distribution-trust-flow"
                  ]
                }
              },
              {
                "id": "distribution-trust-argument-2",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "distribution-trust"
                  ],
                  "claims": [
                    "distribution-trust-claim-argument-2"
                  ],
                  "nodes": [
                    "distribution-trust-node-argument-2"
                  ],
                  "relations": [
                    "distribution-trust-relation-argument-1"
                  ],
                  "flows": [
                    "distribution-trust-flow"
                  ]
                },
                "text": "Component contracts and inspection results are carried to the destination, where granted authority is determined. Connecting admission to the runtime controls in the next chapter combines reuse of assessed components with destination-specific authority limits."
              },
              {
                "id": "distribution-trust-logical-structure",
                "kind": "logical-structure",
                "stepRef": "distribution-trust"
              }
            ],
            "sections": [
              {
                "id": "repository-signature-section",
                "heading": "Verify the Publisher and CAR Content with Digital Signatures",
                "coreRefs": {
                  "steps": [
                    "repository-signature"
                  ],
                  "claims": [
                    "repository-signature-claim-expanded-1",
                    "repository-signature-claim-expanded-2",
                    "repository-signature-claim-expanded-3",
                    "repository-signature-claim-expanded-4"
                  ],
                  "nodes": [
                    "repository-signature-expanded-node-1",
                    "repository-signature-expanded-node-2",
                    "repository-signature-expanded-node-3",
                    "repository-signature-expanded-node-4"
                  ],
                  "relations": [
                    "repository-signature-expanded-relation-1",
                    "repository-signature-expanded-relation-2",
                    "repository-signature-expanded-relation-3"
                  ],
                  "flows": [
                    "repository-signature-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "repository-signature-expanded-1",
                    "kind": "paragraph",
                    "text": "CAR lint and CBD Review assess contracts, authority, dependencies, implementation, and design. Digital signatures establish that a trusted publisher key signed the CAR and that its content has not changed since signing. Combining assessment and signatures provides a basis for identifying and using the artifact that underwent the required checks.",
                    "coreRefs": {
                      "steps": [
                        "repository-signature"
                      ],
                      "claims": [
                        "repository-signature-claim-expanded-1"
                      ],
                      "nodes": [
                        "repository-signature-expanded-node-1"
                      ],
                      "relations": [
                        "repository-signature-expanded-relation-1"
                      ],
                      "flows": [
                        "repository-signature-flow"
                      ]
                    }
                  },
                  {
                    "id": "repository-signature-expanded-2",
                    "kind": "paragraph",
                    "text": "Associate assessment results with the CAR identity, version, and content. Sign the completed CAR as a whole, and do not treat recompressed or replaced content as the same verified artifact. Changed CARs need corresponding assessment results and signatures. A signature alone does not prove that checks occurred or that the code is safe.",
                    "coreRefs": {
                      "steps": [
                        "repository-signature"
                      ],
                      "claims": [
                        "repository-signature-claim-expanded-2"
                      ],
                      "nodes": [
                        "repository-signature-expanded-node-2"
                      ],
                      "relations": [
                        "repository-signature-expanded-relation-1",
                        "repository-signature-expanded-relation-2"
                      ],
                      "flows": [
                        "repository-signature-flow"
                      ]
                    }
                  },
                  {
                    "id": "repository-signature-expanded-3",
                    "kind": "paragraph",
                    "text": "Consumers configure a Repository trust root and use publisher-key information verifiable from it. In addition to cryptographic validity, check that the key is valid and authorized for the CAR namespace. A key delivered with a CAR is not trusted merely because it is bundled with it.",
                    "coreRefs": {
                      "steps": [
                        "repository-signature"
                      ],
                      "claims": [
                        "repository-signature-claim-expanded-3"
                      ],
                      "nodes": [
                        "repository-signature-expanded-node-3"
                      ],
                      "relations": [
                        "repository-signature-expanded-relation-2",
                        "repository-signature-expanded-relation-3"
                      ],
                      "flows": [
                        "repository-signature-flow"
                      ]
                    }
                  },
                  {
                    "id": "repository-signature-expanded-4",
                    "kind": "paragraph",
                    "text": "This section describes a use model combining signatures and content assessment. The adopted general distribution specification makes signing optional and permits unsigned CAR retrieval after checksum verification. An unsigned CAR is not signature-verified, and a failed retrieval or verification of a present signature must not fall back to unsigned acceptance. Signature and retrieval verification are planned contracts; this guide does not assert implementation completion.",
                    "coreRefs": {
                      "steps": [
                        "repository-signature"
                      ],
                      "claims": [
                        "repository-signature-claim-expanded-4"
                      ],
                      "nodes": [
                        "repository-signature-expanded-node-4"
                      ],
                      "relations": [
                        "repository-signature-expanded-relation-3"
                      ],
                      "flows": [
                        "repository-signature-flow"
                      ]
                    }
                  },
                  {
                    "id": "repository-signature-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "repository-signature"
                  }
                ],
                "sections": []
              },
              {
                "id": "component-repository-section",
                "heading": "Distribute and Use Assessed Components Through Component Repository",
                "coreRefs": {
                  "steps": [
                    "component-repository"
                  ],
                  "claims": [
                    "component-repository-claim-expanded-1",
                    "component-repository-claim-expanded-2",
                    "component-repository-claim-expanded-3",
                    "component-repository-claim-expanded-4"
                  ],
                  "nodes": [
                    "component-repository-expanded-node-1",
                    "component-repository-expanded-node-2",
                    "component-repository-expanded-node-3",
                    "component-repository-expanded-node-4"
                  ],
                  "relations": [
                    "component-repository-expanded-relation-1",
                    "component-repository-expanded-relation-2",
                    "component-repository-expanded-relation-3"
                  ],
                  "flows": [
                    "component-repository-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "component-repository-expanded-1",
                    "kind": "paragraph",
                    "text": "The publisher packages models, contracts, and code into a CAR, uses CAR lint for mechanical violations, and uses CBD Review for authority, dependency, and design judgments. Signed distribution signs the completed CAR corresponding to that assessment. The Component Repository distribution model associates CAR versions and dependencies with assessment references, signatures, and publisher information.",
                    "coreRefs": {
                      "steps": [
                        "component-repository"
                      ],
                      "claims": [
                        "component-repository-claim-expanded-1"
                      ],
                      "nodes": [
                        "component-repository-expanded-node-1"
                      ],
                      "relations": [
                        "component-repository-expanded-relation-1"
                      ],
                      "flows": [
                        "component-repository-flow"
                      ]
                    }
                  },
                  {
                    "id": "component-repository-expanded-2",
                    "kind": "paragraph",
                    "text": "The consumer downloads a CAR into temporary storage and verifies the completed download against its checksum and, when signed, a trusted-key signature. Those accepted CAR bytes enter usable cache before extraction and loading. A different file fetched afterward is not treated as the verified artifact.",
                    "coreRefs": {
                      "steps": [
                        "component-repository"
                      ],
                      "claims": [
                        "component-repository-claim-expanded-2"
                      ],
                      "nodes": [
                        "component-repository-expanded-node-2"
                      ],
                      "relations": [
                        "component-repository-expanded-relation-1",
                        "component-repository-expanded-relation-2"
                      ],
                      "flows": [
                        "component-repository-flow"
                      ]
                    }
                  },
                  {
                    "id": "component-repository-expanded-3",
                    "kind": "paragraph",
                    "text": "Consumers can select versions with verified provenance and the required CAR lint and CBD Review results. Checksums detect download corruption, signatures verify provenance and content, and lint and review assess that content. Repository management makes these distinct facts available for component-reuse decisions.",
                    "coreRefs": {
                      "steps": [
                        "component-repository"
                      ],
                      "claims": [
                        "component-repository-claim-expanded-3"
                      ],
                      "nodes": [
                        "component-repository-expanded-node-3"
                      ],
                      "relations": [
                        "component-repository-expanded-relation-2",
                        "component-repository-expanded-relation-3"
                      ],
                      "flows": [
                        "component-repository-flow"
                      ]
                    }
                  },
                  {
                    "id": "component-repository-expanded-4",
                    "kind": "paragraph",
                    "text": "Retrieval and verification do not authorize unrestricted execution. Compare required authority, dependent CARs, runtime requirements, and update compatibility with deployment policy, and apply admitted scope through authorization and Sandbox. Dependency and vulnerability information informs later updates; past assessment is not assurance for every future configuration.",
                    "coreRefs": {
                      "steps": [
                        "component-repository"
                      ],
                      "claims": [
                        "component-repository-claim-expanded-4"
                      ],
                      "nodes": [
                        "component-repository-expanded-node-4"
                      ],
                      "relations": [
                        "component-repository-expanded-relation-3"
                      ],
                      "flows": [
                        "component-repository-flow"
                      ]
                    }
                  },
                  {
                    "id": "component-repository-logical-structure",
                    "kind": "logical-structure",
                    "stepRef": "component-repository"
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "security-coverage-section",
            "heading": "Covering Required Protection Along Execution Paths",
            "coreRefs": {
              "steps": [
                "security-coverage"
              ],
              "claims": [
                "security-coverage-claim-argument-1",
                "security-coverage-claim-argument-2"
              ],
              "nodes": [
                "security-coverage-node-argument-1",
                "security-coverage-node-argument-2"
              ],
              "relations": [
                "security-coverage-relation-argument-1"
              ],
              "flows": [
                "security-coverage-flow"
              ]
            },
            "blocks": [
              {
                "id": "security-coverage-argument-1",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "security-coverage"
                  ],
                  "claims": [
                    "security-coverage-claim-argument-1"
                  ],
                  "nodes": [
                    "security-coverage-node-argument-1"
                  ],
                  "relations": [
                    "security-coverage-relation-argument-1"
                  ],
                  "flows": [
                    "security-coverage-flow"
                  ]
                },
                "text": "Admitted components run through shared authentication and authorization paths that apply the target Component or Domain’s rules. External-request admission, operation and data authorization, input and output protection, and resource limits each address a different boundary."
              },
              {
                "id": "security-coverage-argument-2",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "security-coverage"
                  ],
                  "claims": [
                    "security-coverage-claim-argument-2"
                  ],
                  "nodes": [
                    "security-coverage-node-argument-2"
                  ],
                  "relations": [
                    "security-coverage-relation-argument-1"
                  ],
                  "flows": [
                    "security-coverage-flow"
                  ]
                },
                "text": "The following sections first map threats to controls and then explain each boundary's structure and processing. Identifying decision inputs, enforcement paths, and information passed to the next mechanism makes the connections between controls technically understandable."
              },
              {
                "id": "security-coverage-logical-structure",
                "kind": "logical-structure",
                "stepRef": "security-coverage"
              }
            ],
            "sections": [
              {
                "id": "control-matrix-section",
                "heading": "Threats, Combined Controls, Assumptions, and Limits",
                "coreRefs": {
                  "steps": [
                    "control-matrix"
                  ],
                  "claims": [
                    "control-matrix-claim-explanation",
                    "control-matrix-claim-mapping-1",
                    "control-matrix-claim-mapping-2",
                    "control-matrix-claim-mapping-3",
                    "control-matrix-claim-mapping-4",
                    "control-matrix-claim-mapping-5",
                    "control-matrix-claim-mapping-6",
                    "control-matrix-claim-mapping-7",
                    "control-matrix-claim-mapping-8",
                    "control-matrix-claim-mapping-9",
                    "control-matrix-claim-mapping-10",
                    "control-matrix-claim-mapping-11",
                    "control-matrix-claim-mapping-12"
                  ],
                  "nodes": [
                    "control-matrix-explanation-node-1",
                    "control-matrix-explanation-node-2"
                  ],
                  "relations": [
                    "control-matrix-explanation-relation-1"
                  ],
                  "flows": [
                    "control-matrix-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "control-matrix-explanation",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "control-matrix"
                      ],
                      "claims": [
                        "control-matrix-claim-explanation"
                      ],
                      "nodes": [
                        "control-matrix-explanation-node-1"
                      ],
                      "relations": [
                        "control-matrix-explanation-relation-1"
                      ],
                      "flows": [
                        "control-matrix-flow"
                      ]
                    },
                    "text": "The mapping identifies combined behavior as well as control names, assumptions, and limits. Read each row with its chapter rather than as an independent guarantee."
                  },
                  {
                    "id": "control-matrix-mappings",
                    "kind": "table",
                    "caption": "Protection targets and security mechanisms",
                    "columns": [
                      {
                        "id": "target",
                        "heading": "Protection target / threat"
                      },
                      {
                        "id": "mechanisms",
                        "heading": "Mechanisms and protection"
                      },
                      {
                        "id": "conditions",
                        "heading": "Conditions and complementary controls"
                      }
                    ],
                    "rows": [
                      {
                        "id": "control-matrix-mapping-1",
                        "cells": [
                          "Unauthorized Domain access",
                          "Normalize authentication state into SecuritySubject and separately authorize Operation invocation and target-Entity access at UnitOfWork; Sandbox limits resources.",
                          "Invocation permission does not grant target-data rights. Check subject, target, context, and revocation behavior."
                        ]
                      },
                      {
                        "id": "control-matrix-mapping-2",
                        "cells": [
                          "Compromised public Cloud Function",
                          "Reduce public-tier features and authority, withhold direct Domain DB access, and authorize per Domain.",
                          "Permitted paths can still be abused; combine target-specific authorization with observation and revocation."
                        ]
                      },
                      {
                        "id": "control-matrix-mapping-3",
                        "cells": [
                          "DDoS and overload",
                          "Combine edge controls, model input constraints, cheap prechecks, and downstream concurrency limits.",
                          "Valid requests can still arrive in volume. Network and provider capacity require separate treatment."
                        ]
                      },
                      {
                        "id": "control-matrix-mapping-4",
                        "cells": [
                          "SQL injection",
                          "Use typed Repository/DataStore paths, inspect raw-SQL escape hatches, and limit executor authority.",
                          "Type declarations alone do not make arbitrary SQL implementations safe."
                        ]
                      },
                      {
                        "id": "control-matrix-mapping-5",
                        "cells": [
                          "XSS, CSRF, and mass assignment",
                          "Combine context-aware rendering, mutation Operations and ingress CSRF policy, and declared input binding.",
                          "These controls cover distinct paths; inspect exceptional output and input paths as well."
                        ]
                      },
                      {
                        "id": "control-matrix-mapping-6",
                        "cells": [
                          "Unauthorized resource use",
                          "Model Component authority needs, check them at admission, and enforce them through Sandbox and ExecutionLimits.",
                          "This depends on excluding direct paths that bypass enforcement."
                        ]
                      },
                      {
                        "id": "control-matrix-mapping-7",
                        "cells": [
                          "Credential or Secret disclosure",
                          "Minimize retention by classification, delegate externally, and limit access and log/trace output.",
                          "Necessary references and personal data still need protection; verify the provider boundary too."
                        ]
                      },
                      {
                        "id": "control-matrix-mapping-8",
                        "cells": [
                          "Runtime compromise",
                          "Limit impact through least authority, then observe, revoke, isolate, and replace from immutable artifacts.",
                          "Replacement alone does not undo past disclosure or unauthorized mutations."
                        ]
                      },
                      {
                        "id": "control-matrix-mapping-9",
                        "cells": [
                          "Defective standby or recovery paths",
                          "Exercise readiness, promotion, draining, and cache rebuilding through ordinary reads and regular rotation.",
                          "Check replaceability separately from persistent-state correctness."
                        ]
                      },
                      {
                        "id": "control-matrix-mapping-10",
                        "cells": [
                          "Artifact and generated-code defects",
                          "Assess content with CAR lint and CBD Review, link assessed artifacts and publishers to distributed CARs through signatures and Component Repository, and admit them locally.",
                          "A signature alone does not prove assessment. Distinguish unsigned treatment and verification implementation status, and limit authority in the consuming environment."
                        ]
                      },
                      {
                        "id": "control-matrix-mapping-11",
                        "cells": [
                          "AI misjudgment and tool misuse",
                          "Inspect generated artifacts, constrain the AI actor's tool authority through Sandbox, and involve humans in consequential decisions.",
                          "Instructions and self-assessment are neither enforcement nor independent evidence."
                        ]
                      },
                      {
                        "id": "control-matrix-mapping-12",
                        "cells": [
                          "Excessive defensive machinery",
                          "Review threats and required authority and use established constraint, observation, and recovery paths.",
                          "Reducing complexity does not justify omitting necessary checks or defenses."
                        ]
                      }
                    ],
                    "coreRefs": {
                      "steps": [
                        "control-matrix"
                      ],
                      "claims": [
                        "control-matrix-claim-mapping-1",
                        "control-matrix-claim-mapping-2",
                        "control-matrix-claim-mapping-3",
                        "control-matrix-claim-mapping-4",
                        "control-matrix-claim-mapping-5",
                        "control-matrix-claim-mapping-6",
                        "control-matrix-claim-mapping-7",
                        "control-matrix-claim-mapping-8",
