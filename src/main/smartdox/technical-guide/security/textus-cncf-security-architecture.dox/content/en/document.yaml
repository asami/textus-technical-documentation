                          ]
                        }
                      },
                      {
                        "id": "lifecycle-block-2-item-5",
                        "text": "Contain: use authority and dependency information to select revocation and isolation targets and limit propagation.",
                        "coreRefs": {
                          "steps": [
                            "lifecycle"
                          ],
                          "claims": [
                            "lifecycle-claim-6"
                          ],
                          "nodes": [
                            "lifecycle-explanation-node-2"
                          ],
                          "relations": [
                            "lifecycle-explanation-relation-1",
                            "lifecycle-explanation-relation-2"
                          ],
                          "flows": [
                            "lifecycle-flow"
                          ]
                        }
                      },
                      {
                        "id": "lifecycle-block-2-item-6",
                        "text": "Recover: replace environments from verified artifacts and combine this with persistent-state checks and business recovery.",
                        "coreRefs": {
                          "steps": [
                            "lifecycle"
                          ],
                          "claims": [
                            "lifecycle-claim-7"
                          ],
                          "nodes": [
                            "lifecycle-explanation-node-2"
                          ],
                          "relations": [
                            "lifecycle-explanation-relation-1",
                            "lifecycle-explanation-relation-2"
                          ],
                          "flows": [
                            "lifecycle-flow"
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "id": "lifecycle-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "lifecycle"
                      ],
                      "claims": [
                        "lifecycle-claim-cooperation-1"
                      ],
                      "nodes": [
                        "lifecycle-explanation-node-3"
                      ],
                      "relations": [
                        "lifecycle-explanation-relation-2"
                      ],
                      "flows": [
                        "lifecycle-flow"
                      ]
                    },
                    "text": "Prevention and verification reduce defect introduction; constraints limit the effects of defects and compromise that remain. Observation identifies residual anomalies and supports containment and recovery. Place these roles across design, distribution, execution, and operations."
                  },
                  {
