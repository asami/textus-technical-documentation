                      ],
                      "relations": [
                        "lint-admission-explanation-relation-1"
                      ],
                      "flows": [
                        "lint-admission-flow"
                      ]
                    },
                    "text": "CAR lint detects mechanically decidable structural and contractual violations; CBD Review examines design suitability, including authority and dependencies. Their responsibilities follow the nature of the decision."
                  },
                  {
                    "id": "lint-admission-block-3",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "lint-admission"
                      ],
                      "claims": [
                        "lint-admission-claim-3"
                      ],
                      "nodes": [
                        "lint-admission-explanation-node-2"
                      ],
                      "relations": [
                        "lint-admission-explanation-relation-1",
                        "lint-admission-explanation-relation-2"
                      ],
                      "flows": [
                        "lint-admission-flow"
                      ]
                    },
                    "text": "Compilation, tests, AI review, and artifact publication do not independently grant execution authority. Admission is a separate boundary that checks the required contracts and evidence before activation."
                  },
                  {
                    "id": "lint-admission-cooperation-1",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "lint-admission"
                      ],
                      "claims": [
                        "lint-admission-claim-cooperation-1"
                      ],
                      "nodes": [
                        "lint-admission-explanation-node-3"
                      ],
                      "relations": [
                        "lint-admission-explanation-relation-2"
                      ],
                      "flows": [
                        "lint-admission-flow"
                      ]
                    },
                    "text": "Static checks, semantic review, and deployment admission perform different judgments. Success in one does not replace the others. Admit only the authority needed in the deployment and preserve those limits during execution."
                  },
                  {
                    "id": "lint-admission-logical-structure",
