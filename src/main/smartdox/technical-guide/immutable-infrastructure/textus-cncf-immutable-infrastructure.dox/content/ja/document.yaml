                    "im-reference-guides-claim"
                  ],
                  "nodes": [
                    "im-reference-guides-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-references-flow"
                  ]
                },
                "text": "[[../../availability/textus-cncf-availability-architecture.dox/index.dox][可用性・HA技術ガイド]]は、サービス継続の目的、構成、同期、権限制御および切替えプロトコルを説明します。[[../../security/textus-cncf-security-architecture.dox/index.dox][Security技術ガイド]]は、防御全体での位置付けを扱います。[[../../reactive/textus-cncf-reactive-architecture.dox/index.dox][リアクティブ技術ガイド]]は、メモリ常駐、UnitOfWorkおよび回復可能性の関係を扱います。"
              },
              {
                "id": "im-reference-authority",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-references"
                  ],
                  "claims": [
                    "im-reference-authority-claim"
                  ],
                  "nodes": [
                    "im-reference-authority-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-references-flow"
                  ]
                },
                "text": "Textus固有の設計根拠は、CNCFのAvailability Architecture、Subsystem Runtime ArchitectureおよびRuntime Cache Synchronizationです。実装計画はCNCF Phase 108が管理します。本書は、それらの設計と計画を説明する技術文書です。原典と更新日を参照し、実装契約と検証結果はCNCF側の記録で確認します。"
              },
              {
                "id": "im-reference-design-harness",
                "kind": "paragraph",
                "text": "一般的な背景資料として、Kief Morrisの「Immutable Server」（https://martinfowler.com/bliki/ImmutableServer.html）は、イミュータブルな環境とCI/CDの共通性、および保持するデータの扱いを説明しています。Chad Fowlerの「Trash Your Servers and Burn Your Code」（https://chadfowler.com/articles/trash-your-servers-and-burn-your-code.html）は、配備方式がアプリケーションコードの考え方にも影響したという経験を記述しています。Twelve-Factor AppのProcesses（https://12factor.net/processes）とDisposability（https://12factor.net/disposability）は、永続状態の分離、起動・終了、および中断時の処理条件を扱っています。これらは設計上の整理の参照元であり、CNCFの実装済み範囲を示す資料ではありません。",
                "coreRefs": {
                  "steps": [
                    "im-references"
                  ],
                  "claims": [
                    "im-reference-design-harness-claim"
                  ],
                  "nodes": [
                    "im-reference-design-harness-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-references-flow"
                  ]
                }
              }
            ],
            "sections": []
          }
        ]
      }
