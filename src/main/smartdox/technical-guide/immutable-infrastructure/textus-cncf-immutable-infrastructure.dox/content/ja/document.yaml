                    ],
                    "rows": [
                      {
                        "id": "im-incident-table-row-1",
                        "cells": [
                          "交換先の準備不足",
                          "受付を移さず、準備できない理由を確認する"
                        ]
                      },
                      {
                        "id": "im-incident-table-row-2",
                        "cells": [
                          "旧処理の長期化",
                          "実際の状態を観測し、継続・業務対応を判断する。予定時刻だけで打ち切らない"
                        ]
                      },
                      {
                        "id": "im-incident-table-row-3",
                        "cells": [
                          "クラッシュ・権限喪失",
                          "旧権限での更新を拒否し、正当な権限・Fencing・準備が揃った経路だけで引き継ぐ"
                        ]
                      },
                      {
                        "id": "im-incident-table-row-4",
                        "cells": [
                          "侵害の疑い",
                          "隔離・失効と原因調査を優先し、疑わしい旧環境への切戻しを認めない"
                        ]
                      },
                      {
                        "id": "im-incident-table-row-5",
                        "cells": [
