                "im-adopt-knowledge-node"
              ],
              "relations": [
                "im-adopt-local-next-1",
                "im-adopt-local-next-2"
              ],
              "flows": [
                "im-adopt-flow"
              ]
            },
            "blocks": [
              {
                "id": "im-adopt-priority",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-adopt"
                  ],
                  "claims": [
                    "im-adopt-priority-claim"
                  ],
                  "nodes": [
                    "im-adopt-priority-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-adopt-flow"
                  ]
                },
                "text": "2026年11月13日時点のCNCF Phase 108は計画段階で、IR-01〜IR-05はOPENです。先行対象は計画交換です。受付・永続化・権限の接続、汎用キャッシュ同期、A・B・Cの交代、保持・反復運用、および実際の別実行環境と正本を用いた確認が開発項目になっています。自動障害切替えや広い配備構成は、この計画登録をもって実装済みとは扱いません。"
              },
              {
                "id": "im-adopt-proof",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-adopt"
                  ],
                  "claims": [
                    "im-adopt-proof-claim"
                  ],
                  "nodes": [
                    "im-adopt-proof-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-adopt-flow"
                  ]
                },
                "text": "開発計画上の確認項目には、更新中のAからBへの受付移行、Aの確定結果の永続記録とB・Cへの反映、常駐状態喪失後の再構築、通知前クラッシュ後の追随、未準備環境の拒否、結果不明の照合および退役条件の適用があります。これらは検証予定の項目です。メモリ上の値やモックのみの確認では、実際の保存経路でのデータ保全は確認できません。"
              },
              {
                "id": "im-adopt-knowledge",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-adopt"
                  ],
                  "claims": [
                    "im-adopt-knowledge-claim"
                  ],
                  "nodes": [
                    "im-adopt-knowledge-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-adopt-flow"
                  ]
                },
                "text": "BoKとプロジェクトの知識は、採用理由、前提、品質目標、構成選択および検証結果の参照元です。実装・運用で得た結果は、レビューを経て後続の構成選択やAI駆動開発で参照する情報になります。知識に記載された方針と、採用版で確認された挙動は別に記録します。"
              }
            ],
            "sections": []
          },
          {
            "id": "im-references-section",
            "heading": "関連資料と設計の参照元",
            "coreRefs": {
