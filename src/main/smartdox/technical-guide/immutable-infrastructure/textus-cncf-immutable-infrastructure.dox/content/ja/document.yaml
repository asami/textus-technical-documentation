                "text": "定期交換では同じ部品版を用いて実行環境を再構築し、部品更新では新しい版のCARを用います。交換間隔は運用方針です。いずれも実行環境を交換する操作であり、正本の業務データを過去の状態へ戻す操作ではありません。無停止運転、実行環境の短命性、データの永続性は、それぞれに必要な構成と条件で確認する性質です。"
