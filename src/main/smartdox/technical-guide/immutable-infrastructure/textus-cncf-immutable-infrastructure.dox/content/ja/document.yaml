                "text": "CNCFのDomain Subsystemは、EntitySpace、Entity Realm、索引、Working SetやViewをメモリに保持し、繰り返しの取得・構築を減らす設計です。正本の業務状態とメモリ常駐状態の寿命は分けます。業務継続に必要な確定状態を特定プロセスのメモリだけに置かず、実行環境を交換した後に必要な常駐状態を再構築する構造を取ります。"
