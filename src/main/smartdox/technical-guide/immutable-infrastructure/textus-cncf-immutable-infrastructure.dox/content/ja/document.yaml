                    ]
                  },
                  {
                    "id": "im-incidents-distinction",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "im-incidents"
                      ],
                      "claims": [
                        "im-incidents-distinction-claim"
                      ],
                      "nodes": [
                        "im-incidents-distinction-node"
                      ],
                      "relations": [],
                      "flows": [
                        "im-incidents-flow"
                      ]
                    },
                    "text": "計画切替えは旧Primaryが協調動作できる場合の手順です。障害切替えでは、到達不能な旧機の更新をFencingで拒否し、正当な引継ぎ権限と準備を確認してから受付を開始します。途中の処理は実際の確定結果と照合します。ロードバランサーの変更や稼働確認は、権限の強制や結果照合とは別の機能です。"
                  },
                  {
                    "id": "im-incidents-unavailable",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "im-incidents"
                      ],
                      "claims": [
                        "im-incidents-unavailable-claim"
                      ],
                      "nodes": [
                        "im-incidents-unavailable-node"
                      ],
                      "relations": [],
                      "flows": [
                        "im-incidents-flow"
                      ]
                    },
                    "text": "自動障害切替えの未提供・未検証は、採用構成の制約として記録します。正当な更新権限または必要なデータを確認できない範囲では更新を利用不可にします。必要な安全条件を満たせない場合の利用不可は、計画上の継続目標と分けて表示する運用状態です。"
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "im-security-section",
            "heading": "セキュリティとの関係",
            "coreRefs": {
              "steps": [
                "im-security"
              ],
              "claims": [
                "im-security-effect-claim",
                "im-security-limits-claim",
                "im-security-guides-claim"
              ],
              "nodes": [
                "im-security-effect-node",
                "im-security-limits-node",
                "im-security-guides-node"
              ],
              "relations": [
                "im-security-local-next-1",
                "im-security-local-next-2"
              ],
              "flows": [
                "im-security-flow"
              ]
            },
            "blocks": [
              {
                "id": "im-security-effect",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-security"
                  ],
                  "claims": [
                    "im-security-effect-claim"
                  ],
                  "nodes": [
                    "im-security-effect-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-security-flow"
                  ]
                },
                "text": "実行環境にだけ存在する変更や状態は、その環境の交換で引き継がれない場合があります。信頼できる成果物と構成から新しい環境を生成し、定期的に交換する運用は、同じ実行環境にその状態が残る期間を管理する手段になります。通常運転時の交換とセキュリティ対応時の交換には、環境生成、準備確認、受付変更などの共通部分があります。交換を繰り返した記録は、その経路を確認するための運用上の資料です。"
              },
              {
                "id": "im-security-limits",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-security"
                  ],
                  "claims": [
                    "im-security-limits-claim"
                  ],
                  "nodes": [
                    "im-security-limits-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-security-flow"
                  ]
                },
                "text": "実行環境を交換しても、盗まれた資格情報、流出した情報、不正に更新された永続データ、成果物自体の欠陥は別に残ります。対応には権限の失効、隔離、原因修正および永続状態の点検が必要です。侵害が疑われる旧環境は、通常の切戻し候補から除外します。環境交換は、認証・認可・監査などの対策を代替する機能ではありません。"
              },
              {
                "id": "im-security-guides",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-security"
                  ],
                  "claims": [
                    "im-security-guides-claim"
                  ],
                  "nodes": [
                    "im-security-guides-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-security-flow"
                  ]
                },
                "text": "認証・認可・監査・区画分離を含む防御全体は、[[../../security/textus-cncf-security-architecture.dox/index.dox][Security技術ガイド]]を参照します。本書は環境交換に関係する性質と運用条件を扱います。HAの権限制御、同期および切替えプロトコルの詳細は、[[../../availability/textus-cncf-availability-architecture.dox/index.dox][可用性・HA技術ガイド]]に分けています。"
              }
            ],
            "sections": []
          },
          {
            "id": "im-policy-section",
            "heading": "構成・品質目標・費用",
            "coreRefs": {
              "steps": [
                "im-policy"
              ],
              "claims": [
                "im-policy-targets-claim",
                "im-policy-table-claim",
                "im-policy-observe-claim"
              ],
              "nodes": [
                "im-policy-targets-node",
                "im-policy-table-node",
                "im-policy-observe-node"
              ],
              "relations": [
                "im-policy-local-next-1",
                "im-policy-local-next-2"
              ],
              "flows": [
                "im-policy-flow"
              ]
            },
            "blocks": [
              {
                "id": "im-policy-targets",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-policy"
                  ],
                  "claims": [
                    "im-policy-targets-claim"
                  ],
                  "nodes": [
                    "im-policy-targets-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-policy-flow"
                  ]
                },
                "text": "運用設定は、可用性、復旧時間、データ保全、応答性、セキュリティおよび運用負担の要求に対応付けます。運用プロファイルは、その条件を設定としてまとめる設計です。要求した目標、選択した設定、採用版で利用できる機能および実際の確認結果を、それぞれ記録します。設定値だけを達成水準の根拠にはしません。"
              },
              {
                "id": "im-policy-table",
                "kind": "table",
                "coreRefs": {
                  "steps": [
                    "im-policy"
                  ],
                  "claims": [
                    "im-policy-table-claim"
                  ],
                  "nodes": [
                    "im-policy-table-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-policy-flow"
                  ]
                },
                "caption": "構成と運用条件のトレードオフ",
                "columns": [
                  {
                    "id": "col-1",
                    "heading": "選択"
                  },
                  {
                    "id": "col-2",
                    "heading": "効果と費用"
                  }
                ],
                "rows": [
                  {
                    "id": "im-policy-table-row-1",
                    "cells": [
                      "単一環境の停止・再構築",
                      "資源費用を抑えやすいが交換中の停止を許容する必要がある"
                    ]
                  },
                  {
                    "id": "im-policy-table-row-2",
                    "cells": [
                      "Primary＋準備済みRead Replica",
                      "計画交換の継続性と参照分散を支えるが常時資源が増える"
                    ]
                  },
                  {
                    "id": "im-policy-table-row-3",
                    "cells": [
                      "旧環境の保持を長くする",
                      "観測・切戻しの機会が増える一方、資源・同期・互換性維持の費用が増える"
                    ]
                  },
                  {
                    "id": "im-policy-table-row-4",
                    "cells": [
                      "短い交換間隔",
                      "同じ実行環境の寿命を短くする一方、構築・同期・観測の頻度が増える"
                    ]
                  },
                  {
                    "id": "im-policy-table-row-5",
                    "cells": [
                      "別ホストへの配置",
                      "ホスト障害への対応には独立した配置・調停・保存経路の確認と費用が必要"
                    ]
                  }
                ]
              },
              {
                "id": "im-policy-observe",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-policy"
                  ],
                  "claims": [
                    "im-policy-observe-claim"
                  ],
                  "nodes": [
                    "im-policy-observe-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-policy-flow"
                  ]
                },
                "text": "観測対象は、交換理由と対象版、受付主体、各環境の準備状態、同期遅延、完了待ち処理、保持期間、退役できない理由および直近の交換結果です。同一ホスト上の複数プロセスでの確認と、ホスト全体の停止に対する確認は異なります。要求した障害範囲と実際に確認した範囲を対応付けて記録します。"
              }
            ],
            "sections": []
          },
          {
            "id": "im-adopt-section",
            "heading": "実装計画と検証状況",
            "coreRefs": {
              "steps": [
                "im-adopt"
              ],
              "claims": [
                "im-adopt-priority-claim",
                "im-adopt-proof-claim",
                "im-adopt-knowledge-claim"
