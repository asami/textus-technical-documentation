                  "relations": [],
                  "flows": [
                    "im-why-flow"
                  ]
                },
                "text": "イミュータブルインフラストラクチャは、変更を成果物と配備構成に反映し、それらから生成した新しい実行環境で既存の実行環境を置き換える運用方式です。稼働中の環境への直接変更を通常の更新方法とせず、交換する単位と、その生成に必要な入力を定めます。業務データの更新は実行環境の交換とは別に扱います。"
              },
              {
                "id": "im-why-replace",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-why"
                  ],
                  "claims": [
                    "im-why-replace-claim"
                  ],
                  "nodes": [
                    "im-why-replace-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-why-flow"
                  ]
                },
                "text": "目的は、実行環境の構成を識別できること、同じ入力から環境を再構築できること、および更新を管理された交換単位で扱えることです。定期交換は、同じ環境を使用する期間を管理する運用に当たります。障害後の復旧だけでなく、通常運転中の部品更新、構成変更、環境の寿命管理を対象にします。再起動だけを繰り返す場合には、成果物と構成からの再構築や状態の分離は確認できません。"
              },
              {
                "id": "im-design-harness",
                "kind": "paragraph",
                "text": "本書では、交換可能性を成立させる設計条件と、その維持を求める枠組みを、設計上のハーネスとして位置付けます。交換・配備の単位について、責任のまとまり、単位間の依存、状態の所有、公開インターフェースと互換性を明示します。疎結合・高凝集などの特性を、依存してよい相手や、単位の内外で完結させる責任といった具体的な境界に落とし込みます。さらに、永続状態と一時状態の分離、構成・依存関係、起動・終了、受付済み処理の完了や回復の条件を定義します。これらは交換手順の外側にある設計上の成立条件です。",
                "coreRefs": {
                  "steps": [
                    "im-why"
                  ],
                  "claims": [
                    "im-design-harness-claim"
                  ],
                  "nodes": [
                    "im-design-harness-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-why-flow"
                  ]
                }
              },
              {
                "id": "im-component-design-harness",
                "kind": "paragraph",
                "text": "CNCFでは、交換を支える基盤機構と、その上で動作するコンポーネントの実装契約を組み合わせて、このハーネスを利用します。基盤が状態管理、更新の確定、実行ライフサイクルなどの共通機構を担当し、コンポーネントはその契約に沿って業務処理を実装します。基盤の交換機構と、それを妨げないコンポーネント実装の両方が必要です。交換可能性への適合を継続して確認することにより、責任分離、明示的な依存関係、検証可能性および交換可能性を、コンポーネントの実装条件として維持します。",
                "coreRefs": {
                  "steps": [
                    "im-why"
                  ],
                  "claims": [
                    "im-component-design-harness-claim"
                  ],
                  "nodes": [
                    "im-component-design-harness-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-why-flow"
                  ]
                }
              },
              {
                "id": "im-cicd-design-connection",
                "kind": "paragraph",
                "text": "CI/CDでも、継続的に検証・配備できる単位、再現可能な成果物と構成、および検証対象の依存関係を定義し、その条件を変更後も維持する必要があります。イミュータブル運用では、実行環境を再構築・交換できる条件も維持対象になります。採用した交換・配備方式がこれらの条件に依存するため、条件を満たさない変更は、検証や配備・交換の経路で検出・是正する対象です。特性を文書に掲げるだけでなく、実際の試験と配備・交換の結果で、守られていることを確認します。この継続的な制約と確認が、アーキテクチャの特性を維持するハーネスとして機能します。設計全体の正しさや、選択した検証項目の十分性を自動的に保証するものではありません。",
                "coreRefs": {
                  "steps": [
                    "im-why"
                  ],
                  "claims": [
                    "im-cicd-design-connection-claim"
                  ],
                  "nodes": [
                    "im-cicd-design-connection-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-why-flow"
                  ]
                }
              },
              {
                "id": "im-why-adoption",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-why"
                  ],
                  "claims": [
                    "im-why-adoption-claim"
                  ],
                  "nodes": [
                    "im-why-adoption-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-why-flow"
                  ]
                },
                "text": "本書は、業務アプリケーションを動かすApplicationティアと、メモリ常駐を利用するDomainティアを対象にします。停止を許容する構成では単一環境を停止して再構築できます。交換中も業務を継続する構成では、別環境の準備、受付の切替え、データ同期、旧処理の完了管理が必要です。対応する故障の範囲と業務継続の水準は、HA構成として別に定めます。"
              }
            ],
