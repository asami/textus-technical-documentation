      {
        "nodeRef": "im-component-design-harness-node",
        "text": "CNCFでは、交換を支える基盤機構と、その上で動作するコンポーネントの実装契約を組み合わせて、このハーネスを利用します。基盤が状態管理、更新の確定、実行ライフサイクルなどの共通機構を担当し、コンポーネントはその契約に沿って業務処理を実装します。基盤の交換機構と、それを妨げないコンポーネント実装の両方が必要です。交換可能性への適合を継続して確認することにより、責任分離、明示的な依存関係、検証可能性および交換可能性を、コンポーネントの実装条件として維持します。"
      },
      {
        "nodeRef": "im-application-implementation-contract-node",
        "text": "実装契約は、自動生成部分に加えて、アプリケーション固有の追加実装にも適用します。追加コードを人が書く場合もAIが生成する場合も、同じ条件です。具体的には、業務継続に必要な状態を特定プロセスのメモリや交換対象のローカルファイルだけに保持しないこと、更新を対応する正本・UnitOfWorkの確定経路へ接続すること、および処理の開始・終了・完了・再開を基盤の契約に合わせることが必要です。バックグラウンド処理や外部副作用も、寿命と完了・回復の責任を明示します。追加実装を含む実際の業務経路で交換・回復を確認することが、適合性の確認になります。生成方式や使用したAIモデルは、その確認を代替しません。"
      }
    ]
  }
