                    "text": "Textus/CNCFの構造では、状態管理と実行ライフサイクルの共通機構を基盤側に置き、コンポーネントが利用する契約として定めます。アプリケーションは業務規則と更新・継続処理をその契約に沿って実装し、基盤は準備確認、受付変更、同期、旧処理の完了管理および退役を担当します。業務アプリケーションごとのA・B・C切替え実装を前提とせず、配備プロファイルと設定で交換を選択する構成です。採用版で提供される機構と、計画中の交換制御・検証項目は、第8章の実装状況と原典で区別します。"
