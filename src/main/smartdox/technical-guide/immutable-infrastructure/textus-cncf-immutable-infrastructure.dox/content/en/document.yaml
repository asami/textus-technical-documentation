                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "im-platform-section",
                "heading": "Tier Structure and Responsibilities",
                "coreRefs": {
                  "steps": [
                    "im-platform"
                  ],
                  "claims": [
                    "im-platform-principle-claim",
                    "im-owner-table-claim",
                    "im-platform-tiers-claim",
