        "sections": [
          {
            "id": "im-why-section",
            "heading": "Purpose and Scope",
            "coreRefs": {
              "steps": [
                "im-why"
              ],
              "claims": [
                "im-why-purpose-claim",
                "im-why-replace-claim",
                "im-design-harness-claim",
                "im-component-design-harness-claim",
                "im-cicd-design-connection-claim",
                "im-why-adoption-claim"
              ],
              "nodes": [
                "im-why-purpose-node",
                "im-why-replace-node",
                "im-design-harness-node",
                "im-component-design-harness-node",
                "im-cicd-design-connection-node",
                "im-why-adoption-node"
              ],
              "relations": [
                "im-why-local-next-1",
                "im-why-local-next-2",
                "im-why-local-next-3",
                "im-why-local-next-4",
                "im-why-local-next-5"
              ],
              "flows": [
                "im-why-flow"
              ]
            },
            "blocks": [
              {
                "id": "im-why-purpose",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-why"
                  ],
                  "claims": [
                    "im-why-purpose-claim"
                  ],
                  "nodes": [
                    "im-why-purpose-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-why-flow"
                  ]
                },
                "text": "Immutable infrastructure is an operating model in which changes are recorded in artifacts and deployment configuration, and a newly constructed environment replaces an existing environment. Routine updates use replacement rather than direct modification of a running environment. The replacement unit and its construction inputs are defined explicitly. Business-data updates are separate from runtime replacement."
              },
              {
                "id": "im-why-replace",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-why"
                  ],
                  "claims": [
                    "im-why-replace-claim"
                  ],
                  "nodes": [
                    "im-why-replace-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-why-flow"
                  ]
                },
                "text": "The objectives are identifiable runtime configuration, reconstruction from the same inputs and updates through controlled replacement units. Scheduled replacement manages the period for which an environment is used. The scope includes component updates, configuration changes and runtime lifetime management during ordinary service, as well as recovery after failure. Repeated restarts alone do not demonstrate reconstruction from artifacts and configuration or separation of state."
              },
              {
                "id": "im-design-harness",
                "kind": "paragraph",
                "text": "This guide describes a design harness as the framework that defines and maintains the architectural conditions needed for replaceability. For each replacement/deployment unit, the design identifies cohesive responsibilities, inter-unit dependencies, state ownership, public interfaces and compatibility. Properties such as loose coupling and high cohesion are expressed through concrete boundaries: permitted dependencies and responsibilities owned inside or outside a unit. The design also defines durable/transient state separation, configuration/dependencies, startup/shutdown and admitted-work completion/recovery conditions. These are architectural preconditions for the replacement procedure.",
                "coreRefs": {
                  "steps": [
                    "im-why"
                  ],
                  "claims": [
                    "im-design-harness-claim"
                  ],
                  "nodes": [
                    "im-design-harness-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-why-flow"
                  ]
                }
              },
              {
                "id": "im-component-design-harness",
                "kind": "paragraph",
                "text": "In CNCF, the harness combines platform mechanisms supporting replacement with implementation contracts for hosted components. The platform owns shared state-management, update-commit and execution-lifecycle mechanisms; components implement business behavior under those contracts. Both platform replacement mechanisms and compatible component implementations are required. Continuing replaceability checks maintain responsibility separation, explicit dependencies, testability and replaceability as component implementation conditions.",
                "coreRefs": {
                  "steps": [
                    "im-why"
                  ],
                  "claims": [
                    "im-component-design-harness-claim"
                  ],
                  "nodes": [
                    "im-component-design-harness-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-why-flow"
                  ]
                }
              },
              {
                "id": "im-cicd-design-connection",
                "kind": "paragraph",
                "text": "CI/CD likewise requires defined units for continuous verification/deployment, reproducible artifacts/configuration and explicit dependencies under verification; changes must preserve those conditions. Immutable operation additionally requires maintained conditions for runtime reconstruction/replacement. Because the selected deployment/replacement method depends on these conditions, violations are subjects for detection and correction through its verification and deployment/replacement paths. Actual tests and deployment/replacement results establish whether the properties are maintained, rather than a written declaration alone. These ongoing constraints and checks function as a harness for architectural properties. They do not automatically guarantee whole-design correctness or the sufficiency of the selected checks.",
                "coreRefs": {
                  "steps": [
                    "im-why"
                  ],
                  "claims": [
                    "im-cicd-design-connection-claim"
                  ],
                  "nodes": [
                    "im-cicd-design-connection-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-why-flow"
                  ]
                }
              },
              {
                "id": "im-why-adoption",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-why"
                  ],
                  "claims": [
                    "im-why-adoption-claim"
                  ],
                  "nodes": [
                    "im-why-adoption-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-why-flow"
                  ]
                },
                "text": "The guide covers the Application tier serving business applications and the Domain tier using memory-resident execution. A deployment that permits downtime can stop and reconstruct a single environment. Continuing service during replacement requires preparation of another environment, admission transfer, data synchronization and completion management for old work. The supported failure boundary and continuity level are defined separately by the HA deployment."
              }
            ],
            "sections": []
          },
