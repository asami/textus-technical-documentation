    ],
    "nodes": [
      {
        "nodeRef": "im-purpose-node",
        "text": "This guide describes the purpose, overall architecture, state management, lifecycle and operating conditions of immutable infrastructure in Textus/CNCF. Chapters 1 and 2 cover purpose and terminology; Chapters 3 and 4 cover architecture and state; Chapter 5 covers replacement behavior. Chapters 6 and 7 cover security and operating conditions, Chapter 8 records implementation and qualification status, and Chapter 9 lists related sources. Architectural descriptions are distinct from capabilities implemented and qualified in a selected version."
      },
      {
        "nodeRef": "im-why-purpose-node",
        "text": "Immutable infrastructure is an operating model in which changes are recorded in artifacts and deployment configuration, and a newly constructed environment replaces an existing environment. Routine updates use replacement rather than direct modification of a running environment. The replacement unit and its construction inputs are defined explicitly. Business-data updates are separate from runtime replacement."
      },
      {
        "nodeRef": "im-why-replace-node",
        "text": "The objectives are identifiable runtime configuration, reconstruction from the same inputs and updates through controlled replacement units. Scheduled replacement manages the period for which an environment is used. The scope includes component updates, configuration changes and runtime lifetime management during ordinary service, as well as recovery after failure. Repeated restarts alone do not demonstrate reconstruction from artifacts and configuration or separation of state."
      },
      {
        "nodeRef": "im-why-adoption-node",
        "text": "The guide covers the Application tier serving business applications and the Domain tier using memory-resident execution. A deployment that permits downtime can stop and reconstruct a single environment. Continuing service during replacement requires preparation of another environment, admission transfer, data synchronization and completion management for old work. The supported failure boundary and continuity level are defined separately by the HA deployment."
      },
      {
        "nodeRef": "im-concept-table-node",
        "text": "Roles of Related Concepts"
      },
      {
        "nodeRef": "im-concepts-example-node",
        "text": "Scheduled replacement reconstructs an environment using the same component version; a component update uses a newer CAR version. Replacement cadence is an operating policy. Both replace an execution environment without rewinding authoritative business data. Uninterrupted operation, short runtime lifetimes and data durability each require their own configuration and qualification conditions."
      },
      {
        "nodeRef": "im-architecture-scope-node",
        "text": "The following is the intended Textus/CNCF structure for runtime replacement. It distinguishes artifacts/configuration, deployment, business execution, authoritative/resident data, admission/lifecycle control and observation. These are responsibility boundaries rather than a requirement for separate products or hosts."
      },
      {
        "nodeRef": "im-architecture-elements-node",
        "text": "Elements and Connections"
      },
      {
        "nodeRef": "im-architecture-construction-node",
        "text": "The construction path supplies deployment with a selected CAR version, runtime definition and deployment configuration to create a new environment. Readiness covers artifact/data compatibility, authoritative connectivity and construction of required resident state. A running environment is a replaceable instance of an identified version/configuration, rather than a place to accumulate manual changes as the source for its successor."
      },
      {
        "nodeRef": "im-architecture-service-node",
        "text": "The service path passes requests from a stable entry to an execution environment satisfying admission authority and readiness. Domain updates commit to authoritative storage through UnitOfWork, and their outcomes update resident state and Read Replicas in the design. Runtime replacement and authoritative business-data updates are separate paths."
      },
      {
        "nodeRef": "im-architecture-control-node",
        "text": "Control uses coordination authority and observed readiness, synchronization and work state to decide admission changes, retention and retirement. Deployment creates/stops environments according to those decisions, while the entry changes its destination. Observation records versions, roles, applied progress, draining work and failure reasons. Environment startup alone does not authorize business admission or retirement of an old environment."
      },
      {
        "nodeRef": "im-platform-principle-node",
        "text": "The Textus/CNCF structure places shared state-management and execution-lifecycle mechanisms in the platform and defines their component-facing contracts. Applications implement business rules and update/continuation behavior under those contracts; the platform owns readiness, admission changes, synchronization, completion management and retirement. Profiles and configuration select replacement without application-specific A/B/C transfer logic. Chapter 8 and the owning sources distinguish mechanisms available in a selected version from planned replacement control and qualification work."
      },
      {
        "nodeRef": "im-owner-table-node",
        "text": "Responsibility Boundaries"
      },
      {
        "nodeRef": "im-platform-tiers-node",
        "text": "The intended Application-tier structure uses Cloud Function environment reuse and disposal for suitable work. The Domain tier transfers service to an environment with prepared resident state. Primary is the role accepting new mutations; Read Replica is the role serving permitted reads. Standby denotes promotion readiness, assessed separately from read availability. These are logical roles rather than a prescribed physical host count."
      },
      {
        "nodeRef": "im-memory-purpose-node",
        "text": "CNCF Domain Subsystems are designed to retain EntitySpace, Entity Realms, indexes, Working Sets and Views in memory to reduce repeated retrieval and construction. Authoritative business state and resident memory have separate lifetimes. Committed state needed for continuity does not reside solely in one process; the required resident state is reconstructed after runtime replacement."
      },
      {
        "nodeRef": "im-memory-commit-node",
        "text": "The design commits updates to authoritative storage through Domain rules and UnitOfWork, then updates or invalidates resident state according to the outcome. Business commit success corresponds to the durability contract of the selected storage. Memory updates and Replica notifications are separate from authoritative commit. The actual preservation boundary depends on storage integration and observed durability and recovery behavior."
      },
      {
        "nodeRef": "im-state-table-node",
        "text": "State Categories During Replacement"
      },
      {
        "nodeRef": "im-memory-recovery-node",
        "text": "Reconstruction obtains a consistent authoritative baseline and catches up with updates committed during loading. Use begins when required applied progress and read conditions are satisfied. A memory copy from another runtime or receipt of notifications alone does not establish that all required committed state has been applied."
      },
      {
        "nodeRef": "im-memory-crash-node",
        "text": "Planned replacement retires an old environment after admitted work reaches a settled outcome under valid authority. A crash can lose intermediate computation, so committed, uncommitted and uncertain outcomes are reconciled with storage records. Job and Workflow resumption follows supported durable checkpoints and recovery contracts. Arbitrary Running work is not assumed to be replayable. Data preservation also depends on storage failure boundaries, backup and recovery policy."
      },
      {
        "nodeRef": "im-operation-scope-node",
        "text": "This chapter describes how the preceding elements participate in replacement. Planned replacement and handling of authority loss, crashes or suspected compromise have different preconditions. The behavior below describes the design; Chapter 8 records delivery and qualification status for the selected scope."
      },
      {
        "nodeRef": "im-plan-start-node",
        "text": "The planned-replacement example uses A as Primary and B as a Read Replica qualified as Standby. New read/write admission moves to B after compatibility, authoritative connectivity, synchronization and readiness conditions are satisfied. A stops new independent work and completes updates admitted before transfer, including necessary completion work, under valid scoped authority."
      },
      {
        "nodeRef": "im-plan-progress-node",
        "text": "After B begins accepting new work, replacement Read Replica C is created and its resident state is constructed. Late commits from A reach B/C, and A catches up with current committed state while retained as a switch-back candidate. The synchronization design supports multiple Replicas and environments under construction or retention, rather than a dedicated A/B copy. A/B/C describe changing roles and do not prescribe three continuously running machines."
      },
      {
        "nodeRef": "im-plan-table-node",
        "text": "Conditions by Replacement Stage"
      },
      {
        "nodeRef": "im-plan-stop-node",
        "text": "A retires when old-work outcomes are settled, replacement read capacity is available, required synchronization is complete and configured retention/observation conditions hold. Uncertain updates, an unready C or incomplete synchronization defer retirement. A responsive new Primary or elapsed retention time alone does not satisfy these conditions. Authority loss or suspected compromise requires handling outside ordinary completion and switch-back conditions."
      },
      {
        "nodeRef": "im-rotation-cadence-node",
        "text": "Replacement cadence is an operating setting related to threat response, update frequency, startup/warm-up cost and business service windows. Daily replacement is one option rather than a fixed default. A scheduled time triggers replacement; it is separate from forced interruption of admitted updates or omission of retirement conditions."
      },
      {
        "nodeRef": "im-rotation-update-node",
        "text": "A component update comprises environment construction from a new CAR and configuration, compatibility and route checks, admission transfer and observation. Deployment acceptance depends on configured observation conditions as well as the admission change. Scheduled replacement and compatible CAR updates use the same replacement mechanism in the design."
      },
      {
        "nodeRef": "im-rotation-fallback-node",
        "text": "A switch-back candidate is a retained environment compatible with current business data and configuration, with required synchronization/readiness and valid admission authority. Switch-back continues from current committed state. Changes that break data compatibility are handled as planned maintenance updates rather than ordinary automatic replacement."
      },
      {
        "nodeRef": "im-incident-table-node",
        "text": "Exceptional States and Handling Conditions"
      },
      {
        "nodeRef": "im-incidents-distinction-node",
        "text": "Planned Switchover assumes cooperation by the old Primary. Failover fences writes from an unreachable old environment and starts admission only after valid takeover authority and readiness are established. Interrupted work is reconciled with actual committed outcomes. Load-balancer changes and liveness checks are separate from authority enforcement and outcome reconciliation."
      },
      {
        "nodeRef": "im-incidents-unavailable-node",
        "text": "Absent or unqualified automatic Failover is recorded as a limitation of the selected deployment. Mutations are unavailable where valid authority or required data cannot be established. Unavailability caused by unmet safety conditions is an observed operating state, recorded separately from the intended continuity target."
      },
      {
        "nodeRef": "im-security-effect-node",
        "text": "Changes or state existing only in a runtime environment may be discarded when that environment is replaced. Construction from trusted artifacts and configuration, combined with scheduled replacement, provides a means to manage how long such state remains in the same runtime. Ordinary and security-triggered replacement share environment construction, readiness and admission-transfer mechanisms. Records of repeated replacement provide operational evidence about that path."
      },
      {
        "nodeRef": "im-security-limits-node",
        "text": "Stolen credentials, disclosed information, maliciously modified persistent data and defects in artifacts require separate treatment after runtime replacement. Response includes revocation, isolation, cause correction and inspection of persistent state. A suspected compromised environment is excluded from ordinary switch-back candidates. Environment replacement does not substitute for authentication, authorization or audit controls."
      },
      {
        "nodeRef": "im-security-guides-node",
        "text": "The [[../../security/textus-cncf-security-architecture.dox/index.dox][Security guide]] covers authentication, authorization, audit, containment and the wider defense model. This guide covers properties and operating conditions associated with environment replacement. The [[../../availability/textus-cncf-availability-architecture.dox/index.dox][Availability and HA guide]] covers authority, synchronization and transfer protocols in detail."
      },
      {
        "nodeRef": "im-policy-targets-node",
        "text": "Operating settings are related to availability, recovery time, data preservation, responsiveness, security and operational-effort requirements. The profile design groups those conditions into configuration. Requirements, selected settings, capabilities available in the selected version and observed results are recorded separately. Configuration values alone are not evidence of an achieved service level."
      },
      {
        "nodeRef": "im-policy-table-node",
        "text": "Configuration and Operating Tradeoffs"
      },
      {
        "nodeRef": "im-policy-observe-node",
        "text": "Observations include replacement reason/version, admission owner, environment readiness, synchronization lag, draining work, retention period, unmet retirement conditions and recent replacement outcomes. Qualification using several processes on one host differs from qualification against loss of that host. Records relate the requested failure boundary to the boundary actually exercised."
      },
      {
        "nodeRef": "im-adopt-priority-node",
        "text": "As of 2026-11-13, CNCF Phase 108 is planned and IR-01 through IR-05 are OPEN. Planned replacement is the initial delivery scope. Development items cover admission/persistence/authority integration, shared cache synchronization, A/B/C transfer, retention/repeated operation and qualification using actual separate runtimes and authoritative data. Registration of these items does not establish delivered automatic Failover or broader deployment support."
      },
      {
        "nodeRef": "im-adopt-proof-node",
        "text": "Planned qualification covers admission transfer from A to B during an update, persistence and B/C propagation of A commits, reconstruction after resident-state loss, catch-up after a crash before notification, refusal of unready environments, reconciliation of uncertain outcomes and enforcement of retirement conditions. These are planned checks. Memory-only values or mocks do not qualify preservation through the actual storage path."
      },
      {
        "nodeRef": "im-adopt-knowledge-node",
        "text": "The BoK and project knowledge provide references for rationale, assumptions, quality targets, configuration choices and qualification results. Reviewed implementation/operation findings inform subsequent configuration choices and AI-driven development. Documented policy and observed behavior in a selected version are recorded separately."
      },
      {
        "nodeRef": "im-reference-guides-node",
        "text": "The [[../../availability/textus-cncf-availability-architecture.dox/index.dox][Availability and HA guide]] explains continuity objectives, architecture, synchronization, authority and transfer protocols. The [[../../security/textus-cncf-security-architecture.dox/index.dox][Security guide]] describes the wider defense context. The [[../../reactive/textus-cncf-reactive-architecture.dox/index.dox][Reactive guide]] covers memory residency, UnitOfWork and recoverability."
      },
      {
        "nodeRef": "im-reference-authority-node",
        "text": "Textus-specific design sources are CNCF Availability Architecture, Subsystem Runtime Architecture and Runtime Cache Synchronization. CNCF Phase 108 owns the implementation plan. This guide explains those designs and plans. Source documents and their revision dates identify the authority; CNCF records own implementation contracts and qualification results."
      },
      {
        "nodeRef": "im-reading-boundary-node",
        "text": "This technical guide describes the architecture and operating model. Commands for a particular environment and project-specific runbooks are outside its scope. Architectural structure, implementation plans and behavior qualified in a selected version are distinguished; source documents own concrete contracts and qualification results."
      },
      {
        "nodeRef": "im-operation-example-node",
        "text": "In the planned-replacement example, A is the former Primary, B takes over admission and C is the newly prepared Read Replica. A/B/C describe changing roles and do not specify three continuously running physical hosts."
      },
      {
        "nodeRef": "im-design-harness-node",
        "text": "This guide describes a design harness as the framework that defines and maintains the architectural conditions needed for replaceability. For each replacement/deployment unit, the design identifies cohesive responsibilities, inter-unit dependencies, state ownership, public interfaces and compatibility. Properties such as loose coupling and high cohesion are expressed through concrete boundaries: permitted dependencies and responsibilities owned inside or outside a unit. The design also defines durable/transient state separation, configuration/dependencies, startup/shutdown and admitted-work completion/recovery conditions. These are architectural preconditions for the replacement procedure."
      },
      {
        "nodeRef": "im-cicd-design-connection-node",
        "text": "CI/CD likewise requires defined units for continuous verification/deployment, reproducible artifacts/configuration and explicit dependencies under verification; changes must preserve those conditions. Immutable operation additionally requires maintained conditions for runtime reconstruction/replacement. Because the selected deployment/replacement method depends on these conditions, violations are subjects for detection and correction through its verification and deployment/replacement paths. Actual tests and deployment/replacement results establish whether the properties are maintained, rather than a written declaration alone. These ongoing constraints and checks function as a harness for architectural properties. They do not automatically guarantee whole-design correctness or the sufficiency of the selected checks."
      },
      {
        "nodeRef": "im-reference-design-harness-node",
        "text": "For general background, Kief Morris's Immutable Server (https://martinfowler.com/bliki/ImmutableServer.html) discusses parallels with CI/CD and handling of retained data. Chad Fowler's Trash Your Servers and Burn Your Code (https://chadfowler.com/articles/trash-your-servers-and-burn-your-code.html) reports how deployment choices affected his thinking about application code. The Twelve-Factor App chapters Processes (https://12factor.net/processes) and Disposability (https://12factor.net/disposability) address separation of durable state, startup/shutdown and interrupted-work conditions. These sources inform the design synthesis; they do not establish CNCF implementation status."
      },
      {
        "nodeRef": "im-component-design-harness-node",
        "text": "In CNCF, the harness combines platform mechanisms supporting replacement with implementation contracts for hosted components. The platform owns shared state-management, update-commit and execution-lifecycle mechanisms; components implement business behavior under those contracts. Both platform replacement mechanisms and compatible component implementations are required. Continuing replaceability checks maintain responsibility separation, explicit dependencies, testability and replaceability as component implementation conditions."
      },
      {
        "nodeRef": "im-application-implementation-contract-node",
        "text": "The implementation contracts apply to application-specific additions as well as generated code, with the same conditions for human-written and AI-generated additions. Continuity-critical state must not reside solely in process memory or local files belonging to the replaceable environment. Updates connect to the applicable authoritative/UnitOfWork commit path, and processing start, shutdown, completion and resumption follow platform contracts. Background work and external effects have explicit lifetime and completion/recovery ownership. Conformance is qualified through actual business paths including the additions, exercising replacement and recovery. The generation method or AI model used does not substitute for those checks."
      }
    ]
  }
}
