                    ]
                  },
                  {
                    "id": "im-architecture-elements-row-6",
                    "cells": [
                      "Resident state and synchronization",
                      "Reconstruct/update Entities, indexes, Working Sets and Views",
                      "Use authoritative baselines and committed deltas across environments"
                    ]
                  },
                  {
                    "id": "im-architecture-elements-row-7",
                    "cells": [
                      "Control and coordination",
                      "Manage admission authority, readiness, retention and retirement conditions",
                      "Connect coordination, execution, deployment and entry"
                    ]
                  },
                  {
                    "id": "im-architecture-elements-row-8",
                    "cells": [
                      "Observation",
                      "Record actual state, work outcomes and transition reasons",
                      "Expose execution/synchronization/control/deployment state to operators"
                    ]
                  }
                ]
              },
              {
                "id": "im-architecture-construction",
                "kind": "paragraph",
                "text": "The construction path supplies deployment with a selected CAR version, runtime definition and deployment configuration to create a new environment. Readiness covers artifact/data compatibility, authoritative connectivity and construction of required resident state. A running environment is a replaceable instance of an identified version/configuration, rather than a place to accumulate manual changes as the source for its successor.",
                "coreRefs": {
                  "steps": [
                    "im-architecture"
                  ],
                  "claims": [
                    "im-architecture-construction-claim"
                  ],
                  "nodes": [
                    "im-architecture-construction-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-architecture-flow"
                  ]
                }
              },
              {
                "id": "im-architecture-service",
                "kind": "paragraph",
                "text": "The service path passes requests from a stable entry to an execution environment satisfying admission authority and readiness. Domain updates commit to authoritative storage through UnitOfWork, and their outcomes update resident state and Read Replicas in the design. Runtime replacement and authoritative business-data updates are separate paths.",
                "coreRefs": {
                  "steps": [
                    "im-architecture"
                  ],
                  "claims": [
                    "im-architecture-service-claim"
                  ],
                  "nodes": [
                    "im-architecture-service-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-architecture-flow"
                  ]
                }
              },
              {
                "id": "im-architecture-control",
                "kind": "paragraph",
                "text": "Control uses coordination authority and observed readiness, synchronization and work state to decide admission changes, retention and retirement. Deployment creates/stops environments according to those decisions, while the entry changes its destination. Observation records versions, roles, applied progress, draining work and failure reasons. Environment startup alone does not authorize business admission or retirement of an old environment.",
                "coreRefs": {
                  "steps": [
                    "im-architecture"
                  ],
                  "claims": [
