                },
                "blocks": [
                  {
                    "id": "im-platform-principle",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "im-platform"
                      ],
                      "claims": [
                        "im-platform-principle-claim"
                      ],
                      "nodes": [
                        "im-platform-principle-node"
                      ],
                      "relations": [],
                      "flows": [
                        "im-platform-flow"
                      ]
                    },
                    "text": "The Textus/CNCF structure places shared state-management and execution-lifecycle mechanisms in the platform and defines their component-facing contracts. Applications implement business rules and update/continuation behavior under those contracts; the platform owns readiness, admission changes, synchronization, completion management and retirement. Profiles and configuration select replacement without application-specific A/B/C transfer logic. Chapter 8 and the owning sources distinguish mechanisms available in a selected version from planned replacement control and qualification work."
                  },
                  {
                    "id": "im-owner-table",
                    "kind": "table",
                    "coreRefs": {
                      "steps": [
                        "im-platform"
                      ],
                      "claims": [
                        "im-owner-table-claim"
                      ],
                      "nodes": [
                        "im-owner-table-node"
                      ],
                      "relations": [],
                      "flows": [
                        "im-platform-flow"
                      ]
                    },
                    "caption": "Responsibility Boundaries",
                    "columns": [
                      {
                        "id": "col-1",
                        "heading": "Owner"
                      },
                      {
                        "id": "col-2",
                        "heading": "Responsibility"
                      }
                    ],
                    "rows": [
                      {
                        "id": "im-owner-table-row-1",
                        "cells": [
                          "Business application",
                          "Business rules, operation meaning, concurrency conditions and supported continuation/retry boundaries"
                        ]
                      },
                      {
                        "id": "im-owner-table-row-2",
                        "cells": [
                          "CNCF Runtime",
                          "New admission and scoped completion authority, readiness, synchronization, transfer and retirement conditions"
                        ]
                      },
                      {
                        "id": "im-owner-table-row-3",
                        "cells": [
                          "Deployment, coordination and storage infrastructure",
                          "Runtime creation/stop, election and Lease, effective fencing and authoritative persistence"
                        ]
                      },
                      {
                        "id": "im-owner-table-row-4",
                        "cells": [
                          "Operator",
                          "Quality targets, failure boundary, cadence, retention, resource budget and incident decisions"
                        ]
                      }
                    ]
                  },
                  {
                    "id": "im-platform-tiers",
                    "kind": "paragraph",
                    "coreRefs": {
                      "steps": [
                        "im-platform"
                      ],
                      "claims": [
                        "im-platform-tiers-claim"
                      ],
                      "nodes": [
                        "im-platform-tiers-node"
                      ],
                      "relations": [],
                      "flows": [
                        "im-platform-flow"
                      ]
                    },
                    "text": "The intended Application-tier structure uses Cloud Function environment reuse and disposal for suitable work. The Domain tier transfers service to an environment with prepared resident state. Primary is the role accepting new mutations; Read Replica is the role serving permitted reads. Standby denotes promotion readiness, assessed separately from read availability. These are logical roles rather than a prescribed physical host count."
                  },
                  {
                    "id": "im-application-implementation-contract",
                    "kind": "paragraph",
                    "text": "The implementation contracts apply to application-specific additions as well as generated code, with the same conditions for human-written and AI-generated additions. Continuity-critical state must not reside solely in process memory or local files belonging to the replaceable environment. Updates connect to the applicable authoritative/UnitOfWork commit path, and processing start, shutdown, completion and resumption follow platform contracts. Background work and external effects have explicit lifetime and completion/recovery ownership. Conformance is qualified through actual business paths including the additions, exercising replacement and recovery. The generation method or AI model used does not substitute for those checks.",
                    "coreRefs": {
                      "steps": [
                        "im-platform"
                      ],
                      "claims": [
                        "im-application-implementation-contract-claim"
                      ],
                      "nodes": [
                        "im-application-implementation-contract-node"
                      ],
                      "relations": [],
                      "flows": [
                        "im-platform-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
