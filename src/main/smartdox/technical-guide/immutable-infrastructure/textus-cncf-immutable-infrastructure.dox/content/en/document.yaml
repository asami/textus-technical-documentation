                  },
                  {
                    "id": "col-3",
                    "heading": "Principal Connections"
                  }
                ],
                "rows": [
                  {
                    "id": "im-architecture-elements-row-1",
                    "cells": [
                      "Artifacts and configuration",
                      "Identify CARs, runtime definitions and deployment settings",
                      "Supply construction inputs to deployment"
                    ]
                  },
                  {
                    "id": "im-architecture-elements-row-2",
                    "cells": [
                      "Deployment",
                      "Create/stop environments and map them to resources",
                      "Consume artifacts/configuration and control decisions"
                    ]
                  },
                  {
                    "id": "im-architecture-elements-row-3",
                    "cells": [
                      "Entry and admission route",
                      "Accept business API requests and pass them to an environment",
                      "Use destinations qualified by authority and readiness"
                    ]
                  },
                  {
                    "id": "im-architecture-elements-row-4",
                    "cells": [
                      "Execution",
                      "Run Application and Domain Subsystem business processing",
                      "Connect admission, UnitOfWork and resident state"
                    ]
                  },
                  {
                    "id": "im-architecture-elements-row-5",
