                    "cells": [
                      "HA",
                      "Support service continuity within defined failure and operating boundaries",
                      "Tolerance of every failure or backups"
                    ]
                  },
                  {
                    "id": "im-concept-table-row-4",
                    "cells": [
                      "Persistence",
                      "Separate required business state from runtime lifetimes",
                      "Unconditional survival of storage failure"
                    ]
                  },
                  {
                    "id": "im-concept-table-row-5",
                    "cells": [
                      "Scheduled replacement",
                      "Replace runtime environments at policy-selected intervals",
                      "Continuity during replacement or takeover after failure"
                    ]
                  }
                ]
              },
              {
                "id": "im-concepts-example",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "im-concepts"
                  ],
                  "claims": [
                    "im-concepts-example-claim"
                  ],
                  "nodes": [
                    "im-concepts-example-node"
                  ],
                  "relations": [],
                  "flows": [
                    "im-concepts-flow"
                  ]
                },
                "text": "Scheduled replacement reconstructs an environment using the same component version; a component update uses a newer CAR version. Replacement cadence is an operating policy. Both replace an execution environment without rewinding authoritative business data. Uninterrupted operation, short runtime lifetimes and data durability each require their own configuration and qualification conditions."
              }
            ],
