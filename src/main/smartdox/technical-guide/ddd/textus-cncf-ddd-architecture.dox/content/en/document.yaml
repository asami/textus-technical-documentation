          {
            "id": "ddd-behavior-section",
            "heading": "Application Progression and Complementary Models",
            "coreRefs": {
              "steps": [
                "ddd-behavior"
              ],
              "claims": [
                "ddd-behavior-claim-1"
              ],
              "nodes": [
                "ddd-behavior-node-1",
                "ddd-behavior-node-2"
              ],
              "relations": [
                "ddd-behavior-relation-1"
              ],
              "flows": [
                "ddd-behavior-flow"
              ]
            },
            "blocks": [
              {
                "id": "ddd-behavior-paragraph-1",
                "kind": "paragraph",
                "text": "Applications using DDD models connect public operations, Workflows, state machines and rule evaluation. This section identifies how those mechanisms relate to DDD concerns. Application progression and business-object invariants are represented by their respective models.",
                "coreRefs": {
                  "steps": [
                    "ddd-behavior"
                  ],
                  "claims": [
                    "ddd-behavior-claim-1"
                  ],
                  "nodes": [
                    "ddd-behavior-node-1",
                    "ddd-behavior-node-2"
                  ],
                  "relations": [
                    "ddd-behavior-relation-1"
                  ],
                  "flows": [
                    "ddd-behavior-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ddd-application-section",
                "heading": "Public Operations, Workflows and Domain Operations",
                "coreRefs": {
                  "steps": [
                    "ddd-application"
                  ],
                  "claims": [
                    "ddd-application-claim-1",
                    "ddd-application-claim-2"
                  ],
                  "nodes": [
                    "ddd-application-node-1",
                    "ddd-application-node-2"
                  ],
                  "relations": [
                    "ddd-application-relation-1"
                  ],
                  "flows": [
                    "ddd-application-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-application-paragraph-1",
                    "kind": "paragraph",
                    "text": "Previously defined use cases are realized through Workflow operations, sequencing, branching and waits. Services and Operations form the externally accessible application boundary, taking responsibility corresponding to PoEAA’s Service Layer. Screens and external APIs connect to the same public operations; Workflows invoke the domain behavior needed to realize them.",
                    "coreRefs": {
                      "steps": [
                        "ddd-application"
                      ],
                      "claims": [
                        "ddd-application-claim-1"
                      ],
                      "nodes": [
                        "ddd-application-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-application-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-application-paragraph-2",
                    "kind": "paragraph",
                    "text": "Application progression belongs in the Workflow; rules such as whether an order may be confirmed remain in the domain. External functions connect through explicit Provider bindings. Use cases provide criteria for checking the resulting behavior rather than serving as executable procedures themselves.",
                    "coreRefs": {
                      "steps": [
                        "ddd-application"
                      ],
                      "claims": [
                        "ddd-application-claim-2"
                      ],
                      "nodes": [
                        "ddd-application-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-application-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ddd-dynamic-section",
                "heading": "State Machines, Rule Evaluation and Business Conditions",
                "coreRefs": {
                  "steps": [
                    "ddd-dynamic"
                  ],
                  "claims": [
                    "ddd-dynamic-claim-1",
                    "ddd-dynamic-claim-2"
                  ],
                  "nodes": [
                    "ddd-dynamic-node-1",
                    "ddd-dynamic-node-2"
                  ],
                  "relations": [
                    "ddd-dynamic-relation-1"
                  ],
                  "flows": [
                    "ddd-dynamic-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-dynamic-paragraph-1",
                    "kind": "paragraph",
                    "text": "A state machine defines states, events, transition conditions and actions. Relating the draft-to-confirmed transition to the confirmation Operation allows calls from a Workflow to be evaluated against the order’s current state. Cozy-generated definitions are registered with CNCF, connecting transitions and business updates to the same subject.",
                    "coreRefs": {
                      "steps": [
                        "ddd-dynamic"
                      ],
                      "claims": [
                        "ddd-dynamic-claim-1"
                      ],
                      "nodes": [
                        "ddd-dynamic-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-dynamic-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-dynamic-paragraph-2",
                    "kind": "paragraph",
                    "text": "Decisions that change independently, such as pricing or approval conditions, can be identified as Domain Rules and connected to a Rule Model and Rule Engine. Evaluation results enter shared execution paths such as Operations, separating decision logic from execution with authorization and commitment. Workflows, state machines and rules make progression, object lifecycle and decisions explicit.",
                    "coreRefs": {
                      "steps": [
                        "ddd-dynamic"
                      ],
                      "claims": [
                        "ddd-dynamic-claim-2"
                      ],
                      "nodes": [
                        "ddd-dynamic-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-dynamic-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ddd-execution-section",
            "heading": "DDD Models, Generation and Runtime Connections",
            "coreRefs": {
              "steps": [
                "ddd-execution"
              ],
              "claims": [
                "ddd-execution-claim-1"
              ],
              "nodes": [
                "ddd-execution-node-1",
                "ddd-execution-node-2"
              ],
              "relations": [
                "ddd-execution-relation-1"
              ],
              "flows": [
                "ddd-execution-flow"
              ]
            },
            "blocks": [
              {
                "id": "ddd-execution-paragraph-1",
                "kind": "paragraph",
                "text": "DDD concepts connect to CML, Cozy and CNCF through types, execution definitions and component contracts. Update/read models are realized separately and connected through shared identity and value meanings. Distinguishing model meaning, generation/registration and runtime responsibilities identifies the mechanisms connecting concepts to behavior.",
                "coreRefs": {
                  "steps": [
                    "ddd-execution"
                  ],
                  "claims": [
                    "ddd-execution-claim-1"
                  ],
                  "nodes": [
                    "ddd-execution-node-1",
                    "ddd-execution-node-2"
                  ],
                  "relations": [
                    "ddd-execution-relation-1"
                  ],
                  "flows": [
                    "ddd-execution-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ddd-semantics-section",
                "heading": "Model Meaning and Platform Responsibilities",
                "coreRefs": {
                  "steps": [
                    "ddd-semantics"
                  ],
                  "claims": [
                    "ddd-semantics-claim-1",
                    "ddd-semantics-claim-2",
                    "ddd-semantics-claim-3"
                  ],
                  "nodes": [
                    "ddd-semantics-node-1",
                    "ddd-semantics-node-2"
                  ],
                  "relations": [
                    "ddd-semantics-relation-1"
                  ],
                  "flows": [
                    "ddd-semantics-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-semantics-paragraph-1",
                    "kind": "paragraph",
                    "text": "Developers model business types and constraints, public operations, states and transitions, Workflow progression, and View/Display relationships. Cozy projects Entities and Values into typed interfaces and state machines, Workflows and presentation into corresponding definitions and connection code. Textus/CNCF uses registered definitions and handlers to perform invocation, transitions, projection and commitment.",
                    "coreRefs": {
                      "steps": [
                        "ddd-semantics"
                      ],
                      "claims": [
                        "ddd-semantics-claim-1"
                      ],
                      "nodes": [
                        "ddd-semantics-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-semantics-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-semantics-paragraph-2",
                    "kind": "paragraph",
                    "text": "A model “running directly” means that its defined structure and behavior are directly connected to this projection and execution path. Business-specific calculations and external integration supplement generated types and explicit extension points. The approach combines generation with interpretation of model definitions; it does not mean reparsing all CML at runtime.",
                    "coreRefs": {
                      "steps": [
                        "ddd-semantics"
                      ],
                      "claims": [
                        "ddd-semantics-claim-2"
                      ],
                      "nodes": [
                        "ddd-semantics-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-semantics-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-semantics-paragraph-3",
                    "kind": "paragraph",
                    "text": "Supplementary business calculations can take values and return results separately from persistence and communication. Functional and Reactive Domain Modeling discusses this separation, which allows calculations to be checked independently and I/O to follow shared execution paths. Detailed functional-programming composition is reserved for a separate Modeling and FP document.",
                    "coreRefs": {
                      "steps": [
                        "ddd-semantics"
                      ],
                      "claims": [
                        "ddd-semantics-claim-3"
                      ],
                      "nodes": [
                        "ddd-semantics-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-semantics-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ddd-memory-section",
                "heading": "Entity Classification and Residency Policy",
                "coreRefs": {
                  "steps": [
                    "ddd-memory"
                  ],
                  "claims": [
                    "ddd-memory-claim-1",
                    "ddd-memory-claim-2",
                    "ddd-memory-claim-3"
                  ],
                  "nodes": [
                    "ddd-memory-node-1",
                    "ddd-memory-node-2",
                    "ddd-memory-node-3"
                  ],
                  "relations": [
                    "ddd-memory-relation-1",
                    "ddd-memory-relation-2"
                  ],
                  "flows": [
                    "ddd-memory-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-memory-paragraph-1",
                    "kind": "paragraph",
                    "text": "Entity models specify runtime treatment as well as data structure. Textus/CNCF represents the stereotype-like classification as entityKind and connects it to defaults such as residency for master data. Task data is loaded as needed, with caching or retention configured for its intended use.",
                    "coreRefs": {
                      "steps": [
                        "ddd-memory"
                      ],
                      "claims": [
                        "ddd-memory-claim-1"
                      ],
                      "nodes": [
                        "ddd-memory-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-memory-paragraph-2",
                    "kind": "paragraph",
                    "text": "Classification defaults combine with explicit Working Set policies. Current defaults make master resident and disable the Working Set for task; active-only workflow residency requires an explicit state-based policy. Runtime use of model classification and configuration reduces per-Entity memory-management implementation.",
                    "coreRefs": {
                      "steps": [
                        "ddd-memory"
                      ],
                      "claims": [
                        "ddd-memory-claim-2"
                      ],
                      "nodes": [
                        "ddd-memory-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-memory-paragraph-3",
                    "kind": "paragraph",
                    "text": "Residency and caching hold reconstructible state for domain processing rather than replacing authoritative persistent state. This guide covers the mapping from model classification to execution policy; retention, release, consistency and recovery are detailed in the reactive guide.",
                    "coreRefs": {
                      "steps": [
                        "ddd-memory"
                      ],
                      "claims": [
                        "ddd-memory-claim-3"
                      ],
                      "nodes": [
                        "ddd-memory-node-3"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-memory-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ddd-toolchain-section",
                "heading": "Descriptions, Generated Artifacts and Runtime Mechanisms",
