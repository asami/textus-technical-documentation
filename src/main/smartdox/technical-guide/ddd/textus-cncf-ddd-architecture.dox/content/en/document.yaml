    "nodes": [
      {
        "nodeRef": "textus-cncf-ddd-architecture-node-1",
        "text": "Use DDD as an entry to the system structure"
      },
      {
        "nodeRef": "textus-cncf-ddd-architecture-node-2",
        "text": "Explain concepts, complementary techniques and execution"
      },
      {
        "nodeRef": "ddd-purpose-intent-node",
        "text": "This guide is for readers using DDD to understand SimpleModeling/Textus/CNCF. DDD concepts lead to their corresponding models, complementary techniques and runtime mechanisms. The explanation identifies roles and connections without a superiority or deficiency narrative."
      },
      {
        "nodeRef": "ddd-purpose-scope-node",
        "text": "General modeling methods and project development procedures belong to separate guides. Each highlight identifies the DDD technique, its concern and its place in this system. Architectural correspondence is separate from the generation/runtime capabilities available in a selected version."
      },
      {
        "nodeRef": "ddd-vocabulary-sources-node",
        "text": "The sources are the English editions of Evans (2003), Vernon (2013) and Khononov (2021), abbreviated E/V/K below. Public contents and the identified previews support comparison of coverage and explanatory perspectives. Confirming a location is separate from comparing every definition in full."
      },
      {
        "nodeRef": "ddd-book-coverage-node",
        "text": "Three-book coverage and inspection scope"
      },
      {
        "nodeRef": "ddd-vocabulary-differences-node",
        "text": "Verified differences include organization and emphasis. E separates model building blocks and later strategic design; V gives individual building-block chapters and architecture/integration; K explicitly organizes strategic/tactical design and architecture choices. The K Chapter 6 preview treats tactical patterns as Domain Model building blocks. The V Chapter 10 excerpt develops Aggregate invariants and transactional consistency boundaries. These observations concern scope/emphasis, not an asserted disagreement between uninspected definitions."
      },
      {
        "nodeRef": "ddd-vocabulary-adoption-node",
        "text": "The following meanings are adopted for this guide and connected to SimpleModeling. Source perspectives and system policy remain distinct rather than assuming identical definitions. Location unverified describes this public inspection scope, not absence from an entire book."
      },
      {
        "nodeRef": "ddd-adopted-terms-node",
        "text": "Adopted guide meanings and connections"
      },
      {
        "nodeRef": "ddd-landscape-node-1",
        "text": "Distinguish DDD, related techniques and platform roles"
      },
      {
        "nodeRef": "ddd-landscape-node-2",
        "text": "Connect update/read paths and shared value meaning"
      },
      {
        "nodeRef": "ddd-strategic-intro-node",
        "text": "Strategic highlights are shared language, contexts of consistent meaning and relationships between contexts. SimpleModeling connects them to BoK terminology/knowledge, subsystem/component boundaries and public contracts."
      },
      {
        "nodeRef": "ddd-strategic-axes-node",
        "text": "Contexts scope meanings for both updates and reads. Strategic/tactical design and CQRS update/read paths are separate axes. Inter-context language/contracts and intra-context update/read model separation have distinct roles."
      },
      {
        "nodeRef": "ddd-context-node-1",
        "text": "A Bounded Context scopes consistent meanings for a model and its language. Order-taking and shipping may use the same word order with different attributes and rules. SimpleModeling concretizes this semantic boundary as a subsystem or component modeling boundary. This is separate from the number of physical hosts or processes."
      },
      {
        "nodeRef": "ddd-context-node-2",
        "text": "Context Maps provide an entry point for understanding inter-context relationships and integration responsibilities. SimpleModeling realizes these relationships through subsystem/component Service/Operation, translation and Event contracts. Terminology translation, model correspondence and dependencies are described separately. This is the adopted system policy, not a universal DDD deployment topology."
      },
      {
        "nodeRef": "ddd-knowledge-node-1",
        "text": "Ubiquitous Language, BoK, Entities and Knowledge"
      },
      {
        "nodeRef": "ddd-knowledge-node-2",
        "text": "Ubiquitous Language, BoK, Entities and Knowledge"
      },
      {
        "nodeRef": "ddd-domain-node-1",
        "text": "Define meaning and scope"
      },
      {
        "nodeRef": "ddd-domain-node-2",
        "text": "Connect meaning to permitted update boundaries"
      },
      {
        "nodeRef": "ddd-structure-node-1",
        "text": "An order is an Entity whose identity persists as its state changes; money and quantity are Values with business meaning. Explicit attribute types, optionality, relationships and constraints help prevent incorrect identifiers or invalid quantities from being passed across model boundaries."
      },
      {
        "nodeRef": "ddd-structure-node-2",
        "text": "Value Object meanings and constraints participate both in update Operation inputs/Aggregate state and in Query results/View values. An amount can be used in an order calculation and an order-list read. CML Values/Datatypes and typed boundaries carry these meanings through both paths. Persistence conversion and presentation formatting have separate responsibilities."
      },
      {
        "nodeRef": "ddd-aggregate-node-1",
        "text": "If an order and its lines form one Aggregate, adding a line or confirming the order is expressed through Aggregate Root operations. Those operations check current state and business conditions. Value constraints such as positive quantities combine with whole-object rules such as requiring lines before confirmation."
      },
      {
        "nodeRef": "ddd-aggregate-node-2",
        "text": "CNCF keeps persistent Entity state authoritative and treats an Aggregate as a write-side projection. Creation is distinguished from Commands on existing objects, and invariants are connected to the relevant checks, calculations and Command implementations. Valid update candidates are then committed through UoW and storage conditions described later."
      },
      {
        "nodeRef": "ddd-aggregate-node-3",
        "text": "Verify the link between rules and implementation"
      },
      {
        "nodeRef": "ddd-delivery-node-1",
        "text": "Use separate models for writes and reads"
      },
      {
        "nodeRef": "ddd-delivery-node-2",
        "text": "Connect facts and projections to presentation"
      },
      {
        "nodeRef": "ddd-runtime-node-1",
        "text": "Preserve model boundaries throughout execution"
      },
      {
        "nodeRef": "ddd-runtime-node-2",
        "text": "Delegate supporting mechanisms to the platform"
      },
      {
        "nodeRef": "ddd-poeaa-node-1",
        "text": "A Repository provides access to business objects. Applications load objects through this boundary and invoke Aggregate behavior, reducing database-specific code throughout business processing. Object identity and update rules remain domain responsibilities."
      },
      {
        "nodeRef": "ddd-poeaa-node-2",
        "text": "Data Mapper organizes conversion between business types and storage representations. CNCF’s EntityStore/EntityPersistent–DataStore boundary converts according to declared types and selected mappings, while DataStore handles physical access. This separation allows storage representations to vary without changing business types."
      },
      {
        "nodeRef": "ddd-uow-node-1",
        "text": "Aggregates determine whether proposed changes are valid in the business domain; UoW manages the grouping, commitment and abortion of changes. DataStore participates in the transaction and performs storage operations. With conflict detection selected, storage atomically checks expected revisions or state and rejects changes when conditions differ. Business rules and commit-time conditions jointly protect consistency."
      },
      {
        "nodeRef": "ddd-uow-node-2",
        "text": "Invocation and target authorization apply on the same execution path. When a long Workflow or Job spans multiple updates, each commit boundary and subsequent retry or compensation policy is explicit. Workflows organize business progression; UoW manages commitment and resource termination for individual work, without forcing the whole progression into one database transaction."
      },
      {
        "nodeRef": "ddd-domain-events-node-1",
        "text": "Where a Command requests order confirmation, a Domain Event records that confirmation occurred. Its name, subject identity, occurrence time and information are explicit. CNCF’s Aggregate/View contract connects the write side to View projection through such facts. Business occurrences can also coordinate subsequent Workflow processing and other Components."
      },
      {
        "nodeRef": "ddd-domain-events-node-2",
        "text": "Commitment, Event recording and publication, and consumer completion are separate outcomes. The chosen path defines redelivery, deduplication, ordering and resumption; asynchronous Views require freshness and re-read policies. Combining fact semantics with delivery and projection policies shares results without requiring excessive synchronous coupling."
      },
      {
        "nodeRef": "ddd-readmodel-node-1",
        "text": "CNCF organizes Aggregates as update-side projections and Views as read-side projections. A model enforcing order-confirmation consistency and a model returning order number/status/amount have different responsibilities. Queries use the read route; Value Object semantics also apply to returned values. Read-side attributes need not match the update Aggregate shape."
      },
      {
        "nodeRef": "ddd-readmodel-node-2",
        "text": "Model separation and physical storage separation are separate decisions. This guide uses persistent Entity state as authoritative and treats Views and the Domain Working Set as reconstructible. Baseline loading and committed-update projection are distinct; asynchronous routes specify freshness and re-read conditions. Event Sourcing, where event history is authoritative, is a separate selection from CQRS."
      },
      {
        "nodeRef": "ddd-display-node-1",
        "text": "Views contain semantic read results such as order identity, state and amount. A Display model sits outside the View and organizes fields, formatted values, links and offered actions. CNCF applies registered presentation definitions and typed conversions to authorized View values, connecting them to UIs such as Web and Flutter while retaining business meaning."
      },
      {
        "nodeRef": "ddd-display-node-2",
        "text": "UI actions return through public Operations or explicitly registered mutation targets. Changes follow authorization, Aggregate rules and UoW rather than modifying Views during presentation. Combining View/Display projection with a separate mutation entry keeps presentation concerns apart from business rules."
      },
      {
        "nodeRef": "ddd-display-node-3",
        "text": "Route actions back to domain mutation paths"
      },
      {
        "nodeRef": "ddd-behavior-node-1",
        "text": "Model behavioral conditions"
      },
      {
        "nodeRef": "ddd-behavior-node-2",
        "text": "Connect structure to execution"
      },
      {
        "nodeRef": "ddd-application-node-1",
        "text": "Previously defined use cases are realized through Workflow operations, sequencing, branching and waits. Services and Operations form the externally accessible application boundary, taking responsibility corresponding to PoEAA’s Service Layer. Screens and external APIs connect to the same public operations; Workflows invoke the domain behavior needed to realize them."
      },
      {
        "nodeRef": "ddd-application-node-2",
        "text": "Application progression belongs in the Workflow; rules such as whether an order may be confirmed remain in the domain. External functions connect through explicit Provider bindings. Use cases provide criteria for checking the resulting behavior rather than serving as executable procedures themselves."
      },
      {
        "nodeRef": "ddd-dynamic-node-1",
        "text": "A state machine defines states, events, transition conditions and actions. Relating the draft-to-confirmed transition to the confirmation Operation allows calls from a Workflow to be evaluated against the order’s current state. Cozy-generated definitions are registered with CNCF, connecting transitions and business updates to the same subject."
      },
      {
        "nodeRef": "ddd-dynamic-node-2",
        "text": "Decisions that change independently, such as pricing or approval conditions, can be identified as Domain Rules and connected to a Rule Model and Rule Engine. Evaluation results enter shared execution paths such as Operations, separating decision logic from execution with authorization and commitment. Workflows, state machines and rules make progression, object lifecycle and decisions explicit."
      },
      {
        "nodeRef": "ddd-execution-node-1",
        "text": "Define business meaning"
      },
      {
        "nodeRef": "ddd-execution-node-2",
        "text": "Make it concrete through a shared path"
      },
      {
        "nodeRef": "ddd-semantics-node-1",
        "text": "Developers model business types and constraints, public operations, states and transitions, Workflow progression, and View/Display relationships. Cozy projects Entities and Values into typed interfaces and state machines, Workflows and presentation into corresponding definitions and connection code. Textus/CNCF uses registered definitions and handlers to perform invocation, transitions, projection and commitment."
      },
      {
        "nodeRef": "ddd-semantics-node-2",
        "text": "A model “running directly” means that its defined structure and behavior are directly connected to this projection and execution path. Business-specific calculations and external integration supplement generated types and explicit extension points. The approach combines generation with interpretation of model definitions; it does not mean reparsing all CML at runtime."
      },
      {
        "nodeRef": "ddd-memory-node-1",
        "text": "Entity models specify runtime treatment as well as data structure. Textus/CNCF represents the stereotype-like classification as entityKind and connects it to defaults such as residency for master data. Task data is loaded as needed, with caching or retention configured for its intended use."
      },
      {
        "nodeRef": "ddd-memory-node-2",
        "text": "Classification defaults combine with explicit Working Set policies. Current defaults make master resident and disable the Working Set for task; active-only workflow residency requires an explicit state-based policy. Runtime use of model classification and configuration reduces per-Entity memory-management implementation."
      },
      {
        "nodeRef": "ddd-memory-node-3",
        "text": "Residency and caching hold reconstructible state for domain processing rather than replacing authoritative persistent state. This guide covers the mapping from model classification to execution policy; retention, release, consistency and recovery are detailed in the reactive guide."
      },
      {
        "nodeRef": "ddd-toolchain-node-1",
        "text": "The table relates authored model content to generated artifacts and runtime responsibilities. Business types align inputs, results and persistence; dynamic definitions align progression and state; read and presentation definitions align information provided to users. Shared identities and typed contracts connect these different models into one behavior."
      },
      {
        "nodeRef": "ddd-toolchain-node-2",
        "text": "For each selected model element, generation, registration with runtime mechanisms, and Provider or supplementary bindings must align. End-to-end Domain Rule projection and external Providers are checked for the selected version and configuration. Relating authored content to its implementation and configuration preserves continuity through execution."
      },
      {
        "nodeRef": "ddd-components-node-1",
        "text": "Assign model responsibilities to components"
      },
      {
        "nodeRef": "ddd-components-node-2",
        "text": "Connect external clients through public contracts"
      },
      {
        "nodeRef": "ddd-example-node-1",
        "text": "In order confirmation, a Workflow invokes a public Operation and the Order Aggregate checks lines and current state to produce a proposed update. UoW manages commitment, with selected mappings and DataStore performing persistence. The committed fact is communicated as a Domain Event; its projected View result is presented through Display."
      },
      {
        "nodeRef": "ddd-example-node-2",
        "text": "The developer defines order types and rules, the confirmation operation, progression, read fields and presentation mappings. The platform connects these definitions and supplementary handlers to registered execution mechanisms. The diagram illustrates model-to-runtime responsibilities; delivery and projection timing follow the selected execution path."
      },
      {
        "nodeRef": "ddd-development-node-1",
        "text": "Trace change impact from the model"
      },
      {
        "nodeRef": "ddd-development-node-2",
        "text": "Verify business meaning and its realization"
      },
      {
        "nodeRef": "ddd-ai-node-1",
        "text": "Separate mechanical generation from semantic supplementation"
      },
      {
        "nodeRef": "ddd-ai-node-2",
        "text": "Constrain changes through model and execution boundaries"
      },
      {
        "nodeRef": "ddd-verification-node-1",
        "text": "Verification compares defined use cases with models, generated types and component contracts, and runtime outcomes. textus-cbd-support model review, compilation, car lint and executable specifications cover valid cases, rejected cases, conflicts and state after partial failure."
      },
      {
        "nodeRef": "ddd-verification-node-2",
        "text": "Changing order-confirmation conditions requires updates to Aggregate and state-machine conditions, the relevant Operation and verification examples. Views and Displays are checked when the change affects them. Updating source definitions and necessary supplementary logic rather than patching generated code keeps business meaning aligned with behavior."
      },
      {
        "nodeRef": "ddd-conclusion-node-1",
        "text": "Preserve model semantics in execution"
      },
      {
        "nodeRef": "ddd-conclusion-node-2",
        "text": "Keep development, change and verification coherent"
      },
      {
        "nodeRef": "ddd-appendix-node-1",
        "text": "Look up pattern responsibilities"
      },
      {
        "nodeRef": "ddd-appendix-node-2",
        "text": "Locate their connections in the guide"
      },
      {
        "nodeRef": "ddd-appendix-ddd-node-1",
        "text": "Identify responsibilities"
      },
      {
        "nodeRef": "ddd-appendix-ddd-node-2",
        "text": "Locate connections to other models"
      },
      {
        "nodeRef": "ddd-appendix-poeaa-node-1",
        "text": "Identify responsibilities"
      },
      {
        "nodeRef": "ddd-appendix-poeaa-node-2",
        "text": "Locate connections to other models"
      },
      {
        "nodeRef": "ddd-appendix-related-node-1",
        "text": "Identify responsibilities"
      },
      {
        "nodeRef": "ddd-appendix-related-node-2",
        "text": "Locate connections to other models"
      },
      {
        "nodeRef": "ddd-references-node-1",
        "text": "Eric Evans, Domain-Driven Design: Tackling Complexity in the Heart of Software. Foundation for business meaning, Ubiquitous Language, Bounded Contexts, Entities, Values and Aggregates. https://www.informit.com/store/domain-driven-design-tackling-complexity-in-the-heart-9780321125217"
      },
      {
        "nodeRef": "ddd-references-node-2",
        "text": "Vaughn Vernon, Implementing Domain-Driven Design. Reference for connecting core concepts to implementation and architecture. https://www.informit.com/store/implementing-domain-driven-design-9780321834577"
      },
      {
