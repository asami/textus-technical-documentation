                    ],
                    "sections": []
                  }
                ]
              },
              {
                "id": "ddd-domain-events-section",
                "heading": "Domain Events and Committed-Result Connections",
                "coreRefs": {
                  "steps": [
                    "ddd-domain-events"
                  ],
                  "claims": [
                    "ddd-domain-events-claim-1",
                    "ddd-domain-events-claim-2"
