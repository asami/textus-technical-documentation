            "blocks": [
              {
                "id": "ddd-delivery-paragraph-1",
                "kind": "paragraph",
                "text": "CQRS is an architectural perspective separating models for updates and reads. The sections below explain the update path, committed-result connections and read path, locating DDD techniques and supporting mechanisms. Their order explains the relationship between paths rather than prescribing a general modeling procedure.",
                "coreRefs": {
                  "steps": [
