              ]
            },
            "blocks": [
              {
                "id": "ddd-strategic-intro",
                "kind": "paragraph",
                "text": "Strategic highlights are shared language, contexts of consistent meaning and relationships between contexts. SimpleModeling connects them to BoK terminology/knowledge, subsystem/component boundaries and public contracts.",
                "coreRefs": {
                  "steps": [
                    "ddd-strategic"
                  ],
                  "claims": [
                    "ddd-strategic-intro-claim"
                  ],
                  "nodes": [
                    "ddd-strategic-intro-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-strategic-flow"
                  ]
                }
              },
              {
                "id": "ddd-strategic-axes",
                "kind": "paragraph",
                "text": "Contexts scope meanings for both updates and reads. Strategic/tactical design and CQRS update/read paths are separate axes. Inter-context language/contracts and intra-context update/read model separation have distinct roles.",
                "coreRefs": {
                  "steps": [
                    "ddd-strategic"
                  ],
                  "claims": [
                    "ddd-strategic-axes-claim"
                  ],
                  "nodes": [
                    "ddd-strategic-axes-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-strategic-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ddd-context-section",
                "heading": "Bounded Contexts, Context Maps and Component Boundaries",
                "coreRefs": {
                  "steps": [
                    "ddd-context"
                  ],
                  "claims": [
                    "ddd-context-claim-1",
                    "ddd-context-claim-2"
                  ],
                  "nodes": [
                    "ddd-context-node-1",
                    "ddd-context-node-2"
                  ],
                  "relations": [
                    "ddd-context-relation-1"
                  ],
                  "flows": [
                    "ddd-context-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-context-paragraph-1",
                    "kind": "paragraph",
                    "text": "A Bounded Context scopes consistent meanings for a model and its language. Order-taking and shipping may use the same word order with different attributes and rules. SimpleModeling concretizes this semantic boundary as a subsystem or component modeling boundary. This is separate from the number of physical hosts or processes.",
                    "coreRefs": {
                      "steps": [
                        "ddd-context"
                      ],
                      "claims": [
                        "ddd-context-claim-1"
                      ],
                      "nodes": [
                        "ddd-context-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-context-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-context-paragraph-2",
                    "kind": "paragraph",
                    "text": "Context Maps provide an entry point for understanding inter-context relationships and integration responsibilities. SimpleModeling realizes these relationships through subsystem/component Service/Operation, translation and Event contracts. Terminology translation, model correspondence and dependencies are described separately. This is the adopted system policy, not a universal DDD deployment topology.",
                    "coreRefs": {
                      "steps": [
                        "ddd-context"
                      ],
                      "claims": [
                        "ddd-context-claim-2"
                      ],
                      "nodes": [
                        "ddd-context-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-context-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ddd-knowledge-section",
                "heading": "Ubiquitous Language, BoK, Entities and Knowledge",
                "coreRefs": {
                  "steps": [
                    "ddd-knowledge"
                  ],
                  "claims": [
                    "ddd-knowledge-claim-1",
                    "ddd-knowledge-claim-2"
                  ],
                  "nodes": [
                    "ddd-knowledge-node-1",
                    "ddd-knowledge-node-2"
                  ],
                  "relations": [
                    "ddd-knowledge-relation-1"
                  ],
                  "flows": [
                    "ddd-knowledge-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-knowledge-paragraph-1",
                    "kind": "paragraph",
                    "text": "Ubiquitous Language concerns the shared language supporting a domain model. SimpleModeling connects BoK terminology, context, explanations and provenance to model meaning. One path develops terms into Entities, Values and Datatypes; another connects terminology to knowledge. Conversations, rules and behavior are also part of the language, so a glossary alone does not establish it.",
                    "coreRefs": {
                      "steps": [
                        "ddd-knowledge"
                      ],
                      "claims": [
                        "ddd-knowledge-claim-1"
                      ],
                      "nodes": [
                        "ddd-knowledge-node-1",
                        "ddd-knowledge-node-2"
                      ],
                      "relations": [
                        "ddd-knowledge-relation-1"
                      ],
                      "flows": [
                        "ddd-knowledge-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-knowledge-paragraph-2",
                    "kind": "paragraph",
                    "text": "Meaning and rationale in the BoK/literate model connect to CML elements; information held by executed Entities connects to Information and knowledge representations with identity and provenance. This is not a conversion of every term into an Entity. The two paths are detailed in [[../../knowledge-modeling/textus-cncf-knowledge-modeling.dox/index.dox][Designing Domain Models from the BoK]] and [[../../entity-knowledge/textus-cncf-entity-knowledge.dox/index.dox][Treating Entities as Knowledge]].",
                    "coreRefs": {
                      "steps": [
                        "ddd-knowledge"
                      ],
                      "claims": [
                        "ddd-knowledge-claim-2"
                      ],
                      "nodes": [
                        "ddd-knowledge-node-1",
                        "ddd-knowledge-node-2"
                      ],
                      "relations": [
                        "ddd-knowledge-relation-1"
                      ],
                      "flows": [
                        "ddd-knowledge-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ddd-domain-section",
            "heading": "Tactical Design Highlights",
            "coreRefs": {
              "steps": [
