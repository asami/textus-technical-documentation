              {
                "id": "ddd-development-paragraph-1",
                "kind": "paragraph",
                "text": "Model/implementation correspondences extend to supplementary code and verification results. This section relates DDD rules to generated artifacts, AI additions and checks of update/read behavior. General development procedures belong to separate documentation.",
