                "text": "Martin Fowler, Patterns of Enterprise Application Architecture. The public catalog also supports the guide’s Service Layer, Repository, Data Mapper and Unit of Work mappings: https://martinfowler.com/eaaCatalog/ . CQRS: https://martinfowler.com/bliki/CQRS.html . Supplementary DDD reference: Eric Evans, Domain-Driven Design Reference, https://www.domainlanguage.com/ddd/reference/",
