                "blocks": [
                  {
                    "id": "ddd-components-paragraph-1",
                    "kind": "paragraph",
                    "text": "Components hold business responsibilities and expose Service, Operation and Event contracts. CARs package generated definitions and implementations with supplementary logic; installation connects dependencies and Providers. Mapping Bounded Context semantics to public contracts reduces direct dependence on internal state by other Components or UIs.",
