              {
                "id": "ddd-readmodel-section",
                "heading": "Read-Side Queries, Views and Reconstruction",
                "coreRefs": {
                  "steps": [
                    "ddd-readmodel"
                  ],
                  "claims": [
                    "ddd-readmodel-claim-1",
                    "ddd-readmodel-claim-2"
                  ],
                  "nodes": [
                    "ddd-readmodel-node-1",
