        "text": "Vlad Khononov, Learning Domain-Driven Design. Reference for strategic and tactical design and architectural choices. https://www.oreilly.com/library/view/learning-domain-driven-design/9781098100124/"
      },
      {
        "nodeRef": "ddd-comparison-sources-node",
        "text": "Public comparison sources: E contents https://www.oreilly.com/library/view/domain-driven-design-tackling/0321125215/toc.html and Chapter 5 opening https://www.oreilly.com/library/view/domain-driven-design-tackling/0321125215/ch05.html ; V contents at the cited publisher page and the Chapter 10 consistency-boundary excerpt https://www.informit.com/articles/article.aspx?p=2020371&seqNum=2 ; K contents at the cited publisher page, context-dependent language in Chapter 3 https://www.oreilly.com/library/view/learning-domain-driven-design/9781098100124/ch03.html and terminology in Chapter 6 https://www.oreilly.com/library/view/learning-domain-driven-design/9781098100124/ch06.html . This public inspection does not establish full-text equivalence or absence."
