                        "ddd-structure-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ddd-aggregate-section",
                "heading": "Aggregates and Update Consistency Boundaries",
                "coreRefs": {
                  "steps": [
                    "ddd-aggregate"
                  ],
                  "claims": [
                    "ddd-aggregate-claim-1",
                    "ddd-aggregate-claim-2"
