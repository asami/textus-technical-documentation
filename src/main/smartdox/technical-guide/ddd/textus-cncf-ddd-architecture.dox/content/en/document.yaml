              ],
              "flows": [
                "ddd-domain-flow"
              ]
            },
            "blocks": [
              {
                "id": "ddd-domain-paragraph-1",
                "kind": "paragraph",
                "text": "Tactical highlights cover Entity identity, Value Object semantics, Aggregate update consistency and connections to Repositories and Domain Events. These concepts correspond to SimpleModeling types, rules and public operations. Strategic/tactical classification and update/read classification are separate axes; concepts such as Value Objects participate in both paths.",
                "coreRefs": {
                  "steps": [
                    "ddd-domain"
