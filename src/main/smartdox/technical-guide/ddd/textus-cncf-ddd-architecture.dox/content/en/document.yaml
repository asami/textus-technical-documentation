                    "ddd-structure-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-structure-paragraph-1",
                    "kind": "paragraph",
                    "text": "An order is an Entity whose identity persists as its state changes; money and quantity are Values with business meaning. Explicit attribute types, optionality, relationships and constraints help prevent incorrect identifiers or invalid quantities from being passed across model boundaries.",
                    "coreRefs": {
                      "steps": [
                        "ddd-structure"
                      ],
                      "claims": [
                        "ddd-structure-claim-1"
                      ],
                      "nodes": [
                        "ddd-structure-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-structure-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-structure-paragraph-2",
                    "kind": "paragraph",
                    "text": "Value Object meanings and constraints participate both in update Operation inputs/Aggregate state and in Query results/View values. An amount can be used in an order calculation and an order-list read. CML Values/Datatypes and typed boundaries carry these meanings through both paths. Persistence conversion and presentation formatting have separate responsibilities.",
                    "coreRefs": {
                      "steps": [
                        "ddd-structure"
                      ],
                      "claims": [
                        "ddd-structure-claim-2"
                      ],
                      "nodes": [
                        "ddd-structure-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-structure-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-structure-paragraph-3",
                    "kind": "paragraph",
                    "text": "Expressing business meaning through types and constraints also connects to functional domain modeling. Domain Modeling Made Functional is a reference for this use of types. Here the technique supports shared meanings across inputs, results and persistence.",
                    "coreRefs": {
                      "steps": [
                        "ddd-structure"
                      ],
                      "claims": [
                        "ddd-structure-claim-3"
                      ],
                      "nodes": [
                        "ddd-structure-node-2"
