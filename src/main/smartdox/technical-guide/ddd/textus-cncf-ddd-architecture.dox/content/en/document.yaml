              {
                "id": "ddd-references-paragraph-7",
                "kind": "paragraph",
                "text": "Internal sources: SimpleModeling.org journals of 2026-10-16 on executing DDD models in CNCF and 2026-10-17 on Domain Rule / Rule Engine integration; Cozy’s CML Semantic Capability Inventory, ModelTypeProjector implementation, and Generated StateMachine/Workflow ABI Contract.",
