                ],
                "sections": [
                  {
                    "id": "ddd-poeaa-section",
                    "heading": "Repositories, Data Mappers and Persistence",
                    "coreRefs": {
                      "steps": [
                        "ddd-poeaa"
                      ],
                      "claims": [
                        "ddd-poeaa-claim-1",
                        "ddd-poeaa-claim-2"
                      ],
                      "nodes": [
                        "ddd-poeaa-node-1",
                        "ddd-poeaa-node-2"
                      ],
                      "relations": [
                        "ddd-poeaa-relation-1"
                      ],
                      "flows": [
                        "ddd-poeaa-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "ddd-poeaa-paragraph-1",
                        "kind": "paragraph",
                        "text": "A Repository provides access to business objects. Applications load objects through this boundary and invoke Aggregate behavior, reducing database-specific code throughout business processing. Object identity and update rules remain domain responsibilities.",
                        "coreRefs": {
                          "steps": [
                            "ddd-poeaa"
                          ],
                          "claims": [
                            "ddd-poeaa-claim-1"
                          ],
                          "nodes": [
                            "ddd-poeaa-node-1"
                          ],
                          "relations": [],
                          "flows": [
                            "ddd-poeaa-flow"
                          ]
                        }
                      },
                      {
                        "id": "ddd-poeaa-paragraph-2",
                        "kind": "paragraph",
                        "text": "Data Mapper organizes conversion between business types and storage representations. CNCF’s EntityStore/EntityPersistent–DataStore boundary converts according to declared types and selected mappings, while DataStore handles physical access. This separation allows storage representations to vary without changing business types.",
                        "coreRefs": {
                          "steps": [
                            "ddd-poeaa"
                          ],
                          "claims": [
                            "ddd-poeaa-claim-2"
                          ],
                          "nodes": [
