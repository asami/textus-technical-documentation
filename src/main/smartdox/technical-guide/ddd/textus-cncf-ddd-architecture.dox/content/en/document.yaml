                    "ddd-references-flow"
                  ]
                }
              },
              {
                "id": "ddd-references-paragraph-8",
                "kind": "paragraph",
                "text": "Internal sources: CNCF’s Aggregate/View Semantic Boundary, Entity Runtime Architecture, Textus Subsystem Runtime Architecture, Entity Conflict and Conditional Transition, Action Execution Semantics, and Rule Engine and Inference Runtime. Design contracts, specifications and implementation evidence are treated according to their respective scope. Display Model runtime design and specification establish the View/Display responsibility split and action integration. Further internal references are DataStore and Aggregate Persistence Model, DataStore logical type mapping, UnitOfWork Resource Lifecycle and Canonical Event Shape. Entity Kind and Working Set Policy and the EntityKindRuntimePolicy implementation establish the classification-to-memory-policy mapping.",
