                "blocks": [
                  {
                    "id": "ddd-example-paragraph-1",
                    "kind": "paragraph",
                    "text": "In order confirmation, a Workflow invokes a public Operation and the Order Aggregate checks lines and current state to produce a proposed update. UoW manages commitment, with selected mappings and DataStore performing persistence. The committed fact is communicated as a Domain Event; its projected View result is presented through Display.",
