                "sections": []
              },
              {
                "id": "ddd-verification-section",
                "heading": "Rules, Public Contracts and Update/Read Results",
                "coreRefs": {
                  "steps": [
                    "ddd-verification"
                  ],
                  "claims": [
                    "ddd-verification-claim-1",
                    "ddd-verification-claim-2"
                  ],
