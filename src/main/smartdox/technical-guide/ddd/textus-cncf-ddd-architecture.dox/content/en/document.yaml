            ],
            "sections": [
              {
                "id": "ddd-runtime-section",
                "heading": "Update-Side Persistence and Commitment",
                "coreRefs": {
                  "steps": [
                    "ddd-runtime"
                  ],
                  "claims": [
                    "ddd-runtime-claim-1"
                  ],
                  "nodes": [
                    "ddd-runtime-node-1",
                    "ddd-runtime-node-2"
                  ],
                  "relations": [
                    "ddd-runtime-relation-1"
                  ],
                  "flows": [
                    "ddd-runtime-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-runtime-paragraph-1",
                    "kind": "paragraph",
                    "text": "The update path connects Aggregate business rules with persistence, conflict checks and commit. Repository is a connection appearing in both DDD and PoEAA. Data Mapper and Unit of Work are complementary persistence/update-management patterns mapped to CNCF EntityStore, DataStore and UoW responsibilities.",
                    "coreRefs": {
                      "steps": [
                        "ddd-runtime"
                      ],
                      "claims": [
                        "ddd-runtime-claim-1"
                      ],
                      "nodes": [
                        "ddd-runtime-node-1",
