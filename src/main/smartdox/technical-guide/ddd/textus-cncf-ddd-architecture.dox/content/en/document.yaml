            "blocks": [
              {
                "id": "ddd-landscape-paragraph-1",
                "kind": "paragraph",
                "text": "The opening diagram connects DDD concerns to the SimpleModeling overview. Strategic design addresses language and boundaries; tactical design addresses responsibilities of Entities, Value Objects and Aggregates within those boundaries. The diagram distinguishes DDD concepts, complementary architecture techniques and SimpleModeling/CNCF models and mechanisms, with explicit connections between them.",
                "coreRefs": {
                  "steps": [
                    "ddd-landscape"
                  ],
                  "claims": [
                    "ddd-landscape-claim-1"
                  ],
                  "nodes": [
                    "ddd-landscape-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-landscape-flow"
                  ]
                }
              },
              {
                "id": "ddd-landscape-paragraph-2",
                "kind": "paragraph",
                "text": "The update path leads from Commands through Aggregate rules to commit. The read path leads from Queries to Views and Displays. Authoritative committed state and required projections connect the paths. Value Objects express meanings and constraints on both sides, without requiring a shared in-memory instance or identical model shapes. CQRS separates model responsibilities; physical storage separation and Event Sourcing remain independent choices.",
                "coreRefs": {
                  "steps": [
                    "ddd-landscape"
                  ],
                  "claims": [
                    "ddd-landscape-claim-2"
                  ],
                  "nodes": [
                    "ddd-landscape-node-2"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-landscape-flow"
                  ]
