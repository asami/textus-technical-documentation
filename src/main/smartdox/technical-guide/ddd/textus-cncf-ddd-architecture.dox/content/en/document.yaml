                "blocks": [
                  {
                    "id": "ddd-ai-paragraph-1",
                    "kind": "paragraph",
                    "text": "Cozy generates mechanically derivable types and connection structure; AI can supplement business calculations and external integration. The same types, component contracts, model checks and execution paths constrain AI changes to established meanings and update boundaries. The model-execution structure also functions as a harness that narrows AI decisions and changes.",
                    "coreRefs": {
