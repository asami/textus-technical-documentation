                  },
                  {
                    "id": "ddd-uow-section",
                    "heading": "Aggregates, Unit of Work and Commit",
                    "coreRefs": {
                      "steps": [
                        "ddd-uow"
                      ],
                      "claims": [
                        "ddd-uow-claim-1",
                        "ddd-uow-claim-2"
