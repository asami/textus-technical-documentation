          {
            "id": "ddd-strategic-section",
            "heading": "Strategic Design Highlights",
            "coreRefs": {
              "steps": [
                "ddd-strategic"
              ],
              "claims": [
                "ddd-strategic-intro-claim",
                "ddd-strategic-axes-claim"
