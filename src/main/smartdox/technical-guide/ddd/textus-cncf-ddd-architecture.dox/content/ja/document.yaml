                "ddd-references-flow"
              ]
            },
            "blocks": [
              {
                "id": "ddd-references-paragraph-1",
                "kind": "paragraph",
                "text": "Eric Evans, Domain-Driven Design: Tackling Complexity in the Heart of Software。業務の意味、Ubiquitous Language、Bounded Context、Entity・Value・Aggregateなどの基本概念の参照先。https://www.informit.com/store/domain-driven-design-tackling-complexity-in-the-heart-9780321125217",
                "coreRefs": {
                  "steps": [
                    "ddd-references"
                  ],
                  "claims": [
                    "ddd-references-claim-1"
                  ],
                  "nodes": [
                    "ddd-references-node-1"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-references-flow"
                  ]
                }
              },
              {
                "id": "ddd-references-paragraph-2",
                "kind": "paragraph",
                "text": "Vaughn Vernon, Implementing Domain-Driven Design。基本概念を実装とアーキテクチャへ接続する際の参照先。https://www.informit.com/store/implementing-domain-driven-design-9780321834577",
                "coreRefs": {
                  "steps": [
                    "ddd-references"
                  ],
                  "claims": [
                    "ddd-references-claim-2"
                  ],
                  "nodes": [
                    "ddd-references-node-2"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-references-flow"
                  ]
                }
              },
              {
                "id": "ddd-references-paragraph-3",
                "kind": "paragraph",
                "text": "Vlad Khononov, Learning Domain-Driven Design。戦略的設計・戦術的設計・アーキテクチャ上の選択を整理する参照先。https://www.oreilly.com/library/view/learning-domain-driven-design/9781098100124/",
                "coreRefs": {
                  "steps": [
                    "ddd-references"
                  ],
                  "claims": [
                    "ddd-references-claim-3"
                  ],
                  "nodes": [
                    "ddd-references-node-3"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-references-flow"
                  ]
                }
              },
              {
                "id": "ddd-references-paragraph-4",
                "kind": "paragraph",
                "text": "Martin Fowler, Patterns of Enterprise Application Architecture。本文のService Layer、Repository、Data Mapper、Unit of Workは公開パターン・カタログも参照しています。https://martinfowler.com/eaaCatalog/ 。CQRS：https://martinfowler.com/bliki/CQRS.html 。DDDの補助資料：Eric Evans, Domain-Driven Design Reference。https://www.domainlanguage.com/ddd/reference/",
                "coreRefs": {
                  "steps": [
                    "ddd-references"
                  ],
                  "claims": [
                    "ddd-references-claim-4"
                  ],
                  "nodes": [
                    "ddd-references-node-3"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-references-flow"
                  ]
                }
              },
              {
                "id": "ddd-references-paragraph-5",
                "kind": "paragraph",
                "text": "Scott Wlaschin, Domain Modeling Made Functional。本文「Entityと両系統のValue Object」の型・値の制約との対応で参照します。F#での実装手法の詳細は本技術ガイドでは扱いません。https://pragprog.com/titles/swdddf/domain-modeling-made-functional/",
                "coreRefs": {
                  "steps": [
                    "ddd-references"
                  ],
                  "claims": [
                    "ddd-references-claim-5"
                  ],
                  "nodes": [
                    "ddd-references-node-3"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-references-flow"
                  ]
                }
              },
              {
                "id": "ddd-references-paragraph-6",
                "kind": "paragraph",
                "text": "Debasish Ghosh, Functional and Reactive Domain Modeling。本文「モデルの意味と処理系の責務」の業務計算と入出力処理の分離との対応で参照します。Scalaによる関数型モデリングの詳説は別文書の対象とします。https://www.manning.com/books/functional-and-reactive-domain-modeling",
                "coreRefs": {
                  "steps": [
                    "ddd-references"
                  ],
                  "claims": [
                    "ddd-references-claim-6"
                  ],
                  "nodes": [
                    "ddd-references-node-3"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-references-flow"
                  ]
                }
              },
              {
                "id": "ddd-references-paragraph-7",
                "kind": "paragraph",
                "text": "内部資料：SimpleModeling.orgの2026-10-16「CNCFシリーズ構想 - DDDモデルを実行し、KnowledgeとAIへ接続するRuntime」と2026-10-17「Domain Rule / Rule Engineをハーネス・シリーズとCNCF記事へ接続する」。CozyのCML Semantic Capability Inventory、ModelTypeProjector実装、Generated StateMachine/Workflow ABI Contract。",
                "coreRefs": {
                  "steps": [
                    "ddd-references"
                  ],
                  "claims": [
                    "ddd-references-claim-7"
                  ],
                  "nodes": [
                    "ddd-references-node-3"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-references-flow"
                  ]
                }
              },
              {
                "id": "ddd-references-paragraph-8",
                "kind": "paragraph",
                "text": "内部資料：CNCFのAggregate/View Semantic Boundary、Entity Runtime Architecture、Textus Subsystem Runtime Architecture、Entity Conflict and Conditional Transition、Action Execution Semantics、Rule Engine and Inference Runtime。これらの設計・仕様と実装の位置付けを区別して参照しています。 Display Model runtime designとDisplay Model runtime specificationは、ViewとDisplayの責務分離および操作の接続の参照先です。 DataStore and Aggregate Persistence Model、DataStore logical type mapping、UnitOfWork Resource Lifecycle、Canonical Event Shapeも参照しています。 Entity Kind and Working Set PolicyとEntityKindRuntimePolicyの実装は、分類とメモリ管理の対応の参照先です。",
                "coreRefs": {
                  "steps": [
                    "ddd-references"
                  ],
                  "claims": [
                    "ddd-references-claim-8"
                  ],
                  "nodes": [
                    "ddd-references-node-3"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-references-flow"
                  ]
                }
              },
