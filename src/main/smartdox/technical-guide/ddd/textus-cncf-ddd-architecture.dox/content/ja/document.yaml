          {
            "id": "textus-cncf-ddd-architecture-paragraph-1",
            "kind": "paragraph",
            "text": "本技術ガイドは、DDDの観点からSimpleModelingおよびTextus/CNCFのモデル構造と実行の仕組みを説明します。DDDの概念や設計上の関心事との対応を通じて、本システムの構成と設計方針を理解することを目的とします。目的、参照する用語、全体像、戦略的・戦術的設計のハイライト、更新系・参照系との接続の順に示します。",
            "coreRefs": {
              "steps": [
                "textus-cncf-ddd-architecture"
              ],
