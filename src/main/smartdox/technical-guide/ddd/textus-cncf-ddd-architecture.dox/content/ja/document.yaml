                "id": "ddd-comparison-sources",
                "kind": "paragraph",
                "text": "比較の公開出典：Eの目次 https://www.oreilly.com/library/view/domain-driven-design-tackling/0321125215/toc.html 、第5章の冒頭 https://www.oreilly.com/library/view/domain-driven-design-tackling/0321125215/ch05.html 。Vの目次は前掲出版社ページ、第10章の整合性境界の公開本文 https://www.informit.com/articles/article.aspx?p=2020371&seqNum=2 。Kの目次は前掲出版社ページ、第3章の文脈依存の用語例 https://www.oreilly.com/library/view/learning-domain-driven-design/9781098100124/ch03.html 、第6章の用語整理 https://www.oreilly.com/library/view/learning-domain-driven-design/9781098100124/ch06.html 。全文照合や不掲載の証明は、この公開確認の対象外です。",
