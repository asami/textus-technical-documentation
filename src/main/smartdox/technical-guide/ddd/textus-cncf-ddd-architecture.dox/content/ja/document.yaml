                "blocks": [
                  {
                    "id": "ddd-memory-paragraph-1",
                    "kind": "paragraph",
                    "text": "Entityのモデルは、データの構造だけでなく、実行時の扱いも指定します。Textus/CNCFでは、ステレオタイプに相当するEntityの分類をentityKindとして扱い、マスターデータを常駐させるなどの既定方針へ結び付けます。タスクデータは必要に応じて取得し、用途に合わせてキャッシュや保持の方針を設定します。",
                    "coreRefs": {
                      "steps": [
                        "ddd-memory"
                      ],
                      "claims": [
                        "ddd-memory-claim-1"
                      ],
                      "nodes": [
                        "ddd-memory-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-memory-paragraph-2",
                    "kind": "paragraph",
                    "text": "分類だけで全対象を常駐させるのではなく、分類から得る既定値と明示的なWorking Set方針を組み合わせます。現行の既定値ではmasterは常駐、taskはWorking Set無効で、workflowの活動中保持には状態を使う方針の指定が必要です。モデルの分類と設定を実行基盤が利用するため、Entityごとに管理処理を作り直す負担を減らせます。",
                    "coreRefs": {
                      "steps": [
                        "ddd-memory"
                      ],
                      "claims": [
                        "ddd-memory-claim-2"
                      ],
                      "nodes": [
                        "ddd-memory-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-memory-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-memory-paragraph-3",
                    "kind": "paragraph",
                    "text": "常駐やキャッシュは永続状態を置き換える正本ではなく、業務処理のために保持する再構築可能な状態です。本技術ガイドではモデルの分類から実行方針へ至る対応を扱い、保持・解放、整合性、復旧の詳細はリアクティブ技術ガイドへつなぎます。",
                    "coreRefs": {
                      "steps": [
                        "ddd-memory"
                      ],
                      "claims": [
                        "ddd-memory-claim-3"
