            "blocks": [
              {
                "id": "ddd-landscape-paragraph-1",
                "kind": "paragraph",
                "text": "冒頭の図は、DDDからSimpleModelingの全体像へ入るための対応図です。戦略的設計は用語と境界を扱い、戦術的設計はその境界内のEntity、Value Object、Aggregateなどの責務を扱います。図ではDDDの概念、補完するアーキテクチャ技術、SimpleModeling・CNCFのモデルと基盤機構を分類し、接続線で各々の関係を示します。",
                "coreRefs": {
                  "steps": [
                    "ddd-landscape"
