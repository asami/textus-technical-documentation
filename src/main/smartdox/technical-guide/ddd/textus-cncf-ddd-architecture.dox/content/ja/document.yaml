                    "text": "Viewは、注文の識別子、状態、金額など、業務上の意味を持つ参照結果です。その外側にDisplayモデルを置き、表示項目、整形した値、参照先、操作の提示を構成します。CNCFは、認可済みのView値へ登録済みの表示定義と型付き変換を適用します。業務の意味を保ったまま、WebやFlutterなどのUIへ表示を接続できます。",
