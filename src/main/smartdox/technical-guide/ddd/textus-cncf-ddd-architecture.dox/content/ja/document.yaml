                    "id": "ddd-semantics-paragraph-3",
                    "kind": "paragraph",
                    "text": "補完する業務計算は、値を受け取り結果を返す処理として、保存や通信から分けて記述できます。計算を単独で確認し、入出力を共通の実行経路へ接続する考え方は、Functional and Reactive Domain Modelingで扱われています。関数型プログラミングの詳しい構成は、別文書「Modeling and FP」で扱います。",
