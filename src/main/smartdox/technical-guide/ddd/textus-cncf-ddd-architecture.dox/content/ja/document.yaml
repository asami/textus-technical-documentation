                    "id": "ddd-conclusion-paragraph-1",
                    "kind": "paragraph",
                    "text": "本技術ガイドでは、DDDの戦略的設計を用語とコンポーネント境界へ、戦術的設計を型と規則へ対応付け、CQRSの更新系・参照系に沿って関連機構との接続を示しました。各概念の役割と出典の区別を保つことで、DDDからSimpleModeling・Textus/CNCFの全体像を理解する接点になります。",
