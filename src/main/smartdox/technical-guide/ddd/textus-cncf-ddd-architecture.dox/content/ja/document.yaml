        "nodeRef": "ddd-memory-node-3",
        "text": "常駐やキャッシュは永続状態を置き換える正本ではなく、業務処理のために保持する再構築可能な状態です。本技術ガイドではモデルの分類から実行方針へ至る対応を扱い、保持・解放、整合性、復旧の詳細はリアクティブ技術ガイドへつなぎます。"
      },
      {
        "nodeRef": "ddd-toolchain-node-1",
        "text": "次の表は、開発で記述する内容が、どの生成物と実行責務へつながるかを示します。業務の型は入力・結果・保存の意味をそろえ、動的な定義は進行と状態をそろえ、参照・表示の定義は利用者へ渡す情報をそろえます。異なるモデルが共通の識別子と型付き契約を参照することで、一つの動作へ接続できます。"
      },
      {
        "nodeRef": "ddd-toolchain-node-2",
        "text": "実際の接続では、利用するモデル要素について、定義の生成、実行機構への登録、必要なProviderや補完処理のバインディングをそろえます。Domain Ruleの具体化や外部Providerなどは、採用する版と構成で対応範囲を確認します。モデルに記述した内容と、その内容を扱う実装・設定を対応させることが、動作までを一貫させる作業になります。"
      },
      {
        "nodeRef": "ddd-components-node-1",
        "text": "モデルの責務を部品へ配置する"
      },
      {
        "nodeRef": "ddd-components-node-2",
        "text": "公開契約で外部と接続する"
      },
      {
        "nodeRef": "ddd-example-node-1",
        "text": "注文確定では、Workflowから公開Operationを呼び、Order Aggregateが明細と現在状態を確認して更新候補を作ります。UoWが確定を管理し、選択したマッピングとDataStoreを通して保存します。確定した事実をDomain Eventとして後続へ渡し、Viewへ反映した結果をDisplayで提示します。"
      },
      {
        "nodeRef": "ddd-example-node-2",
        "text": "この例で開発者が定めるのは、注文の型と規則、確定操作、進行、参照項目、表示との対応です。処理系は、その定義と補完処理を登録された実行機構へつなぎます。図はモデルと実行責務の対応を示し、配信や投影のタイミングは採用する経路に応じて定めます。"
      },
      {
        "nodeRef": "ddd-development-node-1",
