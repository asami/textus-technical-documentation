                "kind": "paragraph",
                "text": "本技術ガイドの読者は、DDDを手掛かりにSimpleModeling・Textus/CNCFを理解したい人です。DDDの概念を入口として、その概念が対応するモデル、補完技術、実行基盤との関係を説明します。各技術の役割と接続を示し、優劣や不足を論じる構成にはしません。",
