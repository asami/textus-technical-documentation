                    "kind": "paragraph",
                    "text": "「モデルがそのまま動く」とは、モデルで決めた構造と振る舞いが、この具体化と実行の経路へ直接結び付いていることです。業務固有の計算や外部接続は、生成された型や明示された拡張点の中で補完します。実行時にすべてのCMLを読み直すという意味ではなく、生成とモデル定義の解釈を組み合わせてモデルを実現します。",
