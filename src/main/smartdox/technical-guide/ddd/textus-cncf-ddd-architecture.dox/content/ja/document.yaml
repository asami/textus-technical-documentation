              ],
              "flows": [
                "ddd-delivery-flow"
              ]
            },
            "blocks": [
              {
                "id": "ddd-delivery-paragraph-1",
                "kind": "paragraph",
                "text": "CQRSは、更新のためのモデルと参照のためのモデルを分けるアーキテクチャ上の観点です。以下では、更新系、確定結果を渡す接点、参照系の順に、DDD技術と関連機構の役割を示します。この並びは二系統の関係を読むためのものであり、一般的なモデリング手順ではありません。",
                "coreRefs": {
                  "steps": [
                    "ddd-delivery"
                  ],
                  "claims": [
                    "ddd-delivery-claim-1"
                  ],
                  "nodes": [
                    "ddd-delivery-node-1",
                    "ddd-delivery-node-2"
                  ],
                  "relations": [
                    "ddd-delivery-relation-1"
                  ],
                  "flows": [
                    "ddd-delivery-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ddd-runtime-section",
                "heading": "更新系と永続化・確定の責務",
                "coreRefs": {
                  "steps": [
                    "ddd-runtime"
                  ],
                  "claims": [
                    "ddd-runtime-claim-1"
                  ],
                  "nodes": [
                    "ddd-runtime-node-1",
                    "ddd-runtime-node-2"
                  ],
                  "relations": [
                    "ddd-runtime-relation-1"
                  ],
                  "flows": [
                    "ddd-runtime-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-runtime-paragraph-1",
                    "kind": "paragraph",
                    "text": "更新系では、Aggregateが表す業務規則と、保存・競合検査・確定の責務が接続します。RepositoryはDDDとPoEAAに共通して現れる接点です。Data MapperとUnit of Workは保存・更新管理を説明する補完パターンとして扱い、CNCFのEntityStore・DataStore・UoWの実行責務へ対応付けます。",
                    "coreRefs": {
                      "steps": [
                        "ddd-runtime"
                      ],
                      "claims": [
                        "ddd-runtime-claim-1"
                      ],
                      "nodes": [
                        "ddd-runtime-node-1",
                        "ddd-runtime-node-2"
                      ],
                      "relations": [
                        "ddd-runtime-relation-1"
                      ],
                      "flows": [
                        "ddd-runtime-flow"
                      ]
                    }
                  }
                ],
                "sections": [
                  {
                    "id": "ddd-poeaa-section",
                    "heading": "Repository・Data Mapperと保存の接点",
                    "coreRefs": {
                      "steps": [
                        "ddd-poeaa"
                      ],
                      "claims": [
                        "ddd-poeaa-claim-1",
                        "ddd-poeaa-claim-2"
                      ],
                      "nodes": [
                        "ddd-poeaa-node-1",
                        "ddd-poeaa-node-2"
                      ],
                      "relations": [
                        "ddd-poeaa-relation-1"
                      ],
                      "flows": [
                        "ddd-poeaa-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "ddd-poeaa-paragraph-1",
                        "kind": "paragraph",
                        "text": "Repositoryは、業務対象を取得・更新する接点です。アプリケーションはこの接点から対象を取得してAggregateの操作を呼び出すため、業務処理の各所へデータベース操作を書き込む範囲を減らせます。対象の識別と更新の規則はドメイン側に保持します。",
                        "coreRefs": {
                          "steps": [
                            "ddd-poeaa"
                          ],
                          "claims": [
                            "ddd-poeaa-claim-1"
                          ],
                          "nodes": [
                            "ddd-poeaa-node-1"
                          ],
                          "relations": [],
                          "flows": [
                            "ddd-poeaa-flow"
                          ]
                        }
                      },
                      {
                        "id": "ddd-poeaa-paragraph-2",
                        "kind": "paragraph",
                        "text": "Data Mapperは、業務の型と保存形式の変換を整理するパターンです。CNCFではEntityStore・EntityPersistentとDataStoreの境界で、宣言された型と選択したマッピングに従って変換します。DataStoreは物理的なアクセスを担当します。この分離により、業務の型を保ったまま保存先の表現を選べます。",
                        "coreRefs": {
                          "steps": [
                            "ddd-poeaa"
                          ],
                          "claims": [
                            "ddd-poeaa-claim-2"
                          ],
                          "nodes": [
                            "ddd-poeaa-node-2"
                          ],
                          "relations": [],
                          "flows": [
