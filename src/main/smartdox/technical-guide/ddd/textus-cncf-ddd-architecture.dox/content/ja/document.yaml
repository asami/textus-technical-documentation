                  "flows": [
                    "ddd-landscape-flow"
                  ]
                }
              },
              {
                "id": "ddd-landscape-paragraph-2",
                "kind": "paragraph",
                "text": "更新系はCommandからAggregateの規則と更新確定へ進み、参照系はQueryからView・Displayへ進みます。両系統は正本の確定状態と必要な投影で接続します。Value Objectは両系統で意味と制約を表します。共有するのは概念上の意味であり、同じメモリ上のインスタンスや同一形状のモデルを必須とするものではありません。CQRSは両モデルの役割分離を示し、保存先の物理的分割やEvent Sourcingは個別の選択として扱います。",
