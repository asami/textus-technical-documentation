            "blocks": [
              {
                "id": "ddd-strategic-intro",
                "kind": "paragraph",
                "text": "戦略的設計のハイライトは、意味を共有する言語、意味が一貫するコンテキスト、およびコンテキスト間の関係です。SimpleModelingでは、これらをBoKの用語・知識、サブシステム・コンポーネントの境界、公開契約との接点として説明します。",
                "coreRefs": {
                  "steps": [
                    "ddd-strategic"
                  ],
                  "claims": [
                    "ddd-strategic-intro-claim"
                  ],
                  "nodes": [
                    "ddd-strategic-intro-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-strategic-flow"
                  ]
                }
              },
              {
                "id": "ddd-strategic-axes",
                "kind": "paragraph",
                "text": "コンテキストは更新と参照の両方に意味の範囲を与えます。戦略的／戦術的設計と、CQRSの更新系／参照系は直交する整理軸です。コンテキスト間の言語や契約を定めることと、一つのコンテキスト内で更新・参照モデルを分けることを、それぞれの役割で示します。",
                "coreRefs": {
                  "steps": [
                    "ddd-strategic"
                  ],
                  "claims": [
                    "ddd-strategic-axes-claim"
                  ],
                  "nodes": [
                    "ddd-strategic-axes-node"
                  ],
                  "relations": [],
                  "flows": [
                    "ddd-strategic-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ddd-context-section",
                "heading": "Bounded Context・Context Mapと部品境界",
                "coreRefs": {
                  "steps": [
                    "ddd-context"
                  ],
                  "claims": [
                    "ddd-context-claim-1",
                    "ddd-context-claim-2"
                  ],
                  "nodes": [
                    "ddd-context-node-1",
                    "ddd-context-node-2"
                  ],
                  "relations": [
                    "ddd-context-relation-1"
                  ],
                  "flows": [
                    "ddd-context-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-context-paragraph-1",
                    "kind": "paragraph",
                    "text": "Bounded Contextは、特定のモデルと言語の意味が一貫して適用される範囲です。例えば受注と配送で同じ「注文」という語を使っても、扱う属性や規則は異なり得ます。SimpleModelingでは、この意味の境界をサブシステムやコンポーネントの境界として具体化するモデリング方針を取ります。物理ホストやプロセスの数とは別の境界です。",
                    "coreRefs": {
                      "steps": [
                        "ddd-context"
                      ],
                      "claims": [
                        "ddd-context-claim-1"
                      ],
                      "nodes": [
                        "ddd-context-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-context-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-context-paragraph-2",
                    "kind": "paragraph",
                    "text": "Context Mapは、コンテキスト間の関係と接続時の責任を理解する接点です。SimpleModelingでは、対応するサブシステム・コンポーネント間の公開Service・Operation、データ変換およびEventの契約へ関係を具体化します。用語の翻訳、モデルの対応、接続先への依存を区別して記述します。これは本システムの採用方針であり、すべてのDDDシステムに同じ配備単位を要求するものではありません。",
                    "coreRefs": {
                      "steps": [
                        "ddd-context"
                      ],
                      "claims": [
                        "ddd-context-claim-2"
                      ],
                      "nodes": [
                        "ddd-context-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-context-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ddd-knowledge-section",
                "heading": "Ubiquitous LanguageとBoK・Entity・知識",
                "coreRefs": {
                  "steps": [
                    "ddd-knowledge"
                  ],
                  "claims": [
                    "ddd-knowledge-claim-1",
                    "ddd-knowledge-claim-2"
                  ],
                  "nodes": [
                    "ddd-knowledge-node-1",
                    "ddd-knowledge-node-2"
                  ],
                  "relations": [
                    "ddd-knowledge-relation-1"
                  ],
                  "flows": [
                    "ddd-knowledge-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-knowledge-paragraph-1",
                    "kind": "paragraph",
                    "text": "Ubiquitous Languageは、業務のモデルを支える共有言語という観点です。SimpleModelingでは、BoKで管理する用語と、その文脈・説明・出典をモデルの意味へ結び付けます。用語からEntity・Value・Datatypeなどのモデルへ展開する経路と、用語を知識へ結び付ける経路を分けて示します。共有言語には会話・規則・振る舞いも含まれるため、用語一覧の存在だけで成立したとは扱いません。",
                    "coreRefs": {
                      "steps": [
                        "ddd-knowledge"
                      ],
                      "claims": [
                        "ddd-knowledge-claim-1"
                      ],
                      "nodes": [
                        "ddd-knowledge-node-1",
                        "ddd-knowledge-node-2"
                      ],
                      "relations": [
                        "ddd-knowledge-relation-1"
                      ],
                      "flows": [
                        "ddd-knowledge-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-knowledge-paragraph-2",
                    "kind": "paragraph",
                    "text": "BoKと文芸モデルに残る意味・判断理由をCMLのモデル要素へつなぎ、具体化と実行を経たEntityの情報も、識別と出典を保ってInformation・知識表現へ接続します。すべての用語を一律にEntityへ変換する対応ではありません。詳細な二つの経路は、[[../../knowledge-modeling/textus-cncf-knowledge-modeling.dox/index.dox][BoKからドメイン・モデルを設計する]]と[[../../entity-knowledge/textus-cncf-entity-knowledge.dox/index.dox][Entityを知識として扱う]]で説明しています。",
                    "coreRefs": {
                      "steps": [
                        "ddd-knowledge"
                      ],
                      "claims": [
                        "ddd-knowledge-claim-2"
                      ],
                      "nodes": [
                        "ddd-knowledge-node-1",
                        "ddd-knowledge-node-2"
                      ],
                      "relations": [
                        "ddd-knowledge-relation-1"
                      ],
                      "flows": [
                        "ddd-knowledge-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "ddd-domain-section",
            "heading": "戦術的設計のハイライト",
            "coreRefs": {
              "steps": [
                "ddd-domain"
              ],
              "claims": [
                "ddd-domain-claim-1"
              ],
              "nodes": [
                "ddd-domain-node-1",
                "ddd-domain-node-2"
              ],
              "relations": [
                "ddd-domain-relation-1"
              ],
              "flows": [
                "ddd-domain-flow"
              ]
            },
            "blocks": [
              {
                "id": "ddd-domain-paragraph-1",
                "kind": "paragraph",
                "text": "戦術的設計のハイライトは、Entityによる識別、Value Objectによる値の意味、Aggregateによる更新整合性、およびRepositoryやDomain Eventとの接続です。これらの概念を、SimpleModelingの型・規則・公開操作と照合します。戦略的／戦術的という分類と、更新系／参照系という分類は異なる軸です。Value Objectのように両系統で利用する概念もあります。",
                "coreRefs": {
                  "steps": [
                    "ddd-domain"
                  ],
                  "claims": [
                    "ddd-domain-claim-1"
                  ],
                  "nodes": [
                    "ddd-domain-node-1",
                    "ddd-domain-node-2"
                  ],
                  "relations": [
                    "ddd-domain-relation-1"
                  ],
                  "flows": [
                    "ddd-domain-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "id": "ddd-structure-section",
                "heading": "Entityと両系統のValue Object",
                "coreRefs": {
                  "steps": [
                    "ddd-structure"
                  ],
                  "claims": [
                    "ddd-structure-claim-1",
                    "ddd-structure-claim-2",
                    "ddd-structure-claim-3"
                  ],
                  "nodes": [
                    "ddd-structure-node-1",
                    "ddd-structure-node-2"
                  ],
                  "relations": [
                    "ddd-structure-relation-1"
                  ],
                  "flows": [
                    "ddd-structure-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-structure-paragraph-1",
                    "kind": "paragraph",
                    "text": "注文は識別子を保って状態が変わるEntityとして扱い、金額や数量は値の意味を持つValueとして扱います。属性の型、任意性、関係、値の制約を明示することで、注文番号と顧客番号の取り違えや、許されない数量を接続先へ渡すことを抑えます。",
                    "coreRefs": {
                      "steps": [
                        "ddd-structure"
                      ],
                      "claims": [
                        "ddd-structure-claim-1"
                      ],
                      "nodes": [
                        "ddd-structure-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-structure-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-structure-paragraph-2",
                    "kind": "paragraph",
                    "text": "Value Objectの意味と制約は、更新系のOperation入力やAggregateの状態と、参照系のQuery結果やView値の両方で利用します。例えば金額は、注文更新の計算にも注文一覧の参照値にも登場します。CMLのValue・Datatypeと型付き接点は、この意味を両経路へ渡す対応先です。保存形式の変換や表示整形はそれぞれ別の責務として扱います。",
                    "coreRefs": {
                      "steps": [
                        "ddd-structure"
                      ],
                      "claims": [
                        "ddd-structure-claim-2"
                      ],
                      "nodes": [
                        "ddd-structure-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-structure-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-structure-paragraph-3",
                    "kind": "paragraph",
                    "text": "業務の意味を型と制約へ表す考え方は、関数型プログラミングによるモデリングにもつながります。Domain Modeling Made Functionalは、この型による表現の参照先です。本技術ガイドでは、入力・結果・保存で同じ意味を共有するための技術として扱います。",
                    "coreRefs": {
                      "steps": [
                        "ddd-structure"
                      ],
                      "claims": [
                        "ddd-structure-claim-3"
                      ],
                      "nodes": [
                        "ddd-structure-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-structure-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "ddd-aggregate-section",
                "heading": "Aggregateと更新の整合性境界",
                "coreRefs": {
                  "steps": [
                    "ddd-aggregate"
                  ],
                  "claims": [
                    "ddd-aggregate-claim-1",
                    "ddd-aggregate-claim-2"
                  ],
                  "nodes": [
                    "ddd-aggregate-node-1",
                    "ddd-aggregate-node-2",
                    "ddd-aggregate-node-3"
                  ],
                  "relations": [
                    "ddd-aggregate-relation-1",
                    "ddd-aggregate-relation-2"
                  ],
                  "flows": [
                    "ddd-aggregate-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "ddd-aggregate-paragraph-1",
                    "kind": "paragraph",
                    "text": "注文と明細を一つのAggregateとするなら、明細の追加や注文確定はAggregate Rootの操作として表します。外部から項目を直接書き換えるのではなく、その操作で現在状態と業務条件を確認します。数量が正であることなどの値の制約と、確定する注文に明細があることなどの対象全体の規則を組み合わせます。",
                    "coreRefs": {
                      "steps": [
                        "ddd-aggregate"
                      ],
                      "claims": [
                        "ddd-aggregate-claim-1"
                      ],
                      "nodes": [
                        "ddd-aggregate-node-1"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-aggregate-flow"
                      ]
                    }
                  },
                  {
                    "id": "ddd-aggregate-paragraph-2",
                    "kind": "paragraph",
                    "text": "CNCFではEntityの永続状態を正本とし、Aggregateを更新側の投影として扱います。Aggregateの生成操作と既存対象へのCommandを区別し、不変条件を対応する検査・計算・Commandの実装へ結び付けます。ここで妥当な更新候補を作り、後述するUoWと保存先の条件検査によって実際の状態へ確定します。",
                    "coreRefs": {
                      "steps": [
                        "ddd-aggregate"
                      ],
                      "claims": [
                        "ddd-aggregate-claim-2"
                      ],
                      "nodes": [
                        "ddd-aggregate-node-2"
                      ],
                      "relations": [],
                      "flows": [
                        "ddd-aggregate-flow"
                      ]
                    }
                  },
                  {
