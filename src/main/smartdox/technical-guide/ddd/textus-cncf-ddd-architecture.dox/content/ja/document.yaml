      },
      {
        "nodeRef": "ddd-ai-node-1",
        "text": "機械的生成と意味の補完を分ける"
      },
      {
        "nodeRef": "ddd-ai-node-2",
        "text": "モデルと実行の境界で変更を制約する"
      },
      {
        "nodeRef": "ddd-verification-node-1",
        "text": "検証では、定義済みユースケースとモデルの対応、生成された型や部品契約、実行結果の三つを突き合わせます。textus-cbd-supportのモデルレビュー、コンパイルやcar lint、実行仕様を組み合わせ、規則が成立する例、拒否すべき例、競合や途中失敗後の状態を確認します。"
      },
      {
        "nodeRef": "ddd-verification-node-2",
        "text": "たとえば注文確定の条件を変更した場合は、Aggregateと状態機械の条件、対応するOperation、検証例を更新します。参照や表示へ影響するならView・Displayも確認します。生成コードだけを変更せず、元の定義と必要な補完処理へ戻すことで、業務の意味と動作の対応を保ちます。"
      },
