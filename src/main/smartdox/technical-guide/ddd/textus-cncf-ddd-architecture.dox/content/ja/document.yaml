              {
                "id": "ddd-vocabulary-differences",
                "kind": "paragraph",
                "text": "確認できる違いには、用語の定義だけでなく整理の範囲があります。Eはモデルの基本要素と後半の戦略的設計、Vは基本要素の個別章とアーキテクチャ・連携、Kは戦略的／戦術的設計とアーキテクチャの選択を明示して構成しています。K第6章の公開本文は、戦術的パターン群をDomain Modelの構成要素として説明する立場を示しています。V第10章の公開本文はAggregateを不変条件とトランザクションの整合性境界として具体化します。これらは説明範囲・強調点の違いとして扱い、確認していない定義の対立は断定しません。",
