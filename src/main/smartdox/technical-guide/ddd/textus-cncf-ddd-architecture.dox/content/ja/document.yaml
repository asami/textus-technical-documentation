                    "id": "ddd-semantics-paragraph-1",
                    "kind": "paragraph",
                    "text": "開発者は、業務の型と制約、公開操作、状態と遷移、Workflowの進行、ViewとDisplayの対応をモデルに記述します。Cozyは、Entity・Valueなどを型付きの接点へ、状態機械・Workflow・表示などを対応する実行定義や接続コードへ具体化します。Textus/CNCFは登録された定義と処理を利用し、呼出し、遷移、投影、更新確定などを動作させます。",
