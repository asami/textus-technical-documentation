                    "sections": []
                  },
                  {
                    "id": "ddd-uow-section",
                    "heading": "Aggregate・Unit of Workと更新確定",
                    "coreRefs": {
                      "steps": [
                        "ddd-uow"
                      ],
                      "claims": [
                        "ddd-uow-claim-1",
                        "ddd-uow-claim-2"
                      ],
                      "nodes": [
                        "ddd-uow-node-1",
