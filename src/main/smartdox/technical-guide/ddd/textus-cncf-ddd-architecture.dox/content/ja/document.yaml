                "id": "ddd-execution-paragraph-1",
                "kind": "paragraph",
                "text": "DDDの概念と、CML・Cozy・CNCFの接点を、型、実行定義、部品契約として対応付けます。更新系と参照系のモデルをそれぞれ具体化し、共通の識別や値の意味で接続します。モデルの意味、生成・登録、実行時の責務を区別することで、概念がどの仕組みを通して動作へつながるかを示します。",
