                      "flows": [
                        "ddd-uow-flow"
                      ]
                    },
                    "blocks": [
                      {
                        "id": "ddd-uow-paragraph-1",
                        "kind": "paragraph",
                        "text": "Aggregateは更新内容が業務上妥当かを判断し、UoWは更新のまとまりと確定・中止を管理します。DataStoreはそのトランザクションへ参加して保存先を操作します。競合検出を採用する場合は、期待するリビジョンや現在状態を保存先で原子的に検査し、条件が変わっていれば更新を拒否します。業務の規則と確定時の条件を組み合わせて整合性を守ります。",
                        "coreRefs": {
                          "steps": [
                            "ddd-uow"
                          ],
                          "claims": [
                            "ddd-uow-claim-1"
                          ],
                          "nodes": [
                            "ddd-uow-node-1"
