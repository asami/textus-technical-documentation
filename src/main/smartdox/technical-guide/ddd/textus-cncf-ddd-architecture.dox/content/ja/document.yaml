              {
                "id": "ddd-purpose-scope",
                "kind": "paragraph",
                "text": "一般的なモデリングの進め方や個々の案件の開発手順は別の資料で扱います。本文のハイライトは、どのDDD技術が、どの関心事に対応し、本システムのどこで使われるかを示します。設計上の対応と、採用版で利用できる生成・実行機能の範囲は区別します。",
