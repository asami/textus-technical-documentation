            "blocks": [
              {
                "id": "cml-practice-paragraph-1",
                "kind": "paragraph",
                "text": "最初は一つの目的を選び、必要な用語、入出力、EntityとValue、判断規則、Workflowと状態機械の対応をそろえます。参照と表示も同じ目的へ接続し、利用者の操作から結果が返るまでを確認します。図を増やすことより、モデル間で型・意味・状態の対応が保たれていることを確認します。",
                "coreRefs": {
                  "steps": [
                    "cml-practice"
