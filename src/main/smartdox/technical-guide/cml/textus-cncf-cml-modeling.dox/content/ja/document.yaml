                "id": "cml-knowledge-paragraph-1",
                "kind": "paragraph",
                "text": "BoKの用語と業務固有の判断をCMLの要素へ対応付けることで、型・関係・規則が何を意味するかを保持します。CozyのTerminologyメタデータは明示された用語参照、モデル要素、ラベル、出典と参照範囲を扱い、同名だけで同義と判断しません。設計の手順は「BoKからドメイン・モデルを設計する」で説明します。",
