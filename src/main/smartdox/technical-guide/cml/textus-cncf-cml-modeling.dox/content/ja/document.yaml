                  "flows": [
                    "cml-checks-flow"
                  ]
                }
              },
              {
                "id": "cml-checks-paragraph-2",
                "kind": "paragraph",
                "text": "変更時には、まず用語と要求のどこが変わったかを定め、影響する型、ルール、遷移、操作、Viewを更新します。生成物を作り直し、機械的検査とモデルレビューを行い、正常・境界・例外の実例で確かめます。実行可能なモデルにもレビューを適用し、処理系で確定的に検査できる範囲と、意味を検討する範囲を組み合わせます。",
