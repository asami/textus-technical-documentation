                "id": "cml-dynamic-paragraph-1",
                "kind": "paragraph",
                "text": "CMLによる動的モデリングでは、ユースケース、Workflow、状態機械を接続して扱います。ユースケースは目的と具体的な利用の流れから要求を記述する帰納的なモデルです。Workflowと状態機械は、実行時に従う進行や遷移の規則を定める演繹的なモデルです。この違いに応じて、実例による確認と規則に従う実行を使い分けます。",
