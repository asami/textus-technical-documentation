            "blocks": [
              {
                "id": "cml-conclusion-paragraph-1",
                "kind": "paragraph",
                "text": "CMLによるモデリングでは、用語、構造、規則、振る舞い、参照と表示を分担して記述し、それらの対応を保ちます。型と制約は値の扱いを、ルールは判断を、Workflowと状態機械は進行を定め、生成とTextus/CNCFの実行機構がそれを実装へ結び付けます。この構成は再利用と変更を支え、AIが補完する範囲を明確にするため、モデル駆動開発の仕組みがAI開発のハーネスとしても機能します。",
