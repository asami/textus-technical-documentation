                "blocks": [
                  {
                    "id": "cml-usecase-paragraph-1",
                    "kind": "paragraph",
                    "text": "ユースケースにはActor、目的、前提条件、期待する結果、正常・代替・例外の流れを記述します。その内容をWorkflow、Operation、Entity、状態機械へ対応付け、どのモデルが要求のどの部分を実現するかを確認します。ユースケース自体を直接実行するのではなく、実現するモデルとの整合性を検査するために使います。",
                    "coreRefs": {
