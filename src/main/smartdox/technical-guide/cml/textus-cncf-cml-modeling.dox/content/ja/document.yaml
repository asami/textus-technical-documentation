              {
                "id": "cml-literate-paragraph-1",
                "kind": "paragraph",
                "text": "CMLはSmartDoxを基盤に、見出し、属性表、メタデータ、説明文を組み合わせて記述します。EntityやOperationなどの構造、型・多重度・制約などの機械処理する情報、用語の意味や設計理由を説明する文章が共存します。構造を変更するときに、その定義を採用した理由も同じ文書で確認できます。",
