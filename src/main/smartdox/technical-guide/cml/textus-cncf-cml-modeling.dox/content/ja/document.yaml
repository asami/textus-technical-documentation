            "blocks": [
              {
                "id": "cml-static-paragraph-1",
                "kind": "paragraph",
                "text": "ドメイン・モデルは静的構造を中心に業務概念を定めます。Entityは同一性を追跡する対象、Valueは値として扱う構造、Datatypeは名前と制約を持つデータ型を表します。Aggregateでは関連する状態と更新の整合性を扱う範囲を定めます。この分担により、同じ文字列や数値でも意味が違う値を区別し、どの操作がどの状態を変更するかを整理できます。",
                "coreRefs": {
