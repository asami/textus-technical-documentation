              },
              {
                "id": "cml-literate-paragraph-2",
                "kind": "paragraph",
                "text": "処理系が解釈するのは、対応する文法で定義された構造とメタデータです。「空欄を認めない」と説明文に書くだけでは、必須属性の定義にはなりません。文章には意味と理由を、型・多重度・制約には検査可能な条件を記述します。BoKの用語集と対応付けるときも、名前が似ているだけで同じ概念とせず、どの用語とモデル要素を結び付けるかを明示します。",
