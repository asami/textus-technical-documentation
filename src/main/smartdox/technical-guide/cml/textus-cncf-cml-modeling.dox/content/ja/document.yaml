                "id": "cml-knowledge-paragraph-2",
                "kind": "paragraph",
                "text": "モデル定義と実行時のEntityは区別します。CNCFのInformationもCMLを正本として生成されるモデルであり、業務Entityから必要な情報を取り出す対応と実行時の接続は別に定めます。「Entityを知識として扱う」では、Information、RDF等の知識表現、検索・AI提供へ意味・出典・参照条件を引き継ぐ構成を説明します。",
