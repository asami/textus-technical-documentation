              },
              {
                "id": "cml-purpose-paragraph-2",
                "kind": "paragraph",
                "text": "CozyはCMLを解析し、型付きAPI、接続構造、実行定義へ具体化します。Textus/CNCFは実行可能な定義を解釈し、共通の実行機構を適用します。不足する業務固有の処理は、生成された契約に沿って補完します。モデルを記述することが、実装と検証の対象を直接定める作業になります。",
