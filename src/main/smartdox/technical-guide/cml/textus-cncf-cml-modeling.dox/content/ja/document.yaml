              {
                "id": "cml-practice-paragraph-2",
                "kind": "paragraph",
                "text": "複数のユースケースを扱う中で、共通する概念や規則をドメインへ整理し、各ユースケースを実現する進行はアプリケーション側へ置きます。ユースケースと実現モデルの対応は要求実現の関係です。一方、ドメインに近いモデルを実装・実行の表現へ具体化し、得られた知見をモデルへ戻すモデル・アップ・ダウンは、抽象度をまたぐ作業として区別します。",
