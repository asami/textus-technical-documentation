                "id": "cml-static-paragraph-2",
                "kind": "paragraph",
                "text": "属性には型、多重度、長さや値域などの制約を記述します。受理された制約は、生成される型の構築・読込み、Operation入力、保存との変換、フォームなどの接点へ引き継ぎます。画面だけの入力チェックにせず、同じ定義を業務側の境界にも適用するため、入口ごとの条件のずれを減らせます。",
