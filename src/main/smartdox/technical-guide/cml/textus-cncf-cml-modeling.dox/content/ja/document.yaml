            "blocks": [
              {
                "id": "cml-purpose-paragraph-1",
                "kind": "paragraph",
                "text": "CMLは、業務の概念・関係・規則・振る舞いを記述するためのモデル言語です。プログラミング言語や保存形式の詳細から離れ、ソフトウェアが扱う意味をモデルとして定めます。SimpleModelingでは、このモデルを開発と実行の基盤にすることで、業務上の定義をコード、画面、データベースへ個別に書き直す負担を減らします。",
                "coreRefs": {
                  "steps": [
                    "cml-purpose"
