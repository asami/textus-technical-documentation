            "kind": "paragraph",
            "text": "CMLは、業務の概念・規則・振る舞いを、開発と実行で利用するモデルとして記述する言語です。本書は、文芸モデルの書き方から静的構造、ユースケース、Workflow、状態機械、業務ルール、UIとの接続までを整理し、それらを組み合わせてTextus/CNCFで動作させる道筋を説明します。",
