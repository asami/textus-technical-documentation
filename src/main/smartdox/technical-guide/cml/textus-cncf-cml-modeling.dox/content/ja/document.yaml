            "blocks": [
              {
                "id": "cml-checks-paragraph-1",
                "kind": "paragraph",
                "text": "文法と参照の検査、型による検査、モデル間の意味のレビュー、実行による検証は、それぞれ違う誤りを扱います。例えば入力型の不一致は機械的に検出できても、承認条件が業務上適切かは要求と実例に照らして確認します。textus-cbd-supportによるレビューでは、ユースケースとOperation・Entity・Workflow・状態機械の対応を確認する材料としてモデルを使います。",
                "coreRefs": {
                  "steps": [
