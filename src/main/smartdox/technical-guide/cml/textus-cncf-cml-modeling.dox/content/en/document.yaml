                },
                "asset": "images/behavior-connections-en.png",
                "caption": "Example-based verification and rule-governed execution",
                "alt": "Example-based verification and rule-governed execution"
              }
            ],
            "sections": [
              {
                "id": "cml-usecase-section",
                "heading": "Mapping Use Cases to Operations and State",
                "coreRefs": {
                  "steps": [
                    "cml-usecase"
                  ],
                  "claims": [
                    "cml-usecase-claim-1",
                    "cml-usecase-claim-2"
                  ],
                  "nodes": [
                    "cml-usecase-node-1",
                    "cml-usecase-node-2"
                  ],
                  "relations": [
                    "cml-usecase-relation-1"
                  ],
                  "flows": [
                    "cml-usecase-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "cml-usecase-paragraph-1",
                    "kind": "paragraph",
                    "text": "A use case describes actors, goals, preconditions, expected outcomes and main, alternate and exceptional flows. Mapping it to Workflows, Operations, Entities and state machines identifies how each part of the requirement is realized. The use case itself is not directly executed; it supports consistency checks against the realizing models.",
                    "coreRefs": {
                      "steps": [
                        "cml-usecase"
                      ],
                      "claims": [
                        "cml-usecase-claim-1"
                      ],
                      "nodes": [
                        "cml-usecase-node-1",
                        "cml-usecase-node-2"
                      ],
                      "relations": [
                        "cml-usecase-relation-1"
                      ],
                      "flows": [
                        "cml-usecase-flow"
                      ]
                    }
                  },
                  {
                    "id": "cml-usecase-paragraph-2",
                    "kind": "paragraph",
                    "text": "For an approval requirement, the model connects the authorized role, request state, approval input and resulting state. Examples involving return for revision or insufficient authority expose conditions absent from the normal flow. Interaction diagrams and UML activity diagrams can support explanation, but do not by themselves replace executable CML definitions.",
                    "coreRefs": {
                      "steps": [
                        "cml-usecase"
                      ],
                      "claims": [
                        "cml-usecase-claim-2"
                      ],
                      "nodes": [
                        "cml-usecase-node-1",
                        "cml-usecase-node-2"
                      ],
                      "relations": [
                        "cml-usecase-relation-1"
                      ],
                      "flows": [
                        "cml-usecase-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              },
              {
                "id": "cml-workflow-section",
                "heading": "Defining Progression and Transitions with Workflows and State Machines",
                "coreRefs": {
                  "steps": [
                    "cml-workflow"
                  ],
                  "claims": [
                    "cml-workflow-claim-1",
                    "cml-workflow-claim-2"
                  ],
                  "nodes": [
                    "cml-workflow-node-1",
                    "cml-workflow-node-2"
                  ],
                  "relations": [
                    "cml-workflow-relation-1"
                  ],
                  "flows": [
                    "cml-workflow-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "cml-workflow-paragraph-1",
                    "kind": "paragraph",
                    "text": "Application models center on Workflows derived from use cases, coordinating domain operations to achieve goals. State machines make states, events and transition conditions explicit. Instead of distributing those conditions among procedures, the model exposes what is permitted in each state.",
                    "coreRefs": {
                      "steps": [
                        "cml-workflow"
                      ],
                      "claims": [
                        "cml-workflow-claim-1"
                      ],
                      "nodes": [
                        "cml-workflow-node-1",
                        "cml-workflow-node-2"
                      ],
                      "relations": [
                        "cml-workflow-relation-1"
                      ],
                      "flows": [
                        "cml-workflow-flow"
                      ]
                    }
                  },
                  {
                    "id": "cml-workflow-paragraph-2",
                    "kind": "paragraph",
                    "text": "The current CML WORKFLOW contract normalizes structure into a COMPOSITE-STATEMACHINE and declares required capabilities through REQUIRED-OPERATION. Logical operations in CML are separate from runtime provider bindings. Generated definitions and their bindings enable Textus/CNCF to execute the modeled progression. External connectivity and safe re-execution require their own corresponding contracts rather than following from a Workflow name alone.",
                    "coreRefs": {
                      "steps": [
                        "cml-workflow"
                      ],
                      "claims": [
                        "cml-workflow-claim-2"
                      ],
                      "nodes": [
                        "cml-workflow-node-1",
                        "cml-workflow-node-2"
                      ],
                      "relations": [
                        "cml-workflow-relation-1"
                      ],
                      "flows": [
                        "cml-workflow-flow"
                      ]
                    }
                  }
                ],
                "sections": []
              }
            ]
          },
          {
            "id": "cml-rules-section",
            "heading": "Modeling Business Rules",
            "coreRefs": {
              "steps": [
                "cml-rules"
              ],
              "claims": [
                "cml-rules-claim-1"
              ],
              "nodes": [
                "cml-rules-node-1",
                "cml-rules-node-2"
              ],
              "relations": [
                "cml-rules-relation-1"
              ],
              "flows": [
                "cml-rules-flow"
              ]
            },
            "blocks": [
              {
                "id": "cml-rules-paragraph-1",
                "kind": "paragraph",
                "text": "Business rules express conditions, calculations, classification and decision policies. Modeling them as Domain Rules clarifies their meaning and owning domain, with explicit input values or facts, conditions and results. Referencing these rules instead of copying decision logic into screens and Workflows concentrates changes around their definitions.",
                "coreRefs": {
                  "steps": [
                    "cml-rules"
                  ],
