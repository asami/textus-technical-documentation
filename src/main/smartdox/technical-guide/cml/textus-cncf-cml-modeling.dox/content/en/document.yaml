            "kind": "paragraph",
            "text": "CML describes business concepts, rules and behavior as models used in development and execution. This guide connects literate model authoring with static structure, use cases, Workflows, state machines, business rules and UI, explaining how these models combine into applications running on Textus/CNCF.",
