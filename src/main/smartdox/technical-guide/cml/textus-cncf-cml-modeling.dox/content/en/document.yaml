              ],
              "relations": [
                "cml-contracts-relation-1"
              ],
              "flows": [
                "cml-contracts-flow"
              ]
            },
            "blocks": [
              {
                "id": "cml-contracts-paragraph-1",
                "kind": "paragraph",
                "text": "Components own responsibilities and expose capabilities through Services and Operations. An Operation declares its Command or Query kind, input Value and output Result. Reusable inputs use top-level VALUE definitions with an explicit input-kind; one-use inputs can be defined locally. Referenced and locally declared schemas are not combined in the same input direction.",
                "coreRefs": {
                  "steps": [
                    "cml-contracts"
                  ],
                  "claims": [
                    "cml-contracts-claim-1"
                  ],
                  "nodes": [
                    "cml-contracts-node-1",
                    "cml-contracts-node-2"
                  ],
                  "relations": [
                    "cml-contracts-relation-1"
                  ],
                  "flows": [
                    "cml-contracts-flow"
                  ]
                }
              },
              {
                "id": "cml-contracts-paragraph-2",
                "kind": "paragraph",
                "text": "The following fragment defines a local Query input Value and a structured Result. Cozy normalizes these definitions into typed interfaces. Explicit types clarify how existing operations can be used, supporting reuse and glue code. AI can supplement specific behavior within these contracts, limiting the need to redesign surrounding structure.",
                "coreRefs": {
                  "steps": [
                    "cml-contracts"
                  ],
                  "claims": [
                    "cml-contracts-claim-2"
                  ],
                  "nodes": [
                    "cml-contracts-node-1",
                    "cml-contracts-node-2"
                  ],
                  "relations": [
                    "cml-contracts-relation-1"
                  ],
                  "flows": [
                    "cml-contracts-flow"
                  ]
                }
              },
              {
                "id": "operation-example",
                "kind": "example",
                "coreRefs": {
                  "steps": [
                    "cml-contracts"
                  ],
                  "claims": [
                    "cml-contracts-claim-1",
                    "cml-contracts-claim-2"
                  ],
                  "nodes": [
                    "cml-contracts-node-1",
                    "cml-contracts-node-2"
                  ],
                  "relations": [
                    "cml-contracts-relation-1"
                  ],
                  "flows": [
                    "cml-contracts-flow"
                  ]
                },
                "title": "Operation fragment",
                "text": "# SERVICE\n\n## Catalog\n\n### OPERATION\n\n#### searchEntries\n\n##### TYPE\n\nQUERY\n\n##### INPUT\n\n###### VALUE\n\nCatalogQuery\n\n###### ATTRIBUTE\n\n| name | type | multiplicity | min-length | max-length |\n|------|------|--------------|------------|------------|\n| term | string | 1 | 2 | 40 |\n\n##### OUTPUT\n\n###### VALUE\n\nCatalogResult\n\n###### ATTRIBUTE\n\n| name | type | multiplicity |\n|------|------|--------------|\n| titles | string | * |\n"
              }
            ],
            "sections": []
          },
          {
            "id": "cml-ui-section",
            "heading": "Separating Reading and Presentation with View and Display",
            "coreRefs": {
              "steps": [
                "cml-ui"
              ],
              "claims": [
                "cml-ui-claim-1",
                "cml-ui-claim-2"
              ],
              "nodes": [
                "cml-ui-node-1",
                "cml-ui-node-2"
              ],
              "relations": [
                "cml-ui-relation-1"
              ],
              "flows": [
                "cml-ui-flow"
              ]
            },
            "blocks": [
              {
                "id": "cml-ui-paragraph-1",
                "kind": "paragraph",
                "text": "A View expresses read results for a purpose; the outer Display defines presentation fields and offered actions. Screens use meaningful results rather than adopting Entity storage shapes as their contracts. Updates return through public Operations, keeping presentation concerns from redefining business rules.",
                "coreRefs": {
                  "steps": [
                    "cml-ui"
                  ],
                  "claims": [
                    "cml-ui-claim-1"
                  ],
                  "nodes": [
                    "cml-ui-node-1",
                    "cml-ui-node-2"
                  ],
                  "relations": [
                    "cml-ui-relation-1"
                  ],
                  "flows": [
                    "cml-ui-flow"
                  ]
                }
              },
              {
                "id": "cml-ui-paragraph-2",
                "kind": "paragraph",
                "text": "This separation supports Textus Web UI and smartphone, tablet, Web and desktop applications built on the Flutter application framework integrated with Textus. Independently developed UIs connected through REST or gRPC can also use model-derived types and operation contracts. UI-specific realization remains with the presentation layer while business meaning and rules are shared.",
                "coreRefs": {
                  "steps": [
                    "cml-ui"
                  ],
                  "claims": [
                    "cml-ui-claim-2"
                  ],
                  "nodes": [
                    "cml-ui-node-1",
                    "cml-ui-node-2"
                  ],
                  "relations": [
                    "cml-ui-relation-1"
                  ],
                  "flows": [
                    "cml-ui-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "cml-execution-section",
            "heading": "Carrying Models into Generation, Direct Execution and Extensions",
            "coreRefs": {
              "steps": [
                "cml-execution"
              ],
              "claims": [
                "cml-execution-claim-1",
                "cml-execution-claim-2"
              ],
              "nodes": [
                "cml-execution-node-1",
                "cml-execution-node-2"
              ],
              "relations": [
                "cml-execution-relation-1"
              ],
              "flows": [
                "cml-execution-flow"
              ]
            },
            "blocks": [
              {
                "id": "cml-execution-paragraph-1",
                "kind": "paragraph",
                "text": "After parsing and normalization, CML structure and metadata become Scala types and APIs, component connection structures, and executable Workflow and state-machine definitions. Direct model execution means that the platform follows these definitions rather than requiring their rules to be reimplemented as application procedures. Generation, registration and provider binding are part of this realization.",
                "coreRefs": {
                  "steps": [
                    "cml-execution"
                  ],
                  "claims": [
                    "cml-execution-claim-1"
                  ],
                  "nodes": [
                    "cml-execution-node-1",
                    "cml-execution-node-2"
                  ],
                  "relations": [
                    "cml-execution-relation-1"
                  ],
                  "flows": [
                    "cml-execution-flow"
                  ]
                }
              },
              {
                "id": "cml-execution-paragraph-2",
                "kind": "paragraph",
                "text": "Calculations or external integrations beyond the model are implemented within typed APIs, with Consequence representing results and mechanisms such as UoW coordinating effects. Models define the intended behavior; the platform manages authorization, commit and failure handling. Provider or deployment changes retain their relationship to the business contracts.",
                "coreRefs": {
                  "steps": [
                    "cml-execution"
                  ],
                  "claims": [
                    "cml-execution-claim-2"
                  ],
                  "nodes": [
                    "cml-execution-node-1",
                    "cml-execution-node-2"
                  ],
                  "relations": [
                    "cml-execution-relation-1"
                  ],
                  "flows": [
                    "cml-execution-flow"
                  ]
                }
              },
