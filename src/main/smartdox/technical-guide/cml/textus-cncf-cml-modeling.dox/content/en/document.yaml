              ],
              "relations": [
                "cml-practice-relation-1"
              ],
              "flows": [
                "cml-practice-flow"
              ]
            },
            "blocks": [
              {
                "id": "cml-practice-paragraph-1",
                "kind": "paragraph",
                "text": "Begin with one goal and connect the necessary terminology, inputs and outputs, Entities and Values, decision rules, Workflow and state machines. Add reading and presentation for the same goal and verify the path from user action to result. The focus is consistency of types, meaning and state across models rather than increasing the number of diagrams.",
                "coreRefs": {
                  "steps": [
                    "cml-practice"
                  ],
                  "claims": [
                    "cml-practice-claim-1"
                  ],
                  "nodes": [
                    "cml-practice-node-1",
                    "cml-practice-node-2"
                  ],
                  "relations": [
                    "cml-practice-relation-1"
                  ],
                  "flows": [
                    "cml-practice-flow"
                  ]
                }
              },
              {
                "id": "cml-practice-paragraph-2",
                "kind": "paragraph",
                "text": "As more use cases are added, shared concepts and rules are organized in the domain, while goal-specific progression remains in the application. Use-case realization links requirements to implementing models. Model up/down is a different activity: moving between domain-level descriptions and implementation or execution representations, and feeding discovered insights back into the model.",
                "coreRefs": {
                  "steps": [
                    "cml-practice"
                  ],
                  "claims": [
