                  ],
                  "relations": [
                    "cml-practice-relation-1"
                  ],
                  "flows": [
                    "cml-practice-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "cml-conclusion-section",
            "heading": "Conclusion",
            "coreRefs": {
              "steps": [
                "cml-conclusion"
              ],
              "claims": [
                "cml-conclusion-claim-1"
