          {
            "id": "cml-dynamic-section",
            "heading": "Connecting Requirements to Executable Behavior",
            "coreRefs": {
              "steps": [
                "cml-dynamic"
              ],
              "claims": [
                "cml-dynamic-claim-1"
              ],
              "nodes": [
                "cml-dynamic-node-1",
                "cml-dynamic-node-2"
              ],
              "relations": [
                "cml-dynamic-relation-1"
              ],
              "flows": [
                "cml-dynamic-flow"
              ]
            },
            "blocks": [
              {
                "id": "cml-dynamic-paragraph-1",
                "kind": "paragraph",
                "text": "Dynamic modeling with CML connects use cases, Workflows and state machines. Use cases are inductive models describing requirements through goals and concrete interaction flows. Workflows and state machines are deductive models defining progression and transition rules for execution. Their different roles support example-based verification and rule-governed execution.",
                "coreRefs": {
                  "steps": [
                    "cml-dynamic"
                  ],
                  "claims": [
                    "cml-dynamic-claim-1"
                  ],
                  "nodes": [
                    "cml-dynamic-node-1",
                    "cml-dynamic-node-2"
                  ],
                  "relations": [
                    "cml-dynamic-relation-1"
                  ],
                  "flows": [
                    "cml-dynamic-flow"
                  ]
                }
              },
              {
                "id": "behavior-connections",
                "kind": "figure",
                "coreRefs": {
