          {
            "id": "cml-contracts-section",
            "heading": "Connecting Models and Implementations through Operation Contracts",
            "coreRefs": {
              "steps": [
                "cml-contracts"
              ],
              "claims": [
                "cml-contracts-claim-1",
                "cml-contracts-claim-2"
              ],
              "nodes": [
