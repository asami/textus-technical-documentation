          {
            "id": "cml-checks-section",
            "heading": "Changing Models through Cross-model Verification",
            "coreRefs": {
              "steps": [
                "cml-checks"
              ],
              "claims": [
                "cml-checks-claim-1",
                "cml-checks-claim-2"
