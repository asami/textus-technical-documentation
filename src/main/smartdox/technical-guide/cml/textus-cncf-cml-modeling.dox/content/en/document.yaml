        "sections": [
          {
            "id": "cml-purpose-section",
            "heading": "Connecting Business Meaning to Development and Execution",
            "coreRefs": {
              "steps": [
                "cml-purpose"
              ],
              "claims": [
                "cml-purpose-claim-1",
                "cml-purpose-claim-2"
              ],
              "nodes": [
                "cml-purpose-node-1",
                "cml-purpose-node-2"
              ],
              "relations": [
                "cml-purpose-relation-1"
              ],
              "flows": [
                "cml-purpose-flow"
              ]
            },
            "blocks": [
              {
                "id": "cml-purpose-paragraph-1",
                "kind": "paragraph",
                "text": "CML is a model language for business concepts, relationships, rules and behavior. It defines software meaning apart from programming-language and storage details. SimpleModeling uses these models as a foundation for development and execution, reducing repeated translations of business definitions into code, screens and databases.",
                "coreRefs": {
                  "steps": [
                    "cml-purpose"
                  ],
                  "claims": [
                    "cml-purpose-claim-1"
                  ],
                  "nodes": [
                    "cml-purpose-node-1",
                    "cml-purpose-node-2"
                  ],
                  "relations": [
                    "cml-purpose-relation-1"
                  ],
                  "flows": [
                    "cml-purpose-flow"
                  ]
                }
              },
              {
                "id": "cml-purpose-paragraph-2",
                "kind": "paragraph",
                "text": "Cozy analyzes CML and projects it into typed APIs, connection structures and executable definitions. Textus/CNCF interprets supported executable definitions and applies shared runtime mechanisms. Business-specific behavior is added within the generated contracts. Authoring models therefore directly establishes what will be implemented and verified.",
                "coreRefs": {
                  "steps": [
                    "cml-purpose"
                  ],
                  "claims": [
                    "cml-purpose-claim-2"
                  ],
                  "nodes": [
                    "cml-purpose-node-1",
