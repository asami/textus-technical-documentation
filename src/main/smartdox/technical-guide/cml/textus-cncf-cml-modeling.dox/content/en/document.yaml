                  "relations": [
                    "cml-rule-kinds-relation-1"
                  ],
                  "flows": [
                    "cml-rule-kinds-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "cml-rule-kinds-paragraph-1",
                    "kind": "paragraph",
                    "text": "Length and requiredness belong to Datatype or attribute constraints; prices or decisions derived from multiple facts belong to business rules; conditions for a transition belong to guards. A Workflow orders their use. This separates value validity, domain decisions and process progression so they can be checked independently and then composed.",
                    "coreRefs": {
                      "steps": [
                        "cml-rule-kinds"
                      ],
                      "claims": [
                        "cml-rule-kinds-claim-1"
                      ],
                      "nodes": [
                        "cml-rule-kinds-node-1",
                        "cml-rule-kinds-node-2"
                      ],
                      "relations": [
                        "cml-rule-kinds-relation-1"
                      ],
                      "flows": [
                        "cml-rule-kinds-flow"
                      ]
                    }
                  },
                  {
                    "id": "cml-rule-kinds-paragraph-2",
                    "kind": "paragraph",
                    "text": "For example, a decision table can compute delivery charges from destination category and purchase amount, and an order-confirmation Workflow can consume the result. Selection among overlapping conditions and the handling of no matching row must be defined. A state machine can require the necessary decisions before confirmation without duplicating the delivery-price calculation.",
                    "coreRefs": {
                      "steps": [
                        "cml-rule-kinds"
                      ],
                      "claims": [
