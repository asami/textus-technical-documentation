          {
            "id": "cml-literate-section",
            "heading": "Writing Structure, Metadata and Narrative in One Literate Model",
            "coreRefs": {
              "steps": [
                "cml-literate"
              ],
              "claims": [
                "cml-literate-claim-1",
                "cml-literate-claim-2"
              ],
              "nodes": [
                "cml-literate-node-1",
                "cml-literate-node-2"
              ],
              "relations": [
                "cml-literate-relation-1"
              ],
              "flows": [
                "cml-literate-flow"
              ]
            },
            "blocks": [
              {
                "id": "cml-literate-paragraph-1",
                "kind": "paragraph",
                "text": "CML uses SmartDox to combine headings, attribute tables, metadata and prose. Structures such as Entity and Operation coexist with machine-readable types, multiplicities and constraints, and with explanations of terminology and design rationale. A structural change can therefore be reviewed together with the reason for the definition.",
                "coreRefs": {
                  "steps": [
                    "cml-literate"
                  ],
                  "claims": [
                    "cml-literate-claim-1"
                  ],
                  "nodes": [
                    "cml-literate-node-1",
                    "cml-literate-node-2"
                  ],
                  "relations": [
                    "cml-literate-relation-1"
                  ],
                  "flows": [
                    "cml-literate-flow"
                  ]
                }
              },
              {
                "id": "cml-literate-paragraph-2",
                "kind": "paragraph",
                "text": "The processor interprets structure and metadata defined by supported grammar. A sentence saying that a field is required does not itself define required multiplicity. Prose explains meaning and rationale; types, multiplicities and constraints express checkable conditions. Links to BoK terminology should likewise identify the intended terms and model elements rather than treating similar names as identical concepts.",
                "coreRefs": {
                  "steps": [
                    "cml-literate"
                  ],
                  "claims": [
                    "cml-literate-claim-2"
                  ],
                  "nodes": [
                    "cml-literate-node-1",
                    "cml-literate-node-2"
                  ],
                  "relations": [
                    "cml-literate-relation-1"
                  ],
                  "flows": [
                    "cml-literate-flow"
                  ]
                }
              },
