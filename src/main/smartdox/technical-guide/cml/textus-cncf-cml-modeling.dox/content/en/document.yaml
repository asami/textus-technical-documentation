            "sections": [
              {
                "id": "cml-types-section",
                "heading": "Choosing Datatypes, Powertypes and State Machines",
                "coreRefs": {
                  "steps": [
                    "cml-types"
                  ],
                  "claims": [
                    "cml-types-claim-1",
                    "cml-types-claim-2"
                  ],
                  "nodes": [
                    "cml-types-node-1",
                    "cml-types-node-2"
                  ],
                  "relations": [
                    "cml-types-relation-1"
                  ],
                  "flows": [
                    "cml-types-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "cml-types-paragraph-1",
                    "kind": "paragraph",
                    "text": "An identifier can be represented by a named Datatype with length and format constraints rather than only by its string representation. Powertypes describe closed vocabularies; state machines describe lifecycles when the model owns their transitions. A list of codes extended by an external system should not be closed merely because its current values are known.",
                    "coreRefs": {
                      "steps": [
                        "cml-types"
                      ],
                      "claims": [
                        "cml-types-claim-1"
                      ],
                      "nodes": [
                        "cml-types-node-1",
                        "cml-types-node-2"
                      ],
                      "relations": [
                        "cml-types-relation-1"
                      ],
                      "flows": [
                        "cml-types-flow"
                      ]
                    }
                  },
                  {
                    "id": "cml-types-paragraph-2",
                    "kind": "paragraph",
                    "text": "The following fragment is the LoginName example from Cozy’s accepted Datatype grammar. min-length and max-length specify text length and differ from numeric min and max. Preserving the model name as a type combines construction-time checking with protection against mixing distinct types in implementation.",
                    "coreRefs": {
                      "steps": [
                        "cml-types"
                      ],
                      "claims": [
                        "cml-types-claim-2"
                      ],
                      "nodes": [
                        "cml-types-node-1",
                        "cml-types-node-2"
                      ],
                      "relations": [
                        "cml-types-relation-1"
                      ],
                      "flows": [
                        "cml-types-flow"
                      ]
                    }
                  },
                  {
                    "id": "datatype-example",
                    "kind": "example",
                    "coreRefs": {
                      "steps": [
                        "cml-types"
                      ],
                      "claims": [
                        "cml-types-claim-1",
                        "cml-types-claim-2"
                      ],
                      "nodes": [
                        "cml-types-node-1",
                        "cml-types-node-2"
                      ],
                      "relations": [
                        "cml-types-relation-1"
                      ],
                      "flows": [
                        "cml-types-flow"
                      ]
                    },
                    "title": "Datatype fragment",
                    "text": "# DATATYPE\n\n## LoginName\n\n### ATTRIBUTE\n\n| name | type | multiplicity | min-length | max-length | pattern |\n|------|------|--------------|------------|------------|---------|\n| value | string | 1 | 5 | 12 | ^user.+$ |\n"
                  }
                ],
                "sections": []
              }
            ]
