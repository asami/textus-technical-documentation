              {
                "id": "cml-rule-execution-section",
                "heading": "Separating Rule Evaluation from Action Execution",
                "coreRefs": {
                  "steps": [
                    "cml-rule-execution"
                  ],
                  "claims": [
                    "cml-rule-execution-claim-1",
                    "cml-rule-execution-claim-2",
                    "cml-rule-execution-claim-3"
                  ],
                  "nodes": [
                    "cml-rule-execution-node-1",
                    "cml-rule-execution-node-2"
                  ],
                  "relations": [
                    "cml-rule-execution-relation-1"
                  ],
                  "flows": [
                    "cml-rule-execution-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "cml-rule-execution-paragraph-1",
                    "kind": "paragraph",
                    "text": "The CNCF Rule Engine foundation provides models for RuleSets, Facts, WorkingMemory, decision tables, calculations, constraints and derivations. RuleEngine and InferenceEngine are provider-neutral interfaces. Evaluation accepts immutable input and returns decisions, derived facts, explanations and, where applicable, action plans. It does not directly change persistent Entity state.",
                    "coreRefs": {
                      "steps": [
                        "cml-rule-execution"
                      ],
                      "claims": [
                        "cml-rule-execution-claim-1"
                      ],
                      "nodes": [
                        "cml-rule-execution-node-1",
                        "cml-rule-execution-node-2"
                      ],
                      "relations": [
                        "cml-rule-execution-relation-1"
                      ],
                      "flows": [
                        "cml-rule-execution-flow"
                      ]
                    }
                  },
                  {
                    "id": "cml-rule-execution-paragraph-2",
                    "kind": "paragraph",
                    "text": "Plans targeting Operations, Events or Jobs run through explicit admission and CNCF’s standard execution paths. Rules therefore retain authorization, UoW, Event and Job management. Rule models govern decision grounds, while shared paths govern conditions for applying changes; their combination controls the passage from decision to execution.",
                    "coreRefs": {
                      "steps": [
                        "cml-rule-execution"
                      ],
                      "claims": [
                        "cml-rule-execution-claim-2"
                      ],
                      "nodes": [
                        "cml-rule-execution-node-1",
                        "cml-rule-execution-node-2"
                      ],
                      "relations": [
                        "cml-rule-execution-relation-1"
                      ],
                      "flows": [
                        "cml-rule-execution-flow"
                      ]
                    }
                  },
                  {
                    "id": "cml-rule-execution-paragraph-3",
                    "kind": "paragraph",
                    "text": "The general CML RULE DSL and projection from Domain Rule to CNCF Rule Model are treated here as extension directions. Accepted Datatype constraints, guards and Operation contracts are distinguished from the existing Rule Engine foundation; this guide does not assume automatic generation and execution for every business rule. The grammar, generation route and execution provider must be checked for the selected versions.",
                    "coreRefs": {
                      "steps": [
                        "cml-rule-execution"
                      ],
                      "claims": [
                        "cml-rule-execution-claim-3"
                      ],
                      "nodes": [
                        "cml-rule-execution-node-1",
                        "cml-rule-execution-node-2"
                      ],
                      "relations": [
                        "cml-rule-execution-relation-1"
                      ],
                      "flows": [
                        "cml-rule-execution-flow"
                      ]
