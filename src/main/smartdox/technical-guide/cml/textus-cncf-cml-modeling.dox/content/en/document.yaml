              "flows": [
                "cml-checks-flow"
              ]
            },
            "blocks": [
              {
                "id": "cml-checks-paragraph-1",
                "kind": "paragraph",
                "text": "Grammar and reference checks, type checking, semantic model review and execution tests address different errors. A type mismatch can be detected mechanically, whereas the suitability of approval conditions requires requirements and examples. Reviews through textus-cbd-support use models to examine correspondence among use cases, Operations, Entities, Workflows and state machines.",
                "coreRefs": {
                  "steps": [
                    "cml-checks"
                  ],
                  "claims": [
                    "cml-checks-claim-1"
                  ],
                  "nodes": [
                    "cml-checks-node-1",
                    "cml-checks-node-2"
                  ],
                  "relations": [
                    "cml-checks-relation-1"
                  ],
                  "flows": [
                    "cml-checks-flow"
                  ]
                }
              },
              {
                "id": "cml-checks-paragraph-2",
                "kind": "paragraph",
                "text": "A change begins by identifying the affected terminology and requirements, then updating relevant types, rules, transitions, operations and Views. Regenerated artifacts undergo mechanical checks and model review, followed by normal, boundary and exceptional examples. Executable models also require review: deterministic processor checks and semantic examination serve complementary purposes.",
                "coreRefs": {
