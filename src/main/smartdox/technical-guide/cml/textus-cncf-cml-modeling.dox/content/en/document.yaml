          {
            "id": "cml-practice-section",
            "heading": "Establishing Model Connections with a Small Use Case",
            "coreRefs": {
              "steps": [
                "cml-practice"
              ],
              "claims": [
                "cml-practice-claim-1",
                "cml-practice-claim-2"
              ],
              "nodes": [
                "cml-practice-node-1",
