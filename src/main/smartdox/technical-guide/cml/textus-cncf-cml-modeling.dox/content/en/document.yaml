          {
            "id": "cml-knowledge-section",
            "heading": "Connecting Term References and Runtime Knowledge",
            "coreRefs": {
              "steps": [
                "cml-knowledge"
              ],
              "claims": [
                "cml-knowledge-claim-1",
                "cml-knowledge-claim-2"
              ],
              "nodes": [
                "cml-knowledge-node-1",
                "cml-knowledge-node-2"
              ],
              "relations": [
                "cml-knowledge-relation-1"
              ],
              "flows": [
                "cml-knowledge-flow"
              ]
            },
            "blocks": [
              {
                "id": "cml-knowledge-paragraph-1",
                "kind": "paragraph",
                "text": "Mapping BoK terms and project decisions to CML elements preserves the meaning of types, relationships and rules. Cozy terminology metadata handles declared term references, model elements, labels, attribution and scope; matching names do not establish synonymy. Designing Domain Models from a BoK explains the design procedure.",
                "coreRefs": {
                  "steps": [
                    "cml-knowledge"
                  ],
                  "claims": [
                    "cml-knowledge-claim-1"
                  ],
                  "nodes": [
                    "cml-knowledge-node-1",
                    "cml-knowledge-node-2"
                  ],
                  "relations": [
                    "cml-knowledge-relation-1"
                  ],
                  "flows": [
                    "cml-knowledge-flow"
                  ]
                }
              },
              {
                "id": "cml-knowledge-paragraph-2",
                "kind": "paragraph",
                "text": "Model definitions and runtime Entities remain distinct. CNCF Information is itself generated from canonical CML; mappings that extract information from business Entities and their runtime connections are specified separately. Using Entities as Knowledge describes retaining meaning, provenance and access conditions across Information, representations such as RDF, and search or AI delivery.",
                "coreRefs": {
                  "steps": [
                    "cml-knowledge"
                  ],
                  "claims": [
                    "cml-knowledge-claim-2"
                  ],
                  "nodes": [
                    "cml-knowledge-node-1",
                    "cml-knowledge-node-2"
                  ],
                  "relations": [
                    "cml-knowledge-relation-1"
                  ],
                  "flows": [
                    "cml-knowledge-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "cml-static-section",
            "heading": "Defining Value Meaning and Update Boundaries",
            "coreRefs": {
              "steps": [
                "cml-static"
              ],
              "claims": [
                "cml-static-claim-1",
                "cml-static-claim-2"
              ],
              "nodes": [
                "cml-static-node-1",
                "cml-static-node-2"
              ],
              "relations": [
                "cml-static-relation-1"
              ],
              "flows": [
                "cml-static-flow"
              ]
            },
            "blocks": [
              {
                "id": "cml-static-paragraph-1",
                "kind": "paragraph",
                "text": "Domain models center on static business structure. Entities identify objects whose identity persists; Values describe value-shaped structures; Datatypes express named data types and constraints. Aggregates establish the scope of related state and update consistency. These distinctions separate values with different meanings even when represented by the same primitive type and clarify which operations change which state.",
                "coreRefs": {
                  "steps": [
                    "cml-static"
                  ],
                  "claims": [
                    "cml-static-claim-1"
                  ],
                  "nodes": [
                    "cml-static-node-1",
                    "cml-static-node-2"
                  ],
                  "relations": [
                    "cml-static-relation-1"
                  ],
                  "flows": [
                    "cml-static-flow"
                  ]
                }
              },
              {
                "id": "cml-static-paragraph-2",
                "kind": "paragraph",
                "text": "Attributes declare types, multiplicities and constraints such as length and range. Accepted constraints are carried into generated construction and decoding, Operation inputs, persistence conversion and form metadata. Applying the same definitions at business boundaries as well as screens reduces differences between entry points.",
                "coreRefs": {
                  "steps": [
                    "cml-static"
                  ],
                  "claims": [
                    "cml-static-claim-2"
                  ],
                  "nodes": [
                    "cml-static-node-1",
