              ]
            },
            "blocks": [
              {
                "id": "cml-conclusion-paragraph-1",
                "kind": "paragraph",
                "text": "CML modeling divides responsibility among terminology, structure, rules, behavior, reading and presentation while preserving their relationships. Types and constraints govern values, rules govern decisions, and Workflows and state machines govern progression; generation and Textus/CNCF connect these definitions to implementation. This structure supports reuse and change and clarifies the scope of AI supplementation, allowing model-driven development to function as an AI development harness.",
