<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#607680"/></marker></defs><rect width="1120" height="650" fill="#faf9f6"/><text x="24" y="45" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="35" font-weight="700" fill="#183743">二倉庫化で残した仕様を、EC連携の判断に使う</text><text x="256" y="104" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="28" font-weight="700" fill="#183743">一年後　改修して残すもの</text><text x="706" y="104" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="27" font-weight="700" fill="#183743">4年目　後任者とAIが読むもの</text><rect x="18" y="128" width="202" height="102" rx="8" fill="#dbece9"/><text x="32" y="169" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="27" font-weight="700" fill="#183743">実行モデル</text><text x="32" y="206" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="22" font-weight="400" fill="#183743">現行の規則</text><text x="242" y="168" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#183743">全数確保まで出荷を保留。</text><text x="242" y="204" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#183743">競合時は仮押さえを解放。</text><path d="M631 180 H685" fill="none" stroke="#607680" stroke-width="4" marker-end="url(#tip)"/><text x="705" y="168" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#183743">EC注文にも同じ受注操作と</text><text x="705" y="204" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#183743">解放条件を適用できる。</text><rect x="18" y="248" width="202" height="102" rx="8" fill="#dfeaf2"/><text x="32" y="289" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="27" font-weight="700" fill="#183743">採用版のCAR</text><text x="32" y="326" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="22" font-weight="400" fill="#183743">部品の契約</text><text x="242" y="288" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#183743">在庫部品の版に、確保・解放の</text><text x="242" y="324" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#183743">仕様書とメタデータを同梱。</text><path d="M631 300 H685" fill="none" stroke="#607680" stroke-width="4" marker-end="url(#tip)"/><text x="705" y="288" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#183743">稼働版の操作・入出力を特定し、</text><text x="705" y="324" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#183743">EC接続の変更範囲を絞れる。</text><rect x="18" y="368" width="202" height="102" rx="8" fill="#eee6d9"/><text x="32" y="409" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="27" font-weight="700" fill="#183743">BoK</text><text x="32" y="446" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="22" font-weight="400" fill="#183743">判断理由と受入例</text><text x="242" y="408" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#183743">「全数引当」から、解放の理由と</text><text x="242" y="444" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#183743">引当0個・出荷0件の例を引ける。</text><path d="M631 420 H685" fill="none" stroke="#607680" stroke-width="4" marker-end="url(#tip)"/><text x="705" y="408" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#183743">同じ受入例をEC経由で試し、</text><text x="705" y="444" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#183743">引き継いだ条件を確認できる。</text><rect x="18" y="505" width="1084" height="122" rx="8" fill="#193d48"/><text x="38" y="548" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="27" font-weight="700" fill="#ffffff">ECで追加する仕様　同じ外部注文番号の再送を、一つの注文として扱う</text><text x="38" y="598" font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" font-size="23" font-weight="400" fill="#ffffff">受注・引当の記録で重複を調べ、出荷側の記録で受付が1件に保たれることを確かめる。</text></svg>