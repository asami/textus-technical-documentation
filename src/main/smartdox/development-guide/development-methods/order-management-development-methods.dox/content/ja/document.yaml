                    "order-management-development-methods-model-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-model-flow"
                  ]
                },
                "text": "再利用には二つの単位があります。業務カタログには、受注に典型的な役割・判断・手順をひな形にした業務アーキタイプがあり、コンポーネント・リポジトリには、その手順で使える実行部品があります。生成AIはMCP経由でひな形の適用条件と部品の公開操作・入出力・依存関係を調べます。注文Aなら、与信承認と在庫引当を扱える受注アーキタイプを選び、顧客の全数引当規則を加えます。在庫数を返すだけの部品と、注文に対して在庫を確保・解放できる部品を区別し、後者を契約に沿って接続します。 別の顧客へ展開するときも、ひな形と部品は再利用し、全数引当という案件固有の規則はあらためて顧客に確認します。"
              },
              {
                "id": "order-management-development-methods-model-car-specification",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-model"
