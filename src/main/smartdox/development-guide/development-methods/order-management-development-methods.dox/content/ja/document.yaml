                  "flows": [
                    "order-management-development-methods-model-flow"
                  ]
                },
                "text": "モデル・プログラミング・ランタイムの各ハーネスは、モデルに沿って実装するための型・操作・接続方法を定めます。Textus/CNCFは実行可能なモデルを直接動かし、Cozyは型付きAPIと接続構造を生成します。AIはその契約に沿って固有処理を補い、型や部品の検査が接続の誤りを検出します。規則を変えたら、モデルの改訂を直接実行または再生成で動作へ反映し、注文Aの受入例で確かめます。この経路を改修のたびに使うことで、後任者が読む仕様と稼働中の動作の対応を保てます。"
              },
              {
                "id": "order-management-development-methods-model-paragraph-2",
                "kind": "paragraph",
