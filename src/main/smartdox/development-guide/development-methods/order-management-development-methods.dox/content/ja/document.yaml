                "text": "二倉庫化の前提となる初年度の動作に戻ります。この時点では一つの倉庫で注文Aを扱い、四方式に同じ出荷条件を適用します。注文Aは10個、契約単価1,000円、与信枠8,000円、在庫6個。与信超過を承認しても、全数を確保するまでは出荷を保留します。4個を補充して全数を引き当てると、出荷指示が出ます。同じ出荷指示を再送しても、注文Aに対応する出荷受付は1件です。"
