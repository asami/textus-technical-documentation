                  "flows": [
                    "order-management-development-methods-model-flow"
                  ]
                },
                "text": "「どの条件なら引当が成立するか」は、ビジネス・ルールとしてルールDSLに記述します。注文Aなら「必要数を全数確保できた場合に引当成立」と定め、ワークフローはその結果で出荷か保留かを選びます。後任者は、引当の条件を変える相談ならルールを、保留後に再開する順序を変える相談ならワークフローを顧客と読み直せます。"
              },
              {
                "id": "order-management-development-methods-model-implementation-harness",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-model"
                  ],
                  "claims": [
                    "order-management-development-methods-model-claim-implementation-harness"
