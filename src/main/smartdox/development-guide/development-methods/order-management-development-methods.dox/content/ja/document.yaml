                    "order-management-development-methods-model-relation-2",
                    "order-management-development-methods-model-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-model-flow"
                  ]
                },
                "text": "選んだ部品はCARという単位で配布されます。CARにはプログラムとその版の仕様書が同梱されるので、部品を別の案件へ移しても仕様書が散逸しにくくなります。生成AIが参照するメタデータも所定の場所にあり、どの部品でも同じ手順で公開操作や入出力を調べられます。例えば二倉庫化で仮押さえの解放が必要になったとき、後任者とAIは採用済みの在庫部品のCARを開き、その版が解放操作を提供するかを確認してから、再利用か拡張かを判断できます。"
