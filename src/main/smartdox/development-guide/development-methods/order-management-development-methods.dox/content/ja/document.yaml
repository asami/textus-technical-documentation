                "text": "従来型では、開発者が与信承認と引当の責務を分け、出荷を許す条件をコードに実装します。共通のドメイン操作に規則を集めれば、画面からもバッチからも同じ規則を使えます。DDDや回帰テストが有効なのは、この責務と振る舞いを後任者にも見える形で残せるからです。"
