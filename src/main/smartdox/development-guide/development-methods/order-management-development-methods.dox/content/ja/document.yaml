                    "order-management-development-methods-model-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-model-flow"
                  ]
                },
                "text": "変更範囲の限定。在庫の確保・解放と整合性を在庫部品に集め（高凝集）、受注部品は在庫の公開操作と結果を通して連携します（疎結合）。公開契約が同じなら、倉庫内部の保存形式を変えるとき、受注や画面の内部実装まで知る必要はありません。逆に「引当済み」という結果の意味を変えるなら、その結果を使う受注・出荷が確認対象です。部品の仕様が明示されているので、区画を越えて必要になる知識を特定できます。"
