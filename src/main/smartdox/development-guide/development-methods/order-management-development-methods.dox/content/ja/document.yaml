                "text": "通常の開発で仕様書は、これから実装するシステムの設計図です。実装時に加えた例外や、その後コードだけに施した修正は、自動的には設計図に戻りません。設計書とプログラムで出荷条件が違えば、実際に適用される条件は稼働中のプログラムにあります。後任者は受注・倉庫・出荷のコードとテストを調べて最終仕様を復元します。このリバースエンジニアリングで動作が分かっても、その例外をなぜ認めたかは、当時の判断記録が必要です。"
              }
