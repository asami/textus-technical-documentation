                  "flows": [
                    "order-management-development-methods-initial-flow"
                  ]
                },
                "text": "画面から分かるのは「在庫6個で出荷が止まった」という結果です。コードを読めばどの条件で止めたかを調べられます。しかし、全数引当が顧客との約束だったのか、当時の倉庫の都合だったのかは、動作だけでは判別できません。規則と理由がプログラムの中に埋もれていれば、ソースコードが読めても、顧客から見た仕様はブラックボックスになります。改修の見積り以前に、何を変えてよいかの検討が止まります。"
