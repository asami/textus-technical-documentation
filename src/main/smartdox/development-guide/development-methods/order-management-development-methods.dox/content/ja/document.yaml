                    "order-management-development-methods-model-node-2",
                    "order-management-development-methods-model-node-3",
                    "order-management-development-methods-model-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-model-relation-1",
                    "order-management-development-methods-model-relation-2",
                    "order-management-development-methods-model-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-model-flow"
                  ]
                },
                "text": "判断理由の継承。BoKで「全数引当」を引けば、顧客が分納を認めなかった理由、決定時の適用範囲、状態モデル、在庫部品の契約、受入例をたどれます。人と生成AIがこの対応を共有し、新しい例外を合意したら適用先と理由をそこへ追記します。モデルは現行の仕様、BoKはその仕様を選んだ根拠をそれぞれ伝えます。"
              },
              {
                "id": "order-management-development-methods-model-paragraph-4",
                "kind": "paragraph",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-model"
