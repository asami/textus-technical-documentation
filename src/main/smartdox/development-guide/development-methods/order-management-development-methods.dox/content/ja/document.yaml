                    "order-management-development-methods-model-flow"
                  ]
                },
                "text": "注文Aについて「何が注文に属するか」は、受注・明細のEntityとその関係から読めます。「承認したら出荷できるか」を調べるには、振る舞いの仕様も必要です。状態機械には、与信が「承認待ち」から「承認済み」へ移る条件を記述します。ワークフローには、承認後に在庫引当を試し、不足なら保留し、補充後に再開する手順を記述します。これで、対象の構造、許される状態変化、業務の進み方をそれぞれモデルから確認できます。"
