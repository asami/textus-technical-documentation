                    "order-management-development-methods-model-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-model-relation-1",
                    "order-management-development-methods-model-relation-2",
                    "order-management-development-methods-model-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-model-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "order-management-development-methods-years-section",
            "heading": "Comparing five years of change",
            "coreRefs": {
              "steps": [
                "order-management-development-methods-years"
              ],
              "claims": [
                "order-management-development-methods-years-claim-1"
              ],
              "nodes": [
                "order-management-development-methods-years-node-1",
                "order-management-development-methods-years-node-2"
              ],
              "relations": [
                "order-management-development-methods-years-relation-1"
              ],
              "flows": [
                "order-management-development-methods-years-flow"
              ]
            },
            "blocks": [
              {
                "id": "order-management-development-methods-years-paragraph-1",
                "kind": "paragraph",
                "text": "Start with domestic orders in year one and introduce one change each year. Give maintainers the artifacts handed over by the previous team and the same new requirement. Compare where they recover intent, what they revise and which execution results complete the next handover.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-years"
                  ],
                  "claims": [
                    "order-management-development-methods-years-claim-1"
                  ],
                  "nodes": [
                    "order-management-development-methods-years-node-1",
                    "order-management-development-methods-years-node-2"
                  ],
                  "relations": [
                    "order-management-development-methods-years-relation-1"
                  ],
                  "flows": [
                    "order-management-development-methods-years-flow"
                  ]
                }
              }
            ],
            "sections": [
              {
                "sections": [],
                "id": "order-management-development-methods-years-baseline-section",
                "heading": "Year one — handing over domestic orders",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-years-baseline"
                  ],
                  "claims": [
                    "order-management-development-methods-years-baseline-claim-1",
                    "order-management-development-methods-years-baseline-claim-2"
                  ],
                  "nodes": [
                    "order-management-development-methods-years-baseline-node-1",
                    "order-management-development-methods-years-baseline-node-2"
                  ],
                  "relations": [
                    "order-management-development-methods-years-baseline-relation-1"
                  ],
                  "flows": [
                    "order-management-development-methods-years-baseline-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "order-management-development-methods-years-baseline-paragraph-1",
                    "kind": "paragraph",
                    "text": "At handover ask a successor why yesterday’s approved order A has not shipped. In conventional development they consult the design decision and state transitions and rerun the regression test. In UI-led development they replay the accepted interaction and inspect inventory responses for actual reservations. The first handover connects design to tests; the second connects screen state to service behavior.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-baseline"
                      ],
                      "claims": [
                        "order-management-development-methods-years-baseline-claim-1"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-baseline-node-1",
                        "order-management-development-methods-years-baseline-node-2"
                      ],
                      "relations": [
                        "order-management-development-methods-years-baseline-relation-1"
                      ],
                      "flows": [
                        "order-management-development-methods-years-baseline-flow"
                      ]
                    }
                  },
                  {
                    "id": "order-management-development-methods-years-baseline-paragraph-2",
                    "kind": "paragraph",
                    "text": "In specification-led development the successor selects the approved/six-units decision row and reruns its test. In SimpleModeling they follow the CML reservation condition to the inventory component version and operation, then inspect the result. The handover succeeds when the successor can explain the hold using the retained artifacts.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-baseline"
                      ],
                      "claims": [
                        "order-management-development-methods-years-baseline-claim-2"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-baseline-node-1",
                        "order-management-development-methods-years-baseline-node-2"
                      ],
                      "relations": [
                        "order-management-development-methods-years-baseline-relation-1"
                      ],
                      "flows": [
                        "order-management-development-methods-years-baseline-flow"
                      ]
                    }
                  }
                ]
              },
              {
                "sections": [],
                "id": "order-management-development-methods-years-warehouses-section",
                "heading": "Year two — reserving across warehouses",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-years-warehouses"
                  ],
                  "claims": [
                    "order-management-development-methods-years-warehouses-claim-1",
                    "order-management-development-methods-years-warehouses-claim-2",
                    "order-management-development-methods-years-warehouses-claim-3"
                  ],
                  "nodes": [
                    "order-management-development-methods-years-warehouses-node-1",
                    "order-management-development-methods-years-warehouses-node-2",
                    "order-management-development-methods-years-warehouses-node-3"
                  ],
                  "relations": [
                    "order-management-development-methods-years-warehouses-relation-1",
                    "order-management-development-methods-years-warehouses-relation-2"
                  ],
                  "flows": [
                    "order-management-development-methods-years-warehouses-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "order-management-development-methods-years-warehouses-paragraph-1",
                    "kind": "paragraph",
                    "text": "Warehouse one holds six units and warehouse two holds four. A still requires a full reservation. Add a case where another order takes the last four first: release the provisional six and return A to hold.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-warehouses"
                      ],
                      "claims": [
                        "order-management-development-methods-years-warehouses-claim-1"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-warehouses-node-1",
                        "order-management-development-methods-years-warehouses-node-2",
                        "order-management-development-methods-years-warehouses-node-3"
                      ],
                      "relations": [
                        "order-management-development-methods-years-warehouses-relation-1",
                        "order-management-development-methods-years-warehouses-relation-2"
                      ],
                      "flows": [
                        "order-management-development-methods-years-warehouses-flow"
                      ]
                    }
                  },
                  {
                    "id": "order-management-development-methods-years-warehouses-paragraph-2",
                    "kind": "paragraph",
                    "text": "Conventional teams split reservations into warehouse lines, migrate storage and test provisional release, preserving state diagrams, migration steps and a contention test. UI-led teams prototype warehouse selection and read both balances after a simulated race. The screen, reproduction steps and service test travel together.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-warehouses"
                      ],
                      "claims": [
                        "order-management-development-methods-years-warehouses-claim-2"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-warehouses-node-1",
                        "order-management-development-methods-years-warehouses-node-2",
                        "order-management-development-methods-years-warehouses-node-3"
                      ],
                      "relations": [
                        "order-management-development-methods-years-warehouses-relation-1",
                        "order-management-development-methods-years-warehouses-relation-2"
                      ],
                      "flows": [
                        "order-management-development-methods-years-warehouses-flow"
                      ]
                    }
                  },
                  {
                    "id": "order-management-development-methods-years-warehouses-paragraph-3",
                    "kind": "paragraph",
                    "text": "Specification-led teams add the one-warehouse-success case and bind the zero balance after release to a test. SimpleModeling teams add the reservation-line/warehouse relationship to CML and check reserve/release contracts. An older component without release needs an extension. The model diff, selected version and two-warehouse execution example remain.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-warehouses"
                      ],
                      "claims": [
                        "order-management-development-methods-years-warehouses-claim-3"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-warehouses-node-1",
                        "order-management-development-methods-years-warehouses-node-2",
                        "order-management-development-methods-years-warehouses-node-3"
                      ],
                      "relations": [
                        "order-management-development-methods-years-warehouses-relation-1",
                        "order-management-development-methods-years-warehouses-relation-2"
                      ],
                      "flows": [
                        "order-management-development-methods-years-warehouses-flow"
                      ]
                    }
                  }
                ]
              },
              {
                "sections": [],
                "id": "order-management-development-methods-years-currency-section",
                "heading": "Year three — accepting foreign-currency orders",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-years-currency"
                  ],
                  "claims": [
                    "order-management-development-methods-years-currency-claim-1",
                    "order-management-development-methods-years-currency-claim-2",
                    "order-management-development-methods-years-currency-claim-3"
                  ],
                  "nodes": [
                    "order-management-development-methods-years-currency-node-1",
                    "order-management-development-methods-years-currency-node-2",
                    "order-management-development-methods-years-currency-node-3"
                  ],
                  "relations": [
                    "order-management-development-methods-years-currency-relation-1",
                    "order-management-development-methods-years-currency-relation-2"
                  ],
                  "flows": [
                    "order-management-development-methods-years-currency-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "order-management-development-methods-years-currency-paragraph-1",
                    "kind": "paragraph",
                    "text": "For an overseas variant of A, accept a foreign-currency amount against a domestic credit limit. Preserve the currency, applied exchange rate, conversion date and rounding rule. Every method must reproduce the original approval decision after the rate changes.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-currency"
                      ],
                      "claims": [
                        "order-management-development-methods-years-currency-claim-1"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-currency-node-1",
                        "order-management-development-methods-years-currency-node-2",
                        "order-management-development-methods-years-currency-node-3"
                      ],
                      "relations": [
                        "order-management-development-methods-years-currency-relation-1",
                        "order-management-development-methods-years-currency-relation-2"
                      ],
                      "flows": [
                        "order-management-development-methods-years-currency-flow"
                      ]
                    }
                  },
                  {
                    "id": "order-management-development-methods-years-currency-paragraph-2",
                    "kind": "paragraph",
                    "text": "Conventional teams revise money types, storage and the credit API, keeping migration steps for domestic orders and rounding-boundary tests. UI-led teams review currency and converted amount with sales and reopen A in another locale. Screens and tests of the stored currency and rate distinguish display language from transaction currency.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-currency"
                      ],
                      "claims": [
                        "order-management-development-methods-years-currency-claim-2"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-currency-node-1",
                        "order-management-development-methods-years-currency-node-2",
                        "order-management-development-methods-years-currency-node-3"
                      ],
                      "relations": [
                        "order-management-development-methods-years-currency-relation-1",
                        "order-management-development-methods-years-currency-relation-2"
                      ],
                      "flows": [
                        "order-management-development-methods-years-currency-flow"
                      ]
                    }
                  },
                  {
                    "id": "order-management-development-methods-years-currency-paragraph-3",
                    "kind": "paragraph",
                    "text": "Specification-led teams define when the rate is fixed and add cases sensitive to the approval date. SimpleModeling teams model money, currency and conversion date and check the credit component’s input semantics. Handover centers on versioned rules and calculations in the former, and CML, component contracts and executed conversion cases in the latter.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-currency"
                      ],
                      "claims": [
                        "order-management-development-methods-years-currency-claim-3"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-currency-node-1",
                        "order-management-development-methods-years-currency-node-2",
                        "order-management-development-methods-years-currency-node-3"
                      ],
                      "relations": [
                        "order-management-development-methods-years-currency-relation-1",
                        "order-management-development-methods-years-currency-relation-2"
                      ],
                      "flows": [
                        "order-management-development-methods-years-currency-flow"
                      ]
                    }
                  }
                ]
              },
              {
                "sections": [],
                "id": "order-management-development-methods-years-channels-section",
                "heading": "Year four — receiving the same e-commerce order twice",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-years-channels"
                  ],
                  "claims": [
                    "order-management-development-methods-years-channels-claim-1",
                    "order-management-development-methods-years-channels-claim-2",
                    "order-management-development-methods-years-channels-claim-3"
                  ],
                  "nodes": [
                    "order-management-development-methods-years-channels-node-1",
                    "order-management-development-methods-years-channels-node-2",
                    "order-management-development-methods-years-channels-node-3"
                  ],
                  "relations": [
                    "order-management-development-methods-years-channels-relation-1",
                    "order-management-development-methods-years-channels-relation-2"
                  ],
                  "flows": [
                    "order-management-development-methods-years-channels-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "order-management-development-methods-years-channels-paragraph-1",
                    "kind": "paragraph",
                    "text": "A lost acknowledgment causes the channel to resend A. Two receipt attempts may be recorded, but there must be one reservation and one shipping instruction. Conventional teams design uniqueness by channel and external order ID, decide when to commit and acknowledge, and hand over a replay test and support procedure.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-channels"
                      ],
                      "claims": [
                        "order-management-development-methods-years-channels-claim-1"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-channels-node-1",
                        "order-management-development-methods-years-channels-node-2",
                        "order-management-development-methods-years-channels-node-3"
                      ],
                      "relations": [
                        "order-management-development-methods-years-channels-relation-1",
                        "order-management-development-methods-years-channels-relation-2"
                      ],
                      "flows": [
                        "order-management-development-methods-years-channels-flow"
                      ]
                    }
                  },
                  {
                    "id": "order-management-development-methods-years-channels-paragraph-2",
                    "kind": "paragraph",
                    "text": "UI-led teams use two incoming requests, check the single sales entry and count calls at the shipping endpoint separately. A reproduction fixture includes both receipts. Specification-led teams specify the conditions for returning the same outcome and retain a lost-acknowledgment contract test.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-channels"
                      ],
                      "claims": [
                        "order-management-development-methods-years-channels-claim-2"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-channels-node-1",
                        "order-management-development-methods-years-channels-node-2",
                        "order-management-development-methods-years-channels-node-3"
                      ],
                      "relations": [
                        "order-management-development-methods-years-channels-relation-1",
                        "order-management-development-methods-years-channels-relation-2"
                      ],
                      "flows": [
                        "order-management-development-methods-years-channels-flow"
                      ]
                    }
                  },
                  {
                    "id": "order-management-development-methods-years-channels-paragraph-3",
                    "kind": "paragraph",
                    "text": "SimpleModeling teams put channel identity in the integration contract and route both channels to the same order operation. They reuse domestic credit and inventory cases, replace the channel component and repeat the replay test. The common order model, channel mapping, component version and execution record remain.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-channels"
                      ],
                      "claims": [
                        "order-management-development-methods-years-channels-claim-3"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-channels-node-1",
                        "order-management-development-methods-years-channels-node-2",
                        "order-management-development-methods-years-channels-node-3"
                      ],
                      "relations": [
                        "order-management-development-methods-years-channels-relation-1",
                        "order-management-development-methods-years-channels-relation-2"
                      ],
                      "flows": [
                        "order-management-development-methods-years-channels-flow"
                      ]
                    }
                  }
                ]
              },
              {
                "sections": [],
                "id": "order-management-development-methods-years-forecast-section",
                "heading": "Year five — turning a demand forecast into a purchase",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-years-forecast"
                  ],
                  "claims": [
                    "order-management-development-methods-years-forecast-claim-1",
                    "order-management-development-methods-years-forecast-claim-2",
                    "order-management-development-methods-years-forecast-claim-3"
                  ],
                  "nodes": [
                    "order-management-development-methods-years-forecast-node-1",
                    "order-management-development-methods-years-forecast-node-2",
                    "order-management-development-methods-years-forecast-node-3"
                  ],
                  "relations": [
                    "order-management-development-methods-years-forecast-relation-1",
                    "order-management-development-methods-years-forecast-relation-2"
                  ],
                  "flows": [
                    "order-management-development-methods-years-forecast-flow"
                  ]
                },
                "blocks": [
                  {
                    "id": "order-management-development-methods-years-forecast-paragraph-1",
                    "kind": "paragraph",
                    "text": "To reduce stock holds like A’s, introduce forecast-driven replenishment. Purchasing sets an automatic purchase limit and an approval rule. Replace the forecasting model with one that recommends a larger quantity and verify that an order exceeding the limit still awaits approval.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-forecast"
                      ],
                      "claims": [
                        "order-management-development-methods-years-forecast-claim-1"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-forecast-node-1",
                        "order-management-development-methods-years-forecast-node-2",
                        "order-management-development-methods-years-forecast-node-3"
                      ],
                      "relations": [
                        "order-management-development-methods-years-forecast-relation-1",
                        "order-management-development-methods-years-forecast-relation-2"
                      ],
                      "flows": [
                        "order-management-development-methods-years-forecast-flow"
                      ]
                    }
                  },
                  {
                    "id": "order-management-development-methods-years-forecast-paragraph-2",
                    "kind": "paragraph",
                    "text": "Conventional teams replace the forecast adapter and use an integration test to exercise purchasing rules and permissions. They retain the decision, adapter contract and before/after results. UI-led teams let the buyer vary the recommendation, then call the API directly to test enforcement. They preserve the approval screen, interactions and API authorization test.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-forecast"
                      ],
                      "claims": [
                        "order-management-development-methods-years-forecast-claim-2"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-forecast-node-1",
                        "order-management-development-methods-years-forecast-node-2",
                        "order-management-development-methods-years-forecast-node-3"
                      ],
                      "relations": [
                        "order-management-development-methods-years-forecast-relation-1",
                        "order-management-development-methods-years-forecast-relation-2"
                      ],
                      "flows": [
                        "order-management-development-methods-years-forecast-flow"
                      ]
                    }
                  },
                  {
                    "id": "order-management-development-methods-years-forecast-paragraph-3",
                    "kind": "paragraph",
                    "text": "Specification-led teams specify proposal and purchase conditions separately and rerun acceptance cases varying only the forecast. SimpleModeling teams model a prediction as component output and purchase as an authorized operation, using the same cases across CAR versions. The year-five maintainer can explain a forecasting improvement separately from a purchasing-policy change using spec revisions or model and component-contract revisions.",
                    "coreRefs": {
                      "steps": [
                        "order-management-development-methods-years-forecast"
                      ],
                      "claims": [
                        "order-management-development-methods-years-forecast-claim-3"
                      ],
                      "nodes": [
                        "order-management-development-methods-years-forecast-node-1",
                        "order-management-development-methods-years-forecast-node-2",
                        "order-management-development-methods-years-forecast-node-3"
                      ],
                      "relations": [
                        "order-management-development-methods-years-forecast-relation-1",
                        "order-management-development-methods-years-forecast-relation-2"
                      ],
                      "flows": [
                        "order-management-development-methods-years-forecast-flow"
                      ]
                    }
                  }
                ]
              }
            ]
          },
          {
            "id": "order-management-development-methods-adopt-section",
            "heading": "Choosing a combination for a project",
            "coreRefs": {
              "steps": [
                "order-management-development-methods-adopt"
              ],
              "claims": [
                "order-management-development-methods-adopt-claim-1"
              ],
              "nodes": [
                "order-management-development-methods-adopt-node-1",
                "order-management-development-methods-adopt-node-2"
              ],
              "relations": [
                "order-management-development-methods-adopt-relation-1"
              ],
              "flows": [
                "order-management-development-methods-adopt-flow"
              ]
            },
            "blocks": [
              {
                "id": "order-management-development-methods-adopt-paragraph-1",
                "kind": "paragraph",
                "text": "Use the initial and longitudinal comparison to choose methods for discovery, agreement, implementation and maintenance. A hold condition discovered in a prototype can enter the domain model and acceptance examples and be checked against the inventory contract. Specification-led acceptance examples can support the same verification.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-adopt"
                  ],
                  "claims": [
                    "order-management-development-methods-adopt-claim-1"
                  ],
                  "nodes": [
                    "order-management-development-methods-adopt-node-1",
