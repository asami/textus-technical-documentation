    "title": "Four Development Methods for Order Management",
    "sections": [
      {
        "id": "order-management-development-methods-section",
        "heading": "Four Development Methods for Order Management",
        "coreRefs": {
          "steps": [
            "order-management-development-methods"
          ],
          "claims": [
            "order-management-development-methods-claim-1"
          ],
          "nodes": [
            "order-management-development-methods-node-1",
