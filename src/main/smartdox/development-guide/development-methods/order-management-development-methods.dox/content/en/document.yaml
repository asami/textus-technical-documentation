          ],
          "relations": [
            "order-management-development-methods-relation-1"
          ],
          "flows": [
            "order-management-development-methods-flow"
          ]
        },
        "blocks": [
          {
            "id": "order-management-development-methods-paragraph-1",
            "kind": "paragraph",
            "text": "Credit approval and shipment are separate decisions when stock changes while an order awaits approval. We follow the same order across four development methods, from the artifacts accepted in the first release to the evidence a successor can use when changing the system in year five.",
            "coreRefs": {
              "steps": [
                "order-management-development-methods"
              ],
              "claims": [
                "order-management-development-methods-claim-1"
              ],
              "nodes": [
                "order-management-development-methods-node-1",
                "order-management-development-methods-node-2"
              ],
              "relations": [
                "order-management-development-methods-relation-1"
              ],
              "flows": [
                "order-management-development-methods-flow"
              ]
            }
          }
        ],
        "sections": [
          {
            "id": "order-management-development-methods-initial-section",
            "heading": "Comparing the initial release",
            "coreRefs": {
              "steps": [
                "order-management-development-methods-initial"
              ],
              "claims": [
                "order-management-development-methods-initial-claim-1",
                "order-management-development-methods-initial-claim-2",
                "order-management-development-methods-initial-claim-3",
                "order-management-development-methods-initial-claim-4"
              ],
              "nodes": [
                "order-management-development-methods-initial-node-1",
                "order-management-development-methods-initial-node-2",
                "order-management-development-methods-initial-node-3",
                "order-management-development-methods-initial-node-4"
              ],
              "relations": [
                "order-management-development-methods-initial-relation-1",
                "order-management-development-methods-initial-relation-2",
                "order-management-development-methods-initial-relation-3"
              ],
              "flows": [
                "order-management-development-methods-initial-flow"
              ]
            },
            "blocks": [
              {
                "id": "order-management-development-methods-initial-paragraph-1",
                "kind": "paragraph",
                "text": "Use one acceptance case. An operator registers an order, checks credit, reserves stock, confirms the order and requests shipment. Excess credit requires approval. Insufficient stock puts the reservation on hold. The operator identifies the state from which work can resume. Each method receives the same inputs and expected outcomes.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-initial"
                  ],
                  "claims": [
                    "order-management-development-methods-initial-claim-1"
                  ],
                  "nodes": [
                    "order-management-development-methods-initial-node-1",
                    "order-management-development-methods-initial-node-2",
                    "order-management-development-methods-initial-node-3",
                    "order-management-development-methods-initial-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-initial-relation-1",
                    "order-management-development-methods-initial-relation-2",
                    "order-management-development-methods-initial-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-initial-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-initial-paragraph-2",
                "kind": "paragraph",
                "text": "Assume new order management, candidate customer, product and credit components, an inventory extension and external shipping. Verify availability and access for each project. Record both contract matches and gaps. Include authentication, authorization, tracing, testing and acceptance in the initial delivery.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-initial"
                  ],
                  "claims": [
                    "order-management-development-methods-initial-claim-2"
                  ],
                  "nodes": [
                    "order-management-development-methods-initial-node-1",
                    "order-management-development-methods-initial-node-2",
                    "order-management-development-methods-initial-node-3",
                    "order-management-development-methods-initial-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-initial-relation-1",
                    "order-management-development-methods-initial-relation-2",
                    "order-management-development-methods-initial-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-initial-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-initial-paragraph-3",
                "kind": "paragraph",
                "text": "Order A requests ten units at a domestic unit price of JPY 1,000. Available credit is JPY 8,000 and stock is six units. For this case the order waits for credit approval, then waits for all ten units before reserving any. When stock reaches ten, reservation can resume, the order can be confirmed and one shipping instruction can be issued. All methods use this policy.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-initial"
                  ],
                  "claims": [
                    "order-management-development-methods-initial-claim-3"
                  ],
                  "nodes": [
                    "order-management-development-methods-initial-node-1",
                    "order-management-development-methods-initial-node-2",
                    "order-management-development-methods-initial-node-3",
                    "order-management-development-methods-initial-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-initial-relation-1",
                    "order-management-development-methods-initial-relation-2",
                    "order-management-development-methods-initial-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-initial-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-initial-paragraph-4",
                "kind": "paragraph",
                "text": "Acceptance checks the reserved quantity before approval (zero), shipping instructions while stock is short (zero), and shipping instructions after replenishment and a repeated operation (one). A second order has sufficient credit and stock for the normal path. All teams receive the same candidate components, fixtures and business reviewer.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-initial"
                  ],
                  "claims": [
                    "order-management-development-methods-initial-claim-4"
                  ],
                  "nodes": [
                    "order-management-development-methods-initial-node-1",
                    "order-management-development-methods-initial-node-2",
                    "order-management-development-methods-initial-node-3",
                    "order-management-development-methods-initial-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-initial-relation-1",
                    "order-management-development-methods-initial-relation-2",
                    "order-management-development-methods-initial-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-initial-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "order-management-development-methods-conventional-section",
            "heading": "Preserving business decisions in conventional development",
            "coreRefs": {
              "steps": [
                "order-management-development-methods-conventional"
              ],
              "claims": [
                "order-management-development-methods-conventional-claim-1",
                "order-management-development-methods-conventional-claim-2",
                "order-management-development-methods-conventional-claim-3",
                "order-management-development-methods-conventional-claim-4"
              ],
              "nodes": [
                "order-management-development-methods-conventional-node-1",
                "order-management-development-methods-conventional-node-2",
                "order-management-development-methods-conventional-node-3",
                "order-management-development-methods-conventional-node-4"
              ],
              "relations": [
                "order-management-development-methods-conventional-relation-1",
                "order-management-development-methods-conventional-relation-2",
                "order-management-development-methods-conventional-relation-3"
              ],
              "flows": [
                "order-management-development-methods-conventional-flow"
              ]
            },
            "blocks": [
              {
                "id": "order-management-development-methods-conventional-paragraph-1",
                "kind": "paragraph",
                "text": "The team agrees on the credit exception with the operator and distinguishes orders awaiting approval from orders eligible for reservation. With DDD it expresses this distinction in the model, public operations and persistence, then connects them to authorization and transactions in its chosen framework.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-conventional"
                  ],
                  "claims": [
                    "order-management-development-methods-conventional-claim-1"
                  ],
                  "nodes": [
                    "order-management-development-methods-conventional-node-1",
                    "order-management-development-methods-conventional-node-2",
                    "order-management-development-methods-conventional-node-3",
                    "order-management-development-methods-conventional-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-conventional-relation-1",
                    "order-management-development-methods-conventional-relation-2",
                    "order-management-development-methods-conventional-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-conventional-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-conventional-paragraph-2",
                "kind": "paragraph",
                "text": "Developers use contract tests for inventory and shipping failures and regression tests for order state. When AI assists implementation, the team identifies which design records, code and tests explain why a change was made.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-conventional"
                  ],
                  "claims": [
                    "order-management-development-methods-conventional-claim-2"
                  ],
                  "nodes": [
                    "order-management-development-methods-conventional-node-1",
                    "order-management-development-methods-conventional-node-2",
                    "order-management-development-methods-conventional-node-3",
                    "order-management-development-methods-conventional-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-conventional-relation-1",
                    "order-management-development-methods-conventional-relation-2",
                    "order-management-development-methods-conventional-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-conventional-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-conventional-paragraph-3",
                "kind": "paragraph",
                "text": "Sales agrees the approval and reservation order. The designer maps state transitions and inventory call conditions. The implementer restricts approval to authorized staff and treats stock checking and reservation as one update. For a lost shipping response, the team verifies with the external service how a repeated instruction is identified.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-conventional"
                  ],
                  "claims": [
                    "order-management-development-methods-conventional-claim-3"
                  ],
                  "nodes": [
                    "order-management-development-methods-conventional-node-1",
                    "order-management-development-methods-conventional-node-2",
                    "order-management-development-methods-conventional-node-3",
                    "order-management-development-methods-conventional-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-conventional-relation-1",
                    "order-management-development-methods-conventional-relation-2",
                    "order-management-development-methods-conventional-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-conventional-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-conventional-paragraph-4",
                "kind": "paragraph",
                "text": "The handover includes a decision record explaining why approval still requires a full reservation, a state diagram, inventory and shipping contracts, source code and a regression test for A. A successor reruns the test for behavior and reads the decision record for intent. The team maintains the link between them.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-conventional"
                  ],
                  "claims": [
                    "order-management-development-methods-conventional-claim-4"
                  ],
                  "nodes": [
                    "order-management-development-methods-conventional-node-1",
                    "order-management-development-methods-conventional-node-2",
                    "order-management-development-methods-conventional-node-3",
                    "order-management-development-methods-conventional-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-conventional-relation-1",
                    "order-management-development-methods-conventional-relation-2",
                    "order-management-development-methods-conventional-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-conventional-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "order-management-development-methods-ui-section",
            "heading": "Discovering exceptions through UI-driven AI development",
            "coreRefs": {
              "steps": [
                "order-management-development-methods-ui"
              ],
              "claims": [
                "order-management-development-methods-ui-claim-1",
                "order-management-development-methods-ui-claim-2",
                "order-management-development-methods-ui-claim-3",
                "order-management-development-methods-ui-claim-4"
              ],
              "nodes": [
                "order-management-development-methods-ui-node-1",
                "order-management-development-methods-ui-node-2",
                "order-management-development-methods-ui-node-3",
                "order-management-development-methods-ui-node-4"
              ],
              "relations": [
                "order-management-development-methods-ui-relation-1",
                "order-management-development-methods-ui-relation-2",
                "order-management-development-methods-ui-relation-3"
              ],
              "flows": [
                "order-management-development-methods-ui-flow"
              ]
            },
            "blocks": [
              {
                "id": "order-management-development-methods-ui-paragraph-1",
                "kind": "paragraph",
                "text": "Have AI generate an order form and ask the customer to enter an order that cannot be filled. A request to send held orders back to sales reveals the next actor and the state the system needs. UI-led discovery can include careful code review. Vibe coding describes one way of iterating on generated results within this comparison.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-ui"
                  ],
                  "claims": [
                    "order-management-development-methods-ui-claim-1"
                  ],
                  "nodes": [
                    "order-management-development-methods-ui-node-1",
                    "order-management-development-methods-ui-node-2",
                    "order-management-development-methods-ui-node-3",
                    "order-management-development-methods-ui-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-ui-relation-1",
                    "order-management-development-methods-ui-relation-2",
                    "order-management-development-methods-ui-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-ui-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-ui-paragraph-2",
                "kind": "paragraph",
                "text": "When the screen says On Hold, inspect the stock balance and check that no shipping request was sent. Identify which calls were simulated and which reached real components. Preserve accepted rules as scenarios and acceptance examples.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-ui"
                  ],
                  "claims": [
                    "order-management-development-methods-ui-claim-2"
                  ],
                  "nodes": [
                    "order-management-development-methods-ui-node-1",
                    "order-management-development-methods-ui-node-2",
                    "order-management-development-methods-ui-node-3",
                    "order-management-development-methods-ui-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-ui-relation-1",
                    "order-management-development-methods-ui-relation-2",
                    "order-management-development-methods-ui-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-ui-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-ui-paragraph-3",
                "kind": "paragraph",
                "text": "The operator enters A and asks why an approved order still cannot ship. AI revises the screen to distinguish approval status from the stock shortfall. The developer replaces the simulation with inventory service calls and tests competing reservations and duplicate submissions after a page reload.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-ui"
                  ],
                  "claims": [
                    "order-management-development-methods-ui-claim-3"
                  ],
                  "nodes": [
                    "order-management-development-methods-ui-node-1",
                    "order-management-development-methods-ui-node-2",
                    "order-management-development-methods-ui-node-3",
                    "order-management-development-methods-ui-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-ui-relation-1",
                    "order-management-development-methods-ui-relation-2",
                    "order-management-development-methods-ui-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-ui-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-ui-paragraph-4",
                "kind": "paragraph",
                "text": "Preserve the confirmed interaction, UI and code, a list of simulated responses and integration tests against real services. Add expected reservation and shipment counts to decisions reached on screen. These expectations survive a UI replacement the following year.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-ui"
                  ],
                  "claims": [
                    "order-management-development-methods-ui-claim-4"
                  ],
                  "nodes": [
                    "order-management-development-methods-ui-node-1",
                    "order-management-development-methods-ui-node-2",
                    "order-management-development-methods-ui-node-3",
                    "order-management-development-methods-ui-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-ui-relation-1",
                    "order-management-development-methods-ui-relation-2",
                    "order-management-development-methods-ui-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-ui-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "order-management-development-methods-spec-section",
            "heading": "Connecting specifications to implementation and acceptance",
            "coreRefs": {
              "steps": [
                "order-management-development-methods-spec"
              ],
              "claims": [
                "order-management-development-methods-spec-claim-1",
                "order-management-development-methods-spec-claim-2",
                "order-management-development-methods-spec-claim-3",
                "order-management-development-methods-spec-claim-4"
              ],
              "nodes": [
                "order-management-development-methods-spec-node-1",
                "order-management-development-methods-spec-node-2",
                "order-management-development-methods-spec-node-3",
                "order-management-development-methods-spec-node-4"
              ],
              "relations": [
                "order-management-development-methods-spec-relation-1",
                "order-management-development-methods-spec-relation-2",
                "order-management-development-methods-spec-relation-3"
              ],
              "flows": [
                "order-management-development-methods-spec-flow"
              ]
            },
            "blocks": [
              {
                "id": "order-management-development-methods-spec-paragraph-1",
                "kind": "paragraph",
                "text": "Specify order states, credit-check inputs and the condition for resuming after approval. AI uses the specification and shipping API contract to produce implementation and tests. A business reviewer checks representative outcomes. An example identifies who resumes the process and which operation they invoke.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-spec"
                  ],
                  "claims": [
                    "order-management-development-methods-spec-claim-1"
                  ],
                  "nodes": [
                    "order-management-development-methods-spec-node-1",
                    "order-management-development-methods-spec-node-2",
                    "order-management-development-methods-spec-node-3",
                    "order-management-development-methods-spec-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-spec-relation-1",
                    "order-management-development-methods-spec-relation-2",
                    "order-management-development-methods-spec-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-spec-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-spec-paragraph-2",
                "kind": "paragraph",
                "text": "Trace a specification change to operations, components and acceptance tests. Automated checks and review keep the specification aligned with observed behavior as the system evolves.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-spec"
                  ],
                  "claims": [
                    "order-management-development-methods-spec-claim-2"
                  ],
                  "nodes": [
                    "order-management-development-methods-spec-node-1",
                    "order-management-development-methods-spec-node-2",
                    "order-management-development-methods-spec-node-3",
                    "order-management-development-methods-spec-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-spec-relation-1",
                    "order-management-development-methods-spec-relation-2",
                    "order-management-development-methods-spec-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-spec-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-spec-paragraph-3",
                "kind": "paragraph",
                "text": "Business and specification owners express A as a decision table. Conditions are approval and full stock availability. Outcomes are order state, reserved quantity and whether shipping is instructed. AI drafts operations and tests; reviewers compare generated expectations with the business-approved table.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-spec"
                  ],
                  "claims": [
                    "order-management-development-methods-spec-claim-3"
                  ],
                  "nodes": [
                    "order-management-development-methods-spec-node-1",
                    "order-management-development-methods-spec-node-2",
                    "order-management-development-methods-spec-node-3",
                    "order-management-development-methods-spec-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-spec-relation-1",
                    "order-management-development-methods-spec-relation-2",
                    "order-management-development-methods-spec-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-spec-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-spec-paragraph-4",
                "kind": "paragraph",
                "text": "Handover connects the specification version and business-approved examples to operations, tests and implementation. A change to the resume-after-approval clause triggers review of both the six-unit and ten-unit cases. The next developer starts from the tests run against the known specification version.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-spec"
                  ],
                  "claims": [
                    "order-management-development-methods-spec-claim-4"
                  ],
                  "nodes": [
                    "order-management-development-methods-spec-node-1",
                    "order-management-development-methods-spec-node-2",
                    "order-management-development-methods-spec-node-3",
                    "order-management-development-methods-spec-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-spec-relation-1",
                    "order-management-development-methods-spec-relation-2",
                    "order-management-development-methods-spec-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-spec-flow"
                  ]
                }
              }
            ],
            "sections": []
          },
          {
            "id": "order-management-development-methods-model-section",
            "heading": "Connecting domain models to execution with SimpleModeling and AI",
            "coreRefs": {
              "steps": [
                "order-management-development-methods-model"
              ],
              "claims": [
                "order-management-development-methods-model-claim-1",
                "order-management-development-methods-model-claim-2",
                "order-management-development-methods-model-claim-3",
                "order-management-development-methods-model-claim-4"
              ],
              "nodes": [
                "order-management-development-methods-model-node-1",
                "order-management-development-methods-model-node-2",
                "order-management-development-methods-model-node-3",
                "order-management-development-methods-model-node-4"
              ],
              "relations": [
                "order-management-development-methods-model-relation-1",
                "order-management-development-methods-model-relation-2",
                "order-management-development-methods-model-relation-3"
              ],
              "flows": [
                "order-management-development-methods-model-flow"
              ]
            },
            "blocks": [
              {
                "id": "order-management-development-methods-model-paragraph-1",
                "kind": "paragraph",
                "text": "AI proposes a DDD model and CML for orders, reservations and credit decisions from interviews and component contracts. A human decides whether credit approval guarantees stock. If these are separate conditions, the model preserves that distinction. The same acceptance examples check the intended meaning through Cozy generation and Textus/CNCF execution.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-model"
                  ],
                  "claims": [
                    "order-management-development-methods-model-claim-1"
                  ],
                  "nodes": [
                    "order-management-development-methods-model-node-1",
                    "order-management-development-methods-model-node-2",
                    "order-management-development-methods-model-node-3",
                    "order-management-development-methods-model-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-model-relation-1",
                    "order-management-development-methods-model-relation-2",
                    "order-management-development-methods-model-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-model-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-model-paragraph-2",
                "kind": "paragraph",
                "text": "Check candidate services and operations for inputs, outputs, failure states and permissions. Record CAR versions and dependencies. Combine car-lint inspection with a business fit review. Connected execution and regression examples determine whether replacing a component preserves order semantics.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-model"
                  ],
                  "claims": [
                    "order-management-development-methods-model-claim-2"
                  ],
                  "nodes": [
                    "order-management-development-methods-model-node-1",
                    "order-management-development-methods-model-node-2",
                    "order-management-development-methods-model-node-3",
                    "order-management-development-methods-model-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-model-relation-1",
                    "order-management-development-methods-model-relation-2",
                    "order-management-development-methods-model-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-model-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-model-paragraph-3",
                "kind": "paragraph",
                "text": "AI uses A to propose CML for order identity and state, approval and the reservation condition. A human approves the distinction and assigns ownership of stock mutations. Cozy generates the derivable structure. Missing policies and external shipping integration are identified and implemented explicitly.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-model"
                  ],
                  "claims": [
                    "order-management-development-methods-model-claim-3"
                  ],
                  "nodes": [
                    "order-management-development-methods-model-node-1",
                    "order-management-development-methods-model-node-2",
                    "order-management-development-methods-model-node-3",
                    "order-management-development-methods-model-node-4"
                  ],
                  "relations": [
                    "order-management-development-methods-model-relation-1",
                    "order-management-development-methods-model-relation-2",
                    "order-management-development-methods-model-relation-3"
                  ],
                  "flows": [
                    "order-management-development-methods-model-flow"
                  ]
                }
              },
              {
                "id": "order-management-development-methods-model-paragraph-4",
                "kind": "paragraph",
                "text": "Retain the literate rationale, CML, CAR versions and contracts, supplemental code, acceptance cases and execution results for A. When replacing a component, rerun the short-stock input and inspect its response. CAR format, access checks and the business execution supply distinct evidence.",
                "coreRefs": {
                  "steps": [
                    "order-management-development-methods-model"
                  ],
                  "claims": [
                    "order-management-development-methods-model-claim-4"
                  ],
                  "nodes": [
